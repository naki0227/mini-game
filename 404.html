<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ページが見つかりません｜あそび横丁</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root { --bg: #f1e7d3; --fg: #2a1c12; --muted: #6d5a48; --noren: #24375a; --noren-ink: #f3ead8; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #141b2b; --fg: #f1e7d3; --muted: #a99c88; --noren: #3b5688; --noren-ink: #f6eedd; color-scheme: dark; } }
body {
  margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 16px; text-align: center;
  background: var(--bg); color: var(--fg); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  padding: 24px max(16px, env(safe-area-inset-left, 0px));
}
h1 { margin: 0; font-family: "Dela Gothic One", "Hiragino Sans", sans-serif; font-weight: 400; font-size: 40px; }
p { margin: 0; color: var(--muted); }
a { justify-self: center; background: var(--noren); color: var(--noren-ink); text-decoration: none; font-weight: 700; border-radius: 8px; padding: 12px 20px; }
a:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
</style>
</head>
<body>
<h1>この屋台はありません</h1>
<p>URLが間違っているか、店じまいしたページです。</p>
<a href="/">あそび横丁のトップへ</a>
</body>
</html>
