<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あそび横丁</title>
<meta name="description" content="ログインなし・インストールなし。ブラウザですぐ遊べるミニゲームの横丁。記録はあなたのブラウザにだけ残ります。">
<meta property="og:type" content="website">
<meta property="og:title" content="あそび横丁">
<meta property="og:description" content="ブラウザですぐ遊べるミニゲームの横丁。">
<meta property="og:url" content="https://asobi.enludus.com/">
<meta property="og:image" content="https://asobi.enludus.com/games/nigiri/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: an alley — a lantern-lit sign at the top, then a row of stalls (one card per game, each under its own noren) */
:root {
  --bg: #f1e7d3;        /* plaster wall by day */
  --bg-2: #e6d8bd;
  --fg: #2a1c12;
  --muted: #6d5a48;
  --stall: #fbf7ee;
  --line: #d6c4a3;
  --lantern: #c4452f;
  --noren: #24375a;
  --noren-ink: #f3ead8;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141b2b; --bg-2: #1c2539; --fg: #f1e7d3; --muted: #a99c88;
    --stall: #222c42; --line: #33405c; --lantern: #e2694f; --noren: #3b5688; --noren-ink: #f6eedd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141b2b; --bg-2: #1c2539; --fg: #f1e7d3; --muted: #a99c88;
  --stall: #222c42; --line: #33405c; --lantern: #e2694f; --noren: #3b5688; --noren-ink: #f6eedd;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
}
.wrap {
  max-width: 960px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
  display: grid; gap: 40px;
}

/* sign */
header { display: grid; gap: 12px; justify-items: start; }
.lanterns { display: flex; gap: 10px; }
.lanterns i {
  width: 22px; height: 30px; border-radius: 45% / 40%; background: var(--lantern);
  box-shadow: 0 0 18px color-mix(in srgb, var(--lantern) 55%, transparent);
  position: relative;
}
.lanterns i::before, .lanterns i::after { content: ""; position: absolute; left: 4px; right: 4px; height: 3px; background: var(--fg); opacity: .8; }
.lanterns i::before { top: -2px; } .lanterns i::after { bottom: -2px; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(44px, 10vw, 76px); line-height: 1.05; letter-spacing: .02em; text-wrap: balance;
}
.tagline { margin: 0; max-width: 34em; color: var(--muted); }
.rules { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 4px 0 0; list-style: none; }
.rules li { font-size: 12px; letter-spacing: .08em; border: 1px solid var(--line); border-radius: 99px; padding: 2px 12px; }

/* stalls */
.stalls { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 20px; }
.stall {
  background: var(--stall); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  display: grid; grid-template-rows: auto auto 1fr; color: inherit; text-decoration: none;
  transition: transform .15s ease, box-shadow .15s ease;
}
a.stall:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.14); }
a.stall:focus-visible { outline: 3px solid #e0a43a; outline-offset: 3px; }
.noren { display: flex; gap: 3px; background: var(--noren); padding-top: 10px; }
.noren span {
  flex: 1; text-align: center; color: var(--noren-ink); background: var(--noren);
  font-family: var(--font-display); font-size: 22px; line-height: 1; padding-block: 4px 10px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.25);
}
.thumb { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; max-width: 100%; object-fit: cover; background: var(--bg-2); }
.info { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
.eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.info h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.info p { margin: 0; font-size: 14px; color: var(--muted); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.best { font-size: 13px; font-variant-numeric: tabular-nums; }
.best b { font-size: 16px; }
.play { font-weight: 700; font-size: 14px; background: var(--noren); color: var(--noren-ink); border-radius: 6px; padding: 6px 14px; }

.stall.soon { border-style: dashed; background: transparent; place-content: center; text-align: center; min-height: 260px; padding: 24px; }
.stall.soon .eyebrow { margin-bottom: 6px; }
.stall.soon h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--muted); }

footer { font-size: 12px; color: var(--muted); display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 16px; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { a.stall { transition: none; } a.stall:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lanterns" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>あそび横丁</h1>
    <p class="tagline">ちょっとした待ち時間に、ブラウザでそのまま遊べるミニゲームを一軒ずつ出していく横丁です。</p>
    <ul class="rules">
      <li>ログインなし</li><li>インストールなし</li><li>記録はこのブラウザにだけ保存</li>
    </ul>
  </header>

  <main class="stalls" id="stalls"></main>

  <footer>
    <span>記録は端末のブラウザ（localStorage）に保存されます。シークレットモードや閲覧データの削除で消えます。</span>
    <span><a href="https://github.com/naki0227/mini-game">github.com/naki0227/mini-game</a></span>
  </footer>
</div>

<script>
// 新しいゲームはここに1行足すだけでハブに並ぶ
const GAMES = [
  {
    no: 1, id: 'nigiri', title: 'にぎり積み', noren: ['に', 'ぎ', 'り', '積', 'み'],
    desc: '揺れる箸からお寿司を一貫ずつ落として、どこまで高く積めるか。',
    href: '/games/nigiri/', thumb: '/games/nigiri/thumb.png',
    storageKey: 'nigiri-tsumi:v1', best: d => d.best ? `<b>${d.best}</b> 貫・${(+d.bestCm).toFixed(1)}cm` : null,
  },
  {
    no: 2, id: 'omikuji', title: '連打おみくじ', noren: ['お', 'み', 'く', 'じ'],
    desc: 'ワンポチで何回でも引ける。大吉は何連続まで出る？',
    href: '/games/omikuji/', thumb: '/games/omikuji/thumb.png',
    storageKey: 'omikuji:v1',
    best: d => d.total ? `<b>${d.total}</b> 回・大吉${d.bestStreak || 0}連続・帳${Object.values(d.counts || {}).filter(v => v > 0).length}/9` : null,
  },
  {
    no: 3, id: 'oyu', title: 'お湯ぴったり', noren: ['お', '湯', 'ぴっ', 'た', 'り'],
    desc: '長押しで注いで、カップ麺の線までぴったり。何杯いける？',
    href: '/games/oyu/', thumb: '/games/oyu/thumb.png',
    storageKey: 'oyu:v1', best: d => d.best ? `<b>${d.best}</b> 点・${d.bestCups}杯・ぴったり${d.bestPerfect}回` : null,
  },
  {
    no: 4, id: 'daruma', title: 'だるまさんがころんだ', noren: ['だ', 'る', 'ま', 'さ', 'ん'],
    desc: '押して進む、離して止まる。振り向く鬼に見つかるな。',
    href: '/games/daruma/', thumb: '/games/daruma/thumb.png',
    storageKey: 'daruma:v1', best: d => d.best ? `<b>${d.best}</b> 人抜き・${(+d.bestTime).toFixed(1)}秒` : null,
  },
  {
    no: 5, id: 'hanko', title: 'ハンコ押し', noren: ['ハ', 'ン', 'コ', '押', 'し'],
    desc: '流れてくる書類にハンコをポン。60秒で何枚さばける？',
    href: '/games/hanko/', thumb: '/games/hanko/thumb.png',
    storageKey: 'hanko:v1', best: d => d.best ? `<b>${d.best}</b> 点・${d.bestDocs}枚・${d.bestCombo}コンボ` : null,
  },
  {
    no: 6, id: 'hanger', title: 'ハンガー投げ', noren: ['ハ', 'ン', 'ガ', 'ー', '投げ'],
    desc: '引っ張って離して、ハンガーを竿に引っ掛けろ。',
    href: '/games/hanger/', thumb: '/games/hanger/thumb.png',
    storageKey: 'hanger:v1', best: d => d.best ? `<b>${d.best}</b> 点・${d.bestHung}/10本・最長${(+d.bestDist).toFixed(1)}m` : null,
  },
  {
    no: 7, id: 'bound', title: '台所ピンボール', noren: ['台', '所', 'ピン', 'ボー', 'ル'],
    desc: '道具を置いて、いつも同じに飛ぶ玉を湯呑みへ。',
    href: '/games/bound/', thumb: '/games/bound/thumb.png',
    storageKey: 'bound:v1', best: d => d.maxCleared ? `<b>${d.maxCleared}</b> 面クリア・★${d.totalStars || 0}/45` : null,
  },
  {
    no: 8, id: 'catch', title: 'ハンガーキャッチ', noren: ['ハ', 'ン', 'ガ', 'ー', 'キャッチ'],
    desc: '奥から投げて竿に掛けろ。外すまで何本連続でかけられる？',
    href: '/games/catch/', thumb: '/games/catch/thumb.png',
    storageKey: 'catch:v1', best: d => d.ver === 2 && d.bestChain ? `最高 <b>${d.bestChain}</b> 本連続・初ヒット最少${d.best}回目` : null,
  },
  {
    no: 9, id: 'ten', title: 'ぴったり10秒', noren: ['ぴっ', 'た', 'り', '10', '秒'],
    desc: '数字が消えたストップウォッチ、10.00秒で止められる？',
    href: '/games/ten/', thumb: '/games/ten/thumb.png',
    storageKey: 'ten:v1', best: d => d.plays ? `最小誤差 <b>${d.best && d.best.normal != null ? d.best.normal.toFixed(2) : '—'}</b> 秒${d.best && d.best.honki != null ? `・本気${d.best.honki.toFixed(2)}` : ''}・ぴったり${d.perfects || 0}回` : null,
  },
  {
    no: 10, id: 'takoyaki', title: 'たこ焼き返し', noren: ['たこ', '焼', 'き', '返', 'し'],
    desc: '生地を注いで、ピンで切って、押し込みながら返す。一舟をじっくり3Dで。',
    href: '/games/takoyaki/', thumb: '/games/takoyaki/thumb.png',
    storageKey: 'takoyaki:v1', best: d => d.ver === 3 && d.top ? `<b>${d.top}</b> 点・『${d.rankName}』・${d.made}舟` : null,
  },
  {
    no: 11, id: 'flip', title: 'ボトルフリップ', noren: ['ボ', 'ト', 'ル', 'フリ', 'ップ'],
    desc: '水入りボトルをくるっと投げて、何連続で立てられる？',
    href: '/games/flip/', thumb: '/games/flip/thumb.png',
    storageKey: 'flip:v1', best: d => d.best ? `<b>${d.best}</b> 連続・通算${d.total}回` : null,
  },
  {
    no: 12, id: 'plane', title: '紙飛行機', noren: ['紙', '飛', '行', '機'],
    desc: '夕焼けの屋上から、紙飛行機を何m飛ばせる？',
    href: '/games/plane/', thumb: '/games/plane/thumb.png',
    storageKey: 'plane:v1', best: d => d.best ? `<b>${(+d.best).toFixed(1)}</b> m・${({ heso: 'へそ', yari: 'やり', ika: 'イカ' })[d.bestFold] || ''}飛行機・${d.throws}投` : null,
  },
  {
    no: 13, id: 'mizukiri', title: '水切り', noren: ['み', 'ず', 'き', 'り'],
    desc: '朝もやの湖で、石を何回跳ねさせられる？',
    href: '/games/mizukiri/', thumb: '/games/mizukiri/thumb.png',
    storageKey: 'mizukiri:v1', best: d => d.throws ? `<b>${d.best}</b> 回・${(+d.bestDist).toFixed(1)}m・${d.throws}投` : null,
  },
  {
    no: 14, id: 'kutsu', title: '靴飛ばし', noren: ['靴', '飛', 'ば', 'し'],
    desc: 'ブランコをこいで、靴をどこまで飛ばせるか。明日の天気も占える。',
    href: '/games/kutsu/', thumb: '/games/kutsu/thumb.png',
    storageKey: 'kutsu:v1', best: d => d.plays ? `<b>${(+d.best).toFixed(1)}</b> m・${d.plays}回` : null,
  },
  {
    no: 15, id: 'otoshi', title: 'だるま落とし', noren: ['だ', 'る', 'ま', '落', 'とし'],
    desc: '木づちで胴を1段ずつスコーン。頭を落とさず何段ぬける？',
    href: '/games/otoshi/', thumb: '/games/otoshi/thumb.png',
    storageKey: 'otoshi:v1', best: d => d.plays ? `<b>${d.best}</b> 段・${d.plays}回` : null,
  },
  {
    no: 16, id: 'kendama', title: 'けん玉 もしかめ', noren: ['け', 'ん', '玉', 'もし', 'かめ'],
    desc: '大皿⇔中皿へ交互にポン。もしもしかめ何回つづく？',
    href: '/games/kendama/', thumb: '/games/kendama/thumb.png',
    storageKey: 'kendama:v1', best: d => d.plays ? `<b>${d.best}</b> 回・総回数${d.total}回` : null,
  },
  {
    no: 17, id: 'wanage', title: '輪投げ', noren: ['輪', '投', 'げ', '屋', '台'],
    desc: '縁日の輪投げ。外すまで何本連続で棒に入る？景品も集まる。',
    href: '/games/wanage/', thumb: '/games/wanage/thumb.png',
    storageKey: 'wanage:v1', best: d => d.plays ? `<b>${d.best}</b> 本連続・総${d.total}本・景品${Object.values(d.prizes || {}).filter(v => v > 0).length}/12種` : null,
  },
  {
    no: 18, id: 'sara', title: '皿回し', noren: ['皿', '回', 'し', '寄', '席'],
    desc: '指でくるくる、皿を回しつづける。何枚を何秒？',
    href: '/games/sara/', thumb: '/games/sara/thumb.png',
    storageKey: 'sara:v1', best: d => d.plays ? `<b>${d.best >= 60 ? Math.floor(d.best / 60) + '分' + String(Math.floor(d.best % 60)).padStart(2, '0') + '秒' : Math.floor(d.best) + '秒'}</b>・最多${d.bestPlates}枚・${d.plays}回` : null,
  },
  {
    no: 19, id: 'taketombo', title: '竹とんぼ', noren: ['竹', 'と', 'ん', 'ぼ', '高く'],
    desc: '両手でこすって、はなす。どこまで高く上がる？',
    href: '/games/taketombo/', thumb: '/games/taketombo/thumb.png',
    storageKey: 'taketombo:v1', best: d => d.plays ? `<b>${d.best.toFixed(1)}</b> m・${d.plays}回` : null,
  },
  {
    no: 20, id: 'yukidaruma', title: '雪だるま転がし', noren: ['雪', 'だ', 'る', 'ま', '転がし'],
    desc: '雪玉を押して転がし、割らずにどこまで大きく？',
    href: '/games/yukidaruma/', thumb: '/games/yukidaruma/thumb.png',
    storageKey: 'yukidaruma:v1', best: d => d.plays ? `<b>${d.best}</b> cm・${d.plays}回` : null,
  },
];
const NEXT_SLOTS = 1;

function readBest(g) {
  try { const d = JSON.parse(localStorage.getItem(g.storageKey) || 'null'); return d ? g.best(d) : null; } catch { return null; }
}
const ord = n => ['第一弾', '第二弾', '第三弾', '第四弾', '第五弾', '第六弾', '第七弾', '第八弾', '第九弾', '第十弾'][n - 1] || `第${n}弾`;
const root = document.getElementById('stalls');
root.innerHTML = GAMES.map(g => {
  const best = readBest(g);
  return `<a class="stall" href="${g.href}">
    <div class="noren" aria-hidden="true">${g.noren.map(c => `<span>${c}</span>`).join('')}</div>
    <img class="thumb" src="${g.thumb}" alt="" width="640" height="480" loading="lazy">
    <div class="info">
      <span class="eyebrow">${ord(g.no)}</span>
      <h2>${g.title}</h2>
      <p>${g.desc}</p>
      <div class="foot"><span class="best">${best ? `あなたの最高 ${best}` : 'まだ遊んでいません'}</span><span class="play">遊ぶ</span></div>
    </div>
  </a>`;
}).join('') + Array.from({ length: NEXT_SLOTS }, (_, i) => `<div class="stall soon">
    <span class="eyebrow">${ord(GAMES.length + i + 1)}</span><h2>仕込み中</h2>
  </div>`).join('');
</script>
</body>
</html>
