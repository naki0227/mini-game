<style>
/* Layout: an alley — a lantern-lit sign at the top, then a row of stalls (one card per game, each under its own noren) */
:root {
  --bg: #f1e7d3;        /* plaster wall by day */
  --bg-2: #e6d8bd;
  --fg: #2a1c12;
  --muted: #6d5a48;
  --stall: #fbf7ee;
  --line: #d6c4a3;
  --lantern: #c4452f;
  --noren: #24375a;
  --noren-ink: #f3ead8;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141b2b; --bg-2: #1c2539; --fg: #f1e7d3; --muted: #a99c88;
    --stall: #222c42; --line: #33405c; --lantern: #e2694f; --noren: #3b5688; --noren-ink: #f6eedd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141b2b; --bg-2: #1c2539; --fg: #f1e7d3; --muted: #a99c88;
  --stall: #222c42; --line: #33405c; --lantern: #e2694f; --noren: #3b5688; --noren-ink: #f6eedd;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
}
.wrap {
  max-width: 960px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
  display: grid; gap: 40px;
}

/* sign */
header { display: grid; gap: 12px; justify-items: start; }
.lanterns { display: flex; gap: 10px; }
.lanterns i {
  width: 22px; height: 30px; border-radius: 45% / 40%; background: var(--lantern);
  box-shadow: 0 0 18px color-mix(in srgb, var(--lantern) 55%, transparent);
  position: relative;
}
.lanterns i::before, .lanterns i::after { content: ""; position: absolute; left: 4px; right: 4px; height: 3px; background: var(--fg); opacity: .8; }
.lanterns i::before { top: -2px; } .lanterns i::after { bottom: -2px; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(44px, 10vw, 76px); line-height: 1.05; letter-spacing: .02em; text-wrap: balance;
}
.tagline { margin: 0; max-width: 34em; color: var(--muted); }
.rules { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 4px 0 0; list-style: none; }
.rules li { font-size: 12px; letter-spacing: .08em; border: 1px solid var(--line); border-radius: 99px; padding: 2px 12px; }

/* stalls */
.stalls { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 20px; }
.stall {
  background: var(--stall); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  display: grid; grid-template-rows: auto auto 1fr; color: inherit; text-decoration: none;
  transition: transform .15s ease, box-shadow .15s ease;
}
a.stall:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.14); }
a.stall:focus-visible { outline: 3px solid #e0a43a; outline-offset: 3px; }
.noren { display: flex; gap: 3px; background: var(--noren); padding-top: 10px; }
.noren span {
  flex: 1; text-align: center; color: var(--noren-ink); background: var(--noren);
  font-family: var(--font-display); font-size: 22px; line-height: 1; padding-block: 4px 10px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.25);
}
.thumb { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; max-width: 100%; object-fit: cover; background: var(--bg-2); }
.info { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
.eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.info h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.info p { margin: 0; font-size: 14px; color: var(--muted); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.best { font-size: 13px; font-variant-numeric: tabular-nums; }
.best b { font-size: 16px; }
.play { font-weight: 700; font-size: 14px; background: var(--noren); color: var(--noren-ink); border-radius: 6px; padding: 6px 14px; }

.stall.soon { border-style: dashed; background: transparent; place-content: center; text-align: center; min-height: 260px; padding: 24px; }
.stall.soon .eyebrow { margin-bottom: 6px; }
.stall.soon h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--muted); }

footer { font-size: 12px; color: var(--muted); display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 16px; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { a.stall { transition: none; } a.stall:hover { transform: none; } }
</style>

    storageKey: 'wamawashi:v1', best: d => d.plays ? `<b>${(+d.best || 0).toFixed(1)}</b> m 転がした・${d.plays}回` : null,
  },
  {
    no: 76, id: 'trumptower', title: 'トランプタワー', noren: ['ト', 'ラ', 'ン', 'プ', '塔'],
    desc: '立てかけて、渡して、そっと。雨の日のこたつでトランプ、何段積める？',
    href: '/games/trumptower/', thumb: '/games/trumptower/thumb.png',
    storageKey: 'trumptower:v1', best: d => d.plays ? `<b>${d.best || 0}</b> 段 積めた・${d.plays}回` : null,
  },
  {
    no: 77, id: 'shuriken', title: '手裏剣投げ', noren: ['手', '裏', '剣', '投', 'げ'],
    desc: 'ためて、回して、とすっ。縁日の境内で折り紙の手裏剣、何連続命中？',
    href: '/games/shuriken/', thumb: '/games/shuriken/thumb.png',
    storageKey: 'shuriken:v1', best: d => d.plays ? `<b>${d.best || 0}</b> 連続 命中・${d.plays}回` : null,
  },
  {
    no: 78, id: 'mametsukami', title: '豆つかみ', noren: ['ま', 'め', 'つ', 'か', 'み'],
    desc: 'お箸でつまんで、となりの小皿へ。豆・ビー玉・こんにゃく、落とさず何粒？',
    href: '/games/mametsukami/', thumb: '/games/mametsukami/thumb.png',
    storageKey: 'mametsukami:v1', best: d => d.plays ? `<b>${d.best || 0}</b> 粒 移せた・${d.plays}回` : null,
  },
];
const NEXT_SLOTS = 1;

function readBest(g) {
  try { const d = JSON.parse(localStorage.getItem(g.storageKey) || 'null'); return d ? g.best(d) : null; } catch { return null; }
}
const ord = n => ['第一弾', '第二弾', '第三弾', '第四弾', '第五弾', '第六弾', '第七弾', '第八弾', '第九弾', '第十弾'][n - 1] || `第${n}弾`;
const root = document.getElementById('stalls');
root.innerHTML = GAMES.map(g => {
  const best = readBest(g);
  return `<a class="stall" href="${g.href}">
    <div class="noren" aria-hidden="true">${g.noren.map(c => `<span>${c}</span>`).join('')}</div>
    <img class="thumb" src="${g.thumb}" alt="" width="640" height="480" loading="lazy">
    <div class="info">
      <span class="eyebrow">${ord(g.no)}</span>
      <h2>${g.title}</h2>
      <p>${g.desc}</p>
      <div class="foot"><span class="best">${best ? `あなたの最高 ${best}` : 'まだ遊んでいません'}</span><span class="play">遊ぶ</span></div>
    </div>
  </a>`;
}).join('') + Array.from({ length: NEXT_SLOTS }, (_, i) => `<div class="stall soon">
    <span class="eyebrow">${ord(GAMES.length + i + 1)}</span><h2>仕込み中</h2>
  </div>`).join('');
</script>
</body>
</html>
