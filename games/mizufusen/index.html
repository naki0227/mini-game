<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try { THREE = await import(THREE_URL); } catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 水風船の物理（three には頼らない） ----------
   長さは m、時間は秒。y が上。自分は z = 0 に立ち、奥（−z）を向く。友だちは z = −D に立ち、こちら（+z）を向く。
   水風船: 「膜と、膜といっしょに動く水（質量 m1）」と「中で揺れる水（m2）」の2つの質点を、ばね（揺れ WS rad/s・減衰 ZS）でつないだもの。
     重力と空気抵抗 −KD|v−風|(v−風)。手や地面に触れると、膜が つぶれた深さ δ に応じて押し返す（K δ (1+(δ/(KBN R))²) + 減衰）。
     押し返す力 F が膜の張力 T = F /(2πR) になり、大きさごとの限界 TC を超えると割れる。大きい風船ほど限界が低い（もともと張っている）。
   手: 両手を合わせたお椀（曲率半径 RB、ふちまで CAP）。腕は「ばね＋減衰」で手を構えの位置へ引く質点（MH）。
     ふだんは腕に力が入って硬い（KST）。指を下へ引くと「手を引く」: 硬さが KSO までやわらぎ（T_SOFT 秒）、手の目標が
     飛んでくる向きへ L（引いた量で決まる）だけ動く。やわらかい手で、ちょうど落ちてくる瞬間に手が逃げていれば、膜はあまり つぶれない。
     引かずに受けたり、早すぎて手が硬く戻ってから受けると、強く当たって割れる。引きすぎると 手が地面まで下がって こぼす。
   相手（友だち）も 同じ手で受ける（受けるタイミングと引く量には少しずれがある）。強すぎる球は 受けきれずに割れる。
   1/1000 秒きざみ。入力は時刻つき（画面のコマには よらない）。 */
const DEGR = Math.PI / 180;
const PH = {
  G: 9.8, DT: 1 / 1000,
  SIZES: [
    { key: 's', name: '小', R: 0.047, TC: 440 },
    { key: 'm', name: '中', R: 0.056, TC: 400 },
    { key: 'l', name: '大', R: 0.067, TC: 430 },
  ],
  M1F: 0.45, WS: 26, ZS: 0.12,            // 膜といっしょに動く水の割合、中の水の揺れ
  KB: 1800, KBN: 0.3, ZB: 0.6, KG: 3200,   // 膜のつぶれのばね（N/m）、非線形、減衰比、地面
  KD: 0.012,                               // 空気抵抗（1/m）
  MH: 0.08, KST: 4500, ZST: 1.0, KSO: 140, ZSO: 0.8, T_SOFT: 0.42, T_RAMP: 0.22, TAU_P: 0.075, BACK: 0.35, RET: 0.38, RET_K: 0.45,
  LP0: 0.18, LP_K: 3.0, LP_MAX: 1.2, Y_MIN: 0.1,
  RB: 0.17, CAP: 62 * DEGR, MU: 0.7, CT: 6,
  Y_READY: 1.0, REACH: 0.42, ARM_X: 0.44, ARMV: 3.6,
  RUN: 2.8, RUN_A: 14, STEP_V: 2.0, MX: 2.4, Z_DEAD: 0.25,
  D0: 2.4,
  O_RUN: 3.0, O_A: 14, O_REACT: 0.22, O_TSD: 0.025, O_ASD: 0.05,
  EL: 44 * DEGR, TH_T: 0.04, S0: 2.6, SK: 21, SMAX: 17, YAWK: 0.55,
  PULL_TH: 0.035,
  SETTLE: 0.14, HOLD_MAX: 10, WAIT_T: 1.0, OPHOLD_T: 0.55, BACK_V: 1.5, KEY_V: 2.4,
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const lerpP = (a, b, k) => a + (b - a) * k;
// 回数による難しさ: 距離（1回ごとに1歩さがる）・相手の投げのずれ・風・大きい風船の出やすさ。上限は決めず、ゆっくり上がりつづける
function diffOf(n) {
  const k = 1 - Math.exp(-n / 24);
  return {
    D: (n === 0 ? -0.3 : 0) + PH.D0 + 5.2 * (1 - Math.exp(-n / 20)) + 0.02 * n,
    off: 0.03 + 0.2 * k + 0.002 * n, offz: 0.06 + 0.3 * k,
    ang: (n === 0 ? 60 : 54 - 8 * k) * DEGR,
    wind: n < 3 ? 0 : 0.4 + 2.4 * k + 0.012 * n,
    pS: n === 0 ? 0 : n < 2 ? 1 : 0.15 + 0.55 * (1 - k), pL: n < 2 ? 0 : 0.05 + 0.3 * k,
  };
}
// 入力は時刻つきで入れる（画面のコマとは関係なく、物理はその時刻で効く）
function gInput(g, t, type, a = 0, b = 0) { const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, { t, type, a, b }); }
function makeBalloon(sz, x, y, z) {
  const S = PH.SIZES[sz], R = S.R, m = 1000 * 4 / 3 * Math.PI * R ** 3 * 0.92, m1 = m * PH.M1F, m2 = m - m1;
  return {
    sz, R, m, m1, m2, ks: m2 * PH.WS ** 2, cs: 2 * PH.ZS * m2 * PH.WS, TC: S.TC,
    x, y, z, vx: 0, vy: 0, vz: 0, x2: x, y2: y, z2: z, v2x: 0, v2y: 0, v2z: 0,
    T: 0, Tmax: 0, burst: false, dl: 0, nx: 0, ny: 1, nz: 0, touch: null, touchT: 0, calmT: 0, ground: false, held: null, hx: 0, hy: 0, hz: 0,
    firstTouch: null,
  };
}
function makeHands(face, x, z) {
  // face: −1 = 自分（−z を向く）、+1 = 相手（+z を向く）
  const bz = z - face * -1 * 0 + (face < 0 ? -PH.REACH : PH.REACH);
  return { face, x, y: PH.Y_READY, z: bz, vx: 0, vy: 0, vz: 0, bx: x, by: PH.Y_READY, bz, bvx: 0, bvz: 0, pull: null, soft: 0, F: 0 };
}
function makeGame(seed = 1) {
  const r = mulberry((seed * 2654435761) >>> 0);
  const d0 = diffOf(0);
  const g = {
    seed, rnd: r, t: 0, queue: [], events: [], kdir: 0,
    phase: 'wait', dir: 'me', n: 0, opN: 0, fail: null, failSub: null, throwAt: PH.WAIT_T + 0.3, holdT: 0, phaseT: 0,
    D: d0.D, Dgoal: d0.D,
    wPh1: r() * 6.283, wPh2: r() * 6.283, wPh3: r() * 6.283, wDir: r() < 0.5 ? -1 : 1, wAmp: 0,
    // 自分
    bx: 0, bz: 0, bvx: 0, bvz: 0, fx: 0,
    me: makeHands(-1, 0, 0),
    // 相手
    ox: 0, oz: -d0.D, ovx: 0, ovz: 0, otx: 0, otz: -d0.D,
    op: makeHands(1, 0, -d0.D), opPlan: null,
    b: null, pred: null, opPred: null, lastThrow: null, lastCatch: null, pullsThis: 0, lastPull: null, missNear: 9,
  };
  g.b = newBalloonFor(g, 0);
  holdIn(g, g.b, g.op);
  return g;
}
function newBalloonFor(g, n) {
  const d = diffOf(n), r = g.rnd(), sz = r < d.pS ? 0 : r < d.pS + d.pL ? 2 : 1;
  return makeBalloon(sz, g.op.x, g.op.y + 0.1, g.op.z);
}
function holdIn(g, B, h) {
  B.held = h; B.hx = 0; B.hy = B.R * 0.9; B.hz = 0;
  B.x = h.x; B.y = h.y + B.hy; B.z = h.z; B.x2 = B.x; B.y2 = B.y; B.z2 = B.z;
  B.vx = B.vy = B.vz = B.v2x = B.v2y = B.v2z = 0;
}
// 風（横向きが主。時間でゆっくり強弱）
let WX = 0, WZ = 0;
function windAt(g, t, k = 1) {
  const f = 0.6 + 0.28 * Math.sin(0.57 * t + g.wPh1) + 0.12 * Math.sin(1.61 * t + g.wPh2);
  const side = clampP(Math.sin(0.045 * t + g.wPh3) * 1.3, -1, 1);
  const a = g.wAmp * f * k;
  WX = a * g.wDir * side; WZ = a * 0.25 * Math.sin(0.2 * t + g.wPh2);
}
// お椀（両手）と風船の接触。風船 m1 にかかる力を acc に足し、手にかかる力を h.F* に足す。返り値は押す力の大きさ
function bowlContact(B, h, acc) {
  const ox = h.x, oy = h.y + PH.RB, oz = h.z;
  const rx = B.x - ox, ry = B.y - oy, rz = B.z - oz, L = Math.hypot(rx, ry, rz);
  if (L < 1e-6 || -ry / L < Math.cos(PH.CAP)) { h.cin = false; return 0; }

// 受ける「ぽよん」: 低めのサインが ゆれながら下がる（ゴムと水）
function sPoyon(k = 1, sz = 1) {
  try {
    if (!live()) return; const n0 = ac.currentTime, f0 = [330, 290, 250][sz] || 290;
    const o = tone(f0, n0, 0.32, 0.2 * k, 'sine', f0 * 0.55);
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 13; lg.gain.value = f0 * 0.08;
    lfo.connect(lg).connect(o.frequency); lfo.start(n0); lfo.stop(n0 + 0.36);
    tone(f0 * 1.5, n0 + 0.01, 0.12, 0.04 * k, 'sine', f0 * 0.9);
    noise(n0, 0.06, 0.07 * k, 'lowpass', 320, 0.7, 500);
  } catch {}
}
// 割れる「ばしゃっ」: 低いノイズをこもらせて。高い破裂音は入れない
function sSplash(k = 1) {
  try {
    if (!live()) return; const n0 = ac.currentTime;
    const f = noise(n0, 0.5, 0.32 * k, 'bandpass', 620, 0.6, 950, 0.006); f.frequency.exponentialRampToValueAtTime(300, n0 + 0.45);
    noise(n0 + 0.02, 0.8, 0.18 * k, 'lowpass', 380, 0.5, 450, 0.03);
    tone(110, n0, 0.22, 0.18 * k, 'sine', 55);
    for (let i = 0; i < 4; i++) { const t = n0 + 0.3 + i * 0.13 + Math.random() * 0.06; tone(380 + Math.random() * 220, t, 0.07, 0.025 * k, 'sine', 300); }
  } catch {}
}
function sToss(k = 1) { try { if (!live()) return; const n0 = ac.currentTime, f = noise(n0, 0.2, 0.05 * k, 'bandpass', 320, 1.1, 800, 0.03); f.frequency.exponentialRampToValueAtTime(640, n0 + 0.18); } catch {} }
function sPull() { try { if (!live()) return; const n0 = ac.currentTime, f = noise(n0, 0.12, 0.03, 'bandpass', 420, 1, 700, 0.02); f.frequency.exponentialRampToValueAtTime(220, n0 + 0.11); } catch {} }
function sLand() { try { if (!live()) return; const n0 = ac.currentTime; tone(150, n0, 0.16, 0.12, 'sine', 70); noise(n0, 0.08, 0.08, 'lowpass', 300, 0.7, 400); } catch {} }
function sChime(big) { try { if (!live()) return; const n0 = ac.currentTime + 0.1; const seq = big ? [[392, 0], [523, 0.1], [659, 0.2], [784, 0.32]] : [[392, 0], [523, 0.1], [659, 0.2]]; seq.forEach(([f, t]) => tone(f, n0 + t, 0.45, 0.05)); } catch {} }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  step(dt);
  render(Math.max(dt, 1 / 240));
  requestAnimationFrame(frame);
}

/* ---------- 入力: 指の横位置＝手の位置。下へ引く量＝手を引く（クッション）。上へはじいた長さ・横ずれ＝投げ返す強さ・向き ----------
   どれも「指が動いた量」と「その時刻」で決まる（動かす速さは関係ない）。時刻つきで物理へ */
const UPJ = 1.5;
const KB_T = 1.1;
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(nextSeed(), bn); frozen = false; setMileLevel(0); keyDir = { l: false, r: false }; bigSeen = rec.plays > 3 ? 2 : 0;
  for (const l of lanterns) l.on = 0;
  updateHud();
  // #debug&skip=秒: はじめにその秒数だけ一気に進め、水風船が自分の手に落ちてくる直前で止める（OGP 撮影・確認用。bot=good と組み合わせる。freeze=1 で止めたまま）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'incoming');
  if (HASH.has('debug') && HASH.get('ff') === '1') ff = true;
}
// pose=incoming: 指定の秒数のあと、こちらへ飛んでくる水風船が手に触れる before 秒前まで進める
function skipTo(t1, pose = 'none') {
  const quiet = state; state = 'skip';
  const lim = t1 + 60, before = +(HASH.get('before') || 0.14);
  let armed = false;
  while (game.phase !== 'over' && game.t < lim) {
    if (game.t >= t1) {
      if (pose !== 'incoming') break;
      const inc = game.phase === 'fly' && game.dir === 'me' && game.pred;
      if (inc && game.pred.t - game.t > before + 0.05) armed = true;
      if (armed && inc && game.pred.t - game.t <= before) break;
    }
    if (bot) bot.step(); stepGame(game);
    if (game.events.length) handleEvents();
  }
  state = quiet;
  pops = []; failAt = game.phase === 'over' ? tt : -1; shake = 0; speech = null; soak = null; flash = 0; catchFx = null;
  setMileLevel(MILES.filter(m => m <= game.n).length);
  for (const l of lanterns) l.on = l.want;
  if (game.phase === 'fly') jig.t0 = tt - (game.t - game.phaseT);
  base = performance.now() / 1000 - game.t;
  if (HASH.get('freeze') === '1') frozen = true;
}
// 指の動きを1点ずつ読む（下への連続した移動量・上への連続した移動量）
function gesPoint(x, y, t) {
  const G = ges;
  if (y < G.y - UPJ || y < G.topY) G.topY = y;
  if (y > G.y + UPJ || y > G.botY) { G.botY = y; G.botX = x; }
  G.x = x; G.y = y;
  if (!game || state !== 'play' || bot) return;
  const down = (y - G.topY) / H;
  if (!G.pulled && down >= PH.PULL_TH) { G.pulled = true; G.pullA = down; G.pullBot = y; input('pull', t, down); }
  else if (G.pulled) {
    if (y > G.pullBot) G.pullBot = y;
    if (down > G.pullA + 0.012) { G.pullA = down; input('pullmore', t, down); }
    if ((G.pullBot - y) / H > 0.03) { G.pulled = false; G.topY = y; }   // 戻した: もう一度引ける
  }
}
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game) return;
  if (game.phase === 'over') { if (failAt >= 0 && tt - failAt > 0.4) showOver(); return; }
  if (bot) return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  kb = null;
  ges = { id: e.pointerId, down: true, x: e.clientX, y: e.clientY, topY: e.clientY, botY: e.clientY, botX: e.clientX, pulled: false, pullA: 0, pullBot: e.clientY };
  input('move', evTime(e), worldXOf(e.clientX));
});
addEventListener('pointermove', e => {
  if (state !== 'play' || !game || bot || game.phase === 'over') return;
  const down = ges && e.pointerId === ges.id;
  if (!down && e.pointerType !== 'mouse') return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const evs = list.length ? list : [e];
  if (down) for (const c of evs) gesPoint(c.clientX, c.clientY, evTime(c));
  const last = evs[evs.length - 1];
  if (game.phase !== 'hold' || !down) input('move', evTime(last), worldXOf(last.clientX));
});
addEventListener('pointerup', e => {
  if (!ges || e.pointerId !== ges.id) return;
  gesPoint(e.clientX, e.clientY, evTime(e));
  const G = ges; ges = null;
  if (state !== 'play' || !game || bot) return;
  // はなした位置で決まる: 上へ動いた長さ（いちばん下からの）と横ずれ
  const a = (G.botY - e.clientY) / H, b = (e.clientX - G.botX) / H;
  if (a >= PH.TH_T) input('throw', evTime(e), a, b);
  else if (game.phase === 'hold' && a > 0.012) input('throw', evTime(e), a, b);
});
addEventListener('pointercancel', () => { ges = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: ←→ = 手を動かす（受けたあとは 投げる向き）、スペース = 手を引く（↓ で大きく）、受けたら スペース長押しで強さ・はなして投げる
function sendKeyDir(e) { input('kdir', evTime(e), (keyDir.r ? 1 : 0) - (keyDir.l ? 1 : 0)); }
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (!game) return;
    if (game.phase === 'over') { if ((c === 'Space' || c === 'Enter') && !e.repeat && failAt >= 0 && tt - failAt > 0.4) { e.preventDefault(); showOver(); } return; }
    if (bot) return;
    if (c === 'ArrowLeft' || c === 'KeyA' || c === 'ArrowRight' || c === 'KeyD') {
      e.preventDefault(); wakeAudio();
      const s = c === 'ArrowLeft' || c === 'KeyA' ? -1 : 1;
      if (game.phase === 'hold') { if (!kb) kb = { yaw: 0, down: -1 }; kb.yaw = clamp(kb.yaw + s * 0.06, -0.8, 0.8); return; }
      if (e.repeat) return;
      if (s < 0) keyDir.l = true; else keyDir.r = true;
      if (!game.kdir) input('move', evTime(e), game.me.bx);
      sendKeyDir(e); return;
    }
    if (c === 'Space' || c === 'ArrowDown' || c === 'KeyS' || c === 'ArrowUp' || c === 'KeyW') {
      e.preventDefault(); if (e.repeat) return; wakeAudio();
      if (game.phase === 'hold' && c !== 'ArrowDown' && c !== 'KeyS') { if (!kb) kb = { yaw: 0, down: -1 }; kb.down = evTime(e); return; }
      if (c === 'ArrowUp' || c === 'KeyW') return;
      input('pull', evTime(e), c === 'Space' ? (e.shiftKey ? 0.24 : 0.15) : 0.24);
      return;
    }
    if (c === 'Enter') e.preventDefault();
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('keyup', e => {
  const c = e.code;
  if (state !== 'play' || !game) return;
  if ((c === 'Space' || c === 'ArrowUp' || c === 'KeyW') && kb && kb.down >= 0) {
    e.preventDefault();
    const t = evTime(e), p = clamp((t - kb.down) / 1000 / KB_T, 0, 1), len = PH.TH_T + p * 0.48;
    kb.down = -1;
    input('throw', t, len * Math.cos(kb.yaw), len * Math.sin(kb.yaw));
    kb.yaw = 0;
    return;
  }
  if (c === 'ArrowLeft' || c === 'KeyA') keyDir.l = false; else if (c === 'ArrowRight' || c === 'KeyD') keyDir.r = false; else return;
  sendKeyDir(e);
});
addEventListener('blur', () => { ges = null; if (kb) kb.down = -1; if (keyDir.l || keyDir.r) { keyDir = { l: false, r: false }; if (state === 'play' && game) input('kdir', performance.now(), 0); } });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last, rec.lastM, lastWet)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ入力（時刻つき）の列を、fps コマ割りで物理に流しなおす（入力はそのコマで届くが、物理はその時刻で効く）
  const replay = (log, seedR, fps) => {
    const g = makeGame(seedR); let i = 0, tNow = 0;
    while (g.phase !== 'over' && tNow < 3000) {
      tNow += 1 / fps;
      while (i < log.length && log[i].t <= tNow) { gInput(g, Math.max(g.t, log[i].t + PH.DT * 0.5), log[i].type, log[i].a, log[i].b); i++; }
      while (g.t + PH.DT <= tNow) { stepGame(g); g.events.length = 0; }
    }
    return { n: g.n, t: +g.t.toFixed(3), fail: g.fail, D: +g.D.toFixed(2) };
  };
  const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;
  const scr = (x, y, z) => { const p = project(x, y, z); return { x: Math.round(p.x), y: Math.round(p.y) }; };
  // 受けるための目安: 指を置く画面の x、引くまでの秒数（目安の時刻）、引く量（px）
  const cushion = () => {
    const g = game; if (!(g.phase === 'fly' && g.dir === 'me' && g.pred)) return null;
    const P = g.pred, ip = idealPull(P.v);
    return { fingerX: scr(P.x, PH.Y_READY, g.me.bz).x, pullIn: r3(P.t - ip.lead - g.t), contactIn: r3(P.t - g.t), pullPx: Math.round(ip.a * H), minPx: Math.ceil(PH.PULL_TH * H), v: r2(P.v), lead: r3(ip.lead) };
  };
  // 投げ返す目安: from を押して to まで動かして離すと、友だちの手に届く（風も読む）
  const flick = (fromY = 0.62) => {
    const g = game; if (g.phase !== 'hold') return null;
    const f = solveFlick(g, 1), from = { x: Math.round(W / 2), y: Math.round(H * fromY) };
    return { a: r3(f.a), b: r3(f.b), s: r2(f.s), from, to: { x: Math.round(from.x + f.b * H), y: Math.round(from.y - f.a * H) }, canThrow: g.t - g.phaseT >= 0.2 };
  };
  window.__mizufusen = {
    info: () => {
      if (!game) return null;
      const g = game, B = g.b, P = g.phase === 'fly' && g.dir === 'me' ? g.pred : null;
      windAt(g, g.t, 1);
      return {
        state, phase: g.phase, dir: g.dir, t: r3(g.t), n: g.n, D: r2(g.D), fail: g.fail, sub: g.failSub,
        balloon: { x: r2(B.x), y: r2(B.y), z: r2(B.z), v: r2(Math.hypot(B.vx, B.vy, B.vz)), size: PH.SIZES[B.sz].name, R: B.R, T: Math.round(B.T), TC: B.TC, Tmax: Math.round(B.Tmax), held: B.held === g.me ? 'me' : B.held === g.op ? 'op' : null, burst: B.burst },
        hands: { x: r2(g.me.x), y: r2(g.me.y), z: r2(g.me.z), soft: r2(g.me.soft) }, body: { x: r2(g.bx), z: r2(g.bz) }, friend: { x: r2(g.ox), z: r2(g.oz) }, wind: r2(WX),
        pred: P && { x: r2(P.x), z: r2(P.z), hitIn: r2(P.t - g.t), v: r2(P.v) },
        predScreen: P ? scr(P.x, PH.Y_READY, P.z) : null, predGround: P ? scr(P.x, 0, P.z) : null,
        cushion: cushion(), flick: g.phase === 'hold' ? flick() : null,
        balloonScreen: scr(B.x, B.y, B.z), handsScreen: scr(g.me.x, g.me.y, g.me.z), friendScreen: scr(g.ox, 1.2, g.oz),
        lastCatch: g.lastCatch, lastThrow: g.lastThrow, holdT: g.phase === 'hold' ? r2(g.t - g.phaseT) : null,
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, queue: g.queue.length,
      };
    },
    cushion, flick,
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [回数...]
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n), Ds = R.map(r => r.D);
      const kinds = {}; for (const r of R) { const k = r.fail + (r.sub ? ':' + r.sub : ''); kinds[k] = (kinds[k] || 0) + 1; }
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge1: R.filter(r => r.n >= 1).length / N, ge3: R.filter(r => r.n >= 3).length / N, ge10: R.filter(r => r.n >= 10).length / N, ge30: R.filter(r => r.n >= 30).length / N, ge50: R.filter(r => r.n >= 50).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), D50: r2(q(Ds, 0.5)), Dmax: r2(Math.max(...Ds)), kinds };
    },
    // ボットの入力の列を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（結果がそろうか）
    fpsCheck: (skill = 'first', seedR = 4242) => { const r = runBot(SKILLS[skill], seedR, { log: true }); return { live: { n: r.n, fail: r.fail, t: +r.t.toFixed(3), D: +r.D.toFixed(2) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), inputs: r.log.length }; },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）
    screen: (x, y, z) => scr(x, y, z),
    predScreen: () => game && game.pred ? scr(game.pred.x, PH.Y_READY, game.pred.z) : null,
    balloonScreen: () => scr(game.b.x, game.b.y, game.b.z), handsScreen: () => scr(game.me.x, game.me.y, game.me.z), friendScreen: () => scr(game.ox, 1.2, game.oz),
    screenOfX: x => scr(x, PH.Y_READY, handPlaneZ()), worldXOf,
    tapPoint: () => ({ x: Math.round(W / 2), y: Math.round(H * 0.55) }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, diffOf, idealPull, solveFlick, game: () => game,
  };
}
