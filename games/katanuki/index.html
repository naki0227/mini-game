<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));
const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 型抜きの物理（自前。three には頼らない） ----------
   長さの単位は mm、時間は秒。板は 64mm 角のでんぷん菓子。上から見た平面（x: 右、y: 奥＝おじさんのほう）。
   板を 40×40 のセル（1.6mm）に分けた脆い材料。セルは 3 種類: 外（型の外の板）・溝（型のふち。薄くて弱い）・型（内側）。
   強さ str はセルごとに seed でばらつく。型のとがった所（まわりに型のセルが少ない所）は弱い。溝は型が進むほど浅い（強い＝外れにくく、型とあまり差がない）。
   針: 押した点のまわりに荷重（ガウス分布。半径 RHO セル）。押している時間で力が増える（F = FR × 押した秒）。
        まわりのセルが外れて減ると、残ったセルに力が集まる（穴のふちを押すと 型の内側に回り込む）。
   セルは「荷重 + 残り応力 res」が強さをこえると外れる。外れたセルは、その応力の TR 倍を となりのセルへ伝える（ひびが走る）。
        溝は弱いので、ひびは溝に沿って何セルか走って止まる。型のセルが1つでも割れたら、ひびが型の中を走って ぱきっ（失敗）。
   残り応力: 離したとき、押していた荷重の GAM 倍がセルに残り、TAU 秒で抜けていく（同じ所を短い間に連打すると たまって割れる）。
   成功: 型のセルから 外のセルへ、外れていないセルだけで（上下左右に）たどれなくなったら、外の板がはずれて型が抜ける。 */
const PH = {
  DT: 1 / 240, S: 64, G: 40, HW: 0.78,                         // 板の大きさ(mm)・セル数・溝の半分の幅（セル）
  RHO: 1.45, RCUT: 2.6, FR: 1.25, KMIN: 0.55,                  // 針: 荷重の広がり・打ち切り（RHO の何倍）・力の増え方（/秒）・穴で力が集まる上限
  GAM: 0.6, TAU: 1.0, TR: 0.75, IMPRES: 0.15,                    // 残り応力・その抜ける時間・ひびの伝わり・ひびの残り
  SG0: 0.2, SG1: 0.62, SGK: 7, NZ: 0.12, NZP: 0.08, TIP: 0.35, OUTW: 0.9, PS1: 1.0, PSK: 4,   // 溝の強さ（1枚目→奥）・ばらつき・とがりの弱さ・外の板の強さ
  T0: 15, TG0: 0.4, TG1: 0.27, TK: 6, INTRO: 1.2, LIFT: 2.2, HOLD_MAX: 6, WARN: 10,     // 1枚ごとの制限時間（基本 + 溝のセル数 × 秒）・幕間
};
const CELL = PH.S / PH.G, NC = PH.G * PH.G;
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function rndG(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* 型の形（符号つき距離。mm。内側が負） */
const sdC = (x, y, cx, cy, r) => Math.hypot(x - cx, y - cy) - r;
function sdE(x, y, cx, cy, rx, ry) { const px = x - cx, py = y - cy, k0 = Math.hypot(px / rx, py / ry), k1 = Math.hypot(px / (rx * rx), py / (ry * ry)); return k1 < 1e-9 ? -Math.min(rx, ry) : k0 * (k0 - 1) / k1; }
function sdCap(x, y, ax, ay, bx, by, r) { const pax = x - ax, pay = y - ay, bax = bx - ax, bay = by - ay, h = clampP((pax * bax + pay * bay) / (bax * bax + bay * bay), 0, 1); return Math.hypot(pax - bax * h, pay - bay * h) - r; }
function sdPoly(x, y, P) {
  let d = Infinity, s = 1;
  for (let i = 0, j = P.length - 1; i < P.length; j = i, i++) {
    const [ax, ay] = P[j], [bx, by] = P[i], ex = bx - ax, ey = by - ay, wx = x - ax, wy = y - ay;
    const h = clampP((wx * ex + wy * ey) / (ex * ex + ey * ey), 0, 1), dx = wx - ex * h, dy = wy - ey * h;
    d = Math.min(d, dx * dx + dy * dy);
    const c1 = y >= ay, c2 = y < by, c3 = ex * wy > ey * wx;
    if ((c1 && c2 && c3) || (!c1 && !c2 && !c3)) s = -s;
  }
  return s * Math.sqrt(d);
}
const starPts = (n, R, r, rot = Math.PI / 2, cx = 0, cy = 0) => Array.from({ length: n * 2 }, (_, i) => { const a = rot + i * Math.PI / n, rr = i % 2 ? r : R; return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]; });
const smin = (a, b, k) => { const h = clampP(0.5 + 0.5 * (b - a) / k, 0, 1); return b + (a - b) * h - k * h * (1 - h); };
const U = (...a) => Math.min(...a);
const P_TRI = [[0, 15.5], [-14.5, -10.5], [14.5, -10.5]], P_HEART = [[-13.4, 1.6], [13.4, 1.6], [0, -15]], P_TAIL = [[5, 0], [19, 9.5], [15.5, 0], [19, -9.5]];
const P_STAR = starPts(5, 18.5, 8.2), P_EARL = [[-11.5, 2], [-10, 16.5], [-2.5, 9.5]], P_EARR = [[11.5, 2], [10, 16.5], [2.5, 9.5]];
const P_MOMIJI = starPts(5, 19, 9.6, Math.PI / 2), P_BEAK = [[13, 5.5], [20, 3.5], [13, 1.5]], P_BTAIL = [[-10, -1], [-20, 6], [-19, -5]];
const SHAPES = [
  { name: 'まる', f: (x, y) => sdC(x, y, 0, 0, 14) },
  { name: 'さんかく', f: (x, y) => sdPoly(x, y, P_TRI) - 1.2 },
  { name: 'ひょうたん', f: (x, y) => smin(sdC(x, y, 0, -6.5, 10.5), sdC(x, y, 0, 9, 7.5), 3) },
  { name: 'ハート', f: (x, y) => U(sdC(x, y, -6.6, 4.5, 8.2), sdC(x, y, 6.6, 4.5, 8.2), sdPoly(x, y, P_HEART)) },
  { name: 'さかな', f: (x, y) => U(sdE(x, y, -4, 0, 13.5, 8.5), sdPoly(x, y, P_TAIL)) },
  { name: 'ほし', f: (x, y) => sdPoly(x, y, P_STAR) },
  { name: 'ねこ', f: (x, y) => U(sdC(x, y, 0, -3, 12.5), sdPoly(x, y, P_EARL), sdPoly(x, y, P_EARR)) },
  { name: 'ちょうちょ', f: (x, y) => U(sdE(x, y, -8.5, 6, 8.5, 6.5), sdE(x, y, 8.5, 6, 8.5, 6.5), sdE(x, y, -6.5, -7.5, 6.5, 5.2), sdE(x, y, 6.5, -7.5, 6.5, 5.2), sdCap(x, y, 0, -13, 0, 11, 2.2)) },
  { name: 'うさぎ', f: (x, y) => U(sdC(x, y, 0, -7, 10.5), sdCap(x, y, -4.2, 0, -6.5, 17, 3.3), sdCap(x, y, 4.2, 0, 6.5, 17, 3.3)) },
  { name: 'とり', f: (x, y) => U(sdE(x, y, -1, -1, 11, 7.5), sdC(x, y, 9, 4, 5.5), sdPoly(x, y, P_BEAK), sdPoly(x, y, P_BTAIL)) },
  { name: 'もみじ', f: (x, y) => U(sdPoly(x, y, P_MOMIJI), sdCap(x, y, 0, -6, 3, -20, 2.5)) },
  { name: 'かさ', f: (x, y) => U(Math.max(sdC(x, y, 0, 1, 17.5), 1 - y, -sdC(x, y, -11.7, 1, 5.9), -sdC(x, y, 0, 1, 5.9), -sdC(x, y, 11.7, 1, 5.9)), sdCap(x, y, 0, 6, 0, -14, 2.3), sdCap(x, y, 0, -14, -3.5, -18.5, 2.3), sdCap(x, y, -3.5, -18.5, -7.5, -15, 2.3)) },
];
const EXTRA = ['とげぼし', 'かざぐるま', 'ゆきのは', 'こんぺいとう'];
function shapeOf(n, u) {
  if (n <= SHAPES.length) return SHAPES[n - 1];
  // それより先: とげの多い星。だんだん細く・とがる（seed でかたちが少し変わる）
  const k = n - SHAPES.length, pts = 5 + (k % 4), R = 19.5, r = Math.max(5.2, 9 - 0.45 * k - 1.2 * u), rot = Math.PI / 2 + u * 0.6;
  const P = starPts(pts, R, r, rot);
  return { name: EXTRA[(k - 1) % EXTRA.length], f: (x, y) => sdPoly(x, y, P), star: true };

    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, planNext, trialPress, makeBoard, game: () => game,
  };
}
