<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dエンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

// 皿の模様・幕の字に使うので、先にフォントを待つ（待ちすぎない）
try { await Promise.race([document.fonts.load(`40px "Dela Gothic One"`), new Promise(r => setTimeout(r, 1500))]); } catch {}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 皿回しの物理（three にも Rapier にも頼らない、自前の剛体の回転） ----------
   長さは m、時間は s、質量は皿 1 枚を 1 とした値（トルク・角運動量は「1kg あたり」）。
   皿は直径 24cm の円盤（対称なコマ）。棒の先が皿の裏の窪み（支点）に入っていて、重心は支点の HC だけ上。
   状態は 向き（クォータニオン）と 支点まわりの角運動量 L。毎ステップ dL/dt = トルク を足して、ω = I⁻¹L で向きを回す。
   トルク:
     ・重力（と、棒の先が動くときの見かけの力）: 重心 × (g − 先端の加速度)。回っていなければただ倒れる。
       回っていると、ジャイロ効果で倒れる代わりに横へ回る（歳差運動）。遅いほど歳差は速く、ある回転より遅いと倒れる。
     ・先端の摩擦が軸を棒の向きへ起こす力（回るコマが起き上がるのと同じ。回転に比例）
     ・空気が皿の首ふりを止める力と、それで回るコマが少しずつ寝ていく効果（ケルビン＝テイトの定理。回転の 2 乗に反比例）
       → 速いと先端の摩擦が勝ってすっと立ち、遅いと寝る方が勝って歳差の円がだんだん大きくなる
     ・回転を止める空気と先端の摩擦
     ・先端を小さく円運動させたとき、窪みのふちをこする摩擦（フラフープと同じ。円の速さ・向きが皿と合えば加速、逆なら減速）
   皿の重心はほんの少し（EPS）だけ軸からずれている（本物の皿もそう）。乱数で落ちることはない。
   落ちる = 皿の傾きが FALL（または軸と棒の角度が FALL_REL）を超えて、窪みから先端が外れたとき。 */
const DEGP = Math.PI / 180;
const PH = {
  G: 9.8, DT: 1 / 600,
  R: 0.12, HC: 0.010, I3: 0.0079, IP: 0.0041,     // 皿の半径・支点から重心までの高さ・慣性モーメント（軸まわり／横まわり、支点まわり）
  STICK: 1.0, BASE_Y: 0.07,                       // 棒の長さ・棒の根もと（台の上）の高さ
  W_STAR: 8.5,                                    // これより速いと傾きがおさまり、遅いと育つ回転（rad/s）
  RISE: 1.2,                                     // 先端の摩擦で軸が棒の向きへ起きる速さ（1/s）
  NUT: 1.5,                                       // 空気が皿の首ふり（軸の速い揺れ）を止める強さ
  C1: 0.036, C2: 0.0016,                           // 回転を止める摩擦・空気（/s と /rad）
  MU_RD: 0.0055, OMEGA0: 3.0,                     // 窪みのふちをこする摩擦 × 窪みの半径、すべりの効き始め（rad/s）
  EPS: 0.0005,                                    // 重心のずれ
  FALL: 33 * DEGP, FALL_REL: 44 * DEGP,           // これ以上傾くと先端が外れる（重心が支えの外へ出る傾き・軸と棒の角度）
  DANGER_TILT: 13 * DEGP, DANGER_W: 7.5,          // 「！」を出す傾き・回転
  LEAN_MAX: 10 * DEGP, LEAN_DEAD: 34, LEAN_PX: 90, LEAN_TAU: 0.22, LEAN_REL: 0.3,   // 指をずらす → 棒が傾く
  CIRC: 0.00026, CIRC_MAX: 0.03, TIP_W: 42,      // 指のくるくる → 先端の円運動（m/px）、先端が手を追う速さ
  W0: 16, W_NEW: 15, DIR: -1,                     // はじめの回転・新しい皿の回転・回る向き（上から見て時計回り＝画面でも時計回り）
  SPAWN: [15, 40, 75, 120],                       // 皿が増える時刻（秒）
  SLOTS: [{ x: 0, z: 0 }, { x: 0.33, z: 0.1 }, { x: -0.33, z: 0.1 }, { x: 0.6, z: -0.22 }, { x: -0.6, z: -0.22 }],
};
PH.CR = PH.RISE * PH.I3;
PH.CA = PH.NUT * PH.I3;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
// クォータニオンでベクトルを回す（q = [x, y, z, w]）
function qrot(q, x, y, z) {
  const qx = q[0], qy = q[1], qz = q[2], qw = q[3];
  const ix = qw * x + qy * z - qz * y, iy = qw * y + qz * x - qx * z, iz = qw * z + qx * y - qy * x, iw = -qx * x - qy * y - qz * z;
  return [ix * qw + iw * -qx + iy * -qz - iz * -qy, iy * qw + iw * -qy + iz * -qx - ix * -qz, iz * qw + iw * -qz + ix * -qy - iy * -qx];
}
// q ← exp(ω dt) q
function qstep(q, wx, wy, wz, dt) {
  const a = Math.hypot(wx, wy, wz) * dt;
  if (a < 1e-12) return;
  const s = Math.sin(a / 2) / (a / dt), c = Math.cos(a / 2);
  const ax = wx * s, ay = wy * s, az = wz * s;
  const x = q[0], y = q[1], z = q[2], w = q[3];
  q[0] = c * x + ax * w + ay * z - az * y;
  q[1] = c * y + ay * w + az * x - ax * z;
  q[2] = c * z + az * w + ax * y - ay * x;
  q[3] = c * w - ax * x - ay * y - az * z;
  const n = Math.hypot(q[0], q[1], q[2], q[3]); q[0] /= n; q[1] /= n; q[2] /= n; q[3] /= n;
}

function makePlate(i, rnd, spin, tilt) {
  const S = PH.SLOTS[i];
  const p = {
    i, bx: S.x, bz: S.z, alive: true, free: false, crashed: false, age: 0,
    tip: [S.x, PH.BASE_Y + PH.STICK, S.z], tv: [0, 0, 0], ta: [0, 0, 0], s: [0, 1, 0],
    q: [0, 0, 0, 1], L: [0, 0, 0], w: [0, 0, 0], n: [0, 1, 0], ws: 0, tilt: 0, rel: 0,
    cx: 0, cy: 0, fin: null, drive: 0, od: 0, wob: false, danger: false, spun: 0,
    cm: null, cv: null,
  };
  // はじめの傾き（向きは種で決まる）と、重心のずれの向き
  const d = rnd() * Math.PI * 2, ph = rnd() * Math.PI * 2;
  const ax = Math.cos(d), az = Math.sin(d), s = Math.sin(tilt / 2);
  const qt = [ax * s, 0, az * s, Math.cos(tilt / 2)];
  const qs = [0, Math.sin(ph / 2), 0, Math.cos(ph / 2)];
  // q = qt * qs
  p.q = [qt[3] * qs[0] + qt[0] * qs[3] + qt[1] * qs[2] - qt[2] * qs[1], qt[3] * qs[1] - qt[0] * qs[2] + qt[1] * qs[3] + qt[2] * qs[0], qt[3] * qs[2] + qt[0] * qs[1] - qt[1] * qs[0] + qt[2] * qs[3], qt[3] * qs[3] - qt[0] * qs[0] - qt[1] * qs[1] - qt[2] * qs[2]];
  p.n = qrot(p.q, 0, 1, 0);
  p.L = [p.n[0] * PH.I3 * spin, p.n[1] * PH.I3 * spin, p.n[2] * PH.I3 * spin];
  p.ws = spin;
  return p;
}

const K_LEAN = 1 - Math.exp(-PH.DT / PH.LEAN_TAU), K_REL = Math.exp(-PH.DT / PH.LEAN_REL);
function stepPlate(p) {
  const dt = PH.DT;
  p.age += dt;
  if (p.free) {
    // 外れて落ちている: ただの放物運動（回転はそのまま）
    if (p.crashed) return;
    p.cv[1] -= PH.G * dt;
    p.cm[0] += p.cv[0] * dt; p.cm[1] += p.cv[1] * dt; p.cm[2] += p.cv[2] * dt;
    qstep(p.q, p.w[0], p.w[1], p.w[2], dt);
    p.n = qrot(p.q, 0, 1, 0);
    if (p.cm[1] < 0.03) { p.crashed = true; p.crashV = Math.hypot(...p.cv); }
    return;
  }
  // ---- 指 → 棒（ずらした分は棒の傾き、くるくるは先端の円運動） ----
  let hx = 0, hy = 0;
  if (p.fin) { p.cx += (p.fin.x - p.cx) * K_LEAN; p.cy += (p.fin.y - p.cy) * K_LEAN; hx = p.fin.x - p.cx; hy = p.fin.y - p.cy; }

/* ---------- 音（木と瀬戸物。低めでやわらかく、2kHz 以上は使わない） ---------- */

      const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 300; f.Q.value = 2.2;
      const g = ac.createGain(); g.gain.value = 0;

/* ---------- ループ ---------- */
let acc = 0, lastTs = performance.now();
function frame(ts2) {
  const el = Math.min(100, ts2 - lastTs); acc += el; lastTs = ts2;
  let k = 0;

  if (k >= 4) acc = 0;
  render(Math.max(k, 1) / 60);
  // しゅるる: いま回している皿が加速しているときだけ
  if (live() && game.phase === 'play') { const p = game.plates[game.active]; setWhirr(p && p.alive && p.fin ? clamp(p.drive / 3, 0, 1) * 0.12 : 0, p ? Math.abs(p.ws) : 0); }
  if (state === 'play' && rec.best > 0 && !newShown && game.phase === 'play' && game.t > rec.best) { newShown = true; addPop('自己ベスト更新！', { hot: true, dur: 1.8 }); sChime(); }
  requestAnimationFrame(frame);
}

  kb.spin = false; kb.lx = kb.ly = 0;

}

addEventListener('pointercancel', () => endDrag());
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: スペース長押し = くるくる（毎秒 3 周）、矢印 = 棒を傾ける、1〜5 / Tab = 皿を選ぶ
function applyKeys(dt) {
  if (drag || game.phase !== 'play') return;
  const lean = Math.hypot(kb.lx, kb.ly) > 0;
  if (!kb.spin && !lean) { if (kb.was) { game.setFinger(game.active, null); kb.was = false; } return; }
  kb.was = true;
  kb.th += 2 * Math.PI * 3.0 * dt * (PH.DIR < 0 ? 1 : -1);
  const L = PH.LEAN_DEAD + PH.LEAN_PX * 0.8, r = kb.spin ? 62 : 0;
  game.setFinger(game.active, { x: kb.lx * L + r * Math.cos(kb.th), y: kb.ly * L + r * Math.sin(kb.th) });
}
const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
const held = new Set();
function syncArrows() { kb.lx = 0; kb.ly = 0; for (const c of held) { kb.lx += ARROWS[c][0]; kb.ly += ARROWS[c][1]; } }
addEventListener('keydown', e => {
  if (state === 'play') {
    if (game.phase === 'over') { if ((e.code === 'Space' || e.code === 'Enter') && tt - failAt > 0.5 && crashAt >= 0) { e.preventDefault(); showOver(); } return; }
    const c = e.code;
    if (c === 'Space') { e.preventDefault(); wakeAudio(); kb.spin = true; kb.used = true; return; }
    if (ARROWS[c]) { e.preventDefault(); held.add(c); syncArrows(); return; }
    const m = /^Digit([1-5])$/.exec(c);
    if (m) { e.preventDefault(); game.setFinger(game.active, null); game.select(+m[1] - 1); return; }
    if (c === 'Tab') { e.preventDefault(); const alive = game.plates.filter(p => p.alive); if (alive.length > 1) { const k = alive.findIndex(p => p.i === game.active); game.setFinger(game.active, null); game.select(alive[(k + (e.shiftKey ? -1 : 1) + alive.length) % alive.length].i); } return; }
    if (c === 'Enter') e.preventDefault();
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('keyup', e => {
  if (e.code === 'Space') kb.spin = false;
  if (ARROWS[e.code]) { held.delete(e.code); syncArrows(); }
});
addEventListener('blur', () => { endDrag(); kb.spin = false; held.clear(); syncArrows(); });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last, rec.lastPlates || 1)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  window.__sara = {
    info: () => ({ state, phase: game && game.phase, t: game && game.t, active: game && game.active, fall: game && game.fall, plates: game && game.plates.map(p => ({ i: p.i, alive: p.alive, ws: +p.ws.toFixed(2), tilt: +(p.tilt / DEG).toFixed(1), rel: +(p.rel / DEG).toFixed(1), drive: +p.drive.toFixed(2) })), rec, seed }),
    // ボットで分布を測る: sim('good', 10, 300) → [{ t: 秒, n: 枚 }...]
    sim: (skill = 'good', N = 10, maxT = 300, s0 = 1000) => Array.from({ length: N }, (_, i) => { const r = runBot(SKILLS[skill], s0 + i, maxT); return { t: +r.t.toFixed(1), n: r.n }; }),
    // 画面上の点: i 番の皿（棒の先）
    plateScreen: (i = game.active) => { const p = game.plates[i]; return p ? project(p.tip[0], p.tip[1], p.tip[2]) : null; },
    autoplay: (skill = 'good') => { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); },
    // 時間を進める（ボットがいればボットが回す）: skip(秒)
    skip: s => { const t1 = game.t + s; while (game.t < t1 && game.phase === 'play') { if (bot) bot.step(); game.step(); handleEvents(); } },
    PH, SKILLS, makeGame, runBot, game: () => game,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([document.fonts.load(`40px "Dela Gothic One"`), new Promise(r => setTimeout(r, 1500))]); } catch {}
resize();
newGame('good'); warmDemo();
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = '棒を持つ';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
