<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try { THREE = await import(THREE_URL); } catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- ヨーヨーの物理（three には頼らない。上下の1本の線の上の「巻いたひも＋円盤」） ----------
   長さは m、時間は秒。y は上向き。手（指にかけたひもの輪）の高さ H、ヨーヨーの中心 Y、手からの距離 d = H − Y。
   ヨーヨー: 質量 M、慣性モーメント I = KI·M·r²（r = ひもを巻いた軸の半径）。ひもの出ている長さ u（0 = 手の中、L = 伸びきり）。
   ひもが張っている間は「ひもが軸の上をすべらずに転がる」: u̇ = σ·ω·r（σ = 巻いている向き）。
     → 張力 T、u の加速度 ü = ((g + Ḧ) − KI·s·αf·r) / (1 + KI)、T = M(g + Ḧ − ü)（s = ほどける向きなら +1、巻き上がる向きなら −1、αf = 摩擦の角減速）。
     落ちるときは ほどけながら回転が増え、巻き上がるときは 回転を使って上る（エネルギーの保存。摩擦の分だけ減る）。
     張力が負になる（手を急に下げた・勢いで上へ飛んだ）ときは、ひもがゆるんで放物線。張りなおすときは非弾性の衝撃。
   伸びきる（u = L）と、ひもの端の輪が軸の上ですべって「空回り（スリープ）」: 上下の勢いは止まり、回転だけ残って摩擦で減る。
   空回り中に手をくいっと引く（手の上向き加速度 > A_GRAB ＝ 張力が強くなる）と、輪が軸を噛んで逆向きに巻き上げはじめる（非弾性の衝撃）。
   戻りの勢いが手まで届けば受けられる（u ≤ REACH で止まった・または手に当たった）。速すぎる（> V_HURT）と手に当たって弾かれる。
   横: ひもが斜めになると振り子のようにゆれ、ヨーヨーの軸がよじれる（φ）。よじれ・ひものねじれ（tw）が摩擦をふやす。
   ねじれは投げるたびに少しずつたまる（強く投げるほど・斜めに投げるほど多く）。 */
const PH = {
  G: 9.8, DT: 1 / 1000,
  L: 0.72,                 // ひもの長さ
  M: 0.055, R: 0.028,      // 質量、外の半径（見た目）
  RA: 0.006,               // ひもを巻いた軸の半径
  KI: 9.0,                 // I / (M·RA²)
  REACH: 0.15,             // 手が届く距離（ここまで上がって止まれば、手を少し下げてつかめる）
  CONTACT: 0.012,          // 手に当たる距離
  V_HURT: 1.7,             // これより速く手に当たると痛い・弾かれる
  OMH: 42, VMAXH: 3.2,     // 手が指の目標を追う速さ（ばね）と、手の速さの上限
  TUG_D: 0.09, TUG_A: 0.025,   // 引く: 手を TUG_A だけ上へ「くいっ」。この時間だけ上げて、ゆっくり戻す
  THROW_DIP: 0.05, THROW_D: 0.11,   // 投げる: 手首を振り下ろす深さと時間
  A_GRAB: 16,              // 空回り中、手の上向き加速度がこれを超えるとひもを噛む
  ALPHA_S: 25,            // 空回りの摩擦（回転の減り。rad/s²、張力 Mg あたり）
  ALPHA_T: 6,             // ほどける／巻き上がる間の、ひもと胴のこすれ（rad/s²）
  BETA: 0.04,              // 空気（回転に比例。/s）
  OMEGA_DEAD: 50,          // 空回りがこれより遅くなると、もう噛んでも上がらず、ぶら下がり
  TW0: 0.006, TWV: 0.006, TWL: 0.25,  // ねじれのたまり方: 1回ごと・投げの強さ・斜め
  TW_FR: 7,              // ねじれ → 摩擦の倍率
  IDLE: 5,                 // 手に持ったまま、これだけ放っておくと指からぽろっと落ちる
  V0_MIN: 0.8, V0_MAX: 2.6,         // 投げの強さ（手首の速さ）の範囲
  LAT_MAX: 0.45,
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const sgn = v => (v < 0 ? -1 : 1);
// 入力は時刻つきで入れる（画面のコマとは関係なく、物理はその時刻で効く）
function gInput(g, t, type, a = 0, b = 0) { const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, { t, type, a, b }); }
function makeGame(seed = 1) {
  return {
    seed, t: 0, queue: [], events: [], pulses: [],
    H: 0, Hv: 0, Ha: 0, HvPrev: 0,
    phase: 'hand', mode: 'held',       // hand | out | over ／ held | taut | slack | sleep
    Y: 0, Yv: 0, u: 0, ud: 0, w: 0, sig: 1, x: 0, xv: 0, phi: 0, tw: 0,
    n: 0, idle: 0, sleepT: 0, lastTug: -9, lastThrow: -9, fail: null, arrV: 0, cyc: null, spinAng: 0,
    bottoms: 0, shorts: 0, wMax: 0,
  };
}
// 手の目標: 引く・投げるは「さっと動かして、そのあとゆっくり元へ戻す」（戻すときに手を急に下げない＝ひもをゆるませない）
const handTarget = g => { let o = 0; for (const p of g.pulses) { const k = (g.t - p.t0) / p.d; if (k >= 0) o += k < 1 ? p.a : p.a * Math.exp(-(k - 1) * p.d / 0.16); } return o; };
function applyInput(g, e) {
  if (g.phase === 'over') return;
  if (e.type === 'throw') {
    if (g.phase !== 'hand') return;
    const v0 = clampP(e.a, PH.V0_MIN, PH.V0_MAX), lat = clampP(e.b, -PH.LAT_MAX, PH.LAT_MAX);
    release(g, v0, lat);
    g.pulses.push({ t0: g.t, a: -PH.THROW_DIP, d: PH.THROW_D });
    g.events.push({ type: 'throw', v0, lat });
  } else if (e.type === 'tug') {
    if (g.phase !== 'out' || g.t - g.lastTug < 0.16) return;
    g.lastTug = g.t;
    g.pulses.push({ t0: g.t, a: clampP(e.a, 0.008, 0.11), d: PH.TUG_D });
    g.events.push({ type: 'tug', a: e.a, mode: g.mode, u: g.u });
    if (g.cyc) { g.cyc.tugs++; if (g.mode !== 'sleep') g.cyc.early = true; else g.cyc.late = Math.max(g.cyc.late || 0, g.sleepT); }
  }
}
function release(g, v0, lat) {
  g.phase = 'out'; g.mode = 'taut'; g.sig = 1; g.u = 0.002; g.ud = v0 * 0.92; g.w = g.ud / PH.RA;
  g.Y = g.H - g.u; g.Yv = g.Hv - g.ud; g.x = 0; g.xv = v0 * lat * 0.55; g.phi = 0; g.idle = 0;
  g.tw += PH.TW0 + PH.TWV * Math.max(0, v0 - 0.8) + PH.TWL * Math.abs(lat);
  g.lastThrow = g.t;
  g.cyc = { v0, lat, t0: g.t, tugs: 0, tBottom: null, wBottom: 0, sleep: 0 };
}
// いまの摩擦（回転の角減速 rad/s²）: ひものねじれ・軸のよじれで増える
const fricF = g => (1 + PH.TW_FR * g.tw) * (1 + 7 * g.phi * g.phi);
function catchIt(g, v, how) {
  g.phase = 'hand'; g.mode = 'held'; g.u = 0; g.ud = 0; g.w = 0; g.x = 0; g.xv = 0; g.idle = 0;
  if (v > PH.V_HURT) {
    // 速すぎて手に当たり、弾かれて取りそこねた: ひもごと下へ落ちて、ぶら下がる
    g.phase = 'over'; g.fail = 'hit'; g.arrV = v; g.mode = 'slack'; g.u = PH.L; g.Y = g.H - 0.02; g.Yv = g.Hv - 0.35 * v; g.w = sgn(g.w || 1) * 60; g.xv = 0.5 * (g.x >= 0 ? 1 : -1);
    g.events.push({ type: 'hit', v }); g.events.push({ type: 'fail', kind: 'hit' }); return;
  }
  g.n++; g.arrV = v;
  g.events.push({ type: 'catch', n: g.n, v, how, cyc: g.cyc });
}
function fail(g, kind) { if (g.phase === 'over') return; g.phase = 'over'; g.fail = kind; g.events.push({ type: 'fail', kind }); }
function stepGame(g) {
  const dt = PH.DT, G = PH.G, k = PH.KI, r = PH.RA;
  g.t += dt;
  const q = g.queue;
  while (q.length && q[0].t <= g.t) applyInput(g, q.shift());
  if (g.pulses.length && g.t - g.pulses[0].t0 > 2) g.pulses.shift();
  // 手: 指の目標をばねで追う
  const ty = handTarget(g);
  let a = PH.OMH * PH.OMH * (ty - g.H) - 2 * PH.OMH * g.Hv;
  let hv = g.Hv + a * dt; hv = clampP(hv, -PH.VMAXH, PH.VMAXH); a = (hv - g.Hv) / dt;
  g.Hv = hv; g.H += hv * dt; g.Ha = a;
  if (g.phase === 'hand') {
    g.Y = g.H; g.Yv = g.Hv; g.u = 0;
    g.idle += dt;
    if (g.idle > PH.IDLE) { release(g, 0.05, 0); g.cyc.slip = true; g.events.push({ type: 'slip' }); }
    return;
  }

/* ---------- ボット（調整・タイトルのデモ用）: 人と同じ「投げる・引く」の入力だけを、時刻つきで入れる ----------
   伸びきったのを見てから react 秒（ばらつき reactSd）で引く。antic の割合で「そろそろ」と見越して引く（早すぎることも）。

    txt('画面を 下へシュッ', W / 2, y, 20 * sc, '#b3291f', 'rgba(255,246,228,.95)', 6, FD);
    txt('速いほど よく回る（タップでも そっと投げる）', W / 2, y + 26, 13 * sc, '#2b1c14', 'rgba(255,246,228,.95)', 5, `700 ${FB}`);
    // 下向きの矢印が、すっと下がる
    const k = (tt * 1.1) % 1, cx = W / 2 + 120 * sc, cy = safeT + 170 + easeOut(k) * 60;
    fx.globalAlpha = Math.sin(k * Math.PI) * 0.85;
    fx.strokeStyle = '#b3291f'; fx.lineWidth = 5; fx.lineCap = 'round'; fx.lineJoin = 'round';
    fx.beginPath(); fx.moveTo(cx - 14, cy - 10); fx.lineTo(cx, cy + 4); fx.lineTo(cx + 14, cy - 10); fx.stroke();
    fx.beginPath(); fx.moveTo(cx - 14, cy - 24); fx.lineTo(cx, cy - 10); fx.lineTo(cx + 14, cy - 24); fx.stroke();
    fx.globalAlpha = 1; fx.lineCap = 'butt';
  } else if (game.mode !== 'sleep' && game.ud > 0) {
    txt('伸びきったら タップで くいっ', W / 2, y, 16 * sc, '#2b1c14', 'rgba(255,246,228,.95)', 6, `700 ${FB}`);
  }
  void yp; void pxR;
}
const easeOut = k => 1 - (1 - k) * (1 - k);

/* ---------- 結果 ---------- */
function failMsg() {
  const g = game, c = g.cyc || {};
  if (g.fail === 'hit') return { noren: 'いたっ', msg: '強すぎて手に当たり、弾かれた。投げを少しゆるめると、手にすっと収まる。' };
  if (c.slip && !c.tugs) return { noren: 'ぽろっ', msg: g.n === 0 ? 'まだ0回。持ったままでいたら、指からぽろっと落ちた。画面を下へシュッと投げて、伸びきったらタップ。' : '持ったままでいたら、指からぽろっと落ちた。戻ってきたら、すぐまた下へシュッ。' };
  if (c.early && !c.late) return { noren: 'ぶらーん', msg: '引くのが早かった。ひもが伸びきって「こつっ」となってから、くいっと引く。' };
  if (c.short) return { noren: 'ぶらーん', msg: g.tw > 0.7 ? '戻りきらなかった。ひもがねじれて、回転がすぐ落ちる。そのぶん強く投げて、伸びきったらすぐ引く。' : '戻りきらなかった。もっと速く投げると回転が増えて、手まで上がってくる。' };
  if (!c.tugs) return { noren: 'ぶらーん', msg: g.n === 0 ? 'まだ0回。ひもが伸びきって回っているうちにタップすると、巻き上がって戻ってくる。' : '回転が切れて、ぶら下がった。伸びきって回っているうちにタップで引こう。' };
  return { noren: 'ぶらーん', msg: '引くのが遅くて回転が落ちた。伸びきった瞬間の「いま！」でタップ。' };
}
function showOver() {
  if (state !== 'play') return;
  state = 'over';
  const n = game.n;
  const isNew = n > rec.best;
  if (!botStart) { rec.plays++; rec.total += n; rec.last = n; if (isNew) rec.best = n; save(); }
  $('oScore').textContent = n;
  const F = failMsg();
  $('oMsg').textContent = F.msg;
  $('oNoren').innerHTML = F.noren.split('').map(c => `<span>${c}</span>`).join('');
  $('oBest').textContent = rec.best; $('oTotal').textContent = rec.total; $('oPlays').textContent = rec.plays;
  $('newRec').hidden = !(isNew && n > 0 && !botStart);
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({ text: `${shareText(n)}${isNew && rec.plays > 1 && n > 0 ? ' 自己ベスト！' : ''}\n`, url: gameUrl(), hashtags: 'ヨーヨー' });
  $('copyMsg').textContent = '画面タップ・スペースでもう一回';
  $('over').hidden = false; $('hud').hidden = true;
  overShownAt = performance.now();
  $('retryBtn').focus({ preventScroll: true });
}
const shareText = n => n > 0 ? `🪀ヨーヨー 上下 ${n}回 連続！` : '🪀ヨーヨー 上下、まだ0回…ぶらーん';

/* ---------- シェア ---------- */
// 公開先のURL。ローカルで開いたときもこれをシェアする
const PUBLIC_URL = 'https://asobi.enludus.com/games/yoyo/';
function gameUrl() {
  try {
    if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost') return location.origin + location.pathname;
  } catch {}
  return PUBLIC_URL;
}

/* ---------- HUD ---------- */
function updateHud() { $('hBest').textContent = rec.best ? `${rec.best}回` : '—'; }
function fillTitle() { $('tBest').textContent = rec.best || '—'; $('tTotal').textContent = rec.total; }

/* ---------- 音（低めでこもらせる。2kHz 以上は使わない） ---------- */
let ac = null, master = null, noiseBuf = null, hum = null;
function wakeAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = 0.5;
      master = ac.createDynamicsCompressor(); master.threshold.value = -16; master.ratio.value = 5;
      master.connect(lp).connect(ac.destination);
      const len = ac.sampleRate * 1.5; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); let b = 0;
      for (let i = 0; i < len; i++) { b = b * 0.7 + (Math.random() * 2 - 1) * 0.3; d[i] = b * 2; }
      // 回転の「ウーン」: のこぎり波2つを低く、強くこもらせて
      const o1 = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o1.type = 'sawtooth'; o2.type = 'triangle'; f.type = 'lowpass'; f.frequency.value = 320; f.Q.value = 0.7; g.gain.value = 0;
      o1.connect(f); o2.connect(f); f.connect(g).connect(master); o1.start(); o2.start();
      hum = { o1, o2, f, g };
    }
    if (ac.state === 'suspended') ac.resume();
  } catch {}
}
const live = () => ac && state === 'play';
function updateHum() {
  if (!hum) return;
  try {
    const on = live() && game && game.phase === 'out' && !frozen;
    const w = on ? Math.abs(game.w) : 0, n0 = ac.currentTime;
    const sleep = on && game.mode === 'sleep';
    hum.o1.frequency.setTargetAtTime(38 + w * 0.26, n0, 0.03); hum.o2.frequency.setTargetAtTime((38 + w * 0.26) * 1.5, n0, 0.03);
    hum.f.frequency.setTargetAtTime(160 + w * 0.9, n0, 0.05);
    hum.g.gain.setTargetAtTime(on ? clamp(w / 320, 0, 1) * (sleep ? 0.075 : 0.05) : 0, n0, 0.04);
  } catch {}
}
function tone(freq, at, dur, vol, type = 'sine', f1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at); if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
  return o;
}
function noise(at, dur, vol, type, freq, q = 1) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(lp).connect(g).connect(master); s.start(at, Math.random() * 1.0); s.stop(at + dur + 0.05);
  return f;
}
// 手に戻る「ぱしっ」: 低く、こもった手のひらの音。強いほど少し大きい
function sCatch(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(0.5 + v / 2, 0.5, 1.1); noise(n0, 0.05, 0.22 * k, 'bandpass', 520, 0.9); tone(150, n0, 0.08, 0.12 * k, 'sine', 95); tone(300, n0, 0.03, 0.03 * k, 'triangle'); } catch {} }
// 伸びきった「こつっ」（タイミングの合図）
function sBottom(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 1.6, 0.4, 1); tone(210, n0, 0.07, 0.12 * k, 'triangle', 170); noise(n0, 0.03, 0.06 * k, 'lowpass', 700); } catch {} }
// 噛んで巻き上げはじめる「きゅっ」（低め）
function sGrab() { try { if (!live()) return; const n0 = ac.currentTime; tone(260, n0, 0.06, 0.05, 'triangle', 380); } catch {} }
// 投げる「ひゅっ」
function sThrow(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 2, 0.3, 1); const f = noise(n0, 0.16, 0.04 + 0.05 * k, 'bandpass', 520, 1.2); f.frequency.exponentialRampToValueAtTime(220, n0 + 0.15); } catch {} }
// 手に強く当たった「ばちっ」
function sHit(v) { try { if (!live()) return; const n0 = ac.currentTime; noise(n0, 0.08, 0.3, 'bandpass', 420, 0.8); tone(110, n0, 0.18, 0.18, 'sine', 60); void v; } catch {} }
// 終わり「ぶらーん」
function sFail(kind) { try { if (!live()) return; const n0 = ac.currentTime + (kind === 'hit' ? 0.25 : 0); tone(240, n0, 0.12, 0.06, 'triangle'); tone(180, n0 + 0.14, 0.5, 0.07, 'sine', 110); } catch {} }
function sChime(big) { try { if (!live()) return; const n0 = ac.currentTime + 0.05; const seq = big ? [[523, 0], [659, 0.1], [784, 0.2], [1046, 0.32]] : [[523, 0], [659, 0.1], [784, 0.2]]; seq.forEach(([f, t]) => tone(f, n0 + t, 0.4, 0.05)); } catch {} }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  step(dt);
  render(Math.max(dt, 1 / 240));
  updateHum();
  requestAnimationFrame(frame);
}

/* ---------- 入力: 下へスワイプ＝投げる（速さ＝強さ）、タップ（上スワイプ）＝引く。時刻つきで物理へ ---------- */
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(nextSeed(), bn); frozen = false; lampLevel = 0; cam.init = false;
  updateHud();
  // #debug&skip=秒: はじめにその秒数だけ一気に進め、巻き上がって戻ってくる途中で止める（OGP 撮影・確認用。bot=good と組み合わせる。freeze=1 で止めたまま）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'return');
  if (HASH.has('debug') && HASH.get('ff') === '1') ff = true;   // #debug&ff=1: ずっと早送り（長いプレイの確認用。結果は同じ）
}
// pose=return: 指定の秒数のあと、回転しながら巻き上がって戻ってくる途中（ひもの半分くらい）まで進める
function skipTo(t1, pose = 'none') {
  const quiet = state; state = 'skip';
  const lim = t1 + 30;
  while (game.phase !== 'over' && game.t < lim) {
    if (bot) bot.step(); stepGame(game);
    if (game.events.length) handleEvents();
    if (game.t >= t1) {
      if (pose !== 'return') break;
      if (game.phase === 'out' && game.mode === 'taut' && game.ud < -0.5 && game.u < 0.42 && game.u > 0.3) break;
    }
  }
  state = quiet;
  pops = []; flash = null; catchFx = null; failAt = game.phase === 'over' ? tt : -1; shake = 0;
  lampLevel = MILES.filter(m => m <= game.n).length;
  base = performance.now() / 1000 - game.t;
  if (HASH.get('freeze') === '1') frozen = true;
}
// 投げの強さ: 指の速さ（画面の高さ/秒）→ 手首の速さ。ゆっくりのスワイプでも V0_MIN（それなりに戻る強さ）は出る
const throwV = s => clamp(0.85 + 0.45 * s, PH.V0_MIN, PH.V0_MAX);
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game) return;
  if (game.phase === 'over') { if (failAt >= 0 && tt - failAt > 0.4) showOver(); return; }
  if (bot) return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  const t = evTime(e);
  ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: t, hist: [{ x: e.clientX, y: e.clientY, t }], kind: game.phase === 'out' ? 'tug' : 'throw', done: false };
  if (ptr.kind === 'tug') { input('tug', t, PH.TUG_A); ptr.done = true; }
});
addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id || state !== 'play' || !game) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ce of (list.length ? list : [e])) {
    const t = evTime(ce);
    ptr.hist.push({ x: ce.clientX, y: ce.clientY, t });
    if (ptr.hist.length > 24) ptr.hist.shift();
    if (ptr.kind !== 'throw' || ptr.done || game.phase !== 'hand') continue;
    const dy = ce.clientY - ptr.y0;
    if (dy > Math.max(22, H * 0.04)) {
      // ここ 0.12 秒の動き（なければ押したところから）で速さを測る
      let o = ptr.hist[0]; for (const h of ptr.hist) if (t - h.t <= 120) { o = h; break; }
      const dtS = Math.max(0.016, (t - o.t) / 1000), sp = (ce.clientY - o.y) / H / dtS;
      const lat = clamp((ce.clientX - ptr.x0) / Math.max(dy, 1) * 0.5, -PH.LAT_MAX, PH.LAT_MAX);
      input('throw', t, throwV(Math.max(0, sp)), lat); ptr.done = true;
    }
  }
});
const ptrUp = e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  // 手に持っているときのタップ: そっと投げる
  if (ptr.kind === 'throw' && !ptr.done && game && game.phase === 'hand' && state === 'play') input('throw', evTime(e), 0.95, 0);
  ptr = null;
};
addEventListener('pointerup', ptrUp);
addEventListener('pointercancel', () => { ptr = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: ↓/S = 投げる（Shift で強く）、↑/W/スペース = 引く（手に持っているときのスペースは投げる）
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (!game) return;
    if (game.phase === 'over') { if ((c === 'Space' || c === 'Enter') && !e.repeat && failAt >= 0 && tt - failAt > 0.4) { e.preventDefault(); showOver(); } return; }
    if (c === 'ArrowDown' || c === 'KeyS') { e.preventDefault(); if (e.repeat) return; wakeAudio(); if (game.phase === 'hand') input('throw', evTime(e), e.shiftKey ? 1.8 : 1.3, 0); return; }
    if (c === 'ArrowUp' || c === 'KeyW' || c === 'Space') {
      e.preventDefault(); if (e.repeat) return; wakeAudio();
      if (game.phase === 'out') input('tug', evTime(e), PH.TUG_A); else if (c === 'Space') input('throw', evTime(e), 1.3, 0);
      return;
    }
    if (c === 'Enter') e.preventDefault();
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('blur', () => { ptr = null; });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ入力（時刻つき）の列を、fps コマ割りで物理に流しなおす（入力はそのコマで届くが、物理はその時刻で効く）
  const replay = (log, fps) => {
    const g = makeGame(1); let i = 0, tNow = 0;
    while (g.phase !== 'over' && tNow < 3000) {
      tNow += 1 / fps;
      while (i < log.length && log[i].t <= tNow) { gInput(g, Math.max(g.t, log[i].t), log[i].type, log[i].a, log[i].b); i++; }
      while (g.t + PH.DT <= tNow) { stepGame(g); g.events.length = 0; }
    }
    return { n: g.n, t: +g.t.toFixed(3), fail: g.fail };
  };
  window.__yoyo = {
    info: () => game && ({ state, phase: game.phase, mode: game.mode, t: +game.t.toFixed(3), n: game.n, u: +game.u.toFixed(3), ud: +game.ud.toFixed(3), w: +game.w.toFixed(1), tw: +game.tw.toFixed(3), phi: +game.phi.toFixed(3), x: +game.x.toFixed(3), H: +game.H.toFixed(3), sleepT: +game.sleepT.toFixed(3), fail: game.fail, cyc: game.cyc, pred, bot: !!bot, botStart, ff, frozen, rec, seed: game.seed, queue: game.queue.length }),
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [回数...]
    sim: (skill = 'good', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'good', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n);
      const kinds = {}; for (const r of R) kinds[r.fail] = (kinds[r.fail] || 0) + 1;
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge2: R.filter(r => r.n >= 2).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), kinds };
    },
    // ボットの入力の列を記録して、30fps / 60fps / 144fps のコマ割りで流しなおす（結果がそろうか）
    fpsCheck: (skill = 'first', seedR = 4242) => { const r = runBot(SKILLS[skill], seedR, { log: true }); return { live: { n: r.n, fail: r.fail, t: +r.t.toFixed(3) }, fps30: replay(r.log, 30), fps60: replay(r.log, 60), fps144: replay(r.log, 144), fps13: replay(r.log, 13), inputs: r.log.length }; },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）: ヨーヨー・手
    yoyoScreen: () => project(yoyoW.x, yoyoW.y, 0), handScreen: () => project(0, BASEY + game.H, 0),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, predictTug, game: () => game,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789回だがしラムネ氷いま！タップぱしっ自己ベスト更新'), document.fonts.load(`700 16px "Zen Kaku Gothic New"`, '連続ひものねじれここで伸びきる画面を下へシュッ速いほどよく回るタップでもそっと投げる')]), new Promise(r => setTimeout(r, 1500))]); } catch {}
resize();
buildStreet();   // 看板の文字にフォントを使うので、読み込みのあとで
newDemo();
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = 'ヨーヨーを持つ';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
