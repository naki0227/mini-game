<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 輪回しの 物理（three には 頼らない 自前。長さ m・時間 秒・速さ m/s・角度 rad） ----------
   輪: 半径 R の 細い 鉄の 輪（円環）。道に 沿った 道のり s と 横の 位置 x（右が +）、道に 対する 向き ψ（右が +）、速さ v、
     傾き φ（右が +）と 傾く 速さ ω、ころがる 輪の 曲がる 速さ（ヨー）yr、はねた ときの 高さ z と 上下の 速さ vz。
   ジャイロ: 傾いた 輪は 傾いた 側へ 曲がる（歳差）。つり合いの 曲がる 速さ yEq = g·sinφ /(2v)（円環: 遠心力と ジャイロが 半分ずつ）。
     実際の 曲がる 速さ yr は、輪が LR だけ ころがる 間に yEq へ 近づく（= 遅いほど 遅れる）。
   傾きの 運動（接地点まわり。円環の 慣性 1.5·m·R²）: ω' = A·(g·sinφ − 2·v·yr·(1 + ρ)) − (D0 + D1·v)·ω + 棒の 力 + でこぼこ
     ρ = RUP·v/(v + VUP): 速いほど 起き上がろうと する。遅いと yr の 遅れで ぐらぐら（ゆれが 大きく なって）倒れる。|φ| ≥ FALL で ぱたん。
   棒で 押す: 押している 間（子どもと 輪の 間が 棒の とどく 長さ以内）、前へ A_P·(1 − v/(走れる 速さ + 0.4))、
     押す 場所が 左右に ずれていれば その ぶん 横から 押して 傾ける（KL·向き。画面の 右 = 輪の 左がわを 押す = 右へ 傾く = 右へ 曲がる）。
     当てた 瞬間に「こん」（J0 の 前への ひと押しと、少しの ぶれ JN）。
     押しつづけると 棒が 輪を 持ち上げる 力が たまり（P。速いほど 早く たまる）、P ≥ 1 で 輪が はねる。はねて いる 間は 曲がれず、着地で 傾きが みだれる。
   道: ころがり抵抗 C0 + C2·v²（土・石畳・アスファルト）、坂は g·勾配/2（輪は ころがる ぶん 半分）、水たまりは 強く 減速、
     でこぼこ（石畳は ガタガタ）は 傾きを ゆらす。小石に のると はねて ぶれる。道の 外（側溝・玉砂利）に 出たら おしまい。
   子ども: 輪の 後ろを 走って ついていく（走れる 速さ U_MAX は だんだん つかれて 下がる。急には 止まれない）。
     輪が 速すぎると 棒が とどかない。輪が 急に 遅くなると 追いついて 足が 輪に 当たる（ぶれる）。
   電柱・自転車の おじさん・犬・人・止めて ある 自転車に 輪が 当たったら おしまい。
   記録 = 輪が 止まった（倒れて すべって 止まった）ところ までの 道のり。入力は すべて 時刻つき（画面の コマには よらない）。物理は 1/120 秒きざみ。 */
const PH = {
  DT: 1 / 120, G: 9.8, R: 0.3, A: 1 / (1.5 * 0.3),
  LR: 0.14, RUP: 0.5, VUP: 1.6, D0: 0.4, D1: 1.1, YMAX: 3,
  A_P: 2.7, KL: 5.5, J0: 0.12, JN: 0.35, PUSH_SIDE: 0.75, SIDE_T: 0.35,
  HOP_T: 0.9, HOP_V: 3, HOP_DEC: 3, HOP_VZ: 0.6, LAND_N: 1.2, LAND_PSI: 0.06,
  D_REACH: 1.4, D_PUSH: 1.1, D_TRAIL: 1.22, D_FOOT: 0.6, KG: 2.8, KA: 5.5, KB: 3.6,
  U0: 4.7, U_FAT: 1.0, U_FT: 150, U_FAT2: 0.9, V_LAUNCH: 1.7,
  FALL: 1.0, T_IDLE: 7, T_STOP: 0.8, V_STOP: 0.2,
  PUD: 1.9, PUD_N: 0.6, STONE_VZ: 0.12, STONE_K: 0.11, STONE_W: 0.6, STONE_HW: 0.07,
  HOOP_HW: 0.05,
};
const SURF = {
  dirt: { c0: 0.2, c2: 0.018, nz: 0.55, hopN: 0 },
  stone: { c0: 0.26, c2: 0.024, nz: 1.15, hopN: 0.5 },
  asphalt: { c0: 0.14, c2: 0.014, nz: 0.2, hopN: 0 },
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const gaussR = r => (r() + r() + r() + r() - 2) * 1.732;
const COURSE_END = 2200, DS = 0.5, LAP = 440;
// 区間（だれでも 同じ 道のりで 同じ 景色）: 田んぼの 道 → 神社の 参道（石畳）→ 商店街 → また 田んぼの 道（2周目からは きびしく）
function zoneAt(s) {
  const lap = Math.max(0, Math.floor(s / LAP)), u = s - lap * LAP;
  const k = u < 170 ? 'inaka' : u < 275 ? 'sando' : 'shoten';
  return { k, lap, u, hard: clampP(s / 420 + Math.max(0, s - 440) / 300, 0, 3) };
}
const courseCache = new Map();
function makeCourse(seed) {
  if (courseCache.has(seed)) return courseCache.get(seed);
  const R = mulberry((seed ^ 0x51ed270b) >>> 0), U = (a, b) => a + (b - a) * R();
  const N = Math.ceil(COURSE_END / DS) + 2;
  // 曲がり（曲率 κ: 右が +）を 区間ごとに。つなぎめは なめらかに
  const kap = new Float32Array(N), hw = new Float32Array(N), elev = new Float32Array(N);
  const ctrl = [];
  let s = 0, side = R() < 0.5 ? 1 : -1;
  ctrl.push({ s: 0, k: 0 }); s = 26; ctrl.push({ s, k: 0 });
  while (s < COURSE_END + 50) {
    const z = zoneAt(s), h = z.hard;
    let L, k;
    if (z.k === 'inaka') { L = U(14, 26) - h * 2; k = R() < 0.25 ? 0 : side * U(1 / 38, 1 / (20 - h * 4.5)) * (s < 60 ? 0.6 : 1); if (k) side = R() < 0.75 ? -side : side; }
    else if (z.k === 'sando') { L = U(18, 30); k = R() < 0.6 ? 0 : side * U(1 / 70, 1 / 40); side = -side; }
    else { L = U(16, 28) - h; k = R() < 0.45 ? 0 : side * U(1 / 50, 1 / (26 - h * 4)); side = -side; }
    const tr = Math.min(6, L * 0.4);
    ctrl.push({ s: s + tr, k }); ctrl.push({ s: s + L - tr, k });
    s += L;
  }
  let ci = 0;
  for (let i = 0; i < N; i++) {
    const ss = i * DS;
    while (ci < ctrl.length - 2 && ctrl[ci + 1].s <= ss) ci++;
    const a = ctrl[ci], b = ctrl[ci + 1], u = clampP((ss - a.s) / Math.max(1e-6, b.s - a.s), 0, 1);
    kap[i] = a.k + (b.k - a.k) * u * u * (3 - 2 * u);
    const z = zoneAt(ss);
    hw[i] = z.k === 'inaka' ? 1.3 - 0.08 * Math.min(2, z.lap) + 0.4 * clampP((70 - ss) / 40, 0, 1) : z.k === 'sando' ? 1.45 - 0.08 * Math.min(2, z.lap) : 1.55 - 0.08 * Math.min(2, z.lap);
  }
  // 道幅も なめらかに
  for (let pass = 0; pass < 3; pass++) for (let i = 1; i < N - 1; i++) hw[i] = (hw[i - 1] + hw[i] * 2 + hw[i + 1]) / 4;
  // 高さ（ゆるい 坂）: 田んぼの 道は ゆるい 起伏、参道は ゆるい のぼり、商店街は ほぼ 平ら
  const ph = [R() * 6.28, R() * 6.28, R() * 6.28];
  for (let i = 0; i < N; i++) {
    const ss = i * DS, z = zoneAt(ss), amp = (z.k === 'inaka' ? 1 : z.k === 'sando' ? 0.5 : 0.15) * clampP(ss / 60, 0, 1) * (0.8 + 0.25 * Math.min(2, z.lap));
    elev[i] = amp * (0.9 * Math.sin(ss / 21 + ph[0]) + 0.45 * Math.sin(ss / 9.5 + ph[1])) + 0.25 * Math.sin(ss / 47 + ph[2]);

        kid: { gapM: r2(g.s - g.sk), reach: PH.D_REACH, speed: r2(g.u), maxSpeed: r2(uMax(g)), touching: !!g.touch },
        surface: surfKind(g.s), zone: zoneAt(g.s).k, place: placeName(g.s), curvature: r3(kapAt(C, g.s)), slope: r3(slopeAt(C, g.s)),
        ahead: {
          obstacle: ob ? { kind: ob.o.kind, inM: r1(ob.p.s - g.s), x: r2(ob.p.x), moving: !!(ob.o.amp || ob.o.vb) } : null,
          stones: L_.stones.slice(0, 3).map(t => ({ inM: r1(t.s - g.s), x: r2(t.x) })),
          puddles: L_.puds.slice(0, 2).map(p => ({ inM: r1(Math.max(0, p.a - g.s)), lenM: r1(p.b - p.a), x0: r2(p.x0), x1: r2(p.x1) })),
          curvatureIn5m: r3(kapAt(C, g.s + 5)),
        },
        held: !!g.held, dir: r2(g.dir), pushes: g.pushes, hops: g.hops,
        next: opt.next === false ? undefined : nextOf(g),
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, now: Math.round(performance.now()),
      };
    },
    ui, inputs: () => inLog.slice(-30),
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [距離m ...]（'first' / 'good' / 'pro' / 'mash'（固定リズム）/ 'hold'（押しっぱなし）/ 'none'）
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(typeof skill === 'string' ? SKILLS[skill] : skill, (opts.seed0 ?? 1000) + i, opts).d),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const sk = typeof skill === 'string' ? SKILLS[skill] : skill;
      const R_ = Array.from({ length: N }, (_, i) => runBot(sk, (opts.seed0 ?? 1000) + i, opts)), d = R_.map(r => r.d), ends = {};
      for (const r of R_) ends[r.end] = (ends[r.end] || 0) + 1;
      return { skill: typeof skill === 'string' ? skill : 'custom', N, p10: q(d, 0.1), p25: q(d, 0.25), p50: q(d, 0.5), p75: q(d, 0.75), p90: q(d, 0.9), min: Math.min(...d), max: Math.max(...d), ge10: R_.filter(r => r.d >= 10).length / N, ge300: R_.filter(r => r.d >= 300).length / N, mean: r1(d.reduce((a, b) => a + b, 0) / N), gameSec50: r1(q(R_.map(r => r.t), 0.5)), gameSec90: r1(q(R_.map(r => r.t), 0.9)), gameSecMax: r1(Math.max(...R_.map(r => r.t))), hops50: q(R_.map(r => r.hops), 0.5), ends };
    },
    // 固定リズム: P 秒ごとに d 割 押す、押す 場所（x）も いつも 同じ。hold = 押しっぱなし。どれも 伸びないこと
    mashGrid: (N = 12) => {
      const out = [], one = (sk, nm) => { const d = Array.from({ length: N }, (_, i) => runBot(sk, 3000 + i).d); out.push({ ...nm, p50: q(d, 0.5), mean: r1(d.reduce((a, b) => a + b, 0) / N), max: Math.max(...d) }); };
      for (const P of [0.3, 0.45, 0.6, 0.8, 1.1]) for (const d of [0.1, 0.3, 0.5, 0.7, 0.9]) for (const x of [0, 0.1, 0.2, 0.3, 0.5, 1]) one({ kind: 'mash', P, d, x }, { kind: 'mash', period: P, holdFrac: d, dir: x });
      one({ kind: 'hold' }, { kind: 'hold' });
      return out.sort((a, b) => b.p50 - a.p50 || b.mean - a.mean);
    },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（frameQuantized は 時刻を 使わず コマの 時刻で 入れた 場合の くらべ）
    fpsCheck: (skill = 'good', seedR = 4242) => {
      const r = runBot(SKILLS[skill], seedR, { log: true });
      const e = r.t + 0.01;
      return { live: { d: r.d, end: r.end, t: r2(r.t) }, fps13: replay(r.log, seedR, 13, false, e), fps30: replay(r.log, seedR, 30, false, e), fps60: replay(r.log, seedR, 60, false, e), fps144: replay(r.log, seedR, 144, false, e), fps30frameQuantized: replay(r.log, seedR, 30, true, e), fps60frameQuantized: replay(r.log, seedR, 60, true, e), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; holdPtr = null; holdKey = null; if (game.held) gInput(game, game.t + 1e-6, 'up', 0); } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    screen: (x, y, z) => { const s = project(x, y, z); return { x: Math.round(s.x), y: Math.round(s.y) }; },
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, texs: renderer.info.memory.textures }),
    PH, SKILLS, SURF, makeGame, runBot, stepGame, gInput, makeBot, decide, makeCourse, game: () => game,
  };
}
