<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 WebGL（縁側の昼下がりの和室・畳の上の将棋盤と、並べた駒）+ 2D の演出レイヤー + HUD。タイトル/結果は下寄せのカード1枚 */
:root {
  --tatami: #4f5a34;     /* 畳の影 */
  --ink: #2a1d12;        /* 墨 */
  --paper: #f6eedb;      /* 障子紙 */
  --noren: #6b3a1f;      /* 将棋盤の脚・こげ茶 */
  --noren-ink: #f8ecd2;
  --gold: #e8b04a;       /* 昼下がりの日ざし */
  --red: #a8321f;        /* 成り駒の朱 */
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--tatami); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#gl, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { touch-action: none; cursor: grab; }
#fx:active { cursor: grabbing; }

.hud {
  position: fixed; right: 0; top: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.hud.left { right: auto; left: 0; align-items: flex-start; padding-right: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.pill {
  background: var(--noren); color: var(--noren-ink);
  border-radius: 6px; padding: 5px 10px 6px;
  font-variant-numeric: tabular-nums; line-height: 1.1; text-align: right;
  box-shadow: 0 2px 0 rgba(0,0,0,.3);
}
.hud.left .pill { text-align: left; }
.pill .lab { font-size: 10px; letter-spacing: .12em; opacity: .8; display: block; }
.pill .val { font-family: var(--font-display); font-size: 17px; }
.pill.next .val { font-size: 19px; }
#hLeft { font-size: 14px; }
.shake { width: 74px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); margin-top: 5px; overflow: hidden; }
.shake i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 3px; transition: width .3s; }
.shake.hot i { background: #e4643c; }

/* 倒すボタン（右下・親指の届くところ） */
.act {
  position: fixed; z-index: 30;
  right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: 86px; height: 86px; border-radius: 50%; padding: 0;
  font: 400 21px/1 var(--font-display); letter-spacing: .04em;
  background: var(--red); color: #fff4e0; border: 3px solid #f3dcb0;
  box-shadow: 0 4px 0 #5e1a0e, 0 8px 18px rgba(0,0,0,.35);
  display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
}
.act small { display: block; font: 700 10px/1 var(--font-body); letter-spacing: .1em; opacity: .85; margin-top: 4px; }
.act:active { transform: translateY(3px); box-shadow: 0 1px 0 #5e1a0e, 0 4px 10px rgba(0,0,0,.3); }
.act.ff { background: #3b4a2c; box-shadow: 0 4px 0 #1c2414, 0 8px 18px rgba(0,0,0,.35); font-size: 17px; }
.act.ff.on { background: #c8902e; color: #2a1d12; }
.act.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); } }
@media (prefers-reduced-motion: reduce) { .act.pulse { animation: none; } }
.act:focus-visible { outline: 3px solid #e0a43a; outline-offset: 3px; }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: end center; z-index: 40;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
  background: linear-gradient(to top, rgba(32, 26, 14, .55), rgba(32, 26, 14, 0) 70%);
  touch-action: none; cursor: pointer; overflow: hidden;
}
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);
  border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45);
  text-align: center; cursor: default;
}
.noren {
  background: var(--noren); color: var(--noren-ink);
  display: flex; gap: 3px;
  padding-top: 14px;
}
.noren span {
  flex: 1; background: var(--noren); border-bottom: 3px solid rgba(255,255,255,.1);
  font-family: var(--font-display); font-size: 30px; line-height: 1; padding-block: 6px 12px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2);
}
.noren.result { padding-top: 10px; }
.noren.result span { font-size: 24px; padding-block: 4px 10px; }
.body { padding: 14px 20px 16px; display: grid; gap: 10px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }
.score { font-family: var(--font-display); font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; justify-content: center; align-items: baseline; gap: 2px; white-space: nowrap; }
.score small { font-size: 20px; margin-left: 2px; }
.sub { margin: -4px 0 0; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meta { display: flex; justify-content: center; gap: 6px 16px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meta b { font-size: 16px; }
.badge {
  justify-self: center; background: var(--gold); color: #3a2410; font-weight: 700;
  font-size: 12px; letter-spacing: .14em; padding: 3px 10px; border-radius: 99px;
}
#over .lead { font-size: 13px; line-height: 1.55; }
#over .body { gap: 9px; padding-block: 12px 14px; }
.btns { display: grid; gap: 8px; }
.btns .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card button {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 8px;
  padding: 13px 16px; cursor: pointer;
  background: var(--noren); color: var(--noren-ink); box-shadow: 0 3px 0 #3a1e0e;
}
.card button:active { transform: translateY(2px); box-shadow: 0 1px 0 #3a1e0e; }
.card button:disabled { opacity: .6; cursor: progress; }
a.xbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  font-weight: 700; font-size: 16px; border-radius: 8px; padding: 13px 16px;
  background: #0f1419; color: #fff; box-shadow: 0 3px 0 #000;
}
a.xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
a.xbtn:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
a.xbtn svg { width: 16px; height: 16px; fill: currentColor; }
.card button.sub2 { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); padding-inline: 8px; font-size: 15px; }
.card button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
.how { font-size: 12px; opacity: .72; margin: 0; line-height: 1.6; }
.err { font-size: 13px; color: #b3361b; margin: 0; font-weight: 700; }
.back { font-size: 13px; color: var(--ink); opacity: .75; }
.back:hover { opacity: 1; }
@media (max-height: 700px) {
  .score { font-size: 40px; }
  .body { gap: 8px; padding-block: 12px 14px; }
  .card button, a.xbtn { padding-block: 10px; }
  .noren span { font-size: 26px; }
  .overlay { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 42px); }
}
@media (max-height: 600px) { #over .lead { display: none; } .how { font-size: 11px; } }
.hub-back {
  position: fixed; z-index: 60;
  left: calc(env(safe-area-inset-left, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  font: 700 12px/1 "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: .04em;
  padding: 7px 11px; border-radius: 99px; text-decoration: none;
  background: rgba(20, 18, 24, .55); color: #fff; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.hub-back:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
</style>

<div class="hud" id="hud" hidden>
  <div class="pill"><span class="lab">最高</span><span class="val" id="hBest">—</span></div>

        <div class="two"><button id="retryBtn">もう一回</button><button class="sub2" id="copyBtn">結果をコピー</button></div>
        <a class="xbtn" id="xBtn" href="https://x.com/intent/post" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Xでシェア</a>
      </div>
      <p class="how" id="copyMsg">画面タップ・スペースでもう一回</p>
      <a class="back" href="../../">← ほかのゲームを見る</a>

</div>

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';
let THREE, RAPIER;
try {
  const [t, r] = await Promise.all([import(THREE_URL), import(RAPIER_URL)]);
  THREE = t; RAPIER = r.default;
  await RAPIER.init();
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D/物理エンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 将棋倒しの物理（three には頼らない。Rapier の剛体だけ） ----------
   長さの単位は 1cm、重さの単位は g、重力は 981cm/s²（本物と同じ速さで倒れる）。
   畳の上に 1寸（3cm）の卓上将棋盤。駒は盤の上から並べはじめ、盤のふちで畳へ降りて、湯のみ・駒箱などをよけて曲がる。
   駒は五角形の板。凸包は Rapier 0.12 で接触が不安定な前例があるので、角を丸めた箱 2つ（下の太い胴・上の細い頭）で近似する。
   置くときは、指 2本（前と後ろ）で駒の頭をつまんで上からそっと下ろし（キネマティック）、床に着いたら離して（ふつうの剛体）、
   指を上へ抜く。前の駒との間が狭すぎると、指か駒そのものが前の駒に当たって押す → 倒れたら連鎖が始まってしまう（事故）。
   倒れたか・どこまで連鎖したかは Rapier の結果（駒の傾き）だけで決める。傾きが FALL 度より大きい駒が「倒れた」。
   立っている駒は置いて落ち着いたら眠らせる（解き方のゆらぎで勝手に歩いたり倒れたりしない）。眠っている駒は、ほかの駒が当たると起きる。
   ぜんぶ眠っている間は world.step() 自体を飛ばす（物理は何も変わらないので結果は同じ・軽い）。 */
const PH = {
  G: 981, DT: 1 / 240, ITERS: 4,
  MU: 0.45, MU_TATAMI: 0.6, MU_BOARD: 0.42, E: 0.05, DENS: 0.7, RAD: 0.04,
  BH: 3.0, BX: 16.5, BZ: 18,              // 盤の高さ（1寸）と半分の大きさ（33 × 36cm）。中心は原点
  ROOM: { x0: -46, x1: 318, z0: -136, z1: 136 },   // 畳の部屋（この外には置けない）
  START: { x: -12.5, z: 0, phi: Math.PI / 2 },     // 1枚目（盤の上・+x へ向かう）
  FALL: 40, ACC: 40,                       // 倒れた（度） / 並べている途中で、ほかの駒がこれ以上傾いたら事故（倒れた＝連鎖が始まった）
  LOWER_T: 0.14, LOWER_H: 0.8, OPEN_T: 0.04, OPEN_D: 0.12, LIFT_T: 0.12, LIFT_H: 3.2, SETTLE: 0.1, SETTLE_MAX: 1.6,
  FING_T: 0.34, FING_W: 0.6, FING_TOP: 0.45, FING_DOWN: 1.0,    // 指の厚み・幅・駒の頭からの上下
  GAP0: 1.2, GAP_MIN: 0, GAP_MAX: 4.2, TURN_MAX: 28 * Math.PI / 180,
  PUSH_T: 0.16, PUSH_D: 2.0, PUSH_R: 0.45,
  QUIET: 0.7, CHAIN_MAX: 150, SETS: 8,
  // 手のふるえ（並べた枚数 n が増えると、置くときに少しずれて・ゆらっと離してしまう）
  SHAKE0: 30, SHAKE_W0: 1.8, SHAKE_W: 0.00625, SHAKE_P: 0.0016, SHAKE_Y: 0.0005,
};
const DEG = Math.PI / 180;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const gaussOf = rnd => () => { let u = 0; for (let i = 0; i < 6; i++) u += rnd(); return (u - 3) / Math.sqrt(0.5); };
const yawQ = phi => ({ x: 0, y: Math.sin(phi / 2), z: 0, w: Math.cos(phi / 2) });
const fwd = phi => ({ x: Math.sin(phi), z: Math.cos(phi) });
const upY = q => 1 - 2 * (q.x * q.x + q.z * q.z);
const tiltDeg = q => Math.acos(Math.max(-1, Math.min(1, upY(q)))) / DEG;
function qRot(q, v) {
  const { x, y, z, w } = q;
  const ix = w * v.x + y * v.z - z * v.y, iy = w * v.y + z * v.x - x * v.z, iz = w * v.z + x * v.y - y * v.x, iw = -x * v.x - y * v.y - z * v.z;
  return { x: ix * w + iw * -x + iy * -z - iz * -y, y: iy * w + iw * -y + iz * -x - ix * -z, z: iz * w + iw * -z + ix * -y - iy * -x };
}
const GRP = { WORLD: 0x1, KOMA: 0x2, HELD: 0x4, HAND: 0x8 };
const groups = (member, filter) => ((member & 0xffff) << 16) | (filter & 0xffff);

/* ----- 駒の種類（本物の駒くらいの大きさ。幅 w・高さ h・厚み t（底）、cm） ----- */
const KOMA = {
  fu: { name: '歩', ch: '歩兵', back: 'と', w: 2.24, h: 2.62, t: 0.60, n: 18 },
  kyo: { name: '香', ch: '香車', back: '杏', w: 2.32, h: 2.70, t: 0.63, n: 4 },
  kei: { name: '桂', ch: '桂馬', back: '圭', w: 2.42, h: 2.78, t: 0.66, n: 4 },
  gin: { name: '銀', ch: '銀将', back: '全', w: 2.55, h: 2.90, t: 0.70, n: 4 },
  kin: { name: '金', ch: '金将', back: '', w: 2.55, h: 2.90, t: 0.70, n: 4 },
  kaku: { name: '角', ch: '角行', back: '馬', w: 2.68, h: 3.04, t: 0.75, n: 2 },
  hi: { name: '飛', ch: '飛車', back: '龍', w: 2.68, h: 3.04, t: 0.75, n: 2 },
  ou: { name: '王', ch: '王将', back: '', w: 2.80, h: 3.18, t: 0.80, n: 1 },
  gyoku: { name: '玉', ch: '玉将', back: '', w: 2.80, h: 3.18, t: 0.80, n: 1 },
};
const KINDS = Object.keys(KOMA);
// 形: 下の胴（幅 0.94w・高さ 0.72h・厚み t）と、上の頭（幅 0.56w・高さ 0.28h・厚み 0.76t）
function komaColliders(RAPIER, S) {
  const r = PH.RAD;
  return [
    RAPIER.ColliderDesc.roundCuboid(S.w * 0.47 - r, S.h * 0.36 - r, S.t / 2 - r, r).setTranslation(0, S.h * 0.36, 0),
    RAPIER.ColliderDesc.roundCuboid(S.w * 0.28 - r, S.h * 0.14 - r, S.t * 0.38 - r, r).setTranslation(0, S.h * 0.86, 0),

function runBot(RAPIER, sk, seed, opts = {}) {

/* ---------- 物理を進める（入力は時刻つきで記録して、物理の時刻で使う） ---------- */

  handleEvents();

/* ---------- 音（木の駒の音。低めにこもらせ、2kHz 以上は使わない） ---------- */

  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;

/* ---------- できごと（音・演出） ---------- */
function addPop(text, opt = {}) { pops = pops.filter(p => p.keep); pops.push({ text, life: 0, dur: opt.dur || 1.2, size: opt.size || 24, hot: !!opt.hot, keep: !!opt.keep, at: opt.at || null }); }

    else if (e.type === 'place' && loud) {

      const n = game.placed();
      if (n % 10 === 0) addPop(`${n}枚`, { size: 22 });
      if (n === PH.SHAKE0 + 30 && !botStart) { addPop('手が ふるえてきた…', { size: 18, hot: true, dur: 1.8 }); }

    else if (e.type === 'self' && loud) { sOops(); tipText = '置いた駒が ころんと倒れた（拾って もう一度）'; tipT = 1.8; }
    else if (e.type === 'push' && loud) { sPush(); }

addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (c === 'ArrowLeft' || c === 'ArrowRight') { e.preventDefault(); if (canAim()) aimTurn = clamp(aimTurn + (c === 'ArrowLeft' ? 1 : -1) * (e.shiftKey ? 1 : 3) * DEG, -PH.TURN_MAX, PH.TURN_MAX); return; }
    if (c === 'ArrowUp' || c === 'ArrowDown') { e.preventDefault(); if (canAim()) aimGap = clamp(aimGap + (c === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 0.02 : 0.1), PH.GAP_MIN, PH.GAP_MAX); return; }
    if (c === 'KeyF') { e.preventDefault(); if (game.phase === 'chain') { ff = !ff; updateHud(); } return; }
    if (c === 'Space' && !e.repeat) { e.preventDefault(); wakeAudio(); if (game.phase === 'over') toResult(); else if (game.phase === 'chain') { ff = !ff; updateHud(); } else tryPlace(evTime(e)); return; }
    if ((c === 'Enter' || c === 'NumpadEnter') && !e.repeat) { e.preventDefault(); wakeAudio(); if (game.phase === 'over') toResult(); else tryPush(evTime(e)); return; }
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last, rec.lastPlaced)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  const scr = (x, y, z) => { const p = project(x, y, z); return { x: Math.round(p.x), y: Math.round(p.y) }; };
  const r2 = v => Math.round(v * 100) / 100;
  const runN = (skill, N, opts) => Array.from({ length: N }, (_, i) => runBot(RAPIER, SKILLS[skill], (opts.seed0 ?? 1000) + i, opts));
  window.__shogidaoshi = {
    info: () => game && (() => { const C = game.phase === 'aim' ? game.cand(aimGap, aimTurn) : null; const L = game.last(); return {
      state, phase: game.phase, reason: game.reason, t: +game.t.toFixed(3), placed: game.placed(), fallen: game.fallen, score: game.score ?? null,
      next: game.nextKind(), left: game.bag.length - game.bagI, gap: r2(aimGap), turnDeg: r2(aimTurn / DEG), shake: r2(game.shake(game.placed()).w),
      cand: C && { x: r2(C.x), z: r2(C.z), on: C.on, bad: C.bad }, last: L && { x: r2(L.x), z: r2(L.z), on: L.on, kind: L.kind },
      asleep: game.asleep, awake: game.awake().length, inq: game.inq.length, selfFalls: game.selfFalls, bot: !!bot, botStart, ff, frozenView: frozen, stepMs: +stepMs.toFixed(3), lite, rec, seed: game.seed, lagS: +lagS.toFixed(3) }; })(),
    // 物理だけで N 回ぶん: sim('first', 30) → [倒れた枚数...]。opts.rate = 入力の時刻をコマ（Hz）に丸める、opts.seed0
    sim: (skill = 'first', N = 20, opts = {}) => runN(skill, N, opts).map(r => r.n),
    stats: (skill = 'first', N = 30, opts = {}) => {
      const R = runN(skill, N, opts), n = R.map(r => r.n), pl = R.map(r => r.placed);
      return { skill, N, rate: opts.rate || 'exact', p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge5: R.filter(r => r.n >= 5).length / N, ge80: R.filter(r => r.n >= 80).length / N, ge200: R.filter(r => r.n >= 200).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), placed50: q(pl, 0.5), accidents: R.filter(r => r.reason === 'accident').length, all: R.filter(r => r.n >= r.placed).length, msPerRun: Math.round(R.reduce((a, r) => a + r.ms, 0) / N) };
    },
    // 何もしないで sec 秒（全部の駒を起こして、物理をほんとうに回す）: 立っている駒が どれだけ動くか・倒れないか
    idle: (sec = 30) => {
      const L = game.standing(), p0 = L.map(c => ({ ...c.body.translation() }));
      for (const c of L) if (!c.fixed) c.body.wakeUp();
      const n = Math.round(sec / PH.DT); for (let i = 0; i < n; i++) { game.world.step(); game.t += PH.DT; }
      const mv = L.map((c, i) => { const p = c.body.translation(); return Math.hypot(p.x - p0[i].x, p.y - p0[i].y, p.z - p0[i].z); });
      const res = { sec, pieces: L.length, maxMove: +Math.max(0, ...mv).toFixed(5), maxTilt: +Math.max(0, ...L.map(c => game.tilt(c))).toFixed(3), fallen: L.filter(c => game.tilt(c) > PH.FALL).length, sleeping: L.filter(c => c.fixed || c.body.isSleeping()).length };
      for (const c of L) if (!c.fixed && game.phase === 'aim') c.body.sleep();
      t0 = performance.now() - (game.t + lagS) * 1000;
      return res;
    },
    // ボットの入力の列を記録して、13 / 30 / 60 / 144 fps のコマ割りで届けなおす（結果がそろうか）
    fpsCheck: (skill = 'first', seedR = 4242) => { const r = runBot(RAPIER, SKILLS[skill], seedR, { log: true }); return { live: { n: r.n, placed: r.placed, reason: r.reason }, fps13: replayLog(RAPIER, r.log, seedR, 13), fps30: replayLog(RAPIER, r.log, seedR, 30), fps60: replayLog(RAPIER, r.log, seedR, 60), fps144: replayLog(RAPIER, r.log, seedR, 144), inputs: r.log.length }; },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good', stop) => { if (game && state === 'play' && game.phase !== 'over') { bot = makeBot(SKILLS[skill], mulberry(nextSeed())); if (stop) bot.stopN = stop; botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; if (!on) t0 = performance.now() - (game.t + lagS) * 1000; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で操作するため）: 置く位置の候補・前の駒・連鎖の先頭・倒すボタン・押してよい場所
    candScreen: () => { const C = game.cand(aimGap, aimTurn); return C && scr(C.x, C.y + C.S.h / 2, C.z); },
    lastScreen: () => { const L = game.last(); return L && scr(L.x, L.y + L.s.h / 2, L.z); },
    frontScreen: () => { const f = game.front; if (!f) return null; const p = game.pOf(f); return scr(p.x, p.y, p.z); },
    pushBtn: () => { const r = $('pushBtn').getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2), visible: !$('pushBtn').hidden }; },
    tapPoint: () => ({ x: Math.round(W / 2), y: Math.round(H * 0.5) }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, KOMA, makeGame, runBot, makeBot, replayLog, game: () => game,
  };
}
