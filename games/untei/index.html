// ぱふ（手のひらで 棒を つかむ。響かない）
const sGrab = S_((n0, v, wet) => { noise(n0, 0.07, 0.07, 'lowpass', 340, 0.7, 420, 0.002); tone(120, n0, 0.08, 0.06, 'sine', 80, 0.002); if (wet) noise(n0 + 0.01, 0.1, 0.02, 'bandpass', 520, 0.8, 700, 0.004); });

const sKick = S_(n0 => noise(n0, 0.2, 0.016, 'bandpass', 460, 0.7, 760, 0.04));   // ふっ（息）
const sLet = S_(n0 => noise(n0, 0.06, 0.02, 'lowpass', 300, 0.7, 380, 0.004));
const sFail = S_((n0, why) => { if (why === 'slip') noise(n0, 0.18, 0.03, 'bandpass', 420, 0.8, 600, 0.01); else noise(n0, 0.1, 0.02, 'lowpass', 320, 0.7, 400, 0.01); });
// どさっ（砂場）
const sLand = S_(n0 => { tone(72, n0, 0.36, 0.13, 'sine', 40, 0.004); noise(n0, 0.3, 0.07, 'lowpass', 260, 0.7, 340, 0.004); noise(n0 + 0.03, 0.32, 0.03, 'bandpass', 420, 0.7, 640, 0.02); tone(196, n0 + 0.45, 0.6, 0.022, 'sine', 185, 0.03); tone(165, n0 + 0.7, 0.8, 0.022, 'sine', 155, 0.03); });
const sUp = S_(n0 => { tone(262, n0, 0.35, 0.03, 'sine', 262, 0.01); tone(330, n0 + 0.12, 0.35, 0.03, 'sine', 330, 0.01); tone(392, n0 + 0.24, 0.5, 0.03, 'sine', 392, 0.01); });
function sounds() {
  if (!amb || !ac) return;
  try {
    const g = game, on = (state === 'play' || state === 'over') && !frozen, now = ac.currentTime;
    amb.gain.setTargetAtTime(on ? 0.02 + 0.008 * Math.sin(tt * 0.4) : 0.0001, now, 0.4);
    ambF.frequency.setTargetAtTime(180 + 40 * Math.sin(tt * 0.27), now, 0.5);
    let sv = 0.0001;
    if (on && g && state === 'play' && (g.kid.ph === 'one' || g.kid.ph === 'reach')) { const w = Math.abs(g.kid.om); sv = 0.0001 + Math.min(0.045, 0.012 * w * w); swF.frequency.setTargetAtTime(200 + 40 * w, now, 0.05); }
    swish.gain.setTargetAtTime(sv, now, 0.05);
  } catch {}
}

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  requestAnimationFrame(frame);
  step(dt);
  render();
}

/* ---------- 入力: どこを 押しても 押して いる 間 こぐ・離すと 手を のばす。キーボード: スペース（Enter・↓・↑）---------- */
let holdPtr = null, holdKey = null, ptrDown = false;
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true;
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(HASH.has('seed') && !seedUsed ? (seedUsed = true, +HASH.get('seed') >>> 0) : nextSeed(), bn); frozen = false; shotNoUi = false;
  // #debug&skip=秒&pose=…: その秒数だけ一気に進めて 見せたい 姿勢で 止める（撮影用。bot が なければ good で 進めて 手を もどす。freeze=1 で止めたまま。ui=0 で 文字を 消す）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'swing');
  if (HASH.has('debug') && HASH.get('ff') === '1') ff = true;
}
let seedUsed = false;
function poseOk(g, pose) {
  const s = g.kid;
  if (pose === 'none') return true;
  if (pose === 'swing') return s.ph === 'one' && s.th > 0.3 && s.om > 0.3 && s.pump > 0;
  if (pose === 'reach') return s.ph === 'reach' && g.t - s.tr > 0.12;
  if (pose === 'two') return s.ph === 'two' && g.t - s.tG > 0.05;
  if (pose === 'fall') return s.ph === 'fall' && g.t - s.tF > 0.12;
  if (pose === 'down') return s.ph === 'down' && g.t - s.tEnd > 0.35;
  return true;
}
function skipTo(t1, pose = 'none') {
  const quiet = state; state = 'skip';
  const lim = t1 + 120;
  let tmp = false;
  if (!bot && pose !== 'fall' && pose !== 'down') { bot = makeBot(game, SKILLS.demo, mulberry(nextSeed())); tmp = true; }
  while (!game.over && game.t < lim) {
    physTick();
    if (game.t >= t1 && poseOk(game, pose)) break;
  }
  if (tmp) { bot = null; game.queue.length = 0; game.held = 0; game.kid.armed = 0; skipBot = true; }
  state = quiet;
  pops = []; overAt = game.over ? tt : -1;
  base = performance.now() / 1000 - game.t - LAG;
  camInit = true; vis.lastP = game.kid.p; vis.hasCom = false; vis.off.set(0, 0, 0);
  if (HASH.get('ui') === '0') shotNoUi = true;
  if (HASH.get('freeze') === '1') frozen = true;
}
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game || bot) return;
  if (game.over || game.kid.ph === 'fall' || game.kid.ph === 'down') { if (overAt >= 0) showOver(); return; }
  if (holdPtr != null || holdKey) return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  holdPtr = e.pointerId; ptrDown = true;
  input('down', evTime(e));
});
const ptrUp = e => {
  if (e.pointerId !== holdPtr) return;
  holdPtr = null; ptrDown = false;
  if (game) input('up', evTime(e));
};
addEventListener('pointerup', ptrUp);
addEventListener('pointercancel', ptrUp);
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
const HOLD_KEYS = ['Space', 'Enter', 'ArrowDown', 'ArrowUp', 'KeyS', 'KeyW'];
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (!HOLD_KEYS.includes(c)) return;
    e.preventDefault(); if (!game || bot) return;
    if (game.over || game.kid.ph === 'fall' || game.kid.ph === 'down') { if (overAt >= 0 && !e.repeat) showOver(); return; }
    wakeAudio();
    if (!e.repeat && !holdKey && holdPtr == null) { holdKey = c; input('down', evTime(e)); }
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});
addEventListener('keyup', e => { if (holdKey && e.code === holdKey) { holdKey = null; if (state === 'play') input('up', evTime(e)); } });
addEventListener('blur', () => { if (state === 'play' && game && (holdPtr != null || holdKey)) input('up', performance.now()); holdPtr = null; holdKey = null; ptrDown = false; });
$('startBtn').addEventListener('click', () => start());
$('retryBtn').addEventListener('click', () => start());
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  const mean = a => r2(a.reduce((x, y) => x + y, 0) / Math.max(1, a.length));
  const replay = (log, seedR, fps, quant = false, tEnd = 9999) => {
    const g = makeGame(seedR), L = log.slice().sort((a, b) => a.t - b.t); let i = 0, tNow = 0;
    while (!g.over && tNow < tEnd) {
      tNow += 1 / fps;
      while (i < L.length && L[i].t <= tNow) { const tq = quant ? tNow : L[i].t; gInput(g, Math.max(g.t + 1e-6, tq), L[i].kind, 0, tq); i++; }
      while (g.t + PH.DT <= tNow && !g.over) { stepGame(g); g.events.length = 0; }
    }
    return { n: scoreOf(g), end: g.end };
  };
  const rect = id => { const el = $(id); if (!el || el.closest('[hidden]') || el.hidden) return null; const r = el.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2), w: Math.round(r.width), h: Math.round(r.height) }; };
  const playXY = () => ({ x: Math.round(W / 2), y: Math.round(H * 0.62) });
  const ui = () => ({ state, W, H, start: rect('startBtn'), retry: rect('retryBtn'), copy: rect('copyBtn'), x: rect('xBtn'), hub: rect('hubBack'), tapAnywhere: { x: Math.round(W / 2), y: Math.round(H * 0.4) }, play: { ...playXY(), note: 'プレイ中は 画面の どこを 押しても 同じ（← 横丁 の 上は のぞく）。押して いる 間 こぐ、離すと 手を のばす' } });
  const wallMs = tg => Math.round((base + tg) * 1000 - performance.now());   // 物理の時刻 tg に効く入力を送るまでの、いまからのミリ秒
  // つぎの 操作の 目安（お手本 = 'next': 押して こぎ、はなす 時刻を 頭の 中の 物理で 試して、つかめる 窓（幅 0.15 秒 以上の いちばん 早い 窓）の まん中で はなす）。
  //   down: (x, y) を 押す（holdMs = はなす までの 目安。はなす 時刻は 押した あと 'up' で 出る）/ up: 離す（inMs 後）/
  //   wait: いまは 何もしない（まだ 物理に 入っていない 入力が あるあいだも 必ず wait）。windowMs = ずれても 大丈夫な 目安（±）
  let hint = { key: null, at: -9, v: null, tR: undefined };
  const nextOf = g => { const r = nextOfRaw(g); if (r.inMs !== undefined && r.action !== 'wait') r.atMs = Math.round(performance.now() + r.inMs); return r; };
  const nextOfRaw = g => {
    if (state !== 'play' || g.over) return { action: 'none', why: g.over ? 'over' : state };
    if (bot) return { action: 'none', why: 'bot' };
    const s = g.kid, xy = playXY();
    if (g.queue.length) { const last = g.queue[g.queue.length - 1]; return { action: 'wait', inMs: Math.max(0, wallMs(last.t)) + 20, why: 'pending', pending: last.kind }; }
    if (s.ph === 'fall' || s.ph === 'down') return g.held ? { action: 'up', inMs: 0, ...xy, why: 'release' } : { action: 'wait', inMs: 100, why: s.ph };
    if (s.ph === 'reach') return g.held ? { action: 'wait', inMs: 30, why: 'reach（押した まま つかめば そのまま こげる）' } : { action: 'wait', inMs: Math.max(20, wallMs(s.tr + PH.TR + PH.WG)), why: 'reach' };
    const te = Math.max(g.t, performance.now() / 1000 - base);
    if (!g.held || !s.armed) {
      if (g.held) return { action: 'up', inMs: 0, ...xy, why: 'stray' };
      const key = 'p' + s.p;
      if (hint.key !== key || performance.now() - hint.at > 150) {
        const tP = te + 0.09, iv = windows(planRel(g, tP, { wStop: 0.2 })), v = pickWin(iv, SKILLS.next.wMin);
        hint = { key, at: performance.now(), v, tP, tR: v ? winTime(v, 0.5) : tP + 1 };
      }
      return { action: 'down', inMs: Math.max(0, wallMs(hint.tP)), ...xy, holdMs: Math.round((hint.tR - hint.tP) * 1000), windowMs: 60, what: '押す（こぐ。離す 時刻は つぎの up で）' };
    }
    const key = 'h' + s.p + ':' + g.nPress;
    if (hint.key !== key || performance.now() - hint.at > 120) {
      const iv = windows(planRel(g, g.t, { wStop: 0.2 })), v = pickWin(iv.filter(w => w.b > te + 0.01), SKILLS.next.wMin, hint.key === key || hint.key === 'p' + s.p ? hint.tR : undefined);
      hint = { key, at: performance.now(), v, tR: v ? Math.max(te + 0.005, winTime(v, 0.5)) : te + 0.5 };
    }
    const v = hint.v;
    return { action: 'up', inMs: Math.max(0, wallMs(hint.tR)), ...xy, windowMs: v ? Math.round(v.w * 500) : 0, holdMs: 0, what: v ? '離す（手を のばす）' : '離す（つかめる 窓が 見つからない）' };
  };
  const statOf = (R_, key) => { const d = R_.map(r => r[key]); return { p10: q(d, 0.1), p25: q(d, 0.25), p50: q(d, 0.5), p75: q(d, 0.75), p90: q(d, 0.9), min: Math.min(...d), max: Math.max(...d), mean: mean(d) }; };
  window.__untei = {
    info: (opt = {}) => {
      if (!game) return { state };
      const g = game, s = g.kid, P = barAt(g, s.p), qi = s.ph === 'reach' ? s.q : nextIdx(g, s.p), Q = barAt(g, qi);
      return {
        state, t: r3(g.t), phase: s.ph, over: g.over, end: g.end, score: scoreOf(g), held: !!g.held, armed: !!s.armed,
        swing: { thDeg: r1(s.th * 57.3), om: r2(s.om), ampDeg: r1(ampOf(s) * 57.3), needDeg: r1(thetaMin(Q.x - P.x, Q.y - P.y) * 57.3), pumping: s.pump },
        grip: { now: r2(s.grip[s.h]), rest: r2(s.grip[1 - s.h]) },
        bar: { p: s.p, x: r2(P.x), y: r2(P.y) }, target: { q: qi, gap: r2(Q.x - P.x), dy: r2(Q.y - P.y), skip: qi - s.p > 1, loose: r3(Q.la), wet: !!Q.wet },
        grabs: g.grabs.slice(-5), reaches: g.nReach, presses: g.nPress,
        next: opt.next === false ? undefined : nextOf(g),
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, now: Math.round(performance.now()),
        note: 'th = 真下から 前向き＋の 角。ampDeg = いまの ゆれの 前の はし、needDeg = 次の 棒に 腕が とどく 角',
      };
    },
    ui, inputs: () => inLog.slice(-30),
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [本 ...]（'first' / 'good' / 'pro' / 'next' / 'mash' / 'hold' / 'none' / {kind:'fixed', a, h}）
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(typeof skill === 'string' ? SKILLS[skill] : skill, (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const sk = typeof skill === 'string' ? SKILLS[skill] : skill;
      const R_ = Array.from({ length: N }, (_, i) => runBot(sk, (opts.seed0 ?? 1000) + i, opts)), ends = {};
      for (const r of R_) ends[r.end] = (ends[r.end] || 0) + 1;
      return { skill: typeof skill === 'string' ? skill : 'custom', N, n: statOf(R_, 'n'), seconds: statOf(R_, 't'), ge3: R_.filter(r => r.n >= 3).length / N, ends };
    },
    // ゆれを 見ない 決まった 押し方（つかんでから a 秒で 押して h 秒で 離す・連打・押しっぱなし・何もしない）。どれも ふつうの 初めての 人より 伸びないこと
    mashGrid: (N = 24) => {
      const out = [], run = (nm, sk) => { const d = Array.from({ length: N }, (_, i) => runBot(sk, 3000 + i).n); out.push({ name: nm, p50: q(d, 0.5), mean: mean(d), max: Math.max(...d) }); };
      for (const a of [0, 0.3, 0.7]) for (let h = 0.2; h <= 4.01; h += 0.1) run(`fixed a=${a} h=${r1(h)}`, { kind: 'fixed', a, h });
      for (const [on, off] of [[0.06, 0.06], [0.1, 0.1], [0.15, 0.3], [0.3, 0.3], [0.5, 0.5], [0.8, 0.4], [1.0, 1.0], [1.5, 0.5]]) run(`mash ${on}/${off}`, { kind: 'mash', on, off });
      run('hold', SKILLS.hold); run('none', SKILLS.none);
      return out.sort((a, b) => b.p50 - a.p50 || b.mean - a.mean);
    },
    fpsCheck: (skill = 'good', seedR = 4242) => {
      const r = runBot(SKILLS[skill], seedR, { log: true }), e = r.t + 5;
      return { live: { n: r.n, end: r.end }, fps13: replay(r.log, seedR, 13, false, e), fps30: replay(r.log, seedR, 30, false, e), fps60: replay(r.log, seedR, 60, false, e), fps144: replay(r.log, seedR, 144, false, e), fps30frameQuantized: replay(r.log, seedR, 30, true, e), fps60frameQuantized: replay(r.log, seedR, 60, true, e), inputs: r.log.length };
    },
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { if (game.held) gInput(game, game.t + 1e-6, 'up', 0); holdPtr = null; holdKey = null; ptrDown = false; bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (sec, pose = 'none') => skipTo(game.t + sec, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, texs: renderer.info.memory.textures }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, makeBot, planRel, windows, thetaMin, barAt, game: () => game,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789本！はやすぎおそかったとどかないつるっ手が…2本先ぴたっ自己ベストこえはなして手をのばすこいで'), document.fonts.load(`700 16px "Zen Kaku Gothic New", sans-serif`, '0123456789にぎる力手がつかれてきた！押している間足をふってこぐ長押しでこごうゆれが大きくなるまで前にいちばんふれる少しはなして1本ぬけ→2本先へぐらぐらぬれてる高い')]), new Promise(r => setTimeout(r, 1500))]); } catch {}
