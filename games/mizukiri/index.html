<style>

}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--mist); color: var(--ink);

/* 下の準備パネル: 足元の石と、石の傾き */
.prep {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;

}

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 水切りの物理（three には頼らない。m・kg・s・rad。y=上、-z=沖） ----------
   石 = 半径 r・厚さ h の円盤。位置・速度・姿勢(クォータニオン)・角運動量 L を持つ。
   水面に触れている間だけ、沈んだ部分（円の欠片）の面積に応じて
   ・面に当たる水の圧力（揚力。石の面に垂直）・面をこする摩擦・縁で水をかき分ける抵抗
   が、その欠片の重心に働く。重心が石の中心からずれているので、トルクがかかる。
   スピンがあると L が大きく、トルクは石をひっくり返さずに「首振り（歳差）」に変わる（ジャイロ効果）。
   スピンが足りないと、跳ねるたびに石の前が下がっていき、やがて水に刺さって沈む。 */
const G = 9.81, RHO_W = 1000, RHO_A = 1.2;
const HAND = { x: 0.32, y: 0.85, z: 0 };   // 放す位置（腰を落としたサイドスロー）
const SHORE_Z = -1.1;                       // ここより沖が水
const WC = { LE: 4, CURV: 0.6, CL: 5.9, CF: 0.045, CP: 0.54, UP: 0.15, UPL: 2, VL: 6, TQ: 0.014, IRR: 0.027, SPIN: 0.45, PERP: 32, CNA: 1.1, CPA: 0.04 };
const PDT_AIR = 1 / 1500, PDT_WET = 1 / 6000;
const STONE_RHO = 2650;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// 石: r 半径, h 厚さ, fill 円柱に対するつまり具合（丸い石ほど小さい）, irr いびつさ
function makeStone(kind, r, h, fill, irr, look) {
  const m = STONE_RHO * Math.PI * r * r * h * fill;
  return { kind, r, h, fill, irr, m, flat: 1 - Math.min(0.7, Math.max(0, (h / (2 * r) - 0.14) * 2)), curv: Math.atan(WC.CURV * h / r), Is: m * r * r / 2 * (0.8 + 0.2 * fill), It: m * (r * r / 4 + h * h / 12), look };
}
// 今回の足元の石（毎回少し違う）
const KINDS = {
  flat:  { name: '平たい石',   note: '平たくて、ほどよい重さ' },
  thin:  { name: '薄い石',     note: '薄くて軽い。ふらつきやすい' },
  round: { name: '丸い石',     note: 'ころんと厚い' },
  heavy: { name: '重い石',     note: '大きくてずっしり' },
  small: { name: '小石',       note: '小さくて軽い' },
  plain: { name: 'ふつうの石', note: 'すこし厚め' },
};
function makeLineup(seed) {
  const R = mulberry(seed), u = (a, b) => a + (b - a) * R();
  const pick = [];
  // いつも並ぶ: 平たい石・丸い石・重い石。残り2つは日替わり
  const extra = ['thin', 'small', 'plain', 'flat', 'thin', 'plain'];
  const a = extra[Math.floor(R() * extra.length)];
  let b = extra[Math.floor(R() * extra.length)]; if (b === a) b = a === 'plain' ? 'small' : 'plain';
  const kinds = ['flat', 'round', a, 'heavy', b];
  for (const k of kinds) {
    let s;
    if (k === 'flat') s = makeStone(k, u(0.036, 0.044), u(0.0085, 0.011), u(0.72, 0.8), u(0, 0.25));
    else if (k === 'thin') s = makeStone(k, u(0.031, 0.037), u(0.0045, 0.006), u(0.74, 0.82), u(0.1, 0.4));
    else if (k === 'round') s = makeStone(k, u(0.026, 0.031), u(0.022, 0.028), u(0.52, 0.58), u(0, 0.2));
    else if (k === 'heavy') s = makeStone(k, u(0.05, 0.058), u(0.017, 0.021), u(0.66, 0.72), u(0.1, 0.4));
    else if (k === 'small') s = makeStone(k, u(0.019, 0.023), u(0.006, 0.0085), u(0.68, 0.76), u(0.2, 0.5));
    else s = makeStone(k, u(0.033, 0.04), u(0.013, 0.016), u(0.64, 0.72), u(0.2, 0.5));
    s.look = { hue: R(), shade: R(), seed: (R() * 2 ** 31) >>> 0, ox: u(0.85, 1.15) };
    pick.push(s);
  }
  return pick;
}
// その石をどのくらいの速さで投げられるか（重いほど遅く、軽すぎても力が乗らない）
function speedFactor(st) { const l = Math.log(st.m / 0.12); return Math.max(0.55, 1 - 0.2 * l * l); }
// 岩（水面から頭を出している）。当たると跳ね返ってそこで終わり
function makeRocks(seed) {
  const R = mulberry(seed ^ 0x51ab), rocks = [];
  for (let i = 0; i < 3; i++) {
    const side = i % 2 ? 1 : -1, z = -(11 + R() * 14 + i * 8), x = side * (3.2 + R() * 4 + (-z) * 0.07);
    rocks.push({ x, z, R: 0.5 + R() * 0.7, H: 0.25 + R() * 0.4 });
  }
  return rocks;
}
/* クォータニオン [x,y,z,w] */
function qRotY(q) { // q で (0,1,0) を回した向き
  const [x, y, z, w] = q;
  return [2 * (x * y - w * z), 1 - 2 * (x * x + z * z), 2 * (y * z + w * x)];
}
function qFromTo(a, b) { // a→b に回すクォータニオン（単位ベクトル）
  const d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  let cx = a[1] * b[2] - a[2] * b[1], cy = a[2] * b[0] - a[0] * b[2], cz = a[0] * b[1] - a[1] * b[0];
  const w = 1 + d; const l = Math.hypot(cx, cy, cz, w) || 1;
  return [cx / l, cy / l, cz / l, w / l];
}
function qMul(a, b) {
  return [a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1], a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0], a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3], a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]];
}
function qSpin(q, wx, wy, wz, dt) { // q ← exp(ω dt) q
  const a = Math.hypot(wx, wy, wz) * dt;
  if (a < 1e-12) return q;
  const s = Math.sin(a / 2) / (a / dt), c = Math.cos(a / 2);
  const r = qMul([wx * s, wy * s, wz * s, c], q);
  const l = Math.hypot(r[0], r[1], r[2], r[3]); r[0] /= l; r[1] /= l; r[2] /= l; r[3] /= l;

function splash(x, z, vx, vz, V, big = 1) {
  const n = Math.round(clamp(6 + V * 2.2, 6, 40) * big);
  const h = Math.hypot(vx, vz) || 1, fx0 = vx / h, fz0 = vz / h;

    // 横と後ろへ散る（石の進む向きに少し流れる）

  for (let i = 1; i <= 7; i++) {
    const d = 0.5 * i * i * 0.45 + 0.4, t = d / Math.max(3, a.v);
    const p = project(HAND.x + dir.x * d, HAND.y + dir.y * d - 4.9 * t * t, HAND.z + dir.z * d); if (!p.front) continue;
    fx.globalAlpha = 1 - i * 0.11; fx.beginPath(); fx.arc(p.x, p.y, 4.5 - i * 0.4, 0, Math.PI * 2); fx.fill();
  }
  fx.globalAlpha = 1;
  const inc = predictInc(a.v, a.elev) / DEG;
  const lx = drag ? clamp(px, 100, W - 100) : W / 2, lyy = drag ? py - 34 : H * 0.42;
  txt(`入射角 ${Math.round(inc)}°`, lx, lyy, 17 * sc, incColor(inc), 'rgba(24,34,40,.88)', 5, `700 ${FB}`);
  txt(`強さ ${a.v.toFixed(1)}m/s`, lx, lyy + 20, 13 * sc, '#f4efe4', 'rgba(24,34,40,.85)', 4, `700 ${FB}`);
  if (kb) txt(charge ? 'はなすと投げる' : 'スペース長押しで強さをためる', W / 2, H * 0.42 + 44, 13 * sc, '#f4efe4', 'rgba(24,34,40,.85)', 4, `700 ${FB}`);
}

/* ---------- 結果 ---------- */
const shareText = () => `🪨水切り ${res.skips}回跳ねた！（${m1(res.distR)}m）`;
function hintFor(r, a) {
  const f = r.firstIn, inc = f ? f.inc / DEG : 0, rev = a.spin / 2 / Math.PI;
  if (r.end.k === 'beach') return '足元に落ちた…もっと上へ、前へシュッと。';
  if (r.end.k === 'rock') return '岩に当たった。少し向きを変えてみよう。';
  if (r.skips >= 20) return '';
  if (['round', 'small'].includes(r.st.kind) && r.skips < 8) return `${KINDS[r.st.kind].name}は跳ねにくい。平たくて、ほどよく重い石を。`;
  if (inc > 31 && r.skips < 8) {
    if (a.elev > 5 * DEG) return `上に投げすぎて、入射角 ${Math.round(inc)}° と深く落ちた。点線のあたりで離して、水平に近く。`;
    if (a.elev < -6 * DEG) return `下に向けすぎて、入射角 ${Math.round(inc)}° と深く刺さった。点線のあたりで離して、水平に近く。`;
    return `入射角 ${Math.round(inc)}° は深い。速く投げるほど浅く（20°くらいに）入る。`;
  }
  if (rev < 7 && r.skips < 12) return `回転が足りない（${rev.toFixed(0)}回転/秒）。離す直前にクイッと曲げると、よく回って傾きが崩れない。`;
  if (tilt >= 26) return `石の傾き ${tilt}° は大きすぎ。15°前後がよく跳ねる。`;
  if (tilt <= 6) return `石の傾き ${tilt}° だと前が刺さりやすい。15°前後に。`;
  if (a.v < 9) return 'もっと速く投げると、跳ねる回数がぐっと増える。';
  if (rev < 12) return 'クイッとひねって回転を増やすと、さらに伸びる。';
  return '';
}
function showOver() {
  if (state !== 'play' || phase === 'fly' || phase === 'ready') return;
  if (phase === 'sunk' || phase === 'view') { if (pt < res.t) { pt = res.t; playEvents(res, pt, false); } }
  state = 'over';
  const r = res, a = lastAim;
  $('oScore').textContent = r.skips; $('oDist').textContent = `${m1(r.distR)}m`;
  const f = r.firstIn;
  $('oMsg').textContent = `${KINDS[r.st.kind].name}（${Math.round(r.st.m * 1000)}g）・初速 ${a.v.toFixed(1)}m/s・入射角 ${f ? Math.round(f.inc / DEG) : '—'}°・傾き ${tilt}°・${(a.spin / 2 / Math.PI).toFixed(0)}回転/秒`;
  const h = hintFor(r, a); $('oHint').hidden = !h; $('oHint').textContent = h;
  $('oBest').textContent = rec.best; $('oLong').textContent = m1(rec.longest); $('oThrows').textContent = rec.throws;
  $('newRec').hidden = !wasNew;
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({ text: `${shareText()}${wasNew && rec.throws > 1 ? ' 自己ベスト！' : ''}\n`, url: gameUrl(), hashtags: '水切り' });
  $('copyMsg').textContent = '画面タップ・スペースでもう一回';
  $('over').hidden = false; $('hud').hidden = true; $('prep').hidden = true;
  overShownAt = performance.now();
  $('retryBtn').focus({ preventScroll: true });
}

/* ---------- シェア ---------- */
// 公開先のURL。ローカルで開いたときもこれをシェアする
const PUBLIC_URL = 'https://asobi.enludus.com/games/mizukiri/';
function gameUrl() {
  try {
    if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost') return location.origin + location.pathname;
  } catch {}
  return PUBLIC_URL;
}

/* ---------- HUD ---------- */
function updateHud() { $('hBest').textContent = rec.throws ? rec.best : '—'; }
function fillTitle() { $('tBest').textContent = rec.throws ? rec.best : '—'; $('tLong').textContent = rec.longest ? m1(rec.longest) : '—'; $('tThrows').textContent = rec.throws; }

/* ---------- 音（低めでやわらかく。2kHz以上は使わない） ---------- */
let ac = null, master = null, noiseBuf = null, amb = null;
function wakeAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = 0.5;
      master = ac.createDynamicsCompressor(); master.threshold.value = -16; master.ratio.value = 5;
      master.connect(lp).connect(ac.destination);
      const len = ac.sampleRate * 2; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); let b = 0;
      for (let i = 0; i < len; i++) { b = b * 0.82 + (Math.random() * 2 - 1) * 0.18; d[i] = b * 2.2; }   // 丸めたノイズ（低め）
      ambStart();
    }
    if (ac.state === 'suspended') ac.resume();
  } catch {}
}
const live = () => ac && state === 'play';
function tone(freq, at, dur, vol, type = 'sine') {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
  return o;
}
function noise(at, dur, vol, type, freq, q = 1, atk = 0.006) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + atk); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(lp).connect(g).connect(master); s.start(at, Math.random() * 1.5); s.stop(at + dur + 0.05);
  return { f, g };
}
// せせらぎ: 低いノイズをゆっくり揺らす + ときどき「ちゃぷ」
function ambStart() {
  try {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 0.4;
    const g = ac.createGain(); g.gain.value = 0.05;
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.13; lg.gain.value = 0.02; lfo.connect(lg).connect(g.gain); lfo.start();
    s.connect(f).connect(g).connect(master); s.start();
    amb = { g };
    const lap = () => {
      try {
        if (ac.state === 'running' && !document.hidden) {
          const n0 = ac.currentTime, fr = 230 + Math.random() * 160;
          const o = tone(fr, n0, 0.09, 0.012 + Math.random() * 0.01); o.frequency.exponentialRampToValueAtTime(fr * 1.5, n0 + 0.07);
          noise(n0, 0.12, 0.018, 'bandpass', 380 + Math.random() * 200, 1.2);
        }
      } catch {}
      setTimeout(lap, 700 + Math.random() * 2200);
    };
    setTimeout(lap, 1200);
  } catch {}
}
function sWhoosh(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 18, 0, 1), { f } = noise(n0, 0.26, 0.12 + k * 0.12, 'bandpass', 300, 1.3, 0.03); f.frequency.exponentialRampToValueAtTime(700 + k * 500, n0 + 0.12); f.frequency.exponentialRampToValueAtTime(380, n0 + 0.26); } catch {} }
// 跳ねる「チャッ」「ピチャ」: 速いうちは少し明るく大きく、遅くなるとやわらかく小さく
function sSkip(V, n) {
  try {
    if (!live()) return;
    const n0 = ac.currentTime, k = clamp(V / 14, 0.1, 1);
    const { f } = noise(n0, 0.05 + 0.05 * k, 0.1 + 0.22 * k, 'bandpass', 650 + 650 * k, 1.6, 0.003);
    f.frequency.exponentialRampToValueAtTime(380 + 300 * k, n0 + 0.06);
    noise(n0 + 0.01, 0.12, 0.05 + 0.08 * k, 'lowpass', 520, 0.7, 0.008);
    const o = tone(300 + 200 * k + (n % 3) * 18, n0, 0.06, 0.03 * k); o.frequency.exponentialRampToValueAtTime(180, n0 + 0.06);
  } catch {}
}
function sPlop() { try { if (!live()) return; const n0 = ac.currentTime; const o = tone(260, n0, 0.28, 0.12); o.frequency.exponentialRampToValueAtTime(110, n0 + 0.25); noise(n0, 0.22, 0.12, 'lowpass', 600, 0.7); } catch {} }
function sRock() { try { if (!live()) return; const n0 = ac.currentTime; tone(180, n0, 0.12, 0.12, 'triangle'); noise(n0, 0.08, 0.15, 'bandpass', 900, 2); } catch {} }
function sBeach() { try { if (!live()) return; const n0 = ac.currentTime; noise(n0, 0.1, 0.16, 'bandpass', 700, 1.5); noise(n0 + 0.07, 0.08, 0.08, 'bandpass', 600, 1.5); } catch {} }
function sTick(f) { try { if (!ac) return; tone(clamp(f, 180, 600), ac.currentTime, 0.08, 0.05, 'triangle'); } catch {} }
function sChime(n) { try { if (!live()) return; const n0 = ac.currentTime + 0.1, base = n >= 15 ? 392 : n >= 8 ? 349 : 294; tone(base, n0, 0.45, 0.07); tone(base * 1.25, n0 + 0.1, 0.55, 0.06); } catch {} }
function sFanfare() { try { if (!live()) return; const n0 = ac.currentTime + 0.1; [[392, 0], [494, 0.12], [587, 0.24], [784, 0.4]].forEach(([f, t]) => { tone(f, n0 + t, 0.5, 0.07); tone(f / 2, n0 + t, 0.5, 0.04); }); } catch {} }

/* ---------- ループ ---------- */
let acc = 0, lastTs = performance.now(), frozen = false;
function frame(ts2) {
  const el = Math.min(100, ts2 - lastTs); acc += el; lastTs = ts2;
  let k = 0;
  while (acc >= 1000 / 60 && k < 4) { step(1 / 60); acc -= 1000 / 60; k++; }
  if (k >= 4) acc = 0;
  if (!frozen) render(k / 60);   // カメラもゲームの時間と同じだけ進める
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function start() {
  wakeAudio(); state = 'play'; demo = null; demoStone.visible = false;
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  newGame();
}
function skipToResult() { if (state === 'play' && (phase === 'sunk' || phase === 'view') && phaseT > 0.25) showOver(); }
// 入力の時刻は、処理が遅れても実際に触れた時刻で測る
const evT = e => (e.timeStamp > 0 && Math.abs(e.timeStamp - performance.now()) < 5000) ? e.timeStamp : performance.now();
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play') return;
  if (phase === 'sunk' || phase === 'view') { skipToResult(); return; }
  if (phase !== 'ready') return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  drag = { x0: e.clientX, y0: e.clientY, id: e.pointerId, pts: [{ x: e.clientX, y: e.clientY, t: evT(e) }] }; kb = null; charge = null;
});
addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.id) { drag.pts.push({ x: e.clientX, y: e.clientY, t: evT(e) }); if (drag.pts.length > 80) drag.pts.splice(0, drag.pts.length - 80); }
});
addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const lp = drag.pts[drag.pts.length - 1];
  const tu = evT(e);
  if (Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 2) drag.pts.push({ x: e.clientX, y: e.clientY, t: tu });
  else if (tu - lp.t > 1200) drag.pts.push({ x: lp.x, y: lp.y, t: tu });   // 長く止めてから離したら、はじいていない（描画が重い端末の遅れは許す）
  const a = aimFromDrag(drag, true);
  drag = null;
  if (a.ok && state === 'play' && phase === 'ready') throwNow(a);
  else if (state === 'play' && phase === 'ready' && Math.hypot(e.clientX - a.x0, e.clientY - a.y0) > 12) pops.push({ text: 'もっと速く、上へシュッと！', life: 0, dur: 1.3, size: 20, small: true });
});
addEventListener('pointercancel', () => { drag = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
addEventListener('keydown', e => {
  if (state === 'play') {
    if (e.target && e.target.closest && e.target.closest('input, button') && e.code !== 'Space' && !e.code.startsWith('Arrow')) return;
    if (phase === 'ready') {
      const keys = { ArrowLeft: ['yaw', -1.5 * DEG], ArrowRight: ['yaw', 1.5 * DEG], ArrowUp: ['elev', 2 * DEG], ArrowDown: ['elev', -2 * DEG] };
      if (keys[e.code]) {
        e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        if (!kb) kb = { elev: -2 * DEG, yaw: 0 };
        const [k, d] = keys[e.code]; kb[k] += d;
        kb.elev = clamp(kb.elev, -45 * DEG, 32 * DEG); kb.yaw = clamp(kb.yaw, -0.35, 0.35);
        return;
      }
      if (e.code === 'KeyW') { setTilt(tilt + 1); return; }
      if (e.code === 'KeyS') { setTilt(tilt - 1); return; }
      if (/^Digit[1-5]$/.test(e.code)) { setStone(+e.code.slice(5) - 1); return; }
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault(); wakeAudio();
        if (e.repeat || charge) return;
        if (!kb) kb = { elev: -2 * DEG, yaw: 0 };
        charge = { t: 0, k: 0 };
      }
      return;
    }
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); skipToResult(); }
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('keyup', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && charge && state === 'play' && phase === 'ready') {
    const st = lineup[sel], v = (3 + charge.k * 18) * speedFactor(st), tw = 0.6;
    const a = { v, vb: 3 + charge.k * 18, elev: kb.elev, yaw: kb.yaw, tilt: tilt * DEG, tw, spin: spinOf(v, tw) };
    charge = null; throwNow(a);
  }
});
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText()} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  window.__mizukiri = {
    info: () => ({ pt, tt, state, phase, sel, tilt, kind: lineup[sel] && lineup[sel].kind, lineup: lineup.map(s => ({ kind: s.kind, m: s.m, r: s.r, h: s.h })), res: res ? { skips: res.skips, dist: res.dist, end: res.end, t: res.t, contacts: res.contacts.length } : null, shown: shownSkips, rec }),
    throwWith: a => { const st = lineup[sel]; const v = a.v != null ? a.v : a.vb * speedFactor(st); return throwNow({ v, vb: a.vb || v, elev: (a.elev || 0) * DEG, yaw: (a.yaw || 0) * DEG, tilt: tilt * DEG, tw: a.tw || 0, spin: spinOf(v, a.tw || 0) }); },
    setStone, setTilt, lastAim: () => lastAim, freeze: b => { frozen = !!b; }, scene, camera, makeLineup, simulate, speedFactor, spinOf, ROCKS, WC,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([document.fonts.load(`40px "Dela Gothic One"`), new Promise(r => setTimeout(r, 1500))]); } catch {}
buildBeach(); buildRocks();
updateMarker();
toReady();
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = '石を投げにいく';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>

// プレイ中でもゲーム一覧に戻れるボタン。押してもゲームの入力（タップ・ドラッグ）に伝わらないようにする

</script>
