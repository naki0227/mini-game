<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try { THREE = await import(THREE_URL); } catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 長縄の物理（three には頼らない） ----------
   長さは m、時間は秒。y が上。回し手の手は x = ±HX、跳ぶ子は原点で +z（手前）を向いて立つ。
   縄: N 個の質点を、長さ一定のばね（硬いばね＝距離の拘束を ITER 回なおす）でつないだ鎖。Verlet 積分、1/500 秒きざみ。
     重力・空気抵抗（−DRAG|v|v）・地面（めりこまない、こすれて遅くなる）。両端は回し手の手に固定。
     手は (z, y) = (−HR sin θ, HC − HR cos θ) の小さな円をまわる。縄は遅れてついてきて、遠心力で大きくふくらみ、
     いちばん下で地面を打ち（ぱしん）、前から後ろへ 足もとをくぐる。
   回すテンポ: 1回転の長さ P(u)（u = 回した回数）。だんだん速く（P0 → P1）、ときどきゆっくり（何回転か P が長く）、
     たまに揺れ（その1回転の中で 速さが ぐっと変わる）。どれも seed から1回転ずつ決まる（先読みしても同じ）。
   跳ぶ子: 押した瞬間に足が地面を離れる（初速 V0）。押している間（HOLD 秒まで、上がっている間）は 重力が GH に弱まる
     ＝ 長く押すほど高く・長く跳ぶ。着地のあと REC 秒は ひざを曲げていて跳べない（その間・着地の直前 BUF 秒に押せば、跳べるようになった瞬間に跳ぶ）。
     体は 足（かかと→つま先）・すね・もも・胴・頭 のカプセル。縄の線分がカプセルに触れたら 引っかかり（失敗）。
     足が地面にあるときに 縄が足もとの地面を打つと、足のカプセルに必ず触れる（＝ 踏んだ）。
   回数: 縄のまん中の点が、低いところを かかとの後ろ（COUNT_Z）まで くぐりぬけたら 1回。 */
const PH = {
  G: 9.8, DT: 1 / 500,
  N: 25, HX: 1.8, HC: 1.05, HR: 0.36, LEN: 4.2, RR: 0.012, DRAG: 0.15, ITER: 6, GF: 0.35,
  TH0: 1.3, READY: 0.9, RAMP: 0.6, HR_UP: 0.45, UP_REV: 1.5,
  P0: 1.12, P1: 0.5, PK: 50,
  FX: 0.085, V0: 1.5, GH: 3.2, HOLD: 0.22, REC: 0.08, BUF: 0.1,
  FOOT_R: 0.035, SHIN_R: 0.045, THIGH_R: 0.06, TORSO_R: 0.13, HEAD_R: 0.1,
  COUNT_Z: -0.16, LOW: 0.6, SLAP_V: 1.5,
};
const TAU = Math.PI * 2;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = k => k * k * (3 - 2 * k);
// 入力は時刻つきで入れる（画面のコマとは関係なく、物理はその時刻で効く）
function gInput(g, t, type, a = 0) { const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, { t, type, a }); }

// テンポ表: k 回転目の「ゆっくり」と「揺れ」。1回転ずつ順に決める（先読みの複製とも共有）
function revOf(S, k) {
  while (S.revs.length <= k) {
    const i = S.revs.length, r = S.rnd, prev = S.revs[i - 1];
    let slow = 1, h = 0, left = prev ? prev.left - 1 : 0;
    if (left > 0) slow = prev.slow;
    else if (i >= 14 && r() < 0.07) { slow = 1.13 + 0.1 * r(); left = 3 + Math.floor(r() * 3); }
    else left = 0;
    if (i >= 5 && left <= 0 && r() < Math.min(0.3, 0.06 + 0.003 * i)) {
      const m = Math.min(0.34, 0.1 + 0.12 * r() + 0.0012 * i);
      h = r() < 0.5 ? m : -m * 0.6;
    }
    S.revs.push({ slow, h, left, ph: r() });
  }
  return S.revs[k];
}
function periodAt(S, u) {
  const k = Math.max(0, Math.floor(u)), f = u - k, a = revOf(S, k), b = revOf(S, k + 1);
  const base = PH.P1 + (PH.P0 - PH.P1) * Math.exp(-u / PH.PK);
  const wave = 1 + 0.035 * Math.sin(TAU * u / 9 + S.ph1);
  const slow = a.slow + (b.slow - a.slow) * smooth(f);
  const s = Math.sin(Math.PI * f);
  return base * wave * slow * (1 + a.h * s * s);
}
function makeRope() {
  const N = PH.N;
  return { x: new Float64Array(N), y: new Float64Array(N), z: new Float64Array(N), ox: new Float64Array(N), oy: new Float64Array(N), oz: new Float64Array(N) };
}
function cloneRope(R) { return { x: R.x.slice(), y: R.y.slice(), z: R.z.slice(), ox: R.ox.slice(), oy: R.oy.slice(), oz: R.oz.slice() }; }
// 手の位置（左 = −x、右 = +x）を H[0..2] に
const HP = new Float64Array(3);
function handPos(S, side, H = HP) {
  const th = S.th + (side > 0 ? 0.05 * Math.sin(0.8 * S.t + S.ph2) : 0);
  const hc = PH.HC + 0.025 * Math.sin(1.1 * S.t + S.ph2 + side);
  // 回しはじめは 腕を大きくまわして 縄を持ち上げる
  const up = (S.th - PH.TH0) / TAU / PH.UP_REV, hr = PH.HR + (up < 1 ? PH.HR_UP * (1 - smooth(Math.max(0, up))) : 0);
  H[0] = side * PH.HX; H[1] = hc - hr * Math.cos(th); H[2] = -hr * Math.sin(th);
  return H;
}
// 回し手（テンポ）を dt 進める
function stepHands(S, dt) {
  let w;
  if (S.stop) { S.w *= Math.exp(-dt * 5); w = S.w; }
  else if (S.t < PH.READY) w = 0;
  else {
    const ramp = clampP((S.t - PH.READY) / PH.RAMP, 0, 1);
    w = TAU / periodAt(S, (S.th - PH.TH0) / TAU) * (0.25 + 0.75 * smooth(ramp));
  }
  S.w = w; S.th += w * dt;
}
// 縄を dt 進める（本番も先読みも同じ）。地面を打った速さ（x が まん中寄りの点のうち最大）を返す
const IW = new Float64Array(64);
function stepRope(S, dt) {
  const R = S.rope, N = PH.N, seg = PH.LEN / (N - 1), dt2 = dt * dt, G = PH.G, cd = PH.DRAG, X = R.x, Y = R.y, Z = R.z, OX = R.ox, OY = R.oy, OZ = R.oz;
  for (let i = 1; i < N - 1; i++) {
    const vx = (X[i] - OX[i]) / dt, vy = (Y[i] - OY[i]) / dt, vz = (Z[i] - OZ[i]) / dt;
    const sp = Math.sqrt(vx * vx + vy * vy + vz * vz), c = Math.min(cd * sp * dt, 0.5), k = 1 - c;
    OX[i] = X[i]; OY[i] = Y[i]; OZ[i] = Z[i];
    X[i] += vx * k * dt; Y[i] += vy * k * dt - G * dt2; Z[i] += vz * k * dt;
  }
  let H = handPos(S, -1);
  OX[0] = X[0]; OY[0] = Y[0]; OZ[0] = Z[0]; X[0] = H[0]; Y[0] = H[1]; Z[0] = H[2];
  H = handPos(S, 1);
  OX[N - 1] = X[N - 1]; OY[N - 1] = Y[N - 1]; OZ[N - 1] = Z[N - 1]; X[N - 1] = H[0]; Y[N - 1] = H[1]; Z[N - 1] = H[2];
  const pin = S.pin, w = IW;
  for (let i = 0; i < N; i++) w[i] = 1;
  w[0] = 0; w[N - 1] = 0; if (pin) { w[pin.i] = 0; X[pin.i] = pin.x; Y[pin.i] = pin.y; Z[pin.i] = pin.z; }
  for (let it = 0; it < PH.ITER; it++) {
    // 端から交互に（片寄らないように）
    const fwd = (it & 1) === 0;
    for (let j = 0; j < N - 1; j++) {
      const i = fwd ? j : N - 2 - j, wa = w[i], wb = w[i + 1], ws = wa + wb;
      if (ws === 0) continue;
      const dx = X[i + 1] - X[i], dy = Y[i + 1] - Y[i], dz = Z[i + 1] - Z[i];
      const L = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-9, d = (L - seg) / (L * ws);
      const ka = d * wa, kb = d * wb;
      X[i] += dx * ka; Y[i] += dy * ka; Z[i] += dz * ka;
      X[i + 1] -= dx * kb; Y[i + 1] -= dy * kb; Z[i + 1] -= dz * kb;
    }
  }
  // 地面: めりこまない。打ったら こすれて遅くなる
  let slap = 0;
  const RR = PH.RR, gf = 1 - PH.GF;
  for (let i = 1; i < N - 1; i++) {
    if (Y[i] < RR) {
      const vy = (Y[i] - OY[i]) / dt;
      if (-vy > slap && X[i] < 0.9 && X[i] > -0.9) slap = -vy;
      Y[i] = RR; OY[i] = RR + (vy < 0 ? -vy : 0) * dt * 0.08;   // ほんの少しだけ はねる
      OX[i] = X[i] - (X[i] - OX[i]) * gf; OZ[i] = Z[i] - (Z[i] - OZ[i]) * gf;
    }
  }
  return slap;
}
// まん中の点（x ≈ 0）
const MID = (PH.N - 1) / 2;

// 跳ぶ子の体（足の高さ fy、ひざの曲がり c）→ カプセルの列 [ax,ay,az, bx,by,bz, r, 部位]

  if (g.n === 0 && g.t < PH.READY + 0.9 && help) {

  if (h.part === 'head' || h.part === 'torso') return { noren: 'あたった', msg: `縄が ${part}に当たった。跳ぶのが早すぎて、上から来る縄に ぶつかった。` };
  switch (g.fail) {
    case 'early': return { noren: 'ふんだ', msg: n === 0 ? '跳ぶのが早くて、着地したところに 縄が来た。もう少し 引きつけて。' : '跳ぶのが早くて、降りたところで 縄をふんだ。「ぱしん」の 少し前に。' };
    case 'late': return { noren: 'ぱたっ', msg: `跳ぶのが遅くて、${part}に 縄が当たった。縄が地面を打つ 少し前に 跳ぼう。` };
    case 'air': return { noren: 'ぱたっ', msg: 'まだ空中にいるときに 押していた。着地してから、次の縄に合わせて。' };
    case 'high': return { noren: 'ぱたっ', msg: '高く跳びすぎて、次の縄に 間に合わなかった。速くなったら 短く ちょん。' };
  }
  return { noren: 'ぱたっ', msg: n === 0 ? 'まだ0回。縄が足もとに来る ちょっと前に、タップで ぴょん。' : '跳ぶのが間に合わなかった。縄の影が 足もとに来る前に。' };
}

  if (!botStart) { rec.plays++; rec.total += n; rec.last = n; if (isNew) rec.best = n; save(); }
  $('oScore').textContent = n;
  const F = failMsg();
  $('oMsg').textContent = F.msg;
  $('oNoren').innerHTML = F.noren.split('').map(c => `<span>${c}</span>`).join('');
  $('oBest').textContent = rec.best; $('oTotal').textContent = rec.total; $('oPlays').textContent = rec.plays;
  $('newRec').hidden = !(isNew && n > 0 && !botStart);
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({ text: `${shareText(n)}${isNew && rec.plays > 1 && n > 0 ? ' 自己ベスト！' : ''}\n`, url: gameUrl(), hashtags: '長縄跳び' });

/* ---------- 音（縄が地面を打つ低い「ぱしん」・風切りの「ひゅん」・引っかかった「ぱたっ」。2kHz 以上は使わない。最後に 1.9kHz のローパス） ---------- */

function wakeAudio() {

      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 300; f.Q.value = 1.1;

}
const live = () => ac && state === 'play';

  } catch {}
}
function tone(freq, at, dur, vol, type = 'sine', f1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at); if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
  return o;
}
function noise(at, dur, vol, type, freq, q = 1, lpf = 1100) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpf;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(lp).connect(g).connect(master); s.start(at, Math.random() * 1.0); s.stop(at + dur + 0.05);
  return f;
}
// 縄が地面を打つ「ぱしん」: 土を打つ こもった音と、低い どすん
function sSlap(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 6, 0.35, 1.1); noise(n0, 0.06, 0.2 * k, 'bandpass', 520, 1.3, 1000); noise(n0, 0.03, 0.12 * k, 'lowpass', 300); tone(105, n0, 0.09, 0.12 * k, 'sine', 62); } catch {} }
// 足音（跳ぶ・降りる）: ごく低く
function sStep(k) { try { if (!live()) return; const n0 = ac.currentTime; tone(150, n0, 0.06, 0.06 * k, 'sine', 90); noise(n0, 0.03, 0.05 * k, 'lowpass', 340); } catch {} }
// 数えるたびに 小さな木の「ぽん」（10回ごとに 少し大きく）
function sCount(n) { try { if (!live()) return; const n0 = ac.currentTime + 0.02, big = n % 10 === 0; tone(big ? 392 : 330, n0, 0.12, big ? 0.05 : 0.03, 'triangle'); } catch {} }
// 引っかかった「ぱたっ」: 縄が足を打つ音と、ひもが落ちる音
function sCaught() { try { if (!live()) return; const n0 = ac.currentTime; noise(n0, 0.07, 0.22, 'bandpass', 420, 1.2, 900); tone(170, n0, 0.12, 0.1, 'triangle', 95); noise(n0 + 0.12, 0.1, 0.1, 'lowpass', 380); tone(262, n0 + 0.4, 0.14, 0.05, 'triangle'); tone(196, n0 + 0.56, 0.45, 0.06, 'sine', 160); } catch {} }
function sChime(big) { try { if (!live()) return; const n0 = ac.currentTime + 0.08; const seq = big ? [[523, 0], [659, 0.1], [784, 0.2], [1046, 0.32]] : [[523, 0], [659, 0.1], [784, 0.2]]; seq.forEach(([f, t]) => tone(f, n0 + t, 0.4, 0.045)); } catch {} }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  step(dt);
  render(Math.max(dt, 1 / 240));
  updateWhoosh();
  requestAnimationFrame(frame);
}

/* ---------- 入力: 押す＝跳ぶ（押している長さで高く）。時刻つきで物理へ ---------- */
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(nextSeed(), bn); frozen = false; setMileLevel(0); petals = []; keyDown = false; ptrId = null;
  for (const k of watchers) { k.on = k.want; }
  updateHud();
  // #debug&skip=秒: はじめにその秒数だけ一気に進め、見栄えのいい瞬間で止める（OGP 撮影・確認用。bot=good と組み合わせる。freeze=1 で止めたまま）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'front');
  if (HASH.has('debug') && HASH.get('ff') === '1') ff = true;   // #debug&ff=1: ずっと早送り（長いプレイの確認用。結果は同じ）
}
// pose=front: 跳び上がったところで、縄が 前から降りてくる瞬間 / under: 縄が足の下をくぐる瞬間 / top: 縄が頭の上 / arc: 縄が前の高いところで大きな弧（跳ぶ直前）
function poseOk(g, pose) {
  const R = g.rope, z = R.z[MID], y = R.y[MID], vz = R.z[MID] - R.oz[MID];
  if (pose === 'front') return !g.ground && g.vy > 0.2 && z > 0.45 && y > 0.35 && y < 0.8 && vz < 0;
  if (pose === 'under') return !g.ground && z < 0.12 && z > -0.02 && y < 0.15 && vz < 0;
  if (pose === 'top') return y > 1.8 && Math.abs(z) < 0.15;
  if (pose === 'arc') return g.ground && y > 1.2 && y < 1.7 && z > 0.5 && R.y[MID] < R.oy[MID];
  return true;
}
function skipTo(t1, pose = 'none') {
  const quiet = state; state = 'skip';
  const lim = t1 + 30;
  while (game.phase !== 'over' && game.t < lim) {
    physStep();
    if (game.t >= t1 && poseOk(game, pose)) break;
  }
  state = quiet;
  pops = []; failAt = game.phase === 'over' ? tt : -1; shake = 0; countFx = null;
  setMileLevel(MILES.filter(m => m <= game.n).length);
  for (const k of watchers) { k.on = k.want; }
  if (mileLevel >= 3 && !reduceMotion) for (let i = 0; i < 22; i++) petals.push({ x: Math.random() * W, y: Math.random() * H * 0.8, vx: -14 - Math.random() * 22, vy: 26 + Math.random() * 30, r: Math.random() * 6, ph: Math.random() * 6 });
  base = performance.now() / 1000 - game.t;
  if (HASH.get('freeze') === '1') frozen = true;
}
function press(ms) {
  if (state !== 'play' || !game) return;
  if (game.phase === 'over') { if (failAt >= 0 && tt - failAt > 0.4) showOver(); return; }
  input('down', ms);
}
function release(ms) { if (state === 'play' && game && game.phase !== 'over') input('up', ms); }
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (ptrId != null && ptrId !== e.pointerId) return;   // 2本目の指は数えない
  ptrId = e.pointerId;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  press(evTime(e));
});
const ptrUp = e => { if (e.pointerId !== ptrId) return; ptrId = null; release(evTime(e)); };
addEventListener('pointerup', ptrUp);
addEventListener('pointercancel', ptrUp);
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: スペース / ↑ / W = 跳ぶ（押している長さで高く）
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (!game) return;
    if (game.phase === 'over') { if ((c === 'Space' || c === 'Enter') && !e.repeat && failAt >= 0 && tt - failAt > 0.4) { e.preventDefault(); showOver(); } return; }
    if (JUMP_KEYS.includes(c)) { e.preventDefault(); if (e.repeat || keyDown) return; keyDown = true; wakeAudio(); press(evTime(e)); return; }
    if (c === 'Enter') e.preventDefault();
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code) && keyDown) { keyDown = false; release(evTime(e)); } });
addEventListener('blur', () => { if (keyDown || ptrId != null) { keyDown = false; ptrId = null; release(performance.now()); } });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ入力（時刻つき）の列を、fps コマ割りで物理に流しなおす（入力はそのコマで届くが、物理はその時刻で効く）
  const replay = (log, seedR, fps) => {
    const g = makeGame(seedR); let i = 0, tNow = 0;
    while (g.phase === 'play' && tNow < 900) {
      tNow += 1 / fps;
      // 記録の時刻はボットが入れたときの物理の時刻（その次の刻みで効いた）。同じ刻みで効くように半刻みだけ後ろへ
      while (i < log.length && log[i].t <= tNow) { gInput(g, Math.max(g.t, log[i].t + PH.DT * 0.5), log[i].type); i++; }
      while (g.t + PH.DT <= tNow) { stepGame(g); g.events.length = 0; }
    }
    return { n: g.n, t: +g.t.toFixed(3), fail: g.fail };
  };
  const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;
  const scr = (x, y, z) => { const p = project(x, y, z); return { x: Math.round(p.x), y: Math.round(p.y) }; };
  window.__nawatobi = {
    info: () => {
      if (!game) return null;
      const g = game, R = g.rope, P = g.pred, ideal = idealJump(g);
      return {
        state, phase: g.phase, t: r3(g.t), n: g.n, fail: g.fail, hit: g.hit,
        // 縄が 足もとに来るまで（物理の先読み・秒）: toe = つま先の前、mid = 足のまん中、heel = かかとの後ろ。jumpIn = ちょんと跳ぶとよい時刻まで
        ropeIn: P && P.mid != null ? r3(P.mid - g.t) : null, toeIn: P && P.toe != null ? r3(P.toe - g.t) : null, heelIn: P && P.heel != null ? r3(P.heel - g.t) : null, jumpIn: ideal != null ? r3(ideal - g.t) : null,
        period: g.w > 0.5 ? r3(TAU / g.w) : null, rev: r2((g.th - PH.TH0) / TAU),
        ropeMid: { x: r2(R.x[MID]), y: r2(R.y[MID]), z: r2(R.z[MID]) },
        body: { fy: r3(g.fy), vy: r2(g.vy), ground: g.ground, held: g.held, c: r2(g.c) },
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, queue: g.queue.length, presses: g.presses,
      };
    },
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [回数...]（'first' / 'good' / 'mash'（一定間隔の連打。{mash:秒}）/ 'rhythm'（はじめのテンポのまま））
    sim: (skill = 'good', N = 30, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'good', N = 50, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n);
      const kinds = {}, parts = {}; for (const r of R) { kinds[r.fail] = (kinds[r.fail] || 0) + 1; parts[r.part] = (parts[r.part] || 0) + 1; }
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge2: R.filter(r => r.n >= 2).length / N, ge10: R.filter(r => r.n >= 10).length / N, ge50: R.filter(r => r.n >= 50).length / N, ge100: R.filter(r => r.n >= 100).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), kinds, parts };
    },
    // ボットの入力の列を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（結果がそろうか）
    fpsCheck: (skill = 'first', seedR = 4242) => { const r = runBot(SKILLS[skill], seedR, { log: true }); return { live: { n: r.n, fail: r.fail, t: +r.t.toFixed(3) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), inputs: r.log.length }; },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）: 跳ぶ子の足・頭、縄のまん中、回し手の手、押してよい場所（画面のまん中。← 横丁 や 最高 にかからない）
    feetScreen: () => scr(0, game.fy, 0.03), headScreen: () => scr(0, game.fy + 1.3, 0),
    ropeMidScreen: () => { const R = game.rope; return scr(R.x[MID], R.y[MID], R.z[MID]); },
    handScreen: (side = 1) => { const R = game.rope, i = side < 0 ? 0 : PH.N - 1; return scr(R.x[i], R.y[i], R.z[i]); },
    tapPoint: () => ({ x: Math.round(W / 2), y: Math.round(H * 0.55) }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, predictPass, airOf, game: () => game,
  };
}

try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789回いーちにーさんしごろくはちくじゅうぱたっふんだあたったいま！タップでぴょん自己ベスト更新はやくするよゆっくり〜'), document.fonts.load(`700 16px "Zen Kaku Gothic New"`, '跳んだ回縄が足もとに来たらせーの…いま！みんなで数えてくれる見ている子が来た桜の花びらが舞う校庭じゅうが見ているまだまだ跳べる短くちょんと跳ぶ着地してから押す空中')]), new Promise(r => setTimeout(r, 1500))]); } catch {}
resize();
buildWorld();
newDemo();
state = 'title';
fillTitle(); updateHud();
