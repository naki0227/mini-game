<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 玉入れの 物理（three には 頼らない 自前。長さ m・速さ m/s・時間 秒・角度 rad） ----------
   座標: ポールの 根もとが 原点、y = 上、投げる 子は ＋z がわ（カメラは その うしろ）。
   かご: ふち（輪）の 中心 C(t)。高さ H、半径 R。ふちは 太さ RT の 輪（トーラス）、その 下に 深さ ND の 網の 袋（下へ すぼまる）。
     ポールは 根もと → 袋の 底。ポールは 風や ぶつかる 子で ゆれて、かごが 横（と 少し 前後）に 動く（時刻の 関数）。
   玉: 半径 BR の 布の 玉。重力・空気の 抵抗（布なので 少し 大きめ）・風。ふち・網・ポール・地面・ほかの 子の 玉と ぶつかる
     （布なので はねかえりは 小さい）。ふちの 面を 上から 内がわへ 通ったら 袋の 中。袋の 中で 止まれば「入った」。
     地面に ついたら はずれ（= おしまい）。袋の 中の 玉は 底に たまって（heap）、底が 少しずつ 浅く なる。
   投げ方: 押した 点 → 離した 点 の ひっぱり（画面の 上 向きが 0）。向き a = ねらい（カメラの 向き ＋ a）、長さ L = 強さ
     （速さ = V0 + VK·L）。上へ 投げる 角（仰角）は 立つ 場所ごとに 決まる。離した 時刻に 手から 玉が 出る。
   入力は すべて 時刻つき（画面の コマには よらない）: down / up(a, L)。物理は 1/240 秒きざみ。 */
const PH = {
  DT: 1 / 240, G: 9.8, BR: 0.042, RT: 0.014, ND: 0.42, NBR: 0.6, PR: 0.036,
  KD: 0.02, ERIM: 0.3, FRIM: 0.85, ENET: 0.1, EGND: 0.3, EPOLE: 0.3, EBB: 0.5,
  HREL: 1.32, FWD: 0.18, V0: 2.8, VK: 7.5, LMIN: 0.08, LMAX: 1.2, CBK: 2.7,
  T_CHEER: 0.7, T_WALK: 1.0, T_WIND: 0.9, T_MISS: 1.0, T_FLYMAX: 5, T_SET: 0.12, VSET: 0.5, NPC_SLOT: 0.2,
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash2 = (a, b) => { let h = Math.imul((a ^ 0x9e3779b9) | 0, 0x85ebca6b) ^ Math.imul((b + 0x632be5ab) | 0, 0xc2b2ae35); h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; return h >>> 0; };
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const smoothP = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const r2p = v => Math.round(v * 100) / 100;
// かごの 大きさ: 10 個 ごとに ひとまわり 小さく
const rimR = n => { const k = Math.floor(n / 10); return Math.max(0.165, 0.35 - 0.032 * Math.min(4, k) - 0.011 * Math.max(0, k - 4)); };
const heapH = h => PH.ND * 0.6 * (1 - Math.exp(-h / 40));
// n 球目の 立ち位置・かごの 高さ・ゆれ・風・ほかの 子の 玉の 多さ・ぶつかる 子（seed と n で 決まる）
function stanceOf(seed, n) {
  const r = mulberry(hash2(seed, n * 31 + 7)), u = Array.from({ length: 14 }, r);
  const H = 2.6 + 1.3 * (1 - Math.exp(-n / 28)) + 0.004 * Math.max(0, n - 45) + (n ? (u[0] - 0.5) * 0.24 : 0);
  const elev = 1.36 - 0.1 * (1 - Math.exp(-n / 10)), Dmin = Math.max(1.4, 3.2 * (H - PH.HREL) / Math.tan(elev));
  const spread = n === 0 ? 0 : Math.min(2.0, 0.9 + 0.03 * n);
  const D = n === 0 ? 1.55 : Dmin + spread * u[1];
  const sideMax = n === 0 ? 0 : Math.min(0.8, 0.2 + 0.02 * n);
  const phi = (u[2] * 2 - 1) * sideMax;
  const X = D * Math.sin(phi), Z = D * Math.cos(phi);
  const amp = n < 4 ? 0 : Math.min(0.32, 0.009 * (n - 3) + 0.0001 * (n - 3) * (n - 3)) * (0.55 + 0.9 * u[3]);
  const ampZ = amp * 0.45 * u[4];
  let wx = 0, wz = 0;
  if (n >= 7 && u[5] < Math.min(0.85, 0.35 + 0.012 * n)) { const w = Math.min(1.1, 0.25 + 0.02 * (n - 7)) * (0.5 + 0.5 * u[6]); wx = (u[7] < 0.5 ? -1 : 1) * w; wz = (u[8] - 0.5) * 0.4 * w; }
  const npc = n < 6 ? 0 : Math.min(1.8, 0.35 + 0.035 * (n - 6));
  const bump = n >= 9 && u[9] < Math.min(0.55, 0.18 + 0.01 * (n - 9)) ? { dt: 0.5 + 2.4 * u[10], a: (0.1 + Math.min(0.12, 0.002 * n)) * (u[11] < 0.5 ? -1 : 1), dz: (u[12] - 0.5) * 0.6 } : null;
  const camX = X * 0.6 + 0.55, camZ = Z + PH.CBK, lookX = X * 0.15, lookZ = Z * 0.2;
  const camYaw = Math.atan2(lookX - camX, -(lookZ - camZ));
  return { n, H, R: rimR(n), D, X, Z, phi, elev, amp, ampZ, wx, wz, npc, bump, camX, camZ, lookX, lookZ, camYaw };
}
// かごの ふちの 中心（時刻 t）
function posAt(g, t, o) {
  const W = g.W, s = g.sw, k = smoothP((t - s.t0) / 1.6), ax = s.a0 + (s.a1 - s.a0) * k, az = s.z0 + (s.z1 - s.z0) * k;
  let x = ax * (Math.sin(W.w1 * t + W.p1) + 0.3 * Math.sin(W.w3 * t + W.p3)) / 1.3, z = az * Math.sin(W.w2 * t + W.p2);
  for (const b of g.bumps) { const u = t - b.t; if (u > 0 && u < 7) { const e = b.a * Math.exp(-u / 1.4) * Math.sin(W.wb * u); x += e; z += e * b.dz; } }
  const h = g.hc, kh = smoothP((t - h.t0) / h.d);
  o.x = x; o.z = z; o.y = h.h0 + (h.h1 - h.h0) * kh;
  return o;
}
const heightAt = (g, t) => { const h = g.hc; return h.h0 + (h.h1 - h.h0) * smoothP((t - h.t0) / h.d); };
const _pb = { x: 0, y: 0, z: 0 };
function basket(g, t, o) { posAt(g, t, o); posAt(g, t - 0.004, _pb); o.vx = (o.x - _pb.x) / 0.004; o.vy = (o.y - _pb.y) / 0.004; o.vz = (o.z - _pb.z) / 0.004; o.R = g.R; return o; }
function windAt(g, t) { const w = g.wd, k = smoothP((t - w.t0) / PH.T_WIND); g.wx = w.x0 + (w.x1 - w.x0) * k; g.wz = w.z0 + (w.z1 - w.z0) * k; }
function newBall(x, y, z, vx, vy, vz, own, t, col = 0) { return { x, y, z, vx, vy, vz, own, st: 'fly', inB: 0, wasIn: 0, rim: 0, pole: 0, hitBall: 0, cross: 0, cx: 0, cz: 0, tS: 0, t0: t, tG: 0, col, id: 0 }; }
// 速さの 反射（相手の 速さ c を 引いて から。e = はねかえり、fr = すべりの のこり）
function bounce(b, nx, ny, nz, cvx, cvy, cvz, e, fr) {
  let rx = b.vx - cvx, ry = b.vy - cvy, rz = b.vz - cvz;
  const vn = rx * nx + ry * ny + rz * nz;
  if (vn >= 0) return 0;
  let tx = rx - vn * nx, ty = ry - vn * ny, tz = rz - vn * nz;
  rx = tx * fr - e * vn * nx; ry = ty * fr - e * vn * ny; rz = tz * fr - e * vn * nz;
  b.vx = rx + cvx; b.vy = ry + cvy; b.vz = rz + cvz;
  return -vn;
}
// 手から 出る 玉（a = ねらい、L = 強さ）

      const out = [], run = (nm, sk) => { const d = Array.from({ length: N }, (_, i) => runBot(sk, 3000 + i).n); out.push({ name: nm, p50: q(d, 0.5), mean: mean(d), max: Math.max(...d) }); };
      for (const a of [-0.3, 0, 0.3]) for (let L = 0.2; L <= 1.0001; L += 0.04) run(`fixed a=${a} L=${r2(L)}`, { kind: 'fixed', a, L, d: 0.3, h: 0.3 });
      for (let L = 0.3; L <= 0.9001; L += 0.02) run(`aimPole L=${r2(L)}`, { kind: 'fixed', aimPole: 1, L, d: 0.3, h: 0.3 });
      for (const [on, off] of [[0.06, 0.06], [0.1, 0.1], [0.2, 0.2], [0.5, 0.5]]) run(`mash ${on}/${off}`, { kind: 'mash', on, off });
      run('hold', SKILLS.hold); run('none', SKILLS.none);
      return out.sort((a, b) => b.p50 - a.p50 || b.mean - a.mean);
    },
    fpsCheck: (skill = 'good', seedR = 4242) => {
      const r = runBot(SKILLS[skill], seedR, { log: true }), e = r.t + 5;
      return { live: { n: r.n, end: r.end }, fps13: replay(r.log, seedR, 13, false, e), fps30: replay(r.log, seedR, 30, false, e), fps60: replay(r.log, seedR, 60, false, e), fps144: replay(r.log, seedR, 144, false, e), fps30frameQuantized: replay(r.log, seedR, 30, true, e), fps60frameQuantized: replay(r.log, seedR, 60, true, e), inputs: r.log.length };
    },
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { if (game.held) gInput(game, game.t + 1e-6, 'up', 0, 0); ptr.id = null; ptr.down = false; kb.down = false; bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (sec, pose = 'none') => skipTo(game.t + sec, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, texs: renderer.info.memory.textures }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, makeBot, plan, solve, probe, stanceOf, game: () => game,
  };
}
