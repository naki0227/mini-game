<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));
const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 紙風船の物理（自前。three には頼らない） ----------
   長さは m、時間は秒。正面から見た平面（x: 右＝縁側のほう、y: 上。畳が y=0、天井が CEIL）。
   紙風船: 半径 R0 の球。紙の重さ MP。中の空気は浮力と打ち消しあうので「重さ」は紙だけ、でも「動かしにくさ」は
     紙 + 中の空気 + まわりの空気（付加質量 ADD）。空気抵抗 ½ρ Cd A |v−風|(v−風)。とても軽くて抵抗が大きいので、
     ふわっと上がって ゆっくり落ちる（終端速度 ≒ 1.7 m/s）。
   空気の量 air（1 = ぱんぱん）。打つたびに少し抜け（強く打つほど 2乗で多く抜ける）、じわじわもれる（LEAK）。
     抜けると 半径 ∝ air^(1/3)、空気を受ける面積 ∝ air^AEXP（へこんで しわが寄る）、中の空気も減る
     → 落ちるのが速く・動かしやすく・はね返りがにぶくなり（反発 E_HIT × (0.55 + 0.45 air)）、
     打った向きが へこみの当たり方で それる（DEF × (1−air)^1.5 × sin(2 × 当たった所の向き + くせ)）。
   手のひら: 押した所に出る（届く範囲 X_LIM・Y_MIN〜Y_MAX。ちゃぶ台・猫の上では それより下に入らない）。
     押しているあいだ「ため」、はなすと T_SW 秒で上へ振りぬく。振りの速さ vs = V0 + (V1−V0)(1 − e^(−ため/TAU_H))、
     手は sin の速さで動く。手のひらは 半径 RC のゆるい凸面（幅 ±PW）で、風船の中心が手の中心からずれると
     法線が かたむいて 斜めに飛ぶ。衝突は 相対速度の法線成分を 反発係数で返し、接線はまさつ MU で回転に。
     押したまま（振っていない）手に落ちてくると「ぱふ」と はねるだけ（E_STILL。空気が少し抜ける。回数にならない）。
   息（ふーっ）: ボタンを押しているあいだ、子どもの口（MOUTH_Y）から上へ息。風船が口の真上に近いほど よく届き
     （幅 BL_W0 + BL_WK×高さ、強さ 1/(1+(高さ/BL_L)²)）、口の穴が下を向いているほど 空気が入る（BL_R）。少しだけ持ち上げる（BL_F）。
     吹いているあいだは 手が出せない（押すと 吹くのをやめて手を出す）。息は BREATH 秒ぶん、BR_REC で回復。
   そよ風: 縁側（右）から左へ。強さは つくほど増え、ゆっくり うねる（3つの sin。seed で位相）。
   ちゃぶ台（左）・ランプのかさ（天井から）・天井・左右の壁。ときどき猫が畳の上を通る（風船が近づくと ちょいっと はたく）。
   畳に風船の下がついたら おしまい。ちゃぶ台の上に落ちても おしまい。空気が AIR_DEAD を切ると ぺしゃんこで おしまい。
   入力はすべて時刻つき（画面のコマには よらない）。1/240 秒きざみ。 */
const PH = {
  DT: 1 / 240, G: 9.8,
  R0: 0.14, MP: 0.0055, RHO: 1.2, CD: 0.55, ADD: 0.5, AEXP: 0.95, SPIN_D: 0.35,
  CEIL: 2.36, WALL: 1.22, E_WALL: 0.35, E_CEIL: 0.3,
  LAMP_X: 0.42, LAMP_Y: 1.96, LAMP_R: 0.19, E_LAMP: 0.45,
  TBL_X: -0.74, TBL_R: 0.3, TBL_Y: 0.33, TBL_CLR: 0.06,
  X_LIM: 1.12, Y_MIN: 0.12, Y_MAX: 1.2, PW: 0.11, RC: 0.3,
  V0: 0.8, V1: 5.8, TAU_H: 0.55, T_SW: 0.16, T_FT: 0.22, VF: 0.75, HOLD_MAX: 1.5, HAND_REST: 0.3, VP_MIN: 0.25,
  E_HIT: 0.5, E_STILL: 0.2, MU: 0.3, TILT_C: Math.cos(34 * Math.PI / 180), TILT_S: Math.sin(34 * Math.PI / 180),
  TBL_N: 12,
  CAP_K: 0.0014, CAP_MIN: 0.35, L0: 0.014, L_SAFE: 4.2, L1: 0.008, L_TOUCH: 0.012, L_CEIL: 0.02, L_LAMP: 0.012, L_CAT: 0.03, LEAK: 0.0015, AIR_DEAD: 0.22,
  DEF: 0.75,
  MOUTH_Y: 0.74, BL_R: 0.42, BL_F: 0.022, BL_W0: 0.1, BL_WK: 0.2, BL_L: 0.7, BREATH: 1.6, BR_REC: 0.3, KID_V: 1.6, KID_LIM: 1.0,
  WN: 30, WB0: 0.05, WB1: 0.4, WBN: 0.0008, WG0: 0.08, WG1: 0.55, WGN: 0.0012,
  CAT_N0: 22, CAT_EVERY: 26, CAT_RND: 14, CAT_W: 0.2, CAT_H: 0.26, CAT_V: 0.42, CAT_RUN: 1.4, CAT_UP: 1.7, CAT_SIDE: 0.7,
  HOLD_Y: 0.62, START_T: 0.9, TOSS_V: 3.4,
  HY: 0.6, AP_T: 1.55, XT: 0.1, EVAL_Y: 1.1,
};
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function rndG(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const V_FULL = 4 / 3 * Math.PI * PH.R0 ** 3, AM = Math.asin(PH.PW / PH.RC);
const radOf = air => PH.R0 * Math.cbrt(Math.max(0.05, air));
const massOf = air => PH.MP + PH.RHO * V_FULL * Math.max(0.05, air) * (1 + PH.ADD);
const dragOf = air => 0.5 * PH.RHO * PH.CD * Math.PI * PH.R0 * PH.R0 * Math.pow(Math.max(0.05, air), PH.AEXP);
// つくほど 風が強く（上限は決めず ゆっくり上がりつづける）
function diffOf(n) { const k = 1 - Math.exp(-n / PH.WN); return { wb: PH.WB0 + PH.WB1 * k + PH.WBN * n, wg: PH.WG0 + PH.WG1 * k + PH.WGN * n }; }
function windAt(g, t) { const p = g.wp, s = Math.sin(0.37 * t + p[0]) + 0.6 * Math.sin(0.93 * t + p[1]) + 0.35 * Math.sin(2.1 * t + p[2]); return -(g.wb + g.wg * Math.max(0, s + 0.35) / 2.3); }
function makeGame(seed = 1) {
  const g = {
    seed, rs: (seed ^ 0x9e3779b9) >>> 0, t: 0, phase: 'ready', hits: 0, over: false, fail: null, overT: -1,
    b: { x: 0, y: PH.HOLD_Y, vx: 0, vy: 0, th: 0, w: 0, air: 1, dentA: -Math.PI / 2, lastHitT: -9, sq: 0 },

    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { if (game.hand && game.hand.ph === 'hold') gInput(game, game.t, 'up'); if (game.blowing) gInput(game, game.t, 'bup'); bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; ptrId = null; keyHeld = false; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    screen: (x, y, z = 0) => scr(x, y, z),
    world: (px, py) => toWorld(px, py),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, planHit, releaseWindow, game: () => game,
  };
}
