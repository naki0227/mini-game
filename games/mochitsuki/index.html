<style>

  padding-left: max(16px, env(safe-area-inset-left, 0px));

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));
const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 餅つきの物理（自前。three には頼らない） ----------
   長さの単位は cm、時間は秒。横から見た平面（x: 右が自分、y: 上）で杵を回し、z は奥行き（手前が +）。
   杵 = 重い頭（円柱・4.2kg）と柄（1.3kg）の振り子。にぎり（両手）を支点に、柄の角度 a（ついた形が 0、振り上げるほど大きい）の1自由度。
        振り上げると、にぎりも胸の高さへ上がる（支点が動く振り子。運動エネルギーと位置エネルギーの表から運動方程式を立てる）。
        押している間 = 腕が杵を「押していた時間で決まる高さ」まで持ち上げて支える（トルクに上限）。離す = 腕は振り下ろす向きに少し押すだけで、あとは重力。
        頭の打つ面が餅（臼の中の高さ MT）に届いた瞬間の速さ = つく強さ。弱いと「ぺちっ」（数えない）、強すぎると餅が臼から飛ぶ（終わり）。
   相方の手 = 手桶（手水）と臼の中を結ぶ道すじ上の位置 s（0 = 手桶、1 = 餅の上）の 2 次の追従（ばね＋ダンパー＋速さの上限）。
        杵が上がる → 少し見てから手を入れる → 餅を返す（dwell 秒。ときどき ためらい）→「はいっ」と言って手を引く（ときどき ゆっくり）。
        フェイント = 声を出さずに手を半分引いて、また戻す。杵を上げたまま待たせると、もう一度返しに来る（patience）。
        手を入れようとしている途中で杵が落ちてくるのが見えたら、少しおくれて（flinch 秒）あわてて手を引く（返している最中は餅を見ているので気づかない）。
   当たり = 杵の頭（カプセル）と相方の手（手首〜指先のカプセル）の距離。杵が落ちている最中に重なったら事故（あいたっ）。
   返していない餅（前についてから相方が返す前）をついても数えない。テンポは回数とともに上がり、30 回・70 回…で相方が交代する。 */
const PH = {
  DT: 1 / 240, G: 980,
  MT: 57, RIM: 55, UR: 25, UO: 31,                          // 餅のてっぺん・臼のふち・臼の内側と外側の半径
  L: 62, HL: 26, RH: 8.5, PHI0: -163 * Math.PI / 180,        // 杵: にぎりから頭の中心まで・頭の長さ・頭の半径・ついたときの柄の向き
  M_HEAD: 4.2, M_ROD: 1.3, PIV_UP: [10, 42], PIV_A: 1.9,     // 頭と柄の重さ。振り上げるとにぎりが（右へ 10、上へ 42）動く
  OM_UP: 14, TQ_MAX: 3.4e6, DRIVE: 6e5, DAMP: 0.12,         // 腕: 持ち上げる速さ・力の上限・振り下ろすときのひと押し
  A_TOP: 1.5, TAU_UP: 0.28, CREEP_T: 1.55, CREEP: 0.5, HOLD_MAX: 3.0,   // 押した時間 → 高さ。長く押すほど、さらに後ろへ反る。HOLD_MAX 秒で腕が限界（勝手に振り下ろす）
  A_CLR: 0.32,                                               // 杵がこれより上がったら、相方は手を入れてよい
  V_PECHI: 300, V_GREAT: 700, V_FLY: 850,                    // 打つ面の速さ（cm/秒）: ぺちっ（数えない）／ぺったん！／とびすぎ
  HR: 3.2,                                                   // 相方の手（カプセル）の太さ
  IDLE_T: 6, COLD_T: 9, SWAP_T: 0.9, K_N: 0.011, K_N2: 0.003, K_MAX: 2.8,            // 何もしないで終わるまで・交代の間・テンポの上がり方
  GAUGE_K: 2.7,                                              // 1回でのびる量（％）の目安
  SWAPS: [30, 70, 120, 180, 250, 330],
};
const PARTNERS = {
  baa: { id: 'baa', name: 'おばあちゃん', react: 0.17, om: 15, dwell: 0.44, dwellSd: 0.12, pHes: 0.12, hes: [0.25, 0.55], pFeint: 0.06, pSlow: 0.06, pat: 0.42, flinch: 0.22 },
  tou: { id: 'tou', name: 'お父さん', react: 0.11, om: 19, dwell: 0.3, dwellSd: 0.09, pHes: 0.06, hes: [0.22, 0.45], pFeint: 0.13, pSlow: 0.08, pat: 0.32, flinch: 0.18 },
};
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function rndG(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function gaussG(g) { let u = rndG(g); while (u < 1e-9) u = rndG(g); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rndG(g)); }
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* 杵の形（角度 a → にぎり・頭の中心・頭の向き・打つ面）と、運動方程式の表 */
const KG = (() => {
  const d0x = Math.cos(PH.PHI0), d0y = Math.sin(PH.PHI0), u0x = -d0y, u0y = d0x;
  const F0 = { x: 0, y: PH.MT };
  const P0 = { x: F0.x - u0x * PH.HL / 2 - d0x * PH.L, y: F0.y - u0y * PH.HL / 2 - d0y * PH.L };
  const geo = a => {
    const k = clampP(a / PH.PIV_A, 0, 1), s = k * k * (3 - 2 * k);
    const px = P0.x + PH.PIV_UP[0] * s, py = P0.y + PH.PIV_UP[1] * s;
    const ph = PH.PHI0 - a, dx = Math.cos(ph), dy = Math.sin(ph), ux = -dy, uy = dx;
    const cx = px + PH.L * dx, cy = py + PH.L * dy;
    return { px, py, dx, dy, ux, uy, cx, cy, fx: cx + ux * PH.HL / 2, fy: cy + uy * PH.HL / 2, mx: px + dx * PH.L / 2, my: py + dy * PH.L / 2 };
  };
  const A0 = -0.4, A1 = 3.6, N = 1600, dA = (A1 - A0) / N;
  const Ic = PH.M_ROD * PH.L * PH.L / 12 + PH.M_HEAD * (3 * PH.RH * PH.RH + PH.HL * PH.HL) / 12;
  const m = new Float64Array(N + 1), V = new Float64Array(N + 1);
  for (let i = 0; i <= N; i++) {
    const a = A0 + i * dA, e = 1e-4, g1 = geo(a - e), g2 = geo(a + e), g0 = geo(a);
    const cvx = (g2.cx - g1.cx) / (2 * e), cvy = (g2.cy - g1.cy) / (2 * e), mvx = (g2.mx - g1.mx) / (2 * e), mvy = (g2.my - g1.my) / (2 * e);
    m[i] = PH.M_HEAD * (cvx * cvx + cvy * cvy) + PH.M_ROD * (mvx * mvx + mvy * mvy) + Ic;
    V[i] = PH.G * (PH.M_HEAD * g0.cy + PH.M_ROD * g0.my);
  }
  const dm = new Float64Array(N + 1), dV = new Float64Array(N + 1);
  for (let i = 0; i <= N; i++) { const i0 = Math.max(0, i - 1), i1 = Math.min(N, i + 1); dm[i] = (m[i1] - m[i0]) / ((i1 - i0) * dA); dV[i] = (V[i1] - V[i0]) / ((i1 - i0) * dA); }
  const at = a => { const x = clampP((a - A0) / dA, 0, N - 1e-9), i = Math.floor(x), f = x - i; return { m: m[i] + (m[i + 1] - m[i]) * f, dm: dm[i] + (dm[i + 1] - dm[i]) * f, dV: dV[i] + (dV[i + 1] - dV[i]) * f }; };
  const e = 1e-4, fa = geo(e), fb = geo(-e);
  const FS = Math.hypot(fa.fx - fb.fx, fa.fy - fb.fy) / (2 * e);   // a が 1 rad/秒 で動くときの打つ面の速さ（ついた位置で）
  return { geo, at, P0, F0, FS };
})();
function holdTarget(hold) {
  let a = PH.A_TOP * (1 - Math.exp(-hold / PH.TAU_UP));
  if (hold > PH.CREEP_T) a += PH.CREEP * (hold - PH.CREEP_T);
  return a;
}
function tempoOf(n) { return Math.min(PH.K_MAX, 1 + PH.K_N * Math.min(n, 100) + PH.K_N2 * Math.max(0, n - 100)); }
function partnerFor(n) { let k = 0; for (const s of PH.SWAPS) if (n >= s) k++; if (n >= 330) k += Math.floor((n - 330) / 80); return k % 2 ? 'tou' : 'baa'; }

/* 相方の手の道すじ: 手桶の中（s=0）→ 臼のふちを越えて → 餅の上（s=1） */

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  step(dt);
  render(Math.max(dt, 1 / 240));
  if (state === 'play' && game && game.k.press >= 0 && !yoisho && game.k.a > PH.A_CLR + 0.2 && !bot) { yoisho = true; if (game.n < 3 || Math.random() < 0.3) say('me', 'よいしょ', { dur: 0.6, size: 16 }); }
  requestAnimationFrame(frame);
}

/* ---------- 入力: 画面のどこでも。押しているあいだ振り上げ、離すと振り下ろす。時刻つきで物理へ ---------- */
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(nextSeed(), bn); frozen = false; cam.init = false;
  updateHud();
  // #debug&skip=秒: はじめにその秒数だけ一気に進め、杵が振り下ろされる直前（相方が手を引いた瞬間）で止める（OGP 撮影・確認用。bot=good と組み合わせる。freeze=1 で止めたまま）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'nice');
  if (HASH.has('debug') && HASH.get('ff') === '1') ff = true;

}

    physTick();
    if (game.t >= t1 && poseOk(game, pose)) break;
  }
  state = quiet;
  pops = []; marks = []; failAt = game.over ? tt : -1; shake = 0; squash = 0; squashV = 0;
  bubbles = bubbles.filter(b => b.who === 'p' && b.text === 'はいっ');

}

}

  const replay = (log, seedR, fps, quant = false) => {

  };
  const scr = (x, y, z = 0) => { const s = project(x, y, z); return { x: Math.round(s.x), y: Math.round(s.y) }; };
  const rect = id => { const el = $(id); if (!el || el.closest('[hidden]') || el.hidden) return null; const r = el.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2), w: Math.round(r.width), h: Math.round(r.height) }; };
  const nowMs = () => performance.now();
  const wallMs = tg => Math.round((base + tg) * 1000 - nowMs());   // 物理の時刻 tg に効く入力を送るまでの、いまからのミリ秒
  const ui = () => {
    const g = game, G = g ? KG.geo(g.k.a) : null, hp = g ? handPos(g.p.s, g.p.f) : null;
    return {
      state, start: rect('startBtn'), retry: rect('retryBtn'), copy: rect('copyBtn'), x: rect('xBtn'), hub: rect('hubBack'), best: rect('hud'),
      // 押す場所（どこでもよい。← 横丁 と 最高 にかからない、画面のまん中より少し下）
      press: { x: Math.round(W * 0.55), y: Math.round(H * 0.62) },
      kineHead: G && scr(G.cx, G.cy), kineFace: G && scr(G.fx, G.fy), grip: G && scr(G.px, G.py), mochi: scr(0, PH.MT), usu: scr(0, PH.RIM / 2),
      hand: hp && scr(hp.tip.x, hp.tip.y, hp.tip.z), partnerHead: scr(-60, 70), me: scr(86, 141), tray: tray && scr(tray.position.x, 10, tray.position.z),
    };
  };
  window.__mochitsuki = {
    info: (opts = {}) => {
      if (!game) return { state };
      const g = game, K = g.k, p = g.p, G = KG.geo(K.a), N = opts.noHit ? null : nextHitOf(g);
      const ws = v => v == null ? null : Math.round(wallMs(g.t + v));
      return {
        state, t: r3(g.t), n: g.n, over: g.over, fail: g.fail, tempo: r3(g.tempo), needTurn: g.needTurn, gauge: r2(g.gauge), usu: g.usu, strikes: g.strikes, pechi: g.pechi, nokaeshi: g.nokaeshi,
        kine: { a: r3(K.a), deg: Math.round(K.a / DEG), w: r2(K.w), pressing: K.press >= 0, hold: K.press >= 0 ? r3(g.t - K.press) : 0, faceUp: r2(G.fy - PH.MT), lastV: Math.round(K.lastV), zone: K.a >= ZONE.aFly ? 'fly' : K.a >= ZONE.aGreat ? 'great' : K.a >= ZONE.aPechi ? 'ok' : 'pechi' },
        partner: { id: p.id, name: PNAME(p.id), phase: p.phase, s: r3(p.s), inUsu: p.s > 0.72, hai: p.hai, cyc: p.cyc && { dwell: r3(p.cyc.dwell), hes: r3(p.cyc.hes), feint: !!p.cyc.feint, slow: p.cyc.slow, again: p.cyc.again } },
        // 次に「離す」とよい時刻（物理をためしに先まで進めて調べた。秒は物理の時刻から、Ms は いまから実際に mouse.up を送るまで）。pressNow = いまは杵が下にある（押して上げる）
        nextHit: N && (N.pressNow ? { pressNow: true } : N.none ? { none: true, first: N.first } : { in: r3(N.in), earliest: r3(N.earliest), latest: r3(N.latest), fall: r3(N.fall), v: Math.round(N.v), kind: N.kind, before: N.before, after: N.after, inMs: ws(N.in), earliestMs: ws(N.earliest), latestMs: ws(N.latest) }),
        zone: { holdPechi: r2(ZONE.hPechi), holdGreat: r2(ZONE.hGreat), holdFly: r2(ZONE.hFly) },
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, queue: g.queue.length, lag: LAG,
      };
    },
    ui,
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [回数...]（'first' / 'casual' / 'good' / 'mash'（一定間隔で押して一定の長さで離す））
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(typeof skill === 'string' ? SKILLS[skill] : skill, (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const sk = typeof skill === 'string' ? SKILLS[skill] : skill;
      const R = Array.from({ length: N }, (_, i) => runBot(sk, (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n), kinds = {};
      for (const r of R) kinds[r.fail] = (kinds[r.fail] || 0) + 1;
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge3: R.filter(r => r.n >= 3).length / N, ge10: R.filter(r => r.n >= 10).length / N, ge80: R.filter(r => r.n >= 80).length / N, ge200: R.filter(r => r.n >= 200).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), usuMean: +(R.reduce((a, r) => a + r.usu, 0) / N).toFixed(2), kinds };
    },
    // 一定間隔の連打（tau 秒おきに押して hold 秒で離す）: mash(1.4, 0.9, 40)。grid で いちばん伸びる組み合わせをさがす
    mash: (tau = 1.4, hold = 0.9, N = 40) => { const n = Array.from({ length: N }, (_, i) => runBot({ mash: tau, hold }, 1000 + i, { maxN: 400 }).n); return { tau, hold, p50: q(n, 0.5), max: Math.max(...n) }; },
    mashGrid: (N = 30) => { const out = []; for (const T of [0.8, 1.0, 1.2, 1.4, 1.6, 1.8, 2.0, 2.3]) for (const h of [0.3, 0.5, 0.7, 0.9, 1.1, 1.3, 1.5, 1.7]) { if (h > T - 0.2) continue; const n = Array.from({ length: N }, (_, i) => runBot({ mash: T, hold: h }, 2000 + i, { maxN: 300 }).n); out.push({ T, h, p50: q(n, 0.5), max: Math.max(...n) }); } return out.sort((a, b) => b.p50 - a.p50).slice(0, 6); },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（frameQuantized は時刻を使わなかった場合のくらべ）
    fpsCheck: (skill = 'good', seedR = 4242) => {
      const r = runBot(SKILLS[skill], seedR, { log: true, maxN: 400 });
      return { live: { n: r.n, fail: r.fail, t: r3(r.t) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), fps30frameQuantized: replay(r.log, seedR, 30, true), fps60frameQuantized: replay(r.log, seedR, 60, true), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { if (game.k.press >= 0) gInput(game, game.t, 'up'); bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); bot.pressAt = game.t + 0.3; botStart = true; ptrId = null; keyHeld = false; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    screen: (x, y, z = 0) => scr(x, y, z),
    zone: () => ({ aPechi: r3(ZONE.aPechi), aGreat: r3(ZONE.aGreat), aFly: r3(ZONE.aFly), hPechi: r2(ZONE.hPechi), hGreat: r2(ZONE.hGreat), hFly: r2(ZONE.hFly) }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, PARTNERS, SKILLS, KG, makeGame, runBot, stepGame, gInput, nextHitOf, handPos, game: () => game,
  };
}
