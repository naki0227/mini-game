<html lang="ja">
<head>
<meta charset="utf-8">

<title>連打おみくじ</title>
<meta name="description" content="タップ一回で一枚、待ち時間ゼロで何回でも引けるおみくじ。大吉の連続記録と、九種の運勢がそろう「おみくじ帳」をめざす、ログイン不要のワンタップゲーム。">
<meta property="og:type" content="website">
<meta property="og:title" content="連打おみくじ">
<meta property="og:description" content="ワンポチで何回でも引けるおみくじ。大吉は何連続まで出る？超大吉、出せる？">
<meta property="og:url" content="https://asobi.enludus.com/games/omikuji/">
<meta property="og:image" content="https://asobi.enludus.com/games/omikuji/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%A9%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 構成: 神社の境内（鳥居・玉砂利）を背景に、上で紙が開き、下でおみくじ筒を振る。DOMは固定数を使い回す */
:root {
  --shu: #c8402a;        /* 朱 */
  --shu-deep: #8f2a1a;
  --wood: #e6cc98;       /* 白木 */
  --wood-deep: #b58f58;
  --washi: #fbf6ea;      /* 和紙 */
  --sumi: #221b17;       /* 墨 */
  --ground: #d9d2c3;     /* 玉砂利 */
  --gold: #c99a2e;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --ph: max(300px, min(440px, calc(100dvh - 300px)));   /* 紙の高さ */
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: #f1e8d6; color: var(--sumi);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

/* ---------- 境内 ---------- */
#scene { position: fixed; inset: 0; overflow: hidden; cursor: pointer;
  background: linear-gradient(#efe4cf 0%, #f6efe1 62%, var(--ground) 62.2%, #cfc6b4 100%); }
#scene::after { /* 玉砂利の粒 */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 37.8%;
  background-image: radial-gradient(circle at 30% 40%, rgba(120,108,90,.28) 1.4px, transparent 2px),
                    radial-gradient(circle at 70% 70%, rgba(255,255,255,.6) 1.2px, transparent 2px);
  background-size: 14px 11px, 19px 15px; pointer-events: none; z-index: 0;
}
.torii { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 58px); width: min(560px, 128vw);
  transform: translateX(-50%); height: 62%; opacity: .92; pointer-events: none; }

.hud {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none; z-index: 3;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--shu); color: var(--washi);
  border-radius: 6px; padding: 6px 12px 7px;
  font-variant-numeric: tabular-nums; line-height: 1.1;
  box-shadow: 0 2px 0 var(--shu-deep);
}
.pill .lab { font-size: 11px; letter-spacing: .12em; opacity: .8; display: block; }
.pill .val { font-family: var(--font-display); font-size: 24px; }
.pill .unit { font-size: 13px; margin-left: 2px; }
.pill.right { text-align: right; background: var(--washi); color: var(--sumi); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.pill.right .unit { margin-left: 0; }

#stage { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 74px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 62px); pointer-events: none; }
.paperArea { flex: 1; display: grid; place-items: center; width: 100%; padding-inline: 16px; min-height: 0; }

/* ---------- おみくじの紙（縦書き） ---------- */
.sheet {
  position: relative; height: var(--ph); width: min(312px, 100%);
  background:
    repeating-linear-gradient(97deg, rgba(160,130,90,.05) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(8deg, rgba(160,130,90,.04) 0 1px, transparent 1px 5px),
    var(--washi);
  box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 10px 28px rgba(60,30,10,.22);
  border-radius: 2px; padding: 14px; overflow: hidden;
  transform-origin: 50% 100%;
}
.sheet .frame { position: absolute; inset: 9px; border: 2px solid var(--shu); outline: 1px solid var(--shu); outline-offset: -6px; pointer-events: none; }
.kv { writing-mode: vertical-rl; height: 100%; margin-inline: auto; display: block; padding: 10px 8px; position: relative; }
.kv > * { margin-block-end: 8px; }
.no { font-size: 13px; letter-spacing: .2em; color: var(--shu); font-weight: 700; }
.fortune { font-family: var(--font-display); font-size: calc(var(--ph) * .155); line-height: 1.15; letter-spacing: .04em;
  margin-inline-start: 6px; color: var(--sumi); }
.fortune.long { font-size: calc(var(--ph) * .1); }
.fortune.red { color: #b4301c; }
.word { font-size: max(12px, min(14px, calc(var(--ph) * .033))); font-weight: 700; margin-inline-start: 10px; line-height: 1.5; }
.items { border-right: 1px solid rgba(200,64,42,.45); padding-right: 8px; margin-block-end: 0; }
.item { font-size: max(12px, min(15px, calc(var(--ph) * .035))); line-height: 1.75; margin-inline-start: 2px; }
.item .lab { display: inline-block; color: var(--shu); border: 1.5px solid var(--shu); padding: 3px 0; margin-inline-end: 6px; font-weight: 700; font-size: .88em; line-height: 1.25; }
.stamp { position: absolute; right: 22px; bottom: 24px; width: 52px; height: 52px; border-radius: 50%;
  border: 3px solid var(--shu); color: var(--shu); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 17px; transform: rotate(-14deg); background: rgba(251,246,234,.6); }
.shine { position: absolute; inset: -20% -60%; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.75) 50%, transparent 60%);
  transform: translateX(-100%); pointer-events: none; }
/* レア運勢の紙 */
.sheet.cho { background: linear-gradient(140deg, #f8e7a8, #ddb44e 45%, #f6dd8f 70%, #cf9f37); }
.sheet.cho .frame { border-color: #8f2a1a; outline-color: #8f2a1a; }
.sheet.cho .fortune { color: #8f1f10; text-shadow: 0 2px 0 rgba(255,240,190,.8); }
.sheet.aruimi { background: repeating-linear-gradient(97deg, rgba(40,60,100,.05) 0 2px, transparent 2px 7px), #e8ecef; }
.sheet.aruimi .frame { border-color: #2b3d64; outline-color: #2b3d64; }
.sheet.aruimi .fortune, .sheet.aruimi .no { color: #2b3d64; }
.sheet.aruimi .item .lab { color: #2b3d64; border-color: #2b3d64; }
.sheet.daikyo { background: repeating-linear-gradient(97deg, rgba(0,0,0,.04) 0 2px, transparent 2px 7px), #e9e4da; }
.sheet.empty .kv { visibility: hidden; }
.sheet.empty::before { content: "おみくじ"; position: absolute; inset: 0; display: grid; place-items: center; writing-mode: vertical-rl;
  font-family: var(--font-display); font-size: 40px; color: rgba(200,64,42,.25); letter-spacing: .3em; }

/* ---------- おみくじ筒（六角） ---------- */
.boxWrap { position: relative; width: 120px; height: 150px; flex: none; margin-top: 8px; transform-origin: 50% 85%; }
.boxWrap svg.box { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.stick { position: absolute; left: 50%; top: 17px; width: 13px; height: 92px; margin-left: -6.5px;
  background: linear-gradient(90deg, #f2dfb7, #d9bb84); border-radius: 3px 3px 1px 1px;
  writing-mode: vertical-rl; font-size: 9px; font-weight: 700; color: var(--sumi); text-align: start; padding-top: 6px;
  line-height: 13px; box-shadow: inset 0 3px 0 var(--shu); }
.boxShade { position: absolute; left: 50%; bottom: -6px; width: 130px; height: 14px; margin-left: -65px; border-radius: 50%; background: rgba(60,45,25,.22); }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .hint { font-size: 12px; opacity: .65; }

#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); z-index: 4; pointer-events: none;
  transform: translateX(-50%); background: var(--sumi); color: var(--washi); border-radius: 99px;
  padding: 6px 16px 7px; font-weight: 700; font-size: 15px; white-space: nowrap; opacity: 0; }
#toast.gold { background: var(--gold); color: #2a1a05; }
#flash { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 45%, rgba(255,222,120,.9), rgba(255,210,90,0) 70%); }

/* ---------- タイトル / おみくじ帳 ---------- */
.overlay {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: rgba(34, 27, 23, .38); cursor: pointer;
}
.card {
  width: min(360px, 100%); max-height: 100%; overflow-y: auto; touch-action: pan-y; cursor: default;
  background: var(--washi); color: var(--sumi);
  border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.3); text-align: center;
}
#title .card { cursor: pointer; }
.noren { background: var(--shu); color: var(--washi); display: flex; gap: 3px; padding-top: 16px; }
.noren span {
  flex: 1; background: var(--shu); border-bottom: 3px solid rgba(255,255,255,.1);
  font-family: var(--font-display); font-size: 30px; line-height: 1; padding-block: 6px 14px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2);
}
.noren.gold, .noren.gold span { background: var(--gold); color: #2a1a05; }
.body { padding: 18px 20px 20px; display: grid; gap: 12px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }
.score { font-family: var(--font-display); font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 20px; margin-left: 4px; }
.meta { display: flex; justify-content: center; gap: 16px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meta b { font-size: 16px; }
.badge {
  justify-self: center; background: var(--shu); color: #fff; font-weight: 700;
  font-size: 12px; letter-spacing: .14em; padding: 3px 10px; border-radius: 99px;
}
.complete { background: linear-gradient(120deg, #f6e3a1, #d9b04a, #f3d98a); color: #4a2a05; font-weight: 700; border-radius: 6px; padding: 7px 8px; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cell { border: 1.5px solid rgba(34,27,23,.18); border-radius: 6px; padding: 7px 2px 6px; background: #fff; min-width: 0; }
.cell .n { font-family: var(--font-display); font-size: 17px; line-height: 1.2; white-space: nowrap; }
.cell .n.long { font-size: 12.5px; line-height: 1.65; }
.cell .c { font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }
.cell.none { background: transparent; border-style: dashed; }
.cell.none .n { color: rgba(34,27,23,.3); }
.cell.rare { border-color: var(--gold); }
.cell.rare:not(.none) { background: linear-gradient(140deg, #fbefc4, #ecd08a); }
.btns { display: grid; gap: 8px; }
button {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 8px;
  padding: 12px 16px; cursor: pointer;
  background: var(--shu); color: var(--washi); box-shadow: 0 3px 0 var(--shu-deep);
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shu-deep); }
button.small { font-size: 14px; padding: 9px 14px; }
a.xbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  font-weight: 700; font-size: 15px; border-radius: 8px; padding: 12px 14px;
  background: #0f1419; color: #fff; box-shadow: 0 3px 0 #000;
}
a.xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
a.xbtn:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
a.xbtn svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
button.sub { background: transparent; color: var(--sumi); box-shadow: inset 0 0 0 2px var(--sumi); }
button.sub.light { background: var(--washi); box-shadow: 0 2px 0 rgba(0,0,0,.2), inset 0 0 0 2px var(--sumi); }
button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
.how { font-size: 12px; opacity: .7; margin: 0; }
.back { font-size: 13px; color: var(--sumi); opacity: .75; }
.back:hover { opacity: 1; }
</style>
</head>
<body>

<script>
(() => {
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 運勢（確率は%） ---------- */
const FORTUNES = [
  { id: 'cho',      name: '超大吉',       w: 0.5, rare: true, streak: true },
  { id: 'daikichi', name: '大吉',         w: 17,  streak: true },
  { id: 'chukichi', name: '中吉',         w: 15 },
  { id: 'shokichi', name: '小吉',         w: 14 },
  { id: 'kichi',    name: '吉',           w: 25 },
  { id: 'suekichi', name: '末吉',         w: 14 },
  { id: 'kyo',      name: '凶',           w: 10 },
  { id: 'daikyo',   name: '大凶',         w: 3.5 },
  { id: 'aruimi',   name: 'ある意味大吉', w: 1,   rare: true },
];

  let r = Math.random() * 100;
  for (const f of FORTUNES) { if ((r -= f.w) < 0) return f; }
  return BY_ID.kichi;
}

const pick = a => a[Math.floor(Math.random() * a.length)];
function makeItems() {
  const idx = [0, 1, 2, 3, 4, 5];
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.slice(0, 3).sort((a, b) => a - b).map(i => [ITEMS[i][0], pick(ITEMS[i][1])]);
}
function kanjiNum(n) {
  const d = '〇一二三四五六七八九';
  if (n >= 100) return '百';
  const t = Math.floor(n / 10), o = n % 10;
  return (t > 1 ? d[t] : '') + (t ? '十' : '') + (o ? d[o] : '');
}

/* ---------- 記録（このブラウザだけ） ---------- */
const KEY = 'omikuji:v1';
const blank = () => ({ total: 0, counts: {}, streak: 0, bestStreak: 0, complete: false, last: null });
function load() {
  try {
    const r = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}'));
    if (typeof r.counts !== 'object' || !r.counts) r.counts = {};
    return r;
  } catch { return blank(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch {} }
let rec = load();
let sessionNewBest = false;
const found = () => FORTUNES.filter(f => rec.counts[f.id] > 0).length;

/* ---------- 一枚引く ---------- */
const sheet = $('sheet'), box = $('box'), stick = $('stick'), pF = $('pF'), toastEl = $('toast');
const itemEls = [...$('pItems').children];
let lastDrawAt = -1e9;

function draw() {
  wakeAudio();
  const now = performance.now();
  const quick = now - lastDrawAt < 620;   // 連打中は演出を省いて即表示
  lastDrawAt = now;

  const f = pickFortune();
  const kuji = { no: 1 + Math.floor(Math.random() * 100), f: f.id, w: pick(WORDS[f.id]), items: makeItems() };
  rec.total++;
  rec.counts[f.id] = (rec.counts[f.id] || 0) + 1;
  const first = rec.counts[f.id] === 1;
  rec.streak = f.streak ? rec.streak + 1 : 0;
  let bestUp = false;
  if (rec.streak > rec.bestStreak) { rec.bestStreak = rec.streak; bestUp = true; sessionNewBest = true; }
  let completeNow = false;
  if (!rec.complete && found() === FORTUNES.length) { rec.complete = true; completeNow = true; }
  rec.last = kuji;
  save();

  showKuji(kuji, first);
  animate(f, quick);
  sound(f, quick);

  // ひとこと通知（優先度順に1つだけ）
  if (completeNow) toast('九種そろった！満願成就', true);
  else if (first && f.rare) toast(`初！ ${f.name} が出た`, true);
  else if (bestUp && rec.streak >= 2) toast(`大吉 ${rec.streak}連続！ 最高記録`, true);
  else if (rec.streak >= 2) toast(`大吉 ${rec.streak}連続！`);
  else if (first && rec.total > 1) toast(`初！ ${f.name}`);
  updateHud();
}

function showKuji(k, first) {
  const f = BY_ID[k.f] || BY_ID.kichi;
  sheet.className = 'sheet' + (f.id === 'cho' ? ' cho' : f.id === 'aruimi' ? ' aruimi' : f.id === 'daikyo' ? ' daikyo' : '');
  $('pNo').textContent = `第${kanjiNum(k.no)}番`;
  pF.textContent = f.name;
  pF.className = 'fortune' + (f.name.length > 3 ? ' long' : '') + (f.id === 'daikichi' ? ' red' : '');
  $('pW').textContent = k.w;
  itemEls.forEach((el, i) => {
    const it = k.items[i] || ['', ''];
    el.firstChild.textContent = it[0]; el.lastChild.textContent = it[1];
  });
  $('pFirst').hidden = !first;
  stick.textContent = kanjiNum(k.no);
}

function cancelAnims() {
  for (const el of [sheet, box, stick, $('shine'), $('flash')]) el.getAnimations().forEach(a => a.cancel());
}
function animate(f, quick) {
  cancelAnims();
  const out = [{ transform: 'translateY(0)' }, { transform: 'translateY(-58px)' }];
  if (quick || reduced) {
    stick.animate(out, { duration: 1, fill: 'forwards' });
    sheet.animate([{ transform: 'scale(.95)', opacity: .55 }, { transform: 'none', opacity: 1 }], { duration: 110, easing: 'ease-out' });
    if (!reduced) box.animate([{ transform: 'rotate(-5deg)' }, { transform: 'rotate(4deg)' }, { transform: 'none' }], { duration: 110 });
  } else {
    // 振る(0-240ms) → 棒が出る(170-330ms) → 紙が開く(320-560ms)
    box.animate([{ transform: 'none' }, { transform: 'rotate(-15deg) translateY(-4px)' }, { transform: 'rotate(13deg)' },
      { transform: 'rotate(-9deg) translateY(-3px)' }, { transform: 'rotate(5deg)' }, { transform: 'none' }], { duration: 240, easing: 'ease-in-out' });
    stick.animate(out, { duration: 160, delay: 170, easing: 'cubic-bezier(.3,1.6,.5,1)', fill: 'both' });
    sheet.animate([{ transform: 'translateY(140px) scale(.22, .06)', opacity: 0 }, { transform: 'translateY(140px) scale(.22, .06)', opacity: 0, offset: .57 },
      { transform: 'translateY(10px) scale(1.03, .7)', opacity: 1, offset: .8 }, { transform: 'none', opacity: 1 }], { duration: 560, easing: 'ease-out' });
  }
  if (f.rare) {
    const d = quick ? 0 : 320;
    $('shine').animate([{ transform: 'translateX(-100%)' }, { transform: 'translateX(100%)' }], { duration: 420, delay: d, easing: 'ease-in-out' });
    if (f.id === 'cho' && !reduced) $('flash').animate([{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }], { duration: 420, delay: d });
  }
}

let toastAnim = null;
function toast(text, gold = false) {
  toastEl.textContent = text;
  toastEl.className = gold ? 'gold' : '';
  if (toastAnim) toastAnim.cancel();
  toastAnim = toastEl.animate([{ opacity: 0, transform: 'translate(-50%, 8px)' }, { opacity: 1, transform: 'translate(-50%, 0)', offset: .12 },
    { opacity: 1, transform: 'translate(-50%, 0)', offset: .8 }, { opacity: 0, transform: 'translate(-50%, -6px)' }], { duration: 1100 });
}

/* ---------- HUD ---------- */
function updateHud() {
  $('hTotal').textContent = rec.total;
  $('hStreak').textContent = rec.streak;
  $('hBest').textContent = ` / 最高 ${rec.bestStreak}`;
  $('bCount').textContent = found();
}
function fillTitle() { $('tTotal').textContent = rec.total; $('tBest').textContent = rec.bestStreak; $('tBook').textContent = found(); }

/* ---------- おみくじ帳 ---------- */
const BOOK_ORDER = ['cho', 'daikichi', 'chukichi', 'shokichi', 'kichi', 'suekichi', 'kyo', 'daikyo', 'aruimi'];
const grid = $('grid');
const cells = BOOK_ORDER.map(() => {   // セルは最初に9個作って使い回す
  const c = document.createElement('div'); c.className = 'cell';
  c.innerHTML = '<div class="n"></div><div class="c"></div>';
  grid.appendChild(c); return c;
});
function openBook() {
  BOOK_ORDER.forEach((id, i) => {
    const f = BY_ID[id], n = rec.counts[id] || 0, c = cells[i];
    c.className = 'cell' + (n ? '' : ' none') + (f.rare ? ' rare' : '');
    c.firstChild.textContent = n ? f.name : (f.rare ? '？？？' : '？');
    c.firstChild.className = 'n' + (n && f.name.length > 3 ? ' long' : '');
    c.lastChild.textContent = n ? `${n}回` : (f.rare ? '隠し運勢' : 'まだ');
  });
  const k = found();
  $('oTotal').textContent = rec.total; $('oBest').textContent = rec.bestStreak; $('oBook').textContent = k;
  $('newRec').hidden = !(sessionNewBest && rec.bestStreak >= 2);
  $('oComplete').hidden = !rec.complete;
  $('bookNoren').classList.toggle('gold', rec.complete);
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({ text: shareText() + '\n', url: gameUrl(), hashtags: '連打おみくじ' });
  $('xCard').href = 'https://x.com/intent/post?' + new URLSearchParams({ text: cardText() + '\n', url: gameUrl(), hashtags: '連打おみくじ' });
  $('xCard').hidden = !rec.last;
  $('copyMsg').textContent = '記録はこのブラウザだけに保存されます';
  $('book').hidden = false;
  $('againBtn').focus({ preventScroll: true });
}
function closeBook() { $('book').hidden = true; }

/* ---------- シェア ---------- */
const PUBLIC_URL = 'https://asobi.enludus.com/games/omikuji/';
function gameUrl() {
  try {
    if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost') return location.origin + location.pathname;
  } catch {}
  return PUBLIC_URL;
}
function shareText() {
  const dk = rec.counts.daikichi || 0, b = rec.bestStreak;
  const streak = b >= 2 ? `大吉が最高${b}連続` : dk ? `大吉${dk}回（連続はまだ）` : '大吉はまだ0回';
  const cho = rec.counts.cho ? `超大吉も${rec.counts.cho}回出た！` : '超大吉はまだ…';
  return `⛩️連打おみくじ ${rec.total}回引いて${streak}。${cho}（帳 ${found()}/9）`;
}
function cardText() {
  const k = rec.last; if (!k) return shareText();
  const f = BY_ID[k.f] || BY_ID.kichi;
  return `⛩️連打おみくじ 今日の一枚は【${f.name}】第${kanjiNum(k.no)}番\n` + k.items.map(([a, b]) => `${a}：${b}`).join('\n');
}

/* ---------- 音（WebAudio） ---------- */
let ac = null, noiseBuf = null;
function wakeAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.05), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    }
    if (ac.state === 'suspended') ac.resume();
  } catch {}
}
function rattle(at) {   // 筒の中で棒が鳴る音
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 1700 + Math.random() * 900; f.Q.value = 3;
  g.gain.value = 0.35; s.connect(f).connect(g).connect(ac.destination); s.start(at);
}
function tone(freq, at, dur, vol, type = 'sine') {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g).connect(ac.destination); o.start(at); o.stop(at + dur + 0.02);
}
function sound(f, quick) {
  try {
    if (!ac) return;
    const t0 = ac.currentTime, tr = t0 + (quick ? 0 : 0.33);
    if (!quick) { rattle(t0); rattle(t0 + 0.07); rattle(t0 + 0.14); }
    tone(quick ? 1100 : 900, quick ? t0 : t0 + 0.2, 0.05, 0.12, 'triangle');   // 棒が出る「コッ」
    const id = f.id;
    if (id === 'cho') [1047, 1319, 1568, 2093].forEach((h, i) => tone(h, tr + i * 0.06, 0.5, 0.11));
    else if (id === 'daikichi') { tone(1319, tr, 0.4, 0.12); tone(1760, tr + 0.05, 0.45, 0.1); }
    else if (id === 'aruimi') { tone(660, tr, 0.18, 0.1, 'triangle'); tone(622, tr + 0.12, 0.3, 0.1, 'triangle'); }
    else if (id === 'kyo' || id === 'daikyo') tone(id === 'kyo' ? 247 : 175, tr, 0.3, 0.14);
    else tone({ chukichi: 1175, shokichi: 1047, kichi: 988, suekichi: 880 }[id] || 988, tr, 0.22, 0.09);
  } catch {}
}

/* ---------- 入力 ---------- */
function start() { $('title').hidden = true; draw(); }
const isUi = el => el.closest && el.closest('button, a');
document.addEventListener('pointerdown', e => {
  if (e.button > 0 || isUi(e.target)) return;
  if (!$('title').hidden) { e.preventDefault(); start(); return; }
  if (!$('book').hidden) {
    if (e.target.closest('.card')) return;   // 帳の中は読む・スクロールする場所
    e.preventDefault(); closeBook(); draw(); return;
  }
  e.preventDefault(); draw();
});
window.addEventListener('keydown', e => {
  if (e.code === 'Escape' && !$('book').hidden) { closeBook(); return; }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (isUi(e.target)) return;   // フォーカス中のボタンは標準動作に任せる
  e.preventDefault();
  if (!$('title').hidden) start();
  else { if (!$('book').hidden) closeBook(); draw(); }
});
$('startBtn').addEventListener('click', start);
$('bookBtn').addEventListener('click', () => { openBook(); });
$('againBtn').addEventListener('click', () => { closeBook(); draw(); });
$('copyBtn').addEventListener('click', () => {
  const text = shareText() + '\n' + gameUrl();
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try {
    navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback);
  } catch { fallback(); }
});

// 前回の一枚を背景に出しておく
if (rec.last && rec.last.items) { try { showKuji(rec.last, false); } catch { sheet.className = 'sheet empty'; } }
else sheet.className = 'sheet empty';
if (rec.last) stick.animate([{ transform: 'translateY(-58px)' }], { duration: 1, fill: 'forwards' });
updateHud(); fillTitle();
$('startBtn').focus({ preventScroll: true });
})();
</script>
