<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
const { Engine, Bodies, Body, Composite, Events } = Matter;
const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 記録（このブラウザだけ） ---------- */
const KEY = 'flip:v1';
const DEF = { best: 0, total: 0, plays: 0, inv: 0 };
function load() { try { return Object.assign({ ...DEF }, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { return { ...DEF }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch {} }
let rec = load();

/* ---------- 物理の定数（長さ: 描画単位 / 速度: 1/60秒あたり） ---------- */
const BASE = 1000 / 60;
const GRAV = 2;
const gU = GRAV * 0.001 * BASE * BASE;          // 1ステップあたりの重力加速度
// ボトル（胴の中心が原点、y は下向き）
const BW = 34, BH = 64, NKW = 19, NKH = 13, CPW = 20, CPH = 10;
const IW = 15, IT = -30, IB = 30;                // 胴の内側
let MB = 0.25;                                   // ボトル（空）の重さ
let MW_FULL = 6;                                 // 満タンの水の重さ
const GRIP = BH / 2 + NKH / 2;                   // 首を持つ位置 → 胴の中心までの距離
const HAND = { x: -128, y: -262 };
let SPIN = 0.21, FRIC = 0.7, ASSIST_K = 1, INERTIA_K = 1; const VREF = 13;                   // 投げの速さ → 回転
const VMAX = 26;
const FLICK_V0 = 12.5, FLICK_E = 0.45, FLICK_A0 = 77, FLICK_K = 0.25, FLICK_MIN = 0.35;   // 1.5px/ms・真上から右15°のフリック → 速さ12.5・77°

/* ---------- 着地先 ---------- */
const FLOOR_Y = 0, WALL_Y = -112;
const desk = (x, w = 150, top = -150) => ({ kind: 'desk', x, y: top + 5, w, h: 10 });
const books = (x, w, n, base) => ({ kind: 'books', x, y: base - n * 14 / 2, w, h: n * 14, n, seed: Math.random() });
function chair(x, w = 76, top = -96) {
  return [{ kind: 'seat', x, y: top + 4, w, h: 8 }, { kind: 'back', x: x + w / 2 - 3, y: top - 44, w: 6, h: 80 }];
}
const box = (kind, x, w, top) => ({ kind, x, y: top / 2, w, h: -top });
const cap = (x, base) => ({ kind: 'cap', x, y: base - 6, w: 22, h: 12, chamfer: 2 });

// n: これまでの成功数
function makeStage(n) {
  let st;
  const wf = Math.max(0.62, 1 - Math.max(0, n - 7) * 0.035);
  if (n === 0) st = { name: '机の上', solids: [desk(52, 180)] };
  else if (n === 1) st = { name: 'となりの机', solids: [desk(92, 140)] };
  else if (n === 2) st = { name: 'イスの上', solids: chair(80, 80), land: 0 };
  else if (n === 3) st = { name: '本の山の上', solids: [desk(72, 150), books(100, 66, 3, -150)] };
  else if (n === 4) st = { name: '教卓の上', solids: [box('lectern', 118, 112, -206)] };
  else if (n === 5) st = { name: '冷蔵庫の上', solids: [box('fridge', 112, 96, -268)] };
  else if (n === 6) st = { name: 'キャップの上', solids: [desk(70, 150), cap(98, -150)], hard: true };
  else {
    const k = pick(['desk', 'chair', 'books', 'lectern', 'fridge', 'locker', 'cap', 'books', 'chair']);
    if (k === 'desk') { const w = 130 * wf; st = { name: '机の上', solids: [desk(clamp(rand(60, 140), 0, 186 - w / 2), w, rand(-160, -140))] }; }
    else if (k === 'chair') { const w = 76 * wf; st = { name: 'イスの上', solids: chair(rand(50, 186 - w / 2 - 4), w, rand(-104, -90)), land: 0 }; }
    else if (k === 'books') { const nb = 2 + Math.floor(rand(0, 4)), dx = rand(40, 120); st = { name: nb >= 5 ? '高い本の山の上' : '本の山の上', solids: [desk(clamp(dx, 0, 110), 150), books(clamp(dx + rand(-30, 30), 30, 150), 62 * wf, nb, -150)] }; }
    else if (k === 'lectern') { const w = 108 * wf; st = { name: '教卓の上', solids: [box('lectern', rand(70, 186 - w / 2), w, rand(-216, -196))] }; }
    else if (k === 'fridge') { const w = 92 * wf; st = { name: '冷蔵庫の上', solids: [box('fridge', rand(90, 186 - w / 2), w, rand(-310, -262))] }; }
    else if (k === 'locker') { const w = 70 * wf; st = { name: 'ロッカーの上', solids: [box('locker', rand(110, 186 - w / 2), w, rand(-350, -320))] }; }
    else { const dx = rand(50, 110); st = { name: 'キャップの上', solids: [desk(dx, 150), cap(dx + rand(-20, 40), -150)], hard: true }; }
  }
  if (st.land === undefined) st.land = st.solids.length - 1;
  const L = st.solids[st.land];
  st.surf = { left: L.x - L.w / 2, right: L.x + L.w / 2, top: L.y - L.h / 2 };
  st.fill = n < 2 ? 0.33 : n < 4 ? pick([0.28, 0.33, 0.4]) : n < 6 ? pick([0.24, 0.3, 0.36, 0.44]) : pick([0.2, 0.28, 0.33, 0.4, 0.5]);
  st.bonus = n >= 3 && !st.hard && Math.random() < 0.3;
  st.n = n;
  return st;
}

/* ---------- 物理ワールド ---------- */
function makeWorld(stage) {
  const engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
  engine.gravity.y = GRAV;
  const floor = Bodies.rectangle(0, FLOOR_Y + 40, 6000, 80, { isStatic: true, friction: 0.8, label: 'floor' });
  const bodies = stage.solids.map((s, i) => Bodies.rectangle(s.x, s.y, s.w, s.h, {
    isStatic: true, friction: 0.9, frictionStatic: 1, restitution: 0,
    label: i === stage.land ? 'land' : 'solid', chamfer: s.chamfer ? { radius: s.chamfer } : undefined,
  }));
  Composite.add(engine.world, [floor, ...bodies]);
  const w = {
    engine, stage, fill: stage.fill, bottle: null, waters: [], blobs: [], split: 0, mainOff: 0,
    t: 0, landed: false, hitLand: false, touchedFloor: false, floorT: 0, still: 0, wrong: 0, lie: 0, calm: 0,
    done: null, events: [], nx: 0, ny: -1, wave: 0, wl: { x: 0, y: 0 },
  };
  Events.on(engine, 'collisionStart', ev => {
    for (const pr of ev.pairs) {
      const A = pr.bodyA.parent, B = pr.bodyB.parent;
      const other = A === w.bottle ? B : B === w.bottle ? A : null;
      if (!other) continue;
      const sp = Body.getSpeed(w.bottle) + Math.abs(Body.getAngularVelocity(w.bottle)) * 30;
      if (other.label === 'floor') w.touchedFloor = true; else w.landed = true;
      if (other.label === 'land') w.hitLand = true;
      w.events.push({ kind: other.label, sp, up: Math.cos(w.bottle.angle), av: Math.abs(Body.getAngularVelocity(w.bottle)) });
    }
  });
  return w;
}
function mainCenter(w) {
  const b = w.bottle;
  return { x: b.position.x - Math.sin(b.angle) * w.mainOff, y: b.position.y + Math.cos(b.angle) * w.mainOff };
}
// 水 = ボトルの胴の中だけを動ける重り（小さな剛体）。ボトルは中が空洞の壁でできていて、
// 水は壁にだけぶつかる。水の量で重りの重さと動ける幅が変わる
const WR = 6, NWATER = 2;                        // 重りの半径・数
const waterRange = f => ({ ax: 12.5 * (1 - f) * 0.6, ay: 26 * (1 - f) });
const CAT_WORLD = 1, CAT_WATER = 2;
// p: 胴の中心, ang: 角度, v: 速度, om: 角速度
function launch(w, p, ang, v, om) {
  const { ax, ay } = waterRange(w.fill);
  const yi = ay + WR, xi = ax + WR;              // 内壁の位置
  const H2 = BH / 2, W2 = BW / 2;
  const bot = Bodies.rectangle(p.x, p.y + (yi + H2) / 2, BW, H2 - yi, { chamfer: { radius: [0, 0, 5, 5] } });
  const top = Bodies.rectangle(p.x, p.y - (yi + H2) / 2, BW, H2 - yi, { chamfer: { radius: [7, 7, 0, 0] } });
  const lw = Bodies.rectangle(p.x - (xi + W2) / 2, p.y, W2 - xi, yi * 2 + 2);
  const rw = Bodies.rectangle(p.x + (xi + W2) / 2, p.y, W2 - xi, yi * 2 + 2);
  const neck = Bodies.rectangle(p.x, p.y - H2 - NKH / 2 + 1, NKW, NKH + 2);
  const cp = Bodies.rectangle(p.x, p.y - H2 - NKH - CPH / 2, CPW, CPH, { chamfer: { radius: 2 } });
  const b = Body.create({
    parts: [bot, top, lw, rw, neck, cp], friction: FRIC, frictionStatic: FRIC * 1.3, restitution: 0.04, frictionAir: 0.003, label: 'bottle',
    collisionFilter: { category: CAT_WORLD | CAT_WATER, mask: CAT_WORLD | CAT_WATER },
  });
  Body.setMass(b, MB);
  const Ltot = BH + NKH + CPH;
  Body.setInertia(b, MB * (BW * BW + Ltot * Ltot) / 12 * INERTIA_K);
  w.bottle = b;
  w.mainOff = p.y - b.position.y;
  Body.setAngle(b, ang);
  const mc = mainCenter(w);
  Body.setPosition(b, { x: b.position.x + p.x - mc.x, y: b.position.y + p.y - mc.y });
  // 水（2つの重り）は胴の底側にたまった状態から。ボトル＋水の重心が v で進み、重心まわりに om で回る
  const ca = Math.cos(ang), sa = Math.sin(ang), mw = MW_FULL * w.fill / NWATER;
  const pts = [];
  for (let k = 0; k < NWATER; k++) { const ly = ay - k * WR * 2.05; pts.push({ x: p.x - ly * sa, y: p.y + ly * ca }); }
  let cx = b.position.x * MB, cy = b.position.y * MB;
  for (const q of pts) { cx += q.x * mw; cy += q.y * mw; }
  cx /= MB + mw * NWATER; cy /= MB + mw * NWATER;
  Body.setVelocity(b, { x: v.x - om * (b.position.y - cy), y: v.y + om * (b.position.x - cx) });
  Body.setAngularVelocity(b, om);
  w.waters = pts.map(q => {
    const wb = Bodies.circle(q.x, q.y, WR, {
      friction: 0, frictionStatic: 0, frictionAir: 0, restitution: 0, label: 'water',
      collisionFilter: { category: CAT_WATER, mask: CAT_WATER },
    });
    Body.setMass(wb, mw);
    Body.setVelocity(wb, { x: v.x - om * (q.y - cy), y: v.y + om * (q.x - cx) });
    return wb;
  });
  Composite.add(w.engine.world, [b, ...w.waters]);
  w.nx = -sa; w.ny = -ca;   // ボトルから見た「上」
  w.blobs = w.waters.map(() => ({ x: 0, y: ay, nx: -sa, ny: -ca }));
  w.split = 0;
}

function localOf(w, q) {
  const b = w.bottle, mc = mainCenter(w), ca = Math.cos(b.angle), sa = Math.sin(b.angle);
  const dx = q.x - mc.x, dy = q.y - mc.y;
  return { x: dx * ca + dy * sa, y: -dx * sa + dy * ca };
}
// 万一すり抜けたときだけ、水を胴の中に戻す
function keepWaterInside(w) {
  const b = w.bottle, { ax, ay } = waterRange(w.fill);
  const mc = mainCenter(w), ca = Math.cos(b.angle), sa = Math.sin(b.angle);
  for (const wt of w.waters) {
    let { x: lx, y: ly } = localOf(w, wt.position);
    if (Math.abs(lx) <= ax + 2 && Math.abs(ly) <= ay + 2) continue;
    lx = clamp(lx, -ax, ax); ly = clamp(ly, -ay, ay);
    Body.setPosition(wt, { x: mc.x + lx * ca - ly * sa, y: mc.y + lx * sa + ly * ca });
    Body.setVelocity(wt, Body.getVelocity(b));
  }
}

// 物理の結果だけで判定する

// 投げの回転: 手首のスナップ（速さで決まる）に、序盤は「狙った台に届くころ1回転（または半回転）」へ寄せる手助けを混ぜる。

/* ---------- ゲーム状態 ---------- */

    if (pts === 2) floats.push({ text: 'ボーナス 2回分', x: b.position.x, y: b.bounds.min.y - 4, life: 1.2 });
    else if (streak > 0 && streak % 5 === 0) floats.push({ text: `${streak}連続！`, x: b.position.x, y: b.bounds.min.y - 4, life: 1.2 });

/* ---------- メインのステップ（実時間 1/60 秒） ---------- */
function step() {

  if (world && world.bottle) {
    physStep(world, timeScale);

const MATES = [

  { x: -18, h: 192, girl: false, hair: 2, ph: 2.1 },

function drawMates() {

    ctx.fillStyle = '#a3807a'; ctx.strokeStyle = '#a3807a';
    ctx.save(); ctx.translate(m.x + sway, y0);

      ctx.beginPath(); ctx.moveTo(-14, hipY - 6); ctx.lineTo(14, hipY - 6); ctx.lineTo(22, hipY + 26); ctx.lineTo(-22, hipY + 26); ctx.fill();
    } else {

    ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI * 2); ctx.fill();
    if (m.hair === 1) { ctx.beginPath(); ctx.arc(-headR * 0.9, headY + 2, headR * 0.55, 0, Math.PI * 2); ctx.fill(); }

/* ---------- ボトル ---------- */
function bottleOuter() {

  ctx.lineTo(-BW / 2, BH / 2 - 5); ctx.quadraticCurveTo(-BW / 2, BH / 2, -BW / 2 + 5, BH / 2);
  ctx.closePath();
}
function bottleInner() {
  ctx.beginPath();
  ctx.moveTo(-IW + 4, IB);
  ctx.lineTo(IW - 4, IB); ctx.quadraticCurveTo(IW, IB, IW, IB - 4);
  ctx.lineTo(IW, -18); ctx.quadraticCurveTo(IW, -27.5, NKW / 2 - 1.5, -BH / 2);
  ctx.lineTo(NKW / 2 - 1.5, -BH / 2 - NKH + 1); ctx.lineTo(-NKW / 2 + 1.5, -BH / 2 - NKH + 1);
  ctx.lineTo(-NKW / 2 + 1.5, -BH / 2); ctx.quadraticCurveTo(-IW, -27.5, -IW, -18);
  ctx.lineTo(-IW, IB - 4); ctx.quadraticCurveTo(-IW, IB, -IW + 4, IB);
  ctx.closePath();
}
// 胴の内側の長方形を「水面」で切ったときの水の面積
function waterArea(nx, ny, s) {
  const P = [[-IW, IT], [IW, IT], [IW, IB], [-IW, IB]], out = [];
  for (let i = 0; i < 4; i++) {
    const c = P[i], d = P[(i + 1) % 4];
    const dc = nx * c[0] + ny * c[1] - s, dd = nx * d[0] + ny * d[1] - s;
    if (dc <= 0) out.push(c);
    if ((dc < 0) !== (dd < 0)) { const k = dc / (dc - dd); out.push([c[0] + (d[0] - c[0]) * k, c[1] + (d[1] - c[1]) * k]); }
  }
  let a = 0; for (let i = 0; i < out.length; i++) { const p = out[i], q = out[(i + 1) % out.length]; a += p[0] * q[1] - q[0] * p[1]; }
  return Math.abs(a) / 2;
}
function waterLevel(nx, ny, fill) {
  const target = fill * (IW * 2) * (IB - IT);
  let lo = -45, hi = 45;
  for (let i = 0; i < 18; i++) { const m = (lo + hi) / 2; if (waterArea(nx, ny, m) < target) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
function drawBottle(x, y, a, fill, nx, ny, wave, ghost) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);

  ctx.fillStyle = 'rgba(218,236,244,.32)'; ctx.fill();
  // 水
  ctx.save(); bottleInner(); ctx.clip();
  const s = waterLevel(nx, ny, fill);

  const wph = t * 7;
  ctx.beginPath(); ctx.moveTo(-60, 90);
  for (let i = 0; i <= 24; i++) { const q = -60 + i * 5; ctx.lineTo(q, -s + Math.sin(q * 0.11 + wph) * wave * 0.9 + Math.sin(q * 0.05 - wph * 0.6) * wave * 0.5); }
  ctx.lineTo(60, 90); ctx.closePath();

  wg.addColorStop(0, 'rgba(120,186,222,.62)'); wg.addColorStop(1, 'rgba(70,140,190,.72)');
  ctx.fillStyle = wg; ctx.fill();

  ctx.fillStyle = '#f5fbff';
  ctx.beginPath(); ctx.moveTo(-BW / 2, 9); ctx.quadraticCurveTo(-6, 4, 0, 9); ctx.quadraticCurveTo(6, 14, BW / 2, 8); ctx.lineTo(BW / 2, 10); ctx.quadraticCurveTo(6, 16, 0, 11); ctx.quadraticCurveTo(-6, 6, -BW / 2, 11); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-1, 1.5); ctx.quadraticCurveTo(3.5, 5.5, -1, 7.5); ctx.quadraticCurveTo(-5.5, 5.5, -1, 1.5); ctx.fill();
  // 映り込み
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(-BW / 2 + 5, -16, 3.5, 44);
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(BW / 2 - 8, -12, 2, 38);
  ctx.restore();
  // 輪郭・くびれ
  bottleOuter(); ctx.strokeStyle = 'rgba(70,104,124,.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;

  ctx.fillStyle = '#e07a35'; rr(-CPW / 2, -BH / 2 - NKH - CPH, CPW, CPH, 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  for (let i = 0; i < 5; i++) ctx.fillRect(-CPW / 2 + 2.5 + i * 3.6, -BH / 2 - NKH - CPH + 2, 1.3, CPH - 4);
  ctx.fillStyle = 'rgba(120,50,20,.35)'; ctx.fillRect(-CPW / 2, -BH / 2 - NKH - 2, CPW, 2);
  ctx.restore();
}

    ctx.strokeStyle = '#f3efe4'; ctx.lineWidth = 28;
    ctx.beginPath(); ctx.moveTo(wx - ux * 11, wy - uy * 11); ctx.lineTo(wx - ux * 3, wy - uy * 3); ctx.stroke();
    ctx.fillStyle = '#e9b88f';
    ctx.save(); ctx.translate(hx - 8, hy + 3); ctx.rotate(ang * 0.35);
    rr(-16, -13, 28, 26, 10); ctx.fill(); ctx.restore();
  } else {
    // 首にかかる指と親指
    ctx.fillStyle = '#efc49c'; ctx.strokeStyle = 'rgba(150,90,60,.5)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) { rr(hx - 14, hy - 7 + i * 6, 25, 6.4, 3.2); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(hx - 6, hy - 10, 10, 4.6, -0.35, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

function drawAimGuide() {
  if (state !== 'play' || phase !== 'aim') return;
  if (kb) {
    const a = aimDeg * Math.PI / 180, L = 40 + kb.charge * 70;
    const x0 = hand.x + 10, y0 = hand.y - 20;
    ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(251,246,234,.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + Math.cos(a) * L, y0 - Math.sin(a) * L); ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  // 1投目だけ: はじく向きと速さのガイド（投げたら消える）
  if (world && world.stage.n === 0 && !drag) {
    const k = (hintT % 1.7) / 1.7;
    const ux = Math.sin(15 * Math.PI / 180), uy = -Math.cos(15 * Math.PI / 180), L = 130;
    const x0 = hand.x + 40, y0 = hand.y + 46;
    // 点線の矢印
    ctx.save();
    ctx.globalAlpha = 0.75; ctx.setLineDash([5, 7]); ctx.lineCap = 'round';
    ctx.strokeStyle = '#fbf6ea'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + ux * L, y0 + uy * L); ctx.stroke();
    ctx.setLineDash([]);
    const hx = x0 + ux * L, hy = y0 + uy * L;
    ctx.beginPath(); ctx.moveTo(hx - 9 * ux + 7 * uy, hy - 9 * uy - 7 * ux); ctx.lineTo(hx, hy); ctx.lineTo(hx - 9 * ux - 7 * uy, hy - 9 * uy + 7 * ux); ctx.stroke();
    // 半透明の指: 下に引いて → 右上へシュッ
    let fx = x0, fy = y0, a = 0.55;
    if (k < 0.35) { fy = y0 + (k / 0.35) * 26; }
    else if (k < 0.55) { const e = (k - 0.35) / 0.2; fx = x0 + ux * L * e; fy = y0 + 26 * (1 - e) + uy * L * e; }
    else { fx = x0 + ux * L; fy = y0 + uy * L; a = 0.55 * Math.max(0, 1 - (k - 0.55) / 0.3); }
    if (k >= 0.35 && k < 0.55) {   // 残像
      ctx.globalAlpha = 0.25; ctx.strokeStyle = '#fbf6ea'; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(x0 + ux * L * Math.max(0, (k - 0.45) / 0.2), y0 + 26 * (1 - Math.max(0, (k - 0.45) / 0.2)) + uy * L * Math.max(0, (k - 0.45) / 0.2)); ctx.lineTo(fx, fy); ctx.stroke();
    }
    ctx.globalAlpha = a; ctx.fillStyle = '#fbf6ea';
    ctx.beginPath(); ctx.arc(fx, fy, 11, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = a * 0.8; ctx.strokeStyle = '#2a2420'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    ctx.textAlign = 'center'; ctx.font = `17px ${FD}`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(42,36,32,.6)'; ctx.fillStyle = '#fbf6ea';
    const tx = hand.x + 96, ty = hand.y + 112;
    ctx.strokeText('下に引いて、右上へシュッ', tx, ty); ctx.fillText('下に引いて、右上へシュッ', tx, ty);
    ctx.font = `700 12px ${FB}`; ctx.lineWidth = 4;
    ctx.strokeText('強すぎると飛びすぎる', tx, ty + 20); ctx.fillText('強すぎると飛びすぎる', tx, ty + 20);
    ctx.textAlign = 'start';
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#ecd9b8'; ctx.fillRect(0, 0, W, H);
  // カメラ: 高く飛んだら少し追う
  let target = camBase;
  if (world && world.bottle && phase !== 'slide') target = Math.min(camBase, world.bottle.position.y - 110);
  camY += (target - camY) * 0.12;
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (W / 2 + sx), dpr * (-camY * scale + sy));
  drawRoom();
  drawMates();
  // 着地先とボトル
  let ox = 0;
  if (phase === 'slide' && prev) {
    const k = clamp(phaseT / 0.5, 0, 1), e = 1 - Math.pow(1 - k, 3);
    const off = -e * (VW + 120);
    drawTarget(prev.world, off);
    if (prev.snap) { const p = prev.snap; drawBottle(p.x + off, p.y, p.a, p.fill, p.nx, p.ny, 0); }
    ox = (1 - e) * (VW + 120);
  }
  if (world) drawTarget(world, ox);
  const inHand = phase === 'aim' || phase === 'slide' || state === 'title';
  if (!inHand || state === 'over') drawArm(false);
  if (world && world.bottle) {
    const mc = mainCenter(world);
    drawBottle(mc.x, mc.y, world.bottle.angle, world.fill, world.nx, world.ny, world.wave);
  } else if (inHand && world) {
    drawArm(false);
    const p = gripToMain(hand, holdAng);
    // 手の中では水面は水平（ボトルから見た「上」の向き）
    drawBottle(p.x, p.y, holdAng, world.fill, -Math.sin(holdAng), -Math.cos(holdAng), drag ? 1.5 : 0.4);
    drawArm(true);
  }
  drawAimGuide();
  // 文字
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 2.2);
    ctx.font = `${f.big ? 28 : 17}px ${FD}`;
    ctx.lineWidth = 6; ctx.strokeStyle = '#fbf6ea'; ctx.fillStyle = f.big ? '#c4532a' : '#2d4a3c';
    const y = f.y - (1 - f.life) * 26;
    const x = clamp(f.x, -VW / 2 + 90, VW / 2 - 90);
    ctx.strokeText(f.text, x, y); ctx.fillText(f.text, x, y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'start';
  // スロー中の縁取り
  if (timeScale < 0.99) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const k = 1 - timeScale;
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(60,30,20,0)'); vg.addColorStop(1, `rgba(60,30,20,${0.35 * k})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- 結果 ---------- */
function showOver() {
  state = 'over';
  rec.plays++;
  rec.total += successes; rec.inv += invs;
  const isNew = streak > rec.best;
  if (isNew) rec.best = streak;
  save();
  $('oScore').textContent = streak; $('oBest').textContent = rec.best; $('oTotal').textContent = rec.total; $('oInv').textContent = rec.inv;
  $('oCause').textContent = `${successes + 1}投目（${world.stage.name}）：${lastCause}`;
  $('newRec').hidden = !(isNew && streak > 0);
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({
    text: `${shareText()}${isNew && streak > 0 ? ' 自己ベスト更新！' : ''}\n`,
    url: gameUrl(), hashtags: 'ボトルフリップ'
  });
  $('copyMsg').textContent = '画面タップ・スペースでもう一回';
  $('over').hidden = false; $('hud').hidden = true;
  overShownAt = performance.now();
  $('retryBtn').focus({ preventScroll: true });
}
const shareText = () => streak > 0 ? `🧴ボトルフリップ ${streak}連続で立った！` : '🧴ボトルフリップ 1回も立たなかった…';

/* ---------- シェア ---------- */
// 公開先のURL。ローカルで開いたときもこれをシェアする
const PUBLIC_URL = 'https://asobi.enludus.com/games/flip/';
function gameUrl() {
  try {
    if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost') return location.origin + location.pathname;
  } catch {}
  return PUBLIC_URL;
}

/* ---------- HUD ---------- */
function updateHud() {
  $('hScore').textContent = streak;
  if (world) {
    $('hNo').textContent = `${world.stage.n + 1}投目の着地先`;
    $('hStage').textContent = world.stage.name + (world.stage.bonus ? '★' : '');
    $('hInfo').textContent = `水 ${Math.round(world.fill * 100)}%・最高 ${Math.max(rec.best, state === 'play' ? streak : 0)}`;
  }
}
function fillTitle() { $('tBest').textContent = rec.best; $('tTotal').textContent = rec.total; $('tInv').textContent = rec.inv; }

/* ---------- ループ ---------- */
let acc = 0, lastTs = performance.now();
function frame(ts) {
  acc += Math.min(100, ts - lastTs); lastTs = ts;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function start() {
  wakeAudio(); state = 'play'; newGame(); hintT = 0;
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  updateHud();
}
const toWorld = (cx, cy) => ({ x: (cx - W / 2) / scale, y: cy / scale + camY });
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || phase !== 'aim' || drag || kb) return;
  try { cvs.setPointerCapture(e.pointerId); } catch {}
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, hist: [{ x: e.clientX, y: e.clientY, t: performance.now() }] };
});
cvs.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const now = performance.now();
  drag.hist.push({ x: e.clientX, y: e.clientY, t: now });
  while (drag.hist.length > 2 && now - drag.hist[0].t > 160) drag.hist.shift();
  let dx = (e.clientX - drag.x0) / scale, dy = (e.clientY - drag.y0) / scale;
  const m = Math.hypot(dx, dy), lim = 72;
  if (m > lim) { dx *= lim / m; dy *= lim / m; }
  handOff = { x: dx, y: dy };
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const now = performance.now();
  if (e) drag.hist.push({ x: e.clientX, y: e.clientY, t: now });
  const h = drag.hist, last = h[h.length - 1];
  let first = h[0];
  for (let i = h.length - 1; i >= 0; i--) { first = h[i]; if (last.t - h[i].t >= 60) break; }
  drag = null;
  const dt = last.t - first.t;
  if (dt < 8 || now - last.t > 120) { hintT = 0; return; }
  // はじく速さ（画面px/ms）と向き → 初速。速さは指数 FLICK_E でなだらかに、向きは「やや右上」を中心に寄せる
  const gx = (last.x - first.x) / dt, gy = (last.y - first.y) / dt, gs = Math.hypot(gx, gy);
  if (gy > -0.25 || gs < FLICK_MIN) { hintT = 0; return; }
  const tg = Math.atan2(gx, -gy) * 180 / Math.PI;               // 真上から右へ何度か
  const ang = clamp(FLICK_A0 - (tg - 15) * FLICK_K, 35, 120) * Math.PI / 180;
  const sp = FLICK_V0 * Math.pow(gs / 1.5, FLICK_E);
  throwBottle({ x: Math.cos(ang) * sp, y: -Math.sin(ang) * sp });
}
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', () => { drag = null; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
// タイトル・結果: ボタンやリンク以外ならどこを押しても開始
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a')) return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
window.addEventListener('keydown', e => {
  if (state === 'play') {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { e.preventDefault(); aimDeg = clamp(aimDeg + (e.code === 'ArrowLeft' ? 3 : -3), 30, 88); return; }
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    e.preventDefault();
    if (!e.repeat && phase === 'aim' && !drag && !kb) { wakeAudio(); kb = { t0: t, charge: 0 }; }
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
window.addEventListener('keyup', e => {
  if ((e.code !== 'Space' && e.code !== 'Enter') || !kb) return;
  const a = aimDeg * Math.PI / 180, sp = 7 + kb.charge * 15;
  kb = null;
  throwBottle({ x: Math.cos(a) * sp, y: -Math.sin(a) * sp });
});
window.addEventListener('blur', () => { drag = null; kb = null; });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText()} 最高${rec.best}連続 ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try {
    navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback);
  } catch { fallback(); }
});

// 調整・テスト用: 同じ物理でオフライン試投（ゲームの状態には触れない）
window.__flip = {
  sim(n, vx, vy, fill, ang = 0, trace) {
    const st = makeStage(n); if (fill !== undefined) st.fill = fill;
    const w = makeWorld(st);
    const v = { x: vx, y: vy };
    const p0 = gripToMain(HAND, ang);
    launch(w, p0, ang, v, spinFor(v, p0, ang, st));
    let i = 0;
    const tr = [];
    for (; i < 60 * 9 && !w.done; i++) {
      physStep(w, 1); judge(w, 1 / 60);
      if (trace && i % trace === 0) tr.push([i, Math.round(w.bottle.position.x), Math.round(w.bottle.position.y), +w.bottle.angle.toFixed(2), Math.round(w.wl.x), Math.round(w.wl.y), +Body.getAngularVelocity(w.bottle).toFixed(3), w.blobs.map(q => Math.round(q.y)).join('/')].join(' '));
    }
    if (trace) return tr.join('\n');
    return { ...(w.done || { ok: false, cause: 'none' }), rot: +(w.bottle.angle / (2 * Math.PI)).toFixed(2), x: Math.round(w.bottle.position.x), steps: i };
  },
  rawTurns(n, vx, vy) { const st = makeStage(n), v = { x: vx, y: vy }, p = gripToMain(HAND, 0); const yl = st.surf.top - BH / 2 - p.y, disc = v.y * v.y + 2 * gU * yl; const T = disc > 0 ? (-v.y + Math.sqrt(disc)) / gU : -2 * v.y / gU; return T > 8 ? flightAngle(st.fill, p, 0, v, spinFor(v), T) / (2 * Math.PI) : null; },
  stage(n) { successes = n; setupStage(n); },
  throw(vx, vy) { throwBottle({ x: vx, y: vy }); },
  tune(o) { if (o.spin) SPIN = o.spin; if (o.mb) MB = o.mb; if (o.mw) MW_FULL = o.mw; if (o.fric) FRIC = o.fric; if (o.ak) ASSIST_K = o.ak; if (o.ik) INERTIA_K = o.ik; if (o.raw !== undefined) RAW_FORCE = o.raw; },
  get state() {
    const b = world && world.bottle;
    return { lastThrow, cause: lastCause, state, phase, streak, successes, stage: world && world.stage.name, bottle: b ? { sx: Math.round(W / 2 + b.position.x * scale), sy: Math.round((b.position.y - camY) * scale) } : null };
  },
};

camY = camBase;
setupStage(0);
fillTitle();
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
})();
</script>
<a class="hub-back" id="hubBack" href="/" aria-label="あそび横丁（ゲーム一覧）にもどる">← 横丁</a>
<script>
// プレイ中でもゲーム一覧に戻れるボタン。押してもゲームの入力（タップ・ドラッグ）に伝わらないようにする
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) document.getElementById('hubBack').addEventListener(ev, e => e.stopPropagation(), { passive: true });
</script>
