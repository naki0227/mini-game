<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }

  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;

}

html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- ヨーヨー釣りの物理（自前。three には頼らない。長さ m・重さ kg・力 N・時間 秒） ----------
   水面は y = 0。プールの水は x ∈ ±PX、z ∈ ±PZ（z が + の側が 手前＝自分の側）。ポンプで 水が ゆっくり ぐるぐる回っている。
   水ヨーヨー: ゴム風船に 少しの水と たくさんの空気。浮力で 浮く（球の 水に沈んだぶんの体積 × 水の重さ ＝ 重さ でつりあう高さ）。
     ゴムひも（長さ lb）の先に 輪。輪は 水面に浮いているか、少し沈んでいる（ls）。ヨーヨー同士は ぶつかって はね返り、まわる（ひもの向き phi が変わる）。
   こより＋針金のフック: 押した所に フックを下ろす。押している間 少しずつ 沈む（深さ depth）。押したまま 指を動かすと フックが 水の中を動く（速さには上限）。
     フックが 輪の外から内へ 横切ったら 引っかかる（ただし フックが 輪より深くないと 輪を 押し沈めるだけ）。
     どれだけ 奥に かかったか q = 1 − （横切った線と 輪の中心の距離 ÷ 輪の半径）。浅いと 張力が少しで つるっと外れる。
   こよりの濡れ w（0〜1）: 水につかっている間 WR0 + WR1·深さ の速さで 濡れる。ヨーヨーから したたる水でも 濡れる。乾かない。
     強さ S = S_DRY·(1 − w)^P_W·(1 − 傷み)。張力が S をこえたら ぷつっ（おしまい）。強く引かれるほど 傷む。
   持ち上げ（指を離すと 自動で そっと上がる）: 手が V_LIFT で上がる。ゴムが のびて 張力 T = K_R·のび + 減衰。
     ヨーヨー（3D）: 重さ・浮力・水の抵抗（速いほど大きい）・水面から はなれるときの 吸いつき・ゴムの力。水から出ると びよんびよん 上下にゆれる。
   もう一度 押すと「一気に お皿へ」: 手が 皿の上へ すばやく動く（最小ジャークの道すじ）。その加速と ゴムの のび戻りで 張力が 跳ね上がる。
     ゆれの どの瞬間に 振り上げるかで 張力の山が 大きく変わる。水から はなれる前に 振り上げると 吸いつきと 抵抗で 大きな張力。
   皿に のったら 釣れた。入力は すべて 時刻つき（画面のコマには よらない）。1/240 秒きざみ。 */
const PH = {
  DT: 1 / 240, G: 9.8, RHO: 1000,
  PX: 0.31, PZ: 0.44, RIM: 0.045,
  N0: 13, NMIN: 8, NADD: 4, RESTOCK_T: 1.4,
  SIZE: { S: { r: [0.031, 0.035], m: [0.034, 0.048], p: 0.36 }, M: { r: [0.036, 0.04], m: [0.058, 0.078], p: 0.4 }, L: { r: [0.041, 0.046], m: [0.088, 0.112], p: 0.24 } },
  LB: [0.07, 0.1], R_LOOP: 0.018, HOOK_W: 0.006,
  LS_SUNK: [0.007, 0.02], P_FLOAT0: 0.74, P_FLOAT_K: 0.015, P_FLOAT_MIN: 0.42,
  U0: 0.02, U_K: 0.0006, TAU_H: 1.1, OM_TAU: 1.6, OM_NOISE: 0.5, E_BALL: 0.35, SPIN_K: 9,
  V_HOOK: 0.36, D0: 0.003, V_SINK: 0.02, D_MAX: 0.026, LOOP_CLR: 0.003, Q_MIN: 0.15,
  S_DRY: 2.8, P_W: 1.4, WR0: 0.015, WR1: 1.2, DRIP: 0.012, DRIP_TAU: 1.6, WEAR: 0.006, WEAR_HI: 0.06,
  K_R: 15, ZETA: 0.06,
  CV1: 1.0, CV2: 8, CH: 0.7, SUC: 0.18, HS: 0.012, V_SUC: 0.15, CAIR: 0.01,
  SLIP0: 0.35, SLIP1: 3.0,
  V_LIFT: 0.16, HY_MAX: 0.34, AUTO_SW: 3.5, LIFT_MAX: 6, SW_T0: 0.8, SW_TK: 0.9, SW_UP: 0.4, TY: 0.2, YANK: 0.065, TV: 0.75, SW_LAP: 1.2,
  DISH: { x: 0.19, y: 0.05, z: 0.56, r: 0.08 }, V_LOWER: 0.14, CATCH_T: 0.15, RESET_T: 0.35,
  T_IDLE: 40, OMAKE: 10,
};
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function rndG(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const capV = (h, r) => Math.PI * h * h * (3 * r - h) / 3;
function eqDepth(r, m) { const V = m / PH.RHO; let lo = 0, hi = 2 * r; for (let i = 0; i < 40; i++) { const h = (lo + hi) / 2; if (capV(h, r) < V) lo = h; else hi = h; } return (lo + hi) / 2; }
const lerpR = (a, k) => a[0] + (a[1] - a[0]) * k;

/* ヨーヨーを1つ作る（種から決まる） */
function makeBall(g, x, z, kind) {
  const r = () => rndG(g);
  if (!kind) { const u = r(); kind = u < PH.SIZE.S.p ? 'S' : u < PH.SIZE.S.p + PH.SIZE.M.p ? 'M' : 'L'; }
  const Z = PH.SIZE[kind], k = r();
  const rad = lerpR(Z.r, k), m = lerpR(Z.m, clampP(k + (r() - 0.5) * 0.4, 0, 1));
  const pf = Math.max(PH.P_FLOAT_MIN, PH.P_FLOAT0 - PH.P_FLOAT_K * g.caught);
  const ls0 = r() < pf ? 0 : lerpR(PH.LS_SUNK, r());
  const h = eqDepth(rad, m);
  return { id: g.nid++, kind, x, z, vx: 0, vz: 0, r: rad, m, heq: h, yeq: rad - h, lb: lerpR(PH.LB, r()), ls: ls0, ls0, phi: r() * 6.283, om: (r() - 0.5) * 0.6,
    col: (r() * 8) | 0, pat: (r() * 3) | 0, band: (r() * 3) | 0, st: 'float', y: rad - h, vy: 0, bob: 0, bobV: 0, lx: 0, lz: 0, noise: r() * 100, spill: 0 };
}
function loopPos(b) { const L = b.r + b.lb; b.lx = b.x + Math.cos(b.phi) * L; b.lz = b.z + Math.sin(b.phi) * L; }
function placeFree(g, x, z, r) {
  for (const b of g.balls) if (b.st === 'float' && Math.hypot(b.x - x, b.z - z) < b.r + r + 0.004) return false;
  return true;
}
function addBalls(g, n, far) {
  let k = 0, tries = 0;
  while (k < n && tries++ < 400) {
    const x = (rndG(g) * 2 - 1) * (PH.PX - 0.06), z = far ? -PH.PZ + 0.06 + rndG(g) * 0.18 : (rndG(g) * 2 - 1) * (PH.PZ - 0.07);
    const b = makeBall(g, x, z);
    if (!placeFree(g, x, z, b.r)) { g.nid--; continue; }
    if (far) { b.vz = 0.05 + rndG(g) * 0.04; b.bob = -0.02; b.spill = 1; }
    loopPos(b); g.balls.push(b); k++;
    if (far) g.events.push({ type: 'splash', x, z, big: 0.6 });
  }
}
function makeGame(seed = 1) {
  const g = {
    seed, rs: (seed ^ 0x9e3779b9) >>> 0, t: 0, phase: 'ready', over: false, fail: null, failInfo: null, overT: -1,
    balls: [], nid: 0, caught: 0, grams: 0, bestG: 0, omake: 0, caughtList: [],
    hk: { x: 0.05, z: 0.3, tx: 0.05, tz: 0.3, depth: 0 }, hand: { x: 0.05, y: 0.06, z: 0.3, vx: 0, vy: 0, vz: 0 },
    w: 0, wear: 0, T: 0, peakT: 0, hooked: null, q: 0, pressed: false, pressT: -1, phaseT: 0, lifted: false, liftT: -1, liftStart: -1,
    sw: null, contactT: 0, lastCatchT: 0, restockAt: -1, presses: 0, dips: 0, slips: 0, grazes: 0, pushes: 0, swings: 0, autoSw: 0,
    queue: [], events: [], log: null, lastS: 0, sPrev: 0, sdPrev: 0, inWater: false, cool: [],
  };
  addBalls(g, PH.N0, false);
  // 手前の よい所に 1〜2個（はじめの1個は とりやすく）
