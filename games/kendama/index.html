<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';
let THREE, RAPIER;
try {
  const [t, r] = await Promise.all([import(THREE_URL), import(RAPIER_URL)]);
  THREE = t; RAPIER = r.default;
  await RAPIER.init();
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D/物理エンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- けん玉の物理（three には頼らない。Rapier の剛体だけ） ----------
   長さの単位は cm。玉は直径 6cm、皿のふちの輪の直径は 大皿 5.4cm・中皿 4.7cm・小皿 4.1cm、糸 34cm。
   重力だけは本物の 15〜33% に弱めて、玉が「ふわっ」と上がって落ちてくるようにしてある（指でも間に合うように）。
   はじめはいちばんゆっくりで、乗るたびに少しずつ強くなる（リズム＝テンポが上がる）。
   けんは手で持っている（キネマティック）。指 → 手の目標 → ばねで追いかける手 → けんの位置と向き、の順に決まる。
   玉は本物の剛体で、糸（ロープ拘束）でけんにつながる。皿は「ふち」をカプセルの輪で作ってあり、玉はふちの輪に乗る。
   乗った＝玉が指定の皿の輪の内側で、皿と同じ速さになって止まっている状態が続いたとき（当たったら成功、はしない）。 */
const PH = {
  G0: 150, GK: 3.5, GMAX: 320, DT: 1 / 600, ITERS: 6,   // 重力: はじめは G0（ゆっくり）、乗るたびに GK ずつ強く（テンポが上がる）、GMAX まで
  R: 3.0,                     // 玉の半径
  ROPE: 34,                   // 糸の長さ
  RR: 0.32,                   // 皿のふちの太さ（半径）
  E_BALL: 0.2, E_CUP: 0.2, MU: 0.55,
  OMEGA: 50, OMEGA_X: 18,     // 手がねらいを追いかける速さ（ばね）。横はゆっくり（すばやいポンの斜めのぶれが玉に伝わりにくい）
  VMAX: 260,                  // 手の速さの上限
  TILT_K: 0.001, TILT_MAX: 0.2,   // 手の横の速さ → 傾き
  TURN: 0.2, DIP: 7,          // 手首を返して次の皿を上に向ける時間と、そのあいだ手を沈める深さ（返すけんが玉に当たらないように）
  REST_V: 7, REST_T: 0.15,    // 乗った判定: 皿との相対速度がこれ以下で、この時間つづく
  ROLL: 10,                   // 皿のふちに触れている間の転がり抵抗（塗りのグリップ）。玉が皿の中でいつまでも転がり続けないように
  HAND: { x0: -9, x1: 9, y0: -9, y1: 12 },
  GX: 0.42, GY: 0.8,          // 指の動き → 手の動き（画面上の長さに対する倍率）。上下が主、左右は控えめ
};
// けんの形（ローカル座標。原点 = 皿胴の真ん中＝糸の結び目。皿胴は y 方向、けんの軸は x 方向）
const CUPS = {
  o: { name: '大皿', c: { x: 0, y: 3.9, z: 0 }, n: { x: 0, y: 1, z: 0 }, a: 2.7 },
  k: { name: '小皿', c: { x: 0, y: -3.5, z: 0 }, n: { x: 0, y: -1, z: 0 }, a: 2.05 },
  c: { name: '中皿', c: { x: 11.0, y: 0, z: 0 }, n: { x: 1, y: 0, z: 0 }, a: 2.35 },
};
const qAxisO = (ax, ay, az, a) => { const s = Math.sin(a / 2); return { x: ax * s, y: ay * s, z: az * s, w: Math.cos(a / 2) }; };
const qMulO = (a, b) => ({ w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z, x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y, y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x, z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w });
function qRotO(q, v) {
  const { x, y, z, w } = q;
  const ix = w * v.x + y * v.z - z * v.y, iy = w * v.y + z * v.x - x * v.z, iz = w * v.z + x * v.y - y * v.x, iw = -x * v.x - y * v.y - z * v.z;
  return { x: ix * w + iw * -x + iy * -z - iz * -y, y: iy * w + iw * -y + iz * -x - ix * -z, z: iz * w + iw * -z + ix * -y - iy * -x };
}
function qSlerpO(a, b, t) {
  let c = a.x * b.x + a.y * b.y + a.z * b.z + a.w * b.w, bb = b;
  if (c < 0) { c = -c; bb = { x: -b.x, y: -b.y, z: -b.z, w: -b.w }; }
  let k0 = 1 - t, k1 = t;
  if (c < 0.9995) { const o = Math.acos(c), s = Math.sin(o); k0 = Math.sin((1 - t) * o) / s; k1 = Math.sin(t * o) / s; }
  const q = { x: a.x * k0 + bb.x * k1, y: a.y * k0 + bb.y * k1, z: a.z * k0 + bb.z * k1, w: a.w * k0 + bb.w * k1 };
  const n = Math.hypot(q.x, q.y, q.z, q.w); return { x: q.x / n, y: q.y / n, z: q.z / n, w: q.w / n };
}
// その皿を真上に向ける、けんの向き
const CUP_Q = { o: { x: 0, y: 0, z: 0, w: 1 }, c: qAxisO(0, 0, 1, Math.PI / 2), k: qAxisO(1, 0, 0, Math.PI) };
const vAdd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }), vSub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z });
const vDot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z, vScale = (a, k) => ({ x: a.x * k, y: a.y * k, z: a.z * k });
const vLerp = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, z: a.z + (b.z - a.z) * k });
const vLen = a => Math.hypot(a.x, a.y, a.z);
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// 回数ごとの決まり: どの2枚を交互に使うか・1回にかけていい時間（テンポ）
function cupPair(n) { return n < 20 ? ['o', 'c'] : n < 40 ? ['o', 'k'] : ['c', 'k']; }
function cupFor(n) { const p = cupPair(n); return p[n % 2]; }      // n 回目を乗せる皿（0 回目 = はじめに乗っている皿）
function gravFor(n) { return Math.min(PH.GMAX, PH.G0 + PH.GK * n); }   // n 回乗ったあとの重力
function tempoLimit(n) { return n < 5 ? 6 : Math.max(1.2, 3.0 - 0.035 * n); }   // n 回目（n-1 → n）にかけていい秒数

function makeGame(RAPIER, opts = {}) {
  const world = new RAPIER.World({ x: 0, y: -gravFor(0), z: 0 });
  world.timestep = PH.DT;
  const ip = world.integrationParameters;
  ip.numSolverIterations = PH.ITERS; ip.maxCcdSubsteps = 4;
  ip.allowedLinearError = 0.01; ip.predictionDistance = 0.05;

  // けん（手で持つのでキネマティック）
  const ken = world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(0, -CUPS.o.c.y, 0));
  const cupCols = new Map();
  const kc = (desc, cup) => { const c = world.createCollider(desc.setFriction(PH.MU).setRestitution(PH.E_CUP), ken); if (cup) cupCols.set(c.handle, cup); return c; };
  const basis = n => {   // 皿の向き n に直交する u, v
    const u = Math.abs(n.y) > 0.9 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 1, z: 0 };
    const v = { x: n.y * u.z - n.z * u.y, y: n.z * u.x - n.x * u.z, z: n.x * u.y - n.y * u.x };
    const u2 = { x: v.y * n.z - v.z * n.y, y: v.z * n.x - v.x * n.z, z: v.x * n.y - v.y * n.x };
    return { u: u2, v };
  };
  const qFromY = n => { // ローカル y 軸を n へ
    const d = n.y; if (d > 0.9999) return { x: 0, y: 0, z: 0, w: 1 }; if (d < -0.9999) return { x: 1, y: 0, z: 0, w: 0 };
    const q = { x: n.z, y: 0, z: -n.x, w: 1 + d }; const l = Math.hypot(q.x, q.y, q.z, q.w); return { x: q.x / l, y: q.y / l, z: q.z / l, w: q.w / l };
  };
  for (const [id, C] of Object.entries(CUPS)) {
    const { u, v } = basis(C.n), K = 16, seg = 2 * C.a * Math.sin(Math.PI / K);
    for (let i = 0; i < K; i++) {
      const a0 = (i + 0.5) * 2 * Math.PI / K, ca = Math.cos(a0), sa = Math.sin(a0);

const LYRICS = 'もしもしかめよ かめさんよ せかいのうちで おまえほど あゆみののろい ものはない どうしてそんなに のろいのか なんとおっしゃる うさぎさん そんならおまえと かけくらべ むこうのおやまの ふもとまで どっちがさきに かけつくか どんなにかめが いそいでも どうせばんまで かかるだろ ここらでちょっと ひとねむり グーグーグーグー グーグーグー これはねすぎた しくじった ピョンピョンピョンピョン ピョンピョンピョン あんまりおそい うさぎさん さっきのじまんは どうしたの';

  let i = (Math.max(1, n) - 1) % NCHARS, k = 0;
  for (; k < PHRASES.length; k++) { if (i < PHRASES[k].length) break; i -= PHRASES[k].length; }
  return { k, i, ch: PHRASES[k][i], phrase: PHRASES[k] };
}

  if (n <= 0) return '';
  const L = lyricAt(n); let s = '';
  for (let k = 0; k < L.k; k++) s += PHRASES[k] + ' ';
  s += L.phrase.slice(0, L.i + 1);

  else if (s.length > 34) s = '…' + s.slice(-33);

}

  const y = W / H < 0.75 ? H - safeB - 92 : safeT + 240;
  const msg = game.phase === 'rest' ? ['どこでもドラッグ。', '上へシュッと引いて玉をポン！'] : ['落ちてくる玉に皿を合わせて', '少し下げながら受ける'];
  txt(msg[0], W / 2, y, 16 * sc, '#2a1d16', 'rgba(255,246,228,.95)', 6, `700 ${FB}`);
  txt(msg[1], W / 2, y + 24, 18 * sc, '#9b2a1f', 'rgba(255,246,228,.95)', 6, `700 ${FB}`);
  if (game.phase === 'rest') {
    // 上向きの矢印が、すっと上がる
    const k = (tt * 1.1) % 1, cx = W / H < 0.75 ? W / 2 : W / 2 - 220 * sc, cy = (W / H < 0.75 ? y - 44 : y + 30) - easeOut(k) * 50;
    fx.globalAlpha = Math.sin(k * Math.PI) * 0.85;
    fx.strokeStyle = '#9b2a1f'; fx.lineWidth = 5; fx.lineCap = 'round'; fx.lineJoin = 'round';
    fx.beginPath(); fx.moveTo(cx - 14, cy + 10); fx.lineTo(cx, cy - 4); fx.lineTo(cx + 14, cy + 10); fx.stroke();
    fx.beginPath(); fx.moveTo(cx - 14, cy + 24); fx.lineTo(cx, cy + 10); fx.lineTo(cx + 14, cy + 24); fx.stroke();
    fx.globalAlpha = 1;
  }
}
const easeOut = k => 1 - (1 - k) * (1 - k);

/* ---------- 結果 ---------- */
const FAIL_MSG = {
  drop: '玉がこぼれた。落ちてくる玉に皿を合わせて、けんを少し下げながら受けると、跳ねずにすっと乗る。',
  miss: '皿に届かなかった。まっすぐ上へ引くと玉もまっすぐ上がる。横にずれたら手で追いかけて。',
  late: 'テンポに遅れた。回数が増えるほどテンポが上がる。乗ったらすぐ次のポン。',
  wrong: 'ちがう皿に乗った。名札の皿に乗せよう。',
};
function showOver() {
  if (state !== 'play') return;
  state = 'over';
  const n = game.n;
  const isNew = n > rec.best;
  rec.plays++; rec.total += n; rec.last = n; if (isNew) rec.best = n;
  save();
  $('oScore').textContent = n;
  $('oLyric').textContent = n > 0 ? `「${lyricSoFar(n)}」` : '';
  let msg = FAIL_MSG[game.fail] || FAIL_MSG.drop;
  if (game.fail === 'drop' && lastCatch && lastCatch.landV > 45) msg = '強く当たって跳ねた。落ちてくる玉と同じ向きに、けんを少し下げながら受けると跳ねない。';
  if (n >= 20 && game.fail !== 'late') msg += ' 小皿は小さいぶん、真ん中で受けないと乗らない。';
  $('oMsg').textContent = msg;
  $('oNoren').innerHTML = ({ late: 'おくれた', wrong: 'ちがう' }[game.fail] || 'ぽろっ').split('').map(c => `<span>${c}</span>`).join('');
  $('oBest').textContent = rec.best; $('oTotal').textContent = rec.total; $('oPlays').textContent = rec.plays;
  $('newRec').hidden = !(isNew && n > 0);
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({ text: `${shareText(n)}${isNew && rec.plays > 1 && n > 0 ? ' 自己ベスト！' : ''}\n`, url: gameUrl(), hashtags: 'けん玉' });
  $('copyMsg').textContent = '画面タップ・スペースでもう一回';
  $('over').hidden = false; $('hud').hidden = true;
  overShownAt = performance.now();
  $('retryBtn').focus({ preventScroll: true });
}
const shareText = n => `🔴けん玉 もしもしかめ ${n}回つづいた！`;

/* ---------- シェア ---------- */
// 公開先のURL。ローカルで開いたときもこれをシェアする
const PUBLIC_URL = 'https://asobi.enludus.com/games/kendama/';
function gameUrl() {
  try {
    if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost') return location.origin + location.pathname;
  } catch {}
  return PUBLIC_URL;
}

/* ---------- HUD ---------- */
function updateHud() { $('hBest').textContent = rec.best ? `${rec.best}回` : '—'; }
function fillTitle() { $('tBest').textContent = rec.best || '—'; $('tTotal').textContent = rec.total; }

/* ---------- 音（木の音。低めでやわらかく、2kHz 以上は使わない） ---------- */
let ac = null, master = null, noiseBuf = null;
function wakeAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = 0.5;
      master = ac.createDynamicsCompressor(); master.threshold.value = -16; master.ratio.value = 5;
      master.connect(lp).connect(ac.destination);
      const len = ac.sampleRate * 1.5; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); let b = 0;
      for (let i = 0; i < len; i++) { b = b * 0.7 + (Math.random() * 2 - 1) * 0.3; d[i] = b * 2; }
    }
    if (ac.state === 'suspended') ac.resume();
  } catch {}
}
const live = () => ac && state === 'play';
function tone(freq, at, dur, vol, type = 'sine', f1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at); if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
  return o;
}
function noise(at, dur, vol, type, freq, q = 1) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(lp).connect(g).connect(master); s.start(at, Math.random() * 1.0); s.stop(at + dur + 0.05);
  return f;
}
// 乗った音: 大皿は「コン」（低く丸い）、中皿・小皿は「カッ」（短く硬い）。強く当たるほど少し大きい
function sCatch(cup, v) {
  try {
    if (!live()) return; const n0 = ac.currentTime, k = clamp(0.55 + v / 90, 0.55, 1);
    if (cup === 'o') { tone(410, n0, 0.2, 0.17 * k, 'sine', 380); tone(820, n0, 0.08, 0.04 * k, 'sine'); tone(205, n0, 0.12, 0.07 * k, 'triangle'); noise(n0, 0.025, 0.1 * k, 'bandpass', 700, 1.2); }
    else { const f = cup === 'k' ? 690 : 600; tone(f, n0, 0.09, 0.15 * k, 'triangle', f * 0.93); tone(f * 1.9, n0, 0.04, 0.035 * k, 'sine'); noise(n0, 0.02, 0.13 * k, 'bandpass', 1100, 1.5); }
  } catch {}
}
// 皿のふちに当たる「コツ」
function sKotsu(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 70, 0.12, 0.7), f = 330 + Math.random() * 120; tone(f, n0, 0.06, 0.07 * k, 'triangle'); noise(n0, 0.02, 0.05 * k, 'lowpass', 900); } catch {} }
// 玉が上がる「ひゅっ」
function sPop(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 60, 0.2, 1); const f = noise(n0, 0.14, 0.03 + 0.04 * k, 'bandpass', 280, 1.4); f.frequency.exponentialRampToValueAtTime(520 + k * 300, n0 + 0.12); } catch {} }
// 落ちた「ころん、ぶらん」
function sFail() { try { if (!live()) return; const n0 = ac.currentTime; tone(300, n0, 0.08, 0.08, 'triangle'); tone(240, n0 + 0.11, 0.1, 0.06, 'triangle'); tone(160, n0 + 0.05, 0.45, 0.07, 'sine', 95); } catch {} }
function sChime() { try { if (!live()) return; const n0 = ac.currentTime + 0.05; [[523, 0], [659, 0.1], [784, 0.2]].forEach(([f, t]) => tone(f, n0 + t, 0.4, 0.06)); } catch {} }

/* ---------- ループ ---------- */
let acc = 0, lastTs = performance.now();
function frame(ts2) {
  const el = Math.min(100, ts2 - lastTs); acc += el; lastTs = ts2;
  let k = 0;
  while (acc >= 1000 / 60 && k < 4) { step(1 / 60); acc -= 1000 / 60; k++; }
  if (k >= 4) acc = 0;
  render(Math.max(k, 1) / 60);
  requestAnimationFrame(frame);
}

/* ---------- 入力: ドラッグ＝手（ずらした分だけ動く。端に当たったら、そこから戻せばすぐ効く） ---------- */
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  newGame(HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null);
  updateHud();
}
function setHand(x, y) { game.setTarget(x, y); }
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play') return;
  if (game.phase === 'over') { if (tt - failAt > 0.5) showOver(); return; }
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, hx: game.hand.tx, hy: game.hand.ty };
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || state !== 'play' || bot) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  const ce = list.length ? list[list.length - 1] : e;
  const wx = drag.hx + (ce.clientX - drag.x0) * cmPerPx * PH.GX, wy = drag.hy - (ce.clientY - drag.y0) * cmPerPx * PH.GY;
  setHand(wx, wy);
  // 端で止まったぶんは持ちかえる（戻す向きにはすぐ効く）
  const cx = game.hand.tx, cy = game.hand.ty;
  if (cx !== wx) drag.hx += cx - wx;
  if (cy !== wy) drag.hy += cy - wy;
});
addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) drag = null; });
addEventListener('pointercancel', () => { drag = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: スペース/↑ = ポン（0.1秒で 5〜6cm 上へ。重力に合わせて、いつも同じくらいの高さに上がる）、↓ 押している間 下げる、←→ 押している間 左右
function applyKeys(dt) {
  if (kb.up > 0) { const d = Math.min(kb.up, dt); kb.up -= d; setHand(game.hand.tx, game.hand.ty + 5.6 * Math.sqrt(game.G / 220) * d / 0.1); }
  if (kb.down) setHand(game.hand.tx, game.hand.ty - 32 * dt);
  if (kb.left) setHand(game.hand.tx - 16 * dt, game.hand.ty);
  if (kb.right) setHand(game.hand.tx + 16 * dt, game.hand.ty);
  // キーだけで遊ぶときは、乗って止まっている間に手をゆっくり真ん中へ戻す
  if (kb.used && !drag && game.phase === 'rest' && kb.up <= 0 && !kb.down && !kb.left && !kb.right) setHand(game.hand.tx * (1 - dt * 2), game.hand.ty * (1 - dt * 2));
}
addEventListener('keydown', e => {
  if (state === 'play') {
    if (game.phase === 'over') { if ((e.code === 'Space' || e.code === 'Enter') && tt - failAt > 0.5) { e.preventDefault(); showOver(); } return; }
    const c = e.code;
    if (c === 'Space' || c === 'ArrowUp') { e.preventDefault(); kb.used = true; if (!e.repeat) { wakeAudio(); kb.up = 0.1; } return; }
    if (c === 'ArrowDown') { e.preventDefault(); kb.used = true; kb.down = true; return; }
    if (c === 'ArrowLeft') { e.preventDefault(); kb.used = true; kb.left = true; return; }
    if (c === 'ArrowRight') { e.preventDefault(); kb.used = true; kb.right = true; return; }
    if (c === 'Enter') e.preventDefault();
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowDown') kb.down = false;
  if (e.code === 'ArrowLeft') kb.left = false;
  if (e.code === 'ArrowRight') kb.right = false;
});
addEventListener('blur', () => { drag = null; kb.down = kb.left = kb.right = false; kb.up = 0; });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  window.__kendama = {
    info: () => ({ state, phase: game && game.phase, n: game && game.n, cup: game && game.cup, next: game && game.next, fail: game && game.fail, lapT: game && game.lapT, limit: game && game.limit(), hand: game && { ...game.hand }, rec, seed, cmPerPx }),
    // ボットで分布を測る: sim('good', 10) → [回数...]
    sim: (skill = 'good', N = 10, max = 80) => Array.from({ length: N }, (_, i) => runBot(RAPIER, SKILLS[skill], 1000 + i, max).n),
    // 画面上の点: けんの手（いまの皿の真ん中）・玉
    handScreen: () => { const c = game.cupWorld(game.phase === 'rest' ? game.cup : game.next).c; return project(c.x, c.y, c.z); },
    ballScreen: () => { const t = game.ball.translation(); return project(t.x, t.y, t.z); },
    autoplay: (skill = 'good') => { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); },
    PH, CUPS, SKILLS, makeGame, runBot, game: () => game,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([document.fonts.load(`40px "Dela Gothic One"`), new Promise(r => setTimeout(r, 1500))]); } catch {}
resize();
newGame('good');
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = 'けんを持つ';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
<a class="hub-back" id="hubBack" href="/" aria-label="あそび横丁（ゲーム一覧）にもどる">← 横丁</a>
<script>
// プレイ中でもゲーム一覧に戻れるボタン。押してもゲームの入力（タップ・ドラッグ）に伝わらないようにする
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) document.getElementById('hubBack').addEventListener(ev, e => e.stopPropagation(), { passive: true });
</script>
</body>
