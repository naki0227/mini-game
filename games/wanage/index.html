<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 WebGL（夜の縁日の輪投げ屋台）+ 2D の演出レイヤー + HUD。タイトル/結果は下寄せのカード1枚 */
:root {
  --night: #11131b;      /* 縁日の夜空 */
  --goza: #c9b47c;       /* ござ */
  --ink: #261b14;        /* 墨 */
  --paper: #f7efdf;      /* 提灯の和紙 */
  --noren: #a8302a;      /* 紅白幕の紅 */
  --noren-ink: #fbf2e2;
  --gold: #e6aa46;       /* 裸電球の灯り */
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#gl, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { touch-action: none; cursor: grab; }
#fx:active { cursor: grabbing; }

.hud {
  position: fixed; right: 0; top: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--noren); color: var(--noren-ink);
  border-radius: 6px; padding: 5px 10px 6px;
  font-variant-numeric: tabular-nums; line-height: 1.1; text-align: right;
  box-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.pill .lab { font-size: 10px; letter-spacing: .12em; opacity: .8; display: block; }
.pill .val { font-family: var(--font-display); font-size: 18px; }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: end center; z-index: 40;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: linear-gradient(to top, rgba(12, 10, 14, .6), rgba(12, 10, 14, 0) 70%);
  touch-action: none; cursor: pointer; overflow: hidden;
}
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);
  border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5);
  text-align: center; cursor: default;
}
.noren {
  background: var(--noren); color: var(--noren-ink);
  display: flex; gap: 3px;
  padding-top: 16px;
}
.noren span {
  flex: 1; background: var(--noren); border-bottom: 3px solid rgba(255,255,255,.08);
  font-family: var(--font-display); font-size: 32px; line-height: 1; padding-block: 6px 14px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2); white-space: nowrap;
}
.noren.result { padding-top: 10px; }
.noren.result span { font-size: 26px; padding-block: 4px 10px; }
.body { padding: 16px 20px 18px; display: grid; gap: 11px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }
.score { font-family: var(--font-display); font-size: 60px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 24px; margin-left: 4px; }
.meta { display: flex; justify-content: center; gap: 6px 16px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meta b { font-size: 16px; }
.badge {
  justify-self: center; background: var(--gold); color: #3a2410; font-weight: 700;
  font-size: 12px; letter-spacing: .14em; padding: 3px 10px; border-radius: 99px;
}
#over .lead { font-size: 13px; line-height: 1.55; }
#over .body { gap: 9px; padding-block: 12px 14px; }
/* もらった景品と図鑑 */
.gets { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; min-height: 0; }
.gets img { width: 30px; height: 30px; }
.zukan { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; background: #efe3c9; border-radius: 8px; padding: 6px; }
.zukan .z { position: relative; aspect-ratio: 1; border-radius: 6px; background: #f8f0de; display: grid; place-items: center; }
.zukan .z img { width: 88%; height: 88%; }
.zukan .z.no img { filter: brightness(0) opacity(.18); }
.zukan .z b { position: absolute; right: 2px; bottom: 0; font-size: 10px; color: #7a5a3a; font-variant-numeric: tabular-nums; }
.zukan .z.new::after { content: "NEW"; position: absolute; left: -2px; top: -4px; font-size: 9px; font-weight: 700; background: var(--noren); color: #fff; border-radius: 4px; padding: 0 3px; }
.zlab { font-size: 12px; margin: -4px 0 -6px; color: #6b4a2e; }
.btns { display: grid; gap: 8px; }
.btns .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 8px;
  padding: 13px 16px; cursor: pointer;
  background: var(--noren); color: var(--noren-ink); box-shadow: 0 3px 0 #5a1612;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #5a1612; }
button:disabled { opacity: .6; cursor: progress; }
a.xbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  font-weight: 700; font-size: 16px; border-radius: 8px; padding: 13px 16px;
  background: #0f1419; color: #fff; box-shadow: 0 3px 0 #000;
}
a.xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
a.xbtn:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
a.xbtn svg { width: 16px; height: 16px; fill: currentColor; }
button.sub { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); padding-inline: 8px; font-size: 15px; }
button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
.how { font-size: 12px; opacity: .72; margin: 0; line-height: 1.6; }
.err { font-size: 13px; color: #b3361b; margin: 0; font-weight: 700; }
.back { font-size: 13px; color: var(--ink); opacity: .75; }
.back:hover { opacity: 1; }
@media (max-height: 760px) {
  .score { font-size: 48px; }
  .body { gap: 8px; padding-block: 12px 14px; }
  #over .body { gap: 7px; padding-block: 10px 12px; }
  button, a.xbtn { padding-block: 10px; }
  .noren span { font-size: 28px; }
  .zukan { gap: 3px; padding: 4px; }
}
@media (max-height: 680px) { #over .lead, #title .how { display: none; } .zukan .z { aspect-ratio: 1.3; } }
@media (max-height: 590px) { .zukan, .zlab { display: none; } }
.hub-back {
  position: fixed; z-index: 60;
  left: calc(env(safe-area-inset-left, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  font: 700 12px/1 "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: .04em;
  padding: 7px 11px; border-radius: 99px; text-decoration: none;
  background: rgba(20, 18, 24, .55); color: #fff; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.hub-back:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
</style>

<body>

  <div class="pill"><span class="lab">最多</span><span class="val" id="hBest">—</span></div>
</div>

<div class="overlay" id="title">
  <div class="card">
    <div class="noren" aria-hidden="true"><span>輪</span><span>投</span><span>げ</span><span>屋</span><span>台</span></div>
    <div class="body">
      <p class="lead">輪を<b>下へ引っぱって離す</b>と、ふわっと飛ぶ。<br>光っている棒に<b>カラン</b>と入れば景品ゲット。<br>外すまで<b>何本連続</b>で入るか。</p>
      <div class="meta"><span>最多 <b id="tBest">—</b> 本連続</span><span>総本数 <b id="tTotal">0</b> 本</span><span>景品 <b id="tZukan">0</b>/12 種</span></div>

      <a class="back" href="../../">← ほかのゲームを見る</a>

<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="noren result" aria-hidden="true" id="oNoren"><span>お</span><span>し</span><span>い</span></div>
    <div class="body">
      <div class="badge" id="newRec" hidden>新記録</div>

      <div class="meta"><span>最多 <b id="oBest">0</b> 本</span><span>総本数 <b id="oTotal">0</b> 本</span><span>遊んだ <b id="oPlays">0</b> 回</span></div>

        <div class="two"><button id="retryBtn">もう一回</button><button class="sub" id="copyBtn">結果をコピー</button></div>
        <a class="xbtn" id="xBtn" href="https://x.com/intent/post" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Xでシェア</a>
      </div>
      <p class="how" id="copyMsg">画面タップ・スペースでもう一回</p>
      <a class="back" href="../../">← ほかのゲームを見る</a>

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';
let THREE, RAPIER;
try {
  const [t, r] = await Promise.all([import(THREE_URL), import(RAPIER_URL)]);
  THREE = t; RAPIER = r.default;
  await RAPIER.init();
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D/物理エンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 輪投げの物理（three には頼らない。Rapier の剛体だけ） ----------
   長さの単位は 10cm（dm）。重力も 10 倍（98.1）にして、本物と同じ速さで起きるようにしてある。
   輪は直径 20cm・太さ 1.7cm。細いカプセル 16 本を輪状につないだ 1 つの剛体（複合コライダー）。
   棒（木の杭）は円柱、景品は円柱・球・箱の組み合わせで、どれも動かない（ござに固定）。
   入った＝輪が止まったとき、狙いの棒の軸が「輪の面」を輪の内側で、棒の頭より下で通っていること（中心が近ければ成功、はしない）。
   空中だけ、輪のぐらつき（面が傾いていく回転）に簡単な空気の効果を入れる: 回転（スピン）がないとぐらつきが育ち、
   スピンがあるとジャイロの効果でおさまる。 */
const PH = {
  G: 98.1, DT: 1 / 600, ITERS: 6,
  R: 0.95, RT: 0.085, K: 16,                 // 輪: 芯の半径・太さ（半径）・カプセルの数
  HAND: { x: 0, y: 6.0, z: -3.0 },           // 手を離す位置（ござの手前のふちが z=-4.5、ござの面が y=0）
  PITCH: 36 * DEG,                           // 投げ上げる角度（いつも同じ。強さと向きだけを決める）
  D_MIN: 3.5, D_MAX: 32, Y_LAND: 1.0,          // 引いた量 0〜1 → 「高さ 10cm の所に届く」距離
  YAW_MAX: 0.42,                              // 左右いっぱいに引いたときの向き（rad）
  NOSE: 5 * DEG,                             // 少し前を上げて投げる
  SPIN0: 4, SPIN_MAX: 26,                    // ふつうに投げたときの回転・曲げて引いたときの最大（rad/s）
  MU_RING: 0.45, E_RING: 0.2, MU_MAT: 0.85, E_MAT: 0.05, MU_PEG: 0.3, E_PEG: 0.3, MU_PRIZE: 0.5, E_PRIZE: 0.25,
  WOB_GROW: 1.8, GYRO: 0.13,                 // ぐらつきが育つ速さ・スピンでおさまる強さ
  REST_V: 0.5, REST_W: 1.0, REST_T: 0.2, TMAX: 5,
  DAMP_W: 1.6, DAMP_V: 0.5,                  // 落ちてからの転がり抵抗（ござの目・空気）
};
// 手のぶれ（標準偏差）。人が投げるときも、ボットも同じ
const JIT = { v: 0.004, yaw: 0.004, tilt: 2.5 * DEG, wob: 0.6, spin: 1.2 };
const NOJIT = { v: 0, yaw: 0, tx: 0, tz: 0, wx: 0, wz: 0, spin: 0 };
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
function jitterOf(r) { return { v: gaussR(r) * JIT.v, yaw: gaussR(r) * JIT.yaw, tx: gaussR(r) * JIT.tilt, tz: gaussR(r) * JIT.tilt, wx: gaussR(r) * JIT.wob, wz: gaussR(r) * JIT.wob, spin: gaussR(r) * JIT.spin }; }
const qAxisO = (ax, ay, az, a) => { const s = Math.sin(a / 2); return { x: ax * s, y: ay * s, z: az * s, w: Math.cos(a / 2) }; };
const qMulO = (a, b) => ({ w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z, x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y, y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x, z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w });
function qRotO(q, v) {
  const { x, y, z, w } = q;
  const ix = w * v.x + y * v.z - z * v.y, iy = w * v.y + z * v.x - x * v.z, iz = w * v.z + x * v.y - y * v.x, iw = -x * v.x - y * v.y - z * v.z;
  return { x: ix * w + iw * -x + iy * -z - iz * -y, y: iy * w + iw * -y + iz * -x - ix * -z, z: iz * w + iw * -z + ix * -y - iy * -x };
}
function qFromToO(u, v) {
  const d = u.x * v.x + u.y * v.y + u.z * v.z;
  if (d < -0.99999) return { x: 1, y: 0, z: 0, w: 0 };
  const q = { x: u.y * v.z - u.z * v.y, y: u.z * v.x - u.x * v.z, z: u.x * v.y - u.y * v.x, w: 1 + d };
  const n = Math.hypot(q.x, q.y, q.z, q.w); return { x: q.x / n, y: q.y / n, z: q.z / n, w: q.w / n };
}
const UPO = { x: 0, y: 1, z: 0 };

/* 景品: 図鑑の順。col = 当たり判定（ござの上、景品の足元が原点）。r = だいたいの半径（メッセージ用） */
const PRIZES = [
  { id: 'ramune', name: 'ラムネ', r: 0.27, col: [{ t: 'cyl', r: 0.27, h: 1.5, y: 0.75 }, { t: 'cyl', r: 0.14, h: 0.5, y: 1.75 }] },
  { id: 'daruma', name: 'だるま', r: 0.5, col: [{ t: 'ball', r: 0.5, y: 0.5 }, { t: 'ball', r: 0.36, y: 1.05 }] },
  { id: 'omen', name: 'きつねのお面', r: 0.4, col: [{ t: 'cyl', r: 0.07, h: 1.3, y: 0.65 }, { t: 'box', hx: 0.42, hy: 0.5, hz: 0.14, y: 1.65 }] },
  { id: 'kingyo', name: '金魚の袋', r: 0.45, col: [{ t: 'ball', r: 0.45, y: 0.45 }, { t: 'cyl', r: 0.1, h: 0.45, y: 1.05 }] },
  { id: 'kaza', name: '風車', r: 0.4, col: [{ t: 'cyl', r: 0.06, h: 2.2, y: 1.1 }, { t: 'cyl', r: 0.42, h: 0.12, y: 2.3, rx: Math.PI / 2 }] },
  { id: 'yoyo', name: '水ヨーヨー', r: 0.4, col: [{ t: 'ball', r: 0.4, y: 0.4 }] },
  { id: 'kokeshi', name: 'こけし', r: 0.26, col: [{ t: 'cyl', r: 0.22, h: 1.0, y: 0.5 }, { t: 'ball', r: 0.28, y: 1.28 }] },
  { id: 'maneki', name: '招き猫', r: 0.45, col: [{ t: 'cyl', r: 0.42, h: 0.8, y: 0.4 }, { t: 'ball', r: 0.38, y: 1.15 }] },
  { id: 'denden', name: 'でんでん太鼓', r: 0.36, col: [{ t: 'cyl', r: 0.06, h: 1.4, y: 0.7 }, { t: 'cyl', r: 0.36, h: 0.22, y: 1.75, rx: Math.PI / 2 }] },
  { id: 'hiyoko', name: 'ひよこ笛', r: 0.34, col: [{ t: 'ball', r: 0.34, y: 0.34 }, { t: 'ball', r: 0.22, y: 0.78 }] },
  { id: 'kendama', name: 'けん玉', r: 0.3, col: [{ t: 'box', hx: 0.3, hy: 0.12, hz: 0.12, y: 0.12 }, { t: 'cyl', r: 0.07, h: 0.9, y: 0.65 }, { t: 'ball', r: 0.3, y: 1.35 }] },
  { id: 'hanabi', name: '花火セット', r: 0.42, col: [{ t: 'box', hx: 0.42, hy: 0.55, hz: 0.18, y: 0.55 }] },
];
/* 屋台のござの上の並び（手前から奥へ、だんだん遠く・細く・低く・景品が近く）。
   x, z = 棒の位置、r = 棒の太さ（半径）、h = 高さ、p = 景品、px, pz = 景品の位置（棒から） */
const LAYOUT = [
  { x: 0.0, z: -11.0, r: 0.34, h: 3.6, p: 0, px: 2.6, pz: -0.5 },
  { x: -2.9, z: -13.5, r: 0.28, h: 3.3, p: 1, px: -2.1, pz: -0.6 },
  { x: 3.0, z: -15.0, r: 0.26, h: 3.1, p: 2, px: 1.8, pz: -0.8 },
  { x: 0.2, z: -18.0, r: 0.23, h: 2.9, p: 3, px: -1.6, pz: -0.5 },
  { x: -4.6, z: -18.5, r: 0.2, h: 2.7, p: 4, px: 1.5, pz: -0.6 },
  { x: 4.7, z: -20.0, r: 0.19, h: 2.5, p: 5, px: -1.4, pz: 0.3 },
  { x: -1.9, z: -22.0, r: 0.16, h: 2.3, p: 6, px: 1.3, pz: -0.3 },
  { x: 2.3, z: -23.5, r: 0.15, h: 2.1, p: 7, px: -1.35, pz: -0.4 },
  { x: -5.4, z: -24.0, r: 0.13, h: 2.0, p: 8, px: 1.45, pz: 0.2 },
  { x: 5.5, z: -25.5, r: 0.12, h: 1.9, p: 9, px: -1.2, pz: -0.3 },
  { x: 0.0, z: -27.0, r: 0.11, h: 1.8, p: 10, px: 1.2, pz: 0.1 },
  { x: -3.3, z: -28.2, r: 0.1, h: 1.8, p: 11, px: 1.6, pz: -0.2 },

const STALL = { x0: -9.5, x1: 9.5, z0: -4.5, z1: -31.5 };
// n 本目（0〜）の狙い。はじめは並びの順に、並びを一周したら奥の 6 本からまぜて（同じ棒が続かない）
function targetFor(n, rnd, prev) {
  if (n < LAYOUT.length) return n;
  let i; do { i = 6 + Math.floor(rnd() * (LAYOUT.length - 6)); } while (i === prev);
  return i;
}
// 引いた量 → 速さ（「高さ Y_LAND の所に d だけ先で届く」速さ）
function speedFor(d) {
  const c = Math.cos(PH.PITCH), h = PH.HAND.y - PH.Y_LAND;
  return Math.sqrt(PH.G * d * d / (2 * c * c * (d * Math.tan(PH.PITCH) + h)));

// 遠いほど同じ引きのずれが大きく効く（距離は引いた量に対して指数的にのびる）
const distFor = k => PH.D_MIN * Math.pow(PH.D_MAX / PH.D_MIN, Math.max(0, Math.min(1, k)));
const kFor = d => Math.log(d / PH.D_MIN) / Math.log(PH.D_MAX / PH.D_MIN);
// aim = { k: 強さ 0〜1, yaw: 向き(rad, +は右), spin: 回転(rad/s, +は上から見て反時計回り) }
function throwVectors(aim, j = NOJIT) {
  const d = distFor(aim.k), v = speedFor(d) * (1 + j.v), yaw = aim.yaw + j.yaw, p = PH.PITCH;
  const dir = { x: Math.sin(yaw) * Math.cos(p), y: Math.sin(p), z: -Math.cos(yaw) * Math.cos(p) };
  let rot = qMulO(qAxisO(0, 1, 0, -yaw), qAxisO(1, 0, 0, PH.NOSE));
  rot = qMulO(qMulO(qAxisO(1, 0, 0, j.tx), qAxisO(0, 0, 1, j.tz)), rot);
  const n = qRotO(rot, UPO), s = aim.spin + j.spin;

function buildStall(world) {
  const fixed = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
  const add = (desc, mu, e) => world.createCollider(desc.setFriction(mu).setRestitution(e), fixed);
  // ござ（台）と、まわりの板
  add(RAPIER.ColliderDesc.cuboid(10, 0.5, 14).setTranslation(0, -0.5, -18), PH.MU_MAT, PH.E_MAT);
  add(RAPIER.ColliderDesc.cuboid(10, 5, 0.3).setTranslation(0, 5, STALL.z1 - 0.3), 0.5, 0.2);      // 奥の板
  for (const s of [-1, 1]) add(RAPIER.ColliderDesc.cuboid(0.3, 1.2, 14).setTranslation(s * (STALL.x1 + 0.3), 1.2, -18), 0.5, 0.2);
  add(RAPIER.ColliderDesc.cuboid(10, 0.35, 0.15).setTranslation(0, 0.35, STALL.z0 + 0.15), 0.5, 0.2);   // 手前のふち
  // 棒と景品
  const pegs = [], prizes = [];
  for (const L of LAYOUT) {
    const c = add(RAPIER.ColliderDesc.cylinder(L.h / 2, L.r).setTranslation(L.x, L.h / 2, L.z), PH.MU_PEG, PH.E_PEG);
    pegs.push({ ...L, top: L.h, handle: c.handle });
    const P = PRIZES[L.p], X = L.x + L.px, Z = L.z + L.pz;
    for (const s of P.col) {
      let d = s.t === 'cyl' ? RAPIER.ColliderDesc.cylinder(s.h / 2, s.r) : s.t === 'ball' ? RAPIER.ColliderDesc.ball(s.r) : RAPIER.ColliderDesc.cuboid(s.hx, s.hy, s.hz);
      d = d.setTranslation(X, s.y, Z);
      if (s.rx) d = d.setRotation(qAxisO(1, 0, 0, s.rx));
      add(d, PH.MU_PRIZE, PH.E_PRIZE);
    }
    prizes.push({ x: X, z: Z, r: P.r, h: Math.max(...P.col.map(s => s.y + (s.r || s.hy || 0))) });
  }

}
function addRing(world, tv) {
  const b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(tv.from.x, tv.from.y, tv.from.z).setRotation(tv.rot)
    .setLinvel(tv.lin.x, tv.lin.y, tv.lin.z).setAngvel(tv.ang).setCcdEnabled(true).setLinearDamping(0.02).setAngularDamping(0.1).setCanSleep(true));
  const K = PH.K, half = PH.R * Math.sin(Math.PI / K), rm = PH.R * Math.cos(Math.PI / K);
  for (let i = 0; i < K; i++) {
    const a = (i + 0.5) * 2 * Math.PI / K;
    const tan = { x: -Math.sin(a), y: 0, z: Math.cos(a) };
    world.createCollider(RAPIER.ColliderDesc.capsule(half, PH.RT).setTranslation(rm * Math.cos(a), 0, rm * Math.sin(a)).setRotation(qFromToO(UPO, tan))
      .setFriction(PH.MU_RING).setRestitution(PH.E_RING).setDensity(1), b);
  }
  return b;
}
// 棒の軸が、輪の面をどこで通るか（輪の中心からの距離と、その高さ）
function pegThrough(b, peg) {
  const t = b.translation(), n = qRotO(b.rotation(), UPO);
  if (Math.abs(n.y) < 0.2) return { d: 99, y: 99, inside: false, over: false };
  const y = t.y - (n.x * (peg.x - t.x) + n.z * (peg.z - t.z)) / n.y;
  const d = Math.hypot(peg.x - t.x, y - t.y, peg.z - t.z);
  return { d, y, inside: d < PH.R && y < peg.top - 0.02 && y > -0.3, over: d < PH.R && y >= peg.top - 0.02 };
}
// 輪（芯の円）と棒の側面のいちばん近いところのすき間（だいたい）
function ringPegGap(b, peg) {
  const t = b.translation(), q = b.rotation();
  let best = 99;
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * 2 * Math.PI, o = qRotO(q, { x: PH.R * Math.cos(a), y: 0, z: PH.R * Math.sin(a) });
    const x = t.x + o.x, y = t.y + o.y, z = t.z + o.z;
    const dy = y > peg.top ? y - peg.top : y < 0 ? -y : 0;
    const dr = Math.max(0, Math.hypot(x - peg.x, z - peg.z) - peg.r);
    best = Math.min(best, Math.hypot(dr, dy) - PH.RT);
  }
  return best;
}

function makeGame(RAPIER_, seed = 1) {
  const world = new RAPIER.World({ x: 0, y: -PH.G, z: 0 });
  world.timestep = PH.DT;

  ip.allowedLinearError = 0.002; ip.predictionDistance = 0.01;

  g.target = targetFor(0, rnd, -1);

    if (g.phase !== 'ready') return null;
    const tv = throwVectors(aim, j || jitterOf(rnd));

    g.cur = R; g.rings.push(R);

    g.events.push({ type: 'throw', ring: R });

  };

    const peg = pegs[g.target];
    const P = pegThrough(R.body, peg);

    if (P.inside) kind = 'in';
    else {
      const other = pegs.findIndex((p, i) => i !== g.target && pegThrough(R.body, p).inside);
      if (other >= 0) kind = 'other';
      else if (P.over) kind = 'top';
      else if (R.everIn) kind = 'out';
      else if (R.touchPeg) kind = 'rim';
      else if (R.touchPrize) kind = 'prize';
      else kind = 'off';
    }
    // 落ちた所と狙いのずれ（狙いの向きに沿った前後・左右）
    const lp = R.land || R.body.translation(), hx = PH.HAND.x, hz = PH.HAND.z;
    const ux = peg.x - hx, uz = peg.z - hz, L = Math.hypot(ux, uz);
    const ex = lp.x - peg.x, ez = lp.z - peg.z;
    const along = (ex * ux + ez * uz) / L, side = (ex * -uz + ez * ux) / L;   // side: +は右
    g.result = { kind, along, side, peg: g.target, t: R.t };

    if (kind === 'in') {
      g.n++; g.total++; g.got.push(LAYOUT[g.target].p);

      g.phase = 'over'; g.fail = kind;
      g.events.push({ type: 'miss', kind, ring: R });
    }
    g.cur = null;
  }
  g.step = () => {
    const R = g.cur;
    if (R && R.air) {
      // 空中のぐらつき: スピンがないと育ち、スピンがあるとおさまる
      const w = R.body.angvel(), n = qRotO(R.body.rotation(), UPO);
      const s = w.x * n.x + w.y * n.y + w.z * n.z;
      const f = Math.exp((PH.WOB_GROW - PH.GYRO * Math.abs(s)) * PH.DT);
      R.body.setAngvel({ x: n.x * s + (w.x - n.x * s) * f, y: n.y * s + (w.y - n.y * s) * f, z: n.z * s + (w.z - n.z * s) * f }, true);
    }
    world.step();
    g.t += PH.DT;
    if (!R) return;
    R.t += PH.DT;
    const b = R.body, v = b.linvel(), w = b.angvel(), t = b.translation();
    // ぶつかった（速さが急に変わった）
    const dv = Math.hypot(v.x - R.lastV.x, v.y - R.lastV.y + PH.G * PH.DT, v.z - R.lastV.z);
    R.lastV = { x: v.x, y: v.y, z: v.z };
    R.cool -= PH.DT;
    if (dv > 1.2) {
      if (R.air) { R.air = false; R.land = { x: t.x, y: t.y, z: t.z }; b.setAngularDamping(PH.DAMP_W); b.setLinearDamping(PH.DAMP_V); }
      if (R.cool <= 0 && R.hits < 8) {
        R.cool = 0.06; R.hits++;
        // 何に当たったか（音と、外れたときの一言のため）
        const peg = pegs[g.target];
        let what = 'mat';
        if (ringPegGap(b, peg) < 0.06) { what = 'peg'; R.touchPeg = true; }
        else if (pegs.some(p => p !== peg && ringPegGap(b, p) < 0.06)) { what = 'peg'; R.touchOther = true; }
        else if (prizes.some(p => Math.hypot(p.x - t.x, p.z - t.z) < PH.R + p.r + 0.15 && t.y < p.h + 0.3)) { what = 'prize'; R.touchPrize = true; }
        else if (t.y > 0.6) what = 'ring';
        g.events.push({ type: 'hit', what, dv, ring: R });
      }
    }
    if (R.path.length < 200 && Math.round(R.t / PH.DT) % 6 === 0 && (R.air || R.path.length < 80)) R.path.push({ x: t.x, y: t.y, z: t.z });
    const peg = pegs[g.target], P = pegThrough(b, peg);
    if (P.inside && !R.entered) { R.entered = true; R.everIn = true; g.events.push({ type: 'enter', ring: R, v: Math.hypot(v.x, v.y, v.z) }); }
    else if (!P.inside && R.entered && P.y > peg.top) R.entered = false;
    // 止まったら判定
    // 平らに寝たままの回転（輪の面の向きの回転）は、結果を変えないので見ない
    const nn = qRotO(b.rotation(), UPO), ws = w.x * nn.x + w.y * nn.y + w.z * nn.z;
    const calm = Math.hypot(v.x, v.y, v.z) < PH.REST_V && Math.hypot(w.x - nn.x * ws, w.y - nn.y * ws, w.z - nn.z * ws) < PH.REST_W;
    R.calm = calm && !R.air ? R.calm + PH.DT : 0;
    // 根もとまで落ちて遅くなった輪は、もう棒の頭を越えて抜けられない（v²/2g が棒の高さよりずっと小さい）ので、そこで入り
    const sp = Math.hypot(v.x, v.y, v.z);
    R.lock = P.inside && t.y < 0.6 && sp * sp / (2 * PH.G) < (peg.top - t.y) * 0.1 ? (R.lock || 0) + PH.DT : 0;
    // 棒から遠く離れてござを転がっている輪は、外れ（転がるのはそのまま見せる）
    const far = !R.air && t.y < 1.2 && Math.hypot(t.x - peg.x, t.z - peg.z) > PH.R + peg.r + 1.2;
    R.far = far ? (R.far || 0) + PH.DT : 0;

}
// 1 投だけ（調整・ボットの狙いさがし用）: いまの並びの target 番の棒に、まっさらな台で投げる
function simThrow(RAPIER_, target, aim, j = NOJIT) {
  const g = makeGame(RAPIER_, 1);
  g.target = target;
  g.throw(aim, j);
  while (g.phase === 'fly') g.step();
  const r = g.result; g.free();
  return r;
}
/*PHYS-END*/

/*BOT-BEGIN*/
/* ---------- ボット（調整・タイトルのデモ用） ----------
   人と同じ「引く量 k・向き yaw・回転 spin」で投げる。狙い（その棒にいちばん入りやすい k と yaw）は、
   上手な人が何度か投げて覚えたものとして、ぶれなしの物理でさがしておく（棒ごとに1回）。
   そこに、腕前ごとの引き方のばらつき（k と yaw の標準偏差）と、手のぶれ（JIT）を足す。 */
const SKILLS = {
  first:  { sk: 0.045, syaw: 0.03, spin: 2, spinSd: 4, learn: 0.6 },
  casual: { sk: 0.03, syaw: 0.02, spin: 4, spinSd: 4, learn: 0.8 },
  mid:    { sk: 0.018, syaw: 0.013, spin: 8, spinSd: 4, learn: 1 },
  good:   { sk: 0.011, syaw: 0.008, spin: 14, spinSd: 3, learn: 1 },
  expert: { sk: 0.007, syaw: 0.005, spin: 20, spinSd: 2, learn: 1 },
};
// まっすぐ狙ったときの k と yaw（棒の根もとへ。物理は知らない、目で見た狙い）
function naiveAim(peg) {
  const dx = peg.x - PH.HAND.x, dz = peg.z - PH.HAND.z, d = Math.hypot(dx, dz);
  return { k: kFor(d), yaw: Math.atan2(dx, -dz) };
}
// 棒ごとの「いちばん入りやすい引き」（ぶれなしの物理でさがした値。調べ直すときは __wanage.calib()）
const AIM_HINT = [[0.4520, 0.0850], [0.5680, 0.0770], [0.6180, 0.0680], [0.6980, 0.0580], [0.7270, 0.0520], [0.7600, 0.0500], [0.7950, 0.0400], [0.8220, 0.0430], [0.8430, 0.0400], [0.8690, 0.0370], [0.8860, 0.0350], [0.9160, 0.0220]];
const AIM_CACHE = new Map();
function bestAim(RAPIER_, target, fresh = false) {
  if (!fresh && AIM_CACHE.has(target)) return AIM_CACHE.get(target);
  const a0 = naiveAim(LAYOUT[target]);
  if (!fresh && AIM_HINT[target]) { const r = { k: AIM_HINT[target][0], width: AIM_HINT[target][1], yaw: a0.yaw, naiveK: a0.k }; AIM_CACHE.set(target, r); return r; }
  const dk = 0.0025, ok = [];
  for (let i = -16; i <= 48; i++) { const k = a0.k + i * dk; if (simThrow(RAPIER_, target, { k, yaw: a0.yaw, spin: 10 }).kind === 'in') ok.push(k); }
  // 入る k のいちばん長い連続区間の真ん中
  let best = null, run = [];
  for (let i = 0; i < ok.length; i++) {
    if (i && ok[i] - ok[i - 1] > dk * 1.5) run = [];
    run.push(ok[i]);
    if (!best || run.length > best.length) best = run.slice();
  }
  const r = { k: best ? (best[0] + best[best.length - 1]) / 2 : a0.k + dk * 12, yaw: a0.yaw, width: best ? best.length * dk : 0, naiveK: a0.k };
  AIM_CACHE.set(target, r);
  return r;
}
function botAim(RAPIER_, g, sk, rnd) {
  const spin = sk.spin + gaussR(rnd) * sk.spinSd;
  const b = bestAim(RAPIER_, g.target);
  const k0 = b.naiveK + (b.k - b.naiveK) * sk.learn;
  return { k: k0 + gaussR(rnd) * sk.sk, yaw: b.yaw + gaussR(rnd) * sk.syaw, spin };
}
function runBot(RAPIER_, sk, seed, max = 60) {
  const g = makeGame(RAPIER_, seed), rnd = mulberry(seed * 7 + 3);
  const kinds = [];
  while (g.phase !== 'over' && g.n < max) {
    g.throw(botAim(RAPIER_, g, sk, rnd));
    while (g.phase === 'fly') g.step();
    g.events.length = 0;
  }
  const r = { n: g.n, fail: g.n >= max ? 'max' : g.fail, res: g.result };
  g.free();
  return r;
}
/*BOT-END*/

    if (d && d.ver === 1) { const r = { ...DEF(), ...d }; r.best = +r.best || 0; r.total = +r.total || 0; r.plays = +r.plays || 0; r.last = +r.last || 0; if (!r.prizes || typeof r.prizes !== 'object') r.prizes = {}; return r; }

}

    if (game.phase === 'over') { if ((e.code === 'Space' || e.code === 'Enter') && tt - failAt > 0.5) { e.preventDefault(); showOver(); } return; }
    const c = e.code, m = e.shiftKey ? 5 : 1;
    const adj = { ArrowUp: ['k', 0.004], ArrowDown: ['k', -0.004], ArrowLeft: ['yaw', -0.004], ArrowRight: ['yaw', 0.004], KeyA: ['spin', 2], KeyD: ['spin', -2] }[c];
    if (adj) {
      e.preventDefault(); wakeAudio();
      if (!kb) kb = lastAim ? { k: lastAim.k, yaw: lastAim.yaw, spin: lastAim.spin } : { k: 0.42, yaw: 0, spin: PH.SPIN0 };
      kb[adj[0]] += adj[1] * m;
      kb.k = clamp(kb.k, 0, 1); kb.yaw = clamp(kb.yaw, -PH.YAW_MAX, PH.YAW_MAX); kb.spin = clamp(kb.spin, -PH.SPIN_MAX, PH.SPIN_MAX);
      return;
    }
    if (c === 'Space' || c === 'Enter') {
      e.preventDefault(); wakeAudio();
      if (e.repeat || bot) return;
      if (!kb) { kb = lastAim ? { k: lastAim.k, yaw: lastAim.yaw, spin: lastAim.spin } : { k: 0.42, yaw: 0, spin: PH.SPIN0 }; return; }
      if (game.phase === 'ready') doThrow({ k: kb.k, yaw: kb.yaw, spin: kb.spin });
    }
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('blur', () => { drag = null; });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 図鑑のアイコン（景品の 3D を小さく撮っておく） ---------- */
function makeIcons() {
  try {
    const S = 96, cv = document.createElement('canvas'); cv.width = S; cv.height = S;
    const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight('#fff4e0', '#5a4636', 1.6));
    const d = new THREE.DirectionalLight('#ffffff', 1.4); d.position.set(2, 4, 5); sc.add(d);
    const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    iconURLs = PRIZES.map((P, i) => {
      const m = makePrize(i); sc.add(m);
      const box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
      const D = Math.max(sz.y, sz.x) / (2 * Math.tan(15 * DEG)) * 1.12 + sz.z;
      cam.position.set(c.x + D * 0.18, c.y + D * 0.22, c.z + D); cam.lookAt(c);
      r.render(sc, cam);
      const u = cv.toDataURL('image/png');
      sc.remove(m);
      return u;
    });
    r.dispose(); try { r.forceContextLoss(); } catch {}
  } catch { iconURLs = []; }
}

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  window.__wanage = {
    info: () => ({ state, phase: game && game.phase, n: game && game.n, target: game && game.target, fail: game && game.fail, result: game && game.result, rings: game && game.rings.length, rec, seed, dragLen: dragLen(), lastAim }),
    // ボットで分布を測る: sim('good', 10) → [連続本数...]（1回ぶん数秒かかる）
    sim: (skill = 'good', N = 10, max = 40, s0 = 1000) => Array.from({ length: N }, (_, i) => runBot(RAPIER, SKILLS[skill], s0 + i, max).n),
    // 1投だけ: simThrow(棒の番号, { k, yaw, spin }) → { kind, along, side }
    simThrow: (t, aim, jit = false) => simThrow(RAPIER, t, aim, jit ? jitterOf(Math.random) : NOJIT),
    bestAim: t => bestAim(RAPIER, t),
    // 棒ごとの入りやすい引きを調べ直す（数十秒）
    calib: () => LAYOUT.map((_, i) => { const b = bestAim(RAPIER, i, true); return [+b.k.toFixed(4), +b.width.toFixed(4)]; }),
    // いまのゲームでそのまま投げる（手のぶれあり）
    throwWith: aim => doThrow(aim),
    // 画面の座標: 狙いの棒の根もと・頭
    pegScreen: (i = game.target) => { const L = LAYOUT[i]; return { base: project(L.x, 0, L.z), top: project(L.x, L.h, L.z) }; },
    // いまの狙いの棒に、ボットの狙い（ぶれなし）で投げるためのドラッグ量（px）
    dragFor: (i = game.target) => { const b = bestAim(RAPIER, i), L = dragLen(); return { dy: b.k * L, dx: -b.yaw / PH.YAW_MAX * L }; },
    autoplay: (skill = 'good') => { bot = { sk: SKILLS[skill], rnd: mulberry(nextSeed()), t: 0 }; },
    PH, LAYOUT, PRIZES, SKILLS, game: () => game,
  };
}

makeIcons();

state = 'title';
fillTitle(); updateHud();
