<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try { THREE = await import(THREE_URL); } catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 線香花火の物理（three には頼らない自前のモデル。単位は m・秒・g・mN。画面の手前が +z、上が +y。揺れは x–y の面） ----------
   こより: つまんだ点（手）から下へ N 節の質点の鎖（節の長さ SEG・重さ MN。垂れた長さ 32 cm、振り子の周期 ≈ 1.1 秒）。節どうしは 伸びにだけ効くばね K と減衰 C
     （ひもなので 押しはしない＝たるむ）。少しの「こし」KB でまっすぐに戻ろうとする。いちばん下の節に 火の玉。
   火の玉: 重さ m(t) は 燃えるほど増える（表 MASS）。くっつく力の上限（表面張力）は 玉の半径に比例 → Fmax = KA·m^(1/3)。
     だから 重さ/上限 は m^(2/3) で増え、大きい玉ほど 落ちやすい。2本目からは こよりが夜露で湿って 上限が少し下がる。
   玉にかかる力 = こよりが玉を引く力（いちばん下のばねの張力）。玉は重力・夜風・火花の反動を受けて動くので、
     張力 = 玉を その動きにさせるのに要る力（重力 + 揺れの遠心力・加速度 + 反動を受け止める分）。
     張力を TAU_F 秒でならした値が 上限を超えたら 玉は落ちる（ぐらぐら度 = ならした張力 / 上限）。
   手: 指でずらした目標へ、手は 2次の遅れ（固有角振動数 HW、臨界減衰）で ついてくる。目標には 手の震え（なめらかな小さいゆらぎ）と
     袂（たもと）の揺れが足される。袂は腕から垂れた布の振り子（固有角振動数 SL_W ≈ こよりの振り子と ほぼ同じ）で、夜風に押されて揺れ、
     その揺れが手を通して こよりを ちょうど揺れやすい速さで ゆする（何もしないと 揺れが少しずつ育つ）。
   夜風: OU ゆらぎ（強さは燃えるほど・本数ほど強く）+ ときどきの突風（sin² の山）。袂と、玉・こよりを 相対速度に比例して押す。
   打ち消し方: 玉が振れた向きへ、振れた分だけ 手をゆっくりずらす（手の速さ ∝ 玉のずれ）と、振り子の減衰になる。
     見てから動くまでが遅すぎる・急に大きく動かすと、かえって揺らしたり、手の加速度がそのまま玉にかかって落ちる。
   火花の反動: 段階ごとの頻度でランダムな時刻に、玉の速さを ランダムな向きに dv だけ変える（松葉がいちばん強い）。
   段階: 蕾 → 牡丹 → 松葉 → 柳 → 散り菊 → T_END 秒で燃え切る（大成功）。GAP 秒おいて 次の1本（風が強く・紙が湿る）。
   落ちた玉は 放物線で地面（GROUND）へ → じゅっ。そこでおしまい。記録 = 玉がついていた時間の合計。 */
const PH = {
  DT: 1 / 480, G: 9.8,
  N: 5, SEG: 0.064, MN: 0.08,             // こよりの垂れた部分 5 節 × 6.4 cm（振り子の周期 ≈ 1.1 秒）、節の重さ g
  K: 8000, C: 22, KB: 40,                 // 節のばね mN/m・減衰 mN·s/m・こし mN/m
  CA_N: 0.004, CA_B: 0.022,               // 空気（夜風）の受け方 mN·s/m（節・玉）
  HW: 20, HX: 0.12, HY: 0.07, KEYV: 0.1,  // 手のついてくる速さ rad/s・手の動ける範囲 m・キーで動かす速さ m/s
  TREM: 0.015, TREM_TAU: 0.2, TREM_BACK: 0.5, TREM_N: 0.15, TREM_Y: 0.1,  // 手の震え（速さのゆらぎ m/s・時定数 s・戻る時定数 s・1本ごとの増え・上下は横の何倍）
  TAU_F: 0.05, KA: 9.08, WET: 0.05,       // 力をならす時間・くっつく力の係数・1本ごとの湿り
  W0: 0.24, W1: 0.45, WN: 0.3, WTAU: 0.5, // 夜風のゆらぎ m/s（はじめ・燃えるにつれて）・1本ごとの増え・時定数
  SLEEVE: 0.04, SL_W: 5.4, SL_Z: 0.15,     // 夜風 1 m/s で 袂に押されて 手がずれる m・袂の揺れの固有角振動数 rad/s・減衰
  GUST: 0.75, GUST_T0: 7, GUST_T1: 12,    // 突風の強さ（ゆらぎの何倍）・間隔 s
  T_END: 68, GAP: 2.4, Y0: 0.40, GROUND: -0.25, MAXT: 3600,
};
// 段階（s はその1本の燃えた秒）
const STAGES = [
  { id: 'tsubomi', name: '蕾', t: 0 },
  { id: 'botan', name: '牡丹', t: 3 },
  { id: 'matsuba', name: '松葉', t: 15 },
  { id: 'yanagi', name: '柳', t: 38 },
  { id: 'chiri', name: '散り菊', t: 54 },
];
const MASS = [[0, 0.132], [3, 0.285], [8, 0.393], [15, 0.513], [38, 0.609], [54, 0.643], [68, 0.654]];          // 玉の重さ g
const KICK = [[0, 1], [3, 5], [8, 9], [15, 11], [18, 22], [34, 22], [38, 12], [54, 8], [62, 4], [68, 1]];   // 反動の頻度 /s
const KDV = [[0, 0.001], [3, 0.0024], [15, 0.003], [18, 0.005], [36, 0.005], [40, 0.0036], [54, 0.0024], [68, 0.0018]];  // 反動の強さ（平均 m/s）
function interp(T, s) {
  if (s <= T[0][0]) return T[0][1];
  for (let i = 1; i < T.length; i++) if (s <= T[i][0]) { const a = T[i - 1], b = T[i]; return a[1] + (b[1] - a[1]) * (s - a[0]) / (b[0] - a[0]); }
  return T[T.length - 1][1];
}
const stageOf = s => { let i = 0; while (i + 1 < STAGES.length && s >= STAGES[i + 1].t) i++; return i; };
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth01 = x => { x = clampP(x, 0, 1); return x * x * (3 - 2 * x); };
const fmaxOf = (m, n) => PH.KA * Math.cbrt(m) * Math.max(0.7, 1 - PH.WET * (n - 1));
const windLv = (s, n) => (PH.W0 + (PH.W1 - PH.W0) * smooth01(s / 50)) * (1 + PH.WN * (n - 1));
// 入力は時刻つきで入れる（画面のコマとは関係なく、物理はその時刻で効く）
function gInput(g, t, kind, a = 0, b = 0) { if (g.log) g.log.push({ t, kind, a, b }); const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, { t, kind, a, b }); }
function makeGame(seed = 1) {
  const r = mulberry((seed * 2654435761) >>> 0), N = PH.N, f = () => new Float64Array(N + 1);
  const g = {
    seed, rnd: r, t: 0, queue: [], events: [], log: null,
    phase: 'burn', n: 1, s: 0, Tdone: 0, T: 0, sticks: 0, cause: null, stage: 0,
    tx: 0, ty: 0, kx: 0, ky: 0, hx: 0, hy: 0, hvx: 0, hvy: 0, trx: 0, tryy: 0, tvx: 0, tvy: 0,
    X: f(), Y: f(), VX: f(), VY: f(), M: f(), FX: f(), FY: f(),
    mb: MASS[0][1], Ff: 0, Fmax: 1, ratio: 0, rmax: 0, tens: 0,
    wo: 0, w: 0, sx: 0, svx: 0, gust: null, gustAt: 0, nextKick: 0,
    ball: null, gapUntil: 0,
  };
  g.X[0] = 0; g.Y[0] = PH.Y0;
  resetStick(g);
  return g;
}
// 新しい1本: こよりは つまんだ点の真下にまっすぐ
function resetStick(g) {

    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => r2(runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).T)),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, { maxT: 400, ...opts })), T = R.map(r => r.T), causes = {}, sticks = {};
      for (const r of R) { causes[r.cause] = (causes[r.cause] || 0) + 1; sticks[r.sticks] = (sticks[r.sticks] || 0) + 1; }
      return { skill, N, p10: r2(q(T, 0.1)), p25: r2(q(T, 0.25)), p50: r2(q(T, 0.5)), p75: r2(q(T, 0.75)), p90: r2(q(T, 0.9)), min: r2(Math.min(...T)), max: r2(Math.max(...T)), ge8: R.filter(r => r.T >= 8).length / N, full1: R.filter(r => r.sticks >= 1).length / N, full2: R.filter(r => r.sticks >= 2).length / N, mean: r2(T.reduce((a, b) => a + b, 0) / N), sticks, causes };
    },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（frameQuantized は時刻を使わなかった場合のくらべ）
    fpsCheck: (skill = 'first', seedR = 4242) => {
      const r = runBot(SKILLS[skill], seedR, { log: true, maxT: 400 });
      return { live: { T: r2(r.T), sticks: r.sticks, cause: r.cause }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), fps30frameQuantized: replay(r.log, seedR, 30, LAG, true), fps60frameQuantized: replay(r.log, seedR, 60, LAG, true), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; drag = null; } },
    skip: s => skipTo(game.t + s),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）
    screen: (x, y, z = 0) => scr(x, y, z),
    ballScreen: () => { const B = ballPos(); return scr(B.x, B.y); },
    handScreen: () => scr(game.X[0], game.Y[0]),
    tapPoint: () => ({ x: Math.round(W / 2), y: Math.round(H * 0.62) }),
    mpp: () => mpp, fingerMpp: () => mpp * GAIN,
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, STAGES, SKILLS, makeGame, runBot, stepGame, gInput, pend, sparkRates, sparks: () => ({ n: S.n, kinds: Array.from(S.kind.slice(0, S.n)) }), game: () => game,
  };
}
