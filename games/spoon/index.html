<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- スプーンの 中の ピンポン玉の 物理（three には 頼らない 自前。長さ m・時間 秒・角度 rad） ----------
   スプーンの 皿 = 半径 RB の 浅い 球面の くぼみ。玉の 位置は 皿の 底からの 角度 q = (qx 横・右が +, qy 前後・前が +)。
   玉は 転がる（慣性 2/5 → 係数 5/7）:  q'' = K·( ge·(τ − q) + A ) − CD·q'    K = 5 / (7·RB)
     ge = 見かけの 重力（= g + 手の 上下の 加速度。足音の 上下・でこぼこで かわる。0 以下 = 玉が 浮く）
     τ  = スプーンの 横の かたむき（右を 下げると +。玉は 右へ ころがる）。指の 横の なぞりで 決まる ねらい τT に 0.09 秒 おくれて ついていく
     A  = 見かけの 横・前後の 加速度（= −手の 加速度 + 風）
          横: カーブの 遠心 v²κ・足の ゆれ・よろけ（平均台で 大きい）・でこぼこの かたむき・風（ピンポン玉は 軽い）
          前後: 速く なる / おそく なる（−a）・足の ゆれ
     ほかの 子が 横から 割りこんで ぶつかると 手が ずれて 玉の 速さが かわる（q' += J）
   (qx/RX)² + (qy/RY)² > 1 で 縁を こえて 玉が 落ちる → おしまい。うしろの 組に 追いつかれても おしまい。
   はやさ: 指の 縦の なぞりで 決まる ねらい vset に、加速 ACC・減速 DEC・加加速 JERK の 範囲で ついていく。平均台の 上は 1.9m/s まで（こえると つんのめる）。
   コースは seed で 決まる（0.25m きざみの 表: 曲がり κ・風・平均台 + でこぼこ・割りこみの リスト）。距離が のびるほど きつく、こまかく。上限なし。
   入力は すべて 時刻つき（move: dτ, dv）。物理は 1/240 秒きざみ。 */
const PH = {
  DT: 1 / 240, G: 9.8, RB: 1.5, RX: 0.2, RY: 0.32, CD: 2.0, TMAX: 0.38, TAU_H: 0.09,
  VMIN: 0.6, VMAX: 5.2, V0: 1.3, ACC: 1.0, DEC: 1.5, JERK: 2.2, BEAM_V: 1.9, BEAM_DEC: 3.6,
  SWAY: 0.05, BOB: 0.22, BOBF: 0.05, WOB: 0.11, WOB_T: 0.35, ABS: 0.42,
  GAP0: 10, GAPMAX: 20, T_READY: 1.4, T_CHASE: 2.6, T_END: 1.7, STEP: 0.25,
};
const K_ROLL = 5 / (7 * PH.RB);
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash2 = (a, b) => { let h = Math.imul((a ^ 0x9e3779b9) | 0, 0x85ebca6b) ^ Math.imul((b + 0x632be5ab) | 0, 0xc2b2ae35); h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; return h >>> 0; };
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const smoothP = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
// うしろの 組の はやさ（距離 c で）。だんだん 速く（上限なし）
const paceAt = c => 1.9 + 0.8 * (1 - Math.exp(-c / 400)) + c / 6000;
/* ---------- コース ---------- */
function makeCourse(seed) {
  const C = { seed0: seed, r: mulberry(hash2(seed, 77)), K: [], WD: [], BM: [], CZ: [], end: 0, segs: [], bumps: [], rivals: [], cones: [], beams: [], winds: [], n: 0, lastWind: -99, lastRival: -99, lastBump: -99 };
  addStraight(C, 9);
  addCurve(C, 1, 9.5, 0.9, 'curve');
  addStraight(C, 6);
  return C;
}
const cIdx = (C, s) => clampP(Math.round(s / PH.STEP), 0, C.K.length - 1);
function pushTable(C, L, fk, type, extra = {}) {
  const n = Math.max(1, Math.round(L / PH.STEP)), s0 = C.end;
  for (let i = 0; i < n; i++) { C.K.push(fk(i * PH.STEP, n * PH.STEP)); C.WD.push(0); C.BM.push(0); C.CZ.push(0); }
  C.end = C.K.length * PH.STEP;
  C.segs.push({ type, s0, s1: C.end, ...extra });
  return { s0, s1: C.end };
}
function addStraight(C, L) { return pushTable(C, L, () => 0, 'straight'); }
// カーブ: 半径 r・角度 ang・dir +1 = 左。入り口と 出口は 2m で なめらかに
function addCurve(C, dir, r, ang, type = 'curve') {
  const k = dir / r, Lr = 2.2, L = ang * r + Lr;
  return pushTable(C, L, (u, LL) => k * smoothP(Math.min(u, LL - u) / Lr), type, { dir, r });
}
// コーンの ジグザグ: n 本・間かく sp・ふれ amp
function addCones(C, n, sp, amp) {
  const ka = amp * (Math.PI / sp) ** 2, L = (n + 1) * sp, s0 = C.end, dir = C.r() < 0.5 ? 1 : -1;
  const seg = pushTable(C, L, (u, LL) => { const env = smoothP(Math.min(u, LL - u) / sp); return dir * ka * Math.sin(Math.PI * u / sp) * env; }, 'cones', { n, sp, amp });
  for (let i = seg.s0 / PH.STEP | 0; i < C.K.length; i++) C.CZ[i] = 1;
  // コーンは ジグザグの 山の 外がわ
  for (let i = 1; i <= n; i++) C.cones.push({ s: s0 + (i - 0.5) * sp, side: (i % 2 ? 1 : -1) * dir, amp });
  return seg;
}
function addBeam(C, L) {
  addStraight(C, 1.5);
  const seg = pushTable(C, L, () => 0, 'beam', {});
  for (let i = Math.round(seg.s0 / PH.STEP); i < C.K.length; i++) C.BM[i] = 1;
  C.beams.push({ s0: seg.s0, s1: seg.s1 });
  C.bumps.push({ s: seg.s0, h: 0.05, L: 0.5, sl: 0, beam: 1 }, { s: seg.s1, h: 0.05, L: 0.5, sl: 0, beam: 1 });
  addStraight(C, 1.5);
  return seg;
}
function genFeature(C) {
  const r = C.r, s = C.end, D = 1 - Math.exp(-s / 170), E = s / 1000;
  C.n++;
  // 道の かたち
  const w = { st: 1.0 - 0.4 * D, cu: 1.4, sc: 0.3 + 0.8 * D, co: s > 55 ? 0.5 + 0.5 * D : 0, be: s > 100 ? 0.35 + 0.4 * D : 0 };
  let tot = 0; for (const k in w) tot += w[k];
  let x = r() * tot, type = 'st';
  for (const k in w) { x -= w[k]; if (x <= 0) { type = k; break; } }
  const rad = () => Math.max(3.4, (8.8 - 4.6 * D - 0.4 * E) * (0.82 + 0.36 * r()));
  const dir = r() < 0.5 ? 1 : -1;
  const s0 = C.end;
  if (type === 'st') addStraight(C, (11 - 5 * D) * (0.7 + 0.6 * r()));
  else if (type === 'cu') { addCurve(C, dir, rad(), 0.6 + r() * (0.8 + 0.6 * D)); addStraight(C, 2 + 5 * r() * (1 - D)); }
  else if (type === 'sc') { addCurve(C, dir, rad(), 0.5 + 0.7 * r(), 'scurve'); addStraight(C, Math.max(0, 2.5 * r() * (1 - D))); addCurve(C, -dir, rad(), 0.5 + 0.7 * r(), 'scurve'); addStraight(C, 2 + 3 * r()); }
  else if (type === 'co') { addStraight(C, 2); addCones(C, 4 + Math.floor(r() * (2 + 3 * D)), (3.4 - 0.5 * D) * (0.9 + 0.2 * r()), (0.24 + 0.08 * D + 0.02 * E) * (0.9 + 0.2 * r())); addStraight(C, 3); }
  else if (type === 'be') addBeam(C, (4 + 5 * D) * (0.8 + 0.4 * r()));
  const s1 = C.end;
  // でこぼこ（平均台・コーンの 上は なし）
  if (type !== 'be' && s0 > 20 && s1 - s0 > 4) {
    const pB = C.lastBump < 0 && s0 > 24 ? 1 : 0.22 + 0.4 * D;
    if (r() < pB) {
      const nB = 1 + Math.floor(r() * (1 + 2 * D));
      let sb = s0 + 2 + r() * 3;
      for (let i = 0; i < nB && sb < s1 - 1; i++) {
        C.bumps.push({ s: sb, h: (0.045 + 0.05 * D + 0.01 * E) * (0.7 + 0.6 * r()), L: 0.7 + 0.35 * r(), sl: (r() * 2 - 1) * (0.35 + 0.65 * D) });
        C.lastBump = sb; sb += 2.6 + r() * 3;
      }
      C.bumps.sort((a, b) => a.s - b.s);

      return { live: { n: r.n, end: r.end, t: r.t }, fps8: replay(r.log, seedR, 8, false, e), fps13: replay(r.log, seedR, 13, false, e), fps30: replay(r.log, seedR, 30, false, e), fps60: replay(r.log, seedR, 60, false, e), fps144: replay(r.log, seedR, 144, false, e), fps30frameQuantized: replay(r.log, seedR, 30, true, e), inputs: r.log.length };
    },
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { game.queue.length = 0; ptr.id = null; ptr.down = false; bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (sec, pose = 'none') => skipTo(game.t + sec, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, texs: renderer.info.memory.textures }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, makeBot, planCmd, paceAt, game: () => game, lat, three: () => ({ scene, renderer, camera }),
  };
  // 目安から 実際の 入力までの 遅れ（ms）
  lat.log = [];
  inputHook = (kind, ms) => {
    const I = lat.issued;
    if (I && !I.got && I.action === kind) {
      I.got = true;
      const dly = ms - I.at;
      if (lat.log.length > 60) lat.log.shift(); lat.log.push({ kind, dly: Math.round(dly) });
      if (!lat.fixed && dly > -50 && dly < 800) lat.ema = lat.ema * 0.7 + clamp(dly, 0, 400) * 0.3;
    }
  };
}
