<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dエンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 風車まわしの物理（three には頼らない自前のモデル。単位は m・秒・rad。風車の回転 ω は「回転/秒」） ----------
   道: 種から決まる 1 本の道（まっすぐ・曲がり角・S字）。道の上の距離 s だけで位置と向き ψ が決まる。ところどころに
     ぬかるみ（速く走れない・息が減る）・のぼり坂（息が減る・遅い）・くだり坂（速い・息が楽）・橋（川の上は風が強い）。
   自然の風 W: 吹いてくる向き χ と強さ U。χ はゆっくりさまよう（だんだん気まぐれに）。ときどき 突風（強く・向きもぶれる）と
     無風（ほぼ止む）。時間がたつほど 突風・無風 が多く・長く・強くなり、風の向きも大きく変わる。
   見かけの風 A = W − v·f（f は走る向き）。走るほど前から風が来る。追い風だと走っても A が小さい。向かい風なら歩くだけでよい。
   風車: 手に持った軸の向き d = 走る向きから α だけ回した向き（指を左右にずらす・← →）。面に正面から当たる風の強さ
     u = |A|·cosδ·√|cosδ|（δ = 面と見かけの風のずれ。ずれるほど急に弱い。うしろから当たると逆向きに押されて止まる）。
     dω/dt = KC·u·(G·u − ω)（風が羽根を押す: 風の速さに見合う回転 G·u へ近づく）− F0 − F1·ω − F2·ω²（軸の摩擦・空気の抵抗）。
   走る: 押している間 v は V_TOP へ近づく（長く押すほど速い）。離すと歩く（V_WALK）。
     息 B: 速く走るほど減る（DR·(v − V_FREE)^1.5）。歩くと戻る。0 になると「息切れ」で B_RESUME まで走れない。
   はじめ: 立ったまま「ふーっ」と吹いた風車（W0）を持って待つ。押したら（押さなくても READY_T 秒で）時計が動きだす。
   判定: ω が W_STOP（止まりかけ）を T_STOP 秒下回ったら おしまい。記録は 動きだしてから そこまでの秒数と距離。 */
const DEGP = Math.PI / 180;
const PH = {
  DT: 1 / 200,
  V_WALK: 1.0, V_TIRED: 0.75, A_RUN: 2.0, V_TOP: 5.5, A_DOWN: 2.6,           // 歩く・息切れ・走りの加速・いちばん速い・止まる減速
  DR: 0.0069, V_FREE: 1.5, REC: 0.09, V_REC: 1.7, B_RESUME: 0.35,           // 息: 減り方・息の減らない速さ・戻り方・戻る速さ・息切れから走れるまで
  G: 1.6, KC: 0.5, REV: 0.3, F0: 0.5, F1: 0.12, F2: 0.012,                  // 風車: 風の速さに見合う回転・羽根の受け方・うしろからの風・摩擦と抵抗
  W0: 4.2, W_STOP: 1.1, T_STOP: 0.35, GRACE: 2.5, STOP_T: 1.5, READY_T: 4,  // はじめの回転（ふーっ）・止まりかけ・その時間・はじめの猶予・止まる演出・押さなくても歩きだすまで
  AIM_MAX: 88 * DEGP, AIM_TAU: 0.06, KEY_RATE: 120 * DEGP,                  // 風車の向き: 左右の限り・手の追いつき・キーで回す速さ
  U0: 2.3, RAMP_T: 240,                                                      // 自然の風の強さ・気まぐれになるまでの時間（秒）
  MUD_V: 2.0, MUD_W: 0.7, MUD_D: 1.5, UP_V: 0.72, UP_D: 1.9, UP_W: 0.8, DN_V: 1.18, DN_D: 0.5, DN_W: 1.25, BRIDGE_U: 1.3,
  MILE: 50, EMA: 2.5,
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const easeP = k => k * k * (3 - 2 * k);
const wrapA = a => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };

/* 道（種から決まる）: まっすぐ → 曲がり角 →（ときどき S 字）… 進むほど まっすぐが短く、曲がりが急に。必要なぶんだけ先へ作る */
function makeCourse(seed) {
  const rnd = mulberry((seed * 2654435761) >>> 0);
  const psi0 = rnd() * Math.PI * 2;
  const c = { S: 0.5, psi0, X: [0], Z: [0], P: [psi0], Y: [0], pieces: [], feats: [], cur: 0, yc: 0, pi: 0 };
  function gen() {
    const s = c.cur, cap = clampP(s / 700, 0, 1), cap2 = clampP((s - 700) / 900, 0, 1);
    const L = s < 1 ? 55 : Math.max(10, (16 + 28 * (1 - cap) + 16 * rnd()) * (1 - 0.35 * cap2));
    c.pieces.push({ s0: s, s1: s + L, k: 0 });
    if (s > 25 && L > 12) {
      const types = [['up', c.yc < 2.2 ? 0.5 : 0], ['down', c.yc > 0.5 ? 0.9 : 0], ['none', 0.55 - 0.35 * cap]];
      if (s > 45) types.push(['mud', 0.45 + 0.35 * cap]);
      if (s > 80) types.push(['bridge', 0.3]);
      let tot = 0; for (const t of types) tot += t[1];
      let u = rnd() * tot, ty = 'none';
      for (const t of types) { if ((u -= t[1]) <= 0) { ty = t[0]; break; } }
      const a = s + 3 + rnd() * Math.max(0, L - 16);
      if (ty === 'mud') c.feats.push({ type: 'mud', s0: a, s1: Math.min(s + L - 1, a + 3 + rnd() * (4 + 6 * cap)) });
      else if (ty === 'up' || ty === 'down') {
        const grade = 0.05 + 0.05 * cap + 0.03 * rnd();
        let len = Math.min(L - 4, 8 + rnd() * 12);
        if (ty === 'down') len = Math.min(len, c.yc / grade); else len = Math.min(len, (2.6 - c.yc) / grade);
        if (len > 3) { const gg = ty === 'up' ? grade : -grade; c.feats.push({ type: ty, s0: a, s1: a + len, grade: gg }); c.yc += gg * len; }
      } else if (ty === 'bridge') c.feats.push({ type: 'bridge', s0: a, s1: a + 6 + rnd() * 5 });
    }
    const sg = rnd() < 0.5 ? -1 : 1, ang = (22 + (30 + 50 * cap) * rnd() + 35 * cap2 * rnd()) * DEGP, R = Math.max(7, 20 - 9 * cap + 8 * rnd() - 4 * cap2), cl = ang * R;
    let e = s + L;
    c.pieces.push({ s0: e, s1: e + cl, k: sg / R, ang: sg * ang }); e += cl;
    if (rnd() < 0.15 + 0.35 * cap) { const a2 = (20 + 40 * rnd() + 30 * cap * rnd()) * DEGP, R2 = Math.max(7, 18 - 8 * cap + 6 * rnd()), l2 = a2 * R2; c.pieces.push({ s0: e, s1: e + l2, k: -sg / R2, ang: -sg * a2 }); e += l2; }
    c.cur = e;
  }
  const lb = (a, x) => { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m].s1 < x) lo = m + 1; else hi = m; } return lo; };
  c.featAt = s => { const a = c.feats, i = lb(a, s); return i < a.length && a[i].s0 <= s && s <= a[i].s1 ? a[i] : null; };
  c.pieceAt = s => { const a = c.pieces, i = lb(a, s); return a[Math.min(i, a.length - 1)]; };
  c.ensure = sMax => {
    while (c.cur < sMax + 40) gen();
    const S = c.S;
    while ((c.X.length - 1) * S < sMax) {
      const i = c.X.length, mid = (i - 0.5) * S;
      while (c.pi < c.pieces.length - 1 && c.pieces[c.pi].s1 < mid) c.pi++;
      const k = c.pieces[c.pi].k, p0 = c.P[i - 1], pm = p0 + k * S / 2, f = c.featAt(mid);
      c.P.push(p0 + k * S); c.X.push(c.X[i - 1] + Math.cos(pm) * S); c.Z.push(c.Z[i - 1] + Math.sin(pm) * S);
      c.Y.push(c.Y[i - 1] + (f && f.grade ? f.grade * S : 0));
    }
  };
  // 道の上の距離 s → 位置・向き・高さ（0.5m ごとの点を線でつなぐ）
  c.at = (s, out = {}) => {
    if (s > (c.X.length - 2) * c.S) c.ensure(s + 60);
    const u = Math.max(0, s) / c.S, i = Math.min(c.X.length - 2, Math.floor(u)), k = u - i;
    out.x = c.X[i] + (c.X[i + 1] - c.X[i]) * k; out.z = c.Z[i] + (c.Z[i + 1] - c.Z[i]) * k;
    out.psi = c.P[i] + (c.P[i + 1] - c.P[i]) * k; out.y = c.Y[i] + (c.Y[i + 1] - c.Y[i]) * k;
    return out;
  };
  c.ensure(120);
  return c;
}

/* 自然の風（種から決まる。時刻だけで決まる）: 吹いてくる向き χ・強さ U・いまの突風／無風 */

  if (c === 'tail') return '追い風で止まった。うしろからの風は、走っても見かけの風が弱い。追い風の前に息をためて、全力で走り抜けよう。';
  if (c === 'breath') return '息切れで止まった。向かい風・横風のときは、歩いて（離して）息をもどそう。面を風に向ければ、歩いても回る。';

/* ---------- 音（紙と竹と土の低い音。2kHz 以上は使わない。最後に 1.9kHz のローパス） ---------- */
let ac = null, master = null, noiseBuf = null, windSrc = null, windLP = null, windGain = null, nextClick = 0;

      master = ac.createDynamicsCompressor(); master.threshold.value = -16; master.ratio.value = 5;

      const d = noiseBuf.getChannelData(0); let b = 0;
      for (let i = 0; i < len; i++) { b = b * 0.7 + (Math.random() * 2 - 1) * 0.3; d[i] = b * 2; }
      // 風の「ごー」: ずっと鳴っているノイズを、見かけの風の強さで開け閉めする
      windSrc = ac.createBufferSource(); windSrc.buffer = noiseBuf; windSrc.loop = true;
      windLP = ac.createBiquadFilter(); windLP.type = 'lowpass'; windLP.frequency.value = 200; windLP.Q.value = 0.8;
      windGain = ac.createGain(); windGain.gain.value = 0;

}
const live = () => ac && state === 'play';
function tone(freq, at, dur, vol, type = 'sine', f1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at); if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
}
function noise(at, dur, vol, type, freq, q = 1, lpf = 1500) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpf;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);

}
// 毎コマ: 風の音・風車の「からから」（紙が竹ひごをはじく、低く乾いた音。回転が速いほど間隔がつまる）
function soundFrame() {

    if (!ac) return;
    const on = live() && game && game.phase !== 'over' && !frozen, n0 = ac.currentTime;
    windGain.gain.setTargetAtTime(on ? clamp(0.012 * Math.pow(game.Am, 1.25), 0, 0.12) : 0, n0, 0.15);
    windLP.frequency.setTargetAtTime(on ? clamp(170 + 70 * game.Am, 170, 750) : 200, n0, 0.2);
    if (!on || game.om < 0.6) { nextClick = n0 + 0.05; return; }
    if (nextClick < n0) nextClick = n0;
    const om = game.om, rate = clamp(om * 2.2, 1.5, 15), vol = 0.03 * clamp(om / 4, 0.35, 1.25);
    let k = 0;
    while (nextClick < n0 + 0.12 && k++ < 8) {
      const f = 420 + Math.random() * 120;
      noise(nextClick, 0.024, vol, 'bandpass', f, 2.2, 900);
      tone(190 + Math.random() * 30, nextClick, 0.025, vol * 0.35, 'triangle');
      nextClick += (1 / rate) * (0.85 + Math.random() * 0.3);

  } catch {}
}
let stepAlt = 0;
function footstep(v) {

    tone(95 * a, n0, 0.06, 0.09 * k, 'sine', 70); noise(n0, 0.04, 0.05 * k, 'lowpass', 380, 0.7, 450);

}
function sGust() { try { if (!live()) return; const n0 = ac.currentTime; const f = noise(n0, 1.0, 0.09, 'bandpass', 260, 0.8, 700); f.frequency.exponentialRampToValueAtTime(560, n0 + 0.5); f.frequency.exponentialRampToValueAtTime(240, n0 + 1.0); } catch {} }
function sGasp() { try { if (!live()) return; const n0 = ac.currentTime; for (let i = 0; i < 3; i++) noise(n0 + i * 0.32, 0.14, 0.05, 'bandpass', 650, 1.2, 900); } catch {} }
function sStop() { try { if (!live()) return; const n0 = ac.currentTime; tone(330, n0, 0.5, 0.06, 'triangle', 165); tone(247, n0 + 0.18, 0.6, 0.05, 'sine', 123); } catch {} }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;

/* ---------- 入力: 押している間＝走る。押したまま左右にずらした量＝風車の向き（ずらした距離だけで決まる）。時刻つきで物理へ ---------- */

  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(nextSeed(), bn); frozen = false;

  // 同じ「押した・離した・ずらした」の時刻の列を、いろいろなコマ割りで物理に流して、結果がそろうか（lag = 物理の遅れ。ゲームは LAG 秒）
  const replay = (log, seedR, fps, lag = LAG, quant = false) => {
    const g = makeGame(seedR); let i = 0, tNow = 0;
    while ((g.phase === 'go' || g.phase === 'ready') && tNow < 1500) {
      tNow += 1 / fps;
      while (i < log.length && log[i].t <= tNow) { gInput(g, Math.max(g.t, quant ? tNow - lag : log[i].t), log[i].kind, log[i].v); i++; }   // そのコマまでに届いた入力（quant: 時刻を使わずコマの時刻で効かせた場合）
      while (g.t + PH.DT <= tNow - lag && (g.phase === 'go' || g.phase === 'ready')) { stepGame(g); g.events.length = 0; }
    }
    return { T: r3(g.T), m: r2(g.s), cause: g.cause };
  };
  const ideal = () => { const g = game, tr = terrOf(g.course.featAt(g.s)); return clamp(apparent(g.W, g.psi, g.v, g.a, tr.uk).beta, -PH.AIM_MAX, PH.AIM_MAX); };
  const scr = (x, y, z) => { const s = project(x, y, z); return { x: Math.round(s.x), y: Math.round(s.y) }; };
  window.__kazaguruma = {
    info: () => {
      if (!game) return null;
      const g = game, tr = terrOf(g.course.featAt(g.s)), id = ideal(), f = g.course.featAt(g.s);
      const uWalk = (() => { const ap = apparent(g.W, g.psi, PH.V_WALK * tr.wk, 0, tr.uk), al = clamp(ap.beta, -PH.AIM_MAX, PH.AIM_MAX); return apparent(g.W, g.psi, PH.V_WALK * tr.wk, al, tr.uk).u; })();
      return {
        state, phase: g.phase, t: r3(g.t), t0: r3(g.t0), T: r2(g.phase === 'go' ? g.t - g.t0 : g.T), s: r2(g.s), v: r2(g.v), B: r3(g.B), tired: g.tired, run: g.run,
        om: r2(g.om), u: r2(g.u), apparent: { speed: r2(g.Am), fromDeg: Math.round(g.beta / DEG) },
        wind: { U: r2(g.W.U), fromDeg: Math.round(wrapA(g.W.chi - g.psi) / DEG), tail: r2(g.W.wx * Math.cos(g.psi) + g.W.wz * Math.sin(g.psi)), ev: g.W.ev ? (g.W.ev.lull ? 'lull' : 'gust') : null },
        aimDeg: r1(g.a / DEG), aimTargetDeg: r1(g.aT / DEG), deltaDeg: r1(g.delta / DEG),
        meyasu: { idealAimDeg: r1(id / DEG), dragPx: Math.round((id - g.aT) / aimPerPx()), uWalkAligned: r2(uWalk), walkOK: uWalk > 2.0, omStop: PH.W_STOP },
        feat: f ? f.type : null, curve: r3(g.course.pieceAt(g.s).k), cause: g.cause,
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, queue: g.queue.length, pressing, aimUI: r1(aimUI / DEG),
      };
    },
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [秒...]。opts.seed0、opts.tMax
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => r1(runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).T)),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), T = R.map(r => r.T), causes = {};
      for (const r of R) causes[r.cause] = (causes[r.cause] || 0) + 1;
      return { skill, N, p10: r1(q(T, 0.1)), p25: r1(q(T, 0.25)), p50: r1(q(T, 0.5)), p75: r1(q(T, 0.75)), p90: r1(q(T, 0.9)), min: r1(Math.min(...T)), max: r1(Math.max(...T)), ge10: R.filter(r => r.T >= 10).length / N, ge60: R.filter(r => r.T >= 60).length / N, ge120: R.filter(r => r.T >= 120).length / N, ge300: R.filter(r => r.T >= 300).length / N, mean: r1(T.reduce((a, b) => a + b, 0) / N), m50: Math.round(q(R.map(r => r.m), 0.5)), runShare50: r2(q(R.map(r => r.runT / Math.max(1, r.T)), 0.5)), causes };
    },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（frameQuantized は時刻を使わなかった場合のくらべ）
    fpsCheck: (skill = 'good', seedR = 4242) => {
      const r = runBot(SKILLS[skill], seedR, { log: true });
      return { live: { T: r3(r.T), m: r2(r.m), cause: r.cause }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), fps30frameQuantized: replay(r.log, seedR, 30, LAG, true), fps60frameQuantized: replay(r.log, seedR, 60, LAG, true), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）
    pinwheelScreen: () => { const v = myPin.g.getWorldPosition(new THREE.Vector3()); return scr(v.x, v.y, v.z); },
    kidScreen: () => scr(kidA.x, kidA.y + 0.7, kidA.z),
    koinoboriScreen: () => { const L = koinobori.filter(k => k.g.visible).map(k => ({ k, p: project(k.g.position.x, GY + 6.5, k.g.position.z) })).filter(o => o.p.front && o.p.x > 0 && o.p.x < W && o.p.y > 0 && o.p.y < H).sort((a, b) => Math.abs(a.k.s - game.s) - Math.abs(b.k.s - game.s)); return L.length ? { x: Math.round(L[0].p.x), y: Math.round(L[0].p.y), s: L[0].k.s } : null; },
    dialScreen: () => { const L = hudLayout(); return { x: Math.round(L.dial.x), y: Math.round(L.dial.y), r: Math.round(L.dial.r) }; },
    tapPoint: () => ({ x: Math.round(W / 2), y: Math.round(H * 0.5) }),
    // 風車の向きを deg にするための指の動き（押す点 from → 動かす先 to）
    dragFor: (deg, from = null) => { const f = from || { x: Math.round(W / 2), y: Math.round(H * 0.5) }; return { from: f, to: { x: Math.round(f.x + (deg * DEG - game.aT) / aimPerPx()), y: f.y } }; },
    // 調べる用: 近くのこいのぼり（i 番目）を横から見る。null で戻す
    lookKoi: (i = 0, d = 9) => { if (i == null) { camOver = null; return; } const kb = koinobori[i], P = kb.g.position; camOver = [P.x + d, GY + 4, P.z + d * 0.4, P.x, GY + 5.5, P.z]; return { s: kb.s, U: r2(windNow.U) }; },
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, windAt, apparent, game: () => game,
  };
}
