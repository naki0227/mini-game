<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 canvas（団地の中庭）+ 上に HUD、タイトル/結果は中央のカード1枚 */
:root {
  --sky: #cfe4ea;        /* 洗濯日和の空 */
  --wall: #e8e0cc;       /* 団地の壁 */
  --ink: #23302f;
  --cotton: #fbfaf4;     /* 干したてのタオル */
  --noren: #2d5a5e;      /* 青緑の物干し竿色 */

  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;

}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

.hud {

}

  background: var(--noren); color: var(--noren-ink);

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

}

}

}

.body { padding: 20px 22px 22px; display: grid; gap: 14px; }

}

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
const { Engine, Bodies, Body, Composite } = Matter;
const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');

/* ---------- 記録（このブラウザだけ） ---------- */
const KEY = 'hanger:v1';
const DEF = { best: 0, bestHung: 0, bestStreak: 0, bestDist: 0, plays: 0 };
function load() { try { return Object.assign({ ...DEF }, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { return { ...DEF }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch {} }
let rec = load();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = a => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- 世界（1m = 100、y は上がマイナス、地面 y=0） ---------- */
const PER_M = 100;
const TOTAL = 10;
const DT2 = (1000 / 60) ** 2;
const GRAV = 0.85;                         // 約 8.5 m/s²（すこしふんわり）
const ACC = GRAV * 0.001 * DT2;            // px/step²
const VMAX = 1250 / 60;                    // 最大の強さ（px/step）
const WIND_K = 34;                         // 風 1m/s あたりの横加速度（px/s²）
const HAND_Y = -165;

// 竿（掛けられるもの）。x0〜x1 の範囲の高さ y に引っ掛かる
const RODS = [
  { id: 'A1', kind: 'pole', name: '物干し竿',         x0: 48,   x1: 220,  y: -210, bonus: 0 },
  { id: 'A2', kind: 'pole', name: 'となり部屋の竿',   x0: 262,  x1: 460,  y: -210, bonus: 20 },
  { id: 'A3', kind: 'pole', name: '2階の物干し竿',    x0: 48,   x1: 220,  y: -450, bonus: 30 },
  { id: 'A4', kind: 'pole', name: '2階のとなりの竿',  x0: 262,  x1: 460,  y: -450, bonus: 50 },
  { id: 'A5', kind: 'pole', name: '3階の物干し竿',    x0: 48,   x1: 220,  y: -690, bonus: 80 },
  { id: 'B1', kind: 'pole', name: '隣の家のベランダ', x0: -790, x1: -612, y: -470, bonus: 60 },
  { id: 'B2', kind: 'bar',  name: '窓の突っ張り棒',   x0: -694, x1: -616, y: -238, bonus: 80 },
  { id: 'HK', kind: 'hook', name: '細いフック',       x0: -565, x1: -553, y: -318, bonus: 120 },
];
// 電線（掛けたら×）
function wirePts(ax, ay, bx, by, sag, n = 12) {
  const p = [];
  for (let i = 0; i <= n; i++) { const k = i / n; p.push({ x: ax + (bx - ax) * k, y: ay + (by - ay) * k + sag * 4 * k * (1 - k) }); }
  return p;
}
const WIRES = [
  { id: 'W1', pts: wirePts(-322, -655, 0, -775, 34) },
  { id: 'W2', pts: wirePts(-338, -655, -560, -566, 22) },
  { id: 'W3', pts: wirePts(-322, -612, 0, -712, 26) },
];
const CATCHABLE = [
  ...RODS.map(r => ({ ...r, segs: [[{ x: r.x0, y: r.y }, { x: r.x1, y: r.y }]], wob: 0 })),
  ...WIRES.map(w => ({ id: w.id, kind: 'wire', name: '電線', bonus: 0, wob: 0, segs: w.pts.slice(1).map((p, i) => [w.pts[i], p]) })),
];
const rodById = id => CATCHABLE.find(r => r.id === id);

// 投げる場所（立ち位置 px）
const SPOTS = {
  A1n: { rod: 'A1', px: -95 },  A1m: { rod: 'A1', px: -230 }, A2: { rod: 'A2', px: -60 },
  A3:  { rod: 'A3', px: -110 }, A4:  { rod: 'A4', px: -40 },  A5: { rod: 'A5', px: -150 },
  B1:  { rod: 'B1', px: -380 }, B1f: { rod: 'B1', px: -250 }, B2: { rod: 'B2', px: -340 },
  HK:  { rod: 'HK', px: -330 },
};
// n本目（0始まり）の難しさ
function makePlan() {
  const tier2 = shuffle(['A3', 'A2', 'B1']);
  const tier3 = shuffle(['A4', 'A5', 'B2', 'HK', 'B1f']);
  const order = ['A1n', 'A1m', ...tier2, ...tier3];
  return order.map((key, n) => {
    const s = SPOTS[key];
    const jit = n < 2 ? 0 : rand(-25, 25);
    const windMax = n === 0 ? 0 : n === 1 ? 0.6 : n < 5 ? 1.4 : 1.6 + (n - 5) * 0.35;
    let wind = n === 0 ? 0 : rand(windMax * 0.35, windMax) * (Math.random() < 0.5 ? -1 : 1);
    wind = Math.round(wind * 10) / 10;
    return {
      key, rod: s.rod, px: s.px + jit, wind,
      win: (n < 2 ? 62 : n < 5 ? 52 : 44 - (n - 5) * 1.5) * Math.PI / 180,   // ハンガーの傾きの許容
      desc: (n < 2 ? 3 : n < 5 ? 9 : 14) * Math.PI / 180,                   // 落ちてくる角度（下向き）の最低
      vcap: n < 2 ? 19 : n < 5 ? 17 : 15.5,                                 // 速すぎると弾かれる
      spin: 1 + n * 0.08,
      dots: n < 2 ? 0.34 : n < 5 ? 0.28 : 0.23,                             // 予測点線を見せる時間（秒）
    };
  });
}

/* ---------- ハンガーの形（ローカル座標。カギの内側の中心が (0,-22)） ---------- */
const HOOK = { x: 0, y: -22 };
const COLORS = [
  { kind: 'wire', c: '#aeb8bf', hi: '#eef2f4', w: 2.4 },
  { kind: 'plastic', c: '#e98a96', hi: '#f8c9cf', w: 4.6 },
  { kind: 'plastic', c: '#69b2d6', hi: '#bfe2f2', w: 4.6 },
  { kind: 'plastic', c: '#f0c04c', hi: '#fae3a2', w: 4.6 },
  { kind: 'plastic', c: '#79c296', hi: '#c6ead3', w: 4.6 },
  { kind: 'wire', c: '#c99a52', hi: '#f1d7a8', w: 2.4 },
  { kind: 'plastic', c: '#f2efe6', hi: '#ffffff', w: 4.6, edge: '#bdb7a8' },
];
const CAT_GROUND = 0x0002, CAT_HANGER = 0x0004;
function makeHangerBody(x, y) {
  const opt = { collisionFilter: { category: CAT_HANGER, mask: CAT_GROUND }, friction: 0.6, restitution: 0.15, density: 0.002 };
  const sh = (ax, ay, bx, by, t) => Bodies.rectangle((ax + bx) / 2, (ay + by) / 2, Math.hypot(bx - ax, by - ay), t, { ...opt, angle: Math.atan2(by - ay, bx - ax) });
  const parts = [
    Bodies.rectangle(0, 12, 52, 4, opt),
    sh(-26, 12, 0, -9, 4), sh(26, 12, 0, -9, 4),
    Bodies.rectangle(4, -16, 4, 14, opt),
  ];
  const b = Body.create({ parts, ...opt, frictionAir: 0 });
  const com = { x: b.position.x, y: b.position.y };
  Body.setPosition(b, { x, y });
  return { body: b, com, hookLocal: { x: HOOK.x - com.x, y: HOOK.y - com.y } };
}
function hookPoint(h) {
  const b = h.body, c = Math.cos(b.angle), s = Math.sin(b.angle);
  return { x: b.position.x + h.hookLocal.x * c - h.hookLocal.y * s, y: b.position.y + h.hookLocal.x * s + h.hookLocal.y * c };
}

/* ---------- 物理の世界 ---------- */
function makeWorld() {
  const engine = Engine.create({ positionIterations: 8, velocityIterations: 6, constraintIterations: 4 });
  engine.gravity.y = GRAV;
  const ground = Bodies.rectangle(0, 200, 8000, 400, { isStatic: true, friction: 0.9, collisionFilter: { category: CAT_GROUND, mask: 0xffff } });
  Composite.add(engine.world, ground);
  return { engine, hangers: [] };
}

// 飛んでいるハンガー1本を進める（本番とシミュレーション共通）
function stepFlight(w, h, plan) {
  const b = h.body;
  const prev = h.prevHook || hookPoint(h);
  // 風
  b.force.x += b.mass * (plan.wind * WIND_K / 3600) / DT2;
  // 回転: 投げた勢いで回り、だんだん起き上がる
  let av = b.angularVelocity * (h.bounced ? 0.97 : 0.955);
  if (Math.abs(av) < 0.09) av += -0.006 * wrap(b.angle) - 0.03 * av;
  Body.setAngularVelocity(b, av);
  const vBefore = { x: b.velocity.x, y: b.velocity.y };
  Engine.update(w.engine, 1000 / 60);
  h.age++;
  const cur = hookPoint(h);
  h.prevHook = cur;
  // カギが何かを上から通り過ぎたか
  for (const r of CATCHABLE) {
    for (const [p, q] of r.segs) {
      const tol = r.kind === 'hook' ? 8 : 6;
      if (cur.x < p.x - tol || cur.x > q.x + tol) continue;
      const k = clamp((cur.x - p.x) / ((q.x - p.x) || 1), 0, 1);
      const ly = p.y + (q.y - p.y) * k;
      if (!(prev.y < ly - 0.5 && cur.y >= ly - 1)) continue;
      if (h.lastRod === r && h.age - h.lastRodAge < 6) continue;
      h.lastRod = r; h.lastRodAge = h.age;
      const v = vBefore, sp = Math.hypot(v.x, v.y);
      const descend = Math.atan2(v.y, Math.abs(v.x));
      const tilt = Math.abs(wrap(b.angle));
      const ok = tilt < plan.win && descend > plan.desc && sp < plan.vcap;
      const why = tilt >= plan.win ? 'angle' : descend <= plan.desc ? 'flat' : sp >= plan.vcap ? 'fast' : '';
      return ok ? { type: 'catch', rod: r, x: clamp(cur.x, p.x + 2, q.x - 2), y: ly, v, why } : { type: 'bounce', rod: r, x: cur.x, y: ly, v, why };
    }
  }
  if (b.bounds.max.y > -1.5 || h.age > 330 || Math.abs(b.position.x - h.startX) > 1600 || b.position.y < -2400) return { type: 'miss' };
  return null;
}
function doBounce(h, ev) {
  const b = h.body, v = ev.v;
  Body.setVelocity(b, { x: v.x * 0.55 + rand(-0.6, 0.6), y: -Math.abs(v.y) * 0.32 - 0.8 });
  Body.setAngularVelocity(b, b.angularVelocity + rand(0.18, 0.32) * (Math.random() < 0.5 ? -1 : 1));
  h.bounced = true;
}
function doCatch(w, h, ev) {
  // 竿に掛かったら、カギを支点にした振り子として自前で揺らす
  const b = h.body, v = ev.v;
  const pin = { x: ev.x, y: ev.y };
  const hp = hookPoint(h);
  Body.translate(b, { x: pin.x - hp.x, y: pin.y - hp.y });
  const r = { x: b.position.x - pin.x, y: b.position.y - pin.y };
  const r2 = r.x * r.x + r.y * r.y || 1;
  const wv = (r.x * v.y - r.y * v.x) / r2;
  b.collisionFilter.mask = 0; for (const p of b.parts) p.collisionFilter.mask = 0;
  Body.setStatic(b, true);
  h.hung = true; h.rod = ev.rod; h.pin = pin;
  h.pend = { th: b.angle, w: clamp(wv * 0.8 + b.angularVelocity * 0.3, -0.11, 0.11) };
}
function stepHung(w) {
  for (const h of w.hangers) {
    if (!h.hung) continue;
    const pd = h.pend, b = h.body;
    const c = Math.cos(pd.th), s = Math.sin(pd.th);
    const rx = -(h.hookLocal.x * c - h.hookLocal.y * s);
    const L2 = h.hookLocal.x ** 2 + h.hookLocal.y ** 2;
    const gust = (wind || 0) * 0.00016 * (1 + Math.sin(t * 1.3 + b.id * 1.7) * 0.8);
    pd.w += ACC * rx / (L2 + 160) + gust;
    pd.w *= 0.986;
    pd.th += pd.w;
    // 起き上がりきったら角度は -π..π に
    pd.th = wrap(pd.th);
    const c2 = Math.cos(pd.th), s2 = Math.sin(pd.th);
    Body.setAngle(b, pd.th);

function drawHangerShape(color, alpha = 1) {

  ctx.fillStyle = '#3a2c25'; ctx.beginPath(); ctx.arc(x - f * 1, -150, 13.5, Math.PI * (f > 0 ? 0.95 : 0.05), Math.PI * (f > 0 ? 2.15 : -1.15), f < 0); ctx.fill();
  ctx.fillStyle = '#3a2c25'; ctx.beginPath(); ctx.arc(x + f * 8, -146, 1.6, 0, Math.PI * 2); ctx.fill();

function drawInfo() {

function render() {

/* ---------- 音 ---------- */
let ac = null, noiseBuf = null;
function wakeAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = ac.sampleRate * 0.5; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch {}
}
function tone(freq, at, dur, vol, type = 'sine') {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g).connect(ac.destination); o.start(at); o.stop(at + dur + 0.02);
}
function whoosh(p) {
  try {
    if (!ac) return;
    const n0 = ac.currentTime, src = ac.createBufferSource(); src.buffer = noiseBuf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(500, n0); bp.frequency.exponentialRampToValueAtTime(1400 + p * 1200, n0 + 0.22);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, n0); g.gain.exponentialRampToValueAtTime(0.18 * (0.4 + p), n0 + 0.06); g.gain.exponentialRampToValueAtTime(0.001, n0 + 0.3);
    src.connect(bp).connect(g).connect(ac.destination); src.start(n0); src.stop(n0 + 0.32);
  } catch {}
}
function clank() { try { if (!ac) return; const n0 = ac.currentTime; tone(1150, n0, 0.08, 0.08, 'square'); tone(760, n0 + 0.01, 0.12, 0.06, 'triangle'); } catch {} }
function tick() { try { if (!ac) return; tone(1500, ac.currentTime, 0.05, 0.06, 'triangle'); } catch {} }
function chime(kind, k = 1) {
  try {
    if (!ac) return;
    const n0 = ac.currentTime;
    if (kind === 'catch') { const up = Math.pow(2, Math.min(k - 1, 6) / 12); tone(1568 * up, n0, 0.22, 0.12, 'triangle'); tone(2349 * up, n0 + 0.06, 0.35, 0.09, 'triangle'); tone(3136 * up, n0 + 0.12, 0.3, 0.05); }
    else if (kind === 'wire') { tone(220, n0, 0.25, 0.16, 'sawtooth'); tone(233, n0 + 0.02, 0.25, 0.1, 'sawtooth'); }
    else { tone(190, n0, 0.18, 0.18, 'triangle'); tone(130, n0 + 0.08, 0.25, 0.14, 'triangle'); }
  } catch {}
}

/* ---------- ループ ---------- */
let acc = 0, lastTs = performance.now();
function frame(ts) {
  acc += Math.min(100, ts - lastTs); lastTs = ts;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  camStep(state === 'over' ? 0.05 : 0.12);
  render();
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function start() {
  wakeAudio(); state = 'play'; newGame();
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
}
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play') return;
  if (phase === 'after') { if (phaseT < 0.3) return; nextThrow(); if (state !== 'play') return; }
  if (phase !== 'aim') return;
  try { cvs.setPointerCapture(e.pointerId); } catch {}
  drag = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId };
  kb = null; maxHit = false;
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY;
  const a = aimVec();
  if (a && a.p >= 0.995 && !maxHit) { maxHit = true; tick(); if (navigator.vibrate) try { navigator.vibrate(8); } catch {} }
  if (a && a.p < 0.97) maxHit = false;
});
window.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) release(); });
window.addEventListener('pointercancel', () => { drag = null; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
// タイトル・結果: ボタンやリンク以外ならどこを押しても開始
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a')) return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
window.addEventListener('keydown', e => {
  if (state === 'play') {
    const arrows = { ArrowLeft: [5, 0], ArrowRight: [-5, 0], ArrowUp: [0, 0.04], ArrowDown: [0, -0.04] };
    if (arrows[e.code]) {
      e.preventDefault();
      if (phase === 'after' && phaseT > 0.3) nextThrow();
      if (phase !== 'aim' || state !== 'play') return;
      if (!kb) kb = { ang: 58, pow: 0.55 };
      const [da, dp] = arrows[e.code], f = facing();
      kb.ang = clamp(kb.ang + da * f, 5, 89); kb.pow = clamp(kb.pow + dp, 0.1, 1);
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault(); wakeAudio();
      if (e.repeat) return;
      if (phase === 'after' && phaseT > 0.3) { nextThrow(); return; }
      if (phase === 'aim') {
        if (!kb) { kb = { ang: 58, pow: 0.55 }; return; }
        const a = aimVec(); kb = null; if (a) launch(a);
      }
    }
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a')) return;   // 他のボタンはそのまま
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText()} 最高${rec.best}点 ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try {
    navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback);
  } catch { fallback(); }
});

/* ---------- 調整用（#debug のときだけ） ---------- */
if (location.hash === '#debug') {
  window.__hanger = {
    info: () => ({ state, phase, n, hung, score, streak, rod: cur && cur.rod, px: cur && cur.px, wind: cur && cur.wind, key: cur && cur.key, ang: world && world.hangers.length ? +world.hangers[world.hangers.length - 1].body.angle.toFixed(2) : null, av: world && world.hangers.length ? +world.hangers[world.hangers.length - 1].body.angularVelocity.toFixed(3) : null }),
    // 投げずに結果だけを計算する（難しさの調整用）
    sim(key, vx, vy, nIdx = 0, px = null, wind = 0) {
      const p = { ...makePlan()[nIdx], ...(key ? { rod: SPOTS[key].rod, px: px ?? SPOTS[key].px } : {}), wind };
      const keep = { cur, held }; cur = p;
      const w = makeWorld(), sp = startPos({ pullX: -vx / VMAX, pullY: -vy / VMAX });
      const h = makeHangerBody(0, 0);
      const hp0 = { x: sp.x + HOOK.x, y: sp.y + HOOK.y };
      Body.setPosition(h.body, { x: hp0.x - h.hookLocal.x, y: hp0.y - h.hookLocal.y });
      Composite.add(w.engine.world, h.body); Body.setVelocity(h.body, { x: vx, y: vy });
      Body.setAngularVelocity(h.body, Math.sign(vx || 1) * (0.1 + Math.hypot(vx, vy) * 0.011) * p.spin);
      Object.assign(h, { age: 0, startX: hp0.x, prevHook: null, bounced: false });
      let ev = null, bounces = 0; const log = [];
      for (let i = 0; i < 400 && !ev; i++) { ev = stepFlight(w, h, p); if (ev && ev.type === 'bounce') { doBounce(h, ev); bounces++; log.push(ev.rod.id + ':' + ev.why); ev = null; } }
      cur = keep.cur; held = keep.held;
      return { type: ev ? ev.type : 'none', rod: ev && ev.rod ? ev.rod.id : null, bounces, log };
    },
    plan: () => plan,
  };
}

// タイトル背景: 最初の1投目の構え
setupWorld();
plan = makePlan(); n = 0; hung = 0; score = 0; streak = 0; t = 0; windShown = 0; phase = 'aim'; phaseT = 0;
cur = plan[0]; held = newHeld(); wind = 0; camTarget = frameThrow(cur);
fillTitle();
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
})();
</script>
