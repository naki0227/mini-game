<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 WebGL（夜の部屋）+ 2D の演出レイヤー + HUD + 下の調整つまみ。タイトル/結果は中央のカード1枚 */
:root {
  --night: #1b1a20;      /* 夜の部屋 */
  --lamp: #e9a253;       /* スタンドライトの灯り */
  --ink: #221f24;
  --paper: #f6f0e4;      /* 白いシャツ */
  --noren: #2f4256;      /* 夜の藍 */
  --noren-ink: #f5efe2;
  --accent: #d9622f;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#gl, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { touch-action: none; cursor: grab; }
#fx:active { cursor: grabbing; }

.hud {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--noren); color: var(--noren-ink);
  border-radius: 6px; padding: 6px 12px 7px;
  font-variant-numeric: tabular-nums; line-height: 1.1;
  box-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.pill .lab { font-size: 11px; letter-spacing: .12em; opacity: .75; display: block; }
.pill .val { font-family: var(--font-display); font-size: 26px; }
.pill .unit { font-size: 13px; margin-left: 2px; }
.pill.right { margin-left: auto; text-align: right; background: var(--paper); color: var(--ink); }
.pill.right .val { font-size: 20px; }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  background: rgba(20, 18, 24, .38);
  touch-action: none; cursor: pointer;
}
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);
  border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45);
  text-align: center; cursor: default;
}
.noren {
  background: var(--noren); color: var(--noren-ink);
  display: flex; gap: 3px;
  padding-top: 18px;
}
.noren span {
  flex: 1; background: var(--noren); border-bottom: 3px solid rgba(255,255,255,.08);
  font-family: var(--font-display); font-size: 30px; line-height: 1; padding-block: 6px 16px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2);
}
.noren.result span { font-size: 30px; }
.noren span.w { flex: 3.2; }
.body { padding: 20px 22px 22px; display: grid; gap: 14px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }
.score { font-family: var(--font-display); font-size: 60px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 22px; margin-left: 4px; }
.meta { display: flex; justify-content: center; gap: 6px 18px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meta b { font-size: 16px; }
.badge {
  justify-self: center; background: var(--accent); color: #fff; font-weight: 700;
  font-size: 12px; letter-spacing: .14em; padding: 3px 10px; border-radius: 99px;
}
.btns { display: grid; gap: 8px; }
button {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 8px;
  padding: 13px 16px; cursor: pointer;
  background: var(--noren); color: var(--noren-ink); box-shadow: 0 3px 0 #18222d;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #18222d; }
button:disabled { opacity: .6; cursor: progress; }
a.xbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  font-weight: 700; font-size: 16px; border-radius: 8px; padding: 13px 16px;
  background: #0f1419; color: #fff; box-shadow: 0 3px 0 #000;
}
a.xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
a.xbtn:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
a.xbtn svg { width: 16px; height: 16px; fill: currentColor; }
button.sub { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
.how { font-size: 12px; opacity: .7; margin: 0; }
.err { font-size: 13px; color: #b3361b; margin: 0; font-weight: 700; }
.back { font-size: 13px; color: var(--ink); opacity: .75; }
.back:hover { opacity: 1; }

        <button class="sub" id="copyBtn">結果をコピー</button>
      </div>

</div>

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';
let THREE, RAPIER;
try {
  const [t, r] = await Promise.all([import(THREE_URL), import(RAPIER_URL)]);
  THREE = t; RAPIER = r.default;
  await RAPIER.init();
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D/物理エンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');

/* ---------- 記録（このブラウザだけ）: 少ないほど良い ---------- */
const KEY = 'catch:v1';
const DEF = { ver: 2, best: 0, wins: 0, throws: 0, winThrows: 0, plays: 0 };
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY) || '{}'); if (d && d.ver === 2) return Object.assign({ ...DEF }, d); } catch {}
  return { ...DEF };   // 古い形式（10本勝負のころ）は使わない
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch {} }
let rec = load(); save();
const avgOf = r => r.wins ? r.winThrows / r.wins : 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);
// 投げるときのブレ用の乱数（#seed=数字 で固定できる）
const HASH = new URLSearchParams(location.hash.slice(1));
let seed = HASH.has('seed') ? (+HASH.get('seed') >>> 0) : (Math.random() * 2 ** 32) >>> 0;
function rng() { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function gauss(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }

/* ---------- ベクトル・クォータニオン（物理側は three に頼らない） ---------- */
const qaxis = (ax, ay, az, ang) => { const s = Math.sin(ang / 2); return { x: ax * s, y: ay * s, z: az * s, w: Math.cos(ang / 2) }; };
function qFromTo(u, v) {
  const d = u.x * v.x + u.y * v.y + u.z * v.z;
  if (d < -0.99999) return { x: 1, y: 0, z: 0, w: 0 };
  const q = { x: u.y * v.z - u.z * v.y, y: u.z * v.x - u.x * v.z, z: u.x * v.y - u.y * v.x, w: 1 + d };
  const n = Math.hypot(q.x, q.y, q.z, q.w); return { x: q.x / n, y: q.y / n, z: q.z / n, w: q.w / n };
}
function qrot(q, v) {
  const { x, y, z, w } = q;
  const ix = w * v.x + y * v.z - z * v.y, iy = w * v.y + z * v.x - x * v.z, iz = w * v.z + x * v.y - y * v.x, iw = -x * v.x - y * v.y - z * v.z;
  return { x: ix * w + iw * -x + iy * -z - iz * -y, y: iy * w + iw * -y + iz * -x - ix * -z, z: iz * w + iw * -z + ix * -y - iy * -x };
}

/* ---------- 針金ハンガーの形（ローカル: 面 = y-z、カギは +z 側へ巻く。原点 = 下の棒の中央） ---------- */
const HG = { W: 0.2, NECK: 0.15, SHAFT: 0.08, CR: 0.032, TIP: 0.85, WR: 0.004 };
function hangerPts() {
  const { W, NECK, SHAFT, CR, TIP } = HG, top = NECK + SHAFT;
  const hook = [], N = 10;
  for (let i = N; i >= 0; i--) { const f = (Math.PI + TIP) * i / N; hook.push({ x: 0, y: top + CR * Math.sin(f), z: CR - CR * Math.cos(f) }); }
  hook.push({ x: 0, y: NECK, z: 0 });
  const body = [{ x: 0, y: NECK, z: 0 }, { x: 0, y: 0.012, z: -W }, { x: 0, y: 0, z: -W + 0.02 }, { x: 0, y: 0, z: W - 0.02 }, { x: 0, y: 0.012, z: W }, { x: 0, y: NECK, z: 0 }];
  return { hook, body, curlC: { x: 0, y: top, z: CR } };
}
const HP = hangerPts();

const qmul = (a, b) => ({ w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z, x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y, y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x, z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w });

/* ---------- 部屋とクローゼットのラック（m。y=上、+z=手前のカメラ側） ---------- */
const ROOM = { x0: -3, x1: 3, z0: -5, z1: 1.9, h: 2.5 };
const BAR = { x: 0, y: 1.52, z: 0, len: 1.7, r: 0.0125 };
const GAP = { x: 0, w: 0.17 };                 // 服のすき間（ここだけ空いている）
const CLOTHES = (() => {
  const out = []; let s = 11; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const cols = ['#d9d2c3', '#5d7a9a', '#b5523b', '#e6c36a', '#3e4a3f', '#c98d9a', '#8aa6a0', '#f1ece2', '#6b4f3a', '#2f3d55', '#9a7bb0', '#c7b28a'];
  for (const side of [-1, 1]) {
    let x = GAP.w / 2;
    while (x < BAR.len / 2 - 0.06) {
      const th = 0.045 + rnd() * 0.04, h = 0.5 + rnd() * 0.42, d = 0.36 + rnd() * 0.1;
      out.push({ x: GAP.x + side * (x + th / 2), th, h, d, c: cols[Math.floor(rnd() * cols.length)] });
      x += th + 0.004 + rnd() * 0.01;
    }
  }
  return out;
})();
const THR = { x: 0, z: -2.6 };
const RELEASE = { x: 0, y: 1.28, z: -2.3 };
const DIST = Math.hypot(BAR.z - RELEASE.z, 0);
// 投げ方: 強さと回転は毎回同じ。上下の角度と左右の向きはプレイヤーが引いて決める
const SPIN = 0;                                   // rad/s（前回り）
const V0 = 6.4;                                   // 初速 m/s（固定）
const PITCH_MIN = 0, PITCH_MAX = 36;              // 下へ引いた量で決まる角度（度）
const YAW_MAX = 0.25;                             // 左右いっぱいに引いたときの向き（rad）
// 人間らしいブレ（標準偏差）: 持ち手の傾き・回転の位相・わずかな速さと向き
const JIT = { yaw: 0.008, v: 0.1, pitch: 0.008, tilt: 0.12, roll: 0.05, spin: 1.6 };
function jitterOf(r) { return { yaw: gauss(r) * JIT.yaw, v: gauss(r) * JIT.v, pitch: gauss(r) * JIT.pitch, tilt: gauss(r) * JIT.tilt, roll: gauss(r) * JIT.roll, spin: gauss(r) * JIT.spin }; }
const NOJIT = { yaw: 0, v: 0, pitch: 0, tilt: 0, roll: 0, spin: 0 };

/* ---------- 物理の世界 ---------- */
const PDT = 1 / 240;
const MAT = { f: 0.45, e: 0.05, d: 2500 };
function fixedBox(w, hx, hy, hz, x, y, z, f = 0.6, e = 0.15) {
  const b = w.createRigidBody(RAPIER.RigidBodyDesc.fixed());
  w.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setFriction(f).setRestitution(e), b);
}
function fixedCyl(w, ax, len, r, x, y, z, f = 0.5, e = 0.1) {
  const q = ax === 'x' ? qaxis(0, 0, 1, Math.PI / 2) : ax === 'z' ? qaxis(1, 0, 0, Math.PI / 2) : { x: 0, y: 0, z: 0, w: 1 };
  const b = w.createRigidBody(RAPIER.RigidBodyDesc.fixed());
  w.createCollider(RAPIER.ColliderDesc.cylinder(len / 2, r).setTranslation(x, y, z).setRotation(q).setFriction(f).setRestitution(e), b);
}
function buildStatic(w) {
  fixedBox(w, 4, 0.1, 5, 0, -0.1, -1.5, 0.6, 0.18);
  fixedBox(w, 0.1, 2, 5, ROOM.x0 - 0.1, 1.25, -1.5);
  fixedBox(w, 0.1, 2, 5, ROOM.x1 + 0.1, 1.25, -1.5);
  fixedBox(w, 4, 2, 0.1, 0, 1.25, ROOM.z0 - 0.1);
  fixedBox(w, 4, 2, 0.1, 0, 1.25, ROOM.z1 + 0.1);
  fixedBox(w, 4, 0.1, 5, 0, ROOM.h + 0.1, -1.5);
  fixedBox(w, 1.0, 0.22, 0.42, 0, 0.22, -4.55);            // ソファ
  // ラック: 竿・柱・足
  fixedCyl(w, 'x', BAR.len, BAR.r, BAR.x, BAR.y, BAR.z);
  for (const s of [-1, 1]) {
    fixedCyl(w, 'y', BAR.y + 0.03, 0.015, BAR.x + s * (BAR.len / 2 + 0.016), (BAR.y + 0.03) / 2, BAR.z);
    fixedCyl(w, 'z', 0.55, 0.015, BAR.x + s * (BAR.len / 2 + 0.016), 0.03, BAR.z);
  }
  // 掛かっている服（竿の少し下から垂れている。すき間以外はふさがっている）
  for (const c of CLOTHES) fixedBox(w, c.th / 2, c.h / 2, c.d / 2, c.x, BAR.y - 0.035 - c.h / 2, BAR.z, 0.9, 0.02);
}
function makeWorld() {
  const w = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
  w.timestep = PDT;
  w.integrationParameters.maxCcdSubsteps = 4;
  buildStatic(w);
  return w;
}
function addSegs(w, body, pts, r) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], d = { x: b.x - a.x, y: b.y - a.y, z: b.z - a.z }, L = Math.hypot(d.x, d.y, d.z);
    if (L < 1e-4) continue;
    const q = qFromTo({ x: 0, y: 1, z: 0 }, { x: d.x / L, y: d.y / L, z: d.z / L });
    w.createCollider(RAPIER.ColliderDesc.capsule(L / 2, r).setTranslation((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2).setRotation(q)
      .setFriction(MAT.f).setRestitution(MAT.e).setDensity(MAT.d), body);
  }
}
// a = { pitch: rad, yaw: rad }、j = ブレ
function throwVectors(a, j = NOJIT) {
  const yaw = a.yaw + j.yaw, pitch = a.pitch + j.pitch, v = V0 + j.v;
  const dir = { x: Math.sin(yaw) * Math.cos(pitch), y: Math.sin(pitch), z: Math.cos(yaw) * Math.cos(pitch) };
  const rot = qmul(qmul(qaxis(0, 1, 0, yaw), qaxis(1, 0, 0, j.tilt)), qaxis(0, 0, 1, j.roll));
  const ax = qrot(rot, { x: 1, y: 0, z: 0 });
  const s = SPIN + j.spin;
  return { from: { ...RELEASE }, rot, lin: { x: dir.x * v, y: dir.y * v, z: dir.z * v }, ang: { x: ax.x * s, y: ax.y * s, z: ax.z * s } };
}
function spawnHanger(w, a, j) {
  const tv = throwVectors(a, j);
  const d = RAPIER.RigidBodyDesc.dynamic().setTranslation(tv.from.x, tv.from.y, tv.from.z).setRotation(tv.rot)
    .setLinvel(tv.lin.x, tv.lin.y, tv.lin.z).setAngvel(tv.ang).setCcdEnabled(true).setAngularDamping(0.05).setLinearDamping(0.02);
  const b = w.createRigidBody(d);
  addSegs(w, b, HP.hook, HG.WR); addSegs(w, b, HP.body, HG.WR);
  return b;
}

  $('oScore').textContent = n;
  $('oMsg').textContent = n === 1 ? '一発でかかった！' : n >= 30 ? 'でついにかかった！' : 'でかかった！';
  $('oBest').textContent = rec.best; $('oWins').textContent = rec.wins; $('oAvg').textContent = avgOf(rec).toFixed(1);
  $('newRec').hidden = !isNew;
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({ text: `${shareText()}${isNew && rec.wins > 1 ? ' 自己ベスト！' : ''}\n`, url: gameUrl(), hashtags: 'ハンガーキャッチ' });
  $('copyMsg').textContent = '画面タップ・スペースでもう一回';
  $('over').hidden = false; $('hud').hidden = true;
  overShownAt = performance.now();
  showHeld(false);
  $('retryBtn').focus({ preventScroll: true });
}
const shareText = () => `🙌ハンガーキャッチ ${n}回目でかかった！${n === 1 ? '一発！' : ''}（最少 ${rec.best}回）`;

/* ---------- シェア ---------- */
// 公開先のURL。ローカルで開いたときもこれをシェアする
const PUBLIC_URL = 'https://asobi.enludus.com/games/catch/';
function gameUrl() {
  try {
    if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost') return location.origin + location.pathname;
  } catch {}
  return PUBLIC_URL;
}

/* ---------- HUD ---------- */
function updateHud() { $('hBest').textContent = rec.best ? `${rec.best}回` : '—'; }
function fillTitle() { $('tBest').textContent = rec.best || '—'; $('tWins').textContent = rec.wins; $('tAvg').textContent = rec.wins ? avgOf(rec).toFixed(1) : '—'; }

/* ---------- 音 ---------- */
let ac = null, master = null, noiseBuf = null;
function wakeAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createDynamicsCompressor(); master.threshold.value = -14; master.ratio.value = 6; master.connect(ac.destination);
      const len = ac.sampleRate * 1.2; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch {}
}
const live = () => ac && state === 'play';
function tone(freq, at, dur, vol, type = 'sine', dest = master) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(dest); o.start(at); o.stop(at + dur + 0.02);
}
function noise(at, dur, vol, type, freq, q = 1, dest = master) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(g).connect(dest); s.start(at, Math.random() * 0.5); s.stop(at + dur + 0.02);
  return { f, g };
}
function sWhoosh(pan, p) {
  try {
    if (!live()) return;
    const n0 = ac.currentTime, { f } = noise(n0, 0.3, 0.12 + p * 0.1, 'bandpass', 500, 1.2);
    f.frequency.exponentialRampToValueAtTime(1600 + p * 1200, n0 + 0.25);
  } catch {}
}
function sClank(k) {
  try {
    if (!live()) return;
    const n0 = ac.currentTime, v = 0.03 + k * 0.08;
    tone(1850 * rand(0.95, 1.05), n0, 0.09, v, 'triangle'); tone(2960 * rand(0.95, 1.05), n0, 0.14, v * 0.6); tone(4100, n0, 0.08, v * 0.3);
    noise(n0, 0.03, v * 0.8, 'highpass', 3000);
  } catch {}
}
function sKashan(k) {
  try {
    if (!live()) return;
    const n0 = ac.currentTime, v = 0.05 + k * 0.12;
    for (const [dt, a] of [[0, 1], [0.07, 0.55], [0.13, 0.35]]) {
      noise(n0 + dt, 0.12, v * a, 'highpass', 2200);
      for (const fr of [2350, 3720, 5180]) tone(fr * rand(0.96, 1.04), n0 + dt, 0.22, v * a * 0.25, 'sine');
    }
  } catch {}
}
function sHook() {
  try { if (!live()) return; const n0 = ac.currentTime; tone(2400, n0, 0.04, 0.12, 'square'); tone(1200, n0, 0.12, 0.1, 'triangle'); tone(420, n0, 0.16, 0.12); } catch {}
}
// 歓声: のこぎり波の「声」をたくさん重ねて、母音「あ」のフォルマントに通す
function sCheer(level) {
  try {
    if (!live()) return;
    const n0 = ac.currentTime + 0.02, dur = 0.8 + level * 0.8;
    const out = ac.createGain(); out.gain.value = 0.55 + level * 0.5; out.connect(master);
    const bus = ac.createGain();
    for (const [fa, fb, q, gv] of [[420, 820, 5, 1], [800, 1250, 6, 0.7], [2300, 2700, 8, 0.22]]) {
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
      bp.frequency.setValueAtTime(fa, n0); bp.frequency.linearRampToValueAtTime(fb, n0 + 0.16);
      const gg = ac.createGain(); gg.gain.value = gv; bus.connect(bp).connect(gg).connect(out);
    }
    const voices = Math.round(6 + level * 10);
    for (let i = 0; i < voices; i++) {
      const o = ac.createOscillator(); o.type = 'sawtooth';
      const f0 = Math.random() < 0.5 ? rand(140, 230) : rand(250, 420), st = n0 + rand(0, 0.14);
      o.frequency.setValueAtTime(f0 * 0.82, st); o.frequency.exponentialRampToValueAtTime(f0 * 1.08, st + 0.22); o.frequency.exponentialRampToValueAtTime(f0 * 0.9, st + dur);
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = rand(4.5, 7.5); lg.gain.value = f0 * 0.03; lfo.connect(lg).connect(o.frequency);
      const g = ac.createGain(), v = 0.12 / Math.sqrt(voices);
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(v, st + 0.08); g.gain.setValueAtTime(v, st + dur * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, st + dur + rand(0.1, 0.4));
      o.connect(g).connect(bus); o.start(st); lfo.start(st); o.stop(st + dur + 0.5); lfo.stop(st + dur + 0.5);
    }
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const nb = ac.createBiquadFilter(); nb.type = 'bandpass'; nb.frequency.value = 1500; nb.Q.value = 0.7;
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.0001, n0); ng.gain.exponentialRampToValueAtTime(0.06 + level * 0.08, n0 + 0.1); ng.gain.exponentialRampToValueAtTime(0.0001, n0 + dur + 0.5);
    s.connect(nb).connect(ng).connect(out); s.start(n0); s.stop(n0 + dur + 0.6);
    const claps = Math.round(4 + level * 14);
    for (let i = 0; i < claps; i++) noise(n0 + 0.25 + rand(0, dur), 0.035, 0.12, 'highpass', 1100);
  } catch {}
}
function sGroan() {
  try {
    if (!live()) return;
    const n0 = ac.currentTime + 0.02;
    const out = ac.createGain(); out.gain.value = 0.5; out.connect(master);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4; bp.frequency.setValueAtTime(750, n0); bp.frequency.linearRampToValueAtTime(480, n0 + 0.6);
    bp.connect(out);
    for (let i = 0; i < 5; i++) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; const f0 = rand(150, 300), st = n0 + rand(0, 0.08);
      o.frequency.setValueAtTime(f0, st); o.frequency.exponentialRampToValueAtTime(f0 * 0.72, st + 0.7);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.05, st + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.75);
      o.connect(g).connect(bp); o.start(st); o.stop(st + 0.8);
    }
  } catch {}
}

/* ---------- ループ ---------- */
let acc = 0, lastTs = performance.now();
function frame(ts2) {
  acc += Math.min(100, ts2 - lastTs); lastTs = ts2;
  let k = 0;
  while (acc >= 1000 / 60 && k < 4) { step(1 / 60); acc -= 1000 / 60; k++; }
  if (k >= 4) acc = 0;
  render();
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function start() {
  wakeAudio(); state = 'play'; newGame();
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
}
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play') return;
  if (phase === 'won') { if (phaseT > 1.0) showOver(); return; }
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  drag = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId }; kb = null;
});
addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id) { drag.x = e.clientX; drag.y = e.clientY; } });
addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const a = aimNow(); drag = null;
  if (!a || a.weak || state !== 'play') return;
  if (phase === 'ready') throwNow(a); else if (phase === 'fly') pending = a;   // 前の1本がまだ飛んでいたら、外れた瞬間に投げる
});
addEventListener('pointercancel', () => { drag = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
addEventListener('keydown', e => {
  if (state === 'play') {
    const keys = { ArrowLeft: ['yaw', -0.005], ArrowRight: ['yaw', 0.005], ArrowUp: ['pitch', 0.5 * DEG], ArrowDown: ['pitch', -0.5 * DEG] };
    if (keys[e.code]) {
      e.preventDefault();
      if (!kb) kb = { pitch: 15 * DEG, yaw: 0 };
      const [k, d] = keys[e.code], m = e.shiftKey ? 5 : 1;
      kb[k] += d * m;
      kb.pitch = clamp(kb.pitch, PITCH_MIN * Math.PI / 180, PITCH_MAX * Math.PI / 180); kb.yaw = clamp(kb.yaw, -YAW_MAX, YAW_MAX);
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault(); wakeAudio();
      if (e.repeat) return;
      if (phase === 'won') { if (phaseT > 1.0) showOver(); return; }
      if (!kb) { kb = { pitch: 15 * DEG, yaw: 0 }; return; }
      const a = { ...kb };
      if (phase === 'ready') throwNow(a); else if (phase === 'fly') pending = a;
    }
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText()} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const deg = d => d * Math.PI / 180;
  window.__catch = {
    info: () => ({ state, phase, n, flying: !!flying, hangers: hangers.length, seed, demo: demoAim }),
    sim: (a, jit = false) => simulate(a, jit ? jitterOf(Math.random) : NOJIT),
    // ブレなしの成功マップ: 角度(行) × 向き(列)
    map({ pitches = null, yaws = null } = {}) {
      pitches = pitches || Array.from({ length: 37 }, (_, k) => 10 + k * 0.5); yaws = yaws || Array.from({ length: 25 }, (_, k) => -0.06 + k * 0.005);
      const rows = []; let hits = 0;
      for (const d of pitches) { let line = ''; for (const y of yaws) { const r = simulate({ pitch: deg(d), yaw: y }); if (r === 'hang') hits++; line += r === 'hang' ? '#' : '.'; } rows.push(`${d.toFixed(1).padStart(4)}° ${line}`); }
      return { rows, hits, total: pitches.length * yaws.length };
    },
    // ブレありの成功率マップ（各マス N 回）
    rateMap({ pitches, yaws, N = 10 }) {
      const rows = [];
      for (const d of pitches) rows.push({ deg: d, rates: yaws.map(y => { let h = 0; for (let i = 0; i < N; i++) if (simulate({ pitch: deg(d), yaw: y }, jitterOf(Math.random)) === 'hang') h++; return h / N; }) });
      return rows;
    },
    rate(a, N = 100) { let h = 0; for (let i = 0; i < N; i++) if (simulate(a, jitterOf(Math.random)) === 'hang') h++; return h / N; },
    rateRandom(N = 300) { let h = 0; for (let i = 0; i < N; i++) { const a = { pitch: deg(rand(PITCH_MIN, PITCH_MAX)), yaw: rand(-YAW_MAX, YAW_MAX) }; if (simulate(a, jitterOf(Math.random)) === 'hang') h++; } return h / N; },
    throwWith: a => throwNow(a),
    setSeed: s => { seed = s >>> 0; },
    firstThrowWithSeed(s, a) { const keep = seed; seed = s >>> 0; const j = jitterOf(rng); seed = keep; return simulate(a, j); },
  };
}

/* ---------- はじめ ---------- */
world = makeWorld();
// デモ用に「掛かる投げ方」をひとつ見つけておく
for (let k = 0; k < 60 && !demoAim; k++) {
  const a = { pitch: (14 + k * 0.25) * DEG, yaw: 0 };
  if (simulate(a) === 'hang') demoAim = a;
}
toReady();
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = 'ハンガーを持つ';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
</body>
</html>
