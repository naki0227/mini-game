<!doctype html>

<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 WebGL（夜の部屋）+ 2D の演出レイヤー + HUD + 下の調整つまみ。タイトル/結果は中央のカード1枚 */
:root {
  --night: #1b1a20;      /* 夜の部屋 */
  --lamp: #e9a253;       /* スタンドライトの灯り */
  --ink: #221f24;
  --paper: #f6f0e4;      /* 白いシャツ */
  --noren: #2f4256;      /* 夜の藍 */
  --noren-ink: #f5efe2;
  --accent: #d9622f;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#gl, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { touch-action: none; cursor: grab; }
#fx:active { cursor: grabbing; }

.hud {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--noren); color: var(--noren-ink);
  border-radius: 6px; padding: 6px 12px 7px;
  font-variant-numeric: tabular-nums; line-height: 1.1;
  box-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.pill .lab { font-size: 11px; letter-spacing: .12em; opacity: .75; display: block; }
.pill .val { font-family: var(--font-display); font-size: 26px; }
.pill .unit { font-size: 13px; margin-left: 2px; }
.pill.right { text-align: right; background: var(--paper); color: var(--ink); }
.pill.right .val { font-size: 20px; }

/* 投げ方の調整（高さ・回転） */
.ctrl {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(20,18,24,.82), rgba(20,18,24,0));
  touch-action: none; max-width: 560px; margin-inline: auto;
}
.knob { display: grid; gap: 2px; color: var(--noren-ink); font-size: 12px; }
.knob .row { display: flex; justify-content: space-between; align-items: baseline; }
.knob b { font-family: var(--font-display); font-weight: 400; font-size: 15px; font-variant-numeric: tabular-nums; }
.knob input { width: 100%; margin: 0; height: 30px; accent-color: var(--lamp); touch-action: none; cursor: pointer; }
.knob input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; border-radius: 4px; }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  background: rgba(20, 18, 24, .38);
  touch-action: none; cursor: pointer;
}
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);
  border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45);
  text-align: center; cursor: default;
}
.noren {
  background: var(--noren); color: var(--noren-ink);
  display: flex; gap: 3px;
  padding-top: 18px;
}
.noren span {
  flex: 1; background: var(--noren); border-bottom: 3px solid rgba(255,255,255,.08);
  font-family: var(--font-display); font-size: 30px; line-height: 1; padding-block: 6px 16px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2);
}
.noren.result span { font-size: 30px; }
.noren span.w { flex: 3.2; }
.body { padding: 20px 22px 22px; display: grid; gap: 14px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }
.score { font-family: var(--font-display); font-size: 60px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 22px; margin-left: 4px; }
.meta { display: flex; justify-content: center; gap: 6px 18px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meta b { font-size: 16px; }
.badge {
  justify-self: center; background: var(--accent); color: #fff; font-weight: 700;
  font-size: 12px; letter-spacing: .14em; padding: 3px 10px; border-radius: 99px;
}
.btns { display: grid; gap: 8px; }
button {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 8px;
  padding: 13px 16px; cursor: pointer;
  background: var(--noren); color: var(--noren-ink); box-shadow: 0 3px 0 #18222d;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #18222d; }
button:disabled { opacity: .6; cursor: progress; }
a.xbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  font-weight: 700; font-size: 16px; border-radius: 8px; padding: 13px 16px;
  background: #0f1419; color: #fff; box-shadow: 0 3px 0 #000;
}
a.xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
a.xbtn:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
a.xbtn svg { width: 16px; height: 16px; fill: currentColor; }
button.sub { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
.how { font-size: 12px; opacity: .7; margin: 0; }
.err { font-size: 13px; color: #b3361b; margin: 0; font-weight: 700; }
.back { font-size: 13px; color: var(--ink); opacity: .75; }
.back:hover { opacity: 1; }
</style>

<body>

<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" aria-label="ハンガーキャッチのゲーム画面"></canvas>

<div class="hud" id="hud" hidden>
  <div class="pill"><span class="lab">掛かった</span><span class="val" id="hHung">0</span><span class="unit">/10本</span></div>
  <div class="pill right"><span class="lab">スコア / 最高</span><span class="val" id="hScore">0点</span><br><span class="unit" id="hBest">最高 0点</span></div>
</div>

<div class="ctrl" id="ctrl" hidden>
  <label class="knob"><span class="row"><span>高さ（角度）</span><b id="vPitch">17°</b></span><input type="range" id="pitch" min="0" max="45" step="1" value="17"></label>
  <label class="knob"><span class="row"><span>回転</span><b id="vSpin">なし</b></span><input type="range" id="spin" min="0" max="30" step="1" value="0"></label>
</div>

<div class="overlay" id="title">
  <div class="card">
    <div class="noren" aria-hidden="true"><span>ハ</span><span>ン</span><span>ガ</span><span>ー</span><span class="w">キャッチ</span></div>
    <div class="body">
      <p class="lead">部屋の奥からハンガーを投げて、<br>手前の竿に<b>カギを引っ掛けろ</b>。<br>カギが竿の<b>ちょい上</b>を通るように。</p>
      <div class="meta"><span>最高 <b id="tBest">0</b> 点</span><span>最多 <b id="tHung">0</b>/10本</span><span>連続 <b id="tStreak">0</b> 回</span></div>
      <div class="btns"><button id="startBtn" disabled>よみこみ中…</button></div>
      <p class="err" id="loadErr" hidden></p>
      <p class="how">下へドラッグして狙い、離して投げる（キーボード: ←→ 向き・↑↓ 強さ・スペースで投げる）</p>
      <a class="back" href="../../">← ほかのゲームを見る</a>
    </div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="noren result" aria-hidden="true"><span>お</span><span>ひ</span><span>ら</span><span>き</span></div>
    <div class="body">
      <div class="badge" id="newRec" hidden>新記録</div>
      <div class="score"><span id="oScore">0</span><small>点</small></div>
      <div class="meta"><span><b id="oHung">0</b>/10本 掛かった</span><span>最多連続 <b id="oStreak">0</b></span><span>最高 <b id="oBest">0</b> 点</span></div>
      <div class="btns">
        <button id="retryBtn">もう一回</button>
        <a class="xbtn" id="xBtn" href="https://x.com/intent/post" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Xでシェア</a>
        <button class="sub" id="copyBtn">結果をコピー</button>
      </div>
      <p class="how" id="copyMsg">画面タップ・スペースでもう一回</p>
      <a class="back" href="../../">← ほかのゲームを見る</a>
    </div>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';
let THREE, RAPIER;
try {
  const [t, r] = await Promise.all([import(THREE_URL), import(RAPIER_URL)]);
  THREE = t; RAPIER = r.default;
  await RAPIER.init();
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D/物理エンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');

/* ---------- 記録（このブラウザだけ） ---------- */
const KEY = 'catch:v1';
const DEF = { best: 0, bestHung: 0, bestStreak: 0, plays: 0 };
function load() { try { return Object.assign({ ...DEF }, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { return { ...DEF }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch {} }
let rec = load();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------- ベクトル・クォータニオン（物理側は three に頼らない） ---------- */
const qaxis = (ax, ay, az, ang) => { const s = Math.sin(ang / 2); return { x: ax * s, y: ay * s, z: az * s, w: Math.cos(ang / 2) }; };
function qFromTo(u, v) {
  const d = u.x * v.x + u.y * v.y + u.z * v.z;
  if (d < -0.99999) return { x: 1, y: 0, z: 0, w: 0 };
  const q = { x: u.y * v.z - u.z * v.y, y: u.z * v.x - u.x * v.z, z: u.x * v.y - u.y * v.x, w: 1 + d };
  const n = Math.hypot(q.x, q.y, q.z, q.w); return { x: q.x / n, y: q.y / n, z: q.z / n, w: q.w / n };
}
function qrot(q, v) {
  const { x, y, z, w } = q;
  const ix = w * v.x + y * v.z - z * v.y, iy = w * v.y + z * v.x - x * v.z, iz = w * v.z + x * v.y - y * v.x, iw = -x * v.x - y * v.y - z * v.z;
  return { x: ix * w + iw * -x + iy * -z - iz * -y, y: iy * w + iw * -y + iz * -x - ix * -z, z: iz * w + iw * -z + ix * -y - iy * -x };
}

/* ---------- 針金ハンガーの形（ローカル: 面 = y-z、カギは +z 側へ巻く。原点 = 下の棒の中央） ---------- */
const HG = { W: 0.2, NECK: 0.15, SHAFT: 0.08, CR: 0.032, TIP: 0.85, WR: 0.004 };
function hangerPts() {
  const { W, NECK, SHAFT, CR, TIP } = HG, top = NECK + SHAFT;
  const hook = [], N = 10;
  for (let i = N; i >= 0; i--) { const f = (Math.PI + TIP) * i / N; hook.push({ x: 0, y: top + CR * Math.sin(f), z: CR - CR * Math.cos(f) }); }
  hook.push({ x: 0, y: NECK, z: 0 });
  const body = [{ x: 0, y: NECK, z: 0 }, { x: 0, y: 0.012, z: -W }, { x: 0, y: 0, z: -W + 0.02 }, { x: 0, y: 0, z: W - 0.02 }, { x: 0, y: 0.012, z: W }, { x: 0, y: NECK, z: 0 }];
  return { hook, body, curlC: { x: 0, y: top, z: CR } };
}
const HP = hangerPts();

/* ---------- 部屋と掛ける場所（m。y=上、+z=手前のカメラ側） ---------- */
const ROOM = { x0: -3, x1: 3, z0: -5, z1: 1.9, h: 2.5 };
const FIX = {
  rack: { kind: 'bar', name: 'ハンガーラック', x: 0, y: 1.52, z: 0, len: 0.9, r: 0.0125, bonus: 0 },
  pole: { kind: 'bar', name: '室内物干し', x: -1.75, y: 1.72, z: 0.25, len: 1.5, r: 0.015, bonus: 20 },
  peg:  { kind: 'peg', name: 'コート掛けのフック', x: 1.635, y: 1.74, z: 0.2, len: 0.13, r: 0.011, bonus: 60 },
};
// 1投ごとの立ち位置（投げる人）。だんだん遠く・斜めに
const STAGES = [
  { f: 'rack', tx: 0.0,   tz: -1.7, vlo: 3.15, vhi: 8.15 },
  { f: 'rack', tx: 0.2,   tz: -2.1, vlo: 3.5,  vhi: 8.5 },
  { f: 'pole', tx: -1.6,  tz: -2.1, vlo: 5.0,  vhi: 10.0 },
  { f: 'rack', tx: -0.25, tz: -2.6, vlo: 3.9,  vhi: 8.9 },
  { f: 'pole', tx: -1.95, tz: -2.8, vlo: 5.5,  vhi: 10.5 },
  { f: 'peg',  tx: 1.6,   tz: -1.9, vlo: 5.2,  vhi: 10.2 },
  { f: 'rack', tx: 0.35,  tz: -3.2, vlo: 4.7,  vhi: 9.7 },
  { f: 'pole', tx: -1.5,  tz: -3.4, vlo: 6.2,  vhi: 11.2 },
  { f: 'peg',  tx: 1.55,  tz: -2.7, vlo: 5.6,  vhi: 10.6 },
  { f: 'rack', tx: 0.0,   tz: -3.9, vlo: 5.5,  vhi: 10.5 },
];
const TOTAL = STAGES.length;
const RELEASE_Y = 1.28;
function releasePoint(st) { return { x: st.tx, y: RELEASE_Y, z: st.tz + 0.3 }; }
function aimPoint(st) {
  const f = FIX[st.f];
  if (f.kind === 'peg') return { x: f.x - 0.01, y: f.y, z: f.z };
  return { x: clamp(st.tx, f.x - f.len / 2 + 0.12, f.x + f.len / 2 - 0.12), y: f.y, z: f.z };
}
const stageDist = st => { const a = aimPoint(st), r = releasePoint(st); return Math.hypot(a.x - r.x, a.z - r.z); };

/* ---------- 物理の世界 ---------- */
const PDT = 1 / 240;
const MAT = { f: 0.45, e: 0.05, d: 2500 };
function fixedBox(w, hx, hy, hz, x, y, z, f = 0.6, e = 0.15) {
  const b = w.createRigidBody(RAPIER.RigidBodyDesc.fixed());
  w.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setFriction(f).setRestitution(e), b);
}
function fixedCyl(w, ax, len, r, x, y, z, f = 0.5, e = 0.1) {
  // ax: 'x' | 'y' | 'z'
  const q = ax === 'x' ? qaxis(0, 0, 1, Math.PI / 2) : ax === 'z' ? qaxis(1, 0, 0, Math.PI / 2) : { x: 0, y: 0, z: 0, w: 1 };
  const b = w.createRigidBody(RAPIER.RigidBodyDesc.fixed());
  return w.createCollider(RAPIER.ColliderDesc.cylinder(len / 2, r).setTranslation(x, y, z).setRotation(q).setFriction(f).setRestitution(e), b);
}
function buildStatic(w) {
  // 床・壁・天井
  fixedBox(w, 4, 0.1, 5, 0, -0.1, -1.5, 0.6, 0.18);
  fixedBox(w, 0.1, 2, 5, ROOM.x0 - 0.1, 1.25, -1.5);
  fixedBox(w, 0.1, 2, 5, ROOM.x1 + 0.1, 1.25, -1.5);
  fixedBox(w, 4, 2, 0.1, 0, 1.25, ROOM.z0 - 0.1);
  fixedBox(w, 4, 2, 0.1, 0, 1.25, ROOM.z1 + 0.1);
  fixedBox(w, 4, 0.1, 5, 0, ROOM.h + 0.1, -1.5);
  // ソファ
  fixedBox(w, 0.42, 0.22, 0.95, -2.55, 0.22, -3.2);
  // ハンガーラック: 柱2本と足
  const r = FIX.rack;
  fixedCyl(w, 'x', r.len, r.r, r.x, r.y, r.z);
  for (const s of [-1, 1]) {
    fixedCyl(w, 'y', r.y + 0.03, 0.014, r.x + s * (r.len / 2 + 0.015), (r.y + 0.03) / 2, r.z);
    fixedCyl(w, 'z', 0.5, 0.014, r.x + s * (r.len / 2 + 0.015), 0.03, r.z);
  }
  // 室内物干し: 竿と左右のスタンド
  const p = FIX.pole;
  fixedCyl(w, 'x', p.len, p.r, p.x, p.y, p.z);
  for (const s of [-1, 1]) {
    fixedCyl(w, 'y', p.y + 0.04, 0.016, p.x + s * (p.len / 2 + 0.02), (p.y + 0.04) / 2, p.z);
    fixedCyl(w, 'z', 0.6, 0.016, p.x + s * (p.len / 2 + 0.02), 0.03, p.z);
  }
  fixedBox(w, 0.17, 0.3, 0.004, p.x - p.len / 2 + 0.2, p.y - 0.3, p.z, 0.8, 0.0);   // 干してあるタオル
  // コート掛け: 柱・台・フック（一本だけ -x 向き、ほかは飾り）
  const g = FIX.peg;
  const px = g.x + g.len / 2 + 0.02;
  fixedCyl(w, 'y', 1.9, 0.02, px, 0.95, g.z);
  fixedCyl(w, 'y', 0.04, 0.2, px, 0.02, g.z);
  fixedCyl(w, 'x', g.len, g.r, g.x, g.y, g.z);
  const kb = w.createRigidBody(RAPIER.RigidBodyDesc.fixed());
  w.createCollider(RAPIER.ColliderDesc.ball(0.017).setTranslation(g.x - g.len / 2, g.y + 0.004, g.z).setFriction(0.5).setRestitution(0.1), kb);
  fixedCyl(w, 'x', 0.12, 0.011, px + 0.08, g.y + 0.06, g.z);
  fixedCyl(w, 'z', 0.12, 0.011, px, g.y - 0.08, g.z - 0.08);
}
function makeWorld() {
  const w = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
  w.timestep = PDT;
  w.integrationParameters.maxCcdSubsteps = 4;
  buildStatic(w);
  return w;
}
function addSegs(w, body, pts, r) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], d = { x: b.x - a.x, y: b.y - a.y, z: b.z - a.z }, L = Math.hypot(d.x, d.y, d.z);
    if (L < 1e-4) continue;
    const q = qFromTo({ x: 0, y: 1, z: 0 }, { x: d.x / L, y: d.y / L, z: d.z / L });

function hookState(b, f) {

  const cw = qrot(r, HP.curlC), c = { x: t.x + cw.x, y: t.y + cw.y, z: t.z + cw.z };

const HOLD = 0.7;
function judgeStep(h, f, dt) {
  const hs = hookState(h.body, f);
  if (hs.inside) { h.inT += dt; h.wasIn = true; if (h.firstIn < 0) h.firstIn = h.t; } else h.inT = 0;

      fx.fillStyle = '#e9a253';
      fx.beginPath(); fx.moveTo(p.x - 9, p.y - 14 + bob); fx.lineTo(p.x + 9, p.y - 14 + bob); fx.lineTo(p.x, p.y - 2 + bob); fx.closePath(); fx.fill();
    }
  }
  fx.textAlign = 'start';
}
function drawAim() {
  if (phase !== 'aim') return;
  const a = aimParams();
  if (!a) {
    if (n < 2) {
      const k = (tt * 0.7) % 1;
      const x = W / 2, y0 = H * 0.5;
      fx.globalAlpha = Math.sin(k * Math.PI);
      fx.fillStyle = 'rgba(245,239,226,.85)'; fx.beginPath(); fx.arc(x, y0 + k * 110, 12, 0, Math.PI * 2); fx.fill();
      fx.globalAlpha = 1;
      fx.textAlign = 'center'; fx.font = `17px ${FD}`; fx.lineWidth = 5; fx.strokeStyle = 'rgba(20,18,24,.9)'; fx.fillStyle = '#f5efe2';
      const ty = y0 + 150;
      fx.strokeText('どこでも押して、下へ引いて離す', x, ty); fx.fillText('どこでも押して、下へ引いて離す', x, ty);
      fx.font = `700 13px ${FB}`;
      fx.strokeText('カギが竿の“ちょい上”を通るように', x, ty + 24); fx.fillText('カギが竿の“ちょい上”を通るように', x, ty + 24);
      fx.textAlign = 'start';
    }
    return;
  }
  // 予測線（カギの通り道。先へ行くほど短く見せる）
  const tv = throwVectors(cur, a);
  const c0 = qrot(tv.rot, HP.curlC);
  const start = { x: tv.from.x + c0.x, y: tv.from.y + c0.y, z: tv.from.z + c0.z };
  const fz = FIX[cur.f].z;
  const tReach = (fz - start.z) / Math.max(0.5, tv.lin.z);
  const show = n < 2 ? 1.15 : n < 4 ? 0.6 : n < 7 ? 0.42 : 0.3;
  const N = 26;
  for (let i = 1; i <= N; i++) {
    const t = tReach * show * i / N;
    const p = { x: start.x + tv.lin.x * t, y: start.y + tv.lin.y * t - 4.905 * t * t, z: start.z + tv.lin.z * t };
    const s = project(p); if (!s.front) continue;
    fx.globalAlpha = 0.95 * (1 - i / (N + 4)) + 0.1;
    fx.fillStyle = a.p >= 0.995 ? '#e5703e' : '#f5efe2';
    fx.beginPath(); fx.arc(s.x, s.y, 2.6 + i * 0.12, 0, Math.PI * 2); fx.fill();
  }
  fx.globalAlpha = 1;
  // 引っ張り
  if (drag) {
    fx.strokeStyle = 'rgba(245,239,226,.45)'; fx.lineWidth = 2; fx.setLineDash([5, 6]);
    const L = dragLen(), dx = drag.x - drag.x0, dy = drag.y - drag.y0, len = Math.hypot(dx, dy), kk = Math.min(1, L * 1.2 / Math.max(1, len));
    fx.beginPath(); fx.moveTo(drag.x0, drag.y0); fx.lineTo(drag.x0 + dx * kk, drag.y0 + dy * kk); fx.stroke(); fx.setLineDash([]);
    fx.fillStyle = 'rgba(245,239,226,.35)'; fx.beginPath(); fx.arc(drag.x0, drag.y0, 7, 0, Math.PI * 2); fx.fill();
  }
  // 強さメーター
  const mx = 16 + Math.max(0, (W - 400) / 2) * 0, my = H - safeB - 96;
  const mw = Math.min(160, W * 0.4);
  fx.fillStyle = 'rgba(20,18,24,.65)'; fx.fillRect(mx, my, mw, 10);
  fx.fillStyle = a.p >= 0.995 ? '#e5703e' : '#e9a253'; fx.fillRect(mx, my, mw * a.p, 10);
  fx.font = `700 12px ${FB}`; fx.fillStyle = '#f5efe2'; fx.lineWidth = 3; fx.strokeStyle = 'rgba(20,18,24,.8)';
  const lab = `強さ ${Math.round(a.p * 100)}%　向き ${a.yaw > 0.01 ? '右' : a.yaw < -0.01 ? '左' : 'まっすぐ'}`;
  fx.strokeText(lab, mx, my - 6); fx.fillText(lab, mx, my - 6);
}

/* ---------- 結果 ---------- */
function showOver() {
  state = 'over'; phase = 'over';
  rec.plays++;
  const isNew = score > rec.best;
  if (isNew) rec.best = score;
  if (hung > rec.bestHung) rec.bestHung = hung;
  if (bestStreakG > rec.bestStreak) rec.bestStreak = bestStreakG;
  save();
  $('oScore').textContent = score; $('oHung').textContent = hung; $('oStreak').textContent = bestStreakG; $('oBest').textContent = rec.best;
  $('newRec').hidden = !(isNew && score > 0);
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({
    text: `${shareText()}${isNew && score > 0 ? ' 自己ベスト更新！' : ''}\n`,
    url: gameUrl(), hashtags: 'ハンガーキャッチ'
  });
  $('copyMsg').textContent = '画面タップ・スペースでもう一回';
  $('over').hidden = false; $('hud').hidden = true; $('ctrl').hidden = true;
  overShownAt = performance.now();
  showHeld(false);
  setCam(overviewCam(), false);
  $('retryBtn').focus({ preventScroll: true });
}
const shareText = () => `🙌ハンガーキャッチ ${hung}/${TOTAL}本 掛かった${hung >= 5 ? '（わーっ！）' : ''} ${score}点${bestStreakG >= 3 ? `・${bestStreakG}連続` : ''}`;

/* ---------- シェア ---------- */
// 公開先のURL。ローカルで開いたときもこれをシェアする
const PUBLIC_URL = 'https://asobi.enludus.com/games/catch/';
function gameUrl() {
  try {
    if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost') return location.origin + location.pathname;
  } catch {}
  return PUBLIC_URL;
}

/* ---------- HUD ---------- */
function updateHud() {
  $('hHung').textContent = hung;
  $('hScore').textContent = score + '点';
  $('hBest').textContent = `最高 ${rec.best}点`;
}
function fillTitle() { $('tBest').textContent = rec.best; $('tHung').textContent = rec.bestHung; $('tStreak').textContent = rec.bestStreak; }
function updateKnobs() {
  $('vPitch').textContent = `${$('pitch').value}°`;
  const s = +$('spin').value;
  $('vSpin').textContent = s === 0 ? 'なし' : s < 10 ? `弱 ${s}` : s < 20 ? `中 ${s}` : `強 ${s}`;
}
$('pitch').addEventListener('input', updateKnobs); $('spin').addEventListener('input', updateKnobs);

/* ---------- 音 ---------- */
let ac = null, master = null, noiseBuf = null;
function wakeAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createDynamicsCompressor(); master.threshold.value = -14; master.ratio.value = 6; master.connect(ac.destination);
      const len = ac.sampleRate * 1.2; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch {}
}
const live = () => ac && state === 'play';
function tone(freq, at, dur, vol, type = 'sine', dest = master) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(dest); o.start(at); o.stop(at + dur + 0.02);
}
function noise(at, dur, vol, type, freq, q = 1, dest = master) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(g).connect(dest); s.start(at, Math.random() * 0.5); s.stop(at + dur + 0.02);
  return { f, g };
}
function sWhoosh(pan, p) {
  try {
    if (!live()) return;
    const n0 = ac.currentTime, { f } = noise(n0, 0.3, 0.12 + p * 0.1, 'bandpass', 500, 1.2);
    f.frequency.exponentialRampToValueAtTime(1600 + p * 1200, n0 + 0.25);
  } catch {}
}
function sClank(k) {
  try {
    if (!live()) return;
    const n0 = ac.currentTime, v = 0.03 + k * 0.08;
    tone(1850 * rand(0.95, 1.05), n0, 0.09, v, 'triangle'); tone(2960 * rand(0.95, 1.05), n0, 0.14, v * 0.6); tone(4100, n0, 0.08, v * 0.3);
    noise(n0, 0.03, v * 0.8, 'highpass', 3000);
  } catch {}
}
function sKashan(k) {
  try {
    if (!live()) return;
    const n0 = ac.currentTime, v = 0.05 + k * 0.12;
    for (const [dt, a] of [[0, 1], [0.07, 0.55], [0.13, 0.35]]) {
      noise(n0 + dt, 0.12, v * a, 'highpass', 2200);
      for (const fr of [2350, 3720, 5180]) tone(fr * rand(0.96, 1.04), n0 + dt, 0.22, v * a * 0.25, 'sine');
    }
  } catch {}
}
function sHook() {
  try { if (!live()) return; const n0 = ac.currentTime; tone(2400, n0, 0.04, 0.12, 'square'); tone(1200, n0, 0.12, 0.1, 'triangle'); tone(420, n0, 0.16, 0.12); } catch {}
}
// 歓声: のこぎり波の「声」をたくさん重ねて、母音「あ」のフォルマントに通す
function sCheer(level) {
  try {
    if (!live()) return;
    const n0 = ac.currentTime + 0.02, dur = 0.8 + level * 0.8;
    const out = ac.createGain(); out.gain.value = 0.55 + level * 0.5; out.connect(master);
    const bus = ac.createGain();
    for (const [fa, fb, q, gv] of [[420, 820, 5, 1], [800, 1250, 6, 0.7], [2300, 2700, 8, 0.22]]) {
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
      bp.frequency.setValueAtTime(fa, n0); bp.frequency.linearRampToValueAtTime(fb, n0 + 0.16);
      const gg = ac.createGain(); gg.gain.value = gv; bus.connect(bp).connect(gg).connect(out);
    }
    const voices = Math.round(6 + level * 10);
    for (let i = 0; i < voices; i++) {
      const o = ac.createOscillator(); o.type = 'sawtooth';
      const f0 = Math.random() < 0.5 ? rand(140, 230) : rand(250, 420), st = n0 + rand(0, 0.14);
      o.frequency.setValueAtTime(f0 * 0.82, st); o.frequency.exponentialRampToValueAtTime(f0 * 1.08, st + 0.22); o.frequency.exponentialRampToValueAtTime(f0 * 0.9, st + dur);
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = rand(4.5, 7.5); lg.gain.value = f0 * 0.03; lfo.connect(lg).connect(o.frequency);
      const g = ac.createGain(), v = 0.12 / Math.sqrt(voices);
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(v, st + 0.08); g.gain.setValueAtTime(v, st + dur * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, st + dur + rand(0.1, 0.4));
      o.connect(g).connect(bus); o.start(st); lfo.start(st); o.stop(st + dur + 0.5); lfo.stop(st + dur + 0.5);
    }
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const nb = ac.createBiquadFilter(); nb.type = 'bandpass'; nb.frequency.value = 1500; nb.Q.value = 0.7;
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.0001, n0); ng.gain.exponentialRampToValueAtTime(0.06 + level * 0.08, n0 + 0.1); ng.gain.exponentialRampToValueAtTime(0.0001, n0 + dur + 0.5);
    s.connect(nb).connect(ng).connect(out); s.start(n0); s.stop(n0 + dur + 0.6);
    const claps = Math.round(4 + level * 14);
    for (let i = 0; i < claps; i++) noise(n0 + 0.25 + rand(0, dur), 0.035, 0.12, 'highpass', 1100);
  } catch {}
}
function sGroan() {
  try {
    if (!live()) return;
    const n0 = ac.currentTime + 0.02;
    const out = ac.createGain(); out.gain.value = 0.5; out.connect(master);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4; bp.frequency.setValueAtTime(750, n0); bp.frequency.linearRampToValueAtTime(480, n0 + 0.6);
    bp.connect(out);
    for (let i = 0; i < 5; i++) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; const f0 = rand(150, 300), st = n0 + rand(0, 0.08);
      o.frequency.setValueAtTime(f0, st); o.frequency.exponentialRampToValueAtTime(f0 * 0.72, st + 0.7);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.05, st + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.75);
      o.connect(g).connect(bp); o.start(st); o.stop(st + 0.8);
    }
  } catch {}
}

/* ---------- ループ ---------- */
let acc = 0, lastTs = performance.now();
function frame(ts2) {
  acc += Math.min(100, ts2 - lastTs); lastTs = ts2;
  let k = 0;
  while (acc >= 1000 / 60 && k < 4) { step(1 / 60); acc -= 1000 / 60; k++; }
  if (k >= 4) acc = 0;
  render();
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function start() {
  wakeAudio(); state = 'play'; newGame();
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false; $('ctrl').hidden = false;
}
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play') return;
  if (phase === 'after') { if (phaseT < 0.5) return; nextStage(); if (state !== 'play') return; }
  if (phase !== 'aim') return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  drag = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId }; kb = null;
});
addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id) { drag.x = e.clientX; drag.y = e.clientY; } });
addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) { const a = aimParams(); drag = null; if (a) throwNow(a); } });
addEventListener('pointercancel', () => { drag = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
addEventListener('keydown', e => {
  if (state === 'play') {
    if (e.target.matches && e.target.matches('input')) { if (e.code !== 'Space' && e.code !== 'Enter') return; }
    const keys = { ArrowLeft: [-0.08, 0], ArrowRight: [0.08, 0], ArrowUp: [0, 0.03], ArrowDown: [0, -0.03] };
    if (keys[e.code]) {
      e.preventDefault();
      if (phase !== 'aim') return;
      if (!kb) kb = { p: 0.55, yaw: 0 };
      kb.yaw = clamp(kb.yaw + keys[e.code][0], -1, 1); kb.p = clamp(kb.p + keys[e.code][1], 0.05, 1);
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault(); wakeAudio();
      if (e.repeat) return;
      if (phase === 'after' && phaseT > 0.5) { nextStage(); return; }
      if (phase === 'aim') { if (!kb) { kb = { p: 0.55, yaw: 0 }; return; } const a = aimParams(); throwNow(a); }
    }
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText()} 最高${rec.best}点 ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整用（#debug のときだけ） ---------- */
if (location.hash === '#debug') {
  window.__catch = {
    info: () => ({ state, phase, n, hung, score, streak, flying: !!flying, hangers: hangers.length, demo: demoParams }),
    sim: (i, p) => simulate(i, p),
    // ステージ i の (強さ p, 高さ°) 格子で成功率を出す
    sweep(i, { spin = 0, yaw = 0, pitches = [8, 12, 17, 22, 28, 34, 40], steps = 41 } = {}) {
      const st = STAGES[i], out = { stage: i, rows: [], hits: 0, total: 0 };
      for (const deg of pitches) {
        let line = '';
        for (let k = 0; k < steps; k++) {
          const p = k / (steps - 1);
          const r = simulate(i, { yaw, pitch: deg * Math.PI / 180, v: lerp(st.vlo, st.vhi, p), spin });
          line += r === 'hang' ? '#' : '.'; out.total++; if (r === 'hang') out.hits++;
        }
        out.rows.push(`${String(deg).padStart(2)}° ${line}`);
      }
      return out;
    },
    throwWith: (p, yawK = 0, pitchDeg = null, spin = null) => {
      if (pitchDeg != null) $('pitch').value = pitchDeg; if (spin != null) $('spin').value = spin; updateKnobs();
      const st = STAGES[n];
      throwNow({ p, yaw: yawK * YAW_MAX, pitch: +$('pitch').value * Math.PI / 180, v: lerp(st.vlo, st.vhi, p), spin: +$('spin').value });
    },
    skip: () => { if (phase === 'after') nextStage(); },
  };
}

/* ---------- はじめ ---------- */
world = makeWorld();
cur = STAGES[0];
// デモ用に「掛かる投げ方」をひとつ見つけておく
{
  const st = STAGES[0];
  for (let k = 0; k < 60 && !demoParams; k++) {
    const p = { yaw: 0, pitch: 17 * Math.PI / 180, v: lerp(st.vlo, st.vhi, 0.35 + (k % 30) / 60), spin: 0 };
    if (simulate(0, p) === 'hang') demoParams = p;
  }
}
beginStage(true);
state = 'title';
fillTitle(); updateKnobs();
$('startBtn').disabled = false; $('startBtn').textContent = 'ハンガーを持つ';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
