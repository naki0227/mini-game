<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 WebGL（夕方の屋上と校庭）+ 2D の演出レイヤー + HUD + 下の「折り方」パネル。タイトル/結果は中央のカード1枚 */
:root {
  --dusk: #2b3448;       /* 夕暮れの空の上のほう */
  --sun: #e8743c;        /* 夕日 */
  --ink: #23262b;
  --paper: #fbf7ec;      /* ノートの紙 */
  --noren: #2f5446;      /* 黒板の緑 */
  --noren-ink: #f3f0e4;  /* チョーク */
  --sand: #d9b689;       /* 校庭の砂 */
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--dusk); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#gl, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { touch-action: none; cursor: grab; }
#fx:active { cursor: grabbing; }

.hud {
  position: fixed; right: 0; top: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--noren); color: var(--noren-ink);
  border-radius: 6px; padding: 5px 10px 6px;
  font-variant-numeric: tabular-nums; line-height: 1.1; text-align: right;
  box-shadow: 0 2px 0 rgba(0,0,0,.3);
}
.pill .lab { font-size: 10px; letter-spacing: .12em; opacity: .75; display: block; }
.pill .val { font-family: var(--font-display); font-size: 18px; }
.pill .unit { font-size: 12px; margin-left: 2px; }
.pill.wind { background: var(--paper); color: var(--ink); display: flex; align-items: center; gap: 8px; text-align: left; }
.pill.wind svg { width: 26px; height: 26px; flex: none; transition: transform .3s; }
.pill.wind .val { font-size: 15px; }

/* 下の準備パネル: 折り方と、翼の端の折り上げ */
.prep {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(12px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, rgba(28, 30, 40, .82), rgba(28, 30, 40, .62) 75%, rgba(28, 30, 40, 0));
  color: var(--noren-ink); display: grid; gap: 8px; justify-items: center;
}
.prep .row { width: min(420px, 100%); display: grid; gap: 8px; }
.folds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.fold {
  font: inherit; border: 0; border-radius: 8px; cursor: pointer; padding: 6px 4px 7px;
  background: rgba(251, 247, 236, .14); color: var(--noren-ink); box-shadow: none;
  display: grid; justify-items: center; gap: 1px; line-height: 1.15;
}
.fold svg { width: 44px; height: 26px; }
.fold b { font-size: 13px; }
.fold small { font-size: 10px; opacity: .8; font-variant-numeric: tabular-nums; }
.fold[aria-checked="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,.4); }
.fold:active { transform: translateY(1px); }
.fold:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
.desc { font-size: 12px; text-align: center; opacity: .9; margin: 0; min-height: 1.3em; }
.elev { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 12px; }

@keyframes pulse { 50% { transform: scale(1.04); } }

.overlay {

a.xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
a.xbtn:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
a.xbtn svg { width: 16px; height: 16px; fill: currentColor; }

}
.hub-back:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 空力の簡易シミュレーション（three には頼らない。m・kg・s。y=上、-z=校庭の奥） ---------- */
const RHO = 1.2, G = 9.81, PDT = 1 / 240;
const ROOF = 5.8;                 // 屋上の床の高さ（2階建ての校舎）
const HAND = 1.45;                // 手の高さ
const LAUNCH = { x: 0, y: ROOF + HAND, z: -0.15 };
// 折り方: m=重さ S=翼面積 c=翼弦 CLa=揚力傾斜 as=失速角 CD0=形の抗力 k=誘導抗力 Cma=ピッチの安定 Cmq=ピッチの減衰 cm0=つり合い（ふつうの折り）
// el=翼端を1目盛り折り上げたときのつり合いの変化、I=ピッチの慣性、roll=風で揺さぶられる量、spiral=放っておくと傾いていく癖
const FOLDS = {
  heso: { name: 'へそ飛行機', short: 'へそ', m: 0.0056, S: 0.0135, c: 0.085, CLa: 3.6, as: 0.22, CD0: 0.045, k: 0.14, Cma: -0.62, Cmq: 7, cm0: 0.020, el: 0.0975, I: 3.4e-5, roll: 0.05, spiral: 0.0, flut: 0.004, vf: 8 },
  yari: { name: 'やり飛行機', short: 'やり', m: 0.0062, S: 0.0085, c: 0.11, CLa: 3.0, as: 0.19, CD0: 0.032, k: 0.25, Cma: -0.35, Cmq: 4, cm0: 0.0092, el: 0.049, I: 4.4e-5, roll: 0.08, spiral: 0.25, flut: 0.003, vf: 10 },
  ika:  { name: 'イカ飛行機', short: 'イカ', m: 0.0060, S: 0.0210, c: 0.10, CLa: 4.0, as: 0.28, CD0: 0.078, k: 0.11, Cma: -0.55, Cmq: 9, cm0: 0.0576, el: 0.067, I: 4.0e-5, roll: 0.10, spiral: 0.0, flut: 0.010, vf: 5.5 },
};
const FOLD_IDS = ['heso', 'yari', 'ika'];
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// 毎回の空模様: 風（向き・強さ・息）と、校庭の上昇気流
function makeEnv(seed) {
  const r = mulberry(seed);
  const spd = 0.15 + Math.pow(r(), 1.3) * 1.75;            // 0.15〜1.9 m/s
  const dir = r() * Math.PI * 2;                         // 風が吹いていく向き（0=奥へ＝追い風）
  const th = [];
  const nT = r() < 0.75 ? (r() < 0.45 ? 2 : 1) : 0;
  for (let i = 0; i < nT; i++) th.push({ x: (r() * 2 - 1) * 14, z: -(22 + r() * 48), R: 5 + r() * 3, w: 1.0 + r() * 1.2, top: 22 + r() * 12 });
  return { seed, wind: { x: Math.sin(dir) * spd, z: -Math.cos(dir) * spd, spd, dir }, gust: [r() * 6.28, r() * 6.28, r() * 6.28, 0.6 + r() * 0.5], thermals: th };
}
// その場所・時刻の空気の動き
function airAt(env, x, y, z, t) {
  const g = env.gust, gf = 1 + 0.22 * Math.sin(t * 0.9 + g[0]) + 0.12 * Math.sin(t * 2.3 + g[1]);
  const low = y < 0 ? 0.55 : Math.min(1, 0.55 + 0.45 * y / 10);    // 地面ちかくは弱い
  let up = 0;
  for (const T of env.thermals) {
    if (y > T.top) continue;
    const d2 = ((x - T.x) ** 2 + (z - T.z) ** 2) / (T.R * T.R);
    const fade = y > T.top - 6 ? (T.top - y) / 6 : 1;
    up += T.w * fade * (Math.exp(-d2) - 0.22 * Math.exp(-((Math.sqrt(d2) - 1.9) ** 2) * 1.5));
  }
  return { x: env.wind.x * gf * low, y: up, z: env.wind.z * gf * low };
}
// 投げる: aim = { v: 初速 m/s, pitch: 投げ角 rad, yaw: 向き rad（+は右） }、elev = 翼端の折り上げ -1〜1
function launch(foldId, elev, aim, env) {
  const P = FOLDS[foldId];
  const cp = Math.cos(aim.pitch);
  return {
    P, fold: foldId, elev, env, t: 0,
    x: LAUNCH.x, y: LAUNCH.y, z: LAUNCH.z,
    vx: Math.sin(aim.yaw) * cp * aim.v, vy: Math.sin(aim.pitch) * aim.v, vz: -Math.cos(aim.yaw) * cp * aim.v,
    th: aim.pitch + 0.03, q: 0, psi: aim.yaw, phi: 0, bank: 0,
    cm0: P.cm0 + P.el * elev,
    phase: 'fly', alpha: 0, V: aim.v, maxY: LAUNCH.y, stall: 0, inThermal: 0, thermalUsed: false,
    land: null, where: null,
  };
}
function wrap(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function smooth(a, b, x) { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); }
function aeroCoef(P, a) {
  const aa = Math.abs(a), s = Math.sign(a) || 1;
  const lin = P.CLa * a;
  const post = s * Math.max(0.55 * Math.abs(Math.sin(2 * aa)), P.CLa * P.as * Math.exp(-(aa - P.as) / 0.09));
  const st = smooth(P.as - 0.02, P.as + 0.05, aa);
  const CL = lin * (1 - st) + post * st;
  const CD = P.CD0 + P.k * CL * CL + 1.25 * Math.sin(aa) ** 2 * st;   // 速すぎると紙がばたついて抗力が増える分は stepFlight で
  const Cms = -0.25 * st * Math.sin(a);                   // 失速すると機首が下がる
  return { CL, CD, Cms, st };
}
// 1ステップ。bankTarget = プレイヤーのロール（rad）
function stepFlight(s, dt, bankTarget = 0) {
  const P = s.P;
  if (s.phase === 'skid') {
    const h = Math.hypot(s.vx, s.vz);
    const dec = 5.5 * dt;
    if (h <= dec) { s.vx = s.vz = 0; s.phase = 'done'; } else { s.vx *= (h - dec) / h; s.vz *= (h - dec) / h; }

    [[392, 0], [494, 0.12], [587, 0.24], [784, 0.4]].forEach(([f, t]) => { tone(f, n0 + t, 0.5, 0.07); tone(f / 2, n0 + t, 0.5, 0.04); });
  } catch {}
}

/* ---------- ループ ---------- */
let acc = 0, lastTs = performance.now();
function frame(ts2) {
  acc += Math.min(100, ts2 - lastTs); lastTs = ts2;
  let k = 0;
  while (acc >= 1000 / 60 && k < 4) { step(1 / 60); acc -= 1000 / 60; k++; }
  if (k >= 4) acc = 0;
  render(1 / 60);
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function start() {
  wakeAudio(); state = 'play'; demo = null; demoMesh.visible = false; demoBlob.visible = false;
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  newGame();
}
function skipToResult() { if (state === 'play' && (phase === 'landed' || phase === 'side') && phaseT > 0.3) showOver(); }
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play') return;
  if (phase === 'landed' || phase === 'side') { skipToResult(); return; }
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  if (phase === 'ready') { drag = { x0: e.clientX, y0: e.clientY, id: e.pointerId, pts: [{ x: e.clientX, y: e.clientY, t: performance.now() }] }; kb = null; charge = null; }
  else if (phase === 'fly') steer = { x0: e.clientX, id: e.pointerId, bank: 0 };
});
addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.id) { drag.pts.push({ x: e.clientX, y: e.clientY, t: performance.now() }); if (drag.pts.length > 60) drag.pts.splice(0, drag.pts.length - 60); }
  if (steer && e.pointerId === steer.id) steer.bank = clamp((e.clientX - steer.x0) / (W * 0.3), -1, 1) * 0.42;
});
addEventListener('pointerup', e => {
  if (steer && e.pointerId === steer.id) steer = null;
  if (!drag || e.pointerId !== drag.id) return;
  const lp = drag.pts[drag.pts.length - 1];
  if (Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 2) drag.pts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
  else if (performance.now() - lp.t > 120) drag.pts.push({ x: lp.x, y: lp.y, t: performance.now() });   // 止めてから離したら、はじいていない
  const a = aimFromDrag(drag, true);
  drag = null;
  if (a.ok && state === 'play' && phase === 'ready') throwNow(a);
  else if (state === 'play' && phase === 'ready' && Math.hypot(e.clientX - a.x0, e.clientY - a.y0) > 12) pops.push({ text: 'もっと速く、上へシュッと！', life: 0, dur: 1.3, size: 20, small: true });
});
addEventListener('pointercancel', () => { drag = null; steer = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
addEventListener('keydown', e => {
  if (state === 'play') {
    if (e.target && e.target.closest && e.target.closest('input, button') && e.code !== 'Space') return;
    if (phase === 'ready') {
      const keys = { ArrowLeft: ['yaw', -2 * DEG], ArrowRight: ['yaw', 2 * DEG], ArrowUp: ['pitch', 2.5 * DEG], ArrowDown: ['pitch', -2.5 * DEG] };
      if (keys[e.code]) {
        e.preventDefault();
        if (!kb) kb = { pitch: 5 * DEG, yaw: 0 };
        const [k, d] = keys[e.code]; kb[k] += d;
        kb.pitch = clamp(kb.pitch, -22 * DEG, 45 * DEG); kb.yaw = clamp(kb.yaw, -0.4, 0.4);
        return;
      }
      if (['Digit1', 'Digit2', 'Digit3'].includes(e.code)) { setFold(FOLD_IDS[+e.code.slice(5) - 1]); return; }
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault(); wakeAudio();
        if (e.repeat || charge) return;
        if (!kb) kb = { pitch: 5 * DEG, yaw: 0 };
        charge = { t: 0, k: 0 };
      }
      return;
    }
    if (phase === 'fly') {
      if (e.code === 'ArrowLeft') { keyBank = -0.42; e.preventDefault(); }
      if (e.code === 'ArrowRight') { keyBank = 0.42; e.preventDefault(); }
      if (e.code === 'Space' || e.code === 'Enter') e.preventDefault();
      return;
    }
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); skipToResult(); }
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') keyBank = 0;
  if ((e.code === 'Space' || e.code === 'Enter') && charge && state === 'play' && phase === 'ready') {
    const a = { v: 2.5 + charge.k * 11.5, pitch: kb.pitch, yaw: kb.yaw };
    charge = null; throwNow(a);
  }
});
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('foldBtn').addEventListener('click', () => {
  start();
  const p = $('prep'); p.classList.remove('pulse'); void p.offsetWidth; p.classList.add('pulse');
  document.querySelector(`.fold[data-fold="${fold}"]`).focus({ preventScroll: true });
});
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText()} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  window.__plane = {
    info: () => ({ state, phase, fold, elev, dist: lastDist, sim: sim ? { x: sim.x, y: sim.y, z: sim.z, t: sim.t, phase: sim.phase, V: sim.V, phi: sim.phi, bank: sim.bank, thermal: sim.thermalUsed } : null, env, rec }),
    env: s => makeEnv(s), sim: (f, el, aim, seed) => simulate(f, el, aim, makeEnv(seed)),
    throwWith: a => throwNow(a), setFold, setElev: v => { elev = v; }, lastAim: () => lastAim,
    FOLDS, makeEnv, simulate,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([document.fonts.load(`40px "Dela Gothic One"`), new Promise(r => setTimeout(r, 1500))]); } catch {}
buildLabels();
updateFlag();
toReady();
state = 'title';
fillTitle(); updateHud(); syncPrep();
$('startBtn').disabled = false; $('startBtn').textContent = '投げにいく';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>

</script>
