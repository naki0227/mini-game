<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dエンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 鉛筆ころがしの物理（three には頼らない自前。単位は m・秒・rad。当たり外れ・点はぜんぶこの結果から） ----------
   鉛筆の断面は正 N 角形（六角 N=6、丸は角のとれた N=12 とみなす）。机の上では、いつも「どこか1点を支点に回っている」:
   ・支点が角（頂点）: 中心は支点のまわりを回る。重心が支点の真上を越えるには山を越えるだけの勢いが要る（六角の角で減速）。
     次の角が机に着く瞬間に、支点が移る（衝突）。そのときの回転の残りは、新しい支点まわりの角運動量の保存から
     ω' = ω·(I + (c−E)·(c−P)) / (I + |c−E|²)（I は中心まわりの慣性モーメント/質量、c 中心、P 前の支点、E 新しい支点）。
     速いときは角が浮いて跳ねるように進むので、残りは rFast に近づく（ω²/(ω²+wC²) でまぜる）。遅いとカタッと止まる。
   ・次の角が机の外（端より先）に着くはずなら、面が机の「端のかど」に乗る。かどが新しい支点になり、
     重心がかどより手前なら、ぐらっと傾いてから戻って止まる（はみ出して止まる＝ぎりぎり）。かどより先なら落ちる。
   ・転がり摩擦（ゆっくり効く減速）。消しかす（小さな段。片方の端だけ乗るので向きがずれる・勢いが落ちる・越えられなければ止まる）、
     机の彫り（溝。またぐたびに少し勢いが落ちる）。
   ・両端の太さがちがう（キャップ付き・消しゴム付き）と円すいのように転がり、細いほうへ曲がる（向きが転がった距離に比例して回る）。
   ・はじく: 引いた長さ p → 回転の勢い ω0 = W_MIN·e^(K_W·p)/√(重さの比)。横の引き → 鉛筆のねじれ（向き）。離した瞬間の位置だけで決まる。
   ・止まった重心と端の距離 d で点。ZONE より手前なら「とどかず」、落ちたら「落ちた」でおしまい。 */
const PH = {
  DT: 1 / 1000, G: 9.8,
  DESK_W: 0.60, Z_E: -0.20, Z_N: 0.20, FLOOR: 0.70,   // 机の幅・奥の端・手前の端・床までの高さ
  ZONE: 0.060, GIRI: 0.002,                            // 点になる範囲・「ぎりぎり」
  W_MIN: 90, K_W: 3.0, PMIN: 0.04, TW: 0.40, TW_T: 0.06, MASS_E: 0.5,
  W_REST: 0.9, FALL_A: 0.6,
  READY_T: 0.55, SETTLE_T: 1.35, FALL_T: 1.7, IDLE_T: 16, IDLE_WARN: 9, HOLD_MAX: 25, MAX_ROLL: 14,
  K_GROOVE: 0.22, GSP: 0.003,
};
const SHAPES = {
  hex: { N: 6, R: 0.0040, kI: 5 / 12, rFast: 0.97, wC: 35, crr: 3 },
  round: { N: 12, R: 0.0037, kI: 0.5, rFast: 0.985, wC: 25, crr: 6 },
};
for (const S of Object.values(SHAPES)) { S.half = Math.PI / S.N; S.s = 2 * S.R * Math.sin(S.half); S.a = S.R * Math.cos(S.half); S.I = S.kI * S.R * S.R; }
const DEG = Math.PI / 180;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
// 止まった位置（端までの距離 m）→ 点
function ptsOf(d) { const mm = d * 1000; return mm < PH.GIRI * 1000 ? 100 : Math.max(1, Math.round(90 * Math.exp(-mm / 13))); }

/* 鉛筆 i 本目（0 から）: だんだん遠く・曲がる・転がる鉛筆がまざる。上限は決めず、ゆっくり難しくなる */
const PAINTS = ['#2f6b4a', '#b8322c', '#2b4f8c', '#d9a62a', '#6b3f8a', '#1f1f22', '#c96f2a', '#3c8a8a'];
function makePencilSpec(rnd, i) {
  const kind = i < 2 ? 'hex' : rnd() < Math.min(0.34, 0.07 * (i - 1)) ? 'round' : 'hex';
  const lr = rnd();
  const len = i === 0 ? 0.175 : i < 3 ? (lr < 0.6 ? 0.175 : 0.128) : lr < 0.42 ? 0.175 : lr < 0.72 ? 0.128 : 0.068 + rnd() * 0.022;
  const er = rnd();
  const end = i < 2 ? 'none' : er < Math.min(0.3, 0.05 * (i - 1)) ? 'cap' : er < 0.55 ? 'eraser' : 'none';
  const tipSide = rnd() < 0.5 ? 1 : -1;                        // 削ってある先が +x 側か
  const S = SHAPES[kind];
  // 太いほうの端（キャップは削った側、消しゴムは反対側）と、太さのちがい
  const dr = end === 'cap' ? 0.0011 : end === 'eraser' ? 0.0003 : 0;
  const thick = end === 'cap' ? tipSide : -tipSide;
  const Lc = len * 0.86, kap = dr / ((S.R + dr / 2) * Lc) * thick;
  const mf = Math.max(0.36, len / 0.175 + (end === 'cap' ? 0.1 : 0));
  const D0 = i === 0 ? 0.17 : 0.165 + 0.09 * (1 - Math.exp(-i / 9)) + rnd() * 0.04;
  const x0 = i === 0 ? 0 : (rnd() - 0.5) * 0.08;
  const psi0 = i === 0 ? 0 : clampP(gaussR(rnd) * Math.min(7, 1.5 + 0.5 * i) * DEG, -12 * DEG, 12 * DEG);
  const paint = kind === 'round' && rnd() < 0.5 ? 'akaao' : PAINTS[Math.floor(rnd() * PAINTS.length)];
  const wear = rnd();
  return { i, kind, len, end, tipSide, thick, dr, Lc, kap, mf, D0, x0, psi0, paint, wear };
}
function newPencilState(spec) {
  const S = SHAPES[spec.kind];
  return { spec, S, x: spec.x0, z: PH.Z_E + spec.D0, y: S.a, psi: spec.psi0, psiT: spec.psi0, phi: 0, th: -S.half, w: 0, piv: 'v', rho: S.R, thFlat: 0, st: 'rest', kap: spec.kap, Lc: spec.Lc, dist: 0,
    vx: 0, vy: 0, vz: 0, hit: new Set(), wob: 0, bumps: 0, lastImp: 0 };
}
// 衝突のあとの回転の残り（物理の値と、速いときの値をまぜる）
function keep(S, ratio, w) { const w2 = w * w, c2 = S.wC * S.wC, f = w2 * w2 / (w2 * w2 + c2 * c2); return ratio + (S.rFast - ratio) * f; }
function moveTo(P, th) {
  const du = P.rho * (Math.sin(th) - Math.sin(P.th));
  P.phi += th - P.th; P.th = th;
  P.x += du * Math.sin(P.psi); P.z -= du * Math.cos(P.psi);
  const dpsi = du * P.kap; P.psi -= dpsi; P.psiT -= dpsi;
  P.y = P.rho * Math.cos(th); P.dist += du;
}
function restP(P, ev) { P.st = 'rest'; P.w = 0; ev.push({ type: 'rest' }); }
function startFall(P, ev, side) {
  const vu = P.rho * P.w * Math.cos(P.th), vy = -P.rho * P.w * Math.sin(P.th);
  P.vx = vu * Math.sin(P.psi); P.vz = -vu * Math.cos(P.psi); P.vy = vy;
  P.st = 'fall'; P.landed = false; ev.push({ type: 'fall', side: !!side });
}
// 角が机に着いた（前へ）: 次の角が机の上か、はみ出して端のかどに乗るか
function impactFwd(P, ev) {
  const S = P.S, cp = Math.max(0.2, Math.cos(P.psi));
  const eU = (P.z - PH.Z_E) / cp, eP = eU + S.s / 2;      // 支点から端のかどまで（転がる向きに）
  const w0 = P.w;
  if (S.s <= eP) {
    const ratio = (S.I + S.R * S.R * Math.cos(2 * S.half)) / (S.I + S.R * S.R);
    P.w *= keep(S, ratio, P.w); P.th = -S.half;
    ev.push({ type: 'tok', w: w0, edge: false });
    if (Math.abs(P.w) < PH.W_REST) restP(P, ev);
    return;
  }
  if (eP <= 1e-5) { startFall(P, ev); return; }
  const cu = S.s / 2 - eP, rhoE = Math.hypot(cu, S.a);
  const ratio = (S.I + cu * S.s / 2 + S.a * S.a) / (S.I + rhoE * rhoE);
  P.w *= keep(S, ratio, P.w); P.piv = 'e'; P.rho = rhoE; P.th = Math.atan2(cu, S.a); P.thFlat = P.th; P.eP = eP;
  P.y = S.a;
  ev.push({ type: 'tok', w: w0, edge: true });
  if (cu < 0 && Math.abs(P.w) < PH.W_REST) restP(P, ev);
}
function impactBack(P, ev) {
  const S = P.S, w0 = P.w;
  const ratio = (S.I + S.R * S.R * Math.cos(2 * S.half)) / (S.I + S.R * S.R);
  P.w *= keep(S, ratio, P.w); P.th = S.half;
  ev.push({ type: 'tok', w: w0, back: true });
  if (Math.abs(P.w) < PH.W_REST) restP(P, ev);
}

// 六角の角が机に着く「カタ」（低めの木の音）。丸は もっとやわらかい「とっ」
function sTok(w, N, edge) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(w / 40, 0.15, 1) * (N === 6 ? 1 : 0.6); tone(N === 6 ? 330 : 250, n0, 0.035, 0.07 * k, 'triangle', N === 6 ? 280 : 220); noise(n0, 0.025, 0.08 * k, 'bandpass', N === 6 ? 620 : 480, 1.3, 900); if (edge) tone(180, n0 + 0.01, 0.07, 0.05 * k, 'sine', 150); } catch {} }

function sPlace() { try { if (!live()) return; const n0 = ac.currentTime + 0.42; tone(210, n0, 0.06, 0.06, 'triangle', 170); noise(n0, 0.03, 0.05, 'bandpass', 500, 1.2, 800); } catch {} }

function sLand(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 3, 0.35, 1); tone(520, n0, 0.18, 0.09 * k, 'triangle', 500); tone(760, n0, 0.12, 0.04 * k, 'sine', 740); tone(150, n0, 0.08, 0.12 * k, 'sine', 110); noise(n0, 0.05, 0.1 * k, 'bandpass', 700, 1.1, 1000); tone(470, n0 + 0.13, 0.12, 0.05 * k, 'triangle', 450); noise(n0 + 0.13, 0.03, 0.05 * k, 'bandpass', 650, 1.2, 950); } catch {} }

function sGiri() { try { if (!live()) return; const n0 = ac.currentTime + 0.05; [[392, 0], [523, 0.09], [659, 0.18], [784, 0.3]].forEach(([f, t]) => tone(f, n0 + t, 0.45, 0.05)); } catch {} }
function sFail() { try { if (!live()) return; const n0 = ac.currentTime + 0.05; tone(262, n0, 0.14, 0.05, 'triangle'); tone(196, n0 + 0.16, 0.42, 0.06, 'sine', 170); } catch {} }
function sChime() { try { if (!live()) return; const n0 = ac.currentTime + 0.5; [[523, 0], [659, 0.1], [784, 0.2]].forEach(([f, t]) => tone(f, n0 + t, 0.45, 0.04)); } catch {} }

function sBell() { try { if (!ac) return; const n0 = ac.currentTime + 0.05; [[330, 0], [262, 0.55], [294, 1.1], [196, 1.65]].forEach(([f, t]) => { tone(f, n0 + t, 1.1, 0.06); tone(f * 2, n0 + t, 0.5, 0.012); }); } catch {} }
// 転がっている間の音量
function updateRumble() {
  if (!rumble || !ac) return;
  let v = 0;
  const g = game;
  if (g && state === 'play' && g.P.st === 'roll' && !frozen) {
    const P = g.P, rate = Math.abs(P.w) / (2 * Math.PI / P.S.N);
    if (rate > 14) v = clamp(Math.abs(P.w) * P.S.a / 1.6, 0, 1) * clamp((rate - 14) / 20, 0, 1);

  }
  rumble.g.gain.setTargetAtTime(v * 0.22, ac.currentTime, 0.04);
}

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  step(dt);
  render(Math.max(dt, 1 / 240));
  updateRumble();
  requestAnimationFrame(frame);
}

/* ---------- 入力: 画面を押して手前へ引いて離す。強さ・向きは「離した瞬間の位置」だけで決まる（引く速さは関係ない）。時刻つきで物理へ ---------- */
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true;
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(nextSeed(), bn); frozen = false;
  // #debug&skip=秒: その秒数だけ一気に進め、鉛筆が端で傾いている（ぐらっ）瞬間で止める（OGP 撮影・確認用。bot=good と組み合わせる。freeze=1 で止めたまま）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'edge');
  if (HASH.has('debug') && HASH.get('ff') === '1') ff = true;
}
// pose=edge: 指定の秒数のあと、つぎの鉛筆は「はみ出して止まる」引きで転がし、端のかどで いちばん傾いたところで止める。pose=stop: 止まった瞬間。pose=none: その秒数ちょうど
function skipTo(t1, pose = 'none') {
  const quiet = state; state = 'skip';
  const lim = t1 + 400;
  let ogp = false, maxTilt = 0, armed = false;
  while (game.phase !== 'over' && game.t < lim) {
    if (game.t >= t1) {
      if (pose === 'none') break;
      if (pose === 'stop' && game.phase === 'stop' && game.pt < 0.002) break;
      if (pose === 'edge') {
        if (!ogp && bot && game.phase === 'aim' && !(bot.plan && bot.plan.aimed)) { bot = makeBot(game, { ...SKILLS.good, giri: true, pSd: 0, bSd: 0, xSd: 0, react: [0.3, 0.3] }, mulberry(game.seed + 5)); ogp = true; }
        const P = game.P;
        if (ogp && game.phase === 'roll' && P.piv === 'e') { armed = true; const tl = P.th - P.thFlat; maxTilt = Math.max(maxTilt, tl); if (tl > 0.02 && P.w < 0 && tl > maxTilt * 0.9) break; }
        if (armed && game.phase === 'stop') break;
      }
    }
    if (bot) bot.step(); stepGame(game);
    if (game.events.length) handleEvents();
  }
  state = quiet;
  pops = []; failAt = game.phase === 'over' ? tt : -1; shake = 0;
  if (game.phase === 'stop') stopInfo = { t: tt - 1, d: game.last.d, pts: game.last.pts, giri: game.last.giri, over: game.last.over, x: game.P.x, z: game.P.z };
  syncCrumbs(game);
  camTarget(); camNow.pos.copy(camT.pos); camNow.look.copy(camT.look); camNow.fov = camT.fov;
  base = performance.now() / 1000 - game.t;
  if (HASH.get('freeze') === '1') frozen = true;
}
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game) return;
  if (game.phase === 'over') { if (failAt >= 0 && tt - failAt > 0.4) showOver(); return; }
  if (bot) return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  kb = null;
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, moved: false };
  input('aim', evTime(e));
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;

addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  // 離したところで決まる（move が来ていなくても、離した位置を使う）
  const d = drag; drag = null;
  const a = pullToAim(e.clientX - d.x0, e.clientY - d.y0);

// キーボード: スペース長押し = 強さ（KB_T 秒でいっぱい）、離してはじく。←→ = 向き

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ入力（時刻つき）の列を、fps コマ割りで物理に流しなおす（入力はそのコマで届くが、物理はその時刻で効く）
  const replay = (log, seedR, fps) => {
    const g = makeGame(seedR); let i = 0, tNow = 0;
    while (g.phase !== 'over' && tNow < 4000) {
      tNow += 1 / fps;
      while (i < log.length && log[i].t <= tNow) { gInput(g, Math.max(g.t, log[i].t + PH.DT * 0.5), log[i].type, log[i].a, log[i].b); i++; }
      while (g.t + PH.DT <= tNow) { stepGame(g); g.events.length = 0; }

  const aimNow = (dT = 0.015) => {

    const dxN = clamp(g.P.psi / PH.TW, -1, 1), p = solveP(g, dxN, dT), r = simRoll(g, p, dxN), L = pullL();
    const from = { x: Math.round(W / 2), y: Math.round(H * 0.55) };
    return { p: r3(p), dxN: r3(dxN), expectMm: r.fell ? 'fall' : r1(r.d * 1000), L: Math.round(L), from, to: { x: Math.round(from.x + dxN * L), y: Math.round(from.y + p * L) }, hint: r3(hintP(g)) };
  };
  window.__enpitsu = {
    info: () => {
      if (!game) return null;
      const g = game, P = g.P, sp = g.spec;
      return {
        state, phase: g.phase, t: r3(g.t), n: g.n, score: g.score, giri: g.giri, fail: g.fail, flicks: g.flicks, idle: r1(g.idle), ready: g.phase === 'aim',
        pencil: { i: sp.i, kind: sp.kind, len: sp.len, end: sp.end, paint: sp.paint, D0mm: r1(sp.D0 * 1000), curvDegPerCm: r3(sp.kap * 0.01 / DEG), st: P.st, piv: P.piv, w: r1(P.w), x: r3(P.x), z: r3(P.z), y: r3(P.y), psiDeg: r1(P.psi / DEG), dEdgeMm: r1((P.z - PH.Z_E) * 1000), tiltDeg: P.piv === 'e' ? r1((P.th - P.thFlat) / DEG) : 0 },
        last: g.last && { d: r1(g.last.d * 1000), pts: g.last.pts, giri: g.last.giri },
        crumbs: g.feats.filter(f => f.type === 'c').length, grooves: g.grooves.length,
        aim: g.phase === 'aim' || g.phase === 'ready' ? aimNow() : null,
        pencilScreen: scr(P.x, P.y, P.z), edgeScreen: scr(P.x, 0, PH.Z_E),
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, queue: g.queue.length,
      };
    },
    aim: aimNow,
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [本数...]
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n), s = R.map(r => r.score);
      const fails = {}; for (const r of R) fails[r.fail] = (fails[r.fail] || 0) + 1;
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge1: R.filter(r => r.n >= 1).length / N, ge10: R.filter(r => r.n >= 10).length / N, ge20: R.filter(r => r.n >= 20).length / N, ge50: R.filter(r => r.n >= 50).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), score50: q(s, 0.5), score90: q(s, 0.9), giriMean: +(R.reduce((a, r) => a + r.giri, 0) / N).toFixed(2), fails };

    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },

    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）
    screen: (x, y, z) => scr(x, y, z),
    pencilScreen: () => scr(game.P.x, game.P.y, game.P.z),
    edgeScreen: () => scr(game.P.x, 0, PH.Z_E),
    tapPoint: () => ({ x: Math.round(W / 2), y: Math.round(H * 0.55) }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    cam: () => ({ pos: camNow.pos.toArray().map(r3), look: camNow.look.toArray().map(r3), fov: r1(camNow.fov), target: (camTarget(), { pos: camT.pos.toArray().map(r3), look: camT.look.toArray().map(r3) }) }),
    PH, SHAPES, SKILLS, makeGame, runBot, stepGame, gInput, simRoll, solveP, game: () => game,
  };
}
