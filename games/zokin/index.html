<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 雑巾がけの 物理（three には 頼らない 自前。長さ m・時間 秒・速さ m/s） ----------
   体: 両手で 雑巾を 押し、足で 床を けって 進む 四つんばい。手（雑巾）と 足の 2点で 支える。廊下に 沿った 道のり s と 横の 寄り y（右が +）。
   腰の 高さ h（0〜1）: 押している 間 RISE で 上がり、離すと FALL で 下がる。h < KNEE_H で ひざが 床に ついて ブレーキ（KNEE）。
   ける（押した 瞬間）: 足が 床に ついて いれば 強い。けった 足が 前へ もどって 着く までが TR0 + TR1·h 秒（腰が 高いほど 大また = 長い）。
     着く 前に けると 空ぶり（Q_AIR）、着いて から 遅れると だんだん 弱い（E_LATE, W_LATE）。
     強さ S = K0·(KH0 + KH1·h)·q·(1 − FAT·疲れ)·足の グリップ。前への 加速は 足の 速さの 限界 VM0 + VM1·h に 近いほど 小さい。
     押した 場所が 左右に ずれて いれば ななめに けって 横へ 寄る（LAT）。
   雑巾の すべり摩擦: 手に かかる 重さ（NH0 + NH1·h）× 床の μ × g で 減速。ざらざらは 速いほど 引っかかる（mu1）。
   前のめり p: 減速が 腰の 高さで 決まる 限界 AC0 − AC1·h を こえた ぶん だけ 前へ 回る（KP）。限界より 下なら 戻る（PR）。
     けるたびに 腰が 前へ 出る（KICK_P）。継ぎ目を こえると がくっ（SEAM_P·h·(v/4)²）。p ≥ 1 で 顔から つんのめり。
   手が 流れる st: すべる 床で けると 力が 雑巾を 前へ 押し出す（slip·S·(1.15 − h)·STK）。床の グリップで もどる（rs）。st ≥ 1 で 腹ばい すてーん。
   横: 横の 速さは 床の 横の 摩擦（lat）で 消える。壁に こすると 減速（WALL）。
   曲がり角: 半径 R_ARC − 曲がる側·y の 円を 回れる 速さ √(A_TURN·r) より 速いと まがれず 正面の 壁に ごつん。
   疲れ F: けるたびに たまり（FK）、けらずに すべって いる 間は 少し もどる。
   友達・バケツ・ほうき: 体（手の 先 +0.55 m 〜 足 −0.75 m、幅 ±0.3 m）が 重なれば ぶつかる。ほうきの 子は 左右に ゆれる。
   止まる: けってから 0.6 秒 以上 たって 速さ V_STOP 未満が T_STOP 秒。何も しないと T_IDLE 秒で おしまい。
   記録 = 止まった ところ（転んだら すべって 止まった ところ）までの 道のり。入力は すべて 時刻つき（画面の コマには よらない）。物理は 1/120 秒きざみ。 */
const PH = {
  DT: 1 / 120, G: 9.8, YW: 1.0, HW: 1.3, R_ARC: 1.3, BODY_F: 0.55, BODY_B: 0.75, BODY_W: 0.3,
  RISE: 1.8, FALL: 1.3, H0: 0.5,
  K0: 1.55, KH0: 0.45, KH1: 0.85, VM0: 3.7, VM1: 4.5, LAT: 0.7, FAT: 0.55,
  TR0: 0.30, TR1: 0.30, TRN: 0.05, E_EARLY: 0.04, E_LATE: 0.20, W_EARLY: 0.05, W_LATE: 0.30, Q_AIR: 0.3, Q_MIN: 0.4,
  NH0: 0.5, NH1: 0.3, KNEE_H: 0.1, KNEE: 1.6,
  AC0: 3.2, AC1: 2.4, KP: 2.2, PR: 1.5, KICK_P: 0.065, SEAM_P: 0.45, SEAM_V: 0.06,
  STK: 0.7, WALL: 3.0, WALL_V: 1.2, WALL_T: 0.6,
  FK: 0.003, F_T: 0.0036, F_REST: 0.016, F_RT: 0.7, T_SLOW: 4, D_SLOW: 1.6,
  A_TURN: 3.6, V_STOP: 0.1, T_STOP: 1.8, T_IDLE: 8, T_FALL: 1.3,
};
const FLOOR = {
  wood: { mu: 0.12, mu1: 0, grip: 1, slip: 0.15, lat: 3, rs: 0.45, slide: 1.6 },
  wax: { mu: 0.065, mu1: 0, grip: 0.85, slip: 0.35, lat: 1.4, rs: 0.35, slide: 1.0 },
  wet: { mu: 0.035, mu1: 0, grip: 0.55, slip: 1.0, lat: 0.6, rs: 0.25, slide: 0.8 },
  rough: { mu: 0.2, mu1: 0.04, grip: 1.1, slip: 0, lat: 5, rs: 1.2, slide: 2.4 },
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const gaussR = r => (r() + r() + r() + r() - 2) * 1.732;
const ARC_L = Math.PI / 2 * PH.R_ARC;
const COURSE_END = 3000;
const ROOMS = (() => {
  const a = [], sp = ['図工室', '音楽室', '理科室', '家庭科室', '図書室', '職員室'];
  for (let y = 1; y <= 6; y++) { for (let c = 1; c <= 4; c++) a.push(`${y}年${c}組`); a.push(sp[y - 1]); }
  for (const r of ['校長室', '保健室', '放送室', '視聴覚室', '会議室', '児童会室', 'PC室', '倉庫', '用務員室', '体育倉庫']) a.push(r);
  return a;
})();
const roomAt = n => n < ROOMS.length ? ROOMS[n] : (n % 2 ? '旧' : '別館 ') + ROOMS[n % ROOMS.length];
// 廊下（決まった seed で 毎回 同じ）: まっすぐ → 曲がり角（右・左 かわりばんこ）→ まっすぐ …。床の すべり・継ぎ目・友達・バケツ・ほうき
const courseCache = new Map();
function makeCourse(seed) {
  if (courseCache.has(seed)) return courseCache.get(seed);
  const R = mulberry((seed ^ 0x9e3779b9) >>> 0), U = (a, b) => a + (b - a) * R();
  const segs = [], arcs = [];
  let s = 0, x = 0, z = 0, phi = 0, turn = R() < 0.5 ? 1 : -1;
  for (let k = 0; s < COURSE_END + 200; k++) {
    const kind = k % 4 === 3 ? 'watari' : 'hall', nextKind = (k + 1) % 4 === 3 ? 'watari' : 'hall';
    const L = k === 0 ? U(44, 54) : kind === 'watari' ? U(24, 34) : U(55, 85);
    const ck = nextKind === 'watari' || kind === 'watari' ? 'watari' : k % 2 ? 'odoriba' : 'kado';
    segs.push({ k, s0: s, L, x, z, phi, kind, turn, ck });
    s += L;
    const bx = x + Math.sin(phi) * L, bz = z + Math.cos(phi) * L, rx = -Math.cos(phi) * turn, rz = Math.sin(phi) * turn;
    arcs.push({ s0: s, s1: s + ARC_L, turn, k, ck, bx, bz, phi, cx: bx + rx * PH.R_ARC, cz: bz + rz * PH.R_ARC });
    x = bx + Math.sin(phi) * PH.R_ARC + rx * PH.R_ARC; z = bz + Math.cos(phi) * PH.R_ARC + rz * PH.R_ARC;
    s += ARC_L; phi -= turn * Math.PI / 2; turn = -turn;
  }
  const arcNear = (a, b, m0 = 1.5, m1 = 1) => arcs.find(r => b > r.s0 - m0 && a < r.s1 + m1);
  // 床
  let patches = [];
  const seams = [];
  let c = U(17, 22);
  while (c < COURSE_END) {
    const hard = Math.min(2.5, c / 250), r = R();
    const type = r < 0.32 ? 'wax' : r < 0.58 ? 'rough' : r < 0.82 ? 'wet' : 'seam';
    const len = type === 'wax' ? U(7, 18) : type === 'rough' ? U(1.0, 2.2) + hard * 0.8 : type === 'wet' ? U(3, 6) + hard * 3 : 0;
    const ar = arcNear(c, c + len);
    if (ar) { c = ar.s1 + U(2, 5); continue; }
    if (type === 'seam') seams.push(c); else patches.push({ a: c, b: c + len, type });
    c += len + U(5, 13) * 1.1 / (1 + 0.5 * hard);
  }
  for (const sg of segs) if (sg.k > 0) seams.push(sg.s0 + 0.4);   // 校舎の 継ぎ目（曲がった すぐ あと）
  // 人・もの
