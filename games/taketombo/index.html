<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 竹とんぼの物理（three には頼らない。単位は m・秒・rad。判定は全部この結果から） ----------
   こする: 指の左右 = 手のひら（単位 U。スマホなら 1U ≒ 画面の幅の 9 割、PC は 560px まで）。
     右へこする = 右手を前へ押し出す「押し」。手のひらと軸はすべり摩擦でつながっていて、
     手のひらの速さ > 軸の表面の速さ なら回転が上がり、遅ければ逆にブレーキになる（遅いこすりは損）。
     左へ戻すときは手のひらをゆるめる（押しつけ GRIP_BACK だけ。少しブレーキ）。戻している間も空気で回転は落ちる
     → 速く・リズムよく・何回か こするほど回る。
   ぶれ: こすりの速さ・間隔がバラバラ、指が上下にゆれる、こすりすぎ（TIRED 秒より長い）で、軸がぶれる（wob）。
   放す: 指を離した瞬間に飛ぶ。そのときの手のひらの位置（こすりの真ん中からのずれ）・戻し中かどうか・
     指の上下の動き・ぶれ で、軸の最初の傾きが決まる。
   飛ぶ: 羽根（ねじれ角 PITCH）が回ると、羽根の迎え角 = PITCH − 流入角 に応じて揚力（∝ 速さ²）。
     上がるほど流入角が大きくなり迎え角が減る（だから上昇速度には限りがある）。回転は羽根の抗力と
     揚力の後ろ向き成分で減っていく。回転が落ちると揚力が重さを下回って失速、ひらひら落ちる。
     羽根が自分で吹き下ろす風（誘導速度）も流入に入る。推力は軸の向き。軸が傾くと横へ流れて上へ行く力が減り、
     横風を受けてさらに傾こうとする。回転が速いほどジャイロで傾きが乱されにくく、起き上がる。
     弱い風（上ほど少し強い）に流される。最高到達点（地面から）が記録。 */
const PDEG = Math.PI / 180;
const PH = {
  DT: 1 / 240, G: 9.81,
  H0: 1.3,                       // 放す高さ（胸の前）
  // 手のひら
  PALM_TAU: 0.012,               // 手のひらが指を追う遅れ
  S_MAX: 0.62,                   // 手のひらが動ける幅（±U）
  GAIN: 110,                     // 手のひらの速さ U/s → すべらず転がるときの回転 rad/s（軸の半径の逆数ぶん）
  ACC: 2400,                     // こすって上げられる角加速度の上限 rad/s²（すべり摩擦）
  VSLIP: 0.9,                    // すべりのなめらかさ U/s
  GRIP_BACK: 0.025,              // 戻すときの押しつけ（ゆるめる）
  // ぶれ（wob）と放したときの傾き
  K_IRR: 0.2,                    // こすりの速さ・間隔がバラバラ（1こすりごと）
  K_Y: 0.12,                     // 指の上下のゆれ
  TIRED: 2.6, K_TIRED: 0.09,     // こすりすぎ（秒）
  WOB_TAU: 1.6, WOB_MAX: 0.7,    // ぶれは少しずつおさまる
  T_OFF: 0.6,                    // こすりの真ん中からずれた位置で離す → 傾く（rad / U）
  T_BACK: 0.08,                  // 戻している途中で離す → 傾く（rad / (U/s)）
  T_Y: 0.05,                     // 離す瞬間の指の上下 → 前後に傾く
  T_WOB: 0.9,                    // ぶれ → 向きのわからない傾き
  MIN_LAUNCH: 60,                // これより回っていないと、離しても手からこぼれるだけ（指を離しても持ったまま）
  V0: 0.9,                       // 放すときの上向きの速さ（手を開く勢い）
  // 羽根と空気（質量あたり）
  R_EFF: 0.065,                  // 羽根の代表半径（翼端の 7 割ほど）
  PITCH: 18 * PDEG, STALL: 21 * PDEG,
  CD0: 0.012, KI: 0.05,          // 羽根の抗力: 形の抗力 + 揚力を出すほど増える抗力（誘導抗力）
  KIV: 0.3,                      // 誘導速度 = KIV·√推力（運動量理論。重さとつりあうとき 0.9 m/s ほど）
  KA: 0.5,                       // 揚力・抗力の係数（ρ·面積/2/質量）。ω≒78 rad/s（毎秒12回転）で重さとつりあう
  KQ: 2.0,                       // 羽根の力 → 回転の減り（半径/慣性モーメント × 質量）
  C1: 0.09,                      // 軸受け・軸の空気抵抗
  KH: 0.3,                       // 回転面に沿った空気抵抗（ローターの H 力）
  CB: 0.35,                      // 胴の空気抵抗
  CF: 0.3,                       // 回転が落ちてからの「ひらひら」抵抗
  // 傾き
  KG: 0.5,                       // 傾きが傾きを呼ぶ
  KR: 0.6, W_R: 140,             // 起き上がり（回転が速いほど効く）
  SIG: 0.55, W_G: 55,            // 乱れ（回転が遅いほど大きい）
  KP: 25,                        // ジャイロの歳差（傾きの向きがゆっくり回る）
  TMAX: 1.35,
  WIND: 0.55,                    // 弱い風 m/s（上ほど少し強い）
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function liftC(a) { return Math.abs(a) <= PH.STALL ? 2 * Math.PI * a : 1.05 * Math.sin(2 * a); }
function dragC(a) { const s = Math.sin(a), c = Math.abs(a) <= PH.STALL ? 2 * Math.PI * a : 0; return PH.CD0 + PH.KI * c * c + 1.2 * s * s; }

function makeSim(seed = 1) {
  const rnd = mulberry(seed);
  const wph = [rnd() * 6.283, rnd() * 6.283, rnd() * 6.283], wdir = rnd() * 6.283;
  const g = {
    t: 0, phase: 'hold', omega: 0, ang: 0,
    p: { x: 0, y: PH.H0, z: 0 }, v: { x: 0, y: 0, z: 0 }, tau: { x: 0, z: 0 }, n: { x: 0, y: 1, z: 0 },
    palm: { s: 0, v: 0, tgt: 0, y: 0, vy: 0, ty: 0 },
    wob: 0, strokes: 0, firstT: -1, center: 0, dir: 0, turnL: 0, turnR: 0, st: null, lastPk: 0, lastStart: -1, lastPer: 0, rubT: 0,
    thr: 0, maxH: PH.H0, flyT: 0, downT: 0, rel: null, peakOmega: 0, maxVy: 0, events: [],
  };
  // 風: 向きと強さがゆっくり変わる。上ほど少し強い
  g.wind = (t, y) => {
    const m = PH.WIND * (1 + 0.45 * Math.sin(0.29 * t + wph[0]) + 0.3 * Math.sin(0.83 * t + wph[1])) * (0.45 + 0.55 * Math.min(1, Math.max(0, y) / 25));
    const d = wdir + 0.5 * Math.sin(0.13 * t + wph[2]);
    return { x: m * Math.cos(d), y: 0, z: m * Math.sin(d) };
  };
  g.groundAt = () => 0;   // 着地する面の高さ（ゲーム側で屋根などを足す）
  g.setInput = (s, y) => { g.palm.tgt = s; g.palm.ty = y; };
  g.release = () => {
    if (g.phase !== 'hold') return false;
    if (g.omega < PH.MIN_LAUNCH) { g.events.push({ type: 'weak' }); return false; }
    const pl = g.palm, off = pl.s - g.center;
    let tx = PH.T_OFF * off + (pl.v < -0.3 ? PH.T_BACK * pl.v : 0);
    let tz = PH.T_Y * clampP(pl.vy, -6, 6);
    const a = rnd() * 2 * Math.PI, wm = PH.T_WOB * g.wob * (0.5 + 0.5 * rnd());
    tx += Math.cos(a) * wm; tz += Math.sin(a) * wm;
    const tl = Math.hypot(tx, tz); if (tl > PH.TMAX) { tx *= PH.TMAX / tl; tz *= PH.TMAX / tl; }
    g.tau = { x: tx, z: tz };
    g.v = { x: 0, y: PH.V0, z: 0 };
    g.phase = 'fly'; g.flyT = 0;
    g.rel = { omega: g.omega, tilt: Math.hypot(tx, tz), tiltOff: Math.abs(PH.T_OFF * off), tiltBack: pl.v < -0.3 ? Math.abs(PH.T_BACK * pl.v) : 0, tiltY: Math.abs(tz - Math.sin(a) * wm), tiltWob: wm, wob: g.wob, strokes: g.strokes, rubT: g.rubT, palmV: pl.v, off };
    g.peakOmega = g.omega;
    g.events.push({ type: 'launch', omega: g.omega });
    return true;
  };
  function stepHold(dt) {
    const pl = g.palm, k = 1 - Math.exp(-dt / PH.PALM_TAU);
    const s0 = pl.s; pl.s += (clampP(pl.tgt, -PH.S_MAX, PH.S_MAX) - pl.s) * k; pl.v = (pl.s - s0) / dt;
    const y0 = pl.y; pl.y += (pl.ty - pl.y) * k; pl.vy = (pl.y - y0) / dt;
    // 手のひらと軸のすべり摩擦
    const slip = pl.v - g.omega / PH.GAIN, grip = pl.v > 0.05 && slip > 0 ? 1 : PH.GRIP_BACK;   // 押しが軸に追いつかなくなったら、手は自然にゆるむ
    g.omega += grip * PH.ACC * Math.tanh(slip / PH.VSLIP) * dt;
    // 空気で回転が落ちる（その場で回っているとき）
    const U = g.omega * PH.R_EFF, vi = PH.KIV * Math.sqrt(g.thr), phi = Math.atan2(vi, U), al = PH.PITCH - phi, q = U * U + vi * vi;

  const pts = []; let cur = 0;

    pts,
    add(t, s, y) { while (pts.length && pts[pts.length - 1].t >= t) pts.pop(); pts.push({ t, s, y }); if (pts.length > 6000) { pts.splice(0, 3000); cur = 0; } },
    clearAfter(t) { while (pts.length && pts[pts.length - 1].t > t) pts.pop(); },
    at(t) {
      const n = pts.length;

const simTime = ts => (ts - t0) / 1000;

// 物理を、いまの時刻（少し遅れ）まで進める
function advance(now) {
  if (!game) return;
  if (ff) t0 -= (now - (advance.last || now)) * 6;       // 早送り（落ちてくるのを待たない）
  advance.last = now;
  let target = simTime(now) - lagS, n = 0;
  while (game.t + PH.DT <= target && n < 1200) {
    if (game.phase === 'hold') {
      const p = plan ? plan.at(game.t) : track.at(game.t);
      game.setInput(p.s, p.y);
      if (plan && game.t >= plan.relT && pendingRel < 0) pendingRel = game.t;
      if (pendingRel >= 0 && game.t >= pendingRel) { pendingRel = -1; if (!game.release() && plan) plan.relT += 0.3; }
    }
    game.step(); handleEvents(); n++;
  }
  if (n >= 1200) t0 = now - (game.t + lagS) * 1000;   // 長く止まっていたら、そこから再開
}
function handleEvents() {
  const loud = state === 'play';
  for (const e of game.events) {
    if (e.type === 'launch') { handsOpen = 0.001; if (loud) sLaunch(e.omega); }
    else if (e.type === 'weak') { weakT = tt; }
    else if (e.type === 'stroke') { lastStroke = tt; if (loud) sStroke(e.pk); }
    else if (e.type === 'land') { landAt = tt; if (loud) sLand(e.v); ff = false; }
  }
  game.events.length = 0;
  // 目印をこえた（物理の最高点で）
  while (crossed < MARKS.length && game.maxH > MARKS[crossed].h) {
    const m = MARKS[crossed++];
    if (state === 'play') { addPop(m.pop, m.h >= 9); sCross(m.h); }
  }
  if (state === 'play' && rec.best > 0 && !newShown && game.maxH > rec.best && rec.plays > 0) { newShown = true; addPop('自己ベスト更新！', true, true); sChime(); }
}
function addPop(text, hot, big) { pops = pops.filter(p => p.big); pops.push({ text, hot, big, life: 0, dur: big ? 1.8 : 1.3 }); }

function step(dt, now) {
  tt += dt;
  advance(now);
  if (state === 'title') demoStep();
  if (state === 'play' && game.phase === 'down' && landAt >= 0 && tt - landAt > 1.1) showOver();
  for (const p of pops) p.life += dt;
  pops = pops.filter(p => p.life < p.dur);
  if (handsOpen > 0) handsOpen = Math.min(1, handsOpen + dt * 2.2);
}

    rubN.bp.frequency.setTargetAtTime(260 + clamp(pv, 0, 10) * 55, n0, 0.03);
    const w = on ? game.omega : 0, d = on ? camera.position.distanceTo(tombo.position) : 1;
    const f = clamp(w / Math.PI, 22, 210);
    whirr.o1.frequency.setTargetAtTime(f, n0, 0.03); whirr.o2.frequency.setTargetAtTime(f / 2, n0, 0.03);
    whirr.g.gain.setTargetAtTime(on ? clamp(w / 450, 0, 1) * 0.16 / (1 + d / 6) : 0, n0, 0.05);
  } catch {}
}
function tone(freq, at, dur, vol, type = 'sine', f1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at); if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
}
function noise(at, dur, vol, type, freq, q = 1) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(lp).connect(g).connect(master); s.start(at, Math.random()); s.stop(at + dur + 0.05);
  return f;
}
// 1こすりごとの「しゅっ」の芯（速いほど少し大きい）
function sStroke(pk) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(pk / 9, 0.15, 1); noise(n0, 0.08, 0.06 * k, 'bandpass', 520 + 200 * k, 1.2); } catch {} }
// 放した「ひゅん」
function sLaunch(w) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(w / 500, 0.2, 1); const f = noise(n0, 0.35, 0.05 + 0.06 * k, 'bandpass', 300, 1.3); f.frequency.exponentialRampToValueAtTime(700 + 300 * k, n0 + 0.3); tone(180, n0, 0.18, 0.05, 'triangle', 260); } catch {} }
// 目印をこえた「ぽん」（高いほど少し高い音。でも 1kHz まで）
function sCross(h) { try { if (!live()) return; const n0 = ac.currentTime, f = Math.min(990, 440 * Math.pow(1.12, Math.log2(h + 1) * 2)); tone(f, n0, 0.35, 0.07); tone(f * 1.5, n0 + 0.06, 0.3, 0.035); } catch {} }
// 落ちた「ことっ」
function sLand(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 4, 0.3, 1); tone(300, n0, 0.07, 0.08 * k, 'triangle', 240); tone(210, n0 + 0.09, 0.06, 0.05 * k, 'triangle'); noise(n0, 0.05, 0.06 * k, 'lowpass', 700); } catch {} }
function sChime() { try { if (!live()) return; const n0 = ac.currentTime + 0.05; [[523, 0], [659, 0.1], [784, 0.2]].forEach(([f, t]) => tone(f, n0 + t, 0.45, 0.06)); } catch {} }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame(ts) {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  lagS += (clamp(dt * 1.6, 0.04, 0.16) - lagS) * 0.1;
  step(dt, now);
  render(Math.max(dt, 1 / 240));
  setLoops();
  requestAnimationFrame(frame);
}

/* ---------- 入力: 左右にこする（指の位置を時刻つきで記録）・指をはなすと飛ぶ ---------- */
let sessionPlays = 0;
function start() {
  wakeAudio(); state = 'play';
  if (HASH.has('seed')) seed = ((+HASH.get('seed') >>> 0) + 7919 * sessionPlays) >>> 0;   // #seed=N: 何回目のプレイかまで同じなら、同じ風・同じボット
  sessionPlays++;
  $('title').hidden = true; $('over').hidden = true;
  const b = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  newGame(b); advance.last = performance.now();
  // #debug&skip=秒: はじめにその秒数だけ一気に進める（OGP 撮影・確認用。bot=good などと組み合わせる）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'));
}
function skipTo(t1) {
  const quiet = state; state = 'skip';
  while (game.t < t1 && game.phase !== 'down') {
    if (game.phase === 'hold') { const p = plan ? plan.at(game.t) : track.at(game.t); game.setInput(p.s, p.y); if (plan && game.t >= plan.relT) { if (!game.release()) plan.relT += 0.3; } }
    game.step(); handleEvents();
  }
  state = quiet;
  if (game.phase !== 'hold') handsOpen = 1;
  t0 = performance.now() - (game.t + lagS) * 1000; camInit = true;
}
function fingerAt(e) {
  let s = drag.s0 + (e.clientX - drag.x0) / Upx;
  const sc = clamp(s, -PH.S_MAX, PH.S_MAX);
  if (sc !== s) { drag.s0 += sc - s; s = sc; }   // 端で止まったぶんは持ちかえる（戻す向きにはすぐ効く）
  return { s, y: (e.clientY - drag.y0) / Upx };
}
const evTime = e => (e.timeStamp > 1e3 && Math.abs(e.timeStamp - performance.now()) < 5000 ? e.timeStamp : performance.now());
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play') return;
  if (game.phase === 'fly') { if (game.flyT > 1) ff = true; return; }   // 早送り（時間が速く進むだけ。結果は同じ）
  if (game.phase === 'down') { if (landAt >= 0 && tt - landAt > 0.3) showOver(); return; }
  if (plan || drag) return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  const t = simTime(evTime(e));
  const cur = track.at(t);
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, s0: cur.s };
  track.add(Math.max(t, game.t), cur.s, 0);
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || state !== 'play') return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ce of (list.length ? list : [e])) { const f = fingerAt(ce); track.add(Math.max(simTime(evTime(ce)), game.t), f.s, f.y); }
});
function endDrag(e, release) {
  if (!drag || e.pointerId !== drag.id) return;
  drag = null;
  if (release && state === 'play' && game.phase === 'hold') pendingRel = Math.max(simTime(evTime(e)), game.t);
}
addEventListener('pointerup', e => endDrag(e, true));
addEventListener('pointercancel', e => endDrag(e, false));
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: → で右へシュッ（押し）、← で左へ戻す、スペース/↑ で放す
function keyStroke(dir, ts) {
  const t = Math.max(simTime(ts), game.t), cur = track.at(t).s;
  track.clearAfter(t); track.add(t, cur, 0);
  const to = dir > 0 ? 0.3 : -0.3, dur = dir > 0 ? 0.1 : 0.13;
  track.add(t + dur * Math.abs(to - cur) / 0.6 + 0.005, to, 0);
}
addEventListener('keydown', e => {
  if (state === 'play') {
    const c = e.code;
    if (game.phase === 'down') { if ((c === 'Space' || c === 'Enter') && landAt >= 0 && tt - landAt > 0.3) { e.preventDefault(); showOver(); } return; }
    if (game.phase === 'fly') { if (c === 'Space' || c === 'Enter') { e.preventDefault(); if (game.flyT > 1) ff = true; } return; }
    if (plan) return;
    if (c === 'ArrowRight' || c === 'KeyD') { e.preventDefault(); if (!e.repeat) { wakeAudio(); keyStroke(1, evTime(e)); } return; }
    if (c === 'ArrowLeft' || c === 'KeyA') { e.preventDefault(); if (!e.repeat) { wakeAudio(); keyStroke(-1, evTime(e)); } return; }
    if (c === 'Space' || c === 'ArrowUp' || c === 'Enter') { e.preventDefault(); if (!e.repeat && !drag) pendingRel = Math.max(simTime(evTime(e)), game.t); return; }
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});
addEventListener('blur', () => { if (drag) drag = null; });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last, rec.lastMark)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  window.__taketombo = {
    info: () => game && ({ state, phase: game.phase, t: +game.t.toFixed(3), omega: +game.omega.toFixed(1), rps: +RPS(game.omega).toFixed(1), h: +game.p.y.toFixed(2), maxH: +game.maxH.toFixed(2), tilt: +Math.hypot(game.tau.x, game.tau.z).toFixed(3), wob: +game.wob.toFixed(3), strokes: game.strokes, rubT: +game.rubT.toFixed(2), palm: +game.palm.s.toFixed(3), flyT: +game.flyT.toFixed(2), rel: game.rel, ff, rec, seed, W_HOVER }),
    // 物理だけで N 回ぶん: sim('first', 100) → [高さm...]。opts.rate = 指の位置を拾う回数（Hz）
    sim: (skill = 'good', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => +runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).h.toFixed(2)),
    stats: (skill = 'good', N = 100, opts = {}) => { const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), h = R.map(r => r.h); return { skill, N, rate: opts.rate || 'exact', p10: +q(h, 0.1).toFixed(1), p50: +q(h, 0.5).toFixed(1), p90: +q(h, 0.9).toFixed(1), min: +Math.min(...h).toFixed(1), max: +Math.max(...h).toFixed(1), over1m: R.filter(r => r.h - PH.H0 >= 1).length / N, omega50: +q(R.map(r => r.omega), 0.5).toFixed(0), fly50: +q(R.map(r => r.flyT), 0.5).toFixed(1) }; },
    // いまのプレイをボットに任せる（こすっている間なら）
    autoplay: (skill = 'good') => { if (game.phase === 'hold') { const P = makePlan(SKILLS[skill], mulberry(nextSeed())), off = game.t; plan = { relT: P.relT + off, at: t => P.at(t - off) }; } },
    skip: s => skipTo(game.t + s),
    tomboScreen: () => project(game.p.x, game.p.y, game.p.z),
    cam: () => ({ pos: camera.position.toArray().map(v => +v.toFixed(2)), p: [game.p.x, game.p.y, game.p.z].map(v => +v.toFixed(2)), fov: camera.fov }),
    PH, SKILLS, MARKS, makeSim, runBot, makePlan, game: () => game,
  };
}

/* ---------- はじめ ---------- */
// キャンバスに描く字（漢字ふくむ）のぶんのフォントを先に読む
try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789.m回/秒竹とんぼ' + MARKS.map(m => m.pop).join('') + '自己ベスト更新！'), document.fonts.load(`700 16px "Zen Kaku Gothic New"`, '最高回転秒早送りタップで' + MARKS.map(m => m.name).join(''))]), new Promise(r => setTimeout(r, 1500))]); } catch {}
resize();
newDemo();
state = 'title';
fillTitle();
$('startBtn').disabled = false; $('startBtn').textContent = '竹とんぼを持つ';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
