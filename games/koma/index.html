<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dエンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- こまの物理（three には頼らない、自前の剛体の回転。単位は m・秒・rad、質量はこま 1 個 = 1） ----------
   こまは直径 8cm ほどの鉄輪（てつわ）の木ごま。軸対称な剛体で、心棒の先（支点）まわりの慣性モーメントは
   軸まわり I3・横まわり I1。重心は先から HC 上。状態は 向き（クォータニオン）と 支点まわりの角運動量 L（世界座標）。
   毎ステップ dL/dt = トルク を足し、ω = I⁻¹L で向きを回す（sara と同じつくり）。トルク:
     ・重力: 重心 × g。回っていなければただ倒れ、回っているとジャイロ効果で倒れる代わりに首を振る（歳差運動）。
       歳差の速さ ≒ g·HC /(I3·ω)。回転が落ちるほど首振りは速く大きくなり、ω_c = 2√(I1·g·HC)/I3 より遅いと支えきれずに倒れる。
     ・先の摩擦が軸を起こす（回るこまが起き上がる＝「澄む」。先が丸いので TH_MIN くらいまで）。
     ・空気と先の摩擦が軸のぶれ（章動）と首振りを止める。首振りを止められた回るこまは少しずつ寝ていく（ケルビン＝テイト）。
       寝る速さは回転の 2 乗に反比例 → 速いと起き上がる方が勝って澄み、W_STAR より遅いと首振りの円がだんだん広がる。
     ・回転を止める: 先の摩擦（一定）＋傾いて先がすべるぶん（sinθ に比例）＋空気（ω に比例）。
   先の移動: 丸い先が台の上をころがる速さ ρ·ω·(n×上) へ、すべり摩擦 μg で近づく → 傾いたこまは台の上を円を描いて動く。
   投げ: スワイプ（時刻つきの指の位置）から、ひもを引く速さ・向き・最後の止め方を読み、着地のときの回転・傾き・ぶれを決める。
     斜めに着地するとふちがこすれて回転を損する（LAND_K）。
   終わり: 傾きがふちの地面につく角度 FALL をこえた（倒れた）か、先が台のふちから出た（落ちた）時点で秒数が決まる。 */
const DEGP = Math.PI / 180;
const PH = {
  DT: 1 / 1000, G: 9.8,
  R: 0.041, HC: 0.034, I3: 9.6e-4, I1: 1.7e-3,   // こまの半径・先から重心まで・慣性モーメント（1 個あたり、支点まわり）
  RHO: 0.0016, MU: 0.3,                          // 心棒の先の丸みの半径・先のすべり摩擦
  RISE: 0.8, TH_MIN: 1.0 * DEGP,                 // 先の摩擦で軸が起きる速さ（1/s）・起ききる傾き
  NUT: 18,                                        // 軸のぶれ・首振りを止める強さ（I3 あたり）
  A0: 3.5, A1: 15, B: 0.004,                      // 回転の減り: 先の摩擦 rad/s²・傾いてすべるぶん rad/s²・空気 1/s
  FALL: Math.atan2(0.038, 0.041),                 // 鉄輪のふちが台につく傾き（≒43°）
  BOARD_R: 0.19,                                  // 台の半径
  // 投げ（スワイプ → 着地のときの回転・傾き・ぶれ）
  WIN: 0.09,                                      // 指の速さを測る時間幅（秒）。何コマ目に何が来ても同じになるよう、記録を時刻で補間して読む
  PMIN: 0.08, VMIN: 0.3, P_FULL: 0.3,             // これより短い・遅いスワイプは投げない／この長さ（U）までは短いほど弱い
  W_MIN: 110, W_MAX: 450, V0: 3.2, V_EXP: 1.5,     // 回転 = W_MIN + (W_MAX−W_MIN)·(1−e^(−(v/V0)^V_EXP))·(止め方)
  S_FLICK: 0.3,                                   // 振り抜いた（動いたまま離した）ときの止め方の点
  SNAP_T: 1.1, SNAP_W: 1.2,                       // ピタッ: 最後の道のりの時間の比 r がこれ以下なら満点、＋幅で 0 点
  S_BASE: 0.1,                                    // 止め方が 0 点でも、これだけはひもが引ける
  SLANT: 0.75,                                    // スワイプの傾き → 着地の傾き
  WOB0: 0.03, WOB1: 0.2,                          // 軸のぶれ（章動の円錐の半角）= WOB0 + WOB1·(1−止め方)
  LAND_K: 0.75,                                   // 傾いて着地すると回転を損する割合（sin 傾き あたり）
  X_LAND: 0.2, V_LAND: 0.5,                       // スワイプの傾き → 着地する位置（m/rad）・横の速さ
  FLY_T: 0.34, HAND: [0, 0.13, 0.36],             // 手から台まで飛ぶ時間・手の位置
  // フーッ（タップ）: 軸を上へ起こす。そのぶん回転が落ちる
  BLOW_FRAC: 0.7, BLOW_MAX: 8 * DEGP, BLOW_COST: 1.8, BLOW_CD: 0.45,
  DANGER_TILT: 8 * DEGP,
};
PH.CR = PH.RISE * PH.I3; PH.CA = PH.NUT * PH.I3;
PH.W_STAR = Math.sqrt(PH.NUT * PH.HC * PH.G / (PH.I3 * PH.RISE));        // これより速いと澄み、遅いと首振りが育つ
PH.W_CRIT = 2 * Math.sqrt(PH.I1 * PH.G * PH.HC) / PH.I3;                  // これより遅いとジャイロで支えきれない
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function qrot(q, x, y, z) {
  const qx = q[0], qy = q[1], qz = q[2], qw = q[3];
  const ix = qw * x + qy * z - qz * y, iy = qw * y + qz * x - qx * z, iz = qw * z + qx * y - qy * x, iw = -qx * x - qy * y - qz * z;
  return [ix * qw + iw * -qx + iy * -qz - iz * -qy, iy * qw + iw * -qy + iz * -qx - ix * -qz, iz * qw + iw * -qz + ix * -qy - iy * -qx];
}
function qstep(q, wx, wy, wz, dt) {
  const a = Math.hypot(wx, wy, wz) * dt;
  if (a < 1e-12) return;
  const s = Math.sin(a / 2) / (a / dt), c = Math.cos(a / 2);
  const ax = wx * s, ay = wy * s, az = wz * s;
  const x = q[0], y = q[1], z = q[2], w = q[3];
  q[0] = c * x + ax * w + ay * z - az * y;
  q[1] = c * y + ay * w + az * x - ax * z;
  q[2] = c * z + az * w + ax * y - ay * x;
  q[3] = c * w - ax * x - ay * y - az * z;
  const n = Math.hypot(q[0], q[1], q[2], q[3]); q[0] /= n; q[1] /= n; q[2] /= n; q[3] /= n;
}
// 上向き ŷ を n へ倒す回転
function qTilt(nx, ny, nz) {
  const ax = nz, az = -nx, s = Math.hypot(ax, az);
  if (s < 1e-9) return [0, 0, 0, 1];
  const th = Math.atan2(s, ny), k = Math.sin(th / 2) / s;
  return [ax * k, 0, az * k, Math.cos(th / 2)];
}

/* 指の記録: { t: 秒, x, y: px } を時刻つきで足していき、どの時刻でも補間して読める */
function makeTrack() {
  const pts = []; let cur = 0;
  return {
    pts,
    add(t, x, y) { while (pts.length && pts[pts.length - 1].t >= t) pts.pop(); pts.push({ t, x, y }); if (pts.length > 8000) { pts.splice(0, 4000); cur = 0; } },
    at(t) {
      const n = pts.length;
      if (!n) return { x: 0, y: 0 };
      if (t <= pts[0].t) return { x: pts[0].x, y: pts[0].y };
      const L = pts[n - 1]; if (t >= L.t) return { x: L.x, y: L.y };
      let i = Math.min(cur, n - 2);
      while (i > 0 && pts[i].t > t) i--;
      while (i < n - 2 && pts[i + 1].t <= t) i++;
      cur = i;
      const a = pts[i], b = pts[i + 1], k = (t - a.t) / (b.t - a.t || 1);
      return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
    },
  };
}
/* スワイプを読む: 押した時刻 t0 から離した時刻 tr まで、記録を 2ms ごとに補間して（コマ数・イベントの間隔によらない）
   v = 上への速さ（U/秒、WIN 秒の幅で）。いちばん速いところ・向き・最後の止め方（ピタッと止めたか、だらっと止めたか、振り抜いたか）。 */

/* ---------- 1ステップ ---------- */
function advancePhys(dt) {
  if (!game || frozen) return;
  if (game.phase === 'aim' || game.phase === 'down') return;
  physAcc += dt * (ff ? 6 : 1);
  let k = 0;
  while (physAcc >= PH.DT && k < 1500) { if (bot) bot.step(); game.step(); handleEvents(); physAcc -= PH.DT; k++; if (game.phase === 'down') { physAcc = 0; break; } }
  if (k >= 1500) physAcc = 0;

function step(dt) {
  tt += dt;
  if (game && game.phase === 'aim') {
    aimT += dt;
    if (bot && aimT > (state === 'title' ? 0.2 : 0.8)) { botThrow(); handleEvents(); }
  }
  advancePhys(dt);
  if (state === 'title') demoStep();
  if (state === 'play' && game.phase === 'down' && endAt >= 0 && tt - endAt > 1.6) showOver();
  for (const p of pops) p.life += dt;
  pops = pops.filter(p => p.life < p.dur);

}

  const loud = state === 'play';

    else if (e.type === 'land') {

        const sw = game.thr.sw, rps = Math.round(RPS(e.ws));
        let msg = 'いい投げ！';

        else if (sw.flick && sw.s < 0.5) msg = '振り抜いた…';
        else if (sw.s < 0.45) msg = 'ひもの引きが甘い';
        else if (rps < 22) msg = 'ちょっと弱い';
        else if (rps >= 42 && game.land.tilt < 6 * DEG) msg = 'すばらしい投げ！';
        addPop(msg, { sub: `毎秒 ${rps} 回転`, at: 'mid', dur: 1.8, size: 26 });
      }
    }
    else if (e.type === 'sumu') { if (loud) { addPop('澄んだ！', { sub: 'ぴたりと立って回っている', at: 'mid', dur: 1.6 }); sSumu(); } }
    else if (e.type === 'wobble') { if (loud) { addPop('ぐらぐら…', { sub: 'タップでフーッ', at: 'mid', dur: 1.2 }); if (navigator.vibrate) try { navigator.vibrate(6); } catch {} } }
    else if (e.type === 'blow') { vis.puff = tt; if (loud) sBlow(); }

  }
}

/* ---------- ループ ---------- */
let lastTs = performance.now();

  const now = performance.now();

  step(dt);
  render(Math.max(dt, 1 / 240));
  if (live()) {
    const g = game;
    if (g.phase === 'spin') { const aw = Math.abs(g.ws), wob = clamp(g.tilt / (25 * DEG), 0, 1) * (0.5 + 0.5 * Math.sin(g.prec * 2)); setHum(clamp((aw - 20) / 120, 0.15, 1) * 0.11, aw, wob); }

  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
$('ffBtn').addEventListener('pointerdown', e => e.stopPropagation());
$('ffBtn').addEventListener('click', () => { ff = !ff; $('ffBtn').classList.toggle('on', ff); });
// キーボード: スペース長押し = 腕をひく（メーターが 0.7 秒でいっぱい、ひきすぎると落ちる）、離して投げる。← → で向き
function kbPower(now) { const h = (now - kb.t0) / 1000; return h < 0.7 ? h / 0.7 : Math.max(0.35, 1 - (h - 0.7) * 0.8); }
function kbThrow(now) {
  const h = (now - kb.t0) / 1000, p = kbPower(now), t0 = now / 1000, T = 0.32 - 0.18 * p, D = 0.3 + 0.3 * p, ang = kb.dir * 14 * DEG;
  // メーターから「指の動き」を作って、スワイプと同じ読み方で読む。いっぱいの瞬間（±0.08 秒）に離すと「加速しながら上げてピタッ」、
  // ずれるほど「だらっと止まる」振りに近づく
  const snap = clamp(1 - Math.abs(h - 0.7) / 0.25, 0, 1);
  track = makeTrack(); const x0 = W / 2, y0 = H * 0.8;
  for (let t = 0; t <= T + 0.06 + 1e-9; t += 0.004) { const u = Math.min(1, t / T), pp = D * lerp(u * u * u * (10 - 15 * u + 6 * u * u), Math.pow(u, 1.7), snap); track.add(t0 + t, x0 + pp * Math.tan(ang) * Upx, y0 - pp * Upx); }
  drag = { t0, x0, y0 };
  tryThrow(t0 + T + 0.06);
}
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    const g = game;
    if (c === 'ArrowLeft' || c === 'KeyA') { kb.dir = -1; e.preventDefault(); return; }
    if (c === 'ArrowRight' || c === 'KeyD') { kb.dir = 1; e.preventDefault(); return; }
    if (c !== 'Space' && c !== 'Enter' && c !== 'ArrowUp') return;
    e.preventDefault();
    if (g.phase === 'spin') { if (!e.repeat && !bot) g.blow(); return; }
    if (g.phase === 'down') { if (!e.repeat && endAt >= 0 && tt - endAt > 0.4) showOver(); return; }
    if (g.phase === 'aim' && !bot && !drag && !e.repeat && !kb.held) { wakeAudio(); kb.held = true; kb.t0 = performance.now(); }
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'ArrowRight' || e.code === 'KeyD') kb.dir = 0;
  if ((e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') && kb.held) { kb.held = false; if (state === 'play' && game.phase === 'aim') kbThrow(performance.now()); }
});
addEventListener('blur', () => { drag = null; kb.held = false; });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  window.__koma = {
    info: () => game && ({ state, phase: game.phase, t: +game.t.toFixed(3), endT: +game.endT.toFixed(3), ws: +game.ws.toFixed(1), rps: +RPS(game.ws).toFixed(1), tilt: +(game.tilt / DEG).toFixed(2), tip: game.tip.map(v => +v.toFixed(3)), reason: game.reason, blows: game.blows, thr: game.thr && { w0: +game.thr.w0.toFixed(1), thS: +(game.thr.thS / DEG).toFixed(1), thW: +(game.thr.thW / DEG).toFixed(1), sw: game.thr.sw }, land: game.land, ff, frozen, rec, seed, W_STAR: +PH.W_STAR.toFixed(1), W_CRIT: +PH.W_CRIT.toFixed(1) }),
    // 物理だけで N 回ぶん: sim('first', 100) → [秒...]。opts.rate = 指の位置が来る回数（Hz）、opts.jitter = その間隔のゆらぎ
    sim: (skill = 'good', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => +runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).t.toFixed(1)),
    stats: (skill = 'good', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), t = R.map(r => r.t);
      return { skill, N, rate: opts.rate || 'exact', p10: +q(t, 0.1).toFixed(1), p50: +q(t, 0.5).toFixed(1), p90: +q(t, 0.9).toFixed(1), min: +Math.min(...t).toFixed(1), max: +Math.max(...t).toFixed(1), over3: R.filter(r => r.t >= 3).length / N, edge: R.filter(r => r.reason === 'edge').length / N, rps50: +q(R.map(r => RPS(r.w0 || 0)), 0.5).toFixed(1), blows50: q(R.map(r => r.blows || 0), 0.5) };
    },
    // いまのプレイをボットに任せる（投げる前ならボットが投げ、回っている間はボットがフーッ）
    autoplay: (skill = 'good') => { botSk = SKILLS[skill]; bot = makeBot(game, botSk, mulberry(nextSeed())); },
    skip: s => skipTo((game.phase === 'spin' ? game.t : 0) + s),
    freeze: (on = true) => { frozen = on; },
    komaScreen: () => project(koma.position.x, koma.position.y + 0.04, koma.position.z),
    PH, SKILLS, makeGame, runBot, makePlan, planTrack, analyzeSwipe, makeTrack, game: () => game,
  };
}
