<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 雪玉の物理（three には頼らない。単位は m・kg・秒。判定は全部この結果から） ----------
   坂: 上（s=0、村の上）から下の広場（s≈306）まで。x は横（+ が右 = 山側、- が左 = 川）。
     村の坂道 7° → 田んぼ（ほぼ平ら、15m ごとに 0.6m の段差）→ 木立 7.5° → 下の原っぱ 5° → 広場。
     どこも少し川のほうへ傾いている（放っておくと左の川へ寄っていく）。
   雪玉: 半径 R の球。重さ = 雪の密度 × 体積。転がる球なので、加速は力の 5/7（回る分の慣性）。
     押す: 指を置いている間、子どもが「押す向き ψ」へ歩く速さ V_PUSH に雪玉を合わせようとする。
       出せる力には限りがあり（F0·(R/0.5)²。大きい玉は体ごと押せるぶん増えるが、重さは R³ で増える）、
       大きく重い玉ほど 押しても曲がらず、止められず、坂で勝手に転がる。V_RUN より速くなると子どもが追いつけない。
       押す向きは子どもが玉のまわりを歩いて変える（PSI_RATE rad/s まで）。
     転がり抵抗: 雪に沈むぶん（新雪が深いほど、玉が小さいほど大きい）。道（踏み固め）は軽く転がる。
   育つ: 転がった距離 × 前の雪の深さ（まだ誰も通っていない新雪ほど深い）× (R/0.5)^A_GROW で体積が増える。
     重い玉ほど雪を押し固めて巻きこむので、大きくなるほど育ちが速い（ただし止めにくい）。
     通ったあとは踏み固められる（自分の跡の上を通っても育たない）。土の出た所では育たず、欠けて、いびつになる。
   いびつ: 急に曲げる（横向きの加速が A_SAFE をこえる）、ぶつかる、土の上 で溜まる。新雪を転がると少し丸く戻る。1 で割れる。
   割れる: 石・木・柵・電柱にぶつかる / 段差から落ちて着地する / 急な凹みに当たる ときの、ぶつかる向きの速さが
     雪玉の強さ S0·(0.5/R)^S_EXP·(1 − いびつ/2) をこえたら崩れる。強さは大きさに比例しない＝大きい玉ほど割れやすい。
     十分小さい石は巻きこむ（R が石の高さの 1/SWALLOW 倍より大きい）。大きい玉は柵をなぎ倒す。
   おわり: 90 秒（日が暮れる）/ 下の広場に着く / 押しても動かなくなる → そこで雪だるま。
     割れたら一番大きいかけら（直径 ×0.7）、川に落ちたら引き上げて半分とけた（×0.6）で雪だるま。 */
const DEGP = Math.PI / 180;
const PH = {
  DT: 1 / 120, G: 9.81, T_LIMIT: 90,
  RHO: 380,                      // 雪玉の密度 kg/m³
  R0: 0.125,                     // はじめの半径（直径 25cm。手で丸めた玉）
  INERTIA: 5 / 7,                // 転がる球
  V_PUSH: 4.2,                   // 押して走る速さ m/s（これより速いと押さえる）
  V_RUN: 5.0,                    // これより速いと追いつけない（手が離れる）
  K_P: 3.2,                      // 速さを合わせる強さ 1/s
  F0: 380, F_EXP: 2,             // 押す力の上限 N（R=0.5m で 380N。大きい玉は体ごと押す）
  PSI_RATE: 2.6, PSI_MAX: 1.75,  // 押す向きを変える速さ rad/s・向きの範囲（真下から ±100°）
  KEY_RATE: 1.6,                 // キーボードで向きを変える速さ rad/s
  CRR0: 0.035, CPLOW: 0.14,      // 転がり抵抗 = CRR0 + CPLOW·深さ/(R+0.05)
  CAIR: 0.012,                   // 雪をかき分ける抵抗（速さ² に比例）
  PACK: 0.02,                    // 踏み固められた雪の深さ（育たない）
  W_K: 1.0,                      // 踏み跡の幅 = W_K·R·2 … の半分（巻きこむ幅）
  K_GROW: 0.075, A_GROW: 2.8,    // 体積の増え方 dV = K_GROW·(R/0.5)^A_GROW·深さ·距離
  D_MAX: 0.45,
  CHIP: 0.006, K_BARE: 0.035,    // 土の上: 1m で半径が CHIP 欠ける・いびつが K_BARE 溜まる
  REC: 0.5,                      // 新雪を転がると丸くもどる
  K_TW: 0.045, A_SAFE: 2.2,      // 急に曲げた: 横向きの加速 A_SAFE m/s² をこえたぶん × K_TW / 秒
  S0: 3.0, S_EXP: 0.45,          // 強さ（ぶつかる速さ m/s。R=0.5m で 3.0）
  K_HIT: 0.35, E_BOUNCE: 0.15,   // 割れなかったときのいびつ・はね返り
  SWALLOW: 0.55, CRUSH_R: 1.25,  // 石を巻きこむ大きさ・柵をなぎ倒す大きさ
  STUCK_T: 4,
  BREAK_KEEP: 0.7, RIVER_KEEP: 0.6,
};
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const smooth01 = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const massOf = R => PH.RHO * 4 / 3 * Math.PI * R * R * R;
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

/* ---------- コース（いつも同じ。覚えられる） ---------- */
const CRS = { S_GOAL: 306, S_LEN: 370, CROSS: 0.04, HWR: 14, PLAZA: 300 };
const ZONES = [[0, 60, '村の坂道'], [60, 152, '田んぼ'], [152, 242, '木立'], [242, 300, '下の原っぱ'], [300, 999, '広場']];
const SEGS = [[0, 8, 4], [8, 60, 7], [60, 152, 2.2], [152, 160, 4.5], [160, 242, 7.5], [242, 300, 5], [300, 999, 0.6]];
const RISERS = []; for (let k = 0; k < 6; k++) RISERS.push(68 + k * 15);
const RISER_H = 0.6, RISER_L = 1.3;
const TB = 0.25, NT = Math.ceil(CRS.S_LEN / TB) + 2;
const HB = new Float32Array(NT), XC = new Float32Array(NT), HL = new Float32Array(NT), XRD = new Float32Array(NT);
{
  let y = 0;
  for (let i = 0; i < NT; i++) {
    const s = i * TB;
    if (i > 0) { const sm = s - TB / 2; let deg = 0; for (const [a, b, d] of SEGS) if (sm >= a && sm < b) deg = d; y -= Math.tan(deg * DEGP) * TB; }
    let r = 0; for (const s0 of RISERS) r += RISER_H * smooth01((s - s0) / RISER_L);
    HB[i] = y - r;
    XC[i] = 6 * Math.sin(s / 58) + 3 * Math.sin(s / 25 + 1.3);
    HL[i] = 13 + 2.5 * Math.sin(s / 37 + 0.4) - (s > 225 && s < 280 ? 3 * Math.sin((s - 225) / 55 * Math.PI) : 0);
    // 道: 村の坂道 → 田んぼを斜めに横切る農道 → 木立の小道 → 広場へ
    const xc = XC[i];
    let rd;
    if (s < 60) rd = xc + 3.5 + 1.5 * Math.sin(s / 20);
    else if (s < 152) rd = lerp0(xc + 3.5 + 1.5 * Math.sin(60 / 20), xc - 6, smooth01((s - 60) / 92));
    else if (s < 242) rd = xc - 6 + 8 * smooth01((s - 152) / 90) + 1.5 * Math.sin(s / 14);
    else rd = xc + 2 - 2 * smooth01((s - 242) / 58);
    XRD[i] = rd;
  }
}
function lerp0(a, b, k) { return a + (b - a) * k; }
function tabAt(T, s) { const f = clampP(s, 0, CRS.S_LEN - 0.01) / TB, i = f | 0, k = f - i; return T[i] + (T[i + 1] - T[i]) * k; }
const xcAt = s => tabAt(XC, s);
const xrAt = s => tabAt(XC, s) - tabAt(HL, s);       // 川岸のふち
const xhAt = s => tabAt(XC, s) + CRS.HWR;             // 山すそ
const roadAt = s => tabAt(XRD, s);
function hAt(x, s) {
  const xc = tabAt(XC, s), hl = tabAt(HL, s);
  let y = tabAt(HB, s) + CRS.CROSS * (x - xc);
  if (s < 0) y += -s * 0.5 + s * s * 0.08;           // うしろ（上）は急になる
  const xr = xc - hl;
  if (x < xr) { const d = xr - x; y -= Math.min(3.0, d * 1.3); if (d > 15) y += (d - 15) * 0.8; }   // 川岸 → 川 → 向こう岸
  const xh = xc + CRS.HWR; if (x > xh) { const d = x - xh; y += d * 0.2 + d * d * 0.05; }       // 山すそ
  return y;
}
const waterY = s => tabAt(HB, s) - CRS.CROSS * tabAt(HL, s) - 2.25;

    sim: (skill = 'good', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).cm),
    stats: (skill = 'good', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), c = R.map(r => r.cm), why = {};
      for (const r of R) why[r.reason] = (why[r.reason] || 0) + 1;
      return { skill, N, rate: opts.rate || 'exact', p10: q(c, 0.1), p50: q(c, 0.5), p90: q(c, 0.9), min: Math.min(...c), max: Math.max(...c), over40: R.filter(r => r.cm >= 40).length / N, why, dist50: +q(R.map(r => r.dist), 0.5).toFixed(0), t50: +q(R.map(r => r.t), 0.5).toFixed(1) };
    },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good') => { if (game && game.phase === 'play') bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); },
    skip: s => skipTo(game.t + s),
    ballScreen: () => project(game.x, game.y, -game.s),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries }),
    PH, SKILLS, SIZES, makeSim, runBot, makeBot, game: () => game,
  };
}
