<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- そりの物理（自前。three には頼らない。長さ m・時間 秒・角度 rad） ----------
   座標: x = 横（下を向いて右が +）、s = 斜面を下る向きの距離（スコア）、h = 高さ。向き ψ は まっすぐ下が 0（右へ向くと +）。
   坂: 区間ごとに 傾き（下り勾配 gr）が変わる（急・ふつう・ゆるい・平ら・少し登り）。コース（木のない帯）は くねくね曲がり、進むほど せまくなる。
     コースの まん中あたりに 前の子たちが 滑って固めた「圧雪のすじ」があり、その外は 新雪、ところどころ 氷。
   進む: v' = 坂の傾き·G − 摩擦 μ·G − 新雪の 押しのけ PLOW·v − 空気抵抗 DRAG·v² − 曲がるときの エッジのブレーキ。
     μ・曲がりやすさ（grip）: 新雪 = 遅い・よく曲がる / 圧雪 = 速い / 氷 = とても速い・ほとんど曲がらない。
   曲がる: 体重移動 λ（−1〜+1。押した位置で決まる目標へ T_LEAN で 体が傾く）。片側のエッジが雪にかかって 曲率 κ = KAP·λ·grip / (1 + (v/VT)²)。
     速いほど 曲率が小さい（曲がりにくい）。ψ' = (κ − K_ALIGN·sinψ)·v（そりは うしろの摩擦で 下を向こうとする）。宙に浮いている間は 曲がれない。
   横転: 雪面に対する そりの傾き φ（右が下がると +）。φ'' = −K_RS·φ·(1 − |φ|/PHI_C) − C_R·φ' − K_LAT·(遠心の横加速度 v²κ) + A_LEAN·λ。
     φ が PHI_C/2 を こえるあたりから 起き上がる力が 弱まり、PHI_C をこえると 自分で倒れていく。|φ| > PHI_FAIL で ひっくり返る。
     → 速いときに 急に・強く曲がる（遠心が体重移動に勝つ）、左右を 急に切りかえる、と 横転しかける。
   こぶ: 雪面の高さに ガウスの山を足す。そりは雪面に そうが、雪面が 落ちる速さが 重力で 追える速さを こえると 宙に浮く（ふわっ）。
     宙では 体重移動で そりが 傾く（曲がりはしない）。着地のとき 雪面の傾きと そりの傾きが ずれていると、着地の強さに比例して 傾きが 大きくなる（横転しかける）。
     こぶの 横っ腹に のると、雪面が ねじれて そりが 傾く。
   おしまい: 木・切り株（宙で 高く浮いていれば 切り株は こえられる）・コースのはしの 木にぶつかる / |φ| > PHI_FAIL / 遅すぎる（V_STOP 未満が T_STOP 秒）。
     雪だるまは ぶつかると こわれて 大きく減速し、そりが ゆさぶられる。
   はじめ: 坂は ゆるめ（GR0）。まっすぐ下った 37〜42 m に 木が1本（何もしないと ここで ずぼっ）。100 m までは コースが 同じ向きへ 大きく曲がる。
   入力はすべて時刻つき（画面のコマには よらない）。1/240 秒きざみ。 */
const PH = {
  DT: 1 / 240, G: 9.8, DS: 0.5,
  MU_PACK: 0.05, MU_POW: 0.072, MU_ICE: 0.018, PLOW: 0.04, DRAG: 0.0068,
  GRIP_PACK: 0.8, GRIP_POW: 1.0, GRIP_ICE: 0.3,
  KAP: 0.2, VT: 6, T_LEAN: 0.25, K_ALIGN: 0.035, C_TURN: 0.1,
  K_RS: 30, PHI_C: 0.6, C_R: 4.2, K_LAT: 1.0, A_LEAN: 2.0, PHI_FAIL: 0.95,
  K_TW: 0.7, A_AIR: 2.6, C_AIR: 1.2, K_LAND: 2.0, LAND_V: 0.035,
  R_SLED: 0.32, TRAIL_W: 1.0, CONC: 0.006,
  V0: 2.8, START_T: 0.4, AUTO_GO: 4.0, V_STOP: 0.5, T_STOP: 1.2,
  W0: 6, W1: 3.0, W_L: 2200, GR0: 0.15, STRAIGHT0: 24,
};
const OBK = { tree: { r: 0.42 }, stump: { r: 0.3, h: 0.36 }, snowman: { r: 0.42 } };
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function rndG(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }

/* コース（種から決まる。必要なぶんだけ 先へ作る。同じ種なら 何度作っても同じ） */
const cdMax = s => s < PH.STRAIGHT0 ? 0 : Math.min(0.45, 0.2 + 0.2 * (1 - Math.exp(-(s - PH.STRAIGHT0) / 450)) + 0.00002 * s);
const cdRate = s => 0.012 + 0.01 * (1 - Math.exp(-s / 600));
const wBase = s => PH.W1 + (PH.W0 - PH.W1) * Math.exp(-s / PH.W_L);
function makeCourse(seed) {
  const r = mulberry((seed * 2654435761 + 99) >>> 0);
  return { rnd: r, ro: mulberry((seed * 40503 + 7) >>> 0), CX: [0], CD: [0], W: [PH.W0], TX: [0], HB: [0], GR: [PH.GR0], cd: 0, cdT: 0, cEnd: PH.STRAIGHT0, gr: PH.GR0, grT: PH.GR0, gEnd: 60, gType: 'normal', to: 0, toT: 0, tEnd: 16, wph: r() * 6.28, obs: [], bumps: [], ice: [], objM: 0, lastIce: -99, sects: [] };
}
function extendCourse(C, sTo) {
  const DS = PH.DS;
  while ((C.CX.length - 1) * DS < sTo) {
    const i = C.CX.length - 1, s = i * DS, r = C.rnd;
    if (s >= C.cEnd) {
      C.cEnd = s + 14 + r() * 26;
      const m = cdMax(s); let k = (r() < 0.5 ? -1 : 1) * m * (0.5 + 0.5 * r());
      if (Math.sign(k) === Math.sign(C.cdT) && r() < 0.4) k = -k;
      if (r() < 0.18) k *= 0.2;
      if (Math.abs(C.CX[i]) > 60 && Math.sign(k) === Math.sign(C.CX[i])) k = -k;   // 山から はみださない
      if (s < 100) { if (C.firstDir == null) C.firstDir = k < 0 ? -1 : 1; k = C.firstDir * Math.max(Math.abs(k), 0.8 * m); }   // はじめは 同じ向きへ 大きく曲がる（曲がるのを おぼえる）
      C.cdT = k;
    }
    const rate = cdRate(s) * DS;
    C.cd += clampP(C.cdT - C.cd, -rate, rate);
    if (s >= C.gEnd) {
      const slow = C.gType === 'flat' || C.gType === 'up' || C.gType === 'gentle';
      const q = slow ? 0.5 + 0.5 * r() : r(); let t = 'normal', g = 0.2, len = 25 + r() * 35;
      const fl = s > 90 ? 0.1 + 0.08 * Math.min(1, s / 800) : 0, up = s > 160 ? 0.07 + 0.05 * Math.min(1, s / 900) : 0;
      if (q < fl) { t = 'flat'; g = 0.015; len = 14 + r() * 18 + Math.min(14, s / 80); }
      else if (q < fl + up) { t = 'up'; g = -0.05; len = 6 + r() * 7; }
      else if (q < fl + up + 0.22) { t = 'gentle'; g = 0.13; len = 18 + r() * 30; }
      else if (q < fl + up + 0.22 + 0.22) { t = 'steep'; g = 0.29; len = 18 + r() * 26; }
      else g = 0.19 + 0.04 * r();
      C.grT = g; C.gType = t; C.gEnd = s + len; C.sects.push({ s0: s, s1: s + len, t, g });
    }

  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ入力（時刻つき）の列を、いろいろなコマ割りで物理に流して、結果がそろうか（quant = 時刻を使わずコマの時刻で入れた場合のくらべ）
  const replay = (log, seedR, fps, quant = false) => {
    const g = makeGame(seedR), L = log.slice().sort((a, b) => a.t - b.t); let i = 0, tNow = 0;
    while (!g.over && tNow < 900 && g.sMax < 3000) {
      tNow += 1 / fps;
      while (i < L.length && L[i].t <= tNow) { gInput(g, Math.max(g.t, quant ? tNow : L[i].t), L[i].kind, L[i].s); i++; }
      while (g.t + PH.DT <= tNow && !g.over) { stepGame(g); g.events.length = 0; }
    }
    return { d: Math.round(g.sMax), fail: g.fail, t: r3(g.t) };
  };
  const scr = (x, y, z) => { const s = project(x, y, z); return { x: Math.round(s.x), y: Math.round(s.y) }; };
  const rect = id => { const el = $(id); if (!el || el.closest('[hidden]') || el.hidden) return null; const r = el.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2), w: Math.round(r.width), h: Math.round(r.height) }; };
  const wallMs = tg => Math.round((base + tg) * 1000 - performance.now());   // 物理の時刻 tg に効く入力を送るまでの、いまからのミリ秒
  const pressY = () => Math.round(H * 0.5);
  const ui = () => ({
    state, start: rect('startBtn'), retry: rect('retryBtn'), copy: rect('copyBtn'), x: rect('xBtn'), hub: rect('hubBack'), best: rect('hud'),
    // 押す場所の例（← 横丁・最高 にかからない所）。left/right は いっぱいに たおす所、leftSoft/rightSoft は 半分くらい、center は 体重移動なし（スタートだけ）
    press: { x: Math.round(W / 2), y: pressY() }, left: { x: xOfLean(-1), y: pressY() }, right: { x: xOfLean(1), y: pressY() }, leftSoft: { x: xOfLean(-0.55), y: pressY() }, rightSoft: { x: xOfLean(0.55), y: pressY() },
    zones: { center: Math.round(W / 2), deadL: Math.round(W / 2 - DEAD * W / 2), deadR: Math.round(W / 2 + DEAD * W / 2), fullL: xOfLean(-1), fullR: xOfLean(1) },
    rider: game && scr(game.x, game.y + 0.5, -game.s), gauge: { x: Math.round(W / 2), y: Math.round(H - safeB - 40 * Math.min(1, W / 390 + 0.05)) },
  });
  window.__sori = {
    info: (opt = {}) => {
      if (!game) return { state };
      const g = game, C = g.course;
      let next = null;
      if (opt.next !== false && !g.over && state === 'play') {
        const N = planNext(g);
        if (N.action === 'down' || N.action === 'up' || N.action === 'move') {
          const s = N.action === 'up' ? 0 : N.s;
          next = { action: N.action === 'move' ? 'down' : N.action, side: N.action === 'up' ? (g.side < 0 ? 'L' : 'R') : (s < 0 ? 'L' : s > 0 ? 'R' : 'C'), lean: r2(s), x: N.action === 'up' ? (ptrId != null ? Math.round(ptrX) : xOfLean(g.side)) : xOfLean(s), y: pressY(), inMs: N.t != null ? wallMs(N.t) : 0, windowMs: N.lo != null ? Math.round((N.hi - N.lo) * 1000) : 0, earliestMs: N.lo != null ? wallMs(N.lo) : null, latestMs: N.hi != null ? wallMs(N.hi) : null, slide: N.action === 'move', tap: !!N.tap, idle: !!N.idle };
        } else next = { action: N.action };
      }
      const O = C.obs, ahead = [];
      for (let i = firstIdx(O, g.s); i < O.length && O[i].s < g.s + 30 && ahead.length < 6; i++) { const o = O[i]; if (o.k === 'snowman' && g.hits.includes(o.id)) continue; ahead.push({ kind: o.k, ahead: r1(o.s - g.s), dx: r2(o.x - g.x), ...scr(o.x, terr(C, o.x, o.s).h + 0.5, -o.s) }); }
      const R = row(C, g.s);
      return {
        state, t: r3(g.t), phase: g.phase, over: g.over, fail: g.fail,
        dist: Math.floor(g.sMax), s: r2(g.s), x: r2(g.x), v: r2(g.v), kmh: Math.round(g.v * 3.6), headingDeg: r1(g.psi / DEG), rollDeg: r1((g.air ? g.phiA : g.phi) / DEG), rollFailDeg: r1(PH.PHI_FAIL / DEG),
        lean: r2(g.lean), pressed: g.pressed, side: g.side, air: g.air, airH: r2(g.air ? g.y - terr(C, g.x, g.s).h : 0), snow: ['powder', 'packed', 'ice'][g.st],
        course: { center: r2(R.cx), halfWidth: r2(R.w), off: r2(g.x - R.cx), grade: r3(R.gr), trailX: r2(R.tx) },
        ahead, rider: scr(g.x, g.y + 0.5, -g.s),
        // つぎの操作の目安: action='down' なら (x, y) を inMs 後に押す（earliestMs〜latestMs のあいだなら 2.5 秒は だいじょうぶ）。'up' なら inMs 後に はなす。slide=true は 押したまま x へ指をずらす（離して押しなおしてもよい）
        next, bot: !!bot, botStart, ff, frozen, rec, seed: g.seed,
      };
    },
    ui,
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [距離 m...]（'first' / 'casual' / 'good' / 'mash'（左右を一定間隔で交互）/ 'mashFast' / 'mashSlow' / 'none'（何もしない）/ 'hold' / 'holdL'（片側押しっぱなし））
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(typeof skill === 'string' ? SKILLS[skill] : skill, (opts.seed0 ?? 1000) + i, opts).d),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const sk = typeof skill === 'string' ? SKILLS[skill] : skill;
      const R_ = Array.from({ length: N }, (_, i) => runBot(sk, (opts.seed0 ?? 1000) + i, opts)), d = R_.map(r => r.d), kinds = {};
      for (const r of R_) kinds[r.fail] = (kinds[r.fail] || 0) + 1;
      return { skill: typeof skill === 'string' ? skill : 'custom', N, p10: q(d, 0.1), p25: q(d, 0.25), p50: q(d, 0.5), p75: q(d, 0.75), p90: q(d, 0.9), min: Math.min(...d), max: Math.max(...d), ge30: R_.filter(r => r.d >= 30).length / N, ge100: R_.filter(r => r.d >= 100).length / N, ge500: R_.filter(r => r.d >= 500).length / N, ge1000: R_.filter(r => r.d >= 1000).length / N, mean: Math.round(d.reduce((a, b) => a + b, 0) / N), meanSec: +(R_.reduce((a, r) => a + r.t, 0) / N).toFixed(1), kinds };
    },
    // 左右を 一定間隔で 交互に押す（いろいろな 間隔・強さ）: いちばん伸びる組み合わせ
    mashGrid: (N = 20) => { const out = []; for (const period of [0.3, 0.5, 0.8, 1.2, 1.8, 2.5]) for (const s of [0.4, 0.7, 1]) { const d = Array.from({ length: N }, (_, i) => runBot({ mash: true, period, s }, 3000 + i).d); out.push({ period, s, p50: q(d, 0.5), max: Math.max(...d) }); } return out.sort((a, b) => b.p50 - a.p50).slice(0, 5); },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす
    fpsCheck: (skill = 'good', seedR = 4242, maxS = 600) => {
      const r = runBot(SKILLS[skill], seedR, { log: true, maxS });
      return { live: { d: r.d, fail: r.fail, t: r3(r.t) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), fps30frameQuantized: replay(r.log, seedR, 30, true), fps60frameQuantized: replay(r.log, seedR, 60, true), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { if (game.pressed) gInput(game, game.t, 'up'); bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; ptrId = null; kbPressed = false; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    screen: (x, y, z) => scr(x, y, z),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, planNext, game: () => game,
  };
}
