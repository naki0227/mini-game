<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';
let THREE, RAPIER;
try {
  const [t, r] = await Promise.all([import(THREE_URL), import(RAPIER_URL)]);
  THREE = t; RAPIER = r.default;
  await RAPIER.init();
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D/物理エンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- だるま落としの物理（three には頼らない。Rapier の剛体だけ） ----------
   長さの単位は 10cm（だるまの胴は直径 10cm）、重力も 10 倍（98.1）にして、本物と同じ速さで起きるようにしてある。
   だるまは床（たたみ）にじかに立つ。胴（円柱）と頭（円柱の台＋球）は本物の剛体で、積み木どうしの摩擦で支え合っている。
   木づちも剛体。手から離れた瞬間の速さ・向きで飛んでいき、当たった胴とのあいだで運動量をやりとりする（当たったら抜ける、はしない）。
   抜けたかどうかは、止まったあとの位置と傾きだけで決める。 */
const PH = {
  G: 98.1, DT: 1 / 600, ITERS: 4,
  R: 0.5,                               // 胴の半径
  MU: 0.34, MU_FLOOR: 0.6, E: 0.06,      // 胴どうしの摩擦・床の摩擦・はね返り
  HEAD: { r0: 0.46, h0: 0.24, rb: 0.52, yb: 0.56 },   // 頭: 台の円柱（半径・高さ）＋ 球（半径・中心の高さ）
  HAM: { r: 0.125, len: 0.56, handle: 1.5, hr: 0.05, mHead: 1.1, mHandle: 0.15, gap: 0.32 },
  BETA: 0.35, SCREEN: 2.7,                            // 木づちの通り道（左手前 ⇔ 右奥）を画面の横から傾ける角度
  MAGNET: 0.4,                          // 狙いの高さを、いちばん近い胴の真ん中へ寄せる割合
  H0: 0.44, HMIN: 0.3, THIN: 0.0045, OUT_KEEP: 26, MAXN: 10, GROW: 6,
};
// 胴の種類: n = その胴が積まれた順番（0〜）。続けるほど薄く、色が増え、時々「重い」「すべる」が混じる
const PIECE_COLORS = ['#c8352b', '#2c4f86', '#e4a92e', '#3f7a4a', '#f1e8d6', '#2a2522', '#d77a8c', '#7a4a2e', '#4aa1a8', '#8c6bb0'];
const START_COLS = [2, 3, 1, 4, 0];        // はじめの5段（下から）: 山吹・若竹・藍・生成り・朱
const RAND_COLS = [0, 1, 2, 3, 4, 6, 7, 8, 9];   // 5（黒）は「重い」専用
let lastCol = -1;
function pieceSpec(n, rnd) {
  const h = Math.max(PH.HMIN, PH.H0 - PH.THIN * Math.max(0, n - 5));
  let kind = 'plain';
  if (n >= 9) { const r = rnd(); const p = Math.min(0.4, 0.18 + n * 0.006); if (r < p / 2) kind = 'heavy'; else if (r < p) kind = 'slick'; }
  let col;
  if (n < START_COLS.length) col = START_COLS[n];
  else {
    const ncol = Math.min(RAND_COLS.length, 4 + Math.floor((n - 5) / 5));   // 続けるほど色がふえる
    do { col = RAND_COLS[Math.floor(rnd() * ncol)]; } while (col === lastCol);
  }
  if (kind === 'heavy') col = 5;
  lastCol = col;
  return { n, h, kind, col: PIECE_COLORS[col], dens: kind === 'heavy' ? 2.3 : 1, mu: kind === 'slick' ? 0.1 : PH.MU };
}
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const qAxisO = (ax, ay, az, a) => { const s = Math.sin(a / 2); return { x: ax * s, y: ay * s, z: az * s, w: Math.cos(a / 2) }; };
const qMulO = (a, b) => ({ w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z, x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y, y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x, z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w });
function qRotO(q, v) {
  const { x, y, z, w } = q;
  const ix = w * v.x + y * v.z - z * v.y, iy = w * v.y + z * v.x - x * v.z, iz = w * v.z + x * v.y - y * v.x, iw = -x * v.x - y * v.y - z * v.z;
  return { x: ix * w + iw * -x + iy * -z - iz * -y, y: iy * w + iw * -y + iz * -x - ix * -z, z: iz * w + iw * -z + ix * -y - iy * -x };
}
const upY = q => qRotO(q, { x: 0, y: 1, z: 0 }).y;                 // 傾きの cos
const GRP = { FLOOR: 0x0001, PIECE: 0x0002, HAM: 0x0004, WALL: 0x0008, OUT: 0x0010 };
const groups = (member, filter) => ((member & 0xffff) << 16) | (filter & 0xffff);

function makeGame(RAPIER, seed = 1) {
  const rnd = mulberry(seed); lastCol = -1;
  const world = new RAPIER.World({ x: 0, y: -PH.G, z: 0 });
  world.timestep = PH.DT;
  world.integrationParameters.numSolverIterations = PH.ITERS;
  world.integrationParameters.maxCcdSubsteps = 4;
  const fixedBox = (hx, hy, hz, x, y, z, f, e, grp, yaw = 0) => {
    const b = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
    world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setRotation(qAxisO(0, 1, 0, yaw)).setFriction(f).setRestitution(e).setCollisionGroups(groups(grp, GRP.PIECE | GRP.OUT)), b);
  };
  // たたみ・奥のふすま・左右の壁（抜けた胴はここで止まる）
  fixedBox(14, 2, 14, 0, -2, 0, PH.MU_FLOOR, 0.1, GRP.FLOOR);
  fixedBox(14, 5, 1.5, 0, 5, -4.7 - 1.5, 0.5, 0.15, GRP.WALL);     // 奥の壁（面は z=-4.7）
  fixedBox(1.5, 5, 14, -6.2 - 1.5, 5, 0, 0.5, 0.15, GRP.WALL);
  fixedBox(1.5, 5, 14, 6.2 + 1.5, 5, 0, 0.5, 0.15, GRP.WALL);
  fixedBox(14, 5, 1.5, 0, 5, 3.4 + 1.5, 0.5, 0.15, GRP.WALL);      // 手前（見えない壁。カメラの前で止める）
  fixedBox(14, 1, 14, 0, 10 + 1, 0, 0.5, 0.1, GRP.WALL);          // 天井
  // 通り道の両はしの衝立（布張り。はね返らない）
  for (const s of [-1, 1]) fixedBox(0.25, 1.4, 1.5, s * PH.SCREEN * Math.cos(PH.BETA), 1.4, -s * PH.SCREEN * Math.sin(PH.BETA), 0.8, 0.02, GRP.WALL, PH.BETA);

  const g = {
    world, rnd, pieces: [], out: [], head: null, ham: null, nPlaced: 0, score: 0,
    phase: 'ready', t: 0, pt: 0, events: [], result: null, strike: null, ins: null, lastSpec: null,
  };
  const pieceCollider = (s) => RAPIER.ColliderDesc.cylinder(s.h / 2, PH.R).setFriction(s.mu).setFrictionCombineRule(RAPIER.CoefficientCombineRule.Min)
    .setRestitution(PH.E).setDensity(s.dens).setCollisionGroups(groups(GRP.PIECE, GRP.FLOOR | GRP.PIECE | GRP.HAM | GRP.WALL));
  function addPiece(s, x, y, z, q) {
    const b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y, z).setRotation(q || { x: 0, y: 0, z: 0, w: 1 }).setCanSleep(true).setCcdEnabled(true));
    world.createCollider(pieceCollider(s), b);
    const p = { body: b, spec: s, id: s.n, outAt: -1, lastV: null, cool: 0, snd: 0 };
    return p;
  }
  function makeHead(x, y, z) {
    const H = PH.HEAD;
    const b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y, z).setCanSleep(true));
    const cg = groups(GRP.PIECE, GRP.FLOOR | GRP.PIECE | GRP.HAM | GRP.WALL);
    world.createCollider(RAPIER.ColliderDesc.cylinder(H.h0 / 2, H.r0).setTranslation(0, H.h0 / 2, 0).setFriction(PH.MU).setFrictionCombineRule(RAPIER.CoefficientCombineRule.Min).setRestitution(PH.E).setDensity(1).setCollisionGroups(cg), b);
    world.createCollider(RAPIER.ColliderDesc.ball(H.rb).setTranslation(0, H.yb, 0).setFriction(0.5).setRestitution(0.1).setDensity(1).setCollisionGroups(cg), b);
    return { body: b, lastV: null, cool: 0 };
  }
  // 木づち: 頭（x 方向の円柱）＋ 柄（z 方向、手前へ）。重力なし（手で持っている間の高さを保つ）
  function makeHammer() {
    const M = PH.HAM;
    const b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(0, -30, 0).setGravityScale(0).setCcdEnabled(true).setCanSleep(false));
    const cg = groups(GRP.HAM, 0);
    world.createCollider(RAPIER.ColliderDesc.cylinder(M.len / 2, M.r).setRotation(qAxisO(0, 0, 1, Math.PI / 2)).setFriction(0.3).setRestitution(0.45).setMass(M.mHead).setCollisionGroups(cg), b);
    world.createCollider(RAPIER.ColliderDesc.capsule(M.handle / 2, M.hr).setRotation(qAxisO(1, 0, 0, Math.PI / 2)).setTranslation(0, 0, M.r + M.handle / 2).setFriction(0.3).setMass(M.mHandle).setCollisionGroups(cg), b);
    return { body: b, on: false };
  }
  function hammerCollide(on) {
    const b = g.ham.body;
    for (let i = 0; i < b.numColliders(); i++) b.collider(i).setCollisionGroups(groups(GRP.HAM, on ? GRP.PIECE : 0));
    g.ham.on = on;
  }
  // はじめの5段
  let y = 0;

  for (let i = 0; i < 240; i++) world.step();   // なじませる

  /* ----- 調べる道具 ----- */
  const pos = b => b.translation();

  };

    const c = { x: sw.x - d.x * back, y: sw.y - d.y * back, z: sw.z - d.z * back };

    const S = { dir: sw.dir > 0 ? 1 : -1, y: a.y, x: a.x, z: a.z, v: sw.v, pitch: sw.pitch || 0, target: a.piece, off: a.off, yRaw: sw.y };
    const P = g.hammerPose(S);
    const b = g.ham.body;
    b.setTranslation(P.c, true); b.setRotation(P.q, true);
    b.setLinvel({ x: P.d.x * S.v, y: P.d.y * S.v, z: P.d.z * S.v }, true); b.setAngvel({ x: 0, y: 0, z: 0 }, true);
    hammerCollide(true);
    g.ham.lastV = { x: P.d.x * S.v, y: P.d.y * S.v, z: P.d.z * S.v }; g.ham.hit = false; g.ham.cool = 0;
    g.strike = { sw: S, t: 0, calm: 0, before: g.pieces.length, start: P.c, d: P.d, headY0: pos(g.head.body).y, hitT: -1, maxTilt: 0, dropT: -1 };

    const knocked = S.before - g.pieces.length;
    const tilt = g.headTilt(), hp = pos(g.head.body);

    const headDown = hp.y < stackH - 0.25;
    const target = S.sw.target, tp = g.pieces.includes(target) ? pos(target.body) : null;
    let kind;

    else if (knocked >= 2) kind = 'multi';
    else if (knocked === 1) kind = g.out[g.out.length - 1] === target ? 'clean' : 'wrong';
    else kind = g.ham.hit ? 'shift' : 'whiff';
    // ずれ: 当てた胴がどれだけ動いたか（抜けなかったとき）
    const shift = tp ? Math.hypot(tp.x - hp.x, tp.z - hp.z) : 0;
    g.result = { kind, knocked, tilt, shift, sw: S.sw, maxTilt: S.maxTilt };
    g.strike = null;
    if (kind === 'clean' || kind === 'wrong') { g.score++; g.events.push({ type: 'clean', n: g.score }); startInsert(); }

      const dv = bump(g.ham, 'ham');

    }
    for (const p of g.pieces) {
      const dv = bump(p, 'piece');
      if (dv > 4 && p.cool <= 0 && g.phase === 'strike') { p.cool = 0.08; }
    }
    for (const p of g.out) {
      if (g.t - p.outAt > 4) { p.lastV = null; continue; }
      const dv = bump(p, 'piece');
      if (dv > 3 && p.cool <= 0 && p.snd < 5) { p.cool = 0.09; p.snd++; g.events.push({ type: 'land', dv, p }); }
    }
    {
      const v = g.head.body.linvel();
      if (g.head.lastV && g.head.lastV.y < -1.2 && v.y > g.head.lastV.y + 1.0 && g.phase !== 'insert') g.events.push({ type: 'drop', dv: -g.head.lastV.y });
      g.head.lastV = { x: v.x, y: v.y, z: v.z };
    }
    if (g.phase === 'strike') {
      const S = g.strike;
      S.t += PH.DT;
      S.maxTilt = Math.max(S.maxTilt, g.headTilt());
      // 胴が柱から外れた瞬間（スコーン）
      for (const p of g.pieces) {
        if (!p.flew && isOut(p)) { p.flew = true; const v = p.body.linvel(); g.events.push({ type: 'fly', p, v: Math.hypot(v.x, v.z) }); }
        // 十分はなれたら、はね返ってきても立っているだるまには当たらないようにする
        if (p.flew && !p.ghost) { { p.ghost = true; p.body.collider(0).setCollisionGroups(groups(GRP.OUT, GRP.FLOOR | GRP.WALL | GRP.OUT)); } }
      }
      // 木づちは振り抜いたら手元へ戻す（当たり判定を切る）
      if (g.ham.on) {
        const hp = pos(g.ham.body), d = S.d;
        const along = (hp.x - S.start.x) * d.x + (hp.y - S.start.y) * d.y + (hp.z - S.start.z) * d.z;
        if (S.t > 0.3 || along > 2 * PH.R + PH.HAM.gap + PH.HAM.len + 0.9) parkHammer();
      }
      // 落ち着いたか
      let moving = false;
      for (const o of [...g.pieces, g.head]) { const v = o.body.linvel(), w = o.body.angvel(); if (Math.hypot(v.x, v.y, v.z) > 0.25 || Math.hypot(w.x, w.y, w.z) > 0.5) { moving = true; break; } }
      S.calm = moving ? 0 : S.calm + PH.DT;
      if ((S.t > 0.35 && S.calm > 0.12) || S.t > 2.6) { if (g.ham.on) parkHammer(); judge(); }
    } else if (g.phase === 'insert') insertStep();
    else if (g.phase === 'settle') {
      g.settleT += PH.DT;
      if (g.settleT > 0.15) {
        g.phase = 'ready';
        if (g.pieces.length < g.want() && g.headTilt() < 0.3) { startInsert(); return; }
        if (g.headTilt() > 0.42) { g.phase = 'over'; g.result = { kind: 'fall', knocked: 0 }; g.events.push({ type: 'fail', kind: 'fall' }); }
      }
    } else if (g.phase === 'ready') {
      // 何もしていなくても、ずれた積み方が自然に倒れたらおしまい
      if (g.headTilt() > 0.42) { g.phase = 'over'; g.result = { kind: 'fall', knocked: 0 }; g.events.push({ type: 'fail', kind: 'fall' }); }
    }
  };
  // 積んでおく胴の数: はじめ5段、抜くほど背が高くなる（6段抜くごとに1段ふえる、最大10段）
  g.want = () => Math.min(PH.MAXN, 5 + Math.floor(g.score / PH.GROW));
  // 外へ出た胴を片づける（見た目の都合: だるまのすぐ近くに止まったものなど）
  g.removeOut = (p) => { const i = g.out.indexOf(p); if (i < 0) return; g.out.splice(i, 1); p.removed = true; world.removeRigidBody(p.body); g.events.push({ type: 'gone', p }); };
  g.free = () => world.free();
  return g;
}

  if (state !== 'play') return;
  if (game.phase === 'over') { if (tt - failAt > 0.5) showOver(); return; }
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  press = { id: e.pointerId, x0: e.clientX, y0: e.clientY, pts: [{ x: e.clientX, y: e.clientY, t: evT(e) }], done: false };
  kb = null;
  updateAim();
});
addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ce of (list.length ? list : [e])) {
    press.pts.push({ x: ce.clientX, y: ce.clientY, t: evT(ce) });
    if (press.pts.length > 80) press.pts.splice(0, press.pts.length - 80);
    if (!press.done) { const pp = press.pts, n = pp.length; if (!press.dir && Math.abs(pp[n - 1].x - press.x0) > 6) press.dir = pp[n - 1].x > press.x0 ? 1 : -1; updateAim(); tryCross(false); }
  }
});
addEventListener('pointerup', e => {
  if (!press || e.pointerId !== press.id) return;
  if (!press.done) { press.pts.push({ x: e.clientX, y: e.clientY, t: evT(e) }); tryCross(true); }
  press = null; if (!lastSwing || game.phase === 'ready') aimNow = null;
});
addEventListener('pointercancel', () => { press = null; aimNow = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: ↑↓ で段、←→ を押している間ためて、離すと振る（→ は左から右へ）
function kbTargetY() { const i = clamp(kb ? kb.idx : 0, 0, game.pieces.length - 1); return game.pieces[i].body.translation().y; }
function kbSpeed() { return kb && kb.charging ? clamp(15 + 95 * (1 - Math.abs(1 - (kb.t / 1.1) % 2)), 15, 110) : kb ? kb.last || 15 : 15; }
addEventListener('keydown', e => {
  if (state === 'play') {
    if (game.phase === 'over') { if ((e.code === 'Space' || e.code === 'Enter') && tt - failAt > 0.5) { e.preventDefault(); showOver(); } return; }
    if (e.code === 'ArrowUp' || e.code === 'ArrowDown') { e.preventDefault(); if (!kb) kb = { idx: 0, t: 0, charging: false }; kb.idx = clamp(kb.idx + (e.code === 'ArrowUp' ? 1 : -1), 0, game.pieces.length - 1); return; }
    if ((e.code === 'ArrowRight' || e.code === 'ArrowLeft' || e.code === 'Space') && !e.repeat) {
      e.preventDefault(); wakeAudio();
      if (!kb) kb = { idx: 0, t: 0, charging: false };
      kb.charging = true; kb.t = 0; kb.dir = e.code === 'ArrowLeft' ? -1 : 1;
      return;
    }
    if (e.code === 'Enter') e.preventDefault();
    return;
  }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('keyup', e => {
  if (state !== 'play' || !kb || !kb.charging) return;
  if (e.code !== 'ArrowRight' && e.code !== 'ArrowLeft' && e.code !== 'Space') return;
  const v = kbSpeed(); kb.charging = false; kb.last = v;
  if (game.phase === 'ready') doSwing({ dir: kb.dir, y: kbTargetY(), v, pitch: 0 });
});
addEventListener('blur', () => { press = null; aimNow = null; if (kb) kb.charging = false; });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  window.__otoshi = {
    info: () => ({ state, phase: game && game.phase, score: game && game.score, pieces: game && game.pieces.length, out: game && game.out.length, result: game && game.result && { kind: game.result.kind, knocked: game.result.knocked, v: game.result.sw && game.result.sw.v }, last: lastSwing && { v: lastSwing.v, pitch: lastSwing.pitch / DEG, y: lastSwing.y, yRaw: lastSwing.yRaw, dir: lastSwing.dir }, rec, seed }),
    // 世界の値でそのまま振る: { dir, y(省略=いちばん下の胴の真ん中), v, pitch(度) }
    swing: (o = {}) => game.pieces.length > 0 && doSwing({ dir: o.dir || 1, y: o.y ?? game.pieces[0].body.translation().y, v: o.v ?? 60, pitch: (o.pitch || 0) * DEG }),
    // 画面の座標: いちばん下の胴の真ん中が画面のどこか（Playwright でスワイプするため）
    bottomScreen: () => { const t = game.pieces[0].body.translation(); return project(t.x, t.y, t.z); },
    pieceScreen: i => { const t = game.pieces[i].body.translation(); return project(t.x, t.y, t.z); },
    makeGame, PH, game: () => game,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([document.fonts.load(`40px "Dela Gothic One"`), new Promise(r => setTimeout(r, 1500))]); } catch {}
resize();
newGame(7);
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = '木づちを持つ';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>

// プレイ中でもゲーム一覧に戻れるボタン。押してもゲームの入力（タップ・ドラッグ）に伝わらないようにする
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) document.getElementById('hubBack').addEventListener(ev, e => e.stopPropagation(), { passive: true });
</script>
