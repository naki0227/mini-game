<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 WebGL（夕方の河原・台石の上の石の塔）+ 2D の演出レイヤー + HUD。タイトル/結果は下寄せのカード1枚 */
:root {
  --dusk: #3a3340;       /* 夕暮れの影 */
  --ink: #26211d;        /* 墨 */
  --paper: #f3ede2;      /* 和紙 */
  --noren: #3f5c6b;      /* 川の青ねず */
  --noren-ink: #f4efe4;
  --noren-dark: #253a45;
  --gold: #eaa13d;       /* 夕日 */
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--dusk); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#gl, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { touch-action: none; cursor: grab; }

.hud {
  position: fixed; right: 0; top: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--noren); color: var(--noren-ink);
  border-radius: 6px; padding: 5px 10px 6px;
  font-variant-numeric: tabular-nums; line-height: 1.1; text-align: right;
  box-shadow: 0 2px 0 rgba(0,0,0,.3);
}
.pill .lab { font-size: 10px; letter-spacing: .12em; opacity: .8; display: block; }
.pill .val { font-family: var(--font-display); font-size: 17px; }

.rot {
  position: fixed; z-index: 30;
  right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: 64px; height: 64px; border-radius: 50%; padding: 0;
  display: grid; place-items: center; align-content: center; gap: 0;
  background: rgba(244, 239, 228, .9); color: var(--noren-dark); box-shadow: 0 3px 0 rgba(20, 28, 34, .45);
  font: 700 10px/1 var(--font-body); letter-spacing: .06em; touch-action: none;
}
.rot svg { width: 26px; height: 26px; margin-bottom: 2px; }
.rot:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(20, 28, 34, .45); }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: end center; z-index: 40;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
  background: linear-gradient(to top, rgba(28, 24, 30, .55), rgba(28, 24, 30, 0) 70%);
  touch-action: none; cursor: pointer; overflow: hidden;
}
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);
  border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45);
  text-align: center; cursor: default;
}
.noren {
  background: var(--noren); color: var(--noren-ink);
  display: flex; gap: 3px;
  padding-top: 14px;
}
.noren span {
  flex: 1; background: var(--noren); border-bottom: 3px solid rgba(255,255,255,.1);
  font-family: var(--font-display); font-size: 30px; line-height: 1; padding-block: 6px 12px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2);
}
.noren.result { padding-top: 10px; }
.noren.result span { font-size: 24px; padding-block: 4px 10px; }
.body { padding: 14px 20px 16px; display: grid; gap: 10px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }
.score { font-family: var(--font-display); font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; justify-content: center; align-items: baseline; gap: 2px; white-space: nowrap; }
.score small { font-size: 20px; margin-left: 2px; }

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';
let THREE, RAPIER;
try {
  const [t, r] = await Promise.all([import(THREE_URL), import(RAPIER_URL)]);
  THREE = t; RAPIER = r.default;
  await RAPIER.init();
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D/物理エンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 石積みの物理（three には頼らない。Rapier の剛体だけ） ----------
   長さの単位は 10cm、重力も 10 倍（98.1）で、本物と同じ速さで起きる。
   河原の大きな台石（上が平らな岩）の上に、丸い河原の石を1個ずつ積む。
   石は「角を大きく丸めた箱」（roundCuboid）でできていて、上と下に小さな平らな面があり、まわりはぐるっと丸い。
   丸めの大きさ（＝平らな面の広さ）で、乗せやすさが決まる。上へ行くほど石は小さく・丸く（平らな面がせまく）なる。
   くさび形の石は、下の箱の上に、少し傾けた箱を重ねた形（上の面がななめ）。乗せた石も傾くので、向きを回して打ち消す。
   convex hull は Rapier 0.12 で接触が不安定だった（缶つみの報告）ので使わない。
   Rapier 0.12 の roundCuboid は質量を丸めの内側の箱だけで数える（丸い石ほど軽く・回りやすくなってしまう）ので、質量と回りにくさは自分で入れる。
   持っている石は物理の世界に入れず、離すと まっすぐ下へ「そっと」下ろす（形ごと下へ shape cast して、当たる直前で手を離す）。
   下ろしながら、手は石を「すぐ下の石の上の面」と平行に傾ける（置く人の手つき）。指の位置・回す・離すは時刻つきで記録し、物理の時刻で使う。
   乗ったか・崩れたかは Rapier の結果（位置）だけで決める: どれか1個でも台石より下（河原）へ落ちたら終わり。高さは止まった塔のいちばん上。
   放置で崩れないように: 摩擦大きめ・ころがりの抵抗・落ち着いたら眠らせる。塔の上から KEEP より下で止まった石は固定（fixed）にし、
   そのかわり、固定した石とその上ぜんぶの重心が、その石の下の接触点（Rapier の接触から取った）の囲む範囲に入っているかを毎回しらべ、
   はみ出したら固定をといて物理にまかせる（本物なら崩れる傾き方なら、ちゃんと崩れる）。 */
const PH = {
  G: 98.1, DT: 1 / 120, ITERS: 10, PRED: 0.04,
  BASE: 3.0, BASE_R: 1.5, BASE_B: 0.4, MOUND_R: 2.4, MOUND_Y: -0.6,   // 台石: 上の面の高さ・半径・ふちの丸み / 下の丸いところ
  MU: 0.9, E: 0.02,                         // 石どうしの摩擦・はね返り
  LDAMP: 0.15, ADAMP: 1.5,                  // 空気・ころがりの抵抗
  HOVER: 1.0,                               // 持っている石の底と、塔のいちばん上のすきま
  FOLLOW: 14,                               // 手が指に追いつく速さ（1/秒）
  YAW_STEP: Math.PI / 12,                   // 回すボタン1回（15°）
  V_MAX: 6, V_MIN: 0.6, V_K: 3.5, V_REL: 0.3,  // 下ろす速さ（当たる直前は 6cm/秒）・手を離すときの速さ
  ENTER: 0.35, LEAN_K: 12,
  SETTLE_MIN: 0.5, SETTLE_MAX: 4, CALM: 0.003,
  LOSE: 0.6,                                // 石の重心が 台石の上面 - これ より下 = 河原に落ちた
  KEEP: 2.2, SUP: 0.9,                      // 固定する深さ / 支えの範囲を何割に縮めて重心をしらべるか
  AIM_R: 4.5,
  KN: 7, KR: 5, X0: 1.1, X1: 0.66, TK0: 0.32, TK1: 0.45, RHO0: 0.65, RHO1: 0.9, RHO_MAX: 0.92, W0: 0.05, W1: 0.06, W2: 0.03,   // 石の変わり方（何個目で、どれだけ小さく・丸く）
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const qAxisO = (ax, ay, az, a) => { const s = Math.sin(a / 2); return { x: ax * s, y: ay * s, z: az * s, w: Math.cos(a / 2) }; };
const qMulO = (a, b) => ({ w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z, x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y, y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x, z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w });
const qConjO = q => ({ x: -q.x, y: -q.y, z: -q.z, w: q.w });
function qRotO(q, v) {
  const { x, y, z, w } = q;
  const ix = w * v.x + y * v.z - z * v.y, iy = w * v.y + z * v.x - x * v.z, iz = w * v.z + x * v.y - y * v.x, iw = -x * v.x - y * v.y - z * v.z;
  return { x: ix * w + iw * -x + iy * -z - iz * -y, y: iy * w + iw * -y + iz * -x - ix * -z, z: iz * w + iw * -z + ix * -y - iy * -x };
}
const qFromUp = n => { const l = Math.hypot(n.x, n.y, n.z), x = n.x / l, y = n.y / l, z = n.z / l, w = 1 + y; if (w < 1e-6) return { x: 1, y: 0, z: 0, w: 0 }; const m = Math.hypot(z, w, x); return { x: z / m, y: 0, z: -x / m, w: w / m }; };
const qNlerp = (a, b, k) => { const d = a.x * b.x + a.y * b.y + a.z * b.z + a.w * b.w, s = d < 0 ? -1 : 1; const q = { x: a.x + (b.x * s - a.x) * k, y: a.y + (b.y * s - a.y) * k, z: a.z + (b.z * s - a.z) * k, w: a.w + (b.w * s - a.w) * k }; const l = Math.hypot(q.x, q.y, q.z, q.w); return { x: q.x / l, y: q.y / l, z: q.z / l, w: q.w / l }; };
const vAdd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y, z: a.z + b.z });
const lerpO = (a, b, k) => a + (b - a) * k;
const clampO = (v, a, b) => Math.max(a, Math.min(b, v));
const GRP = { WORLD: 0x0001, STONE: 0x0002 };
const groups = (member, filter) => ((member & 0xffff) << 16) | (filter & 0xffff);
// 何個目（n）のときのカメラの向き（塔のまわりを左右にゆっくり回る）。石が出てくる横の向き・ボットの「奥行きの見えにくさ」にも使う
const camYawOf = n => 0.72 * Math.sin(n * 1.7 + 0.6);

/* ----- 石の形 -----
   parts: 角を丸めた箱 { h: 半分の大きさ（丸めの内側）, b: 丸め, p, q, dens }
   X, Z: 横の半分の長さ（丸めこみ） / T: 厚みの半分 / rho: 丸めの割合（1 で厚みぜんぶが丸い＝平らな面がせまい） */
function stoneSpec(n, rnd) {
  const k = 1 - Math.exp(-n / PH.KN);
  const s = { n, parts: [], bonus: false, wedge: 0, look: Math.floor(rnd() * 1e6) };
  let X, Z, T, rho;
  if (n >= 4 && rnd() < Math.min(0.15, 0.05 + 0.005 * n)) {
    // ボーナス: 平たい石（平らな面が広く、次の土台になる）。大きすぎると頭が重いので、ふつうの石より ひとまわり大きいくらい
    s.bonus = true;
    X = lerpO(PH.X0, PH.X1, k) * (1.15 + rnd() * 0.15); Z = X * (0.72 + rnd() * 0.2); T = X * 0.2; rho = 0.75;
  } else {
    X = lerpO(PH.X0, PH.X1, k) * (0.9 + rnd() * 0.2);
    Z = X * (0.6 + rnd() * 0.35);
    T = Math.min(X * lerpO(PH.TK0, PH.TK1, k) * (0.85 + rnd() * 0.3), Z * 0.95);
    rho = clampO(lerpO(PH.RHO0, PH.RHO1, 1 - Math.exp(-n / PH.KR)) + (rnd() - 0.5) * 0.2, 0.35, PH.RHO_MAX);
  }

  const bank = new THREE.Mesh(new THREE.PlaneGeometry(3000, 800), lam('#5f6447')); bank.rotation.x = -Math.PI / 2; bank.position.set(0, 0.06, -570); scene.add(bank);

/* ---------- ゲーム状態 ---------- */
let game = null, bot = null, meshes = new Map(), state = 'loading';     // loading | title | play | over | skip
let tt = 0, t0 = 0, lagS = 0.05, overShownAt = 0, failAt = -1, pops = [], shake = 0, slowK = 1, slowT = 0, bumpT = 0, newShown = false, frozen = false;
let sessionPlays = 0, botStart = false, stepMs = 0, lite = false, markIdx = 0, tipT = 0, tipText = '', rewind = null, seenWedge = false;
function upcomingSeed() { return HASH.has('seed') ? ((+HASH.get('seed') >>> 0) + 7919 * sessionPlays) >>> 0 : seed; }
function clearMeshes() { for (const m of meshes.values()) { scene.remove(m); m.geometry.dispose(); } meshes.clear(); }
function newGame(s) {
  if (game) game.free();
  clearMeshes();
  game = makeGame(RAPIER, s >>> 0);

  bot = null; t0 = performance.now() - (game.t + lagS) * 1000;
  pops = []; failAt = -1; shake = 0; slowK = 1; slowT = 0; bumpT = 0; newShown = false; frozen = false; markIdx = 0; tipT = 0; rewind = null; ptr = null;
  snapCam = true;
}
function nextSeed() { const s = seed; seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return s; }
function meshOf(st) { let m = meshes.get(st); if (!m) { m = makeStoneMesh(st.s); meshes.set(st, m); scene.add(m); } return m; }

/* ---------- 物理を進める（入力は時刻つきで記録して、物理の時刻で使う） ---------- */
const simTime = ts => (ts - t0) / 1000;
// 指を動かした瞬間に「見えていた」物理の時刻（画面は lagS だけ遅れて描いている）
function queue(q, ts) { if (game && !bot) game.input({ ...q, t: Math.max(simTime(ts) - lagS, game.t) }); }
const botEmit = q => game.input({ ...q });
function advance(now) {
  if (!game || frozen) return;
  const target = simTime(now) - lagS, c0 = performance.now(); let n = 0;
  while (game.t + PH.DT <= target) {
    if (bot) bot.tick(game, botEmit);
    game.step(); n++;
    if ((n & 3) === 0 && performance.now() - c0 > 22) break;
  }
  if (n) stepMs += ((performance.now() - c0) / n - stepMs) * 0.05;
  if (stepMs > 1.6 && !lite && n > 2) { lite = true; game.setIters(7); }   // 重い端末: 物理の解く回数を減らす
  handleEvents();
  const behind = target - game.t;
  if (behind > 0.12) t0 += (behind - 0.03) * 1000;   // 重い端末で追いつけないときは、ゆっくり進む（止まらない）
}

/* ---------- 音（河原の石の音。低くこもらせ、2kHz 以上は使わない） ---------- */
let ac = null, master = null, noiseBuf = null, riverG = null;
function wakeAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = 0.5;
      master = ac.createDynamicsCompressor(); master.threshold.value = -16; master.ratio.value = 5;
      master.connect(lp).connect(ac.destination);
      const len = ac.sampleRate * 3; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); let b = 0;
      for (let i = 0; i < len; i++) { b = b * 0.97 + (Math.random() * 2 - 1) * 0.03; d[i] = b * 6; }   // 低い（茶色い）ノイズ
      // せせらぎ: 低いノイズを、ゆっくり揺らしてずっと流す
      const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const f1 = ac.createBiquadFilter(); f1.type = 'lowpass'; f1.frequency.value = 420; f1.Q.value = 0.4;
      const f2 = ac.createBiquadFilter(); f2.type = 'peaking'; f2.frequency.value = 260; f2.gain.value = 5; f2.Q.value = 0.8;
      riverG = ac.createGain(); riverG.gain.value = 0;
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.17; lg.gain.value = 0.012; lfo.connect(lg).connect(riverG.gain); lfo.start();
      const lfo2 = ac.createOscillator(), lg2 = ac.createGain(); lfo2.frequency.value = 1.3; lg2.gain.value = 40; lfo2.connect(lg2).connect(f2.frequency); lfo2.start();
      src.connect(f1).connect(f2).connect(riverG).connect(master); src.start();
    }
    if (ac.state === 'suspended') ac.resume();
    riverG.gain.setTargetAtTime(0.05, ac.currentTime, 0.8);
  } catch {}
}
const live = () => ac && (state === 'play');
function tone(freq, at, dur, vol, type = 'sine', f1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at); if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
}
function noise(at, dur, vol, type, freq, q = 1) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(lp).connect(g).connect(master); s.start(at, Math.random() * 2); s.stop(at + dur + 0.05);
}
// 石と石の「こつ」: 短い低い音（大きい石ほど低い）と、こもった当たりの雑音
function knock(at, k, size = 1) {
  const f = (170 + Math.random() * 80) / Math.sqrt(size);
  tone(f, at, 0.07, 0.16 * k, 'sine', f * 0.78);
  tone(f * 2.4, at, 0.035, 0.04 * k, 'triangle');
  noise(at, 0.03, 0.22 * k, 'lowpass', 700, 0.7);
}
let lastTok = 0;
function sTok(e) { try { if (!live()) return; const n0 = ac.currentTime; if (n0 - lastTok < 0.035) return; lastTok = n0; const k = clamp(e.dv / 12, 0.1, 1), sz = Math.max(0.6, e.st.s.X * 1.3); if (e.ground) { noise(n0, 0.09, 0.3 * k, 'bandpass', 480, 0.8); tone(110, n0, 0.08, 0.1 * k, 'sine', 80); } else knock(n0, k, sz); } catch {} }
// 手を離した「ことん」
function sPlace() { try { if (!live()) return; knock(ac.currentTime + 0.01, 0.35, 1.2); } catch {} }
function sOk(n) { try { if (!live()) return; const n0 = ac.currentTime + 0.05; tone(294, n0, 0.25, 0.035); tone(392, n0 + 0.08, 0.25, 0.028); if (n % 5 === 0) tone(494, n0 + 0.16, 0.32, 0.026); } catch {} }
// 崩れた「ごろごろ…」: 低いころがる音がつづく
function sCrash() {
  try {
    if (!live()) return; const n0 = ac.currentTime;
    noise(n0 + 0.05, 1.6, 0.35, 'lowpass', 220, 0.6);
    for (let i = 0; i < 12; i++) { const t = n0 + 0.08 + i * (0.07 + Math.random() * 0.08) + i * i * 0.005; knock(t, 0.9 - i / 16, 1.4 + Math.random()); }
  } catch {}
}
function sMark() { try { if (!live()) return; const n0 = ac.currentTime + 0.05; [[330, 0], [415, 0.09], [494, 0.18]].forEach(([f, t]) => tone(f, n0 + t, 0.4, 0.035)); } catch {} }
function sChime() { try { if (!live()) return; const n0 = ac.currentTime + 0.1; [[392, 0], [494, 0.1], [587, 0.2]].forEach(([f, t]) => tone(f, n0 + t, 0.45, 0.045)); } catch {} }

/* ---------- できごと（音・演出） ---------- */
function addPop(text, opt = {}) { pops = pops.filter(p => p.keep); pops.push({ text, life: 0, dur: opt.dur || 1.2, size: opt.size || 24, hot: !!opt.hot, keep: !!opt.keep }); }
function handleEvents() {
  const loud = state === 'play';
  for (const e of game.events) {
    if (e.type === 'tok') { if (loud) sTok(e); }
    else if (e.type === 'place') { if (loud) sPlace(); }
    else if (e.type === 'spawn' && loud) {
      if (e.st.s.bonus) addPop('平たい石！ ひと休み', { size: 20, hot: true, dur: 1.6 });
      else if (e.st.s.wedge && !seenWedge) { seenWedge = true; tipText = 'くさび形の石 —「まわす」で傾きを打ち消せる'; tipT = 3; }
    }
    else if (e.type === 'ok' && loud) {
      bumpT = 0.3;
      const cm = game.heightCm();
      let mk = null;
      while (markIdx < MARKS.length && cm >= MARKS[markIdx].cm) { mk = MARKS[markIdx]; markIdx++; }
      if (mk) { addPop(`${mk.label}をこえた！`, { size: 22, hot: true, dur: 1.8 }); sMark(); }
      else if (e.n % 5 === 0) addPop(`${e.n}個！ ${cm}cm`, { size: 24 });
      if (e.n > rec.best && rec.best > 0 && !newShown) { newShown = true; addPop('自己ベスト更新！', { size: 20, hot: true, keep: true, dur: 1.8 }); sChime(); }
      else if (!mk) sOk(e.n);
      if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
    }
    else if (e.type === 'fail') {
      if (failAt < 0) failAt = tt;
      ptr = null;
      if (loud) { sCrash(); if (!reduceMotion) { shake = 0.3; slowK = 0.55; slowT = 0.8; } if (navigator.vibrate) try { navigator.vibrate([20, 40, 30]); } catch {} }
    }
  }
  game.events.length = 0;
}

/* ---------- カメラ ---------- */
let camYaw = camYawOf(0), camD = 16, snapCam = true, lookY = 5, lookX = 0, lookZ = 0, camE = 0.3, orbit = 0;
const VIEW = HASH.has('debug') ? HASH.get('view') : null;   // #debug&view=tower: 撮影用に塔ぜんぶを映す
const ELEV = 0.36;
const camLook = new THREE.Vector3();
// 世界の高さ y0..y1 を、画面の縦 s0..s1（0=上、1=下）に入れる距離と、見る高さ
function frameY(y0, y1, s0, s1, minD) {
  const t = Math.tan(camera.fov * DEG / 2);
  let D = (y1 - y0) / ((s0 - s1) * 2 * t);
  D = Math.max(D, minD);
  const yc = y1 - (0.5 - s1) * 2 * D * t;
  return { D, yc };
}
function updateCamera(dt) {

  let F, yaw, E = ELEV, lx = 0, lz = 0;
  const tf = game.topFace();
  if (state === 'title') { F = frameY(-0.3, PH.BASE + 4.6, 0.5, 0.16, 15); yaw = camYawOf(0) + 0.25; E = 0.14; }
  else if (overView && state === 'over') {
    // 結果: いちばん高かった塔を、ゆっくり回して見せる（カードの上に見えるように）
    F = frameY(Math.min(0.6, PH.BASE - 1), Math.max(game.maxTop + 0.8, PH.BASE + 3), 0.44, 0.1, 12);
    orbit += dt * 0.42; yaw = camYawOf(Math.max(0, game.stones.length - 1)) + orbit; E = 0.2;
  } else if (overView) { F = frameY(0, Math.max(game.maxTop + 0.8, PH.BASE + 3), 0.8, 0.2, 13); yaw = camYaw; E = 0.25; }
  else if (VIEW === 'tower') {
    // 撮影用: 塔ぜんぶと、持っている石と、夕日の空
    const cur = game.cur, h = cur ? cur.s.top - cur.s.bottom : 0.6;
    F = frameY(0, game.topY + PH.HOVER + h + 1.2, 0.86, 0.3, 12); yaw = camYawOf(cur ? cur.st.id : game.stones.length) + (+HASH.get('yaw') || 0); E = +HASH.get('elev') || 0.1;
    lx = tf.c.x * 0.5; lz = tf.c.z * 0.5;
  } else {
    const top = game.topY, cur = game.cur;
    const h = cur ? cur.s.top - cur.s.bottom : 0.6;
    F = frameY(Math.max(-0.5, top - 3.2), top + PH.HOVER + h + 0.9, 0.8, 0.22, 11);
    yaw = camYawOf(cur ? cur.st.id : game.stones.length);
    lx = tf.c.x; lz = tf.c.z;   // 塔が少しずれていっても、てっぺんを見る
  }
  const k = snapCam ? 1 : Math.min(1, dt * (state === 'over' ? 1.6 : 2.2));

  const sy = clamp(big ? (PH.BASE + game.maxTop) / 2 : lookY, 2, 400);
  const sh = big ? Math.max(6, (game.maxTop - PH.BASE) * 0.6 + 3) : 6;

  window.__ishizumi = {
    info: () => game && ({ state, phase: game.phase, reason: game.reason, t: +game.t.toFixed(3), score: game.score, cm: game.heightCm(), maxCm: game.maxCm(), topY: +game.topY.toFixed(3),
      stones: game.stones.length, frozen: game.stones.filter(s => s.frozen).length, unfrozen: game.unfrozen,
      cur: game.cur && { id: game.cur.st.id, x: +game.cur.x.toFixed(3), z: +game.cur.z.toFixed(3), tx: +game.cur.tx.toFixed(3), tz: +game.cur.tz.toFixed(3), yaw: +game.cur.yaw.toFixed(3), wedge: +game.cur.s.wedge.toFixed(3), bonus: game.cur.s.bonus },
      top: (() => { const c = topPt(); return { x: +c.x.toFixed(3), y: +c.y.toFixed(3), z: +c.z.toFixed(3) }; })(),
      // 画面の座標（Playwright で操作するため）: 持っている石・塔のてっぺん（上の面の真ん中）
      stoneScreen: game.cur && project(game.cur.x, game.cur.y, game.cur.z),
      topScreen: (() => { const c = topPt(); return project(c.x, c.y, c.z); })(),
      inq: game.inq.length, stepMs: +stepMs.toFixed(3), lite, frozenView: frozen, bot: !!bot, lagS: +lagS.toFixed(3), rec, seed }),
    // 持っている石を、塔のてっぺんの真上へ運ぶには、画面でどれだけドラッグすればいいか（px）
    dragTo: (ox = 0, oz = 0) => { if (!game.cur) return null; const c = topPt(), dx = c.x + ox - game.cur.tx, dz = c.z + oz - game.cur.tz, R = camRight(), F = camFwd(), ppu = pxPerUnit(); return { dx: (dx * R.x + dz * R.z) * ppu, dy: -(dx * F.x + dz * F.z) * ppu / DEPTH_GAIN }; },
    // 物理だけで N 回ぶん: sim('first', 20) → [個数...]。opts.rate = 指の動き・離した時刻をコマ（Hz）に丸める、opts.seed0
    sim: (skill = 'good', N = 10, opts = {}) => Array.from({ length: N }, (_, i) => runBot(RAPIER, SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'good', N = 10, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(RAPIER, SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n), cm = R.map(r => r.cm);
      return { skill, N, rate: opts.rate || 'exact', p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge2: R.filter(r => r.n >= 2).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), cm50: q(cm, 0.5) };
    },
    // 何もしないで sec 秒（物理だけ）: いまの塔がどれだけ動くか・落ちないか
    idle: (sec = 30) => { const T = game.onTower(), p0 = T.map(s => ({ ...s.body.translation() })); const t1 = game.t + sec; while (game.t < t1 && game.phase !== 'over') { game.step(); game.events.length = 0; } t0 = performance.now() - (game.t + lagS) * 1000; return { phase: game.phase, score: game.score, maxMove: +Math.max(0, ...T.map((s, i) => { const p = s.body.translation(); return Math.hypot(p.x - p0[i].x, p.y - p0[i].y, p.z - p0[i].z); })).toFixed(5) }; },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good') => { if (game && state === 'play' && game.phase !== 'over') bot = makeBot(SKILLS[skill], mulberry(nextSeed())); },
    skip: s => skipTo(game.t + s, 'none'),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    freeze: (on = true) => { frozen = on; if (!on) t0 = performance.now() - (game.t + lagS) * 1000; },
    PH, SKILLS, makeGame, runBot, makeBot, game: () => game,
  };
}
