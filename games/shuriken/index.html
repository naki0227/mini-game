<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 手裏剣の 物理（three には 頼らない 自前。長さ m・時間 秒・速さ m/s・角度 rad） ----------
   場所: 投げる 子どもは 原点、前（的の 方）が −z、右が +x、上が +y。手から 離れる 点 HAND。
   ねらい: 画面の ねらいの 点（ax, ay = 画面の 中心からの ずれ ÷ 画面の 高さの 半分）を、的ごとに 決まった カメラ（CAM から 的の 方を 見る。
     遠い 的ほど 少し ズーム）から 的の 面（z = 的の z）に 投影した 点 A。手から A へ 向けて 投げる（重力・浮き・曲がり・風が なければ A に 当たる）。
   ため: 押している 長さ h（秒）で ため c = 0〜1（0.08〜0.85 秒で いっぱい）。速さ V0 + V1·c、回転 S0 + S1·c（rad/s）。
     1.6 秒より 長く 押すと 手が ぷるぷる して ねらいが ぶれる。4 秒で 勝手に 投げる。
   飛ぶ 手裏剣 = 回る 平たい 円盤（フリスビーの 簡単な モデル）。空気に 対する 速さ（風を 引く）V、円盤の 向き（法線）n、迎え角 α（前が 上を 向くと +）:
     揚力 KA·V²·CL（CL = CL0 + CLA·α、速度に 垂直で n の 側）、抗力 KA·V²·CD（CD = CD0 + CDA·α²）。
     回転が 遅いと（安定度 stab = ω²/(ω²+WS²) が 小さいと）揚力が 減り、ばたついて 抗力が 増え、向きが ふらつく（FL）。
     頭を 上げる モーメント（CM0 + CMA·α）が ジャイロで 横倒しの 回転に なり（歳差。速さ = KM·V²·CM/ω）、円盤が 左へ 傾いて 左へ 曲がる。
     回転が 速いほど 傾きが ゆっくり → まっすぐ。遅いと すぐ 傾いて 曲がって 落ちる。
   的に 当たったら: 的に 対する 速さの 面に 垂直な 成分 un、当たる 角度、円盤の 向き、どの 刃が 先か で 決まる。
     un < UN_MIN → 勢いが なくて ぽとっ。ななめ すぎ（un/|u| < INC_MIN）→ かすって はじかれる。
     円盤の 面が 先（速度と 円盤の 面の 角度 > ~33°）か、円盤が 的と 平行 → 面から 当たって ぱちん。
     刃と 刃の 間が 当たると はじかれる（回転が 速いほど 次の 刃が すぐ 食いこむので 刺さりやすい）。
   それ以外は 刺さる（とすっ）。まん中からの きょりで「まんなか」。外れ（地面・柱・ちょうちん・的の 横へ）で おしまい。
   入力は すべて 時刻つき（画面の コマには よらない）。手裏剣は 離した 時刻ちょうどから 1/120 秒きざみで 飛ぶ。 */
const PH = {
  DT: 1 / 120, G: 9.8,
  RS: 0.055, KA: 0.4,
  CL0: 0.1, CLA: 1.5, CD0: 0.07, CDA: 1.5, CM0: 0.02, CMA: 0.3, KM: 2.6, SGN: -1, RMAX: 5,
  WS: 22, FL: 2.4, WDEC: 0.12, A0: 0.06,
  V0: 7.0, V1: 7.0, S0: 8, S1: 72,
  HC0: 0.06, HC1: 0.75, TREM: 1.6, TREM_K: 0.025, HMAX: 4, NREL: 0.002, NTILT0: 0.004, NTILT1: 0.15,
  TIPH0: 0.26, TIPH1: 0.011,
  UN_MIN: 2.6, INC_MIN: 0.5, FACE_LEAD: 0.55, FACE_BOARD: 0.85, RIM: 0.035,
  T_IDLE: 12, T_STUCK: 0.5, T_SWAP: 0.75, T_FAIL: 1.7, T_FLY: 4, T_READY0: 0.6,
  PER_BOARD: 2,
};
const CAM = { x: 0, y: 1.8, z: 2.5 };
const HAND = { x: 0.24, y: 0.92, z: 0.34 };
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const gaussR = r => (r() + r() + r() + r() - 2) * 1.732;
const TAU = Math.PI * 2;
const chargeOf = h => { const k = clampP((h - PH.HC0) / (PH.HC1 - PH.HC0), 0, 1); return 0.5 * k * (2 - k) + 0.5 * k * k * (3 - 2 * k); };
// 的（1まいに 2本 刺したら 次の 的）。b = 何まい目（0 から）。だんだん 遠く・小さく・動く・じゃまが 出る
function makeBoard(seed, b) {
  const R = mulberry((Math.imul(seed ^ 0x2545f491, 31) + Math.imul(b + 1, 0x9e3779b1)) >>> 0), U = (a, c) => a + (c - a) * R();
  // 前半（8まい目まで）で ぐんと むずかしく、あとは ゆっくり
  const k = clampP(b / 7, 0, 1), k2 = clampP((b - 7) / 24, 0, 1), bl = Math.max(0, b - 7);
  const d = Math.min(13, 3.6 + 0.8 * Math.min(b, 7) + 0.12 * bl);
  const kind = b === 0 ? 'ita' : b === 1 ? 'mato' : b === 2 ? 'wara' : ['ita', 'mato', 'wara', 'mato'][Math.floor(R() * 4)];
  const side0 = (seed & 1) ? 1 : -1, side = (b % 2 ? -1 : 1) * side0;
  const r = Math.max(0.15, (b ? 0.4 : 0.44) - 0.025 * Math.min(b, 7) - 0.003 * bl - 0.004 * Math.max(0, b - 16)) * (kind === 'wara' ? 1.15 : 1);
  const x0 = side * Math.min(1.1, U(0.38, 0.5 + 0.06 * b));
  const y0 = U(0.95, 1.5) + (b >= 4 ? U(-0.1, 0.25) : 0);
  const mot = [];
  const mk = ty => {
    if (ty === 'sway') return { type: ty, A: 0.32 + 0.38 * k + 0.25 * k2, T: U(2.7, 3.4) - 0.6 * k - 0.5 * k2, ph: U(0, TAU) };
    if (ty === 'slide') return { type: ty, A: 0.3 + 0.6 * k + 0.2 * k2, T: U(3.2, 4.2) - 1.0 * k - 0.4 * k2, ph: U(0, TAU) };
    if (ty === 'rot') return { type: ty, A: 0.55 + 0.55 * k + 0.2 * k2, T: U(2.8, 3.6) - 0.6 * k - 0.3 * k2, ph: U(0, TAU) };
    return { type: 'bob', A: 0.1 + 0.18 * k + 0.08 * k2, T: U(2.2, 3.0) - 0.3 * k2, ph: U(0, TAU) };
  };
  if (b >= 1 && b !== 2) {
    const ty = b < 4 ? 'sway' : kind === 'wara' ? ['sway', 'slide', 'bob'][Math.floor(R() * 3)] : ['sway', 'slide', 'rot', 'rot', 'bob'][Math.floor(R() * 5)];
    mot.push(mk(ty));
    if (b >= 6 && R() < 0.3 + 0.07 * (b - 6)) { const t2 = ['sway', 'rot', 'bob'].filter(t => t !== ty && !(kind === 'wara' && t === 'rot')); mot.push(mk(t2[Math.floor(R() * t2.length)])); }
  }
  const z = -d;
  // 的の わく（柱）: 動く はばの 外
  let ax = 0; for (const m of mot) if (m.type === 'sway' || m.type === 'slide') ax += m.A;
  const fw = ax + r + (kind === 'wara' ? 0.2 : 0.26);
  const obs = [{ kind: 'post', x: x0 - fw, z, r: 0.05, y1: y0 + r + 0.45 }, { kind: 'post', x: x0 + fw, z, r: 0.05, y1: y0 + r + 0.45 }];
  // じゃま（柱・ちょうちん）: 投げる 線の 近くに
  const tanH = 0.48 + (0.33 - 0.48) * clampP((d - 4) / 9, 0, 1);
  const B = { b, kind, d, z, x0, y0, r, rc: 0.17, hh: 0.55, mot, obs, fw, t0: 0, tanH, cam: camBasis(z, tanH, x0 * 0.45 + U(-0.35, 0.35)) };
  // じゃま（柱・ちょうちん）: 風が ない ときに いっぱい ためて 投げた 道すじの 近くに（柱は 少し よけた ところ、ちょうちんは 道すじの 上を ゆれる）
