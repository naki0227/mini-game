<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 薪割りの物理（自前。three には頼らない。長さ m・時間 秒・エネルギー J。y = 上、x = 右、z = 手前（自分の ほう）） ----------
   台: 切り株（上面の 高さ YB、半径 RBK）。その上に 玉切りの 丸太（半径 R、高さ H）を 立てる。木口（上面）の 座標は 丸太の 中心が 原点。
   木口: 年輪の 中心（髄）は 真ん中から 少し ずれる（px, pz）。干割れ（ひび）は 樹皮から 髄へ 向かう 線（角度 a、深さ d = 半径の 何割）。
     節（ふし）は 木口に 見える 黒っぽい 丸（中心・半径 r・下へ どれだけ 続くか len）。木の 種類で 割るのに 要る エネルギー（gc: 割れ目 1 m² あたり J）が ちがう。ねじれ木目は 1.3 倍、ひびも 効きにくい。
   斧: 押している 間 振りかぶる（T_UP 秒で いちばん 上）。離すと 振り下ろす。当たる 速さ v = V0 + V1·p（p = 振りかぶりの 高さ 0〜1）、運動エネルギー E = ½·M·v²。
     刃は 長さ EDGE の 線（向きは 奥←→手前 = z。手ぶれで 少し 回る yaw）。手ぶれ: ねらいが ゆっくり ゆれる（振りかぶるほど・上で 待つほど・疲れるほど 大きい）。時刻だけで きまる。
   当たり: 刃の 線が 節に かかると はじかれる。木口の ふち（樹皮）に 当たると 丸太が ころん。
     割れる 面の 候補: (A) 刃の 線 そのもの（髄から ずれるほど 手間 1 + OFF_K·(ずれ/R)²。ずれ > CHIP·R なら 端だけ 欠ける）、
       (B) 刃が かかった ひびの 線（髄を 通る。刃と ひびの 角度 Δ で くさびの 効き cos²Δ）。いちばん 少ない エネルギーで すむ 面で 割れる。
     面を 割る エネルギー = H × gc × (弦の 長さ − ひびが 先に 割れている 長さ + 節の はば × KNOT_M × 節の 長さ) ÷ くさびの 効き。E が 足りれば 真っ二つ（あまりは 台に ささる）、足りなければ 食いこんで 止まる。
   割れた 2つは 2D の 剛体（面に 垂直な 向きと 上下）として 台の 上で 外へ 倒れ、地面に 落ちる。
   疲れ: 振るたびに FAT_K·p² ふえ、FAT_TAU 秒で へる。入力は すべて 時刻つき（画面の コマには よらない）。1/240 秒きざみ。 */
const PH = {
  DT: 1 / 240, G: 9.8,
  YB: 0.46, RBK: 0.3,
  T_UP: 1.0, T_FORCE: 3.4, T_SET: 0.55, T_NEXT: 1.05, T_IDLE: 12,
  M: 2.2, V0: 4.5, V1: 8.0, A_MAX: 2.6,
  EDGE: 0.09, ETA: 0.88, CHECK_W: 0.01, KNOT_M: 7, OFF_K: 6, CHIP: 0.43, RIM: 0.97, BOUNCE: 0.8, KNOT_NEAR: 0.004,
  COVER: 0.92, TWIST: 1.3, TWIST_COVER: 0.55,
  FAT_K: 0.17, FAT_TAU: 7,
  W0: 0.003, W1: 0.006, W2: 0.032, W3: 0.022, Y0: 0.03, Y1: 0.05, Y2: 0.28, AIM_MAX: 1.5,
};
const SPECIES = {
  sugi: { jp: '杉', gc: 400, hard: 1 },
  matsu: { jp: '松', gc: 560, hard: 2 },
  nara: { jp: 'ナラ', gc: 760, hard: 3 },
  keyaki: { jp: 'ケヤキ', gc: 1000, hard: 4 },
};
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
function rndG(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function gaussG(g) { let u = rndG(g); while (u < 1e-9) u = rndG(g); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rndG(g)); }

/* ---------- 2D の 幾何（木口の 上） ---------- */
// 点 (x, z) の、直線（点 o・単位の 向き d）からの 符号つき 距離（法線 = (dz, −dx)）
const sdLine = (x, z, ox, oz, dx, dz) => (x - ox) * dz - (z - oz) * dx;
function dSeg(x, z, ax, az, bx, bz) { const vx = bx - ax, vz = bz - az, l2 = vx * vx + vz * vz || 1e-12; let u = ((x - ax) * vx + (z - az) * vz) / l2; u = u < 0 ? 0 : u > 1 ? 1 : u; return Math.hypot(x - ax - u * vx, z - az - u * vz); }
const orient = (ax, az, bx, bz, cx, cz) => (bx - ax) * (cz - az) - (bz - az) * (cx - ax);
function segSeg(ax, az, bx, bz, cx, cz, dx, dz) {
  const o1 = orient(ax, az, bx, bz, cx, cz), o2 = orient(ax, az, bx, bz, dx, dz), o3 = orient(cx, cz, dx, dz, ax, az), o4 = orient(cx, cz, dx, dz, bx, bz);
  if (o1 * o2 < 0 && o3 * o4 < 0) return 0;
  return Math.min(dSeg(ax, az, cx, cz, dx, dz), dSeg(bx, bz, cx, cz, dx, dz), dSeg(cx, cz, ax, az, bx, bz), dSeg(dx, dz, ax, az, bx, bz));
}
// 髄から 角度 a の 向きに 樹皮まで の 距離
function rimDist(L, a) { const cx = Math.cos(a), cz = Math.sin(a), b = L.px * cx + L.pz * cz, c = L.px * L.px + L.pz * L.pz - L.R * L.R; return -b + Math.sqrt(Math.max(0, b * b - c)); }
function setCheck(L, c) { const u1 = rimDist(L, c.a), cx = Math.cos(c.a), cz = Math.sin(c.a); c.x1 = L.px + cx * u1; c.z1 = L.pz + cz * u1; c.x0 = L.px + cx * u1 * (1 - c.d); c.z0 = L.pz + cz * u1 * (1 - c.d); c.len = u1 * c.d; return c; }
// ひびの うち、直線の すぐ そば（±CHECK_W）に ある 長さ
function bandLen(c, ox, oz, dx, dz) {
  const d0 = sdLine(c.x0, c.z0, ox, oz, dx, dz), d1 = sdLine(c.x1, c.z1, ox, oz, dx, dz), w = PH.CHECK_W;
  if (Math.abs(d1 - d0) < 1e-9) return Math.abs(d0) < w ? c.len : 0;
  let u0 = (-w - d0) / (d1 - d0), u1 = (w - d0) / (d1 - d0); if (u0 > u1) { const s = u0; u0 = u1; u1 = s; }
  return Math.max(0, Math.min(1, u1) - Math.max(0, u0)) * c.len;
}

/* ---------- 割る 面の 手間 ---------- */
function planeNeed(L, ox, oz, dx, dz, out) {
  const R = L.R, dG = sdLine(0, 0, ox, oz, dx, dz), chord = 2 * Math.sqrt(Math.max(0, R * R - dG * dG));
  let cover = 0, kw = 0, kn = null;
  for (const c of L.checks) cover += bandLen(c, ox, oz, dx, dz);
  cover *= L.tw ? PH.TWIST_COVER : 1;
  for (const k of L.knots) { const q = Math.abs(sdLine(k.x, k.z, ox, oz, dx, dz)); if (q < k.r) { kw += 2 * Math.sqrt(k.r * k.r - q * q) * PH.KNOT_M * k.len; kn = k; } }
