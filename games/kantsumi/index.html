<style>

}

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';
let THREE, RAPIER;
try {
  const [t, r] = await Promise.all([import(THREE_URL), import(RAPIER_URL)]);
  THREE = t; RAPIER = r.default;
  await RAPIER.init();
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D/物理エンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 缶つみの物理（three には頼らない。Rapier の剛体だけ） ----------
   長さの単位は 10cm（ジュースの缶は 直径6.6cm・高さ12.2cm → 半径0.33・高さ1.22）。重力も 10 倍（98.1）で、本物と同じ速さで起きる。
   台は駄菓子屋の前の丸椅子（座面の半径 13cm）。缶は1個ずつ、上から糸で吊られて左右に揺れながら来る。
   糸を離した瞬間の位置・速さ・傾き（振り子の角度）のまま缶は落ちて、下の缶の上で止まるか、すべるか、倒れるか。
   缶は円柱（cylinder）、一斗缶は箱（cuboid）。潰れた缶・くの字にへこんだ缶は、円柱を組み合わせた形。
   乗ったか・崩れたかは Rapier の結果（位置）だけで決める: どれか1個でも座面より下へ落ちたら終わり。高さは止まった塔のいちばん上。
   Rapier では円柱を何十個も縦に積むと、解き方のゆらぎで勝手に歩いて崩れる。そこで、塔の上から KEEP より下で止まった缶は
   固定（fixed）に切りかえる。そのかわり、固定した缶の上に乗っている全部の重心が、支えの面からはみ出していないかを毎回しらべ、
   はみ出したら固定をといて（ふつうの剛体にもどして）物理にまかせる（本物なら崩れる傾き方なら、ちゃんと崩れる）。 */
const PH = {
  G: 98.1, DT: 1 / 120, ITERS: 8, PRED: 0.05,
  SEAT: 4.5, SEAT_R: 1.3,                 // 丸椅子の座面の高さと半径
  MU: 0.55, MU_SEAT: 0.6, E: 0.04,        // 缶どうしの摩擦・座面の摩擦・はね返り
  LDAMP: 0.05, ADAMP: 0.3,                // 空気・ころがりの抵抗（ころがる缶が少しずつ止まる）
  STR: 25,                                // 糸の長さ（振り子の傾き = 横のふれ / 糸の長さ）
  ENTER: 0.7, ENTER_H: 5,                 // 次の缶が上から下りてくる時間と高さ
  SETTLE_MIN: 0.4, SETTLE_MAX: 3.2, CALM: 0.004,
  LOSE: 0.35,                             // 缶の中心が 座面 - これ より下 = 落ちた
  KEEP: 2.5, SUP: 0.96,                   // 固定する深さ / 重心が支えの面の何割より外なら固定をとく
  SEG: 12,
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const qAxisO = (ax, ay, az, a) => { const s = Math.sin(a / 2); return { x: ax * s, y: ay * s, z: az * s, w: Math.cos(a / 2) }; };
const qMulO = (a, b) => ({ w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z, x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y, y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x, z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w });
function qRotO(q, v) {
  const { x, y, z, w } = q;
  const ix = w * v.x + y * v.z - z * v.y, iy = w * v.y + z * v.x - x * v.z, iz = w * v.z + x * v.y - y * v.x, iw = -x * v.x - y * v.y - z * v.z;
  return { x: ix * w + iw * -x + iy * -z - iz * -y, y: iy * w + iw * -y + iz * -x - ix * -z, z: iz * w + iw * -z + ix * -y - iy * -x };
}
const vAdd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y, z: a.z + b.z });
const GRP = { WORLD: 0x0001, CAN: 0x0002 };
const groups = (member, filter) => ((member & 0xffff) << 16) | (filter & 0xffff);

/* ----- 缶の種類 -----
   juice: 350ml のジュース缶 / tall: 500ml のロング缶 / coffee: 細い 190g のコーヒー缶 / tuna: ツナ缶（ひくくて広い）
   tin: お菓子の丸い缶（広い） / kaku: 一斗缶っぽい四角い缶 / crushed: 踏まれて潰れた缶（ひくく、まんなかがふくらむ）
   slant: くの字にへこんだ缶（上半分が傾いていて、上の面がななめ） */
const CAN_TYPES = {
  juice: { r: 0.33, h: 1.22, name: 'ジュース缶' },
  tall: { r: 0.33, h: 1.68, name: 'ロング缶' },
  coffee: { r: 0.265, h: 1.05, name: 'コーヒー缶' },
  tuna: { r: 0.42, h: 0.40, name: 'ツナ缶' },
  tin: { r: 0.78, h: 0.55, name: 'お菓子の缶', dens: 0.45 },
  kaku: { r: 0.6, h: 1.7, name: '一斗缶', dens: 0.3 },
  crushed: { r: 0.33, h: 0.7, name: '潰れた缶' },
  slant: { r: 0.33, h: 1.18, name: 'へこんだ缶' },
};
// 何個目（n: 0〜）で、どの缶が来やすいか。高くなるほど細い・変な形が増える
function canWeights(n) {
  return {
    juice: 1,
    tuna: n < 2 ? 0 : n < 18 ? 0.35 : 0.2,
    tall: n < 4 ? 0 : 0.45,
    coffee: n < 6 ? 0 : Math.min(0.8, 0.25 + 0.02 * n),
    tin: n < 5 ? 0 : 0.1,
    kaku: n < 9 ? 0 : 0.07,
    crushed: n < 7 ? 0 : Math.min(0.55, 0.12 + 0.02 * (n - 7)),
    slant: n < 11 ? 0 : Math.min(0.7, 0.1 + 0.025 * (n - 11)),
  };
}
function canSpec(n, rnd) {
  const w = canWeights(n);
  let sum = 0; for (const k in w) sum += w[k];
  let r = rnd() * sum, type = 'juice';
  for (const k in w) { r -= w[k]; if (r <= 0) { type = k; break; } }
  const T = CAN_TYPES[type];
  const s = { n, type, name: T.name, mu: PH.MU, dens: T.dens || 1, look: Math.floor(rnd() * 6), r: T.r, h: T.h, parts: [], bend: null };
  const I = { x: 0, y: 0, z: 0, w: 1 };
  if (type === 'kaku') s.parts.push({ box: { hx: T.r, hy: T.h / 2, hz: T.r }, p: { x: 0, y: 0, z: 0 }, q: I });
  else if (type === 'crushed') {
    s.h = 0.6 + rnd() * 0.22;
    const bul = 1.12 + rnd() * 0.12;
    s.parts.push({ r: T.r, hh: s.h / 2, p: { x: 0, y: 0, z: 0 }, q: I });
    s.parts.push({ r: T.r * bul, hh: s.h * 0.17, p: { x: 0, y: -s.h * 0.06, z: 0 }, q: I, bulge: true });
    s.bul = bul;
  } else if (type === 'slant') {
    // くの字: 下の円柱の上に、ななめの円柱。曲がり目は 下から h1
    const k = Math.min(1, (n - 11) / 25);
    const th = 0.1 + rnd() * (0.05 + 0.08 * k), al = rnd() * Math.PI * 2;
    const h1 = s.h * (0.45 + rnd() * 0.15), h2 = s.h - h1, yb = -s.h / 2 + h1;
    const q = qAxisO(Math.sin(al), 0, -Math.cos(al), th);
    const up = qRotO(q, { x: 0, y: h2 / 2, z: 0 });
    s.parts.push({ r: T.r, hh: h1 / 2, p: { x: 0, y: -s.h / 2 + h1 / 2, z: 0 }, q: I });
    s.parts.push({ r: T.r * 0.985, hh: h2 / 2, p: { x: up.x, y: yb + up.y, z: up.z }, q });
    s.bend = { th, al, yb };
  } else s.parts.push({ r: T.r, hh: T.h / 2, p: { x: 0, y: 0, z: 0 }, q: I });
  // 高さを測る点（各部品の上と下の面のふち）・いちばん下の面・いちばん上の面
  s.pts = [];
  for (const P of s.parts) {
    if (P.box) { for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) s.pts.push({ x: sx * P.box.hx, y: sy * P.box.hy, z: sz * P.box.hz }); continue; }
    for (const yy of [-P.hh, P.hh]) for (let i = 0; i < PH.SEG; i++) { const a = i / PH.SEG * Math.PI * 2; s.pts.push(vAdd(P.p, qRotO(P.q, { x: Math.cos(a) * P.r, y: yy, z: Math.sin(a) * P.r }))); }
  }
  const P0 = s.parts[0], PN = s.parts[s.parts.length - 1];
  const hy = P => P.box ? P.box.hy : P.hh, rr = P => P.box ? Math.min(P.box.hx, P.box.hz) : P.r;
  s.botF = { c: vAdd(P0.p, qRotO(P0.q, { x: 0, y: -hy(P0), z: 0 })), r: rr(P0) };
  s.topF = { c: vAdd(PN.p, qRotO(PN.q, { x: 0, y: hy(PN), z: 0 })), r: rr(PN), n: qRotO(PN.q, { x: 0, y: 1, z: 0 }) };

}

    .setTranslation(P.p.x, P.p.y, P.p.z).setRotation(P.q).setFriction(s.mu).setRestitution(PH.E).setDensity(s.dens));

// 揺れ: 缶は糸の先で左右にふれ（A, w）、糸を持つ手もゆっくり左右に動く（B, wp）。
// ふれの真ん中は速い（落とすと横に流れて、塔を押す）。ふれの端は止まっている（そっと置ける）が、端が塔の真上に来るのは ときどき。
// 何個目かで、ふれ幅・速さ・落とす高さ・前後のゆれが増える（上限は見えにくく、ゆっくり）
function swingOf(n, rnd) {
  const A = Math.min(1.5, 0.2 + 0.045 * Math.min(n, 8) + 0.025 * Math.max(0, n - 8)) * (0.85 + rnd() * 0.3);
  const T = Math.max(1.5, 2.8 - 0.022 * n) * (0.92 + rnd() * 0.16);
  const B = A * (0.8 + rnd() * 0.5), Tp = 4.5 + rnd() * 2.5;
  const gap = 0.25 + Math.min(0.3, 0.008 * n);
  const Az = n < 12 ? 0 : Math.min(0.25, 0.012 * (n - 12));
  return { A, w: Math.PI * 2 / T, B, wp: Math.PI * 2 / Tp, php: rnd() * Math.PI * 2, gap, Az, wz: Math.PI * 2 / (T * (1.3 + rnd() * 0.4)), phz: rnd() * Math.PI * 2 };
}

function makeGame(RAPIER, seed = 1) {

  ip.numSolverIterations = PH.ITERS;

      .setTranslation(st.p.x, st.p.y, st.p.z).setRotation(st.q);

    const xr = S.A * Math.sin(S.w * tt + cur.ph), vr = S.A * S.w * Math.cos(S.w * tt + cur.ph);    // 糸のふれ

    g.cans.push(c);

  }
  function hangStep(t) {

  }
  // 糸を離す（時刻 tq。少し前の時刻でも、その時の位置・速さから正しく落とす）。吊っている間は物理の世界に入れていない

    build(c, 'dynamic', { p: { x: S.x + S.vx * dt, y: S.y - 0.5 * PH.G * dt * dt, z: S.z + S.vz * dt }, q: S.q, v: { x: S.vx, y: -PH.G * dt, z: S.vz }, w: { x: S.wx, y: S.wy, z: S.wz } });

  // 落ち着いたか: 0.1秒ごとの位置と傾きの変化で見る

    let m = 0;
    if (calmPrev) for (let i = 0; i < cur.length; i++) { const a = cur[i], b = calmPrev[i]; if (a && b) m = Math.max(m, Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z), Math.hypot(a.u.x - b.u.x, a.u.z - b.u.z) * 0.5); }

  // 音・演出: 速さの急な変化（ぶつかった）

      mx /= m; mz /= m;
      const ff = G.F.get(f);
      if (Math.hypot(mx - ff.top.x, mz - ff.top.z) > ff.rt * PH.SUP) return { f, why: 'top' };
      if (ks.length === 1 && G.sup.get(ks[0]).length === 1) {

      for (const c of g.cans) if (c.state === 'rest') c.body.wakeUp();

    g.topY = m; g.maxTop = Math.max(g.maxTop, m);

    for (const o of g.cans) if (o.state === 'rest' && !o.frozen) o.body.sleep();

  g.step = () => {
    feed();

      g.settleT += PH.DT;
      g.calmT = calmNow ? g.calmT + PH.DT : 0;
      if ((g.settleT > PH.SETTLE_MIN && g.calmT > 0.2) || g.settleT > PH.SETTLE_MAX) settled();
    } else if (g.phase === 'hang' || g.phase === 'enter') {

      g.restT = calmNow ? (g.restT || 0) + PH.DT : 0;
      if (g.restT > 0.5) { g.restT = 0; for (const o of g.cans) if (o.state === 'rest' && !o.frozen && !o.body.isSleeping()) o.body.sleep(); }
    }
  };
  g.setIters = n => { ip.numSolverIterations = n; };
  g.free = () => world.free();
  spawn();
  return g;
}
// 店先の当たり（見た目と同じ場所）: [半幅, 半高, 半奥, x, y, z]
const SCENE_BOXES = [
  [4.5, 0.25, 1.6, -8, 4.25, -1.5],      // ベンチの座面
  [5, 9.15, 3.5, 7.5, 9.15, -6],          // 自販機
  [45, 30, 1, 0, 30, -25],               // 店の壁
];

/* ---------- ボット（物理だけで遊ぶ。sim / stats / autoplay / OGP 用） ----------
   first: 初めての人。缶が塔の真上に来たように見えたら押す（揺れの速さの分の先読みはしない）。押すタイミングが ±0.1 秒ほどばらつく。
   good: 上手な人。離したあと横に流れる分を先読みし、ふれの端（横の速さが小さい）で塔の真上に来る瞬間を待つ。
         塔の上の方が傾いていたら、反対側へ少し寄せる。タイミングのばらつきは ±0.03 秒ほど。 */
const SKILLS = {
  first: { wait: [0.3, 1.4], sd: 0.1, lead: 0, wild: 0.12, wildSd: 0.25, comp: 0, slow: 0, look: 0 },
  good: { wait: [0.3, 0.8], sd: 0.03, lead: 1, wild: 0.02, wildSd: 0.08, comp: 0.7, slow: 0.06, look: 7 },
};
function makeBot(sk, rnd) {
  const R = a => a[0] + (a[1] - a[0]) * rnd();
  const gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += rnd(); return (u - 3) / Math.sqrt(0.5); };
  const B = { sk, plan: null, cur: null };
  // ねらう場所: いちばん上の缶の上の面の真ん中。上手な人は、固定していない上の方の重心のずれを打ち消す側へ寄せる
  function target(g) {
    const top = g.topCan();
    if (!top) return { x: 0, z: 0 };
    const f = g.toW(top, top.s.topF.c);
    let x = f.x, z = f.z;
    if (sk.comp) {
      let base = { x: 0, z: 0 }, by = -1e9;
      for (const c of g.onTower()) if (c.frozen) { const p = g.toW(c, c.s.topF.c); if (p.y > by) { by = p.y; base = p; } }
      let mx = 0, mz = 0, m = 0;
      for (const c of g.onTower()) if (!c.frozen) { const p = g.comOf(c); mx += p.x * c.mass; mz += p.z * c.mass; m += c.mass; }
      if (m) {
        mx /= m; mz /= m;
        const lim = top.s.topF.r * 0.5;
        x -= Math.max(-lim, Math.min(lim, (mx - base.x) * sk.comp));
        z -= Math.max(-lim, Math.min(lim, (mz - base.z) * sk.comp));
      }
    }
    return { x, z };
  }
  B.target = target;
  function plan(g) {
    const cur = g.cur, T = target(g);
    const tf = Math.sqrt(2 * cur.sw.gap / PH.G);
    const t0 = g.t + R(sk.wait);
    let best = null;
    if (sk.look) {
      // 上手な人: これから数秒のうちで、落ちる先がねらいに近く、横の速さが小さい（ふれの端）瞬間を待つ
      for (let t = t0; t < t0 + sk.look; t += 0.005) {
        const S = g.swing(t);
        const d = Math.hypot(S.x + S.vx * (tf + 0.012) - T.x, S.z + S.vz * tf - T.z) + sk.slow * S.vx * S.vx;
        if (!best || d < best.d) best = { t, d };
      }
    } else {
      // 初めての人: 缶が塔の真上に来たように見えた最初の瞬間に押す（速さの分の先読みはしない）
      for (let t = t0; t < t0 + 12; t += 0.005) {
        const S = g.swing(t), d = Math.abs(S.x - T.x);
        if (!best || d < best.d) best = { t, d };
        if (d < 0.04) break;
      }
    }
    const wild = rnd() < sk.wild;
    return best.t + gauss() * (wild ? sk.wildSd : sk.sd);
  }
  B.tick = (g, emit) => {
    if (g.phase !== 'hang' || !g.cur) return;
    if (B.cur !== g.cur) { B.cur = g.cur; B.plan = plan(g); B.sent = false; }
    if (!B.sent && g.t >= B.plan - PH.DT) { B.sent = true; emit({ type: 'drop', t: Math.max(B.plan, g.t) }); }
  };
  return B;
}
// ボットで1回遊ぶ（物理だけ）。opts.rate: 押した時刻を画面のコマ（Hz）に丸める。opts.maxN: 打ち切り（個）
function runBot(RAPIER, sk, seed, opts = {}) {
  const g = makeGame(RAPIER, seed);
  if (opts.iters) g.setIters(opts.iters);
  const bot = makeBot(sk, mulberry(seed * 7 + 3));

    const S = cur.S, top = cur.c.s.top;
    const q = new THREE.Quaternion(S.q.x, S.q.y, S.q.z, S.q.w);
    // 糸は缶のまんなかの上（タブ）から。缶の自転（yaw）は糸に関係ないので、傾きだけ
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
    const ax = S.x + up.x * top, ay = S.y + up.y * top, az = S.z + up.z * top;
    clip.position.set(ax, ay + 0.12, az); clip.quaternion.copy(q);
    const p = string.geometry.attributes.position;
    p.setXYZ(0, ax, ay + 0.3, az); p.setXYZ(1, S.xp, ay + PH.STR, 0); p.needsUpdate = true;
    // 真下に塔のいちばん上の缶があるときだけ（その上の面に落ちる丸い影）
    const tc = game.topCan(), r = cur.c.s.type === 'kaku' ? cur.c.s.r * 2.2 : cur.c.s.r * 2;
    let on = !tc && Math.hypot(S.x, S.z) < PH.SEAT_R, yTop = PH.SEAT;
    if (tc) { const f = game.toW(tc, tc.s.topF.c); on = Math.hypot(S.x - f.x, S.z - f.z) < tc.s.topF.r + r * 0.4; yTop = f.y; }
    aimBlob.visible = aimBlob.visible && on;
    aimBlob.position.set(S.x, yTop + 0.012, S.z); aimBlob.scale.set(r, r, 1);
  }
}
function render(dt) {
  updateCamera(dt);
  syncMeshes();
  renderer.render(scene, camera);
  drawFx();
}
function txt(s, x, y, size, fill = '#fbf1e2', stroke = 'rgba(36,22,16,.9)', lw = 6, font = FD) {
  const wt = /^\d00 /.exec(font);
  fx.font = wt ? `${wt[0]}${size}px ${font.slice(wt[0].length)}` : `${size}px ${font}`; fx.lineJoin = 'round'; fx.lineWidth = lw; fx.strokeStyle = stroke; fx.strokeText(s, x, y); fx.fillStyle = fill; fx.fillText(s, x, y);
}
function drawFx() {
  fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fx.clearRect(0, 0, W, H);
  if (!game) return;
  const sc = Math.min(1, W / 390 + 0.05);
  if (state === 'play' || state === 'over' || state === 'skip') drawRuler(sc);
  fx.textAlign = 'center';
  if (state === 'play' || state === 'over' || state === 'skip') {
    const bump = reduceMotion ? 0 : Math.max(0, bumpT) * 2;
    fx.save(); fx.translate(W / 2, safeT + 58); fx.scale(1 + bump * 0.4, 1 + bump * 0.4);
    txt(`${game.score}個`, 0, 0, 44 * sc, bumpT > 0 ? '#ffe0a0' : '#fbf1e2');
    fx.restore();
    txt(`高さ ${game.heightCm()}cm`, W / 2, safeT + 84, 14 * sc, '#fbf1e2', 'rgba(36,22,16,.85)', 4, `700 ${FB}`);
  }
  if (state === 'play' && game.phase !== 'over') drawHelp(sc);
  for (const p of pops) {
    const k = clamp(p.life / 0.16, 0, 1), out = clamp((p.dur - p.life) / 0.25, 0, 1);
    const y = safeT + (p.hot ? 140 : 116) - p.life * 10;
    fx.globalAlpha = Math.min(k, out);
    txt(p.text, W / 2, y, p.size * sc, p.hot ? '#ffe0a0' : '#fbf1e2', 'rgba(36,22,16,.9)', 6);
    fx.globalAlpha = 1;
  }
  fx.textAlign = 'start';
}
// 右はしのメジャー（座面からの高さ。10cm ごとの目盛り、50cm ごとに数字）
function drawRuler(sc) {
  const x = W - 30, top = project(0, game.maxTop + 4, 0).y, base = project(0, PH.SEAT, 0);
  const y0 = clamp(base.y, -20, H + 20), y1 = clamp(top, -20, H + 20);
  if (y0 - y1 < 4) return;
  fx.fillStyle = 'rgba(234,190,62,.9)'; fx.fillRect(x, y1, 18, y0 - y1);
  fx.fillStyle = 'rgba(60,40,10,.35)'; fx.fillRect(x, y1, 1.5, y0 - y1);
  const maxCm = Math.ceil((game.maxTop + 4 - PH.SEAT) * 10);
  fx.textAlign = 'right'; fx.textBaseline = 'middle';
  for (let cm = 0; cm <= maxCm; cm += 10) {
    const y = project(0, PH.SEAT + cm / 10, 0).y;
    if (y < -10 || y > H + 10) continue;
    const big = cm % 50 === 0;
    fx.fillStyle = '#3a2a10'; fx.fillRect(x, y - 0.75, big ? 10 : 5, 1.5);
    if (big && cm > 0) { fx.font = `700 ${10 * sc}px ${FB}`; fx.fillText(`${cm}`, x + 17, y + 6); }
  }
  // いまの高さ（いちばん上）の目印
  const yt = project(0, game.topY, 0).y;
  if (game.topY > PH.SEAT + 0.05 && yt > 0 && yt < H) {
    fx.fillStyle = '#c8432f'; fx.beginPath(); fx.moveTo(x - 2, yt); fx.lineTo(x - 11, yt - 6); fx.lineTo(x - 11, yt + 6); fx.closePath(); fx.fill();
  }
  fx.textBaseline = 'alphabetic'; fx.textAlign = 'start';
}
function drawHelp(sc) {
  const help = rec.plays < 2 && game.score < 3;
  const y = H - safeB - 92;
  // 変わった缶には名前の札
  const cur = game.cur;
  if (cur && cur.S && cur.c.s.type !== 'juice') {
    const S = cur.S, p = project(S.x, S.y + cur.c.s.top + 0.55, S.z);
    fx.textAlign = 'center'; txt(cur.c.s.name, p.x, p.y, 12 * sc, '#ffe0a0', 'rgba(36,22,16,.85)', 4, `700 ${FB}`);
  }
  if (tipT > 0) { fx.globalAlpha = clamp(tipT / 0.3, 0, 1); txt(tipText, W / 2, y + 30, 14 * sc, '#ffc0a8', 'rgba(36,22,16,.9)', 5, `700 ${FB}`); fx.globalAlpha = 1; }
  if (help && game.phase === 'hang') {
    txt('缶が真上に来たら、タップで離す', W / 2, y - 6, 16 * sc, '#ffe0a0', 'rgba(36,22,16,.9)', 6, `700 ${FB}`);
    txt('ふれの端で止まった瞬間が、そっと置けるねらい目', W / 2, y + 18, 12 * sc, '#fbf1e2', 'rgba(36,22,16,.8)', 4, `700 ${FB}`);
  }
}

/* ---------- 結果 ---------- */
function advice() {
  const L = game.lost, last = game.cans.filter(c => c.relT != null).pop();
  const v = last ? Math.abs(last.relV) : 0;
  if (game.unfrozeT != null && game.overT - game.unfrozeT < 8) return '塔が少しずつ傾いて、重さを支えきれなくなった。傾いた反対側に置くと、立て直せる。';
  if (L && last && L === last) {
    if (v > 1.0) return '揺れのまんなかで離すと、缶が横に流れて すべり落ちる。ふれの端の、止まる瞬間がねらい目。';
    return '下の缶の端に乗って、ころんと落ちた。真上に来た瞬間を、もう少しよく見て。';
  }
  if (v > 0.8) return '勢いよく乗った缶が、塔を押して崩した。高くなるほど、そっと置くのが大事。';
  return game.score >= 15 ? '高くなるほど、揺れが大きく、缶も変な形に。よくここまで積んだ！' : '塔がぐらりと崩れた。重い缶や細い缶は、真ん中にそっと。';
}
function showOver() {
  if (state !== 'play') return;
  state = 'over';
  const n = game.score, cm = game.maxCm();
  const isNew = n > rec.best || (n === rec.best && cm > rec.bestCm);
  if (!botStart) { rec.plays++; rec.total += n; rec.last = n; rec.lastCm = cm; if (isNew) { rec.best = n; rec.bestCm = cm; } save(); }
  $('oScore').textContent = n; $('oCm').textContent = cm;
  $('oMsg').textContent = advice();
  $('oBest').textContent = rec.best; $('oBestCm').textContent = rec.bestCm; $('oPlays').textContent = rec.plays;
  $('newRec').hidden = !(isNew && n > 0 && rec.plays > 1);
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({ text: `${shareText(n, cm)}${isNew && rec.plays > 1 && n > 0 ? ' 自己ベスト！' : ''}\n`, url: gameUrl(), hashtags: '缶つみ' });
  $('copyMsg').textContent = '画面タップ・スペースでもう一回';
  $('over').hidden = false; $('hud').hidden = true;
  overShownAt = performance.now();
  snapCam = false;
  $('retryBtn').focus({ preventScroll: true });
}
const shareText = (n, cm) => `🥫缶つみ ${cm}cm・${n}個 積んだ！`;

/* ---------- シェア ---------- */
// 公開先のURL。ローカルで開いたときもこれをシェアする
const PUBLIC_URL = 'https://asobi.enludus.com/games/kantsumi/';
function gameUrl() {
  try {
    if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost') return location.origin + location.pathname;
  } catch {}
  return PUBLIC_URL;
}

/* ---------- HUD ---------- */
function updateHud() { $('hBest').textContent = rec.best ? `${rec.best}個・${rec.bestCm}cm` : '—'; }
function fillTitle() { $('tBest').textContent = rec.best ? `${rec.best}個・${rec.bestCm}cm` : '—'; $('tPlays').textContent = rec.plays; }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function step(dt, now) {
  tt += dt;
  if (slowT > 0) { slowT -= dt; } else slowK += (1 - slowK) * Math.min(1, dt * 3);
  if (game && slowK < 0.999) t0 += dt * (1 - slowK) * 1000;   // スローモーション（物理の時刻を遅らせる）
  if (state === 'play' || state === 'title' || state === 'over') advance(now);
  if (state === 'play' && failAt >= 0 && tt - failAt > 2.2) showOver();
  if (shake > 0) shake -= dt;
  if (bumpT > 0) bumpT -= dt;
  if (tipT > 0) tipT -= dt;
  for (const p of pops) p.life += dt;
  pops = pops.filter(p => p.life < p.dur);
}
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  lagS += (clamp(dt * 1.6, 0.04, 0.16) - lagS) * 0.1;
  step(dt, now);
  render(Math.max(dt, 1 / 240));
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function start() {
  wakeAudio(); state = 'play';
  seed = upcomingSeed();   // #seed=N: 何回目のプレイかまで同じなら、同じ缶・同じ揺れ・同じボット
  sessionPlays++;
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  const s = nextSeed();
  newGame(s);
  updateHud();
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  if (bn) bot = makeBot(SKILLS[bn], mulberry(s * 7 + 3));
  // #debug&skip=秒: はじめにその秒数だけ一気に進める（OGP 撮影・確認用。bot=good などと組み合わせる）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'hang');
}
// pose=hang: 指定の秒数のあと、次の缶が吊られて揺れている見栄えのいい瞬間まで進めて止める（freeze=1 で止めたまま）
function skipTo(t1, pose) {
  const quiet = state; state = 'skip';
  const lim = t1 + 60;
  while (game.phase !== 'over' && game.t < lim) {
    if (bot) bot.tick(game, botEmit);
    game.step(); game.events.length = 0;
    if (game.t >= t1 && (pose !== 'hang' || (game.phase === 'hang' && game.cur && game.cur.S.tt > 0.9 && Math.abs(game.cur.S.x - (game.topCan() ? game.topCan().body.translation().x : 0)) > (+HASH.get('off') || 0.6)))) break;
  }
  state = quiet;
  pops = []; snapCam = true; failAt = game.phase === 'over' ? tt : -1;
  for (let i = 0; i < MARKS.length && game.topY >= MARKS[i].y; i++) markIdx = i + 1;
  t0 = performance.now() - (game.t + lagS) * 1000;
  if (HASH.get('freeze') === '1') frozen = true;
}
const evTime = e => (e.timeStamp > 1e3 && Math.abs(e.timeStamp - performance.now()) < 5000 ? e.timeStamp : performance.now());
function toResult() { if (failAt >= 0 && tt - failAt > 0.6) showOver(); }
function drop(ts) {
  if (!game || bot) return;
  if (game.phase === 'over') { toResult(); return; }
  if (game.phase === 'enter') { tipText = 'つぎの缶が来るまで まって'; tipT = 0.9; return; }
  if (game.phase !== 'hang') return;
  queue({ type: 'drop' }, ts);
}
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game) return;
  drop(evTime(e));
});
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if ((c === 'Space' || c === 'Enter') && !e.repeat) { e.preventDefault(); wakeAudio(); drop(evTime(e)); }
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last, rec.lastCm)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  window.__kantsumi = {
    info: () => game && ({ state, phase: game.phase, reason: game.reason, t: +game.t.toFixed(3), score: game.score, cm: game.heightCm(), maxCm: game.maxCm(), topY: +game.topY.toFixed(3),
      cans: game.cans.length, frozen: game.cans.filter(c => c.frozen).length, unfrozen: game.unfrozen,
      cur: game.cur && { type: game.cur.c.s.type, x: +game.cur.S.x.toFixed(3), vx: +game.cur.S.vx.toFixed(3), A: +game.cur.sw.A.toFixed(2), B: +game.cur.sw.B.toFixed(2), ready: game.cur.S.ready },
      inq: game.inq.length, stepMs: +stepMs.toFixed(3), lite, frozenView: frozen, bot: !!bot, lagS: +lagS.toFixed(3), rec, seed }),
    // 物理だけで N 回ぶん: sim('first', 20) → [個数...]。opts.rate = 押した時刻をコマ（Hz）に丸める、opts.seed0
    sim: (skill = 'good', N = 10, opts = {}) => Array.from({ length: N }, (_, i) => runBot(RAPIER, SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'good', N = 10, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(RAPIER, SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n), cm = R.map(r => r.cm);
      return { skill, N, rate: opts.rate || 'exact', p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge2: R.filter(r => r.n >= 2).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), cm50: q(cm, 0.5) };
    },
    // 何もしないで sec 秒（物理だけ）: いまの塔がどれだけ動くか・落ちないか
    idle: (sec = 30) => { const p0 = game.onTower().map(c => ({ ...c.body.translation() })); const t1 = game.t + sec; while (game.t < t1 && game.phase !== 'over') { game.step(); game.events.length = 0; } t0 = performance.now() - (game.t + lagS) * 1000; return { phase: game.phase, maxMove: +Math.max(0, ...game.onTower().map((c, i) => Math.hypot(c.body.translation().x - p0[i].x, c.body.translation().y - p0[i].y, c.body.translation().z - p0[i].z))).toFixed(5) }; },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good') => { if (game && state === 'play' && game.phase !== 'over') bot = makeBot(SKILLS[skill], mulberry(nextSeed())); },
    skip: s => skipTo(game.t + s, 'none'),
    // 画面の座標（Playwright で操作するため）: 吊られた缶・塔のいちばん上
    canScreen: () => game.cur && project(game.cur.S.x, game.cur.S.y, game.cur.S.z),
    topScreen: () => { const c = game.topCan(); if (!c) return project(0, PH.SEAT, 0); const p = game.toW(c, c.s.topF.c); return project(p.x, p.y, p.z); },
    // 揺れの真ん中付近（いちばん上の缶の真上を通る）まで待つための目安: 吊られた缶の x と、いちばん上の缶の x
    aim: () => { const c = game.topCan(); return game.cur && { dx: +(game.cur.S.x - (c ? game.toW(c, c.s.topF.c).x : 0)).toFixed(3), vx: +game.cur.S.vx.toFixed(3), phase: game.phase }; },
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    freeze: (on = true) => { frozen = on; if (!on) t0 = performance.now() - (game.t + lagS) * 1000; },
    PH, SKILLS, makeGame, runBot, makeBot, game: () => game,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789個！自己ベスト更新をこえたcmみかんソーダメロンラムネいちごレモン珈琲ツナクッキーだがしまるやつめたいのみものひとやすみ前'), document.fonts.load(`700 16px "Zen Kaku Gothic New"`, '高さ缶が真上に来たらタップで離すふれの端で止まった瞬間がそっと置けるねらい目つぎの缶が来るまでまってジュースロング缶コーヒーツナお菓子一斗潰れたへこんだ')]), new Promise(r => setTimeout(r, 1500))]); } catch {}
buildStreet();
MARKS.sort((a, b) => a.y - b.y);
resize();
newGame(7);
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = '缶をつむ';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>

// プレイ中でもゲーム一覧に戻れるボタン。押してもゲームの入力（タップ）に伝わらないようにする
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) document.getElementById('hubBack').addEventListener(ev, e => e.stopPropagation(), { passive: true });
</script>
