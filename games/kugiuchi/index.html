<style>

:root {

}
[hidden] { display: none !important; }

body {
  background: var(--bg); color: var(--ink);

}

#over { place-items: end center; background: linear-gradient(to top, rgba(40, 26, 12, .58), rgba(40, 26, 12, 0) 70%); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
.card {

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 釘打ちの物理（自前。長さ m・重さ kg・力 N・時間 秒・角度 rad） ----------
   板の上面が y = 0。釘は 板に 少し立てた（Z_SET だけ入った）所から。x は 画面の左右（金づちを振る面の中）。
   金づち: 手首を支点にした 剛体の振り子（慣性モーメント I、重心 RCG、面の中心まで R）。
     押している間 ふりかぶる（Δθ が 押した時間に比例して 増える。T_FULL で いちばん上）。離すと 腕の力 τ（ふりかぶりが大きいほど強く入れる）と 重力で 振り下ろす。
     面が 釘の頭に当たる角度 θc で 当たる（手首の高さは 釘ごとに決まっている。釘が沈むと 面が 少しずつ 下向きに傾いて当たる）。
     当たる速さ v は エネルギーから（½Iω² = τΔθ + M g RCG (sin(θc+Δθ) − sin θc)）。衝撃の山 F = K_IMP·v、木に入れる仕事 ½(I/R²)v²·ETA。
   当たる向き: 面は ふくらんでいる（半径 RC の球面）。面の中心と 釘の頭の中心が e ずれると、力の向きが asin(e/RC) だけ 傾く。
     さらに 手首のひねり ψ（ゆらぎ。強く振るほど・疲れるほど 大きい）と、当たる角度 θc。
     力の向き a（x の+向きに押すのが正）と 釘の傾き β（頭が x の+側へ）から: 釘の軸の向きの力 F cos(a+β)、横の力 F sin(a+β)（傾きを ふやす向きが正）。
   曲がる: 軸の力 ÷ 座屈の強さ Fcr（出ている長さ Lx の2乗に反比例・太さの4乗）＋ 横の力 × Lx ÷ 曲げの強さ Mp（太さの3乗）が 1 をこえたら ぐにゃ。
     0.55 をこえると 少し 曲がりぐせがつく（傾きが ふえる）。
   入る: 軸の力が 木の抵抗 R(z) = 硬さ ×（F0 + KF·z ＋ 節の中なら KNOT）（入るほど 摩擦で ふえる）を こえている間、仕事のぶんだけ 入る。
     抵抗に 力が負けると びくともしない。
   傾く: 横の力 × Lx を 木が 受けとめる（浅いほど ぐらぐら）＋ 木目で 先が 流される。傾きが B_MAX をこえたら たおれて 曲がる。
   釘は だんだん 長く・細く、板は 10本ごとに 硬い木へ（節も ふえる）。釘1本に T_NAIL 秒 かかると おじいちゃんが 日が暮れると 言っておしまい。
   入力は すべて 時刻つき（画面のコマには よらない）。1/240 秒きざみ。 */
const PH = {
  DT: 1 / 240, G: 9.8,
  R: 0.30, M: 0.55, RCG: 0.27, I: 0.0435, TAU: 2.2,
  TH_REST: 0.12, TH_MIN: 0.06, TH_MAX: 1.9, T_FULL: 0.9, K_P: 1.4, T_REC: 0.24, E_REST: 0.25,
  RC: 0.08, RF: 0.0115, AIM_R: 0.008,
  K_IMP: 300, ETA: 1.0,
  L0: 0.030, LADD: 0.026, LTAU: 35, D0: 0.0027, DSUB: 0.0005, DTAU: 35, Z_SET: 0.004, FLUSH: 0.0005, HW: 0.75,
  KB: 1300, KB_P: 1.3, KM: 4.0, F0: 50, KF: 16000, KNOT: 220, KNOT_W: 0.004,
  K_ROT: 12000, Z_R: 0.002, U_P: 0.55, K_PL: 0.06, B_MAX: 0.3, GRAIN: 0.003,
  WOB0: 0.0018, WOBK: 0.00006, WOBMAX: 0.004, PSI0: 0.006, PSI1: 0.012, PSI2: 0.015, FAT_K: 0.22, FAT_TAU: 5, FAT_HOLD: 0.4,
  T_NAIL: 28, T_DONE: 1.1, T_BOARD: 2.2, PER: 10,
};
const WOODS = [
  { name: '杉', H: 1.0, knots: 0 }, { name: '檜', H: 1.1, knots: 1 }, { name: '松', H: 1.2, knots: 3 },
  { name: '栗', H: 1.3, knots: 2 }, { name: '欅', H: 1.4, knots: 3 }, { name: '樫', H: 1.5, knots: 3 },
];
const woodOf = b => b < WOODS.length ? WOODS[b] : { name: '樫', H: 1.5 + 0.08 * (b - WOODS.length + 1), knots: 3 + Math.min(3, b - WOODS.length) };
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function rndG(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
/* 板の形（10本の釘の位置、mm。順に つなぐと 形になる） */
const heartPts = Array.from({ length: 10 }, (_, k) => { const t = k * Math.PI / 5; return [16 * Math.sin(t) ** 3 * 3.5, (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 3.5 + 8]; });
const SHAPES = [
  { name: '星', ink: '#c8402e', pts: Array.from({ length: 10 }, (_, k) => { const a = Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 24 : 58; return [Math.cos(a) * r, Math.sin(a) * r - 4]; }) },
  { name: 'ハート', ink: '#d0506a', pts: heartPts },
  { name: 'おうち', ink: '#2f5f8a', pts: [[0, 58], [26, 42], [48, 14], [40, -16], [40, -48], [12, -48], [-12, -48], [-40, -48], [-40, -16], [-48, 14]] },
  { name: 'さかな', ink: '#d0602a', pts: [[56, 2], [28, 27], [-2, 31], [-28, 18], [-58, 32], [-48, 1], [-58, -30], [-28, -17], [-2, -29], [28, -25]] },
];
const shapeOf = b => SHAPES[b % SHAPES.length];
function makeBoard(g, b) {
  const W = woodOf(b), S = shapeOf(b), knots = [], tough = [];
  // 節: いくつかは 釘の通り道に（見えるので 気をつけられる）
  const idx = Array.from({ length: PH.PER }, (_, i) => i).sort(() => rndG(g) - 0.5);
  for (let k = 0; k < W.knots; k++) { const i = idx[k]; if (b === 1 && i < 2) continue; const [x, z] = S.pts[i]; knots.push({ x: (x + (rndG(g) - 0.5) * 5) / 1000, z: -(z + (rndG(g) - 0.5) * 5) / 1000, r: 0.005 + rndG(g) * 0.004, on: i }); tough.push(i); }
  for (let k = 0, tries = 0; k < 2 && tries < 30; tries++) {   // 釘の通り道でない 節（見た目だけ）
    const x = (rndG(g) - 0.5) * 0.15, z = (rndG(g) - 0.5) * 0.15, r = 0.004 + rndG(g) * 0.005;
    if (S.pts.some(([px, pz]) => Math.hypot(px / 1000 - x, -pz / 1000 - z) < r + 0.012)) continue;
    knots.push({ x, z, r, on: -1 }); k++;
  }
  return { b, wood: W.name, H: W.H, shape: S.name, ink: S.ink, pts: S.pts.map(([x, z]) => ({ x: x / 1000, z: -z / 1000 })), knots, tough, gr: rndG(g) * 6.28 };
}
function makeNail(g, n) {
  const B = g.board, i = n % PH.PER, p = B.pts[i];
  const L = PH.L0 + PH.LADD * (1 - Math.exp(-n / PH.LTAU)), d = PH.D0 - PH.DSUB * (1 - Math.exp(-n / PH.DTAU));
  let knot = null;
  if (B.tough.includes(i)) { const k0 = Math.max(PH.Z_SET + 0.007, L * 0.4), k1 = k0 + rndG(g) * Math.max(0.002, L - k0 - PH.KNOT_W - 0.004); knot = [k1, k1 + PH.KNOT_W]; }
  const gs = rndG(g) < 0.5 ? -1 : 1;
  return {
    n, i, x0: p.x, z0: p.z, L, d, rh: d * 1.15, H: B.H, knot, z: PH.Z_SET, beta: (rndG(g) - 0.5) * 0.012,
    grain: gs * PH.GRAIN * (0.4 + 0.6 * rndG(g)) * (1 + 0.06 * Math.min(10, B.b)), hw: (L - PH.Z_SET) * PH.HW,
    A: Math.min(PH.WOBMAX, PH.WOB0 + PH.WOBK * n), ph: [rndG(g) * 6.28, rndG(g) * 6.28, rndG(g) * 6.28], hits: 0, t0: g.t, bent: 0, bendDir: 0, inKnot: false, knotSeen: false,
  };
}
function makeGame(seed = 1) {
  const g = {
    seed, rs: (seed ^ 0x9e3779b9) >>> 0, t: 0, phase: 'ready', phaseT: 0, over: false, fail: null, failInfo: null,
    n: 0, hits: 0, boards: 0, fat: 0, pressed: false, pend: false, pressT: -1, raiseT: -1, aim: 0, holdUsed: 0,
    th: 0, om: 0, thS: 0, thc: 0, dth: 0, swT: -1, last: null, done: [], queue: [], events: [], log: null, warned: false, minHits: 0,
  };
  g.board = makeBoard(g, 0); g.nail = makeNail(g, 0); g.thc = thcOf(g.nail); g.th = g.thc + PH.TH_REST;

function syncNails(dt) {

      _c.set(_b.x + Math.sin(b2) * lx * (1 - k), _b.y + Math.cos(b2) * lx * (1 - k), nl.z0 + 0.002 * bendVis);

  } else { shaftA.visible = shaftB.visible = false; nailHead.visible = false; }
  if (lx < 0.0008 && showCur) shaftA.visible = false;

  for (let i = 0; i < doneHeads.length; i++) {

    m.visible = true; m.position.set(d.x + Math.sin(d.beta) * 0.0004, 0.0004, d.z); m.rotation.set(0, 0, -d.beta * 0.3); m.scale.set(d.d * 1.15, 0.0008, d.d * 1.15);

}

function advancePhys() {
  if (!game) return;
  const now = performance.now() / 1000;
  if (frozen) { base = now - game.t; lastAdv = now; return; }
  if (ff && state === 'play') base -= (now - lastAdv) * (FF - 1);
  lastAdv = now;
  let target = now - base;
  if (target - game.t > 0.25 * (ff ? FF : 1)) { base += target - game.t - 0.25 * (ff ? FF : 1); target = now - base; }
  let k = 0;
  while (game.t + PH.DT <= target && k < 4000) { physTick(); k++; }
}
function physTick() {

    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [打てた本数...]（'first' / 'casual' / 'good' / 'mash'（一定の強さ・一定の間隔）/ 'max'（毎回 いちばん強く）/ 'tap'（毎回 いちばん弱く））
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(typeof skill === 'string' ? SKILLS[skill] : skill, (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const sk = typeof skill === 'string' ? SKILLS[skill] : skill;
      const R_ = Array.from({ length: N }, (_, i) => runBot(sk, (opts.seed0 ?? 1000) + i, opts)), d = R_.map(r => r.n), kinds = {};
      for (const r of R_) kinds[r.fail] = (kinds[r.fail] || 0) + 1;
      const tn = R_.reduce((a, r) => a + r.n, 0);
      return { skill: typeof skill === 'string' ? skill : 'custom', N, p10: q(d, 0.1), p25: q(d, 0.25), p50: q(d, 0.5), p75: q(d, 0.75), p90: q(d, 0.9), min: Math.min(...d), max: Math.max(...d), ge1: R_.filter(r => r.n >= 1).length / N, ge3: R_.filter(r => r.n >= 3).length / N, ge10: R_.filter(r => r.n >= 10).length / N, ge20: R_.filter(r => r.n >= 20).length / N, mean: +(d.reduce((a, b) => a + b, 0) / N).toFixed(2), hitsPerNail: tn ? +(R_.reduce((a, r) => a + r.hits, 0) / tn).toFixed(1) : null, meanSec: +(R_.reduce((a, r) => a + r.t, 0) / N).toFixed(1), kinds };
    },
    // 一定の 押す長さ・一定の 間隔で 釘の まん中を 連打: いちばん伸びる組み合わせ
    mashGrid: (N = 20) => { const out = []; for (const hold of [0.05, 0.15, 0.25, 0.35, 0.45, 0.6, 0.8, 1.0]) for (const period of [0.6, 0.9, 1.3, 2]) { if (hold >= period) continue; const d = Array.from({ length: N }, (_, i) => runBot({ mash: true, hold, period, aim: 0 }, 3000 + i).n); out.push({ hold, period, p50: q(d, 0.5), mean: +(d.reduce((a, b) => a + b, 0) / N).toFixed(2), max: Math.max(...d) }); } return out.sort((a, b) => b.mean - a.mean).slice(0, 6); },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす
    fpsCheck: (skill = 'good', seedR = 4242, maxN = 12) => {
      const r = runBot(SKILLS[skill], seedR, { log: true, maxN });
      return { live: { n: r.n, hits: r.hits, fail: r.fail, t: r3(r.t) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), fps30frameQuantized: replay(r.log, seedR, 30, true), fps60frameQuantized: replay(r.log, seedR, 60, true), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; ptrId = null; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    screen: (x, y, z) => scr(x, y, z),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    scene, renderer, fxc, CAM, camera, resize,
    PH, SKILLS, makeGame, runBot, stepGame, gInput, strikeCalc, planStrike, game: () => game,
  };
}
