<style>

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 金魚すくいの物理（three には頼らない。自前の小さな計算だけ） ----------
   長さは cm、重さと力は g（グラム重）。水面が y = 0、水槽の底が y = -DEPTH。x は右、z は手前。
   ポイ（半径 3.9cm の輪に紙）は、指の位置をばねで追いかける。指を置くと水に入り（入れたままだと少しずつ沈む）、離すと持ち上がる。
   紙にかかる力 F = 水の抵抗 ½·Cd·ρ·A·v²（v = 紙の面に垂直な速さ + 面に沿った速さ × KAP）
                  + 乗っている金魚の重さ（水の中では浮力でほぼ 0、水から出るほど重い）× 位置（輪のふちに近いほど紙は楽）
                  + 金魚が暴れた瞬間の力。
   紙の強さ S は、水に浸かっていた時間 w の累積で下がる（乾かない）: S = S0·e^(-w/τ0) + S1·e^(-w/τ1)。
   F > S になったら紙が破れる。穴は力の強さに応じて広がり、穴の上の金魚は落ちる。
   ポイの傾き: 上下に動くとき、横に動いている向きへ紙を斜めにする（横に速く動いているほど斜めにできる）。
     → 止まったまま まっすぐ入れる・まっすぐ持ち上げると、紙の面が水を正面から受ける（大きな力）。
       指をすべらせながら入れる・離すと、斜めに入ってやさしい（ただし傾きすぎると、乗った金魚がすべる）。
   金魚が乗るか: 持ち上がる紙が金魚のお腹に下から当たり、そのとき重心が輪の内側なら、紙といっしょに上がる。
     金魚は気づくと（反応の時間のあと）暴れて逃げようとする。水から出たあとも跳ねる・傾きですべる。輪の外に出たら落ちる。
   金魚の群れ: ぶらぶら泳ぎ、壁とお椀をよけ、なかまと少しそろう。速く動くポイ・水しぶきから逃げて深くもぐる。
     水の中でじっとしているポイには、好奇心の強い金魚が寄ってきて、水面近くへ上がってくる。
     水槽の金魚が減ると、残った金魚ほど用心深い。減りすぎたら おじさんが足す（大物がまざりやすくなる）。 */
const PH = {
  DT: 1 / 120, G: 981,
  TX: 15, TZ0: -32, TZ1: 18, DEPTH: 9,          // 水槽の内側（x ±15, z -32〜18）と水の深さ
  R: 3.9, AIR: 3.2, DIP: 2.2, DIPMAX: 4.2, SINK: 0.45,   // ポイの半径・持ち上げた高さ・入れる深さ（入れたままだと沈む）
  VDIP: 28, VLIFT: 31, AV: 520, W: 30, VMAX: 260, NEAR: 1.5,
  FT: 0.3, FTV: 60,                               // 離したあと、指の勢いのまま少し流れる時間・上限
  CD: 1.0, KAP: 0.32, TILT: 0.9, VT: 8, TILTW: 30, TILT_AIR: 0.12,
  MU: 0.45,                                       // ぬれた紙と金魚の摩擦（約 24° 以上傾くとすべる）
  S0: 55, TAU0: 22, S1: 20, TAU1: 260,            // 紙の強さ（g）
  BOWL: { x: 9.5, z: 11.5, r: 5.4, lvl: 0.9 },    // お椀（水に浮かんでいる）
  N0: 34, REFILL: 14, ADD: 10, MAXF: 190,
  DART: 30, KICK: 2.2, CUR: 3.2, CURUP: 8,
};
// 金魚の種類: L 体長(cm)・m 重さ(g)・v 泳ぐ速さ・al 用心深さ・cu 好奇心・flop 水から出て跳ねる回数/秒・hk 体の高さ/体長
const FT = {
  koaka: { name: '小赤', L: 3.0, m: 0.9, v: 6.5, al: 1.0, cu: 0.6, flop: 2.6, hk: 0.36 },
  wakin: { name: '和金', L: 4.0, m: 2.0, v: 6.0, al: 0.9, cu: 0.5, flop: 2.3, hk: 0.36 },
  sarasa: { name: '更紗', L: 4.3, m: 2.4, v: 5.5, al: 0.85, cu: 0.5, flop: 2.2, hk: 0.38 },
  demekin: { name: '出目金', L: 4.4, m: 4.2, v: 3.8, al: 0.6, cu: 0.7, flop: 1.8, hk: 0.46 },
  ryukin: { name: '琉金', L: 5.6, m: 8.5, v: 3.2, al: 0.55, cu: 0.6, flop: 1.6, hk: 0.6 },
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => v < a ? a : v > b ? b : v;
const angD = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const strengthOf = w => PH.S0 * Math.exp(-w / PH.TAU0) + PH.S1 * Math.exp(-w / PH.TAU1);
function pickType(stage, rnd) {
  const w = { koaka: 0.42, wakin: 0.3, sarasa: 0.12, demekin: 0.1 + 0.03 * stage, ryukin: 0.04 + 0.04 * stage };
  let sum = 0; for (const k in w) sum += w[k];
  let r = rnd() * sum; for (const k in w) { r -= w[k]; if (r <= 0) return k; }
  return 'wakin';
}

function makeGame(seed = 1) {
  const rnd = mulberry(seed), B = PH.BOWL, A = Math.PI * PH.R * PH.R;
  const g = { seed, rnd, t: 0, k: 0, phase: 'play', fish: [], events: [], inq: [], caught: 0, grams: 0, stage: 0, nid: 0,
    stillT: 0, rideN: 0, onN: 0, nSwim: 0, tearT: -1, overT: -1, Fpeak: 0, dips: 0, lifts: 0, tear: null, maxRatio: 0 };
  const P = g.P = { x: 0, y: PH.AIR, z: 9, vx: 0, vy: 0, vz: 0, th: 0, dx: 0, dz: -1, n: { x: 0, y: 1, z: 0 }, w: 0, F: 0, Fd: 0, Ff: 0, S: strengthOf(0), hole: null, tx: 0, tz: 9, creak: false, sink: PH.DIP };
  const I = g.I = { down: false, x: 0, z: 9, t: 0, hist: [], vfx: 0, vfz: 0, dipOK: false, upT: -9, ux: 0, uz: 9, fvx: 0, fvz: 0 };
  const paperY = (x, z) => P.y - (P.n.x * (x - P.x) + P.n.z * (z - P.z)) / P.n.y;
  const inBowl = (x, z, m = 0) => Math.hypot(x - B.x, z - B.z) < B.r - m;
  g.paperY = paperY; g.inBowl = inBowl;
  const alertK = () => 0.75 + 0.7 * clampP(1 - g.nSwim / PH.N0, 0, 1);
  g.alertK = alertK;
  const shallowY = f => -(f.hh + 0.15 + 0.5 * rnd());
  function addFish(type, x, z, y) {
    const T = FT[type];
    const f = { id: g.nid++, type, T, L: T.L * (0.9 + 0.2 * rnd()), x, y, z, vx: 0, vz: 0, wa: rnd() * 6.283, yd: y, ydT: 2 + 5 * rnd(),
      al: T.al * (0.75 + 0.5 * rnd()), cu: T.cu * (0.5 + rnd()), fear: 0, vk: 0.8 + 0.4 * rnd(), st: 'swim', u: null, us: null,
      react: 0, dart: null, flopT: 0, pulse: 0, fv: null, fvT: 0, ph: rnd() * 6.283, look: rnd(), load: 0 };
    f.m = T.m * Math.pow(f.L / T.L, 3);
    f.hh = f.L * T.hk * 0.5;
    f.vx = Math.cos(f.wa) * T.v * 0.5; f.vz = Math.sin(f.wa) * T.v * 0.5;
    g.fish.push(f);
    return f;
  }
  for (let i = 0; i < PH.N0; i++) {
    let x, z;
    do { x = (rnd() * 2 - 1) * (PH.TX - 3); z = PH.TZ0 + 3 + rnd() * (PH.TZ1 - PH.TZ0 - 6); } while (inBowl(x, z, -4));
    const f = addFish(pickType(0, rnd), x, z, 0);
    f.y = f.yd = rnd() < 0.36 ? shallowY(f) : -(2.3 + 4.5 * rnd());
  }
  function frighten(f, d) { f.fear = Math.max(f.fear, d); f.yd = -(4 + 3 * rnd()); f.ydT = 2 + 2 * rnd(); }
  function scare(x, z, rad, k) {
    const aK = alertK();
    for (const f of g.fish) if (f.st === 'swim' && Math.hypot(f.x - x, f.z - z) < rad && k * f.al * aK > 0.25) frighten(f, 0.4 + 0.4 * rnd());
  }
  /* ----- 入力（時刻つき。物理の時刻で使う） { t, type: 'down' | 'move' | 'up', x, z }（x, z は水面の上の指の位置） ----- */
  g.input = q => { g.inq.push({ ...q }); g.inq.sort((a, b) => a.t - b.t); };
  function feed() {
    while (g.inq.length && g.inq[0].t <= g.t + 1e-9) {
      const q = g.inq.shift();
      if (q.type === 'down') {
        if (I.down) continue;
        I.down = true; I.x = q.x; I.z = q.z; I.t = q.t; I.hist = [{ t: q.t, x: q.x, z: q.z }]; I.vfx = I.vfz = 0;
        I.dipOK = g.rideN === 0 && g.onN === 0;
        g.events.push({ type: 'press', x: q.x, z: q.z });
      } else if (q.type === 'move') {
        if (!I.down) continue;
        const dtm = q.t - I.t;
        if (dtm > 0.004) { const k = Math.min(1, dtm / 0.04); I.vfx += ((q.x - I.x) / dtm - I.vfx) * k; I.vfz += ((q.z - I.z) / dtm - I.vfz) * k; }

        I.down = false; I.upT = q.t; I.ux = I.x; I.uz = I.z;

  function attach(f, dx, dz) {

  /* ----- 金魚の群れ（1/60 秒ごと） ----- */

    const sw = g.fish.filter(f => f.st === 'swim');

    const thr = Math.max(0, sp - 8) / 22, rad = 3.5 + sp * 0.08;
    const curious = P.y < 0 && g.stillT > 0.4;
    for (const f of sw) {
      let dx = Math.cos(f.wa), dz = Math.sin(f.wa);
      f.wa += (rnd() - 0.5) * 0.5;
      const M = 5;   // 壁
      if (f.x < -PH.TX + M) dx += (1 - (f.x + PH.TX) / M) * 3;
      if (f.x > PH.TX - M) dx -= (1 - (PH.TX - f.x) / M) * 3;

      { const bx = f.x - B.x, bz = f.z - B.z, bd = Math.hypot(bx, bz) || 1; if (bd < B.r + 4) { const k = (1 - (bd - B.r) / 4) * 3; dx += bx / bd * k; dz += bz / bd * k; } }

        const sep = (f.L + o.L) * 0.5;

      const px = f.x - P.x, pz = f.z - P.z, pd = Math.hypot(px, pz) || 0.01;
      if (sub) {

        if (curious && f.fear <= 0 && pd < 13 && pd > 0.8) {

          dx -= px / pd * k; dz -= pz / pd * k;

      }
      if (f.fear > 0) { f.fear -= dt; if (sub || pd < 8) { dx += px / pd * 4; dz += pz / pd * 4; } }
      const dn = Math.hypot(dx, dz) || 1;
      const v = f.fear > 0 ? f.T.v * 4.2 : f.T.v * f.vk, kk = f.fear > 0 ? 7 : 2.2;

      f.x = clampP(f.x, -PH.TX + mg, PH.TX - mg); f.z = clampP(f.z, PH.TZ0 + mg, PH.TZ1 - mg);
      { const bx = f.x - B.x, bz = f.z - B.z, bd = Math.hypot(bx, bz) || 1, rr = B.r + 0.4 + mg; if (bd < rr) { f.x = B.x + bx / bd * rr; f.z = B.z + bz / bd * rr; } }
      f.wa += angD(Math.atan2(f.vz, f.vx), f.wa) * 0.12;

      const vys = f.fear > 0 ? 6 : 2.2;
      f.y += clampP(f.yd - f.y, -vys * dt, vys * dt);

      // 紙をよける（下りてくる紙に押されたら、驚いて逃げる）
      if (P.y < 0.3 && pd < PH.R + 0.3 * f.L && P.vy <= 2) {
        const yp = paperY(f.x, f.z);
        if (Math.abs(f.y - yp) < f.hh + 0.12) {
          if (f.y > yp && yp + f.hh + 0.12 < -f.hh - 0.12) f.y = yp + f.hh + 0.12;

      for (let i = 0; i < PH.ADD; i++) { const f = addFish(pickType(g.stage, rnd), (rnd() * 2 - 1) * (PH.TX - 4), PH.TZ0 + 4 + rnd() * 14, 0); f.y = f.yd = -(f.hh + 0.4 + rnd() * 2); f.fear = 0.4; }

  }

  /* ----- 1ステップ ----- */
  g.step = () => {
    const dt = PH.DT;
    feed();
    // 指の位置（次の記録とのあいだは直線でつなぐ: 画面のコマの速さによらない）
    let tx, tz;
    if (I.down) {

    const phi = Math.atan2(Math.abs(P.vy), vh);
    // 水から出たら、紙を水平にもどす（乗った金魚がすべらないように）
    const thT = Math.min(phi, P.y > 0.3 && P.vy > 0 ? PH.TILT_AIR : PH.TILT * Math.min(1, vh / PH.VT)) * Math.sign(P.vy);
    P.th += (thT - P.th) * Math.min(1, PH.TILTW * dt);
    { const s = Math.sin(P.th), c = Math.cos(P.th); P.n.x = -P.dx * s; P.n.y = c; P.n.z = -P.dz * s; }
    const sub = P.y < 0;
    if (y0 >= 0 && P.y < 0) {   // 水に入った
      const vn = Math.abs(P.vx * P.n.x + P.vy * P.n.y + P.vz * P.n.z);
      g.dips++; g.events.push({ type: 'dip', x: P.x, z: P.z, k: vn / 30, vn });

    }
    // 紙の上の金魚

    const nh = Math.hypot(P.n.x, P.n.z), slideA = PH.G * (nh - PH.MU * P.n.y);
    for (const f of g.fish) {

      const u = f.u;

        if (f.react <= 0 && !f.dart) {

        }
        if (f.dart && fsub > 0.3) { u.x += f.dart.x * dt * fsub; u.z += f.dart.z * dt * fsub; }

        if (fsub < 0.15) { f.st = 'ride'; f.flopT = 0.12 + 0.35 * rnd(); f.dart = null; g.events.push({ type: 'ride', f }); }
      } else {
        if (slideA > 0 && nh > 1e-4) { f.us.x += slideA * P.n.x / nh * dt; f.us.z += slideA * P.n.z / nh * dt; }

        if (f.flopT <= 0) {   // 跳ねる
          f.flopT = -Math.log(1 - rnd() * 0.98) / f.T.flop;
          const an = rnd() * 6.283, mag = (0.25 + 0.6 * rnd()) * f.L * 0.42;
          f.fv = { x: Math.cos(an) * mag / 0.06, z: Math.sin(an) * mag / 0.06 }; f.fvT = 0.06;
          f.pulse = 1; g.events.push({ type: 'flop', f });
        }
        if (f.fvT > 0) { u.x += f.fv.x * dt; u.z += f.fv.z * dt; f.fvT -= dt; }
        u.x += f.us.x * dt; u.z += f.us.z * dt;
        f.pulse *= Math.exp(-dt / 0.05);
        if (Math.hypot(u.x, u.z) > PH.R - 0.08 * f.L) { fall(f, true); continue; }
      }
      f.x = P.x + u.x; f.z = P.z + u.z; fy = paperY(f.x, f.z) + f.hh; f.y = fy;
      fsub = clampP(0.5 - fy / (2 * f.hh), 0, 1);
      const r2 = (u.x * u.x + u.z * u.z) / (PH.R * PH.R), pos = 1 - 0.45 * r2;
      const load = (f.m * (1 - 0.97 * fsub) + (f.st === 'on' && f.dart ? f.m * 0.8 : 0) + f.m * PH.KICK * f.pulse) * pos;
      f.load = load; Ff += load; hx += u.x * load; hz += u.z * load; hw += load;

    }
    g.rideN = rideN; g.onN = onN;
    // お椀の上: ポイを傾けて入れる
    if (rideN && dB < B.r - 1.0 && P.y > 1.4) for (const f of g.fish) if (f.st === 'ride') toBowl(f);
    // 紙にかかる力と、紙の強さ
    const F = Fd + Ff;
    P.Fd = Fd; P.Ff = Ff; P.F = F; P.S = strengthOf(P.w);
    if (F > g.Fpeak) g.Fpeak = F;
    const ratio = F / P.S; if (g.phase === 'play' && ratio > g.maxRatio) g.maxRatio = ratio;
    if (!P.creak && ratio > 0.72) { P.creak = true; g.events.push({ type: 'creak', k: ratio }); } else if (P.creak && ratio < 0.5) P.creak = false;
    if (!P.hole && g.phase === 'play' && F > P.S) tear(F, Fd, Ff, hx, hz, hw);
    if (P.hole) {   // 穴が広がる。穴の上の金魚は落ちる。少しすると全部落ちる
      const H = P.hole; H.r += (H.rf - H.r) * Math.min(1, 9 * dt) + 0.02;
      const all = g.t - g.tearT > 0.45;
      for (const f of g.fish) if ((f.st === 'on' || f.st === 'ride') && (all || Math.hypot(f.u.x - H.x, f.u.z - H.z) < H.r + 0.1 * f.L)) fall(f, false);
    }

      if (f.st !== 'fall') continue;
      f.vy -= PH.G * dt; f.x += f.fvx * dt; f.z += f.fvz * dt; f.y += f.vy * dt;
      f.x = clampP(f.x, -PH.TX + 0.5, PH.TX - 0.5); f.z = clampP(f.z, PH.TZ0 + 0.5, PH.TZ1 - 0.5);

      if (f.y < (over ? B.lvl : -f.hh * 0.3)) land(f);
    }
    if ((g.k++ & 1) === 0) swimStep(dt * 2);
    g.t += dt;
    if (g.phase === 'tear' && g.t - g.tearT > 1.5 && !g.fish.some(f => f.st === 'fall' || f.st === 'on' || f.st === 'ride')) { g.phase = 'over'; g.overT = g.t; g.events.push({ type: 'over' }); }
  };
  return g;
}

  const g = makeGame(seed);
  const bot = makeBot(typeof sk === 'string' ? SKILLS[sk] : sk, mulberry(seed * 7 + 3));

  const emit = q => g.input({ ...q, t: tq + lag });

    if (rate) { if (g.t >= next - 1e-9) { tq = next; bot.tick(g, emit, 1 / rate); next += 1 / rate; } }

/* ---------- HUD ---------- */
function updateHud() { $('hBest').textContent = rec.best ? `${rec.best}匹` : '—'; }
function fillTitle() { $('tBest').textContent = rec.best ? `${rec.best}匹` : '—'; $('tPlays').textContent = rec.plays; }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function step(dt, now) {
  tt += dt;
  if (state === 'play' || state === 'title' || state === 'over') advance(now);
  if (state === 'play' && game.phase === 'play') helpT += dt;
  // キーボード: 矢印で動かす
  if (state === 'play' && keyDown && (kb.x || kb.z)) { const P = game.I; queue('move', P.x + kb.x * 14 * dt, P.z + kb.z * 14 * dt, now); }
  if (state === 'play' && endAt >= 0 && game.phase === 'over' && tt - endAt > 1.6) showOver();
  if (shake > 0) shake -= dt;
  if (bumpT > 0) bumpT -= dt;
  if (say) { say.life += dt; if (say.life > say.dur) say = null; }
  for (const p of pops) p.life += dt;
  pops = pops.filter(p => p.life < p.dur);
}
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  lagS += (clamp(dt * 1.6, 0.04, 0.16) - lagS) * 0.1;
  step(dt, now);
  render(Math.max(dt, 1 / 240));
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function start() {
  wakeAudio(); state = 'play';
  seed = upcomingSeed();   // #seed=N: 何回目のプレイかまで同じなら、同じ金魚・同じボット
  sessionPlays++;
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  const s = nextSeed();
  newGame(s);
  updateHud(); helpT = 0;
  talk('はい、ポイ1本ね', 1.8);
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  if (bn) bot = makeBot(SKILLS[bn], mulberry(s * 7 + 3));
  // #debug&skip=秒: はじめにその秒数だけ一気に進める（OGP 撮影・確認用。bot=good などと組み合わせる）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'lift');
}
// pose=lift: 指定の秒数のあと、金魚を乗せてポイを持ち上げた瞬間まで進めて止める（freeze=1 で止めたまま）
function skipTo(t1, pose) {
  const quiet = state; state = 'skip';
  const lim = t1 + 120;
  while (game.phase !== 'over' && game.t < lim) {
    if (bot) bot.tick(game, botEmit, PH.DT);
    game.step(); game.events.length = 0;
    if (game.t >= t1 && (pose !== 'lift' || (game.rideN >= (+HASH.get('min') || 1) && game.P.y > 1.6 && game.P.y < PH.AIR - 0.3 && game.phase === 'play'))) break;
  }
  state = quiet;
  pops = []; snapCam = true; endAt = game.phase !== 'play' ? tt : -1;
  t0 = performance.now() - (game.t + lagS) * 1000; lastQ = game.t;
  if (game.caught && game.phase === 'play') talk(game.rideN ? 'お、うまいねえ' : pickL(NICE), 2.2);
  if (HASH.get('freeze') === '1') frozen = true;
}
const evTime = e => (e.timeStamp > 1e3 && Math.abs(e.timeStamp - performance.now()) < 5000 ? e.timeStamp : performance.now());
function toResult() { if (endAt >= 0 && game.phase === 'over' && tt - endAt > 0.6) showOver(); }
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game || bot) return;
  if (game.phase === 'over') { toResult(); return; }
  if (ptr) return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  ptr = e.pointerId;
  const w = toWater(e.clientX, e.clientY);
  queue('down', w.x, w.z, evTime(e));
});
addEventListener('pointermove', e => {
  if (ptr !== e.pointerId || state !== 'play' || !game) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ce of (list.length ? list : [e])) { const w = toWater(ce.clientX, ce.clientY); queue('move', w.x, w.z, evTime(ce)); }
});
function endPtr(e) {
  if (ptr !== e.pointerId) return;
  ptr = null;
  if (state === 'play' && game) queue('up', 0, 0, evTime(e));
}
addEventListener('pointerup', endPtr);
addEventListener('pointercancel', endPtr);
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: スペースを押しているあいだ水の中、矢印で動かす、B でお椀へ
const KX = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (!game || bot) return;
    if (game.phase === 'over') { if (c === 'Space' || c === 'Enter') { e.preventDefault(); toResult(); } return; }
    if (KX[c]) { e.preventDefault(); kb.x = KX[c][0] || kb.x; kb.z = KX[c][1] || kb.z; if (!keyDown) { keyDown = true; queue('down', game.I.down ? game.I.x : game.P.x, game.I.down ? game.I.z : game.P.z, evTime(e)); } return; }
    if (c === 'Space' && !e.repeat) { e.preventDefault(); wakeAudio(); if (!keyDown) { keyDown = true; queue('down', game.P.x, game.P.z, evTime(e)); } return; }
    if ((c === 'KeyB' || c === 'Enter') && !e.repeat) { e.preventDefault(); const t = evTime(e); if (keyDown) queue('up', 0, 0, t); queue('down', PH.BOWL.x, PH.BOWL.z, t); queue('up', 0, 0, t + 120); keyDown = false; return; }
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});
addEventListener('keyup', e => {
  if (state !== 'play' || !game || bot) return;
  if (KX[e.code]) { if (KX[e.code][0]) kb.x = 0; if (KX[e.code][1]) kb.z = 0; }
  if ((e.code === 'Space' || (KX[e.code] && !kb.x && !kb.z)) && keyDown) { keyDown = false; kb.x = kb.z = 0; queue('up', 0, 0, evTime(e)); }
});
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last, rec.lastG)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  window.__kingyo = {
    info: () => game && ({ state, phase: game.phase, t: +game.t.toFixed(3), caught: game.caught, grams: +game.grams.toFixed(1), stage: game.stage,
      poi: { x: +game.P.x.toFixed(2), y: +game.P.y.toFixed(2), z: +game.P.z.toFixed(2), F: +game.P.F.toFixed(2), S: +game.P.S.toFixed(2), w: +game.P.w.toFixed(2), torn: !!game.P.hole, down: game.I.down },
      rideN: game.rideN, onN: game.onN, swim: game.fish.filter(f => f.st === 'swim').length, tear: game.tear, Fpeak: +game.Fpeak.toFixed(2),
      inq: game.inq.length, stepMs: +stepMs.toFixed(3), frozenView: frozen, bot: !!bot, lagS: +lagS.toFixed(3), rec, seed }),
    // 物理だけで N 回ぶん: sim('first', 20) → [匹数...]。opts.rate = ボットが見て動かすコマ（Hz）、opts.seed0
    sim: (skill = 'good', N = 10, opts = {}) => Array.from({ length: N }, (_, i) => runBot(skill, (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'good', N = 10, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(skill, (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n);
      return { skill, N, rate: opts.rate || 'exact', p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge1: R.filter(r => r.n >= 1).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), t50: q(R.map(r => r.t), 0.5), w50: q(R.map(r => r.w), 0.5) };
    },
    autoplay: (skill = 'good') => { if (game && state === 'play' && game.phase === 'play') { bot = makeBot(SKILLS[skill], mulberry(nextSeed())); game.inq.length = 0; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; if (!on) t0 = performance.now() - (game.t + lagS) * 1000; },
    // 画面の座標（Playwright で操作するため）
    screen: (x, y, z) => project(x, y, z),
    poiScreen: () => project(game.P.x, 0, game.P.z),
    bowlScreen: () => project(PH.BOWL.x, 0, PH.BOWL.z),
    // 水面近く（紙を入れた深さより上にお腹がある）でおびえていない金魚
    shallow: () => game.fish.filter(f => f.st === 'swim' && f.y - f.hh > -PH.DIP + 0.2 && f.fear <= 0).map(f => { const q = project(f.x, 0, f.z); return { id: f.id, sx: q.x, sy: q.y, x: f.x, z: f.z, vx: f.vx, vz: f.vz, type: f.type }; }),
    // いまポイの紙の真上（中心から 0.5R 以内・すぐ上）にいる金魚の数
    over: () => { const P = game.P; return game.fish.filter(f => f.st === 'swim' && Math.hypot(f.x - P.x, f.z - P.z) < PH.R * 0.5 && f.y - f.hh > game.paperY(f.x, f.z) - 0.02 && f.y - f.hh < game.paperY(f.x, f.z) + 1.2).length; },
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, FT, SKILLS, makeGame, runBot, makeBot, game: () => game,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789匹金魚すくい祭'), document.fonts.load(`700 16px "Zen Kaku Gothic New"`, '紙まっさらしめってきたふやけてよれぼろお椀をタップ！指を置いてすべらせ入れる下で離すとすくい上げるそっと動かす上に来たらミシッ…ぺしゃ小赤和金更紗出目琉g、うまいねえ')]), new Promise(r => setTimeout(r, 1500))]); } catch {}
buildStall();
resize();
newGame(7);
camPos.copy(camera.position); camLook.copy(VIEW.play.look);
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = 'ポイをもらう';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>

<script>
// プレイ中でもゲーム一覧に戻れるボタン。押してもゲームの入力（タップ）に伝わらないようにする
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) document.getElementById('hubBack').addEventListener(ev, e => e.stopPropagation(), { passive: true });
</script>
