<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dエンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- ビー玉転がしの物理（three には頼らない自前。単位は m・秒・rad。1/500 秒きざみ） ----------
   板の座標: x = 右、s = 奥（手前から奥へ進んだ距離。スコア）、高さ h は板の面。板は「手前から奥へ続く長い木の板」を区間（seg）に分けたもの。
   板の傾き: 指（キー・傾きセンサー）で決まる「傾けたい向き」(−1〜1, −1〜1) に、実際の傾き（奥へ a・右へ b、最大 MAXT）が一次遅れ（TAU）で追いつく。
     傾きの重力の成分 g·sin(傾き) が、板にそって球を引く。板そのものの坂（区間の高さの変化）・くぼみの傾きも重力の成分になる。
   球（ガラスのビー玉、半径 R）: 位置・速度 v・回転（接地点の表面の速さ u = ω×r）。重力の成分は v だけを変え、
     すべり v−u を板との摩擦（最大 MU·g）が消そうとする（v は減り、u は 5/2 倍ふえる: 中まで詰まった球）。すべらなければ加速は 5/7·g·sinθ（転がり）。
     壁に当たると速さの壁向きの成分ははね返り（E）、回転はほとんどそのまま → 当たったあとは少しすべってから転がりに戻る。
     転がりの抵抗（木の板: CRR·g と速さに比例する少し）。
   穴: 中心が穴の縁より内側に入ると、球は縁にのって中へ傾く（はみ出し o に応じて、穴の中心へ g·sinφ·cosφ、sinφ = o/R）。
     はみ出しが FALL_O·R をこえたら落ちる。速ければ縁をかすめて抜けられる。板のはし（手すりのない橋・台）も同じ（外へ引かれて落ちる）。
   段差: 下りの段差は宙に出て落ちる（重力・小さくはずむ）。のぼり側は壁。
   動く障害物: 手すりのあいだを左右に往復する木のじゃま板（当たると押される）。
   コース: seed で手続き生成（遠くへ行くほど穴が増え・すきまが細く・橋が細く長く・動くじゃま板）。生成は球の 3m 先まで、描画のコマ数とは無関係。
   判定: 落ちた（穴・はし）= おわり。STALL 秒より長く先へ進まない = おわり（止まった）。スコアは いちばん奥まで進んだ距離（cm）。 */
const PH = {
  DT: 1 / 500, G: 9.8,
  R: 0.008,                      // ビー玉の半径（1.6cm 玉）
  MAXT: 9 * Math.PI / 180,       // 板の最大の傾き
  TAU: 0.14,                     // 傾きの遅れ（秒）
  KEY_UP: 2.4, KEY_DN: 4,        // キーで傾けるはやさ・もどすはやさ（1/秒）
  MU: 0.35, CRR: 0.012, CV: 0.05, E: 0.45, VMAX: 1.6, FALL_O: 0.8,
  HW: 0.065, RT: 0.008, RH: 0.012, WT: 0.008, T: 0.014,   // 板の半分の幅・手すりの厚さ・高さ・仕切りの厚さ・板の厚さ
  HOLE_R: 0.0115,
  STALL: 7, FALL_T: 1.15, BK: 0.1,
  // 難しさの曲線（k = 何 m 地点か）
  GW_MIN: 0.022, GW_K: 0.05, GW_T: 4.5,        // 穴の列のすきま
  BR_MIN: 0.0105, BR_K: 0.02, BR_T: 6,         // 橋の半分の幅
  WG_MIN: 0.027, WG_K: 0.035, WG_T: 5,         // 仕切りのすきま
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- コース ---------- */
function bkAdd(map, o, s0, s1) { for (let i = Math.floor(s0 / PH.BK); i <= Math.floor(s1 / PH.BK); i++) { let L = map.get(i); if (!L) map.set(i, L = []); L.push(o); } }
function addWall(c, x0, x1, s0, s1, kind = 'wall') { const w = { x0, x1, s0, s1, kind, h: 0 }; const sg = segAt(c, (s0 + s1) / 2); w.h = sg ? Math.max(sg.h0, sg.h1) : c.lastH; c.walls.push(w); bkAdd(c.wb, w, s0, s1); return w; }
function addHole(c, x, s, R = PH.HOLE_R) { const H = { x, s, R }; c.holes.push(H); bkAdd(c.hb, H, s - R, s + R); return H; }
function addDimple(c, x, s, R, d) { const D = { x, s, R, d }; c.dimples.push(D); bkAdd(c.db, D, s - R, s + R); return D; }
function guide(c, s, x, v, m) { const G = c.guides; if (G.length && s <= G[G.length - 1].s) s = G[G.length - 1].s + 0.001; G.push({ s, x, v, m }); }
function addSeg(c, o) {
  const A = c.segs[c.segs.length - 1];
  const sg = { i: c.segs.length, s0: c.genS, s1: c.genS + o.len, hw: o.hw ?? PH.HW, cx0: o.cx0 ?? 0, cx1: o.cx1 ?? (o.cx0 ?? 0), rail: !!o.rail, kind: o.kind || 'run' };
  sg.h0 = c.lastH - (o.drop || 0); sg.h1 = sg.h0 + (o.rise || 0);
  c.segs.push(sg); c.lastH = sg.h1; c.genS = sg.s1;
  if (A) {
    // 手すりのある板の終わり: 次の板（橋など）の外側は当て木でふさぐ
    if (A.rail) {
      const aL = A.cx1 - A.hw, aR = A.cx1 + A.hw, bL = sg.cx0 - sg.hw, bR = sg.cx0 + sg.hw;
      if (bL - aL > 0.001) addWall(c, aL - PH.RT, bL, A.s1 - PH.WT, A.s1, 'end');
      if (aR - bR > 0.001) addWall(c, bR, aR + PH.RT, A.s1 - PH.WT, A.s1, 'end');
    }
    // 手すりのある板のはじまり（細い所から広い所へ）: 後ろのはしも当て木
    if (sg.rail) {
      const aL = A.cx1 - A.hw, aR = A.cx1 + A.hw, bL = sg.cx0 - sg.hw, bR = sg.cx0 + sg.hw;
      if (aL - bL > 0.001) addWall(c, bL - PH.RT, aL, sg.s0, sg.s0 + PH.WT, 'end');
      if (bR - aR > 0.001) addWall(c, aR, bR + PH.RT, sg.s0, sg.s0 + PH.WT, 'end');
    }
  }
  if (sg.rail) { addWall(c, sg.cx0 - sg.hw - PH.RT, sg.cx0 - sg.hw, sg.s0, sg.s1, 'rail'); addWall(c, sg.cx0 + sg.hw, sg.cx0 + sg.hw + PH.RT, sg.s0, sg.s1, 'rail'); }
  // 焼き印（50cm ごと）
  while (c.markS < sg.s1) { c.marks.push({ s: c.markS, seg: sg.i }); c.markS += 0.5; }
  return sg;
}
function makeCourse(seed) {
  const c = { seed, rnd: mulberry(((seed ^ 0x5bd1e995) * 2654435761) >>> 0), segs: [], walls: [], holes: [], dimples: [], movers: [], guides: [], marks: [], wb: new Map(), hb: new Map(), db: new Map(), genS: -0.07, lastH: 0, lastX: 0, markS: 0, n: 0 };
  // スタートの板（後ろに当て木）
  addSeg(c, { len: 1.02, rail: true, kind: 'start' });
  addWall(c, -PH.HW - PH.RT, PH.HW + PH.RT, -0.07 - PH.WT, -0.07, 'end');
  guide(c, -0.07, 0, 0.45); guide(c, 0.85, 0, 0.42);
  ensureCourse(c, 0);
  return c;
}
function ensureCourse(c, s) { while (c.genS < s + 3) genPiece(c); }
// 穴の列: すきま（中心 xg、幅 gw）の左右を穴でうめる
function holeRow(c, sg, s, xg, gw) {
  const R = PH.HOLE_R, rnd = c.rnd, cx = sg.cx0, L = cx - sg.hw, Rr = cx + sg.hw;
  const pitch = () => 2 * R + 0.006 + rnd() * 0.012;
  const ov = sg.rail ? -R * 0.25 : R + 0.001;   // 手すりのない台は、穴が板からはみ出さないように
  for (let x = xg - gw / 2 - R; x > L + ov; x -= pitch()) addHole(c, x, s + (rnd() - 0.5) * 0.008, R * (0.97 + rnd() * 0.06));
  for (let x = xg + gw / 2 + R; x < Rr - ov; x += pitch()) addHole(c, x, s + (rnd() - 0.5) * 0.008, R * (0.97 + rnd() * 0.06));
}
function pickW(rnd, W) { let t = 0; for (const k in W) t += W[k]; let u = rnd() * t; for (const k in W) { u -= W[k]; if (u <= 0) return k; } return Object.keys(W)[0]; }
function genPiece(c) {
  const rnd = c.rnd, k = Math.max(0, c.genS), n = c.n++;

    // ボットの入力の列を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（結果がそろうか）
    fpsCheck: (skill = 'first', seedR = 4242) => { const r = runBot(SKILLS[skill], seedR, { log: true }); return { live: { cm: r.cm, why: r.why, t: +r.t.toFixed(3) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), inputs: r.log.length }; },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; ptr = null; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）: 玉・板の点 (x, s)・ドラッグを始めるのにいい所
    ballScreen: () => ballScreen(),
    boardScreen: (x = 0, s = null) => boardScreen(x, s ?? game.ball.s + 0.1),
    dragFrom: () => ({ x: W / 2, y: H * 0.68 }),
    ahead: (n = 6) => { const c = game.course, s = game.ball.s; return c.segs.filter(g => g.s1 > s).slice(0, n).map(g => ({ kind: g.kind, s0: r3(g.s0), s1: r3(g.s1), hw: r3(g.hw), rail: g.rail })); },
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, game: () => game,
  };
}
