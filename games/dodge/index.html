<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- ドッジボールよけの物理（自前。three には頼らない。長さ m・時間 秒。y = 上、x = 右、z = 手前（自分の コートの うしろへ）） ----------
   コート: 自分の 内野は x = ±CW、z = 0（まん中の線）〜 CZ1（うしろの線）。相手の 内野は z = 0 〜 OZ1（奥）。体育館の 壁は x = ±WX、z = WZF（奥・舞台）/ WZB（手前）。
   自分: いつも z = PZ。横（x）だけ 動ける。体は たての カプセル（半径 BR、足の高さ fy から 背の高さ h まで）。
     h は 立つと HS、しゃがむと HC（TC 秒で しゃがみ、TU 秒で 立つ）。ジャンプは 上向き VJ で 放物線（足が 上がる）。空中では 横に ほとんど 動けない。
     横は「目当ての位置 tx」へ 走る（加速 ACC・減速 DEC・最高 VMAX、しゃがむと VMAXC）。tx は 押した 所で きまる（はなしても そこへ 行って 止まる）。
   ボール: やわらかい ゴムの 球（半径 RB）。重力 と 空気抵抗 −KD·|v|·v、回転で 横に 曲がる（曲がりの 加速 a は 投げた ときに きまり、はずむと 弱まる）。
     床に 当たると はね返り（E_F）、横の 速さは H_F 倍。小さく なると 転がって（ROLL）止まる。壁で はね返る（E_W）。
     当たり: 生きている ボール（壁に 当たる 前、床で はずむのは 1回まで）の 球と 体の カプセルが 重なったら 当たり。
   投げる子: 相手の 内野（3人）と 外野（うしろ 2人、左右 1人ずつ）。ボールを 持つと 投げる 場所へ 歩き、構え（腕の 振り上げ）→ 投げる。
     ときどき フェイント（投げるふり）、パス（山なりで 別の子へ。向きが かわる）。投げる球: まっすぐ（胸）・高い（頭）・低い（足もと）・ワンバウンド・曲がる。
     ねらいは「とどく ころの 自分の 位置」（いまの 速さから 少し 先読み）に ぶれを たす。よけた 球は むこうの 子が 取る（取れないと 拾いに 行く）。
   よけた 数 n で だんだん 速く・構えが 短く・先読みが うまく、20球で ボールが 2こに、30球から 2つ 同時も。上限は 決めない。
   入力はすべて時刻つき（画面のコマには よらない）。1/240 秒きざみ。 */
const PH = {
  DT: 1 / 240, G: 9.8, KD: 0.011, RB: 0.11, E_F: 0.66, H_F: 0.84, ROLL: 1.1, E_W: 0.55,
  CW: 3.0, CZ1: 5.6, OZ1: -5.6, WX: 8.4, WZF: -11.6, WZB: 10.6, PZ: 2.6, XM: 2.78,
  BR: 0.17, HS: 1.36, HC: 0.8, TC: 0.085, TU: 0.12, VJ: 2.95, JCD: 0.05, JBUF: 0.12,
  VMAX: 4.6, VMAXC: 1.8, ACC: 26, DEC: 30, AIRC: 0.12,
  KID_V: 4.3, KID_W: 2.4, CATCH_R: 0.62, T_FETCH: 3.0, TWO_AT: 20, T_MAX: 1500,
};
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
// 種から きまる 乱数（状態は 数1つ。複製しても 同じ）
function rndG(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function gaussG(g) { let u = rndG(g); while (u < 1e-9) u = rndG(g); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rndG(g)); }

// よけた 数 n による 難しさ（上限は 決めず、ゆっくり 上がりつづける）
function diffOf(n) {
  const k = 1 - Math.exp(-n / 34);
  return {
    k,
    v: Math.min(15, 6.6 + 4.4 * k + 0.011 * n),        // 投げる 速さ m/s
    tw: Math.max(0.4, 1.0 - 0.5 * k),                  // 構えの 長さ s
    gap: Math.max(0.22, 1.0 - 0.72 * k),               // 取ってから 構えるまで s
    sig: 0.26 - 0.1 * k,                               // ねらいの ぶれ m
    lead: 0.6 + 0.35 * k,                              // 先読み
    pSide: n < 3 ? 0 : 0.24 + 0.1 * k,                 // 横の 子が 投げる
    pBounce: n < 6 ? 0 : 0.12 + 0.06 * k,
    pFeint: n < 8 ? 0 : 0.12 + 0.2 * k,
    pPass: n < 4 ? 0 : 0.22 + 0.25 * k,
    curve: n < 12 ? 0 : 1.2 + 1.8 * k,                 // 曲がる 加速 m/s²
    pCurve: n < 12 ? 0 : 0.3,
    pSim: n < 30 ? 0 : 0.22 + 0.25 * k,                // 2つ 同時
    space: Math.max(0.3, 0.95 - 0.5 * k),             // 投げと 投げの あいだ（同時で ないとき）
    tmin: Math.max(0.3, 0.64 - 0.3 * k - 0.0012 * n),   // とどくまでの いちばん 短い 時間 s
  };
}

/* ---------- 子ども（相手） ---------- */
const KID_DEF = [
  { role: 'in', x: -1.7, z: -2.7 }, { role: 'in', x: 0.2, z: -1.9 }, { role: 'in', x: 1.9, z: -3.1 },
  { role: 'back', x: -1.5, z: 7.05 }, { role: 'back', x: 1.5, z: 7.05 },
  { role: 'side', x: -3.75, z: 2.1, side: -1 }, { role: 'side', x: 3.75, z: 2.1, side: 1 },
];
function zoneOf(k) {
  if (k.role === 'in') return { x0: -PH.CW + 0.25, x1: PH.CW - 0.25, z0: PH.OZ1 + 0.3, z1: -0.45 };
  if (k.role === 'back') return { x0: -6.8, x1: 6.8, z0: PH.CZ1 + 0.55, z1: PH.WZB - 0.5 };
  return k.side < 0 ? { x0: -PH.WX + 0.5, x1: -PH.CW - 0.55, z0: 0.3, z1: PH.CZ1 - 0.2 } : { x0: PH.CW + 0.55, x1: PH.WX - 0.5, z0: 0.3, z1: PH.CZ1 - 0.2 };
}
const inZone = (Z, x, z, m = 0) => x >= Z.x0 - m && x <= Z.x1 + m && z >= Z.z0 - m && z <= Z.z1 + m;
function throwSpot(g, k) {
  if (k.role === 'in') return { x: -2.0 + 4.0 * rndG(g), z: -1.0 - 0.7 * rndG(g) };
  if (k.role === 'back') return { x: -2.2 + 4.4 * rndG(g), z: 6.6 + 0.5 * rndG(g) };
  return { x: k.side * (3.62 + 0.25 * rndG(g)), z: PH.PZ - 0.6 + 1.2 * rndG(g) };
}

function makeGame(seed = 1) {
  const g = {
    seed, rs: (seed * 40503 + 7) >>> 0, t: 0, n: 0, over: false, done: false, fail: null, failInfo: null, overT: -1,
    events: [], queue: [], log: null, bid: 0, lastThrowT: -9, throws: 0, passes: 0, feints: 0, nearN: 0,
    b: { x: 0, vx: 0, tx: null, fy: 0, vy: 0, air: false, c: 0, ch: false, landT: -1, jq: -1, jumps: 0 },
    kids: KID_DEF.map((d, i) => ({ i, role: d.role, side: d.side || 0, hx: d.x, hz: d.z, sx: d.x, sz: d.z, x: d.x, z: d.z, mv: 0, goal: null, ball: -1, seq: null, anim: 'idle', animT: 0, ttype: 'chest', windDur: 1, act: 'throw' })),
    balls: [],
  };
  addBall(g, 1, 1.4);
  return g;
}

for (const ev of ['pointerdown', 'touchstart', 'mousedown']) document.getElementById('hubBack').addEventListener(ev, e => e.stopPropagation(), { passive: true });
</script>
