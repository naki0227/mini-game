<style>

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));
const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- お手玉の物理（自前。three には頼らない） ----------
   長さの単位は cm、時間は秒。左右の手と、ちりめんの布袋（小豆入り）2〜3個。
   手のひら = 浅いおわん（半径 RP の球面を、ふちの半径 PA で切ったくぼみ）＋ ふちの輪（指）。玉 = 半径 R の球（やわらかい布袋）。
   玉とくぼみ・ふち・ほかの玉・床が、球どうしの当たりで押し合う。布袋なので手に当たると反発は小さく（E_PALM）、摩擦が強く、ぺたっと止まる。
   投げる = 手を S 秒だけ斜め上へ振って止める（手が止まっても玉は飛んでいく）。玉の速さは「ためた長さ（押していた時間）」で決まる高さから。
   手は、落ちてくる玉の落下点へ自動で寄る（寄れる範囲と速さに限界）。玉を持ったら内側へすくい寄せる。
   受けた = 玉がくぼみに触れて、手と同じ速さで止まっている状態が REST_T 続いたとき（反対の手から投げた玉なら 1 回）。
   手に玉が2つ来ると、上の玉は（くぼみが浅いので）ころがり落ちる。床に落ちたら終わり。重力は本物の 4 割くらいから、回数とともに強く（テンポが上がる）。
   投げた玉は投げたときの重力のまま飛ぶ（途中でテンポが変わっても、ねらった手に落ちる）。 */
const PH = {
  DT: 1 / 240,
  G0: 420, GK: 0.025, G30: 1.25, GMAXK: 6,   // 重力: はじめ G0、1回ごとに GK ずつ強く（テンポが上がる）、30回からは G30 倍（上限 GMAXK 倍）
  R: 2.4,                        // お手玉の半径（直径 4.8cm のまるい布袋）
  RP: 6.5, PA: 4.2, RIM: 0.75,   // 手のひらのくぼみ（球面の半径・ふちの半径）とふち（指）の太さ
  HOME: 16, TX: 5, X_IN: 1, X_OUT: 24,   // 手の受けの位置（外側）・投げの位置（内側）・手が寄れる範囲（|x|）
  FLOOR: -36,                    // 縁側の床（ひざの上の座布団）
  VH: 260, OM: 38, OMY: 30, AH: 6000, VH_C: 70, OM_C: 14, AH_C: 900,      // 手が寄る速さの上限と、ばねの速さ
  S: 0.07,                       // 投げるときに手を振る時間
  H_LO: 34, H_HI: 60, HOLD0: 0.07, HOLD1: 0.4, HOLD_MAX: 0.55, H30: 1.15,   // 高さ: 短いタップ H_LO 〜 長押し H_HI（30回からは H30 倍）。HOLD_MAX 秒押したら自動で投げる
  DXN: 21,                       // 投げの位置から反対の手の受けの位置まで（手の振りはこの距離に合わせた決まった形）
  WIND_D: 2.2,                   // 押している間、手が少し沈む（ため）
  E_PALM: 0.1, MU_PALM: 0.9, MU_RIM: 0.08, STICK: 16, E_BAG: 0.3, MU_BAG: 0.12, E_FLOOR: 0.08,
  GIVE: 0.2, GIVE_MAX: 45,       // 受けたときに手が沈む（玉の当たる速さの GIVE 倍）
  REST_V: 12, REST_T: 0.05,
  TRACK_T: 0.7, TRACK_HELD: 0.1,                 // この秒数より先に落ちてくる玉には、まだ手を寄せない
  IDLE_T: 4.0,                   // 玉が手の中で止まったまま、この秒数だれも投げないと終わり（うたがおわる）
  THIRD_AT: 10, FAST_AT: 30,
  DRAG: [0.0004, 0.0009],        // 空気抵抗（袋の大きさ・重さで少しちがう）
};
const CAPH = PH.RP - Math.sqrt(PH.RP * PH.RP - PH.PA * PH.PA);   // くぼみの深さ
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gravFor(n) { return PH.G0 * Math.min(PH.GMAXK, (1 + PH.GK * n) * (n < PH.FAST_AT ? 1 : PH.G30)); }
function heightK(n) { return n < PH.FAST_AT ? 1 : PH.H30; }
function holdH(hold, n) { return (PH.H_LO + (PH.H_HI - PH.H_LO) * clampP((hold - PH.HOLD0) / (PH.HOLD1 - PH.HOLD0), 0, 1)) * heightK(n); }

function makeBag(i, x, y, rnd) {
  return { i, G: PH.G0, p: { x, y, z: 0 }, v: { x: 0, y: 0, z: 0 }, k: PH.DRAG[0] + (PH.DRAG[1] - PH.DRAG[0]) * rnd(), sq: 0.12, rest: 0, hold: null, holdT: -9, cHand: null, cT: -9, cV: 0, rimT: -9, bbT: -9, bbAir: false, thrown: false, from: null, thrownT: -9, floor: false, spin: 0, ang: 0, live: true };
}
function makeHand(side) { return { side, x: side * PH.TX, y: 0, vx: 0, vy: 0, mode: 'free', st: 0, s0: null, a: null, press: -1, lastThrow: -9, tx: side * PH.TX }; }
function makeGame(seed = 1) {
  const rnd = mulberry(seed ^ 0x5bd1e995);
  const g = {
    seed, rnd, t: 0, n: 0, balls: 2, G: gravFor(0), over: false, fail: null, failBag: -1, overT: -1,
    hands: { [-1]: makeHand(-1), [1]: makeHand(1) }, bags: [], queue: [], events: [], log: null,
    lastThrowT: 0, throws: 0, insert: null, inserted: false, lastSide: 1, catches: 0,
  };
  g.bags.push(makeBag(0, -PH.TX, PH.R, rnd), makeBag(1, PH.TX, PH.R, rnd));
  g.bags[0].hold = -1; g.bags[1].hold = 1; g.bags[0].holdT = g.bags[1].holdT = 0; g.bags[0].cHand = -1; g.bags[1].cHand = 1; g.bags[0].cT = g.bags[1].cT = 0;
  return g;
}
// 入力: 時刻つき。kind = 'down' / 'up'、v = -1（左手）/ 1（右手）
function gInput(g, t, kind, v) { if (g.log) g.log.push({ t, kind, v }); const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, { t, kind, v }); }
function applyInput(g, e) {
  if (g.over) return;
  const h = g.hands[e.v];
  if (e.kind === 'down') { if (h.press < 0) { h.press = e.t; g.events.push({ type: 'press', side: e.v }); } }
  else if (e.kind === 'up') { if (h.press >= 0) { const hold = e.t - h.press; h.press = -1; doThrow(g, h, hold); } }
}
// 手のくぼみに入っている玉（いちばん近いもの）
function bagInBowl(g, h) {
  let best = null, bd = 1e9;
  for (const b of g.bags) {
    if (!b.live || b.floor) continue;
    const dx = b.p.x - h.x, dy = b.p.y - h.y, dz = b.p.z;
    if (Math.hypot(dx, dz) < PH.PA + 0.6 && dy > -0.5 && dy < PH.R + 2.2) { const d = Math.hypot(dx, dy - PH.R, dz); if (d < bd) { bd = d; best = b; } }
  }
  return best;
}
function doThrow(g, h, hold) {
  if (h.mode === 'stroke') return;
  const b = bagInBowl(g, h);
  const G = g.G, H = holdH(hold, g.n);
  const vy = Math.sqrt(2 * G * H), dyS = vy * PH.S / 2;
  const T = (vy + Math.sqrt(vy * vy + 2 * G * dyS)) / G;
  const vx = -h.side * PH.DXN / (T + PH.S / 2);
  h.mode = 'stroke'; h.st = 0; h.s0 = { x: h.x, y: h.y }; h.a = { x: vx / PH.S, y: vy / PH.S }; h.lastThrow = g.t;
  // からぶり: 玉がなくても手は投げる形に振れる（そのあいだ、落ちてくる玉を受けに行けない）
  if (!b) { g.events.push({ type: 'whiff', side: h.side }); return; }
  b.thrown = true; b.from = h.side; b.thrownT = g.t; b.G = G; b.hold = null; b.rest = 0; b.spin = (h.side < 0 ? -1 : 1) * (5 + 4 * g.rnd());
  g.lastThrowT = g.t; g.throws++; g.lastSide = h.side;
  g.events.push({ type: 'throw', side: h.side, bag: b.i, H, hold, x: h.x });
  if (g.n >= PH.THIRD_AT && g.balls === 2 && !g.insert) g.insert = { side: h.side, t: g.t + 0.22, until: g.t + 0.6 };
}
// 玉が落ちてくる先の見積もり（空気抵抗なし）。手の高さ（くぼみに乗ったときの玉の中心）を横切る時刻と x
function predictLand(g, b, yc) {
  const vy = b.v.y, y = b.p.y, G = b.thrown ? b.G : g.G;
  const disc = vy * vy + 2 * G * (y - yc);
  if (disc < 0) return null;

function updateHud() { $('hBest').textContent = rec.best ? `${rec.best}回` : '—'; }
function fillTitle() { $('tBest').textContent = rec.best || '—'; $('tTotal').textContent = rec.total; }

/* ---------- 音（小豆の布袋。低めでこもった音だけ。2kHz 以上は使わない。最後に 1.9kHz のローパス） ---------- */
let ac = null, master = null, noiseBuf = null;
function wakeAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = 0.5;
      master = ac.createDynamicsCompressor(); master.threshold.value = -16; master.ratio.value = 5;
      master.connect(lp).connect(ac.destination);
      // 低いほうに寄せたノイズ（ブラウン寄り）
      const len = ac.sampleRate * 1.5; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); let b = 0;
      for (let i = 0; i < len; i++) { b = b * 0.82 + (Math.random() * 2 - 1) * 0.18; d[i] = b * 2.6; }
    }
    if (ac.state === 'suspended') ac.resume();
  } catch {}
}
const live = () => ac && state === 'play' && !frozen;
function tone(freq, at, dur, vol, type = 'sine', f1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at); if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
  return o;
}
function noise(at, dur, vol, type, freq, q = 1, lpf = 1200, att = 0.004) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpf;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + att); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(lp).connect(g).connect(master); s.start(at, Math.random() * 1.0); s.stop(at + dur + 0.05);
  return f;
}
// 投げる「しゃっ」: 袋の中で小豆が寄る音。こもらせた低いノイズを、すっと下げる
function sShaa(Hh) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(Hh / 50, 0.6, 1.2); const f = noise(n0, 0.13, 0.07 * k, 'bandpass', 520, 0.9, 900, 0.012); f.frequency.exponentialRampToValueAtTime(300, n0 + 0.12); } catch {} }
// 手に落ちる「ぽす」: 低いやわらかい当たり + 小豆の「ざっ」を少し
function sPosu(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 200, 0.3, 1); tone(150, n0, 0.09, 0.15 * k, 'sine', 92); noise(n0, 0.07, 0.11 * k, 'lowpass', 420, 0.7, 500); noise(n0 + 0.01, 0.06, 0.035 * k, 'bandpass', 640, 1.1, 900); } catch {} }
// 指のふちに当たる「とっ」
function sTap(v) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 150, 0.15, 0.7); tone(240, n0, 0.05, 0.07 * k, 'triangle', 180); noise(n0, 0.04, 0.05 * k, 'lowpass', 600, 0.7, 700); } catch {} }
// 玉どうし「ぽふ」
function sBump(v, air) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 180, 0.2, 1); tone(air ? 200 : 170, n0, 0.07, 0.1 * k, 'sine', 120); noise(n0, 0.06, 0.08 * k, 'lowpass', 520, 0.7, 600); } catch {} }
// 床に落ちる「ぽとっ」（座布団・板の上）
function sPoto(v) { try { if (!live() && state !== 'over') return; const n0 = ac.currentTime, k = clamp(v / 250, 0.5, 1); tone(210, n0, 0.12, 0.13 * k, 'triangle', 115); noise(n0, 0.08, 0.12 * k, 'lowpass', 480, 0.7, 520); tone(170, n0 + 0.11, 0.08, 0.05 * k, 'triangle', 110); } catch {} }
function sInsert() { try { if (!live()) return; const n0 = ac.currentTime + 0.02; tone(392, n0, 0.25, 0.05); tone(494, n0 + 0.1, 0.3, 0.045); } catch {} }
function sChime(big) { try { if (!live()) return; const n0 = ac.currentTime + 0.05; (big ? [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.32]] : [[523, 0], [659, 0.1], [784, 0.2]]).forEach(([f, t]) => tone(f, n0 + t, 0.42, 0.05)); } catch {} }
function sEnd() { try { if (!live()) return; const n0 = ac.currentTime; tone(330, n0, 0.4, 0.05, 'triangle', 220); tone(262, n0 + 0.2, 0.5, 0.045, 'sine', 196); } catch {} }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  step(dt);
  render(Math.max(dt, 1 / 240));
  requestAnimationFrame(frame);
}

/* ---------- 入力: 画面の左半分＝左手、右半分＝右手。押して離したときに投げる（押していた長さ＝高さ）。時刻つきで物理へ ---------- */
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(nextSeed(), bn); frozen = false; cam.init = false;
  updateHud();
  // #debug&skip=秒: はじめにその秒数だけ一気に進め、3つのお手玉が弧を描いている瞬間で止める（OGP 撮影・確認用。bot=good と組み合わせる。freeze=1 で止めたまま）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'nice');
  if (HASH.has('debug') && HASH.get('ff') === '1') ff = true;
}
// pose=nice: 指定の秒数のあと、玉が3つで、2つが手の少し上の宙（上がる玉と落ちる玉）にあって左右にはなれ、1つが手の中になる瞬間まで進める
function skipTo(t1, pose = 'none') {
  const quiet = state; state = 'skip';
  const lim = t1 + 60;
  while (!game.over && game.t < lim) {
    physTick();
    if (game.t >= t1) {
      if (pose !== 'nice') break;
      const air = game.bags.filter(b => b.thrown && b.cT < game.t - 0.06 && b.p.y > 12 && b.p.y < 40);
      if (game.balls === 3 && game.n >= 12 && air.length >= 2 && Math.abs(air[0].p.x - air[1].p.x) > 10 && trails.every((T, i) => !game.bags[i] || !game.bags[i].thrown || T.length > 8)) break;
    }
  }
  state = quiet;
  pops = []; chars = []; failAt = game.over ? tt : -1; shake = 0;
  base = performance.now() / 1000 - game.t - LAG;
  if (HASH.get('freeze') === '1') frozen = true;
}
function sideOfX(x) { return x < W / 2 ? -1 : 1; }
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game) return;
  if (game.over) { if (failAt >= 0 && tt - failAt > 0.5) showOver(); return; }
  const s = sideOfX(e.clientX);
  for (const v of ptrs.values()) if (v === s) return;   // 同じ側を2本の指で押しても1回
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  ptrs.set(e.pointerId, s);
  input('down', s, evTime(e));
});
const ptrUp = e => {
  if (!ptrs.has(e.pointerId)) return;
  const s = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  input('up', s, evTime(e));
};
addEventListener('pointerup', ptrUp);
addEventListener('pointercancel', ptrUp);
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: ← / A = 左手、→ / L / D = 右手（押して離すと投げる）
const KEYS = { ArrowLeft: -1, KeyA: -1, ArrowRight: 1, KeyL: 1, KeyD: 1 };
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (game.over && (c === 'Space' || c === 'Enter')) { e.preventDefault(); if (!e.repeat && failAt >= 0 && tt - failAt > 0.5) showOver(); return; }
    const s = KEYS[c];
    if (s) { e.preventDefault(); if (e.repeat || keyHeld[s]) return; wakeAudio(); keyHeld[s] = true; input('down', s, evTime(e)); }
    else if (c === 'Space' || c === 'Enter') e.preventDefault();
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});
addEventListener('keyup', e => {
  const s = KEYS[e.code];
  if (!s || !keyHeld[s]) return;
  keyHeld[s] = false;
  if (state === 'play') input('up', s, evTime(e));
});
addEventListener('blur', () => { if (state === 'play' && game) { for (const [id, s] of ptrs) input('up', s, performance.now()); ptrs.clear(); for (const s of [-1, 1]) if (keyHeld[s]) { keyHeld[s] = false; input('up', s, performance.now()); } } });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last, rec.lastBalls)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ「押した・離した」の時刻の列を、いろいろなコマ割りで物理に流して、結果がそろうか（lag = 物理の遅れ。ゲームは LAG 秒）
  const replay = (log, seedR, fps, lag = LAG, quant = false) => {
    const g = makeGame(seedR), L = log.slice().sort((a, b) => a.t - b.t); let i = 0, tNow = 0;
    while (!g.over && tNow < 3000 && g.n < 400) {
      tNow += 1 / fps;
      while (i < L.length && L[i].t <= tNow) { gInput(g, Math.max(g.t, quant ? tNow - lag : L[i].t), L[i].kind, L[i].v); i++; }
      while (g.t + PH.DT <= tNow - lag && !g.over) { stepGame(g); g.events.length = 0; }
    }
    return { n: g.n, balls: g.balls, fail: g.fail, t: r3(g.t) };
  };
  const scr = (x, y, z = 0) => { const s = project(x, y, z); return { x: Math.round(s.x), y: Math.round(s.y) }; };
  window.__otedama = {
    info: () => {
      if (!game) return null;
      const g = game, N = nextThrowOf(g);
      return {
        state, t: r3(g.t), n: g.n, balls: g.balls, over: g.over, fail: g.fail, G: Math.round(g.G), throws: g.throws,
        hands: [-1, 1].map(s => { const h = g.hands[s]; return { side: s < 0 ? 'L' : 'R', x: r2(h.x), y: r2(h.y), mode: h.mode, pressing: h.press >= 0, holding: !!bagInBowl(g, h), screen: scr(h.x, h.y) }; }),
        bags: g.bags.map(b => ({ i: b.i, x: r2(b.p.x), y: r2(b.p.y), vx: r2(b.v.x), vy: r2(b.v.y), hold: b.hold, thrown: b.thrown, floor: b.floor, screen: scr(b.p.x, b.p.y) })),
        // 次にどちらの手で・いつ投げるとよいか（秒。いまの物理の時刻から）: earliest〜latest のあいだ、suggest がおすすめ。free = 2つとも手の中（いつでも）
        nextThrow: N && { hand: N.hand, in: r3(N.in), earliest: r3(N.earliest), latest: r3(N.latest), suggest: r3(N.suggest), free: N.free, tapPoint: { x: Math.round(N.side < 0 ? W * 0.25 : W * 0.75), y: Math.round(H * 0.72) } },
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, queue: g.queue.length, lag: LAG,
      };
    },
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [回数...]
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n), kinds = {};
      for (const r of R) kinds[r.fail] = (kinds[r.fail] || 0) + 1;
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge3: R.filter(r => r.n >= 3).length / N, ge10: R.filter(r => r.n >= 10).length / N, ge60: R.filter(r => r.n >= 60).length / N, ge200: R.filter(r => r.n >= 200).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), balls3: R.filter(r => r.balls === 3).length / N, kinds };
    },
    // 左右交互の一定連打（tau 秒おき）: mash(0.42, 20)
    mash: (tau = 0.42, N = 20, hold = 0.08) => { const n = Array.from({ length: N }, (_, i) => runBot({ mash: tau, hold }, 1000 + i).n); return { tau, p50: q(n, 0.5), max: Math.max(...n), n }; },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（frameQuantized は時刻を使わなかった場合のくらべ）
    fpsCheck: (skill = 'good', seedR = 4242) => {
      const r = runBot(SKILLS[skill], seedR, { log: true, maxN: 400 });
      return { live: { n: r.n, balls: r.balls, fail: r.fail, t: r3(r.t) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), fps30frameQuantized: replay(r.log, seedR, 30, LAG, true), fps60frameQuantized: replay(r.log, seedR, 60, LAG, true), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）
    handScreen: side => { const h = game.hands[side === 'L' || side === -1 ? -1 : 1]; return scr(h.x, h.y); },
    bagScreen: i => { const b = game.bags[i]; return b ? scr(b.p.x, b.p.y, b.p.z) : null; },
    tapPoint: side => ({ x: Math.round((side === 'L' || side === -1) ? W * 0.25 : W * 0.75), y: Math.round(H * 0.72) }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, nextThrowOf, game: () => game,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789回！ぶつかったごつんとどかないぽろっあれっおしまいぽとっはいみっつめ自己ベスト更新早送り▶ひとつだまりえんがわでふくろにあずきつめみんなでかぞえうたよっそをしないねいろりちめむかおじゃなくまわしやらゆうけここのきとおもど'), document.fonts.load(`700 16px "Zen Kaku Gothic New"`, '0123456789回つづいた・玉つおばあちゃんがそっとのせてくれた10回で玉がみっつにたかくはやくじょうずもびっくりまだまだつづく手にふたつ空中でぶつかった間に合わなかったはねてこぼれたうまく投げられなかったうたがおわっちゃったいま！つぎここを押すと左手右手はどちらかの手でぽんと投げてみよう次の玉が来る前に、その手の玉を投げる')]), new Promise(r => setTimeout(r, 1500))]); } catch {}
resize();
buildWorld();
newDemo();
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = '縁側にすわる';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
