<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 canvas（屋台の鉄板）+ 上に HUD、タイトル/結果は中央のカード1枚 */
:root {
  --night: #22150e;      /* 屋台の奥の暗がり */
  --iron: #1b1a19;       /* 鉄板 */
  --batter: #f0d89a;     /* 生地 */
  --kitsune: #d8963a;    /* きつね色 */
  --ink: #2a1a12;
  --paper: #fbf3e2;      /* 舟（経木）の色 */
  --noren: #b3352a;      /* 屋台の赤のれん */
  --noren-ink: #fbefd9;
  --aonori: #3f6f34;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

.hud {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--noren); color: var(--noren-ink);
  border-radius: 6px; padding: 6px 12px 7px;
  font-variant-numeric: tabular-nums; line-height: 1.1;
  box-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.pill .lab { font-size: 11px; letter-spacing: .12em; opacity: .8; display: block; }
.pill .val { font-family: var(--font-display); font-size: 26px; }
.pill .unit { font-size: 13px; margin-left: 2px; }
.pill.mid { background: var(--paper); color: var(--ink); text-align: center; }
.pill.right { text-align: right; background: var(--paper); color: var(--ink); }
.pill.right .val { font-size: 20px; }

.pill.hurry { background: #e8c23a; color: var(--ink); }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  background: rgba(26, 14, 8, .45);
  touch-action: none; cursor: pointer;
}
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);
  border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45);
  text-align: center; cursor: default;
}
.noren {
  background: var(--noren); color: var(--noren-ink);
  display: flex; gap: 3px;
  padding-top: 18px;
}
.noren span {
  flex: 1; background: var(--noren); border-bottom: 3px solid rgba(255,255,255,.1);
  font-family: var(--font-display); font-size: 32px; line-height: 1; padding-block: 6px 16px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2);
}
.noren.result span { font-size: 30px; }
.noren span.w2 { flex: 1.7; }
.body { padding: 20px 22px 22px; display: grid; gap: 14px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }
.score { font-family: var(--font-display); font-size: 60px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 22px; margin-left: 4px; }
.meta { display: flex; justify-content: center; gap: 6px 18px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meta b { font-size: 16px; }
.badge {
  justify-self: center; background: var(--aonori); color: #fff; font-weight: 700;
  font-size: 12px; letter-spacing: .14em; padding: 3px 10px; border-radius: 99px;
}
.btns { display: grid; gap: 8px; }
button {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 8px;
  padding: 13px 16px; cursor: pointer;
  background: var(--noren); color: var(--noren-ink); box-shadow: 0 3px 0 #6e1d15;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #6e1d15; }
a.xbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  font-weight: 700; font-size: 16px; border-radius: 8px; padding: 13px 16px;
  background: #0f1419; color: #fff; box-shadow: 0 3px 0 #000;
}
a.xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
a.xbtn:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
a.xbtn svg { width: 16px; height: 16px; fill: currentColor; }
button.sub { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
.how { font-size: 12px; opacity: .7; margin: 0; }
.back { font-size: 13px; color: var(--ink); opacity: .75; }
.back:hover { opacity: 1; }
.hub-back {
  position: fixed; z-index: 60;
  left: calc(env(safe-area-inset-left, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  font: 700 12px/1 "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: .04em;
  padding: 7px 11px; border-radius: 99px; text-decoration: none;
  background: rgba(20, 18, 24, .55); color: #fff; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.hub-back:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
</style>

<body>

<canvas id="c" aria-label="たこ焼き返しのゲーム画面"></canvas>

<div class="hud" id="hud" hidden>
  <div class="pill" id="hTimePill"><span class="lab">のこり</span><span class="val" id="hTime">60</span><span class="unit">秒</span></div>
  <div class="pill mid"><span class="lab">舟</span><span class="val" id="hBoats">0</span><br><span class="unit burn" id="hBurn">焦がし ○○○</span></div>

<div class="overlay" id="title">

      <div class="meta"><span>最高 <b id="tBest">0</b> 点</span><span>最多 <b id="tBoats">0</b> 舟</span><span>最高 <b id="tCombo">0</b> コンボ</span></div>
      <div class="btns"><button id="startBtn">焼きはじめる</button></div>

    </div>

</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="noren result" aria-hidden="true"><span>お</span><span>お</span><span>き</span><span>に</span></div>
    <div class="body">
      <div class="badge" id="newRec" hidden>新記録</div>
      <div class="score"><span id="oScore">0</span><small>点</small></div>
      <div class="meta"><span><b id="oBoats">0</b> 舟</span><span>ベスト <b id="oBests">0</b> 回</span><span>最高 <b id="oCombo">0</b> コンボ</span><span>自己ベスト <b id="oBest">0</b> 点</span></div>
      <p class="how" id="oCause"></p>
      <div class="btns">
        <button id="retryBtn">もう一回</button>
        <a class="xbtn" id="xBtn" href="https://x.com/intent/post" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Xでシェア</a>
        <button class="sub" id="copyBtn">結果をコピー</button>
      </div>
      <p class="how" id="copyMsg">画面タップ・スペースでもう一回</p>
      <a class="back" href="../../">← ほかのゲームを見る</a>
    </div>
  </div>
</div>

<a class="hub-back" id="hubBack" href="/" aria-label="あそび横丁（ゲーム一覧）にもどる">← 横丁</a>

<script>
(() => {
const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 記録（このブラウザだけ） ---------- */
const KEY = 'takoyaki:v1';
const DEF = { best: 0, bestBoats: 0, bestCombo: 0, bestBests: 0, plays: 0 };
function load() { try { return Object.assign({ ...DEF }, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { return { ...DEF }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch {} }
let rec = load();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => 1 - Math.pow(1 - k, 3);

/* ---------- 画面サイズ（仮想 380x700 の箱を中央に） ---------- */
let W, H, dpr, scale, VW, VH, offY;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  scale = Math.min(W / 380, H / 700);
  VW = W / scale; VH = H / scale;
  offY = (VH - 700) / 2;
}
window.addEventListener('resize', resize); resize();

/* ---------- 定数 ---------- */
const STEP = 1 / 60;
const GAME_SEC = 60, MAX_BURN = 3;
const COLS = 4, ROWS = 4, SP = 78, HR = 31, BCY = 278;
const BOAT_Y = 592, BOAT_N = 8;
const FLIP_DUR = 0.26;

/* ---------- 焼き色（v: 0=生 → 1=焦げ） ---------- */
const RAMP = [
  [0.00, [246, 238, 218]], [0.30, [241, 220, 152]], [0.45, [233, 186, 92]], [0.54, [221, 154, 58]],
  [0.62, [202, 130, 50]], [0.78, [150, 84, 36]], [0.90, [88, 48, 24]], [1.00, [27, 20, 17]],
];
function rampRGB(v) {
  v = clamp(v, 0, 1);
  for (let i = 1; i < RAMP.length; i++) {
    if (v <= RAMP[i][0]) {
      const [a, ca] = RAMP[i - 1], [b, cb] = RAMP[i], k = (v - a) / (b - a);
      return ca.map((x, j) => Math.round(x + (cb[j] - x) * k));
    }
  }
  return RAMP[RAMP.length - 1][1];
}
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
// 焼け具合 c (0..1, 1=焦げ) を、その穴の判定幅に合わせた見た目の色 v に
function visOf(h) {
  const c = h.c, w = h.w;
  if (c < w.okLo) return lerp(0, 0.3, c / w.okLo);
  if (c < w.bestLo) return lerp(0.3, 0.45, (c - w.okLo) / (w.bestLo - w.okLo));
  if (c < w.bestHi) return lerp(0.45, 0.62, (c - w.bestLo) / (w.bestHi - w.bestLo));
  return lerp(0.62, 0.92, (c - w.bestHi) / (1 - w.bestHi));
}
// 返した後の玉は少し焼けた色から始まり、判定幅のところで1面目と同じ色になる
const vis2 = h => { const v = visOf(h); return v < 0.45 ? lerp(0.3, 0.45, v / 0.45) : v; };
function judgeOf(h) {
  if (h.c >= h.w.bestLo && h.c <= h.w.bestHi) return 'best';
  if (h.c < h.w.okLo) return 'raw';
  return 'ok';
}

/* ---------- 状態 ---------- */
let state = 'title';   // title | play | ending | over
let holes, flyers, boats, floats, parts, steam, clock, elapsed, score, combo, maxCombo, bests, boatsDone, burns, pourCd, endT, endCause, shake, demoMode;

function makeHoles() {
  const a = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    a.push({ i: a.length, x: (c - 1.5) * SP, y: BCY + (r - 1.5) * SP, st: 'empty', c: 0, T: 4, t: 0, w: null, look: null, phase: 1, nb: 0, fv: 0 });
  }
  return a;
}
function makeLook() {
  return {
    tako: { a: rand(0, 6.28), d: rand(0.1, 0.35), r: rand(0, 6.28) },
    negi: Array.from({ length: 4 }, () => ({ a: rand(0, 6.28), d: rand(0.2, 0.75) })),
    ten: Array.from({ length: 4 }, () => ({ a: rand(0, 6.28), d: rand(0.25, 0.8), s: rand(2, 3.4) })),
    spots: Array.from({ length: 7 }, () => ({ a: rand(0, 6.28), d: rand(0.15, 0.8), s: rand(0.18, 0.36), k: rand(0.5, 1) })),
    bub: Array.from({ length: 5 }, () => ({ a: rand(0, 6.28), d: rand(0.1, 0.7), ph: rand(0, 1) })),
    seam: rand(-0.5, 0.5),
  };
}
function newBoat(x0) { return { items: [], reserved: 0, x: x0, fullAt: Infinity, arriveAt: clock, from: x0, bests: 0, awarded: false, top: makeTop() }; }
function makeTop() {
  return {
    nori: Array.from({ length: 90 }, () => ({ x: rand(-100, 100), y: rand(-34, 30), s: rand(1.4, 2.8) })),
    katsuo: Array.from({ length: 18 }, () => ({ x: rand(-95, 95), y: rand(-34, 28), a: rand(0, 6.28), ph: rand(0, 6.28), s: rand(10, 15) })),
  };
}

function reset(demo) {
  demoMode = demo;
  holes = makeHoles(); flyers = []; floats = []; parts = []; steam = steam || [];
  clock = 0; elapsed = demo ? 14 : 0; score = 0; combo = 0; maxCombo = 0; bests = 0; boatsDone = 0; burns = 0;
  pourCd = 0.15; endT = 0; endCause = ''; shake = 0;
  boats = [newBoat(0)];
  updateHud();
}

/* ---------- 難しさ（経過時間で） ---------- */
const diff = () => clamp(elapsed / 55, 0, 1);
function targetActive() {
  if (demoMode) return 7;
  if (elapsed < 7) return 3;
  return Math.round(lerp(4, 9, clamp((elapsed - 7) / 43, 0, 1)));
}
function pour(h) {
  const d = diff();
  h.st = 'pour'; h.t = 0; h.c = 0; h.phase = 1; h.nb = 0;
  h.T = lerp(5.4, 2.9, d) * rand(0.9, 1.12);
  h.w = { okLo: lerp(0.34, 0.47, d), bestLo: lerp(0.47, 0.58, d), bestHi: lerp(0.78, 0.755, d) };
  h.look = makeLook();
  if (!demoMode) sfxPour();
}

/* ---------- 操作 ---------- */
function act(h) {
  if (!h || (h.st !== 'p1' && h.st !== 'p2')) return false;
  if (h.c < 0.1) return false;          // 流し込んだばかりは無視（誤タップ防止）
  const j = judgeOf(h);
  if (j === 'raw') { miss(h, h.phase === 1 ? '生すぎ！' : 'まだ生焼け'); return true; }
  award(h, j);
  if (h.phase === 1) {
    h.fv = visOf(h); h.st = 'flip'; h.t = 0;
    for (let k = 0; k < 6; k++) parts.push({ x: h.x + rand(-10, 10), y: h.y, vx: rand(-1.4, 1.4), vy: rand(-3.4, -1.6), life: 0.5, r: rand(1.6, 2.8), col: rgb(rampRGB(h.fv * 0.6)) });
    sfxFlip(j);
  } else {
    take(h);
  }
  return true;
}
function award(h, j) {
  combo++; maxCombo = Math.max(maxCombo, combo);
  if (j === 'best') { bests++; h.nb++; }
  const pts = Math.round((j === 'best' ? 100 : 40) * (1 + Math.min(combo, 20) * 0.05));
  if (!demoMode) score += pts;
  floats.push({ text: j === 'best' ? 'ベスト！' : 'OK', sub: demoMode ? '' : `+${pts}`, x: h.x, y: h.y - 30, life: 1, kind: j });
  updateHud();
}
function miss(h, label) {
  combo = 0;
  floats.push({ text: label, sub: '', x: h.x, y: h.y - 30, life: 1, kind: 'raw' });
  for (let k = 0; k < 8; k++) parts.push({ x: h.x + rand(-8, 8), y: h.y, vx: rand(-2, 2), vy: rand(-3, -1), life: 0.6, r: rand(1.8, 3), col: 'rgba(246,236,210,.95)' });
  h.st = 'mess'; h.t = 0;
  sfxMiss();
  updateHud();
}
function burn(h) {
  combo = 0; h.st = 'burnt'; h.t = 0;
  floats.push({ text: 'コゲた！', sub: '', x: h.x, y: h.y - 30, life: 1.2, kind: 'burn' });
  if (!demoMode) {
    burns++;
    if (!reduceMotion) shake = 7;
    sfxBurn();
    if (burns >= MAX_BURN && state === 'play') endGame('3回焦がしてしまった…');
  }
  updateHud();
}
function take(h) {
  let boat = boats[boats.length - 1];
  const slot = boat.reserved++;
  const dur = Math.max(0.36, boat.arriveAt - clock + 0.05);
  const f = { boat, slot, x0: h.x, y0: h.y, t: 0, dur, v: Math.min(0.68, vis2(h)), nb: h.nb, look: h.look, landAt: clock + dur };
  flyers.push(f);
  if (boat.reserved === BOAT_N) {
    boat.fullAt = Math.max(...flyers.filter(q => q.boat === boat).map(q => q.landAt), clock);
    const nb = newBoat(-(VW / 2 + 160));
    nb.leaveAt = Infinity; nb.arriveAt = boat.fullAt + 0.55 + 0.3;
    boats.push(nb);
  }
  h.st = 'rest'; h.t = 0; h.c = 0;
  sfxTake();
}
function slotPos(slot) { const c = slot % 4, r = Math.floor(slot / 4); return { x: (c - 1.5) * 47, y: BOAT_Y - 14 + r * 38 }; }
function boatX(b) {
  const VO = VW / 2 + 170;
  // 入ってくる（左から）
  if (b.arriveAt > clock && b !== boats[0]) {
    const st = b.arriveAt - 0.3;
    return clock < st ? -VO : lerp(-VO, 0, ease((clock - st) / 0.3));
  }
  // 出ていく（右へ）
  const lv = b.fullAt + 0.55;
  if (clock > lv) return lerp(0, VO, Math.min(1, (clock - lv) / 0.3) ** 2);
  return 0;
}

/* ---------- 進行 ---------- */
function step() {
  clock += STEP;
  const playing = state === 'play' || demoMode;
  if (state === 'play') {
    elapsed += STEP;
    if (elapsed >= GAME_SEC) { elapsed = GAME_SEC; endGame('60秒 焼ききった！'); }
  }
  if (state === 'ending') { endT += STEP; if (endT > 1.0) showOver(); }

  // 流し込み
  if (playing && (demoMode || GAME_SEC - elapsed > 1.5)) {
    pourCd -= STEP;
    const active = holes.filter(h => h.st !== 'empty').length;
    if (pourCd <= 0 && active < targetActive()) {
      const empty = holes.filter(h => h.st === 'empty');
      if (empty.length) { pour(empty[Math.floor(Math.random() * empty.length)]); pourCd = demoMode ? 0.5 : lerp(0.6, 0.24, diff()); }
    }
  }

  const cooking = state !== 'ending' && state !== 'over' || demoMode;
  for (const h of holes) {
    h.t += STEP;
    if (h.st === 'pour') { if (h.t >= 0.28) { h.st = 'p1'; h.t = 0; } }
    else if (h.st === 'p1' || h.st === 'p2') {
      if (cooking) h.c += STEP / h.T;
      if (demoMode && h.c >= (h.w.bestLo + h.w.bestHi) / 2 + h.look.seam * 0.08) act(h);
      else if (h.c >= 1) burn(h);
      if (Math.random() < 0.04 + h.c * 0.05) steam.push({ x: h.x + rand(-14, 14), y: h.y - 8, vx: rand(-0.15, 0.15), vy: rand(-0.7, -0.4), r: rand(7, 12), life: 1, a: rand(0.05, 0.1) });
    }
    else if (h.st === 'flip') { if (h.t >= FLIP_DUR) { h.st = 'p2'; h.t = 0; h.c = 0; h.phase = 2; h.T *= 0.85; } }
    else if (h.st === 'burnt') {
      if (Math.random() < 0.3) steam.push({ x: h.x + rand(-10, 10), y: h.y - 10, vx: rand(-0.2, 0.2), vy: rand(-1, -0.6), r: rand(8, 14), life: 1, a: 0.22, dark: true });
      if (h.t >= 0.9) { h.st = 'rest'; h.t = 0; }
    }
    else if (h.st === 'mess') { if (h.t >= 0.4) { h.st = 'rest'; h.t = 0; } }
    else if (h.st === 'rest') { if (h.t >= 0.35) { h.st = 'empty'; h.t = 0; } }
  }

  // 舟へ飛ぶ
  for (const f of flyers) {
    f.t += STEP;
    if (f.t >= f.dur && !f.done) {
      f.done = true; f.boat.items[f.slot] = { v: f.v, nb: f.nb, look: f.look };
      f.boat.bests += f.nb;
      sfxPlop(f.slot);
    }
  }
  flyers = flyers.filter(f => !f.done);
  // 舟の完成
  for (const b of boats) {
    if (!b.awarded && clock >= b.fullAt && b.items.filter(Boolean).length === BOAT_N) {
      b.awarded = true;
      if (!demoMode) {
        const bonus = 300 + b.bests * 25;
        score += bonus; boatsDone++;
        floats.push({ text: `${boatsDone}舟あがり！`, sub: `+${bonus}`, x: 0, y: BOAT_Y - 70, life: 1.5, kind: 'boat' });
        sfxBoat();
      }
      updateHud();
    }
  }
  boats = boats.filter(b => !(clock > b.fullAt + 0.9));
  if (!boats.length) boats = [newBoat(0)];

  for (const p of parts) { p.vy += 0.22; p.x += p.vx; p.y += p.vy; p.life -= STEP; }
  parts = parts.filter(p => p.life > 0);
  for (const s of steam) { s.x += s.vx + Math.sin(clock * 1.3 + s.y * 0.03) * 0.2; s.y += s.vy; s.r += 0.18; s.life -= STEP * 0.8; }
  steam = steam.filter(s => s.life > 0);
  if (steam.length > 80) steam.splice(0, steam.length - 80);
  for (const f of floats) f.life -= STEP / 0.9;
  floats = floats.filter(f => f.life > 0);
  shake *= 0.86;
  sizzle();
}

function endGame(cause) {
  if (state !== 'play') return;
  state = 'ending'; endT = 0; endCause = cause;
  sfxEnd(cause.startsWith('60'));
}

}

function drawPlate() {

// 1面目: 穴の中で平らに焼ける生地
function drawBatter(x, y, r, v, look, wet, sy = 1) {
  const base = rampRGB(v), edge = rampRGB(Math.min(1, v + 0.16));
  ctx.save(); ctx.translate(x, y); ctx.scale(1, sy);
  const g = ctx.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r);
  g.addColorStop(0, rgb(rampRGB(Math.max(0, v - 0.05)))); g.addColorStop(0.65, rgb(base)); g.addColorStop(1, rgb(edge));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  // 焼きムラ（縁から）
  for (const s of look.spots) {
    ctx.fillStyle = rgb(edge, 0.35 * s.k * clamp(v * 2, 0, 1));
    ctx.beginPath(); ctx.arc(Math.cos(s.a) * r * (0.55 + s.d * 0.45), Math.sin(s.a) * r * (0.55 + s.d * 0.45), r * s.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  // 天かす・ねぎ・たこ
  for (const t of look.ten) { ctx.fillStyle = rgb(rampRGB(v + 0.2), 0.9); ctx.beginPath(); ctx.arc(Math.cos(t.a) * r * t.d, Math.sin(t.a) * r * t.d, t.s, 0, Math.PI * 2); ctx.fill(); }
  for (const n of look.negi) { ctx.fillStyle = `rgba(92,150,64,${0.9 - v * 0.4})`; ctx.fillRect(Math.cos(n.a) * r * n.d - 2, Math.sin(n.a) * r * n.d - 1.2, 4, 2.4); }
  const tk = look.tako, tx = Math.cos(tk.a) * r * tk.d, ty = Math.sin(tk.a) * r * tk.d;
  ctx.save(); ctx.translate(tx, ty); ctx.rotate(tk.r);
  ctx.fillStyle = '#b8434a'; ctx.beginPath(); ctx.ellipse(0, 0, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2d6cf'; ctx.beginPath(); ctx.ellipse(1.5, 1.6, 4, 2.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e9b7ae'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(-2 + k * 2.6, 1.6, 0.9, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  // 生のうちは濡れて光る＋ぷつぷつ泡
  if (wet > 0) {
    ctx.fillStyle = `rgba(255,255,255,${0.32 * wet})`;
    ctx.beginPath(); ctx.ellipse(-r * 0.32, -r * 0.38, r * 0.42, r * 0.14, -0.5, 0, Math.PI * 2); ctx.fill();
    for (const b of look.bub) {
      const k = (clock * 0.9 + b.ph) % 1;
      ctx.strokeStyle = `rgba(255,250,235,${0.5 * wet * (1 - k)})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(Math.cos(b.a) * r * b.d, Math.sin(b.a) * r * b.d, 1 + k * 2.4, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.restore();
}
// 2面目: 返して丸くなった玉
function drawBall(x, y, r, v, look, sy = 1, shine = 1) {
  const base = rampRGB(v), dark = rampRGB(Math.min(1, v + 0.22)), lite = rampRGB(Math.max(0, v - 0.2));
  ctx.save(); ctx.translate(x, y); ctx.scale(1, sy);

  g.addColorStop(0, rgb(lite)); g.addColorStop(0.55, rgb(base)); g.addColorStop(1, rgb(dark));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  for (const s of look.spots) {
    ctx.fillStyle = rgb(dark, 0.42 * s.k * clamp(v * 1.8, 0.2, 1));
    ctx.beginPath(); ctx.ellipse(Math.cos(s.a) * r * s.d, Math.sin(s.a) * r * s.d, r * s.s, r * s.s * 0.7, s.a, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = `rgba(255,255,255,${0.6 * shine})`;
  ctx.beginPath(); ctx.arc(-r * 0.42, -r * 0.46, r * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function glowRing(h) {
  if (!(h.c >= h.w.bestLo && h.c <= h.w.bestHi)) return;
  const p = 0.6 + 0.4 * Math.sin(clock * 14);
  const g = ctx.createRadialGradient(h.x, h.y, HR * 0.7, h.x, h.y, HR + 12);
  g.addColorStop(0, 'rgba(255,214,110,0)'); g.addColorStop(0.55, `rgba(255,214,110,${0.55 * p})`); g.addColorStop(1, 'rgba(255,190,80,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h.x, h.y, HR + 12, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(255,236,170,${0.85 * p})`; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(h.x, h.y, HR + 2, 0, Math.PI * 2); ctx.stroke();
  // キラッ
  const a = clock * 3 + h.i;
  const sx = h.x + Math.cos(a) * (HR + 2), sy = h.y + Math.sin(a) * (HR + 2);
  ctx.fillStyle = `rgba(255,250,220,${p})`;
  ctx.beginPath(); ctx.moveTo(sx, sy - 5); ctx.lineTo(sx + 1.4, sy); ctx.lineTo(sx, sy + 5); ctx.lineTo(sx - 1.4, sy); ctx.closePath(); ctx.fill();

}

function drawHoles() {
  for (const h of holes) {
    if (h.st === 'pour') {
      const k = ease(clamp(h.t / 0.28, 0, 1));
      drawBatter(h.x, h.y, HR * 0.95 * k, 0, h.look, 1);
      // 生地の流れ
      ctx.fillStyle = 'rgba(246,238,218,.9)';
      ctx.fillRect(h.x - 3 * (1 - k), h.y - 60, 6 * (1 - k), 60 * (1 - k));
    } else if (h.st === 'p1') {
      glowRing(h);
      drawBatter(h.x, h.y, HR * 0.95, visOf(h), h.look, clamp(1 - h.c * 1.6, 0, 1));
    } else if (h.st === 'flip') {
      const k = h.t / FLIP_DUR, lift = Math.sin(Math.PI * k) * 16, sy = Math.max(0.3, Math.abs(Math.cos(Math.PI * k)));
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 4, HR * 0.85, HR * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(h.x, h.y - lift); ctx.rotate(Math.sin(Math.PI * k) * 0.5);
      if (k < 0.5) drawBatter(0, 0, HR * 0.95, h.fv, h.look, 0, sy);
      else drawBall(0, 0, HR * 0.9, lerp(h.fv, 0.3, (k - 0.5) * 2), h.look, sy, 0.8);
      ctx.restore();
    } else if (h.st === 'p2') {
      glowRing(h);
      const v = vis2(h);
      // 返した直後は少し弾む
      const bounce = h.t < 0.18 ? Math.sin(h.t / 0.18 * Math.PI) * 0.06 : 0;
      drawBall(h.x, h.y, HR * 0.9, v, h.look, 1 - bounce);
    } else if (h.st === 'burnt') {
      drawBall(h.x, h.y, HR * 0.9, 1, h.look, 1, 0.25);
      ctx.strokeStyle = 'rgba(255,120,50,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(h.x - 10, h.y - 4); ctx.lineTo(h.x - 2, h.y + 2); ctx.lineTo(h.x + 8, h.y - 6); ctx.stroke();
    } else if (h.st === 'mess') {
      const k = h.t / 0.4;
      ctx.globalAlpha = 1 - k; drawBatter(h.x, h.y, HR * 0.95 * (1 - k * 0.5), 0.1, h.look, 1); ctx.globalAlpha = 1;
    }
  }
}

function drawBoat(b) {
  const x = boatX(b), y = BOAT_Y;
  ctx.save(); ctx.translate(x, 0);
  // 影
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(4, y + 52, 128, 14, 0, 0, Math.PI * 2); ctx.fill();
  // 舟（経木）
  const sh = () => { ctx.beginPath(); ctx.moveTo(-128, y - 46); ctx.lineTo(128, y - 46); ctx.lineTo(110, y + 50); ctx.lineTo(-110, y + 50); ctx.closePath(); };
  sh(); ctx.fillStyle = '#d9b97f'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-116, y - 38); ctx.lineTo(116, y - 38); ctx.lineTo(102, y + 42); ctx.lineTo(-102, y + 42); ctx.closePath();
  ctx.fillStyle = '#ecd6a6'; ctx.fill();
  ctx.save(); sh(); ctx.clip();
  ctx.strokeStyle = 'rgba(150,110,60,.28)'; ctx.lineWidth = 1;
  for (let i = -130; i < 130; i += 9) { ctx.beginPath(); ctx.moveTo(i, y - 50); ctx.lineTo(i - 6, y + 52); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = '#b58f55'; ctx.lineWidth = 2; sh(); ctx.stroke();
  // 中身
  const done = b.items.filter(Boolean).length === BOAT_N && clock >= b.fullAt;
  const tk = done ? clamp((clock - b.fullAt) / 0.55, 0, 1) : 0;
  for (let s = 0; s < BOAT_N; s++) {
    const it = b.items[s]; if (!it) continue;
    const p = slotPos(s);
    ctx.fillStyle = 'rgba(80,50,20,.3)'; ctx.beginPath(); ctx.ellipse(p.x + 2, p.y + 15, 19, 6, 0, 0, Math.PI * 2); ctx.fill();
    drawBall(p.x, p.y, 21, it.v, it.look);
    if (it.nb === 2 && !done) { ctx.fillStyle = 'rgba(255,230,140,.9)'; ctx.font = `700 9px ${FB}`; ctx.textAlign = 'center'; ctx.fillText('★', p.x + 15, p.y - 14); }
  }
  if (done) drawToppings(b, tk);

}
function drawToppings(b, k) {
  // ソース
  const ks = clamp(k / 0.35, 0, 1);
  for (let s = 0; s < BOAT_N; s++) {
    const p = slotPos(s);
    ctx.fillStyle = 'rgba(70,30,12,.92)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y - 4, 17 * ks, 12 * ks, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,230,200,${0.35 * ks})`;
    ctx.beginPath(); ctx.ellipse(p.x - 6, p.y - 9, 5 * ks, 2 * ks, -0.5, 0, Math.PI * 2); ctx.fill();
  }
  // マヨ（ジグザグ）
  const km = clamp((k - 0.3) / 0.35, 0, 1);
  if (km > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(-110, BOAT_Y - 50, 220 * km, 100); ctx.clip();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const [w, c] of [[3.2, 'rgba(190,175,140,.55)'], [2, '#fffaf0']]) {
      ctx.strokeStyle = c; ctx.lineWidth = w;
      for (const ry of [BOAT_Y - 20, BOAT_Y + 18]) {
        ctx.beginPath();
        for (let i = 0; i <= 24; i++) { const xx = -96 + i * 8, yy = ry + (i % 2 ? 7 : -7); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  // 青のり・かつお節
  const kn = clamp((k - 0.62) / 0.38, 0, 1);
  if (kn > 0) {
    const t = b.top;
    ctx.fillStyle = '#3f6f34';
    for (let i = 0; i < t.nori.length * kn; i++) { const n = t.nori[i]; ctx.fillRect(n.x, BOAT_Y + n.y, n.s, n.s); }
    for (let i = 0; i < t.katsuo.length * kn; i++) {
      const q = t.katsuo[i];
      ctx.save(); ctx.translate(q.x, BOAT_Y + q.y); ctx.rotate(q.a + Math.sin(clock * 6 + q.ph) * 0.35);
      ctx.fillStyle = '#e9b49a'; ctx.beginPath(); ctx.moveTo(-q.s / 2, 0); ctx.quadraticCurveTo(0, -4 + Math.sin(clock * 8 + q.ph) * 2, q.s / 2, 0); ctx.quadraticCurveTo(0, 2, -q.s / 2, 0); ctx.fill();
      ctx.fillStyle = 'rgba(160,80,60,.5)'; ctx.fillRect(-q.s / 4, -1, q.s / 2, 0.8);
      ctx.restore();
    }
  }
}
function drawFlyers() {
  for (const f of flyers) {
    const k = clamp(f.t / f.dur, 0, 1), e = ease(k);
    const p = slotPos(f.slot);
    const x = lerp(f.x0, p.x, e), y = lerp(f.y0, p.y, e) - Math.sin(Math.PI * k) * (50 + f.dur * 50);
    drawBall(x, y, lerp(HR * 0.9, 21, k), f.v, f.look, 1);
  }
}

function drawInfo() {
  ctx.textAlign = 'center';
  // 焦がしカウンター
  if (state === 'play' || state === 'ending') {
    // 序盤の案内
    if (rec.plays < 2 && state === 'play' && elapsed < 9) {
      ctx.font = `17px ${FD}`;
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(clock * 5);
      ctx.fillStyle = '#ffe3a0';
      const anyP2 = holes.some(h => h.st === 'p2');
      ctx.fillText(anyP2 ? 'もう一度光ったら → タップでお皿へ' : '光ったらタップで「くるっ」', 0, BCY + ROWS * SP / 2 + 34);
      ctx.globalAlpha = 1;
    }
  }
  // 判定の文字
  for (const f of floats) {
    const a = Math.min(1, f.life * 2.5), yy = f.y - (1 - f.life) * 26;
    ctx.globalAlpha = a;
    const big = f.kind === 'boat';
    ctx.font = `${big ? 26 : f.kind === 'best' ? 19 : 16}px ${FD}`;
    ctx.lineWidth = 5; ctx.strokeStyle = f.kind === 'burn' ? '#fbefd9' : '#2a1a12';
    ctx.fillStyle = f.kind === 'best' ? '#ffd66e' : f.kind === 'ok' ? '#fbefd9' : f.kind === 'burn' ? '#1b1411' : f.kind === 'boat' ? '#ffd66e' : '#cfc6b4';
    ctx.strokeText(f.text, f.x, yy); ctx.fillText(f.text, f.x, yy);
    if (f.sub) {
      ctx.font = `700 ${big ? 16 : 12}px ${FB}`; ctx.lineWidth = 4; ctx.strokeStyle = '#2a1a12'; ctx.fillStyle = '#fbefd9';
      ctx.strokeText(f.sub, f.x, yy + (big ? 22 : 15)); ctx.fillText(f.sub, f.x, yy + (big ? 22 : 15));
    }
  }
  ctx.globalAlpha = 1;
  if (state === 'ending') {
    const k = Math.min(1, endT / 0.15);
    ctx.globalAlpha = k;
    ctx.font = `${endCause.startsWith('60') ? 44 : 34}px ${FD}`;
    ctx.lineWidth = 8; ctx.strokeStyle = '#2a1a12'; ctx.fillStyle = '#fbefd9';
    const txt = endCause.startsWith('60') ? 'そこまで！' : '焦がしすぎ…';
    ctx.strokeText(txt, 0, BCY + 12); ctx.fillText(txt, 0, BCY + 12);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'start';
}

function render() {
  drawBackdrop();
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (W / 2 + sx * scale), dpr * ((offY + sy) * scale));
  drawPlate();
  drawHoles();
  for (const b of boats) drawBoat(b);
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const s of steam) {
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
    const c = s.dark ? '60,52,48' : '255,250,240';
    g.addColorStop(0, `rgba(${c},${s.a * Math.min(1, s.life * 1.5)})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  drawFlyers();
  drawInfo();
}

/* ---------- 結果 ---------- */
let overShownAt = 0;
function showOver() {
  state = 'over';
  rec.plays++;
  const isNew = score > rec.best;
  if (isNew) rec.best = score;
  if (boatsDone > rec.bestBoats) rec.bestBoats = boatsDone;
  if (maxCombo > rec.bestCombo) rec.bestCombo = maxCombo;
  if (bests > rec.bestBests) rec.bestBests = bests;
  save();
  last = { score, boatsDone, bests };
  $('oScore').textContent = score; $('oBoats').textContent = boatsDone; $('oBests').textContent = bests;
  $('oCombo').textContent = maxCombo; $('oBest').textContent = rec.best;
  $('oCause').textContent = endCause;
  $('newRec').hidden = !(isNew && score > 0);
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({
    text: `${shareText()}${isNew && score > 0 ? ' 自己ベスト更新！' : ''}\n`,
    url: gameUrl(), hashtags: 'たこ焼き返し'
  });
  $('copyMsg').textContent = '画面タップ・スペースでもう一回';
  $('over').hidden = false; $('hud').hidden = true;
  overShownAt = performance.now();
  $('retryBtn').focus({ preventScroll: true });
  reset(true);   // 背景は自動で焼き続けるデモ
}
let last = { score: 0, boatsDone: 0, bests: 0 };
const shareText = () => `🐙たこ焼き返し ${last.boatsDone}舟 ${last.score}点（ベスト${last.bests}回）`;

/* ---------- シェア ---------- */
// 公開先のURL。ローカルで開いたときもこれをシェアする
const PUBLIC_URL = 'https://asobi.enludus.com/games/takoyaki/';
function gameUrl() {
  try {
    if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost') return location.origin + location.pathname;
  } catch {}
  return PUBLIC_URL;
}

/* ---------- HUD ---------- */
let lastSec = -1;
function updateHud() {
  $('hBoats').textContent = boatsDone;
  $('hBurn').textContent = '焦がし ' + '●'.repeat(Math.min(burns, MAX_BURN)) + '○'.repeat(Math.max(0, MAX_BURN - burns));
  $('hScore').textContent = score + '点';
  $('hCombo').textContent = `${combo}コンボ`;
}
function hudTime() {
  const s = Math.ceil(GAME_SEC - elapsed);
  if (s !== lastSec) { lastSec = s; $('hTime').textContent = s; $('hTimePill').classList.toggle('hurry', s <= 10); }
}
function fillTitle() { $('tBest').textContent = rec.best; $('tBoats').textContent = rec.bestBoats; $('tCombo').textContent = rec.bestCombo; }

/* ---------- 音（ジュワーは低めのローパスノイズ。高音のチリチリは使わない） ---------- */
let ac = null, noiseBuf = null, bed = null;
function wakeAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = ac.sampleRate * 2; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      // ブラウン寄りのノイズ（低域が厚い）
      let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.06 * w) / 1.06; d[i] = last * 3.2 + w * 0.12; }
      const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const lp1 = ac.createBiquadFilter(); lp1.type = 'lowpass'; lp1.frequency.value = 650; lp1.Q.value = 0.5;
      const lp2 = ac.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 900; lp2.Q.value = 0.5;
      const g = ac.createGain(); g.gain.value = 0;
      src.connect(lp1).connect(lp2).connect(g).connect(ac.destination); src.start();
      bed = { g, lp1 };
    }
    if (ac.state === 'suspended') ac.resume();
  } catch {}
}
let sizzleT = 0;
function sizzle() {
  if (!bed || (sizzleT += STEP) < 0.1) return;
  sizzleT = 0;
  try {
    const n = state === 'play' ? holes.filter(h => h.st === 'p1' || h.st === 'p2' || h.st === 'pour').length : 0;
    const now = ac.currentTime;
    bed.g.gain.setTargetAtTime(Math.min(0.5, n * 0.05) * (0.85 + 0.15 * Math.sin(clock * 2.3)), now, 0.15);
    bed.lp1.frequency.setTargetAtTime(520 + 90 * Math.sin(clock * 1.7) + n * 8, now, 0.2);
  } catch {}
}
function noiseBurst(at, dur, vol, f0, f1) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.6;
  lp.frequency.setValueAtTime(f0, at); lp.frequency.exponentialRampToValueAtTime(f1, at + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(vol, at + 0.03); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  s.connect(lp).connect(g).connect(ac.destination); s.start(at, Math.random()); s.stop(at + dur + 0.05);
}
function tone(freq, at, dur, vol, type = 'sine', f2) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + dur);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g).connect(ac.destination); o.start(at); o.stop(at + dur + 0.02);
}
const sfx = fn => { try { if (ac && !demoMode) fn(ac.currentTime); } catch {} };
const sfxPour = () => sfx(n => noiseBurst(n, 0.75, 0.55, 1000, 360));          // ジュワー
const sfxFlip = j => sfx(n => {                                                 // くるっ
  tone(360, n, 0.1, 0.16, 'sine', 620);
  noiseBurst(n, 0.3, 0.3, 800, 300);
  if (j === 'best') { tone(784, n + 0.05, 0.18, 0.09); tone(1046, n + 0.11, 0.24, 0.08); }
});
const sfxTake = () => sfx(n => { tone(520, n, 0.08, 0.12, 'triangle', 300); });
const sfxPlop = s => sfx(n => tone(300 + (s % 4) * 30, n, 0.1, 0.12, 'sine', 180));
const sfxMiss = () => sfx(n => { tone(220, n, 0.16, 0.12, 'triangle', 150); noiseBurst(n, 0.2, 0.25, 600, 250); });
const sfxBurn = () => sfx(n => { tone(150, n, 0.35, 0.2, 'triangle', 90); noiseBurst(n, 0.6, 0.45, 500, 200); });
const sfxBoat = () => sfx(n => { [523, 659, 784, 1046].forEach((f, i) => tone(f, n + i * 0.07, 0.22, 0.1)); });
const sfxEnd = ok => sfx(n => { if (ok) { tone(660, n, 0.2, 0.12); tone(880, n + 0.12, 0.35, 0.12); } else { tone(196, n, 0.3, 0.16, 'triangle'); tone(147, n + 0.15, 0.4, 0.14, 'triangle'); } });

/* ---------- ループ ---------- */
let acc = 0, lastTs = performance.now();
function frame(ts) {
  acc += Math.min(100, ts - lastTs); lastTs = ts;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  if (state === 'play') hudTime();
  render();
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function start() {
  wakeAudio(); reset(false); state = 'play'; lastSec = -1; hudTime();
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
}
function holeAt(cx, cy) {
  const x = cx / scale - W / scale / 2, y = cy / scale - offY;
  let best = null, bd = 44 * 44;
  for (const h of holes) { const d = (h.x - x) ** 2 + (h.y - y) ** 2; if (d < bd) { bd = d; best = h; } }
  return best;
}
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play') return;
  const r = cvs.getBoundingClientRect();
  act(holeAt(e.clientX - r.left, e.clientY - r.top));
});
cvs.addEventListener('contextmenu', e => e.preventDefault());
// タイトル・結果: ボタンやリンク以外ならどこを押しても開始
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a, #copyMsg')) return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
window.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (state === 'play') {
    e.preventDefault();
    if (!e.repeat) {
      // いちばん焼けている穴を返す / 取る
      let tgt = null;
      for (const h of holes) if ((h.st === 'p1' || h.st === 'p2') && h.c >= 0.1 && (!tgt || h.c > tgt.c)) tgt = h;
      act(tgt);
    }
    return;
  }
  if (state === 'ending') { e.preventDefault(); return; }
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a')) return;   // 他のボタンはそのまま
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText()} 最高${rec.best}点 ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try {
    navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback);
  } catch { fallback(); }
});
// ゲームの入力（画面タップ・ドラッグ）に伝わらないようにする
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) document.getElementById('hubBack').addEventListener(ev, e => e.stopPropagation(), { passive: true });

// タイトル背景: 自動で焼き続けるデモ
steam = [];
reset(true);
for (let i = 0; i < 240; i++) step();   // 最初から鉄板がにぎやかに見えるように
fillTitle();
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);

// テスト用（本番の動作には影響しない）
window.__tako = { get state() { return state; }, get holes() { return holes; }, get score() { return score; }, get burns() { return burns; }, get boats() { return boatsDone; }, get elapsed() { return elapsed; }, set elapsed(v) { elapsed = v; } };
})();
</script>
</body>
</html>
