<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たこ焼き返し</title>
<meta name="description" content="3Dのたこ焼き器で、生地を注いで、具を落として、ピンでくるっと返して、一舟をじっくり焼き上げる。最後にドーンと採点、できたたこ焼きを3Dで眺められる。変なのや、ありえないものが焼けることも。ログイン不要のブラウザゲーム。">
<meta property="og:type" content="website">
<meta property="og:title" content="たこ焼き返し">
<meta property="og:description" content="生地を注いで、ピンでくるっ。一舟をじっくり焼き上げて、ドーンと採点。">
<meta property="og:url" content="https://asobi.enludus.com/games/takoyaki/">
<meta property="og:image" content="https://asobi.enludus.com/games/takoyaki/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%99%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 WebGL（屋台の鉄板）+ 2D の演出レイヤー + HUD・ガイド・下のトレイ。タイトル/図鑑は中央のカード、結果は上下に分けて真ん中に3D */
:root {
  --night: #22150e;      /* 屋台の奥の暗がり */
  --ink: #2a1a12;
  --paper: #fbf3e2;      /* 舟（経木）の色 */
  --noren: #b3352a;      /* 屋台の赤のれん */
  --noren-ink: #fbefd9;
  --aonori: #3f6f34;
  --gold: #e8b93a;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#gl, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; }
#fx { pointer-events: none; }

.hud {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none; z-index: 10;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--noren); color: var(--noren-ink);
  border-radius: 6px; padding: 6px 12px 7px;
  font-variant-numeric: tabular-nums; line-height: 1.1;
  box-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.pill .lab { font-size: 11px; letter-spacing: .12em; opacity: .8; display: block; }
.pill .val { font-family: var(--font-display); font-size: 20px; }
.pill .unit { font-size: 13px; margin-left: 4px; }
.pill.right { text-align: right; background: var(--paper); color: var(--ink); }

.guide {
  position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 66px);
  width: min(400px, calc(100% - 24px));
  background: rgba(251, 243, 226, .94); color: var(--ink); border-radius: 10px;
  padding: 8px 12px 9px; font-size: 13px; line-height: 1.55; text-align: center;
  box-shadow: 0 4px 16px rgba(0,0,0,.3); pointer-events: none; text-wrap: balance;
}
.guide b { color: #9a2a20; }
.guide .cnt { display: block; font-family: var(--font-display); font-size: 15px; margin-top: 2px; letter-spacing: .04em; }
.guide.small { font-size: 12px; padding: 6px 10px; }

.tray {
  position: fixed; z-index: 12; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 50px);
  display: flex; gap: 6px; padding: 6px; border-radius: 12px;
  background: rgba(40, 24, 14, .82); box-shadow: 0 4px 18px rgba(0,0,0,.4);
}
.item {
  width: 76px; padding: 4px 2px 6px; border-radius: 9px; box-shadow: none;
  background: #f2e3c4; color: var(--ink); font-size: 12px; line-height: 1.2; font-weight: 700;
  display: grid; justify-items: center; gap: 2px; touch-action: none;
}
.item canvas { width: 44px; height: 34px; display: block; pointer-events: none; }
.item span { pointer-events: none; }
.item.on { background: #ffd66e; box-shadow: inset 0 0 0 2px #9a2a20; }
.item:active { transform: none; box-shadow: inset 0 0 0 2px #9a2a20; }
.stepbtn {
  position: fixed; z-index: 13;
  right: calc(env(safe-area-inset-right, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  padding: 10px 16px; font-size: 15px;
}
.stepbtn:disabled { opacity: .62; cursor: default; background: #6a4a3a; }
.stepbtn.go { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 3px 0 #6e1d15, 0 0 0 6px rgba(255, 214, 110, .55); } }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 30;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  background: rgba(26, 14, 8, .42);
  touch-action: none; cursor: pointer;
}
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);
  border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45);
  text-align: center; cursor: default;
}
.noren { background: var(--noren); color: var(--noren-ink); display: flex; gap: 3px; padding-top: 18px; }
.noren span {
  flex: 1; background: var(--noren); border-bottom: 3px solid rgba(255,255,255,.1);
  font-family: var(--font-display); font-size: 30px; line-height: 1; padding-block: 6px 16px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2);
}
.noren span.w2 { flex: 1.7; }
/* タイトルは下寄せにして、上に鉄板（遊べる画面）を見せる */
.titleov { place-items: end center; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 46px); background: linear-gradient(to bottom, rgba(26,14,8,0) 0%, rgba(26,14,8,0) 30%, rgba(26,14,8,.5) 100%); }
.titleov .body { gap: 10px; padding-top: 14px; }
.body { padding: 18px 20px 20px; display: grid; gap: 12px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }
.meta { display: flex; justify-content: center; gap: 4px 14px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meta b { font-size: 16px; }
.badge {
  justify-self: center; background: var(--aonori); color: #fff; font-weight: 700;
  font-size: 12px; letter-spacing: .14em; padding: 3px 10px; border-radius: 99px;
}
.btns { display: grid; gap: 8px; }
button {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 8px;
  padding: 13px 16px; cursor: pointer;
  background: var(--noren); color: var(--noren-ink); box-shadow: 0 3px 0 #6e1d15;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #6e1d15; }
button:disabled { cursor: progress; }
a.xbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  font-weight: 700; font-size: 16px; border-radius: 8px; padding: 13px 16px;
  background: #0f1419; color: #fff; box-shadow: 0 3px 0 #000;
}
a.xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
a.xbtn:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
a.xbtn svg { width: 16px; height: 16px; fill: currentColor; }
button.sub { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
button.link { background: transparent; color: var(--ink); box-shadow: none; padding: 4px 6px; font-size: 13px; text-decoration: underline; }
button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
.how { font-size: 12px; opacity: .7; margin: 0; }
.err { font-size: 13px; color: #b3361b; margin: 0; font-weight: 700; }
.back { font-size: 13px; color: var(--ink); opacity: .75; }
.back:hover { opacity: 1; }

/* 結果: 上に点数、下にシート、真ん中は3Dの舟（ドラッグで回せる） */
.result { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
.rtop {
  position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 14px);
  text-align: center; color: var(--noren-ink); text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 18px rgba(0,0,0,.5);
}
.rtop.don { animation: don .55s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes don { from { transform: scale(2.6); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); } }
.rscore { font-family: var(--font-display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.rscore small { font-size: 22px; margin-left: 4px; }
.rtitle { font-family: var(--font-display); font-size: 24px; margin-top: 4px; color: #ffd66e; }
.rtop .badge { display: inline-block; margin-top: 6px; text-shadow: none; }
.rsheet {
  position: absolute; left: 50%; transform: translateX(-50%); pointer-events: auto;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 44px);
  width: min(380px, calc(100% - 20px)); background: rgba(251, 243, 226, .97); color: var(--ink);
  border-radius: 12px; padding: 10px 12px 10px; display: grid; gap: 7px; text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.45); cursor: default;
}
.rsheet .meta { font-size: 12px; gap: 2px 10px; }
.rsheet .meta b { font-size: 14px; }
.found { margin: 0; font-size: 13px; line-height: 1.5; font-weight: 700; }
.row3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 6px; }
.row3 > * { padding: 10px 6px; font-size: 14px; white-space: nowrap; }
@media (max-height: 700px) {
  .rscore { font-size: 48px; } .rtitle { font-size: 20px; }
  .rsheet { gap: 5px; padding: 8px 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .rsheet .meta { font-size: 11px; } .found { font-size: 12px; } .rsheet .how { display: none; }
}
.rlinks { display: flex; justify-content: space-between; align-items: center; }

/* 図鑑 */
.dexcard { width: min(380px, 100%); }
.dexgrid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  max-height: min(56vh, 420px); overflow-y: auto; touch-action: pan-y; padding: 2px;
}
.dexsec { grid-column: 1 / -1; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .12em; opacity: .7; margin-top: 4px; }
.dexcell { background: #f1e2c3; border-radius: 8px; padding: 4px 2px 5px; font-size: 10px; line-height: 1.25; display: grid; justify-items: center; gap: 1px; }
.dexcell canvas { width: 54px; height: 54px; }
.dexcell.no { background: #e7dcc6; color: rgba(42,26,18,.5); }

/* 右端: 火力とカメラ */
.side { position: fixed; z-index: 12; right: calc(env(safe-area-inset-right, 0px) + 6px); top: 50%; transform: translateY(-50%); display: grid; gap: 6px; }
.side .grp { display: grid; gap: 3px; background: rgba(40, 24, 14, .78); border-radius: 10px; padding: 4px; box-shadow: 0 3px 12px rgba(0,0,0,.35); }
.side .lab2 { font-size: 10px; color: #fbefd9; text-align: center; letter-spacing: .08em; }
.side button { width: 40px; height: 34px; padding: 0; font-size: 13px; border-radius: 7px; background: #f2e3c4; color: var(--ink); box-shadow: none; }
.side button.on { background: #ffd66e; box-shadow: inset 0 0 0 2px #9a2a20; }
#fire button[data-f="high"].on { background: #ff9a6a; }
.tray.five .item { width: 62px; font-size: 11px; }
.hudr { display: grid; justify-items: end; gap: 4px; }
.guidebtn { position: absolute; right: 4px; top: 4px; pointer-events: auto; font-size: 10px; padding: 3px 7px; border-radius: 99px; background: #e9d9b6; color: var(--ink); box-shadow: none; }
.guide { padding-right: 40px; padding-left: 40px; }
.hub-back {
  position: fixed; z-index: 60;
  left: calc(env(safe-area-inset-left, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  font: 700 12px/1 "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: .04em;
  padding: 7px 11px; border-radius: 99px; text-decoration: none;
  background: rgba(20, 18, 24, .55); color: #fff; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.hub-back:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
</style>
</head>
<body>

<canvas id="gl" aria-label="たこ焼き返しのゲーム画面"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="hud" id="hud" hidden>
  <div class="pill"><span class="lab">工程</span><span class="val" id="hStep">1/4</span><span class="unit" id="hStepName">生地</span></div>
  <div class="hudr"><div class="pill right"><span class="lab">最高</span><span class="val" id="hBest">—</span></div></div>
</div>
<div class="side" id="side" hidden>
  <div class="grp" id="fire"><span class="lab2">火力</span><button data-f="high">強</button><button data-f="mid" class="on">中</button><button data-f="low">弱</button></div>
  <div class="grp"><span class="lab2">視点</span><button id="camIn" aria-label="寄る">＋</button><button id="camOut" aria-label="引く">−</button><button id="camLow" aria-label="低い視点">横</button><button id="camReset" aria-label="もとにもどす">↺</button></div>
</div>
<div class="guide" id="guide" hidden><span id="guideText"></span><button class="guidebtn" id="guideBtn">短く</button></div>
<div class="tray" id="tray" hidden></div>
<button class="stepbtn" id="stepBtn" hidden>次へ</button>

<div class="overlay titleov" id="title">
  <div class="card">
    <div class="noren" aria-hidden="true"><span class="w2">たこ</span><span>焼</span><span>き</span><span>返</span><span>し</span></div>
    <div class="body">
      <p class="lead">生地を注いで、具を落として、<br>生地を切って、ピンで<b>くるっ</b>と返して丸くする。<br>一舟（8個）をじっくり焼き上げよう。</p>
      <div class="meta"><span>最高 <b id="tBest">—</b> 点</span><span>称号 <b id="tRank">—</b></span><span>作った <b id="tMade">0</b> 舟</span></div>
      <div class="btns"><button id="startBtn" disabled>よみこみ中…</button><button class="sub" id="tDex">図鑑 0/19</button></div>
      <p class="err" id="loadErr" hidden></p>
      <p class="how">時間制限なし。火加減も自分で。見た目で焼き加減を見極めて。<br>2本指・ホイール・右の＋−で寄れる</p>
      <a class="back" href="../../">← ほかのゲームを見る</a>
    </div>
  </div>
</div>

<div class="result" id="result" hidden>
  <div class="rtop" id="rTop">
    <div class="rscore"><span id="rScore">0</span><small>点</small></div>
    <div class="rtitle" id="rTitle">『屋台の味』</div>
    <div class="badge" id="newRec" hidden>新記録</div>
  </div>
  <div class="rsheet" id="rSheet">
    <div class="meta" id="rBreak"></div>
    <p class="found" id="rFound"></p>
    <div class="row3">
      <button id="retryBtn">もう一舟</button>
      <a class="xbtn" id="xBtn" href="https://x.com/intent/post" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>シェア</a>
      <button class="sub" id="copyBtn">コピー</button>
    </div>
    <div class="rlinks"><button class="link" id="rDex">図鑑 0/19</button><a class="back" href="../../">← ほかのゲームを見る</a></div>
    <p class="how" id="copyMsg">ドラッグで回す・ピンチで拡大／タップでもう一舟</p>
  </div>
</div>

<div class="overlay" id="dex" hidden style="touch-action:auto">
  <div class="card dexcard">
    <div class="noren" aria-hidden="true"><span>図</span><span>鑑</span></div>
    <div class="body">
      <p class="lead" id="dexCount">0/19</p>
      <div class="dexgrid" id="dexGrid"></div>
      <button id="dexClose">とじる</button>
    </div>
  </div>
</div>

<a class="hub-back" id="hubBack" href="/" aria-label="あそび横丁（ゲーム一覧）にもどる">← 横丁</a>

<script type="module">
const $ = id => document.getElementById(id);
// ゲームの入力（画面タップ・ドラッグ）に伝わらないようにする
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) document.getElementById('hubBack').addEventListener(ev, e => e.stopPropagation(), { passive: true });

const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try { THREE = await import(THREE_URL); }
catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = k => 1 - Math.pow(1 - k, 3);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- 図鑑と記録（このブラウザだけ） ---------- */
const KINDS = {
  futago:    { cat: 'weird', name: '双子たこ焼き',   say: 'くっついて双子に！', adj: 3 },
  shikaku:   { cat: 'weird', name: '四角いたこ焼き', say: '四角い！？', adj: 2 },
  russian:   { cat: 'weird', name: 'ロシアン（激辛）', short: 'ロシアン', say: 'これはロシアン…', adj: 2 },
  choco:     { cat: 'weird', name: 'チョコ入り',     say: 'チョコが出てきた', adj: 2 },
  uzura:     { cat: 'weird', name: 'うずら卵入り',   say: 'うずら卵入り！', adj: 3 },
  takonashi: { cat: 'weird', name: 'タコなし',       say: 'タコ入ってない…', adj: -3 },
  ashi:      { cat: 'weird', name: '足はみ出し',     say: 'タコの足が出てる！', adj: 2 },
  jumbo:     { cat: 'weird', name: 'ジャンボ',       say: 'でかっ！ジャンボ', adj: 3 },
  earth:  { cat: 'rare', name: '地球' },
  moon:   { cat: 'rare', name: '満月' },
  mirror: { cat: 'rare', name: 'ミラーボール' },
  daruma: { cat: 'rare', name: 'だるま' },
  neko:   { cat: 'rare', name: '招き猫' },
  gem:    { cat: 'rare', name: '宝石' },
  ufo:    { cat: 'rare', name: '小さいUFO' },
  tako:   { cat: 'rare', name: 'タコ丸ごと' },
  gold:   { cat: 'gold', name: '黄金のたこ焼き' },
  goku:   { cat: 'gold', name: '極上舟' },
  legend: { cat: 'gold', name: '伝説の一舟' },
};
const DEX_IDS = Object.keys(KINDS);
const RARE_IDS = DEX_IDS.filter(k => KINDS[k].cat === 'rare');
const ROLL_WEIRD = ['shikaku', 'russian', 'choco', 'uzura'];
const RANKS = ['修行中', '家のたこパ', '縁日の屋台', '屋台の味', '大阪の名店', '粉もん名人', '極上舟', '伝説の一舟'];

const KEY = 'takoyaki:v1';
// ver3 = 一舟じっくり版。60秒版の項目（best など）は消さずにそのまま残す
const DEF = { ver: 3, top: 0, rank: -1, rankName: '', made: 0, dex: {}, guide: true };
function load() {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; if (typeof d !== 'object' || Array.isArray(d)) d = {}; } catch { d = {}; }
  const r = Object.assign({}, d);
  for (const k of Object.keys(DEF)) if (typeof r[k] !== typeof DEF[k] || r[k] === null) r[k] = k === 'dex' ? {} : DEF[k];
  if (Array.isArray(r.dex)) r.dex = {};
  r.dex = { ...r.dex }; r.ver = 3;

  if (stage === 'pour' || (stage === 'gu' && selItem === 'pot')) { ptr = { x, y, kind: 'pot' }; pouring = true; return; }
  if (stage === 'gu') {
    if (selItem === 'tako') { ptr = { x, y, kind: 'tako' }; return; }
    if (selItem) { ptr = { x, y, kind: 'sprinkle' }; sprinkling = { t: selItem, acc: 0 }; return; }
    return;
  }
  if (stage === 'yaku') {
    pin.visible = true; const pw = worldAt(x, y, 0.02); if (pw) pin.position.copy(pw);
    if (pinTool === 'cut') { ptr = { x, y, kind: 'cut', last: wp, cut: 0 }; return; }
    const p = nearestPiece(wp, 0.34, q => q.st === 'batter' && (q.conv || q.vol > 0.2 * VHn));
    if (pinTool === 'turn') { ptr = { x, y, kind: 'turn', p, last: wp, t0: performance.now() }; if (p) { p.gestRot = 0; p.rolling = true; } return; }
    if (pinTool === 'take') {
      if (p && !p.conv) { floatAt('先に返してから', p.root.position.clone().setY(0), 'meh', 0.8); sfxMeh(); return; }
      if (p && p.solid < 0.45 && !p.rare) { floatAt('まだやわらかい', p.root.position, 'warn'); sfxMeh(); return; }
      ptr = { x, y, kind: 'take', p }; if (p) { p.lift = true; sfxTake(); }
      return;
    }
  }
  if (stage === 'finish') {
    ptr = { x, y, kind: 'finish' };
    if (selTool === 'sauce' || selTool === 'mayo') { lastPaint = null; paintAt(x, y, selTool); }
    else sprinkleAt(x, y, selTool);
  }
}
function toolMove(x, y) {
  if (!ptr) return;
  ptr.x = x; ptr.y = y;
  if (stage === 'yaku') { const pw = worldAt(x, y, 0.02); if (pw) pin.position.copy(pw); }
  if (ptr.kind === 'cut') {
    const wp = worldAt(x, y); if (!wp || !ptr.last) { ptr.last = wp; return; }
    const d = Math.hypot(wp.x - ptr.last.x, wp.z - ptr.last.z), n = Math.ceil(d / (DX * 0.5));
    let c = 0; for (let i = 1; i <= n; i++) c += cutAt(lerp(ptr.last.x, wp.x, i / n), lerp(ptr.last.z, wp.z, i / n));
    ptr.cut += c; if (c > 0 && Math.random() < 0.3) sfxCut();
    ptr.last = wp;
  } else if (ptr.kind === 'turn' && ptr.p) {
    const wp = worldAt(x, y); if (!wp || !ptr.last) { ptr.last = wp; return; }
    const before = ptr.p.gestRot;
    rollBall(ptr.p, wp.x - ptr.last.x, wp.z - ptr.last.z);
    if (Math.floor(ptr.p.gestRot / 0.9) > Math.floor(before / 0.9)) sfxTurn(0.6);
    ptr.last = wp;
  } else if (ptr.kind === 'take' && ptr.p) {
    const wp = worldAt(x, y, 0.1); if (wp) ptr.p.root.position.set(wp.x, 0.22, wp.z);
  } else if (ptr.kind === 'finish' && (selTool === 'sauce' || selTool === 'mayo')) {
    paintAt(x, y, selTool); setLoop(sauceNode, 0.22, selTool === 'sauce' ? 260 : 340);
  }
}
function toolUp(x, y) {
  if (!ptr) return;
  const k = ptr.kind, p = ptr.p;
  if (k === 'pot') pouring = false;
  if (k === 'sprinkle') sprinkling = null;
  if (k === 'tako') {
    const wp = worldAt(x, y);
    if (wp && cellAt(wp.x, wp.z) >= 0) {
      const b = addBit('tako', wp.x + rand(-0.006, 0.006), wp.z + rand(-0.006, 0.006));
      if (b) { sfxPlop(1); if (b.onIron) floatAt('鉄板に落ちた…', wp, 'meh', 0.8); else { const q = nearestPiece(wp, RH); if (q && Math.hypot(wp.x - q.h.x, wp.z - q.h.z) < RH * 0.35) floatAt('まんなか！', wp, 'good', 0.6); } }
    }
    updateGuide();
  }
  if (k === 'turn' && p) { p.rolling = false; if (p.gestRot > 0.5 && !demoMode) finishTurn(p); updateGuide(); }

    const wp = worldAt(x, y, -0.15);

function cancelTool() { if (ptr && ptr.p) { ptr.p.lift = null; ptr.p.rolling = false; } ptr = null; pouring = false; sprinkling = null; pin.visible = false; }
glc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  touches.set(e.pointerId, local(e));
  try { glc.setPointerCapture(e.pointerId); } catch {}
  const [x, y] = local(e);
  if (touches.size === 2) {
    // 2本指: カメラ（結果では拡大）
    cancelTool();
    const [a, b] = [...touches.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), dist: orbit.dist, zoom: camCtl.zoom, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2 };
    return;
  }
  if (e.button === 2 && stage !== 'result') { pinch = { mouse: true, mx: x, my: y }; return; }
  if (stage === 'result') { ptr = { x, y, x0: x, y0: y, t0: performance.now(), moved: 0, kind: 'orbit' }; orbit.auto = false; return; }
  if (stage in STEP_NAMES) toolDown(x, y);
});
glc.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, local(e));
  const [x, y] = local(e);
  if (pinch) {
    if (pinch.mouse) { camPan(x - pinch.mx, y - pinch.my); pinch.mx = x; pinch.my = y; return; }
    if (touches.size >= 2) {
      const [a, b] = [...touches.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      if (stage === 'result') { orbit.dist = clamp(pinch.dist * pinch.d / Math.max(20, d), orbit.min || 1, orbit.max || 5); orbit.want = orbit.dist; }
      else { camCtl.zoom = clamp(pinch.zoom * pinch.d / Math.max(20, d), 0.4, 1.15); camPan(mx - pinch.mx, my - pinch.my); pinch.mx = mx; pinch.my = my; }
    }
    return;
  }
  if (stage === 'result') {
    if (!ptr) return;
    const dx = x - ptr.x, dy = y - ptr.y; ptr.x = x; ptr.y = y; ptr.moved += Math.abs(dx) + Math.abs(dy);
    orbit.az -= dx * 0.008; orbit.el = clamp(orbit.el + dy * 0.006, 0.12, 1.4);
    return;
  }
  if (!ptr) { if (stage === 'pour' || (stage === 'gu' && selItem === 'pot')) { hoverPot = [x, y]; } return; }
  toolMove(x, y);
});
let hoverPot = null;
function endPtr(e) {
  touches.delete(e.pointerId);
  if (pinch) { if (pinch.mouse || touches.size < 2) pinch = null; return; }
  if (!ptr) return;
  const [x, y] = local(e);
  if (stage === 'result') {
    const quick = performance.now() - ptr.t0 < 350 && ptr.moved < 10;
    ptr = null;
    if (quick && performance.now() - resultAt > 400 && !$('result').hidden) start();
    return;
  }
  toolUp(x, y);
}
glc.addEventListener('pointerup', endPtr);
glc.addEventListener('pointercancel', e => { touches.delete(e.pointerId); pinch = null; cancelTool(); });
glc.addEventListener('wheel', e => {
  e.preventDefault();
  if (stage === 'result') { orbit.dist = clamp(orbit.dist * (1 + Math.sign(e.deltaY) * 0.1), orbit.min || 1, orbit.max || 5); orbit.want = orbit.dist; }
  else if (stage in STEP_NAMES) camZoom(1 + Math.sign(e.deltaY) * 0.1);
}, { passive: false });
// ポットは押している間だけ傾く（長く押すほど傾いてたっぷり）
function stepPot(dt) {
  const show = stage === 'pour' || (stage === 'gu' && selItem === 'pot');
  const at = ptr && ptr.kind === 'pot' ? [ptr.x, ptr.y] : hoverPot;
  pourTilt = pouring ? Math.min(1, pourTilt + dt / 0.9) : Math.max(0, pourTilt - dt / 0.18);
  const wp = show && at ? worldAt(at[0], at[1]) : null;
  pot.visible = !!wp; stream.visible = false;
  if (!wp) { setLoop(pourNode, 0); return; }
  pot.position.set(wp.x + 0.2, 0.62 - pourTilt * 0.05, wp.z - 0.02); pot.rotation.z = 0.15 + pourTilt * 0.75;
  const flow = 0.016 * flowK * pourTilt * pourTilt;      // m³/s
  if (flow > 1e-5) {
    const k = cellAt(wp.x, wp.z);
    if (k >= 0) pourAt(wp.x, wp.z, flow * dt);
    const top = surfAt(wp.x, wp.z), y0 = 0.6;
    stream.visible = true; stream.position.set(wp.x, (y0 + top) / 2, wp.z); stream.scale.set(0.35 + pourTilt * flowK * 1.2, y0 - top, 0.35 + pourTilt * flowK * 1.2);
    if (Math.random() < dt * 6) puff(wp.x, top + 0.05, wp.z, 0.12, 0.14);
    setLoop(pourNode, 0.06 + 0.16 * pourTilt * flowK, 420 + pourTilt * 300);
    if (!pourHit) { pourHit = true; sfxPourHit(); }
  } else { setLoop(pourNode, 0); pourHit = false; }
}
let pourHit = false;
// つまんでパラパラ: 押したまま動かすと、なぞった所に散る
function stepSprinkle(dt) {
  if (!sprinkling || !ptr) return;
  const wp = worldAt(ptr.x, ptr.y); if (!wp) return;
  sprinkling.acc += dt * 34;
  while (sprinkling.acc >= 1) {
    sprinkling.acc--;
    const g = () => (Math.random() + Math.random() + Math.random() - 1.5) * 0.06;
    addBit(sprinkling.t, wp.x + g(), wp.z + g());
  }

// トレイ: タップで道具を選ぶ。具はそのまま鉄板までドラッグしてもよい
let trayDrag = null;
$('tray').addEventListener('pointerdown', e => {
  const b = e.target.closest('.item'); if (!b) return;
  e.preventDefault(); wakeAudio();
  const k = b.dataset.k;
  if (stage === 'pour') { flowK = FLOWV[k]; setSel(k); return; }
  if (stage === 'yaku') { pinTool = k; setSel(k); updateGuide(); return; }
  if (stage === 'finish') { selTool = k; setSel(k); return; }
  if (stage === 'gu') {
    selItem = k; setSel(k); updateGuide();
    trayDrag = { id: e.pointerId, started: false, x0: e.clientX, y0: e.clientY };
    try { b.setPointerCapture(e.pointerId); } catch {}

});
$('tray').addEventListener('pointermove', e => {
  if (!trayDrag) return;
  const r = glc.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const trayTop = $('tray').getBoundingClientRect().top;
  if (!trayDrag.started && (e.clientY < trayTop - 6)) { trayDrag.started = true; toolDown(x, y); }

  if (!trayDrag) return;

$('tray').addEventListener('pointercancel', () => { trayDrag = null; cancelTool(); });

// タイトル: ボタンやリンク以外ならどこを押しても開始
$('title').addEventListener('pointerdown', e => { if (e.target.closest('button, a') || $('startBtn').disabled) return; e.preventDefault(); start(); });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
window.addEventListener('keydown', e => {
  if (!$('dex').hidden) { if (e.code === 'Escape') { e.preventDefault(); closeDex(); } return; }
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  const el = document.activeElement;
  if (el && el.matches && el.matches('button, a') && el !== $('retryBtn') && el !== $('startBtn')) return;   // ボタンはそのまま
  if (stage === 'title') { if (!$('startBtn').disabled) { e.preventDefault(); start(); } return; }
  if (stage === 'result') { e.preventDefault(); if (!$('result').hidden && performance.now() - resultAt > 400) start(); return; }
  if (!$('stepBtn').disabled) { e.preventDefault(); $('stepBtn').click(); }
});
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText()} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }

/* ---------- ループ ---------- */
let clock = 0, lastTs = performance.now(), frameNo = 0;
function frame(ts) {
  let rdt = Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts; frameNo++;

  const dt = rdt * testSpeed;

  // 生地（液体）: 大きく進むときは小分けに
  if (plate.visible) {
    const n = Math.min(4, Math.ceil(dt / 0.034));

    drawBatter(); drawBits();
  }
  if (stage === 'title') stepDemo(rdt);
  if ((stage === 'pour' || stage === 'gu') && frameNo % 15 === 0) updateGuide();
  // たこ焼き

    if (!p.conv && p.st !== 'boat') {

    if (p.st === 'batter' || p.anim || p.fly || p.lift) updatePiece(p, dt, heat);
    if (p.fly) { p.fly.t += rdt / 0.32; const k = ease(clamp(p.fly.t, 0, 1)); p.root.position.lerpVectors(p.fly.from, p.fly.to, k); p.root.position.y += Math.sin(Math.PI * k) * 0.25; if (p.fly.t >= 1) { p.fly = null; sfxPlop(p.slot % 4); p.geo.computeBoundingSphere(); } }

      } else ring.material.opacity = 0;
    } else ring.material.opacity = 0;
    if (p.rare && p.rare.userData.legs) for (const [i, l] of p.rare.userData.legs.children.entries()) l.rotation.y = Math.sin(clock * 3 + i) * 0.12;
    if (p.rare && p.rareSpin && p.rareQ) p.rare.rotation.y += rdt * 0.8;

// テスト用（本番の動作には影響しない）

};
