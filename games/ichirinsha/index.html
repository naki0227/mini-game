<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 WebGL（夕方の校庭。白線・校舎・鉄棒・ジャングルジム）+ 2D の演出レイヤー + HUD。タイトル/結果は下のカード1枚 */
:root {

  --ink: #2a2420;
  --paper: #fbf5e8;      /* 画用紙 */

  --chalk: #f6f2e4;      /* チョーク */
  --gold: #e0a43a;
  --red: #c8372d;        /* 紅白帽の赤 */
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#gl, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { touch-action: none; cursor: pointer; }

.hud {
  position: fixed; right: 0; top: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--board); color: var(--chalk);
  border-radius: 6px; padding: 5px 10px 6px;
  font-variant-numeric: tabular-nums; line-height: 1.1; text-align: right;
  box-shadow: 0 2px 0 rgba(0,0,0,.28);
}
.pill .lab { font-size: 10px; letter-spacing: .12em; opacity: .85; display: block; }
.pill .val { font-family: var(--font-display); font-size: 18px; }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 40;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  background: rgba(40, 24, 14, .12);

}
#title { place-items: end center; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: linear-gradient(to top, rgba(40, 24, 16, .55), rgba(40, 24, 16, 0) 70%); }
#over { place-items: end center; background: linear-gradient(to top, rgba(40, 24, 16, .6), rgba(40, 24, 16, 0) 72%); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);

}

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 一輪車の物理（自前。three には頼らない。長さ m・時間 秒・角度 rad） ----------
   前後: 一輪車＋子ども = 車輪の上の倒立振り子。体の前への傾き θ（+ が前）。
     θ'' = (G/L)·sinθ − (KA/L)·a·cosθ − DAMP·θ' + 風 + でこぼこ
     a は車輪（＝足もと）の前への加速度。こぐ（ペダルを踏む）と車輪にトルクがかかって a > 0 → 足もとが前へ出て、体は相対的に後ろへ起きる。
     こがないと（一輪車は空回りしないので、ゆるめた足が ペダルに引っぱられて ブレーキになる）a < 0 → 体は前へ倒れていく。つまり「前に倒れかけたら こいで 車輪を体の下へ戻す」の繰り返しで進む。
     こぎすぎると 後ろへ倒れる（しりもち）。L は体の高さより長め（子どもの体が反応できる ゆっくりさ。約 0.5 秒で倍に傾く）。
   こぐ力: 押しているあいだ 踏む力 p が T_ON で 1 へ、離すと T_OFF で 0 へ。車輪の加速 a = A_P·p·つかれ·(1 − v/V_MAX)·(1 − ひねりのロス) − 抵抗。
   向き: こいでいる間だけ、腰を ひねって 向きが変わる（ψ' = YAW·ひねり·p）。ひねり は押した位置（画面の左右）で −1〜+1。
   白線: 種から決まる なめらかな曲線（曲がりぐあい κ を区間ごとに 変える。進むほど きつく）。校庭の外へ出そうになると 中へ戻る向きに曲がる。
     白線からの横のずれ off が OFF_MAX をこえたら おしまい（はみだし）。距離 = 白線に沿って進んだ長さ（いちばん先まで行った所）。
   地面: 小石（車輪が乗ると つまずいて 前へ がくっ・向きが ぶれる）、でこぼこ（体が ゆさぶられる。進むほど強く・長く）、
     水たまり（タイヤが すべる: 足もとの加速が MU_P·G までしか伝わらない → 体を起こしにくい）。風（進むほど強い。追い風は前へ、向かい風は後ろへ押す）。
   つかれ: こぐ力が だんだん弱くなる（FAT_K まで）。
   判定: θ が TH_F をこえたら 前へ どてっ、−TH_B をこえたら しりもち。
   入力はすべて時刻つき（画面のコマには よらない）。1/240 秒きざみ。 */
const PH = {
  DT: 1 / 240, G: 9.8,
  L: 3.0, KA: 2.4, DAMP: 2.2,
  A_P: 1.4, V_MAX: 3.2, T_ON: 0.07, T_OFF: 0.08, C_R: 0.1, C_V: 0.5, B_LEG: 1.4, B_0: 0.45, B_W: 0.7, STEER_LOSS: 0.22, K_LEAN: 2.5, K_BACK: 2.0,
  TH_F: 0.42, TH_B: 0.4,
  R_W: 0.254, YAW: 0.65,
  OFF_WARN: 0.3, OFF_MAX: 0.7,
  DS: 0.2, PZ0: 22, FIELD_R: 26,
  START_T: 0.5, AUTO_GO: 4, SUP_T: 2.6, SUP_K: 6, SUP_C: 3, V0: 0.5, TH0: 0.06,
  FAT_K: 0.3, FAT_T: 150,
  PEB_J: 0.3, PEB_V: 0.1, PEB_PSI: 0.07, PEB_W: 0.035,
  MU_P: 0.14, PUD_PSI: 0.2,
  ROUGH_TAU: 0.12, ROUGH_SIG: 4,
  WIND_K: 0.55, WIND_U0: 30, WIND_A: 1.0, WIND_U1: 140, WIND_LAT: 0.06,
};
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const smooth = k => k * k * (3 - 2 * k);
function rndG(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }

/* 白線と地面のもの（種から決まる。必要なぶんだけ 先へ作る。同じ種なら 何度作っても同じ） */
const kMax = u => u < 8 ? 0 : Math.min(0.24, 0.035 + 0.2 * (1 - Math.exp(-(u - 8) / 80)) + 0.0004 * u);
function makePath(seed) {
  const P = { X: [0], Z: [PH.PZ0], H: [0], K: [0], rnd: mulberry((seed * 2654435761 + 77) >>> 0), segStart: 0, segLen: 8, k0: 0, kT: 0, peb: [], pud: [], rough: [], obsU: 0, lastPud: -99 };
  return P;
}
function newSeg(P, u) {
  const r = P.rnd, i = P.X.length - 1, x = P.X[i], z = P.Z[i], h = P.H[i];
  P.k0 = P.K[i]; P.segStart = u;
  P.segLen = u < 40 ? 6 + r() * 7 : 3.5 + r() * 6.5;
  const km = kMax(u);
  let k = (r() < 0.5 ? -1 : 1) * km * (0.35 + 0.65 * r());
  if (r() < 0.18 && u > 20) k *= 0.15;   // ときどき まっすぐ
  const d = Math.hypot(x, z);
  if (d > PH.FIELD_R - 8) {   // 校庭の はしに近い: 中へ戻る向きへ
    const hc = Math.atan2(-x, z), err = wrapA(hc - h), wgt = clampP((d - PH.FIELD_R + 8) / 8, 0, 1);
    if (Math.abs(err) > 0.3 && r() < 0.45 + 0.55 * wgt) k = Math.sign(err) * Math.max(Math.abs(k), 0.06 + 0.1 * wgt);
  }
  // 白線が 輪に ならないように: この 30 m で 120° 以上 同じ向きに曲がっていたら 反対へ
  const back = Math.max(0, i - Math.round(30 / PH.DS)), turned = h - P.H[back];
  if (Math.abs(turned) > 2.1 && Math.sign(k) === Math.sign(turned) && d < PH.FIELD_R + 6) k = -k;
  P.kT = k;
  if (Math.abs(k) > 1e-3) P.segLen = Math.min(P.segLen, 1.6 / Math.abs(k));   // 1 区間で 90° ちょっとより 多くは曲がらない（白線が うずまきに ならないように）
}
function extendPath(P, uTo) {
  const DS = PH.DS;
  while ((P.X.length - 1) * DS < uTo) {
    const i = P.X.length - 1, u = i * DS;
    if (u >= P.segStart + P.segLen) newSeg(P, u);
    const kap = P.k0 + (P.kT - P.k0) * smooth(clampP((u - P.segStart) / (0.5 * P.segLen), 0, 1));
    const h = P.H[i] + kap * DS;
    P.X.push(P.X[i] + Math.sin(h) * DS); P.Z.push(P.Z[i] - Math.cos(h) * DS); P.H.push(h); P.K.push(kap);
  }
  // 地面のもの（1 m ごと）
  const r = P.rnd;
  while (P.obsU + 1 < uTo - 2) {
    const m = P.obsU; P.obsU++;
    if (m < 5) continue;
    const at = (u, off) => { const i = Math.min(P.X.length - 1, Math.round(u / DS)), h = P.H[i]; return { x: P.X[i] + Math.cos(h) * off, z: P.Z[i] + Math.sin(h) * off }; };
    const pp = 0.05 + 0.32 * (1 - Math.exp(-m / 110)) + 0.0006 * m;
    for (let n = 0; n < 2; n++) if (r() < pp * (n ? 0.5 : 1)) {
      const u = m + r(), off = gaussR(r) * 0.2, q = at(u, off), rad = 0.022 + 0.022 * r() + 0.012 * Math.min(1, m / 150) * r();
      P.peb.push({ id: P.peb.length, u, x: q.x, z: q.z, r: rad });
    }
    if (m > 22 && m - P.lastPud > 7 && r() < 0.02 + 0.05 * (1 - Math.exp(-(m - 22) / 90))) {
      const u = m + r(), q = at(u, gaussR(r) * 0.22), rad = 0.4 + 0.45 * r();
      P.pud.push({ id: P.pud.length, u, x: q.x, z: q.z, r: rad, sx: 1 + 0.4 * r(), a: r() * 3 });
      P.lastPud = m;

        next, bot: !!bot, botStart, ff, frozen, rec, seed: g.seed,
      };
    },
    ui,
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [距離 m...]（'first' / 'casual' / 'good' / 'mash'（まん中を一定間隔で）/ 'mashFast' / 'mashSlow' / 'hold'（押しっぱなし））
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(typeof skill === 'string' ? SKILLS[skill] : skill, (opts.seed0 ?? 1000) + i, opts).d),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const sk = typeof skill === 'string' ? SKILLS[skill] : skill;
      const R_ = Array.from({ length: N }, (_, i) => runBot(sk, (opts.seed0 ?? 1000) + i, opts)), d = R_.map(r => r.d), kinds = {};
      for (const r of R_) kinds[r.fail] = (kinds[r.fail] || 0) + 1;
      return { skill: typeof skill === 'string' ? skill : 'custom', N, p10: q(d, 0.1), p25: q(d, 0.25), p50: q(d, 0.5), p75: q(d, 0.75), p90: q(d, 0.9), min: Math.min(...d), max: Math.max(...d), ge2: R_.filter(r => r.d >= 2).length / N, ge5: R_.filter(r => r.d >= 5).length / N, ge50: R_.filter(r => r.d >= 50).length / N, ge100: R_.filter(r => r.d >= 100).length / N, mean: +(d.reduce((a, b) => a + b, 0) / N).toFixed(1), meanSec: +(R_.reduce((a, r) => a + r.t, 0) / N).toFixed(1), kinds };
    },
    // 一定連打のいろいろな組み合わせ（押す長さ・間隔）で: いちばん伸びる組み合わせ
    mashGrid: (N = 20) => { const out = []; for (const hold of [0.1, 0.2, 0.3, 0.45, 0.6]) for (const period of [0.4, 0.6, 0.8, 1.0, 1.3, 1.7]) { if (hold >= period) continue; const d = Array.from({ length: N }, (_, i) => runBot({ mash: true, hold, period, s: 0 }, 3000 + i).d); out.push({ hold, period, p50: q(d, 0.5), max: Math.max(...d) }); } return out.sort((a, b) => b.p50 - a.p50).slice(0, 5); },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす
    fpsCheck: (skill = 'good', seedR = 4242, maxU = 150) => {
      const r = runBot(SKILLS[skill], seedR, { log: true, maxU });
      return { live: { d: r.d, fail: r.fail, t: r3(r.t) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), fps30frameQuantized: replay(r.log, seedR, 30, true), fps60frameQuantized: replay(r.log, seedR, 60, true), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { if (game.pressed) gInput(game, game.t, 'up'); bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; ptrId = null; kbPressed = false; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    screen: (x, y, z) => scr(x, y, z),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, planNext, game: () => game,
  };
}
