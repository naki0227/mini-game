<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 WebGL（夜の縁日・提灯の下の射的屋の棚）+ 2D の演出レイヤー（照準・おじさんの声・数）+ HUD。タイトル/結果は下寄せのカード1枚 */
:root {
  --night: #141526;      /* 夜の空 */
  --ink: #2a1c16;        /* 墨 */
  --paper: #f6ecd8;      /* 生成りの紙 */
  --noren: #b3302a;      /* 屋台の赤 */
  --noren-ink: #fbf0dc;
  --gold: #eba73c;       /* 提灯のあかり */
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#gl, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { touch-action: none; cursor: crosshair; }

.hud {
  position: fixed; right: 0; top: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--noren); color: var(--noren-ink);
  border-radius: 6px; padding: 5px 10px 6px;
  font-variant-numeric: tabular-nums; line-height: 1.1; text-align: right;
  box-shadow: 0 2px 0 rgba(0,0,0,.3);
}
.pill .lab { font-size: 10px; letter-spacing: .12em; opacity: .8; display: block; }
.pill .val { font-family: var(--font-display); font-size: 17px; }
.lean {
  position: fixed; z-index: 30;
  right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: 78px; height: 78px; border-radius: 50%; padding: 0;
  font: 700 13px/1.25 var(--font-body); letter-spacing: .02em;
  background: rgba(246, 236, 216, .92); color: var(--ink); border: 3px solid var(--noren);
  box-shadow: 0 3px 0 rgba(0,0,0,.35); cursor: pointer; touch-action: none;
}
.lean.on { background: var(--noren); color: var(--noren-ink); border-color: #f6ecd8; }
.lean:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.lean:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: end center; z-index: 40;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
  background: linear-gradient(to top, rgba(14, 12, 24, .6), rgba(14, 12, 24, 0) 70%);
  touch-action: none; cursor: pointer; overflow: hidden;
}
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);
  border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5);
  text-align: center; cursor: default;
}
.noren {
  background: var(--noren); color: var(--noren-ink);
  display: flex; gap: 3px;
  padding-top: 14px;
}
.noren span {
  flex: 1; background: var(--noren); border-bottom: 3px solid rgba(255,255,255,.1);
  font-family: var(--font-display); font-size: 30px; line-height: 1; padding-block: 6px 12px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2);
}
.noren.result { padding-top: 10px; }
.noren.result span { font-size: 24px; padding-block: 4px 10px; }
.body { padding: 14px 20px 16px; display: grid; gap: 10px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }
.score { font-family: var(--font-display); font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; justify-content: center; align-items: baseline; gap: 2px; white-space: nowrap; }
.score small { font-size: 18px; margin-left: 4px; }
.score .dot { font-size: 22px; opacity: .5; margin-inline: 2px; }
.meta { display: flex; justify-content: center; gap: 6px 16px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meta b { font-size: 16px; }
.badge {
  justify-self: center; background: var(--gold); color: #3a2410; font-weight: 700;
  font-size: 12px; letter-spacing: .14em; padding: 3px 10px; border-radius: 99px;
}
#over .lead { font-size: 13px; line-height: 1.55; }
#over .body { gap: 9px; padding-block: 12px 14px; }
.btns { display: grid; gap: 8px; }
.btns .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 8px;
  padding: 13px 16px; cursor: pointer;
  background: var(--noren); color: var(--noren-ink); box-shadow: 0 3px 0 #6a1b16;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #6a1b16; }
button:disabled { opacity: .6; cursor: progress; }
a.xbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  font-weight: 700; font-size: 16px; border-radius: 8px; padding: 13px 16px;
  background: #0f1419; color: #fff; box-shadow: 0 3px 0 #000;
}
a.xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
a.xbtn:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
a.xbtn svg { width: 16px; height: 16px; fill: currentColor; }
button.sub { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); padding-inline: 8px; font-size: 15px; }
button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
.how { font-size: 12px; opacity: .72; margin: 0; line-height: 1.6; }
.err { font-size: 13px; color: #b3361b; margin: 0; font-weight: 700; }
.back { font-size: 13px; color: var(--ink); opacity: .75; }
.back:hover { opacity: 1; }
@media (max-height: 700px) {
  .score { font-size: 40px; }
  .body { gap: 8px; padding-block: 12px 14px; }
  button, a.xbtn { padding-block: 10px; }
  .noren span { font-size: 26px; }
  .overlay { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 42px); }
}
@media (max-height: 600px) { #over .lead { display: none; } .how { font-size: 11px; } }
.hub-back {
  position: fixed; z-index: 60;
  left: calc(env(safe-area-inset-left, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  font: 700 12px/1 "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: .04em;
  padding: 7px 11px; border-radius: 99px; text-decoration: none;
  background: rgba(20, 18, 24, .55); color: #fff; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.hub-back:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }

        <div class="two"><button id="retryBtn">もう一回</button><button class="sub" id="copyBtn">結果をコピー</button></div>
        <a class="xbtn" id="xBtn" href="https://x.com/intent/post" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Xでシェア</a>
      </div>

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js';
let THREE, RAPIER;
try {
  const [t, r] = await Promise.all([import(THREE_URL), import(RAPIER_URL)]);
  THREE = t; RAPIER = r.default;
  await RAPIER.init();
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D/物理エンジンの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 射的の物理（three には頼らない。Rapier の剛体だけ） ----------
   長さの単位は 1cm、重さは g、重力は 981cm/s²（本物と同じ速さで起きる）。
   屋台の棚は 3段（板の上の面の高さ 0 / 24 / 48cm、奥行き 10cm、前のふちが z=0、後ろのふちが z=-10）。棚の後ろは空いていて、
   落ちた景品は 30cm 下の地面（後ろの幕の前）へ。景品は棚の後ろのふちから BACK_GAP だけ前に、後ろの面をそろえて立っている。
   撃つ人の目は (0, EYE_Y, L)。コルク銃の銃口は目の 42cm 前・13cm 下・7cm 右（右の肩にあてた銃）。照準（目から見た向き）が棚の前の面の少し奥（z=-4）と交わる点へ
   銃口から撃つ（照準と弾の道は そこで交わる）。コルク弾は小さな球の剛体（直径 1cm・0.93g・秒速 13m）で、重力で少し下へ落ち、
   空気で少しずつ遅くなる。速いので CCD（すり抜け防止）を入れる。
   景品は箱・円柱・球・カプセルの組み合わせ（凸包は使わない）。部品ごとに密度を変えて、重さと重心をいろいろにしてある。
   当てる高さで倒れ方が変わるのは、ただの物理の結果: 重心より上の端を撃つと後ろのふちを軸に回って倒れ（棚の後ろへ落ちやすい）、
   下や真ん中を撃つと、すべるだけ（軽ければ すべって落ちる、重ければ止まる）。
   獲得は Rapier の結果だけで決める: 景品の重心が、もとの棚の板の上の面より GOT_DY 下へ行ったら「落ちた」。倒れただけ（棚の上に寝ている）は獲得ではない。
   置いた景品は眠らせておく（解き方のゆらぎで勝手に動かない）。コルクが当たると起きる。撃ったあと、ぜんぶ落ち着いたら また眠らせる。
   コルクも景品も動いていない間は world.step() 自体を飛ばす（何も変わらないので結果は同じ・軽い）。 */
const PH = {
  G: 981, DT: 1 / 240, ITERS: 6,
  TIER_Y: [0, 24, 48], SHELF_D: 10, SHELF_T: 2, SHELF_W: 74, SLOTS: [-23, 0, 23], BACK_GAP: 4, JIT: 1.5,
  MU_SHELF: 0.42, MU_PRIZE: 0.5, E_PRIZE: 0.08,
  CORK_R: 0.5, CORK_M: 0.93, CORK_V: 1300, CORK_E: 0.3, CORK_MU: 0.6, CORK_DAMP: 0.5,
  EYE_Y: 31, L0: 105, L_STEP: 12, L_MAX: 200, LEAN: 26, MUZ: { x: 7, y: -13, z: -42 }, CONV_Z: -4,
  SWAY: 0.008, SWAY_LEAN: 1.75, SWAY_GROW: 0.09,
  RELOAD: 0.85, SHOT_MIN: 0.55, SHOT_MAX: 3.0, TIMEOUT: 15, MISS_MAX: 5, STAGE_N: 6,
  GOT_DY: 3.5, FLOOR_Y: -30, CURTAIN_Z: -42, CALM_V: 1.2, CALM_W: 0.12,
  AIM_YAW: 0.62, AIM_PITCH: 0.55,
};
const DEG = Math.PI / 180;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const gaussOf = rnd => () => { let u = 0; for (let i = 0; i < 6; i++) u += rnd(); return (u - 3) / Math.sqrt(0.5); };
function qRot(q, v) {
  const { x, y, z, w } = q;
  const ix = w * v.x + y * v.z - z * v.y, iy = w * v.y + z * v.x - x * v.z, iz = w * v.z + x * v.y - y * v.x, iw = -x * v.x - y * v.y - z * v.z;
  return { x: ix * w + iw * -x + iy * -z - iz * -y, y: iy * w + iw * -y + iz * -x - ix * -z, z: iz * w + iw * -z + ix * -y - iy * -x };
}
const upY = q => 1 - 2 * (q.x * q.x + q.z * q.z);
const tiltDeg = q => Math.acos(Math.max(-1, Math.min(1, upY(q)))) / DEG;
const GRP = { WORLD: 0x1, PRIZE: 0x2, CORK: 0x4 };
const groups = (member, filter) => ((member & 0xffff) << 16) | (filter & 0xffff);

/* ----- 景品（オリジナルの見た目。大きさ cm・重さ g・点数）。原点は底の真ん中。部品: box [hx,hy,hz] / cyl [半高, 半径] / ball 半径 / cap [半高, 半径]
   dens は部品どうしの密度の比（重心の高さが変わる）。sweet: 落としやすい高さ（高さの割合。ボットの上手な人と、画面のめやす用。
   だいたい重心より上の端。だるまだけは逆で、上を撃つと起き上がってしまうので、下の方を撃って すべらせる）。 ----- */
const KINDS = {
  caramel: { sweet: 0.8, name: 'キャラメル', pts: 1, mass: 14, parts: [{ box: [2.5, 3.75, 1.1], p: [0, 3.75, 0] }] },
  ramune: { sweet: 0.82, name: 'ラムネ', pts: 1, mass: 34, parts: [{ cyl: [3, 1.7], p: [0, 3, 0], dens: 1.8 }, { cyl: [1.4, 1.2], p: [0, 7.4, 0] }, { cyl: [0.9, 0.85], p: [0, 9.7, 0], dens: 0.5 }] },
  kokeshi: { sweet: 0.8, name: 'こけし', pts: 2, mass: 30, parts: [{ cyl: [3.5, 1.65], p: [0, 3.5, 0] }, { ball: 2.1, p: [0, 8.9, 0], dens: 1.25 }] },
  usagi: { sweet: 0.75, name: 'ぬいぐるみ', pts: 2, mass: 24, parts: [{ cyl: [2.2, 2.5], p: [0, 2.2, 0] }, { ball: 2.2, p: [0, 6.3, 0] }, { cap: [0.9, 0.5], p: [-0.95, 9.3, 0], dens: 0.6 }, { cap: [0.9, 0.5], p: [0.95, 9.3, 0], dens: 0.6 }] },
  toybox: { sweet: 0.92, name: 'おもちゃの箱', pts: 2, mass: 40, parts: [{ box: [4, 3, 2.25], p: [0, 3, 0] }] },
  daruma: { sweet: 0.35, name: 'だるま', pts: 3, mass: 11, parts: [{ cyl: [0.7, 2.7], p: [0, 0.7, 0], dens: 3 }, { ball: 3.1, p: [0, 3.3, 0] }] },
  neko: { sweet: 0.88, name: '招き猫', pts: 5, mass: 55, parts: [{ box: [3, 3, 2.25], p: [0, 3, 0], dens: 1.5 }, { box: [2.7, 2.1, 2.0], p: [0, 8.1, 0] }, { box: [0.7, 1.4, 0.7], p: [2.2, 7.4, 1.0], dens: 0.7 }] },
  tokusho: { sweet: 0.9, name: 'ひみつの大箱', pts: 10, mass: 50, parts: [{ box: [4.5, 5, 2], p: [0, 5, 0] }] },
};
const KIND_KEYS = Object.keys(KINDS);
const partVol = P => P.box ? 8 * P.box[0] * P.box[1] * P.box[2] : P.cyl ? 2 * P.cyl[0] * Math.PI * P.cyl[1] ** 2 : P.ball ? 4 / 3 * Math.PI * P.ball ** 3 : 2 * P.cap[0] * Math.PI * P.cap[1] ** 2 + 4 / 3 * Math.PI * P.cap[1] ** 3;
function partBox(P) {
  const [x, y, z] = P.p;
  const e = P.box ? P.box : P.cyl ? [P.cyl[1], P.cyl[0], P.cyl[1]] : P.ball ? [P.ball, P.ball, P.ball] : [P.cap[1], P.cap[0] + P.cap[1], P.cap[1]];
  return { x0: x - e[0], x1: x + e[0], y0: y - e[1], y1: y + e[1], z0: z - e[2], z1: z + e[2] };
}
for (const k of KIND_KEYS) {
  const K = KINDS[k];
  K.id = k;
  let sw = 0; for (const P of K.parts) sw += partVol(P) * (P.dens || 1);
  const bb = { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9, z0: 1e9, z1: -1e9 };
  for (const P of K.parts) { const b = partBox(P); for (const a of ['x0', 'y0', 'z0']) bb[a] = Math.min(bb[a], b[a]); for (const a of ['x1', 'y1', 'z1']) bb[a] = Math.max(bb[a], b[a]); }

// 何個目（n: 獲得した数）で、どの景品が並びやすいか。進むほど 軽くて倒れやすいものが減って、重いもの・低くて広いものが増える

/* ---------- ボット（物理だけで遊ぶ。sim / stats / autoplay / OGP 用） ----------

          ねらいが合ったと思ったら少し遅れて離す（その間にふらつく）。ねらいのずれ ±1.6cm くらい。乗り出さない。
   good: 上手な人。倒れやすい景品（背が高い・軽い）を選び、重心より上の端（高さの 85%）をねらい、落ちる分だけ上をねらう。

const SKILLS = {
  first: { sd: 1.6, wild: 0.1, wildSd: 4, hiK: 0.5, comp: 0, swayK: 1, react: [0.12, 0.35], wait: [0.5, 2.2], pick: 'any', lean: 999 },
  good: { sd: 0.4, wild: 0.02, wildSd: 2, hiK: 'sweet', comp: 1, swayK: 0.15, react: [0.05, 0.1], wait: [0.3, 0.9], pick: 'easy', lean: 125 },

// コルクが z=zp まで飛ぶあいだに、まっすぐの線からどれだけ下へ落ちるか（空気の抵抗つき・ざっくり）

    const p = choose(g);

    const lean = g.L() + (g.lean ? PH.LEAN : 0) >= sk.lean;
    const A = aimPoint(g, p);
    if (sk.comp) A.y += corkDrop(g, A, lean);
    const wild = rnd() < sk.wild, sd = wild ? sk.wildSd : sk.sd;
    A.x += gauss() * sd; A.y += gauss() * sd;

    let tf = g.t + R(sk.wait);
    if (sk.swayK < 1) {
      let bt = tf, bv = 1e9;
      for (let t = tf; t < tf + 3; t += 0.02) { const a = g.sway(t, lean), b = g.sway(t + 0.02, lean); const v = Math.hypot(b.yaw - a.yaw, b.pitch - a.pitch); if (v < bv) { bv = v; bt = t; } }

    }
    tf = Math.max(tf, g.readyAt + 0.01);
    const E = { x: 0, y: PH.EYE_Y, z: shooterL(g.stage, lean) };
    const ang = g.anglesTo(A, E);
    // 照準を合わせたつもりの時刻（離す少し前）のふらつきだけ差し引く。その後のふらつきは first はそのまま、good は ほとんど打ち消す
    const tr = tf - R(sk.react), s0 = g.sway(tr, lean), s1 = g.sway(tf, lean);
    const yaw = ang.yaw - s0.yaw - (s1.yaw - s0.yaw) * (1 - sk.swayK), pitch = ang.pitch - s0.pitch - (s1.pitch - s0.pitch) * (1 - sk.swayK);
    return { p, lean, tf, yaw, pitch, A };
  }
  B.tick = (g, emit) => {
    if (g.phase !== 'ready') { B.plan = null; return; }
    if (!B.plan) {
      B.plan = plan(g); B.sent = false;
      if (!B.plan) return;
      if (B.plan.lean !== g.lean) emit({ type: 'lean', on: B.plan.lean, t: g.t });

// ボットで1回遊ぶ（物理だけ）。opts.rate: 入力の時刻を画面のコマ（Hz）に丸める。opts.maxN: 打ち切り（個）
function runBot(RAPIER, sk, seed, opts = {}) {
  const g = makeGame(RAPIER, seed);
  const bot = makeBot(sk, mulberry(seed * 7 + 3));
  const rate = opts.rate || 0, maxN = opts.maxN || 300;
  const emit = q => { let t = q.t; if (rate) t = Math.ceil(t * rate - 1e-9) / rate; g.input({ ...q, t }); };
  const why = {};
  while (g.phase !== 'over' && g.n < maxN && g.t < 4000) {
    bot.tick(g, emit);
    g.step();
    for (const e of g.events) if (e.type === 'resolve' && e.why) why[e.why] = (why[e.why] || 0) + 1;
    g.events.length = 0;
  }
  const r = { n: g.n, pts: g.pts, shots: g.shots, t: +g.t.toFixed(1), stage: g.stage, why, log: opts.log ? g.log.slice() : null };
  g.free();
  return r;
}
// 記録した入力の列（時刻つき）を、fps のコマ割りで流しなおす。画面は物理より少し遅れて描いているので、入力の時刻は物理の時刻より先に届く
// （そのコマで届いて、物理は その時刻で効く）。quant=true は、時刻を使わずコマの時刻で効かせた場合（くらべる用）
function replayLog(RAPIER, log, seed, fps, quant = false) {
  const g = makeGame(RAPIER, seed); let i = 0, tNow = 0;
  while (g.phase !== 'over' && tNow < 4000) {
    tNow += 1 / fps;
    while (i < log.length && log[i].t <= tNow) { g.input({ ...log[i], t: quant ? tNow : log[i].t }); i++; }
    while (g.t + PH.DT <= tNow) { g.step(); g.events.length = 0; }
  }
  const r = { n: g.n, pts: g.pts, shots: g.shots, t: +g.t.toFixed(2) };
  g.free();
  return r;
}

/* ---------- 物理を進める（入力は時刻つきで記録して、物理の時刻で使う） ---------- */

/* ---------- 音（低めにこもらせる。2kHz 以上は使わない・全体に 1.9kHz のローパス） ---------- */
let ac = null, master = null, noiseBuf = null;
function wakeAudio() {

    if (!ac) {

      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = 0.5;
      master = ac.createDynamicsCompressor(); master.threshold.value = -16; master.ratio.value = 5;
      master.connect(lp).connect(ac.destination);

      const d = noiseBuf.getChannelData(0); let b = 0;
      for (let i = 0; i < len; i++) { b = b * 0.7 + (Math.random() * 2 - 1) * 0.3; d[i] = b * 2; }
    }

}
const live = () => ac && state === 'play';
function tone(freq, at, dur, vol, type = 'sine', f1) {

  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
}
function noise(at, dur, vol, type, freq, q = 1) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1200;

}

function sPon() { try { if (!live()) return; const n0 = ac.currentTime; tone(210, n0, 0.12, 0.16, 'sine', 80); tone(420, n0, 0.05, 0.05, 'triangle', 200); noise(n0, 0.07, 0.14, 'lowpass', 700, 0.7); } catch {} }
// コルクを詰める「きゅっ・かちゃ」
function sLoad() { try { if (!live()) return; const n0 = ac.currentTime; noise(n0, 0.05, 0.035, 'bandpass', 500, 2); noise(n0 + 0.12, 0.03, 0.05, 'bandpass', 900, 3); tone(300, n0 + 0.12, 0.03, 0.025, 'triangle', 240); } catch {} }
// 景品に当たる「こつ」
function sHit(k = 1) { try { if (!live()) return; const n0 = ac.currentTime; tone(520, n0, 0.05, 0.08 * k, 'triangle', 380); tone(260, n0, 0.07, 0.06 * k, 'sine', 200); noise(n0, 0.03, 0.06 * k, 'bandpass', 800, 1.5); } catch {} }
// 棚や幕に当たる「ぽふ」
function sThud(k = 1) { try { if (!live()) return; const n0 = ac.currentTime; noise(n0, 0.06, 0.06 * k, 'lowpass', 400, 0.7); tone(140, n0, 0.06, 0.04 * k, 'sine', 100); } catch {} }

let lastTok = 0;
function sTok(e) {

}

/* ---------- シェア ---------- */
// 公開先のURL。ローカルで開いたときもこれをシェアする
const PUBLIC_URL = 'https://asobi.enludus.com/games/shateki/';
function gameUrl() {
  try {
    if (/^https?:$/.test(location.protocol) && location.hostname !== 'localhost') return location.origin + location.pathname;
  } catch {}
  return PUBLIC_URL;
}

/* ---------- HUD ---------- */
function updateHud() { $('hBest').textContent = rec.best ? `${rec.best}個` : '—'; }
function fillTitle() { $('tBest').textContent = rec.best ? `${rec.best}個・${rec.bestPts}点` : '—'; $('tPlays').textContent = rec.plays; }
function syncLean() { const b = $('leanBtn'), on = !!(game && game.lean); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.innerHTML = on ? 'もとに<br>もどる' : '身を<br>乗り出す'; }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function step(dt, now) {
  tt += dt;
  if (state === 'play' || state === 'over') advance(now);
  if (state === 'play' && !bot) moveAimKeys(dt);
  if (state === 'play' && overAt >= 0 && tt - overAt > 1.6) showOver();
  if (shake > 0) shake -= dt;
  if (bumpT > 0) bumpT -= dt;
  if (tipT > 0) tipT -= dt;
  recoil = Math.max(0, recoil - dt * 6); if (!frozen) flash = Math.max(0, flash - dt * 5);
  if (speech) { speech.life += dt; if (speech.life > speech.dur) speech = null; }
  for (const p of pops) p.life += dt;
  pops = pops.filter(p => p.life < p.dur);
  if (game && game.lean !== $('leanBtn').classList.contains('on')) syncLean();
  // コルクを詰め終わった「かちゃ」
  const rd = !!game && game.phase === 'ready' && game.t >= game.readyAt;
  if (rd && !wasReady && game.shots > 0 && state === 'play') sLoad();
  wasReady = rd;
}
let wasReady = false;
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  lagS += (clamp(dt * 1.6, 0.04, 0.16) - lagS) * 0.1;
  step(dt, now);
  render(Math.max(dt, 1 / 240));
  requestAnimationFrame(frame);
}

/* ---------- 入力: ドラッグで照準（指の動いた分だけ照準が動く）、離すと撃つ。時刻つきで物理へ ---------- */
const GAIN = 0.85;   // 指 1px で照準が動く量（画面の px）
function radPerPx() { return 2 * Math.tan(camera.fov * Math.PI / 360) / H * GAIN * (camL + 18 + 5) / (camL - (PH.CONV_Z) ); }
function clampAim() { aimYaw = clamp(aimYaw, -PH.AIM_YAW, PH.AIM_YAW); aimPitch = clamp(aimPitch, -PH.AIM_PITCH, PH.AIM_PITCH); }
function start() {
  wakeAudio(); state = 'play';
  seed = upcomingSeed();   // #seed=N: 何回目のプレイかまで同じなら、同じ景品・同じ揺れ・同じボット
  sessionPlays++;
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false; $('leanBtn').hidden = false;
  const s = nextSeed();
  newGame(s);
  syncLean(); updateHud();
  say(rec.plays ? 'らっしゃい！ 一回 五発ね' : 'らっしゃい！ 棚から落とせたら もってきな', 2.6);
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  if (bn) bot = makeBot(SKILLS[bn], mulberry(s * 7 + 3));
  // #debug&skip=秒: はじめにその秒数だけ一気に進め、コルクが当たって景品が後ろへ倒れていく瞬間で止める（OGP 撮影・確認用。bot=good と組み合わせる。freeze=1 で止めたまま）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'topple');
}
// pose=topple: 指定の秒数のあと、コルクが当たった景品が tilt 度くらい後ろへ倒れかけた瞬間まで進めて止める。pose=flight: コルクが飛んでいる途中（at=銃口からの残りの割合）
function skipTo(t1, pose = 'none') {
  const quiet = state; state = 'skip';
  const lim = t1 + 120, tilt = +(HASH.get('tilt') || 28);
  while (game.phase !== 'over' && game.t < lim) {
    if (bot) bot.tick(game, botEmit);
    game.step();
    handleEvents();
    if (game.t >= t1) {
      if (pose === 'flight') { const c = game.cork; if (c && c.body && !c.hit && c.body.translation().z < c.from.z * (+(HASH.get('at') || 0.35))) break; continue; }
      if (pose !== 'topple') break;
      const sh = game.shotHit;
      if (game.phase === 'shot' && sh && sh.p && sh.p.body && sh.p.state === 'shelf') {
        const q = sh.p.body.rotation(), w = sh.p.body.angvel();
        if (tiltDeg(q) > tilt && w.x < -0.5) break;
      }
    }
  }
  state = quiet;
  pops = []; speech = null; overAt = game.phase === 'over' ? tt : -1; snapCam = true;
  for (const tp of trayPrizes) tp.t = 1;
  if (bot && bot.plan) { aimYaw = bot.plan.yaw; aimPitch = bot.plan.pitch; }
  else if (game.lastShot) { aimYaw = game.lastShot.yaw0; aimPitch = game.lastShot.pitch0; }
  t0 = performance.now() - (game.t + lagS) * 1000;
  if (HASH.get('freeze') === '1') frozen = true;
  syncLean();
}
const evTime = e => (e.timeStamp > 1e3 && Math.abs(e.timeStamp - performance.now()) < 5000 ? e.timeStamp : performance.now());
function fireNow(ts) {
  if (!game || bot || game.phase === 'over') return;
  if (game.phase !== 'ready' || simTime(ts) - lagS < game.readyAt - 0.02) { tipText = 'コルクを詰めてるところ…'; tipT = 0.9; return; }
  queue({ type: 'fire', yaw: aimYaw, pitch: aimPitch }, ts);
}
function toResult() { if (overAt >= 0 && tt - overAt > 0.5) showOver(); }
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game) return;
  if (game.phase === 'over') { toResult(); return; }
  if (bot) return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, yaw0: aimYaw, pitch0: aimPitch, k: radPerPx() };
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  aimYaw = drag.yaw0 + (e.clientX - drag.x0) * drag.k; aimPitch = drag.pitch0 - (e.clientY - drag.y0) * drag.k; clampAim();
});
addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  aimYaw = drag.yaw0 + (e.clientX - drag.x0) * drag.k; aimPitch = drag.pitch0 - (e.clientY - drag.y0) * drag.k; clampAim();
  drag = null;
  if (state !== 'play' || !game) return;
  fireNow(evTime(e));
});
addEventListener('pointercancel', () => { drag = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
function toggleLean(ts) { if (!game || bot || state !== 'play' || game.phase === 'over') return; queue({ type: 'lean', on: !game.lean }, ts); }
$('leanBtn').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); wakeAudio(); toggleLean(evTime(e)); });
$('leanBtn').addEventListener('click', e => { if (e.detail === 0) toggleLean(performance.now()); });   // キーボードで押したとき
for (const ev of ['touchstart', 'mousedown']) $('leanBtn').addEventListener(ev, e => e.stopPropagation(), { passive: true });
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: 矢印で照準（押している間ゆっくり動く・Alt でもっとゆっくり）、スペースで撃つ、Shift で身を乗り出す
function moveAimKeys(dt) {
  const sp = (keys.Alt ? 0.04 : 0.13) * dt;
  if (keys.ArrowLeft) aimYaw -= sp; if (keys.ArrowRight) aimYaw += sp;
  if (keys.ArrowUp) aimPitch += sp; if (keys.ArrowDown) aimPitch -= sp;
  clampAim();
}
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (!game) return;
    if (c.startsWith('Arrow')) { e.preventDefault(); keys[c] = true; keys.Alt = e.altKey; wakeAudio(); return; }
    if (c === 'ShiftLeft' || c === 'ShiftRight') { if (!e.repeat) { wakeAudio(); toggleLean(evTime(e)); } return; }
    if (c === 'Space' || c === 'Enter') {
      e.preventDefault(); if (e.repeat) return; wakeAudio();
      if (game.phase === 'over') { toResult(); return; }
      fireNow(evTime(e));
    }
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});
addEventListener('keyup', e => { if (e.code.startsWith('Arrow')) keys[e.code] = false; keys.Alt = e.altKey; });
addEventListener('blur', () => { keys = {}; drag = null; });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last, rec.lastPts)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  const r2 = v => Math.round(v * 100) / 100;
  const scr = (x, y, z) => { const p = project(x, y, z); return { x: Math.round(p.x), y: Math.round(p.y) }; };
  const rect = id => { const el = $(id); if (!el || el.hidden || el.closest('[hidden]')) return null; const r = el.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2), w: Math.round(r.width), h: Math.round(r.height) }; };
  // 景品ごとの「ここを撃つと落ちやすい」画面の点（照準を置く場所。コルクが落ちる分だけ上。息の揺れは入れない）
  const hints = () => {
    if (!game) return [];
    const B = makeBot(SKILLS.good, mulberry(1));
    return game.onShelf().map(p => {
      const st = game.standing(p), t = p.body.translation(), c = game.comOf(p);
      const A = B.aimPoint(game, p), drop = corkDrop(game, A, game.lean);
      return { id: p.id, kind: p.kind, name: p.K.name, tier: p.tier, pts: p.K.pts, standing: st, mass: Math.round(p.mass), center: scr(c.x, c.y, c.z), base: scr(t.x, t.y, t.z), sweet: scr(A.x, A.y + drop, PH.CONV_Z), sweetNoDrop: scr(A.x, A.y, PH.CONV_Z), drop: r2(drop) };
    });
  };
  const ui = () => {
    const g = game, rb = g && reticleScreen(false), rs = g && reticleScreen(true);
    return {
      state, phase: g ? g.phase : null, ready: !!g && g.phase === 'ready' && g.t >= g.readyAt,
      start: rect('startBtn'), retry: rect('retryBtn'), copy: rect('copyBtn'), x: rect('xBtn'), hub: rect('hubBack'), lean: rect('leanBtn'),
      reticle: rs && { x: Math.round(rs.x), y: Math.round(rs.y) }, reticleBase: rb && { x: Math.round(rb.x), y: Math.round(rb.y) },
      dragFrom: { x: Math.round(W / 2), y: Math.round(H * 0.62) }, gain: GAIN,
      prizes: hints(),
    };
  };
  window.__shateki = {
    info: () => {
      if (!game) return { state };
      const g = game;
      return {
        state, phase: g.phase, t: +g.t.toFixed(3), n: g.n, pts: g.pts, miss: g.miss, corksLeft: PH.MISS_MAX - g.miss, shots: g.shots, stage: g.stage, L: g.L(), lean: g.lean,
        ready: g.phase === 'ready' && g.t >= g.readyAt, timeoutIn: +g.timeoutIn().toFixed(2), aim: { yaw: +aimYaw.toFixed(4), pitch: +aimPitch.toFixed(4) },
        prizes: g.prizes.map(p => ({ id: p.id, kind: p.kind, tier: p.tier, state: p.state, sleeping: p.body ? p.body.isSleeping() : null, tilt: p.body ? +tiltDeg(p.body.rotation()).toFixed(1) : null, mass: +p.mass.toFixed(1) })),
        got: g.got.map(x => x.kind), lastRes: g.lastRes ? { got: g.lastRes.got, why: g.lastRes.why } : null,
        bot: !!bot, botStart, frozen, stepMs: +stepMs.toFixed(3), lagS: +lagS.toFixed(3), rec, seed: g.seed, inq: g.inq.length,
      };
    },
    ui,
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [個数...]。opts.seed0
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(RAPIER, SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(RAPIER, SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n), why = {};
      for (const r of R) for (const k in r.why) why[k] = (why[k] || 0) + r.why[k];
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge1: R.filter(r => r.n >= 1).length / N, ge15: R.filter(r => r.n >= 15).length / N, ge30: R.filter(r => r.n >= 30).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), meanShots: +(R.reduce((a, r) => a + r.shots, 0) / N).toFixed(1), meanSec: +(R.reduce((a, r) => a + r.t, 0) / N).toFixed(1), missWhy: why };
    },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（q30/q60 は時刻を使わずコマの時刻で効かせた場合）
    fpsCheck: (skill = 'first', seedR = 4242) => { const r = runBot(RAPIER, SKILLS[skill], seedR, { log: true, maxN: 80 }); const f = (fps, qq) => replayLog(RAPIER, r.log, seedR, fps, qq); return { live: { n: r.n, pts: r.pts, shots: r.shots }, fps13: f(13), fps30: f(30), fps60: f(60), fps144: f(144), q30: f(30, true), q60: f(60, true), inputs: r.log.length }; },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play' && game.phase !== 'over') { bot = makeBot(SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; if (!on) t0 = performance.now() - (game.t + lagS) * 1000; },
    // 何もしないで sec 秒（物理だけ）: 棚の景品が勝手に動かないか。wake=true なら いったん全部起こしてから
    idle: (sec = 30, wake = false) => {
      const g = game, P = g.onShelf(), p0 = P.map(p => ({ ...p.body.translation() }));
      if (wake) for (const p of P) p.body.wakeUp();
      const t1 = g.t + sec, keep = g.readyAt, ff = g.forceStep; g.readyAt = 1e9; g.forceStep = true;
      while (g.t < t1) { g.step(); g.events.length = 0; }
      g.forceStep = ff; g.readyAt = keep + sec;
      t0 = performance.now() - (g.t + lagS) * 1000;
      return { n: g.n, onShelf: g.onShelf().length, sleeping: P.filter(p => p.body && p.body.isSleeping()).length, maxMove: +Math.max(0, ...P.map((p, i) => p.body ? Math.hypot(p.body.translation().x - p0[i].x, p.body.translation().y - p0[i].y, p.body.translation().z - p0[i].z) : 99)).toFixed(5) };
    },
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, KINDS, makeGame, runBot, makeBot, replayLog, game: () => game,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789個点！射的一回五発まと屋祭縁きゃらめるおもちゃ特賞ひみつの大箱ラムネ千両福ことっ+自己ベスト更新'), document.fonts.load(`700 16px "Zen Kaku Gothic New"`, '0123456789.棚までmコルクのこりあと秒ドラッグでねらって、離すと撃つは少し下へ落ちる。景品の上の方をを詰めてるところ…らっしゃい！一回五発ね棚から落とせたらもってきなおっやるねえもってけいい腕だあちゃーかれたおみごと2つ同時？まいったいっぺんにと特賞招き猫をほらほら撃って倒れただけじゃだめだよ〜だるまは起き上がる当たったけどねえ上の方だよ真ん中すべるだけさそいつはちょいと重いおしいもうひと押しありゃ外れちょいと下へ一歩さがってもらおうか乗り出してきたねあんまり乗り出すとぶれる残念飴ちゃんあげようまいどあり')]), new Promise(r => setTimeout(r, 1500))]); } catch {}
buildStall();
resize();
newGame(7);
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = '一回 五発';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
<a class="hub-back" id="hubBack" href="/" aria-label="あそび横丁（ゲーム一覧）にもどる">← 横丁</a>
<script>
// プレイ中でもゲーム一覧に戻れるボタン。押してもゲームの入力（タップ・ドラッグ）に伝わらないようにする
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) document.getElementById('hubBack').addEventListener(ev, e => e.stopPropagation(), { passive: true });
</script>
