<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try { THREE = await import(THREE_URL); } catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 羽根つきの物理（three には頼らない） ----------
   長さは m、時間は秒。y が上、自分は手前（z = +1.8）、相手（振袖のおねえさん）は奥（z = −1.8）。
   羽根: 「玉（ムクロジの種・重い）」と「羽の抗力の中心（軽い・空気をよく受ける）」の2点を、長さ LEN の棒でつないだ剛体。
     それぞれに 重力 と 空気抵抗 −k|v−風|(v−風)。羽の抗力が大きく、玉より後ろにあるので、どう打っても すぐ玉が前を向き、
     速度が落ちて 玉を下にして ほぼまっすぐ落ちてくる（シャトルコックと同じ）。終端速度 √(G/(KH+KT)) ≒ 5.8 m/s。
     1/1000 秒きざみ。位置は棒の長さを保つように直し、速度も棒の伸び縮みの分だけ取り除く（運動量は保つ）。
   羽子板: 面の法線 n・板の上向き a・横向き b の長方形（半幅 PW、半高 PHh）。振ると 下から上へ、
     面の向きを「前むき → 上むき」に起こしながら 速く動く（SW_T 秒。上へ速くスワイプすると速く振れる）。
     手は 体（指の横位置へ走る。奥行きは落ちてくるところへ自動）から ARM まで、羽根の真下へ のびる。
     板の面を玉が横切ったら衝突: 板と羽根の相対速度の 法線成分を 反発係数 E で返し、接線成分は MU だけ残す。
     板の端に当たると 面の向きがそちらへ ねじれる（変な方向へ飛ぶ）。
   相手: 羽根の落ちてくるところへ（反応 O_REACT のあと O_RUN m/s で）走り、手の届く範囲（O_REACH）に入れば打ち返す。
     返す球は「自分の近く＋ずれ」へ、同じ物理で（粗い刻みで）狙って打つ。回数が増えるほど ずれ・低さ（速さ）・風が強くなる。
   地面に玉が着いたらおしまい。 */
const PH = {
  G: 9.8, DT: 1 / 1000,
  LEN: 0.075, MH: 0.82, MT: 0.18, KH: 0.02, KT: 0.27, RB: 0.022,
  ME_Z: 1.8, OP_Z: -1.8,
  HIT_Y: 1.15,                       // 打ちごろの高さ（振りの真ん中で板がここを通る）
  SW_T: 0.27, SW_Y0: 0.45, SW_Y1: 1.85, SW_FWD: 0.46, SW_E0: 30, SW_E1: 80, SW_ON0: 0.04, SW_ON1: 0.97, SW_REC: 0.4,
  P_MAX: 1.7,                       // 速く振ったときの速さの倍率の上限
  PW: 0.12, PHh: 0.17,              // 羽子板の当たり（半幅・半高）
  E: 0.5, MU: 0.55, EDGE: 2.2,
  ARM: 0.54, ARMV: 5, REACH_F: 0.25, // 手の届く距離・手の速さ・体の前への出
  RUN: 4.2, RUN_A: 28, MX: 1.15, MZ0: 1.0, MZ1: 2.9,
  O_RUN: 2.35, O_A: 16, O_REACT: 0.28, O_REACH: 0.62, O_HMAX: 1.55, O_HMIN: 0.35, OX: 2.2, OZ0: -3.4, OZ1: -0.5,
  SERVE_AT: 1.1, KEY_V: 2.6,
};
const DEGR = Math.PI / 180;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
// 回数による難しさ: 返球のずれ（m）・打ち出しの角度（低いほど速く来る）・風の強さ（m/s）。上限は決めず、ゆっくり上がりつづける
function diffOf(n) {
  const k = 1 - Math.exp(-n / 30);
  return { off: 0.12 + 1.05 * k + 0.003 * n, ang: (63 - 20 * k - 0.025 * n) * DEGR, wind: 0.15 + 1.25 * k + 0.005 * n };
}
// 入力は時刻つきで入れる（画面のコマとは関係なく、物理はその時刻で効く）
function gInput(g, t, type, a = 0, b = 0) { const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, { t, type, a, b }); }
function makeShuttle(x, y, z) { return { hx: x, hy: y, hz: z, tx: x, ty: y + PH.LEN, tz: z, hvx: 0, hvy: 0, hvz: 0, tvx: 0, tvy: 0, tvz: 0 }; }
function makeGame(seed = 1) {
  const r = mulberry((seed * 2654435761) >>> 0);
  const g = {
    seed, rnd: r, t: 0, queue: [], events: [], kdir: 0, lastSwingT: -9, recFrom: null,
    phase: 'serve', last: 'op', n: 0, opN: 0, fail: null, land: null,
    s: null,
    wPh1: r() * 6.283, wPh2: r() * 6.283, wPh3: r() * 6.283, wDir: r() < 0.5 ? -1 : 1, wAmp: diffOf(0).wind,
    bx: 0, bz: PH.ME_Z, bvx: 0, bvz: 0, fx: 0,
    sw: null, swEnd: -9, swingsThis: 0, nearThis: 9,
    hcx: 0.18, hcz: PH.ME_Z - PH.REACH_F, px: 0.18, py: PH.SW_Y0, pz: PH.ME_Z - PH.REACH_F, ppx: 0.18, ppy: PH.SW_Y0, ppz: PH.ME_Z - PH.REACH_F,
    nx: 0, ny: 0.4, nz: -0.9, ax: 0, ay: 1, az: 0, bxv: 1, byv: 0, bzv: 0, pvx: 0, pvy: 0, pvz: 0, active: false, sPrev: 1,
    dirx: 0, dirz: -1,
    ox: 0, oz: PH.OP_Z, ovx: 0, ovz: 0, oGo: 0, otx: 0, otz: PH.OP_Z,
    pred: null, opPred: null, lastHit: null, hitT: -9, opHitT: -9,
  };
  g.s = makeShuttle(g.ox + 0.25, 1.05, g.oz + 0.25);
  return g;
}
// 風（横向きが主。時間でゆっくり強弱）
let WX = 0, WZ = 0;
function windAt(g, t, k = 1) {
  const f = 0.55 + 0.3 * Math.sin(0.61 * t + g.wPh1) + 0.15 * Math.sin(1.73 * t + g.wPh2);
  // 横風の向きは ゆっくり入れかわる（およそ 2 分で ひとまわり）
  const ang = 0.45 * Math.sin(0.13 * t + g.wPh3), side = Math.sin(0.05 * t + g.wPh1 * 0.5 + 0.9) * 1.15;
  const a = g.wAmp * f * k;
  WX = a * Math.cos(ang) * g.wDir * clampP(side, -1, 1); WZ = a * Math.sin(ang) * 0.6;
}
// 羽根を dt だけ進める（本番も先読みも同じ関数）
function shStep(S, dt, g, t, wk) {
  windAt(g, t, wk);
  const G = PH.G, mh = PH.MH, mt = PH.MT, M = mh + mt;
  // 玉
  let rx = S.hvx - WX, ry = S.hvy, rz = S.hvz - WZ, sp = Math.sqrt(rx * rx + ry * ry + rz * rz), c = PH.KH / mh * sp;
  S.hvx -= c * rx * dt; S.hvy -= (G + c * ry) * dt; S.hvz -= c * rz * dt;
  // 羽
  rx = S.tvx - WX; ry = S.tvy; rz = S.tvz - WZ; sp = Math.sqrt(rx * rx + ry * ry + rz * rz); c = PH.KT / mt * sp;
  const lim = Math.min(1, c * dt);   // 粗い刻みでも発散しない
  S.tvx -= lim / dt * rx * dt; S.tvy -= (G + lim / dt * ry) * dt; S.tvz -= lim / dt * rz * dt;
  S.hx += S.hvx * dt; S.hy += S.hvy * dt; S.hz += S.hvz * dt;
  S.tx += S.tvx * dt; S.ty += S.tvy * dt; S.tz += S.tvz * dt;
  // 棒の長さ
  let dx = S.hx - S.tx, dy = S.hy - S.ty, dz = S.hz - S.tz, L = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
  const k = (L - PH.LEN) / L;
  S.hx -= dx * k * mt / M; S.hy -= dy * k * mt / M; S.hz -= dz * k * mt / M;
  S.tx += dx * k * mh / M; S.ty += dy * k * mh / M; S.tz += dz * k * mh / M;
  dx /= L; dy /= L; dz /= L;
  const along = (S.hvx - S.tvx) * dx + (S.hvy - S.tvy) * dy + (S.hvz - S.tvz) * dz;
  S.hvx -= along * dx * mt / M; S.hvy -= along * dy * mt / M; S.hvz -= along * dz * mt / M;
  S.tvx += along * dx * mh / M; S.tvy += along * dy * mh / M; S.tvz += along * dz * mh / M;
}
const cloneS = S => ({ ...S });
// 先読み: 羽根が「下りながら高さ y を切る」ところ（または地面）まで進める
function predictCross(g, y, dt = 0.002, wk = 1, maxT = 5) {
  const S = cloneS(g.s); let t = g.t, py = S.hy;

    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: ←→/A D = 動く、スペース/↑/W = 打つ（Shift で強く）
function sendKeyDir(e) { input('kdir', evTime(e), (keyDir.r ? 1 : 0) - (keyDir.l ? 1 : 0)); }
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (!game) return;
    if (game.phase === 'over') { if ((c === 'Space' || c === 'Enter') && !e.repeat && failAt >= 0 && tt - failAt > 0.4) { e.preventDefault(); showOver(); } return; }
    if (c === 'ArrowLeft' || c === 'KeyA' || c === 'ArrowRight' || c === 'KeyD') {
      e.preventDefault(); if (e.repeat) return; wakeAudio();
      if (c === 'ArrowLeft' || c === 'KeyA') keyDir.l = true; else keyDir.r = true;
      // キーで動きはじめたら、指の位置ではなく いまの体の位置から
      if (game && !game.kdir) input('move', evTime(e), game.bx);
      sendKeyDir(e); return;
    }
    if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') { e.preventDefault(); if (e.repeat) return; wakeAudio(); input('swing', evTime(e), e.shiftKey ? 1.45 : 1); return; }
    if (c === 'Enter') e.preventDefault();
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') keyDir.l = false; else if (c === 'ArrowRight' || c === 'KeyD') keyDir.r = false; else return;
  if (state === 'play' && game) sendKeyDir(e);
});
addEventListener('blur', () => { ptr = null; if (keyDir.l || keyDir.r) { keyDir = { l: false, r: false }; if (state === 'play' && game) input('kdir', performance.now(), 0); } });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ入力（時刻つき）の列を、fps コマ割りで物理に流しなおす（入力はそのコマで届くが、物理はその時刻で効く）
  const replay = (log, seedR, fps) => {
    const g = makeGame(seedR); let i = 0, tNow = 0;
    while (g.phase !== 'over' && tNow < 3000) {
      tNow += 1 / fps;
      // 記録の時刻はボットが入れたときの物理の時刻（その次の 1/1000 秒で効いた）。同じ刻みで効くように半刻みだけ後ろへ
      while (i < log.length && log[i].t <= tNow) { gInput(g, Math.max(g.t, log[i].t + PH.DT * 0.5), log[i].type, log[i].a, log[i].b); i++; }
      while (g.t + PH.DT <= tNow) { stepGame(g); g.events.length = 0; }
    }
    return { n: g.n, t: +g.t.toFixed(3), fail: g.fail };
  };
  const r2 = v => Math.round(v * 100) / 100;
  window.__hanetsuki = {
    info: () => {
      if (!game) return null;
      const g = game, S = g.s, P = g.pred && g.last === 'op' && g.phase === 'rally' ? g.pred : null;
      windAt(g, g.t, 1);
      return {
        state, phase: g.phase, last: g.last, t: +g.t.toFixed(3), n: g.n, opN: g.opN, fail: g.fail,
        shuttle: { x: r2(S.hx), y: r2(S.hy), z: r2(S.hz), v: r2(Math.hypot(S.hvx, S.hvy, S.hvz)) },
        body: { x: r2(g.bx), z: r2(g.bz) }, opp: { x: r2(g.ox), z: r2(g.oz) }, wind: r2(WX),
        // 羽根が打ちごろの高さに来るところ（物理の先読み）と、その画面座標。swingIn = 振りはじめるとよい時刻まで（秒）
        pred: P && { x: r2(P.x), z: r2(P.z), hitIn: r2(P.t - g.t), swingIn: r2(P.t - PH.SW_T / 2 - g.t) },
        predScreen: P ? project(P.x, PH.HIT_Y, P.z) : null, predGround: P ? project(P.x, 0, P.z) : null,
        shuttleScreen: project(S.hx, S.hy, S.hz), bodyScreen: project(g.bx - BODY_DX, 0.6, g.bz),
        swinging: !!g.sw, canSwing: !g.sw && g.t >= g.swEnd, lastHit: g.lastHit,
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, queue: g.queue.length,
      };
    },
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [回数...]
    sim: (skill = 'good', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'good', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n);
      const kinds = {}; for (const r of R) kinds[r.fail] = (kinds[r.fail] || 0) + 1;
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge2: R.filter(r => r.n >= 2).length / N, ge10: R.filter(r => r.n >= 10).length / N, ge50: R.filter(r => r.n >= 50).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), kinds };
    },
    // ボットの入力の列を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（結果がそろうか）
    fpsCheck: (skill = 'first', seedR = 4242) => { const r = runBot(SKILLS[skill], seedR, { log: true }); return { live: { n: r.n, fail: r.fail, t: +r.t.toFixed(3) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), inputs: r.log.length }; },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）
    predScreen: () => game && game.pred ? project(game.pred.x, PH.HIT_Y, game.pred.z) : null,
    shuttleScreen: () => project(game.s.hx, game.s.hy, game.s.hz), bodyScreen: () => project(game.bx - BODY_DX, 0.6, game.bz),
    screenOfX: x => project(x, PH.HIT_Y, hitPlaneZ()), worldXOf,
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, diffOf, game: () => game,
  };
}
