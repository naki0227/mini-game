<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;

  THREE = await import(THREE_URL);

  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));
const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- 流しそうめんの物理（自前。three には頼らない） ----------
   長さは cm、時間は秒。樋（半分に割った青竹）にそって 上流の端から s（cm）。s = S_END で樋が終わり、下の受けざるへ落ちる。
   水の流れ: 流速 = 基本の速さ × 区間の傾き（上の竹は急・まん中はゆるい・下はふつう）× 継ぎ目の段差で速くなる × 曲がりで少し遅い
     × 「どばっ」と多めに流した水のかたまり（サージ。流れといっしょに下る）× 箸を入れた所のせき止め（箸の上流は遅くなる）。
   そうめんの束: 節（5〜7個）をひも状のばねでつないだもの。節は水に引きずられる（抵抗 KD×(流速−速さ)）。
     ばねは「のびたときだけ引く」ひもなので、速い所では伸び、遅い所・つかえた所では丸まる（節が重なる）。
     ばらけた束は ばねが弱く節の抵抗がばらばらで 長く広がる。速い束はサージに乗ってくる。
     ときどき継ぎ目の縁に先頭が引っかかって止まり（後ろが丸まる）、外れると水がたまっていたぶん急に流れる（フェイント）。
     ミニトマト・さくらんぼは丸い1粒: 水より速く転がり、箸に当たると はね返ったり 乗りこえたりする。
   箸: 押すと箸を水に入れる（TAU_IN 秒で水に入る。入れた瞬間に箸のすぐ前の節は しぶきで押し流されたり押し戻されたりする）。
     水に入った箸は束をせき止める。箸に当たった節はそこで止まり、WRAP 秒 当たっていると「からむ」。
     当たったまま長く待つと（水の力で。流れが速いほど・たまった節が多いほど早く）節は箸をこえて流れ去る（早すぎ・待ちすぎ）。
   離すと持ち上げる: からんだ節と、そのとなりで箸にかかっている節（DRAPE 以内）がすくえる。束の need 個以上なら「すくえた」。
     足りないと箸から つるっと落ちて 下流へ（だいたい そのまま受けざるへ）。
   束の節が need 個すくえないまま受けざるに落ちたら「こぼした」（ミス）。LIVES 回で おしまい。トマトをすくうと ミスが1つ消える。 */
const PH = {
  DT: 1 / 240, S_END: 300, J: [100, 200], ZONE: [252, 286], SC0: 270, R: 5,
  V0: 62, KD: 6.5, KDB: 2.4, GB: 70,                       // 水の速さ（cm/秒）・節の水への引きずられ方・トマトの転がり
  L: 2.6, KS: 260, CS: 4,                                   // ひも（節の間の長さ・ばね・ダンパ）
  TAU_IN: 0.1, WRAP: 0.13, WRAPB: 0.07, TS0: 0.62, TSB: 0.3, SLX: 0.9, WRX: 0.5, LAM0: 4.5, PILE: 0.04, DRAPE: 3.6, KICK: 0.45,
  T_CARRY: 0.45, T_EMPTY: 0.14, LIVES: 3,
  GAP0: 2.6, GAP1: 1.12, GAPK: 22, M1: 0.5, MK: 30, M2: 0.0042,
};
const MILES = [10, 30, 50, 100, 150, 200];
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function rndG(g) { g.rs = (g.rs + 0x6D2B79F5) >>> 0; let t = g.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

const flowMult = k => 1 + PH.M1 * (1 - Math.exp(-k / PH.MK)) + PH.M2 * k;
const gapOf = k => PH.GAP1 + (PH.GAP0 - PH.GAP1) * Math.exp(-k / PH.GAPK);
const segF = s => s < PH.J[0] ? 1.12 : s < PH.J[1] ? 0.86 : 1.0;
const slopeOf = s => s < PH.J[0] ? 0.42 : s < PH.J[1] ? 0.3 : 0.36;
// 箸のせき止めを入れない流速
function waterV0(g, s) {
  let v = g.flow * segF(s);
  for (const j of PH.J) { const d = s - j; if (d > 0 && d < 8) v *= 1 + 0.35 * (1 - d / 8); }
  if (s > 140 && s < 180) v *= 0.93;
  for (const u of g.surges) { const d = (s - u.s) / u.w; if (d > -3 && d < 3) v *= 1 + u.amp * Math.exp(-d * d); }
  return v;
}
function waterV(g, s) {
  let v = waterV0(g, s);
  const C = g.C;
  if (C.act && s < C.s && s > C.s - 14) v *= 1 - 0.3 * Math.exp(-(C.s - s) / 5);
  return v;
}
function makeGame(seed = 1) {
  const g = { seed, rs: (seed ^ 0x9e3779b9) >>> 0, t: 0, flow: PH.V0, spawned: 0, nextT: 0.6, extra: [], nextBall: 6, bid: 0,
    B: [], surges: [], C: { st: 'up', s: PH.SC0, t0: -9, act: false, pend: null, pile: 0, carry: [] },
    score: 0, miss: 0, streak: 0, bestStreak: 0, balls: 0, bowl: 0, fallen: 0, over: false, overT: -1,
    queue: [], events: [], log: null, lifts: 0 };
  g.nextBall = 7 + Math.floor(rndG(g) * 5);
  return g;
}
function addBundle(g, kind, k) {
  const r = () => rndG(g), b = { id: ++g.bid, k, kind, res: null, nodes: [], snag: null, t0: g.t };
  if (kind === 'ball') { b.n = 1; b.need = 1; b.L = 1; b.ks = 0; b.fruit = r() < 0.5 ? 'tomato' : 'cherry'; }
  else if (kind === 'spread') { b.n = 7; b.need = 3; b.L = 5.5; b.ks = 70; }
  else if (kind === 'fast') { b.n = 5; b.need = 3; b.L = 2.2; b.ks = 300; }
  else { b.n = 6; b.need = 3; b.L = PH.L; b.ks = PH.KS; }
  const s0 = -4;
  for (let i = 0; i < b.n; i++) {
    const sp = kind === 'spread' ? 4.5 + r() * 3.5 : b.L * (0.85 + r() * 0.3);
    const kd = kind === 'ball' ? PH.KDB : kind === 'spread' ? 3 + r() * 6 : PH.KD * (0.85 + r() * 0.3);
    b.nodes.push({ s: s0 - i * sp, v: g.flow * 0.9, kd, st: 0, tc: 0, dn: false, gap: 0.35 + r() * 0.9, u: (r() - 0.5) * (kind === 'spread' ? 1.3 : 0.8), pi: 0, tf: 0, sF: 0 });
  }
  if (kind === 'fast') { g.surges.push({ s: s0 - 3, w: 16, amp: 0.5 }); for (const n of b.nodes) n.v *= 1.4; }
  g.B.push(b);
  g.events.push({ type: 'spawn', kind, id: b.id, fruit: b.fruit });
  return b;
}
function spawn(g) {
  const k = g.spawned++, r = () => rndG(g);
  g.flow = PH.V0 * flowMult(k);
  const kind = g.nextKind || 'n';
  const b = addBundle(g, kind, k);
  const pFast = k < 3 ? 0 : Math.min(0.3, 0.03 + 0.005 * k), pSpread = k < 5 ? 0 : Math.min(0.28, 0.03 + 0.004 * k), pDouble = k < 10 ? 0 : Math.min(0.24, (k - 10) * 0.006), pSnag = k < 6 ? 0 : Math.min(0.3, 0.05 + 0.004 * k);
  let gap = gapOf(k) * (0.85 + 0.3 * r());
  if (kind !== 'fast' && r() < pSnag) { b.snag = { s: PH.J[r() < 0.5 ? 0 : 1] + 0.6, dur: 0.5 + r() * 0.9, t0: -1, done: false }; gap += b.snag.dur * 0.9; }
  if (r() < pDouble) { const d = 0.04 + r() * 0.1; g.extra.push({ t: g.t + d, kind: 'n' }); gap += d * 0.8; }
  if (k >= g.nextBall) { g.extra.push({ t: g.t + gap * 0.55, kind: 'ball' }); g.nextBall = k + 9 + Math.floor(r() * 6); }
  // つぎの束の種類（速い束は 追いついてしまうので そのぶん あとから流す）
  const x = r(); g.nextKind = x < pFast ? 'fast' : x < pFast + pSpread ? 'spread' : 'n';
  if (g.nextKind === 'fast') gap += 0.3 * PH.S_END / g.flow;

}
// 入力: 時刻つき。kind = 'down'（箸を入れる。s は樋の位置 cm）/ 'up'（持ち上げる）
function gInput(g, t, kind, s = PH.SC0) { const e = { t, kind, s }; if (g.log) g.log.push(e); const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, e); }

  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ「押した・離した」の時刻と位置の列を、いろいろなコマ割りで物理に流して、結果がそろうか（quant = 時刻を使わずコマの時刻で入れた場合のくらべ）
  const replay = (log, seedR, fps, quant = false, maxN = 400) => {
    const g = makeGame(seedR), L = log.slice().sort((a, b) => a.t - b.t); let i = 0, tNow = 0;
    while (!g.over && tNow < 1500 && g.score < maxN) {
      tNow += 1 / fps;
      while (i < L.length && L[i].t <= tNow) { gInput(g, Math.max(g.t, quant ? tNow - LAG : L[i].t), L[i].kind, L[i].s); i++; }
      while (g.t + PH.DT <= tNow - LAG && !g.over) { stepGame(g); g.events.length = 0; }
    }
    return { n: g.score, miss: g.miss, t: r3(g.t), lifts: g.lifts };
  };
  const rect = id => { const el = $(id); if (!el || el.closest('[hidden]') || el.hidden) return null; const r = el.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2), w: Math.round(r.width), h: Math.round(r.height) }; };
  const scr = (s, u = 0, h = 0) => { const p = projS(s, u, h); return { x: Math.round(p.x), y: Math.round(p.y) }; };
  const scrW = v => { const p = projectW(v); return { x: Math.round(p.x), y: Math.round(p.y) }; };
  const wallMs = tg => Math.round((tg - (performance.now() / 1000 - base)) * 1000);
  const ui = () => ({
    state, start: rect('startBtn'), retry: rect('retryBtn'), copy: rect('copyBtn'), x: rect('xBtn'), hub: rect('hubBack'), best: rect('hud'),
    // 箸を入れられる所（ZONE: 上の端・まん中・下の端）。画面のどこを押してもよいが、押した高さで入れる位置がこの範囲で変わる
    trough: { zoneTop: scr(PH.ZONE[0]), zoneMid: scr(PH.SC0), zoneBottom: scr(PH.ZONE[1]), start: scr(0), joint1: scr(PH.J[0]), joint2: scr(PH.J[1]), end: scr(PH.S_END) },
    stickTip: game ? scrW(stickTip(game, new THREE.Vector3())) : null, bowl: scrW(bowlPos), colander: scrW(colPos), family: family.map(f => scrW(f.G.position.clone().setY(f.G.position.y + f.hd.position.y))),
  });
  window.__nagashisomen = {
    info: (opt = {}) => {
      if (!game) return { state };
      const g = game, C = g.C, mid = scr(PH.SC0);
      let next = null;
      if (opt.next !== false && !g.over) {
        if (C.st === 'down') {
          const L = planLift(g);
          next = L ? { action: 'up', x: mid.x, y: mid.y, inMs: wallMs(L.t), windowMs: Math.round((L.t2 - L.t1) * 1000), earliestMs: wallMs(L.t1), latestMs: wallMs(L.t2), bundles: L.sc / 10 | 0 } : { action: 'up', inMs: null, note: 'まだ すくえる束がない（待つ）' };
        } else {
          const P = planDown(g);
          next = P ? { action: 'down', x: mid.x, y: mid.y, inMs: wallMs(P.t), windowMs: Math.max(0, Math.round((P.hi - P.lo) * 1000)), latestMs: wallMs(P.hi), arriveMs: wallMs(P.tA), kind: P.kind } : { action: 'down', inMs: null, note: 'つぎの束がまだ遠い' };
        }
      }
      // 次の束（まだすくっても こぼしてもいない、いちばん下流の束）
      let nb = null; for (const b of g.B) if (!b.res && (!nb || b.nodes[0].s > nb.nodes[0].s)) nb = b;
      return {
        state, t: r3(g.t), score: g.score, miss: g.miss, lives: PH.LIVES, streak: g.streak, bestStreak: g.bestStreak, balls: g.balls, over: g.over, flow: r2(g.flow), spawned: g.spawned,
        stick: { st: C.st, s: r2(C.s), active: C.act, pending: !!C.pend, screen: scrW(stickTip(g, new THREE.Vector3())) },
        nextBundle: nb ? { id: nb.id, kind: nb.kind, n: nb.n, need: nb.need, head: r2(nb.nodes[0].s), tail: r2(nb.nodes[nb.n - 1].s), speed: r2(nb.nodes[0].v), snag: nb.snag ? { s: nb.snag.s, active: nb.snag.t0 >= 0 && !nb.snag.done } : null, screen: scr(clamp(nb.nodes[0].s, -10, PH.S_END)) } : null,
        lift: liftSet(g).map(r => ({ id: r.b.id, kind: r.b.kind, got: r.idx.length, wrapped: r.wrapped, need: r.b.need, ok: r.ok })),
        // つぎの操作の目安: action='down' なら (x, y) を inMs 後に押す（latestMs までに押せば間に合う。windowMs = 押してよい幅）。
        // action='up' なら inMs 後に離す（earliestMs〜latestMs の間に離せば すくえる）
        next, bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, queue: g.queue.length, lag: LAG,
      };
    },
    ui,
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [すくい数...]（'first' / 'casual' / 'good' / 'pro' / 'mash'（0.25秒入れて0.25秒上げるの連打）/ 'mashLong' / 'hold'（入れっぱなし））
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(typeof skill === 'string' ? SKILLS[skill] : skill, (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const sk = typeof skill === 'string' ? SKILLS[skill] : skill;
      const R = Array.from({ length: N }, (_, i) => runBot(sk, (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n);
      return { skill: typeof skill === 'string' ? skill : 'custom', N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge3: R.filter(r => r.n >= 3).length / N, ge10: R.filter(r => r.n >= 10).length / N, ge60: R.filter(r => r.n >= 60).length / N, ge100: R.filter(r => r.n >= 100).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), streakP50: q(R.map(r => r.streak), 0.5), secPerPlay: +(R.reduce((a, r) => a + r.t, 0) / N).toFixed(1) };
    },
    // 一定連打のいろいろな組み合わせ（間隔・入れている割合）で: いちばん伸びる組み合わせ
    mashGrid: (N = 30) => { const out = []; for (const period of [0.3, 0.5, 0.7, 0.9, 1.2, 1.6]) for (const f of [0.3, 0.5, 0.7, 0.85]) { const n = Array.from({ length: N }, (_, i) => runBot({ mash: true, period, down: period * f }, 3000 + i).n); out.push({ period, f, p50: q(n, 0.5), mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(2), max: Math.max(...n) }); } return out.sort((a, b) => b.mean - a.mean).slice(0, 5); },
    // ボットの入力の列（時刻・位置つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす
    fpsCheck: (skill = 'good', seedR = 4242, maxN = 400) => {
      const r = runBot(SKILLS[skill], seedR, { log: true, maxN });
      return { live: { n: r.n, t: r3(r.t), lifts: r.lifts }, fps13: replay(r.log, seedR, 13, false, maxN), fps30: replay(r.log, seedR, 30, false, maxN), fps60: replay(r.log, seedR, 60, false, maxN), fps144: replay(r.log, seedR, 144, false, maxN), fps30frameQuantized: replay(r.log, seedR, 30, true, maxN), fps60frameQuantized: replay(r.log, seedR, 60, true, maxN), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { if (game.C.st === 'down') gInput(game, game.t, 'up'); bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; ptrId = null; keyHeld = false; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    screen: (s, u = 0, h = 0) => scr(s, u, h),
    toS: sy => screenToS(sy),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, planLift, planDown, liftSet, game: () => game,
  };
}
