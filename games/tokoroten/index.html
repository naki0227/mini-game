<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try { THREE = await import(THREE_URL); } catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- ところてんの物理（three には頼らない） ----------
   長さは m、時間は秒。y が上。縁台の板の上面が y = 0。自分は +z 側に座り、奥（−z）へ向けて天突きを持つ。
   天突き（木の筒）の口は (0, MY, 0)。筒は 仰角 EL で少し上向き、向き yaw（右が +）で口を中心に左右へ回る。
   ところてんの束: 細い紐 NS 本（2×2）。1本は NN 個の質点を「のび」「曲げ」のばねでつないだ鎖（XPBD）。
     となりの紐どうしも 弱いばねでつなぎ、束としてまとまる（ばらけすぎない）。曲げのばねで ぷるぷる揺れる。
   突く: 押し棒の速さ v で 束が口から押し出される。筒の中にある質点は 筒にそって動く（動かせない点）。口を出た点から自由になる。
     弱いと出たところから垂れて手前に落ち、強いと 器を越える。
   器: 回転体（内側の形を 断面の折れ線で持つ）。質点は 折れ線との距離で押し返され（厚み w）、ふち（折れ線の端）にも かかる。
     つるつる（摩擦 MU_B）。お盆にのった器は 横へゆっくり動く（往復）。縁台（板）の外へ出たら 地面（FLOOR）まで落ちる。
   判定: 束が落ち着いたら（どの点もほとんど動かない）、器の中にある点の割合が IN_OK 以上なら 1杯。それ以外はミス。
   1/1000 秒きざみ。入力は時刻つき（画面のコマには よらない）。 */
const DEGP = Math.PI / 180;
const PH = {
  G: 9.8, DT: 1 / 1000, IT: 2,
  NS: 4, NN: 12, SEG: 0.015, CS: 0.0035, PR: 0.004,
  A_ST: 1e-8, A_BEND: 3e-5, A_X: 4e-7, DAMP: 1.0,
  MY: 0.32, EL: 32 * DEGP,
  V0: 0.35, KV: 5.6, A_MIN: 0.03, A_MAX: 0.62, KY: 2.4, YAW_MAX: 0.75, T_RAMP: 0.03,
  MU_B: 0.35, MU_T: 0.7, MU_F: 0.9,
  BX: 0.66, BZ0: -0.98, BZ1: 0.45, FLOOR: -0.42, TRAY_H: 0.014, TRAY_M: 0.035,
  READY_T: 0.9, SERVE_T: 0.85, IDLE_T: 15, IDLE_V: 0.3,
  SETTLE_V: 0.06, SETTLE_T: 0.22, JUDGE_MAX: 4.5, IN_OK: 0.75,
};
// 器の形: 内側の断面（中心からの距離 ρ, 器の底面からの高さ）を 底の中心 → ふち の折れ線で
const BOWLS = {
  sara: { name: '大皿', seg: 0.015, prof: [[0, 0.007], [0.085, 0.009], [0.122, 0.021], [0.14, 0.03]], w: 0.004 },
  hachi: { name: 'ガラス鉢', seg: 0.013, prof: [[0, 0.008], [0.045, 0.009], [0.08, 0.03], [0.098, 0.058]], w: 0.004 },
  kobachi: { name: '小鉢', seg: 0.0105, prof: [[0, 0.008], [0.032, 0.009], [0.057, 0.03], [0.07, 0.05]], w: 0.004 },
  choko: { name: 'そばちょこ', seg: 0.0085, prof: [[0, 0.01], [0.036, 0.01], [0.044, 0.066]], w: 0.004 },
};
for (const k in BOWLS) { const B = BOWLS[k], p = B.prof; B.key = k; B.rimR = p[p.length - 1][0]; B.rimY = p[p.length - 1][1]; B.botY = p[0][1]; }
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function gaussP(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
// 何杯目か による難しさ: 器の種類・遠さ・横のずれ・動く器。上限は決めず、ゆっくり上がりつづける
function diffOf(n) {
  const k = 1 - Math.exp(-n / 16);
  return {
    w: { sara: n < 2 ? 1 : 2.2 * Math.exp(-n / 4), hachi: n < 2 ? 0 : 1, kobachi: n < 4 ? 0 : 1.1 * (1 - Math.exp(-(n - 3) / 9)), choko: n < 10 ? 0 : 0.75 * (1 - Math.exp(-(n - 9) / 25)) },
    d0: 0.38 + 0.28 * k + 0.0012 * n, dSp: n === 0 ? 0 : 0.06 + 0.12 * k,
    side: n === 0 ? 0 : 0.03 + 0.14 * k,
    pMove: n < 4 ? 0 : 0.15 + 0.33 * k, mv: 0.04 + 0.07 * k + 0.0005 * n,
  };
}
function pickBowl(g, n) {
  const d = diffOf(n), r = g.rnd;
  let tot = 0; for (const k in d.w) tot += d.w[k];
  let u = r() * tot, kind = 'sara';
  for (const k in d.w) { if (u < d.w[k]) { kind = k; break; } u -= d.w[k]; }
  const T = BOWLS[kind];
  const dist = clampP(d.d0 + (r() * 2 - 1) * d.dSp, 0.32, 0.93 - T.rimR);
  const x = clampP((r() * 2 - 1) * d.side, -0.21, 0.21);
  const move = r() < d.pMove;
  const xm = 0.21;
  return { kind, T, x0: move ? clampP(x, -xm, xm) : x, z: -Math.sqrt(Math.max(0.01, dist * dist - x * x)), vx: move ? (r() < 0.5 ? -1 : 1) * d.mv : 0, xm, t0: g.t, y: move ? PH.TRAY_H : 0, tray: move };
}
// 往復する器の横の位置と速さ
function bowlX(B, t) {
  if (!B.vx) return B.x0;
  const L = 2 * B.xm, P = 2 * L;
  let s = (B.x0 + B.xm) + B.vx * (t - B.t0); s = ((s % P) + P) % P;
  return (s <= L ? s : P - s) - B.xm;
}
function bowlVX(B, t) {
  if (!B.vx) return 0;
  const L = 2 * B.xm, P = 2 * L;
  let s = (B.x0 + B.xm) + B.vx * (t - B.t0); s = ((s % P) + P) % P;
  return s <= L ? B.vx : -B.vx;
}
// 入力 → 押す速さ・向き
const vOf = a => PH.V0 + PH.KV * (clampP(a, PH.A_MIN, PH.A_MAX) - PH.A_MIN);
const aOf = v => PH.A_MIN + (v - PH.V0) / PH.KV;
const yawOf = b => clampP(b * PH.KY, -PH.YAW_MAX, PH.YAW_MAX);
// 筒の向き（d: 筒の向き、u: 右、w: 上）
function tubeFrame(yaw) {
  const cE = Math.cos(PH.EL), sE = Math.sin(PH.EL), cY = Math.cos(yaw), sY = Math.sin(yaw);
  return { dx: sY * cE, dy: sE, dz: -cY * cE, ux: cY, uy: 0, uz: sY, wx: -sY * sE, wy: cE, wz: cY * sE };
}
const SOFF = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
// 拘束（のび・曲げ・となりの紐）
const CONS = (() => {
  const NN = PH.NN, L = [];
  for (let s = 0; s < PH.NS; s++) for (let k = 0; k + 1 < NN; k++) L.push([s * NN + k, s * NN + k + 1, -1, PH.A_ST]);
  for (let k = 0; k < NN; k++) {
    const c = 2 * PH.CS;
    for (const [a, b, r] of [[0, 1, c], [2, 3, c], [0, 2, c], [1, 3, c], [0, 3, c * Math.SQRT2], [1, 2, c * Math.SQRT2]]) L.push([a * NN + k, b * NN + k, r, PH.A_X]);
  }
  return { I: Int16Array.from(L.map(c => c[0])), J: Int16Array.from(L.map(c => c[1])), R: Float64Array.from(L.map(c => c[2])), A: Float64Array.from(L.map(c => c[3])) };
})();
function gInput(g, t, type, a = 0, b = 0) { const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, { t, type, a, b }); }
function makeChain() {
  const N = PH.NS * PH.NN;
  return { x: new Float64Array(N), y: new Float64Array(N), z: new Float64Array(N), px: new Float64Array(N), py: new Float64Array(N), pz: new Float64Array(N), kin: new Uint8Array(N), con: new Uint8Array(N), ever: new Uint8Array(N) };
}
function makeGame(seed = 1, opts = {}) {
  const g = {
    seed, rnd: mulberry((seed * 2654435761) >>> 0), t: 0, queue: [], events: [], phase: 'ready', pt: 0, n: 0, fail: null, failSub: null,
    c: makeChain(), v: 0, yaw: 0, F: tubeFrame(0), tp: 0, feed: 0, calm: 0, bowl: null, idle: false, noCol: !!opts.noCol,
    first: null, last: null, inFrac: 0, served: [],

      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = 0.5;
      master = ac.createDynamicsCompressor(); master.threshold.value = -16; master.ratio.value = 5;
      master.connect(lp).connect(ac.destination);
      // 低めのノイズ（高い成分を落としてある）
      const len = ac.sampleRate * 1.5; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); let b = 0, b2 = 0;
      for (let i = 0; i < len; i++) { b = b * 0.82 + (Math.random() * 2 - 1) * 0.18; b2 = b2 * 0.5 + b * 0.5; d[i] = b2 * 2.6; }
    }

  } catch {}
}
const live = () => ac && state === 'play';
function tone(freq, at, dur, vol, type = 'sine', f1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at); if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
  return o;
}
function noise(at, dur, vol, type, freq, q = 1, lpF = 1000, att = 0.004) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpF;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + att); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(lp).connect(g).connect(master); s.start(at, Math.random() * 0.6); s.stop(at + dur + 0.05);
  return f;
}
// 突く「にゅっ」: こもった こすれ音が 下がる＋低いサイン
function sPush(v = 1.5) { try { if (!live()) return; const n0 = ac.currentTime, d = clamp(0.22 / Math.max(0.6, v), 0.07, 0.3); const f = noise(n0, d + 0.06, 0.14, 'bandpass', 360, 1.6, 700, 0.02); f.frequency.exponentialRampToValueAtTime(170, n0 + d); tone(190, n0, d + 0.04, 0.07, 'sine', 120); } catch {} }
// 押し切った「ぽこっ」: 木の筒の 低い音
function sPoko() { try { if (!live()) return; const n0 = ac.currentTime; tone(260, n0, 0.11, 0.13, 'sine', 150); tone(390, n0, 0.05, 0.03, 'triangle', 300); noise(n0, 0.05, 0.05, 'lowpass', 400, 0.7, 500); } catch {} }
// 器に落ちる「ぷるん」: 低いサインが ゆれながら下がる
function sPurun(k = 0.6) {
  try {
    if (!live()) return; const n0 = ac.currentTime, f0 = 240;
    const o = tone(f0, n0, 0.34, 0.16 * (0.5 + k * 0.5), 'sine', f0 * 0.6);
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 11; lg.gain.value = f0 * 0.09;
    lfo.connect(lg).connect(o.frequency); lfo.start(n0); lfo.stop(n0 + 0.38);
    noise(n0, 0.05, 0.05, 'lowpass', 300, 0.7, 450);
  } catch {}
}
// 盛れた「ちゃぷ」: 酢醤油の小さな水音（低め）
function sChapu() { try { if (!live()) return; const n0 = ac.currentTime + 0.04; const f = noise(n0, 0.16, 0.08, 'bandpass', 520, 2, 900, 0.01); f.frequency.exponentialRampToValueAtTime(300, n0 + 0.14); tone(420, n0 + 0.02, 0.09, 0.035, 'sine', 300); } catch {} }
// 板や地面に落ちる「べちゃ」
function sBecha(k = 1) { try { if (!live()) return; const n0 = ac.currentTime; noise(n0, 0.24, 0.22 * k, 'lowpass', 380, 0.6, 450, 0.006); tone(100, n0, 0.18, 0.15 * k, 'sine', 55); } catch {} }
function sChime(big) { try { if (!live()) return; const n0 = ac.currentTime + 0.1; const seq = big ? [[392, 0], [523, 0.1], [659, 0.2], [784, 0.32]] : [[392, 0], [523, 0.1], [659, 0.2]]; seq.forEach(([f, t]) => tone(f, n0 + t, 0.45, 0.045)); } catch {} }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  step(dt);
  render(Math.max(dt, 1 / 240));
  requestAnimationFrame(frame);
}

/* ---------- 入力: 画面を押して 下へ引き、はなす。引いた長さ＝強さ、横ずれ＝向き（はなした位置で決まる。引く速さは関係ない）。離した時刻で物理へ ---------- */
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(nextSeed(), bn); frozen = false; setMileLevel(0); keyYaw = null;
  for (const l of lanterns) l.on = 0;
  updateHud();
  // #debug&skip=秒: その秒数だけ一気に進め、突いたところてんが器へ飛んでいく途中（at 秒め）で止める（OGP 撮影・確認用。bot=good と組み合わせる。freeze=1 で止めたまま）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'fly');
  if (HASH.has('debug') && HASH.get('ff') === '1') ff = true;
}
function skipTo(t1, pose = 'none') {
  const quiet = state; state = 'skip';
  const lim = t1 + 60, at = +(HASH.get('at') || 0.22);
  let armed = false;
  while (game.phase !== 'over' && game.t < lim) {
    if (game.t >= t1) {
      if (pose !== 'fly') break;
      const fl = (game.phase === 'push' || game.phase === 'fly') ? game.t - game.tp : -1;
      if (fl < 0 || fl < at - 0.02) armed = true;
      if (armed && fl >= at) break;
    }
    if (bot) bot.step(); stepGame(game);
    if (game.events.length) handleEvents();
  }
  state = quiet;
  pops = []; label = null; failAt = game.phase === 'over' ? tt : -1; shake = 0; serveFx = null;
  setMileLevel(MILES.filter(m => m <= game.n).length);
  for (const l of lanterns) l.on = l.want;
  for (const f of fireflies) f.on = f.want || 0;
  base = performance.now() / 1000 - game.t;
  if (HASH.get('freeze') === '1') frozen = true;
}
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game) return;
  if (game.phase === 'over') { if (failAt >= 0 && tt - failAt > 0.4) showOver(); return; }
  if (bot) return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  kb = null;
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY };
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY;
});
addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const D = drag; drag = null;
  if (state !== 'play' || !game || bot) return;
  // はなした位置で決まる: 押したところから 下へ動いた長さ と 横ずれ
  const a = (e.clientY - D.y0) / H, b = (e.clientX - D.x0) / H;
  if (a < PH.A_MIN) { if (game.phase === 'aim' || game.phase === 'ready') { hintT = tt; hintMsg = a < -0.02 ? '上へではなく 下へ引いて はなす' : '上から下へ 引いて はなす'; } return; }
  keyYaw = null;
  input('push', evTime(e), a, b);
});
addEventListener('pointercancel', () => { drag = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: スペース長押しで強さ（長いほど強い）、←→ で向き、はなして突く
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (!game) return;
    if (game.phase === 'over') { if ((c === 'Space' || c === 'Enter') && !e.repeat && failAt >= 0 && tt - failAt > 0.4) { e.preventDefault(); showOver(); } return; }
    if (bot) return;
    if (c === 'ArrowLeft' || c === 'KeyA' || c === 'ArrowRight' || c === 'KeyD') {
      e.preventDefault(); wakeAudio();
      const s = c === 'ArrowLeft' || c === 'KeyA' ? -1 : 1;
      keyYaw = clamp((keyYaw ?? viewYaw()) + s * 1.5 * DEG, -PH.YAW_MAX, PH.YAW_MAX);
      return;
    }
    if (c === 'Space' || c === 'ArrowDown' || c === 'KeyS' || c === 'Enter') {
      e.preventDefault(); if (e.repeat) return; wakeAudio();
      if (keyYaw == null) keyYaw = viewYaw();
      kb = { down: evTime(e) }; drag = null;
      return;
    }
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('keyup', e => {
  const c = e.code;

addEventListener('blur', () => { drag = null; kb = null; });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last, lastNoren)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };

});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ入力（時刻つき）の列を、fps コマ割りで物理に流しなおす（入力はそのコマで届くが、物理はその時刻で効く）
  const replay = (log, seedR, fps) => {
    const g = makeGame(seedR); let i = 0, tNow = 0;
    while (g.phase !== 'over' && tNow < 3000) {
      tNow += 1 / fps;
      while (i < log.length && log[i].t <= tNow) { gInput(g, Math.max(g.t, log[i].t + PH.DT * 0.5), log[i].type, log[i].a, log[i].b); i++; }
      while (g.t + PH.DT <= tNow) { stepGame(g); g.events.length = 0; }
    }

  };
  const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;
  const scr = (x, y, z) => { const p = project(x, y, z); return { x: Math.round(p.x), y: Math.round(p.y) }; };
  // ちょうどいい突き方: from を押して to まで引いて離す（いまの時刻に離したとき。動く器は 着くころの位置で）
  const aimNow = (fromY = 0.3) => {
    const g = game; if (!g || (g.phase !== 'aim' && g.phase !== 'ready')) return null;
    const id = idealFor(g, g.t), from = { x: Math.round(W / 2), y: Math.round(H * fromY) };
    return { a: r3(id.a), b: r3(id.b), v: r2(id.v), yawDeg: r2(id.yaw / DEG), flight: r2(id.tc), from, to: { x: Math.round(from.x + id.b * H), y: Math.round(from.y + id.a * H) }, ready: g.phase === 'aim' };
  };
  window.__tokoroten = {
    info: () => {
      if (!game) return null;
      const g = game, B = g.bowl, m = comOf(g.c), bx = bowlX(B, g.t);
      return {
        state, phase: g.phase, t: r3(g.t), pt: r2(g.pt), n: g.n, fail: g.fail, sub: g.failSub, idle: g.phase === 'aim' ? r2(PH.IDLE_T - g.pt) : null,
        bowl: { kind: B.kind, name: B.T.name, x: r3(bx), z: r3(B.z), dist: r3(Math.hypot(bx, B.z)), rimR: B.T.rimR, depth: r3(B.T.rimY - B.T.botY), vx: r3(bowlVX(B, g.t)), tray: B.tray },
        aim: aimNow(),
        push: g.phase === 'push' || g.phase === 'fly' ? { v: r2(g.v), yawDeg: r2(g.yaw / DEG), since: r3(g.t - g.tp) } : null,
        com: { x: r3(m.x), y: r3(m.y), z: r3(m.z) }, last: g.last && { ...g.last, frac: r2(g.last.frac), along: r3(g.last.along), side: r3(g.last.side) },
        bowlScreen: scr(bx, B.y + B.T.rimY, B.z), mouthScreen: scr(0, PH.MY, 0), noodleScreen: scr(m.x, m.y, m.z),
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, queue: g.queue.length,
      };
    },
    aim: aimNow,
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [杯数...]
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, { ...opts, rounds: true })), n = R.map(r => r.n);
      const kinds = {}, bowls = {};
      for (const r of R) { const k = r.fail + (r.sub ? ':' + r.sub : ''); kinds[k] = (kinds[k] || 0) + 1; for (const x of r.rounds) { const b = bowls[x.kind] ||= [0, 0]; b[0]++; if (x.ok) b[1]++; } }
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge1: R.filter(r => r.n >= 1).length / N, ge3: R.filter(r => r.n >= 3).length / N, ge10: R.filter(r => r.n >= 10).length / N, ge30: R.filter(r => r.n >= 30).length / N, ge80: R.filter(r => r.n >= 80).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), kinds, bowls: Object.fromEntries(Object.entries(bowls).map(([k, [a, b]]) => [k, `${b}/${a}`])) };
    },
    // ボットの入力の列を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（結果がそろうか）
    fpsCheck: (skill = 'first', seedR = 4242) => { const r = runBot(SKILLS[skill], seedR, { log: true }); return { live: { n: r.n, fail: r.fail, t: +r.t.toFixed(3) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), inputs: r.log.length }; },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）
    screen: (x, y, z) => scr(x, y, z),
    bowlScreen: () => { const B = game.bowl; return scr(bowlX(B, game.t), B.y + B.T.rimY, B.z); },
    mouthScreen: () => scr(0, PH.MY, 0),
    noodleScreen: () => { const m = comOf(game.c); return scr(m.x, m.y, m.z); },
    tapPoint: () => ({ x: Math.round(W / 2), y: Math.round(H * 0.3) }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, BOWLS, SKILLS, makeGame, runBot, stepGame, gInput, diffOf, idealFor, vOf, aOf, yawOf, game: () => game,
  };
}
