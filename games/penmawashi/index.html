<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- ペン回しの物理（three には頼らない。単位は m・秒・rad。判定は全部この結果から） ----------
   ペン: 長さ L・半径 PR の一様な棒（重心 = まんなか）。中指の付け根あたりの1点（支点 P）にのって、手の甲に沿った面
     （手前が少し低く傾いた面。傾き BETA）の中で回る。θ = 弾いた位置からの回転角。2π で親指のところへ戻る。
   ずれ e: 支点からペンの重心までの距離（ペンの軸に沿って）。e があると
     ・慣性モーメント I = m(L²/12 + e²) が増える（同じ力で弾いても回りにくい）
     ・重心が面の傾きを上り下りするので、重力で加速・減速する（e の符号で、どこで遅くなるかが変わる）。
   弾く: 押している時間 h（親指をためる）→ 角運動量（ω0·I0）。同じ h でも、ずれ e が大きいほど回りにくい。
   回る: 指とのすべり摩擦（一定の減速＋速さに比例する減速）と重力。止まったら指からこぼれて落ちる。
   受ける: 押すと親指が T_CLOSE 秒で閉じて、2π のところに親指の腹（かべ）ができる。
     親指の腹は ばね＋ダンパ。閉じたばかりの親指はやわらかく（力を抜いて受ける）、構えたままだと
     だんだん固くなって、よくはねる。ペンがはね返って受けのくぼみ（2π − MOUTH）より後ろへ戻ったら落ちる。
     押し込みすぎて 2π + OFF をこえたら、親指をこえて落ちる。
     親指が閉じきったとき、ペンがもう 2π を通りすぎていたら、上からはさむ（強い摩擦で止める）。止まりきらなければ落ちる。
     親指が入っていて、ペンが受けのところでほぼ止まったら成功（1回）。やさしさ = はね返りの小ささ。
     受けた衝撃（強く当たるほど）と、続けるほど増える手のゆれで、ペンは軸の向きにすべる（e が動く。見える）。
     やさしく受けると、親指で持ち直して e が少し戻る。|e| が E_MAX をこえたら指からこぼれる。
   落ちる: そこからは両端2点の剛体棒（Verlet）。手（丸いうね）と机・ノートに当たって、はねて、転がる。
   （「± 何 ms なら成功」のような判定はない。成功・失敗は全部この積分の結果） */
const PDEG = Math.PI / 180, TAU = 2 * Math.PI;
const PH = {
  DT: 1 / 600, G: 9.81,
  L: 0.145, PR: 0.0045,           // ペンの長さ・半径
  BETA: 5 * PDEG,                 // 回る面の傾き（奥が少し高い）
  E0: 0.0, E_MAX: 0.03,         // ずれのはじめと、こぼれるずれ
  MU: 3.4, MU_POCKET: 9.5,          // すべり摩擦の減速 rad/s²（ふつう / 受けのくぼみ＝親指と人差し指のあいだ）
  CV: 0.12,                       // 速さに比例する減速 1/s（空気・指の皮膚）
  EDGE: 5,                        // 親指の向こうへ傾いたら転げ落ちる
  W_TAP: 5.8, W_GAIN: 7.5, HOLD_MAX: 0.9,   // 弾く: ω0 = W_TAP + W_GAIN·h rad/s（ずれ 0 のとき。h は押していた秒）
  H_THRU: 0.15,                   // 押したまま受けたとき、これより短くはなしても弾かない
  MOUTH: 0.5,                     // 受けのくぼみ（2π − MOUTH 〜 2π。ここより手前で止まる・戻ると落ちる）
  T_CLOSE: 0.045,                 // 押してから親指が閉じきるまで
  T_SOFT: 0.08, T_TENSE: 0.12, T_RIGID: 0.3,   // 閉じてからやわらかい時間 / 固くなるまで / さらにこわばるまで
  K_SOFT: 260, C_SOFT: 28, K_HARD: 2600, C_HARD: 30, K_RIGID: 5200, C_RIGID: 10,
  PINCH: 80,                      // 通りすぎてから閉じたとき、上からはさむ摩擦の減速
  OFF: 0.45,                      // 2π + OFF をこえたら親指をこえて落ちる
  CAP_W: 0.6, CAP_T: 0.05,        // これより遅い状態が CAP_T 秒続いたら「受けた」
  // 続けるほど少しずつ乱れる
  SE0: 0.0036, SE_N: 25,          // 受けるたびのずれのばらつき（回数 n で 1 + n/SE_N 倍）
  K_HIT: 0.001,                   // 強く当たるほどずれる（m / (rad/s)）
  RECENTER: 0.6,                  // やさしく受けると親指で持ち直す（やさしさの2乗に比例）
  MU_VAR: 0.03,                   // 指のすべりやすさの毎回のゆらぎ
  // 世界の位置（m）。机の面 y = 0
  P: [0.012, 0.068, -0.02],
  NOTE_H: 0.003,
};
const I_PEN = PH.L * PH.L / 12;
const iRatio = e => I_PEN / (I_PEN + e * e);   // I0 / I
const W0 = h => PH.W_TAP + PH.W_GAIN * Math.min(Math.max(h, 0), PH.HOLD_MAX);
const SB = Math.sin(PH.BETA), CB = Math.cos(PH.BETA);
// 面の中の向き: θ = 0 で左（-x）を向き、手前（+z、低い）→ 右 → 奥（高い）→ 左 と回る
function penDir(th) { const a = th + Math.PI; return [Math.cos(a), Math.sin(a) * SB, -Math.sin(a) * CB]; }
function penTan(th) { const a = th + Math.PI; return [-Math.sin(a), Math.cos(a) * SB, -Math.cos(a) * CB]; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
function rndU(g) { let t = (g.rs = (g.rs + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function rndN(g) { let u = rndU(g); while (u < 1e-9) u = rndU(g); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rndU(g)); }

// 手（落ちたペンが当たるカプセル）: [ax, ay, az, bx, by, bz, r]。見た目の手もこれで作る
const FINGERS = [
  // 人差し指・中指・薬指・小指: 付け根 → 第2関節 → 第1関節 → 指先
  { r: 0.0086, j: [[0.000, 0.047, 0.004], [-0.004, 0.046, -0.036], [-0.006, 0.030, -0.056], [-0.006, 0.012, -0.063]] },
  { r: 0.0090, j: [[0.020, 0.048, 0.000], [0.021, 0.047, -0.044], [0.021, 0.029, -0.066], [0.021, 0.011, -0.073]] },
  { r: 0.0085, j: [[0.039, 0.046, 0.004], [0.041, 0.044, -0.034], [0.042, 0.027, -0.054], [0.042, 0.010, -0.060]] },
  { r: 0.0073, j: [[0.056, 0.042, 0.012], [0.060, 0.039, -0.015], [0.062, 0.025, -0.031], [0.062, 0.009, -0.037]] },
];
// 落ちたペンが当たる手の形は、指どうしのすき間にはさまらないよう、指を横につないだ丸い「うね」にする
// （指の付け根 → 第2関節 → 指先へ下り坂。ペンはその上をすべって机へ落ちる）
const HAND_CAPS = [
  [-0.006, 0.047, 0.003, 0.058, 0.042, 0.012, 0.011],    // 付け根の関節の列
  [-0.008, 0.045, -0.036, 0.062, 0.038, -0.015, 0.0095], // 第2関節の列
  [-0.008, 0.026, -0.058, 0.064, 0.022, -0.033, 0.0085], // 指先の列
];
HAND_CAPS.push([0.004, 0.031, 0.022, 0.052, 0.029, 0.03, 0.02]);       // 手の甲
HAND_CAPS.push([0.012, 0.028, 0.05, 0.05, 0.027, 0.058, 0.021]);       // 手首側
HAND_CAPS.push([0.032, 0.03, 0.075, 0.1, 0.036, 0.3, 0.027]);          // 腕
const surfaceAt = (x, z) => (Math.abs(x + 0.03) < 0.18 && Math.abs(z - 0.0) < 0.125 ? PH.NOTE_H : 0);   // ノート（見開き）

function makeSim(seed = 1) {
  return {
    rs: seed >>> 0, t: 0, phase: 'hold', reason: '', count: 0, quiet: false,
    th: 0, w: 0, e: PH.E0, muK: 1, spinT: 0, capT: 0,
    down: false, pressT: -1, chargeT0: -1, thru: false,
    thumb: { on: false, t0: 0, mode: 0, touched: false, pinch: false, touchT: -1, relV: 0, wMin: 0, pressTh: 0 },   // mode: 0 閉じる途中 / 1 かべ / -1 はさむ / 2 間に合わず
    flick: null, mouthW: null, mouthT: -1, lastCatch: null, maxPen: 0,
    fall: null, events: [],
  };
}
function cloneSim(g) { return { ...g, thumb: { ...g.thumb }, events: [], fall: null }; }

function simPress(g) {
  if (g.down) return;
  g.down = true; g.pressT = g.t;
  if (g.phase === 'hold') { g.chargeT0 = g.t; g.thru = false; g.events.push({ type: 'press' }); }
  else if (g.phase === 'spin') {
    g.chargeT0 = -1;
    const T = g.thumb;
    if (!T.on) { T.on = true; T.t0 = g.t; T.mode = 0; T.pressTh = g.th; g.events.push({ type: 'thumb' }); }
  }
}
function simRelease(g) {
  if (!g.down) return;

function solveThumb() {

    if (T.mode < 0) return '受けるのが少し遅かった。戻ってくる直前にタップすると、やさしく受けられる。';

  $('oMsg').textContent = advice();

  $('oBest').textContent = rec.best; $('oPlays').textContent = rec.plays; $('oTotal').textContent = rec.total;
  $('newRec').hidden = !(isNew && rec.plays > 1 && n > 0);
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({ text: `${shareText(n)}${isNew && rec.plays > 1 && n > 0 ? ' 自己ベスト！' : ''}\n`, url: gameUrl(), hashtags: 'ペン回し' });

}
const live = () => ac && state === 'play';
function setLoops() {
  try {
    if (!ac || !whoosh) return;
    const n0 = ac.currentTime, on = state === 'play' && game && game.phase === 'spin';
    const w = on ? Math.abs(game.w) : 0;
    // 羽根のように2回/回転ずつ空気を切る: 角度で少しゆらす
    const wob = on ? 0.75 + 0.25 * Math.cos(2 * game.th) : 1;
    whoosh.g.gain.setTargetAtTime(clamp(w / 9, 0, 1) * 0.07 * wob, n0, 0.03);
    whoosh.bp.frequency.setTargetAtTime(200 + w * 22, n0, 0.05);
  } catch {}
}
function tone(freq, at, dur, vol, type = 'sine', f1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at); if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + 0.05);
}
function noise(at, dur, vol, type, freq, q = 1) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1200;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(lp).connect(g).connect(master); s.start(at, Math.random()); s.stop(at + dur + 0.05);
}
// 親指で弾く「ぴしっ」（低め）
function sFlick(w) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(w / 10, 0.3, 1); tone(190, n0, 0.05, 0.06 * k, 'triangle', 140); noise(n0, 0.035, 0.05 * k, 'bandpass', 520, 1.4); } catch {} }
// ペンが親指に当たる「こつ」
function sTouch(v, pinch) { try { if (!live()) return; const n0 = ac.currentTime, k = clamp(v / 6, 0.2, 1); tone(pinch ? 200 : 250 + 60 * k, n0, 0.05, 0.05 + 0.07 * k, 'triangle', 170); noise(n0, 0.03, 0.03 + 0.05 * k, 'bandpass', 600, 2); } catch {} }
// やさしく受けた「ぽ」
function sCatch(soft) { try { if (!live()) return; const n0 = ac.currentTime + 0.02; if (soft > 0.72) { tone(392, n0, 0.16, 0.035); tone(587, n0 + 0.05, 0.14, 0.02); } } catch {} }
// こぼれた「すっ」
function sSlip() { try { if (!live()) return; const n0 = ac.currentTime; noise(n0, 0.12, 0.03, 'bandpass', 380, 1); } catch {} }
// 机に落ちた「からん」（低め。何度かはねる）
let lastHitT = 0;
function sHit(v) { try { if (!live()) return; const n0 = ac.currentTime; if (n0 - lastHitT < 0.04) return; lastHitT = n0; const k = clamp(v / 1.4, 0.15, 1); tone(330 + 40 * Math.random(), n0, 0.09, 0.09 * k, 'triangle', 280); tone(470 + 50 * Math.random(), n0 + 0.004, 0.07, 0.045 * k, 'triangle', 420); tone(165, n0, 0.06, 0.05 * k, 'sine'); noise(n0, 0.04, 0.06 * k, 'bandpass', 700, 1.6); } catch {} }
// 目印の回数「ぽん」（1kHz まで）
function sMile(n) { try { if (!live()) return; const n0 = ac.currentTime + 0.08, f = Math.min(880, 440 * Math.pow(1.06, Math.log2(n))); tone(f, n0, 0.3, 0.06); tone(f * 1.5, n0 + 0.07, 0.28, 0.03); } catch {} }
function sChime() { try { if (!live()) return; const n0 = ac.currentTime + 0.12; [[523, 0], [659, 0.1], [784, 0.2]].forEach(([f, t]) => tone(f, n0 + t, 0.45, 0.05)); } catch {} }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  lagS += (clamp(dt * 1.6, 0.04, 0.16) - lagS) * 0.1;
  step(dt, now);
  render(Math.max(dt, 1 / 240));
  setLoops();
  requestAnimationFrame(frame);
}

/* ---------- 入力: 押す・はなす（時刻つきで記録して、物理の時刻で使う） ---------- */
let sessionPlays = 0;
function start() {
  wakeAudio(); state = 'play';
  if (HASH.has('seed')) seed = ((+HASH.get('seed') >>> 0) + 7919 * sessionPlays) >>> 0;   // #seed=N: 何回目のプレイかまで同じなら、同じゆらぎ・同じボット
  sessionPlays++;
  $('title').hidden = true; $('over').hidden = true;
  const b = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  newGame(b);
  // #debug&skip=秒: はじめにその秒数だけ一気に進める（OGP 撮影・確認用。bot=good などと組み合わせる）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'));
}
function skipTo(t1) {
  const quiet = state; state = 'skip';
  while (game.t < t1 && (game.phase === 'hold' || game.phase === 'spin' || game.phase === 'fall')) { if (bot) bot.tick(game); else feed(); simStep(game); handleEvents(); }
  state = quiet;
  inq = []; fxs = []; pops = []; zawa = [];
  t0 = performance.now() - (game.t + lagS) * 1000; camInit = true; thInit = true;
}
const evTime = e => (e.timeStamp > 1e3 && Math.abs(e.timeStamp - performance.now()) < 5000 ? e.timeStamp : performance.now());
const toResult = () => { if (fallAt >= 0 && tt - fallAt > 0.45) showOver(); };
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play') return;
  if (game.phase === 'fall' || game.phase === 'down') { toResult(); return; }
  if (bot || ptrId !== null) return;
  ptrId = e.pointerId;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  if (!kbDown) queue('down', evTime(e));
});
function endPtr(e) {
  if (ptrId === null || e.pointerId !== ptrId) return;
  ptrId = null;
  if (state === 'play' && !bot && !kbDown) queue('up', evTime(e));
}
addEventListener('pointerup', endPtr);
addEventListener('pointercancel', endPtr);
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// キーボード: スペース（Enter）を押して・はなして弾く。回っている間にもう一度押すと受ける
addEventListener('keydown', e => {
  const c = e.code, key = c === 'Space' || c === 'Enter';
  if (state === 'play') {
    if (!key) return;
    e.preventDefault();
    if (game.phase === 'fall' || game.phase === 'down') { if (!e.repeat) toResult(); return; }
    if (bot || e.repeat || kbDown) return;
    wakeAudio(); kbDown = true;
    if (ptrId === null) queue('down', evTime(e));
    return;
  }
  if (!key || state === 'loading') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});
addEventListener('keyup', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (!kbDown) return;
  kbDown = false;
  if (state === 'play' && !bot && ptrId === null) queue('up', evTime(e));
});
addEventListener('blur', () => { if (state === 'play' && game && !bot && (kbDown || ptrId !== null)) { kbDown = false; ptrId = null; queue('up', performance.now()); } });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  window.__penmawashi = {
    info: () => game && ({ state, phase: game.phase, reason: game.reason, t: +game.t.toFixed(3), count: game.count, th: +game.th.toFixed(3), w: +game.w.toFixed(2), e: +game.e.toFixed(4), down: game.down, thumb: { ...game.thumb }, flick: game.flick, mouthW: game.mouthW, lastCatch: game.lastCatch, hintIdeal: +hintIdeal.toFixed(3), lastGoodHold, inq: inq.length, bot: !!bot, rec, seed }),
    // 物理だけで N 回ぶん: sim('first', 100) → [連続回数...]。opts.rate = 押す・はなすが伝わる刻み（Hz。フレームの粗さをまねる）、opts.ceil = いつも遅れる側に
    sim: (skill = 'good', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'good', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n), why = {};
      for (const r of R) why[r.reason] = (why[r.reason] || 0) + 1;
      return { skill, N, rate: (opts.rate || 'exact') + (opts.ceil ? '(遅れ)' : ''), p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge1: R.filter(r => r.n >= 1).length / N, ge3: R.filter(r => r.n >= 3).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), why };
    },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good') => { if (game && (game.phase === 'hold' || game.phase === 'spin')) { bot = makeBot(SKILLS[skill], mulberry(nextSeed())); inq = []; } },
    skip: s => skipTo(game.t + s),
    penScreen: () => project(penC.x, penC.y, penC.z),
    idealHold: (w = 4) => game && idealHold(game, w),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries }),
    PH, SKILLS, makeSim, runBot, makeBot, game: () => game,
  };
}

/* ---------- はじめ ---------- */
// キャンバスに描く字（漢字ふくむ）のぶんのフォントを先に読む
try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789ピタッこつんガツッギリッざわ自己ベスト更新！' + MILES.map(m => m.pop).join('') + Object.values(REASON).join('') + '止まらない回'), document.fonts.load(`700 16px "Zen Kaku Gothic New"`, '回連続ベストペンのずれ目安前回ためてはなすと弾く画面を長押ししてぐるっと戻ってきたらタップで受ける！結果へ')]), new Promise(r => setTimeout(r, 1500))]); } catch {}
resize();
newDemo();
state = 'title';
fillTitle();
$('startBtn').disabled = false; $('startBtn').textContent = 'ペンを持つ';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
