<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- ほうき立ての 物理（three には 頼らない 自前。長さ m・時間 秒・角度 rad） ----------
   場所: 手のひら（支点）は 机の 上の 高さ HY。右が +x、手前（カメラ側）が +z、上が +y。手は 机の 上の 長方形（|x| ≤ XR、|z| ≤ ZR）しか 動けない。
   ほうき = 手のひらの 点を 支点に した 倒立振り子を 前後・左右の 2つの 角度で（tx: 右へ 傾く、tz: 手前へ 傾く）。
     角加速度 = (G·sin θ − a·cos θ) / Le − CD·ω + 風 / Le。a = 手（支点）の 加速度、Le = 振り子の 長さ（ほうきの 慣性 ÷ (質量 × 重心の 高さ)）。
     穂（重い 頭）が 上 なので Le は ほうきの 長さに 近い。長い ほど ゆっくり 倒れ、短い ほど 速い。CD = 手のひらの 摩擦。
     手を 倒れる 方へ 動かすと（a が 同じ 向き）起き上がる。動かしすぎると 反対へ 倒れる。
   手（支点）: 指で きめた 目標 f へ ばねで 追いかける（ω_h、減衰 ζ、加速度・速さの 上限）。疲れると ばねが 弱く なり（反応が 遅れ）、ぷるぷる ふるえる。
     机の 端（範囲）で 手は 止まる。止まった ときの 急な 減速も ほうきに 効く（端に 追い込まれると 支えきれない）。
   乱れ（たねで 決まる 予定表。どれも 予兆 つき）: 窓からの 風（カーテンが 先に 揺れる。穂を 横へ 押す）、
     友達が ぶつかる（近づいて くる → 手が どんと 押される）、くしゃみ（はっ…はっ… → 手が びくっ）。時間と ともに 強く・多く。
   ほうきの 持ち替え: 10・30・60・100 秒で 短い ほうきへ（傾きと 角速度は そのまま 引きつぐ）。
   傾きが THF を こえたら 倒れて おしまい（スコア = その 時刻）。
   入力は すべて 時刻つき（画面の コマには よらない）: down（押した 指の 位置）/ move（指の 位置）/ up / key（矢印の 向き）。
     目標 f = 押した ときの f + (指の 位置 − 押した 位置)（指の 動きは 画面 1px = 1/DPX m）。離すと f は その まま。 */
const PH = {
  DT: 1 / 120, G: 9.8, HY: 1.05,
  XR: 0.32, ZR: 0.2,
  WH0: 16, WH1: 9, ZETA: 0.85, AMAX: 15, VMAX: 2.2,
  CD: 2.0, THF: 0.58, TH_DROP: 1.25,
  TRE0: 0.0012, TRE1: 0.0065, TRE_T: 0.14,
  FAT_T: 150,
  TILT0: 0.014, W0: 0.03,
  KEYV: 0.55,
  T_FAIL: 1.5,
};
const BROOMS = [
  { id: 'take', name: '竹ぼうき', L: 1.7, Le: 1.55, from: 0 },
  { id: 'zashiki', name: '座敷ぼうき', L: 1.4, Le: 1.25, from: 10 },
  { id: 'mijika', name: '短い 座敷ぼうき', L: 1.15, Le: 1.0, from: 30 },
  { id: 'te', name: '手ぼうき', L: 0.92, Le: 0.78, from: 60 },
  { id: 'chibi', name: 'ちびぼうき', L: 0.72, Le: 0.6, from: 100 },
];
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const gaussR = r => (r() + r() + r() + r() - 2) * 1.732;
const smoothP = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const TAU = Math.PI * 2;
const broomIdx = t => { let k = 0; for (let i = 1; i < BROOMS.length; i++) if (t >= BROOMS[i].from) k = i; return k; };
const fatigue = t => Math.min(2.2, t / PH.FAT_T);
// 乱れの 予定表（たねで 決まる）
function makeDist(seed) {
  const R = mulberry((Math.imul(seed ^ 0x51ed27, 0x9e3779b1) + 77) >>> 0), U = (a, b) => a + (b - a) * R();
  const winds = [], hits = [];
  let t = U(7, 9);
  while (t < 600) {
    const k = Math.min(1, t / 140), k2 = Math.max(0, t - 100) / 40;
    const dur = U(1.6, 3.0) + 1.2 * k, side = R() < 0.78 ? 1 : -1, ang = U(-0.45, 0.45);
    const amp = (0.3 + 1.5 * k + 0.9 * k2) * U(0.7, 1.15);
    winds.push({ type: 'wind', tw: t - 1.5, t0: t, t1: t + dur, dx: side * Math.cos(ang), dz: Math.sin(ang), amp, fr: U(0.6, 1.0), ph: U(0, TAU) });
    t += dur + U(3.5, 7.5) * (1 - 0.45 * k) / (1 + 0.5 * k2);
  }
  t = U(15, 19);
  while (t < 600) {
    const k = Math.min(1, t / 140), k2 = Math.max(0, t - 100) / 40, a = U(0, TAU);
    hits.push({ type: 'bump', tw: t - 1.2, t0: t, dx: Math.cos(a), dz: Math.sin(a) * 0.7, amp: (0.2 + 0.32 * k + 0.2 * k2) * U(0.75, 1.15) });
    t += U(9, 15) * (1 - 0.4 * k) / (1 + 0.5 * k2);
  }
  t = U(36, 42);
  while (t < 600) {
    const k = Math.min(1, t / 140), k2 = Math.max(0, t - 100) / 40, sx = U(-0.4, 0.4);
    hits.push({ type: 'sneeze', tw: t - 1.6, t0: t, dx: sx, dz: -1, amp: (0.22 + 0.26 * k + 0.18 * k2) * U(0.8, 1.15) });
    t += U(15, 23) * (1 - 0.4 * k) / (1 + 0.5 * k2);
  }
  hits.sort((a, b) => a.t0 - b.t0);
  for (let i = 1; i < hits.length; i++) if (hits[i].t0 - hits[i - 1].t0 < 1.8) { const d = 1.8 - (hits[i].t0 - hits[i - 1].t0); hits[i].t0 += d; hits[i].tw += d; }
  return { winds, hits };
}
// 風（穂を 押す 加速度 m/s²）
function windAt(D, t, out, wi = 0) {
  out[0] = 0; out[1] = 0;
  const W = D.winds;
  for (let i = wi; i < W.length; i++) {
    const w = W[i]; if (w.t0 > t) break; if (w.t1 < t) continue;
    const k = smoothP((t - w.t0) / 0.5) * smoothP((w.t1 - t) / 0.6) * (1 + 0.28 * Math.sin(TAU * (t - w.t0) / w.fr + w.ph)) * w.amp;
    out[0] += w.dx * k; out[1] += w.dz * k;
  }
  return out;
}
function blankG() {
  return {
    seed: 0, R: null, t: 0, tPrev: 0, phase: 'play', over: false, end: null, endT: 0, phaseEnd: 0, score: 0,
    hx: 0, hz: 0, vx: 0, vz: 0, ax: 0, az: 0, fx: 0, fz: 0, held: 0, ancX: 0, ancZ: 0, p0x: 0, p0y: 0, kx: 0, kz: 0,
    tx: 0, tz: 0, wx: 0, wz: 0, bi: 0, ex: 0, ez: 0, dropped: false, dropT: 0,
    D: null, wI: 0, hI: 0, lastHit: null, edgeT: 0, maxTilt: 0, moves: 0, travel: 0,
    queue: null, events: null, log: null,
  };
}
function makeGame(seed = 1) {
  const g = blankG();
  g.seed = seed; g.R = mulberry(seed); g.queue = []; g.events = [];
  g.D = makeDist(seed);
  const a = g.R() * TAU, m = PH.TILT0 * (0.7 + 0.6 * g.R());
  g.tx = m * Math.cos(a); g.tz = m * Math.sin(a) * 0.8;
  g.wx = PH.W0 * gaussR(g.R) * 0.5; g.wz = PH.W0 * gaussR(g.R) * 0.5;

function keyDir(ms) { let kx = 0, kz = 0; for (const c of keysDown) { kx += KA_[c][0]; kz += KA_[c][1]; } input('key', ms, clamp(kx, -1, 1), clamp(kz, -1, 1)); }
addEventListener('keydown', e => {
  const c = e.code;
  if (!(c in KA_) && c !== 'Space' && c !== 'Enter') return;
  if (state === 'play') {
    e.preventDefault(); if (!game || bot) return;
    if (game.over || game.phase !== 'play') { if (overAt >= 0 && !e.repeat && (c === 'Space' || c === 'Enter')) showOver(); return; }
    wakeAudio();
    if (c in KA_ && !e.repeat && !keysDown.has(c)) { keysDown.add(c); keyDir(evTime(e)); }
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); if (!e.repeat) start();
});
addEventListener('keyup', e => { if (keysDown.delete(e.code) && state === 'play') keyDir(evTime(e)); });
addEventListener('blur', () => { if (keysDown.size) { keysDown.clear(); if (state === 'play') keyDir(performance.now()); } if (holdPtr != null) { holdPtr = null; fxc.classList.remove('drag'); if (game) input('up', performance.now()); } });
$('startBtn').addEventListener('click', () => start());
$('retryBtn').addEventListener('click', () => start());
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ入力（時刻つき）の列を、いろいろなコマ割りで物理に流して、結果がそろうか（quant = 時刻を使わずコマの時刻で入れた場合のくらべ）
  const replay = (log, seedR, fps, quant = false, tEnd = 600) => {
    const g = makeGame(seedR), L = log.slice().sort((a, b) => a.t - b.t); let i = 0, tNow = 0;
    while (!g.over && tNow < tEnd) {
      tNow += 1 / fps;
      while (i < L.length && L[i].t <= tNow) { const tq = quant ? tNow : L[i].t; gInput(g, Math.max(g.t + 1e-6, tq), L[i].kind, L[i].x, L[i].y, tq); i++; }
      while (g.t + PH.DT <= tNow && !g.over) { stepGame(g); g.events.length = 0; }
    }
    return { sec: g.score, end: g.end };
  };
  const rect = id => { const el = $(id); if (!el || el.closest('[hidden]') || el.hidden) return null; const r = el.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2), w: Math.round(r.width), h: Math.round(r.height) }; };
  const scr = (x, y, z) => { const s = project(x, y, z); return { x: Math.round(s.x), y: Math.round(s.y) }; };
  const ui = () => ({ state, W, H, start: rect('startBtn'), retry: rect('retryBtn'), copy: rect('copyBtn'), x: rect('xBtn'), hub: rect('hubBack'), tapAnywhere: { x: Math.round(W / 2), y: Math.round(H * 0.45) }, dragFrom: { x: Math.round(W / 2), y: Math.round(H * 0.72) }, pxPerMeter: dpx, hand: game ? scr(game.hx, PH.HY, game.hz) : null });
  const nowGame = () => performance.now() / 1000 - base;
  const wallMs = tg => Math.round((base + tg) * 1000 - performance.now());   // 物理の時刻 tg に効く入力を送るまでの、いまからのミリ秒
  // つぎの操作の目安（マウスの 座標）。
  //   down: inMs 後に (x, y) を 押す（押した まま 次の move へ）/ move: inMs 後に 指を (x, y) へ 動かす（押した まま）/ up: 離す / wait: いまは 何もしない
  //   （まだ 物理に 入っていない 入力が あるあいだも wait）。windowMs = その 時刻から それだけ ずれても だいたい 大丈夫な 余裕（±）
  const LEAD = 0.06, NEXT = { ts: 0.2, qh: 0.4, windK: 1 };
  const nextOf = g => {
    if (state !== 'play' || g.over) return { action: 'none' };
    if (g.queue.length) { const last = g.queue[g.queue.length - 1]; return { action: 'wait', inMs: Math.max(0, wallMs(last.t)) + 20, why: 'pending', pending: last.kind }; }
    if (g.phase !== 'play') return g.held ? { action: 'up', inMs: 0, x: Math.round(W / 2), y: Math.round(H * 0.72), why: 'fail' } : { action: 'wait', inMs: Math.max(60, wallMs(g.phaseEnd)), why: g.phase };
    if (!g.held) return { action: 'down', inMs: 0, x: Math.round(W / 2), y: Math.round(H * 0.72), windowMs: 300, what: '押す（押した まま 指を 動かす）' };
    const te = Math.max(g.t, nowGame() + LEAD), s0 = predictTo(g, snap(g), te, NEXT.windK, g.t);
    const Le = BROOMS[broomIdx(te)].Le, wh = PH.WH0 + (PH.WH1 - PH.WH0) * Math.min(1, fatigue(te)), K = lqrGain(Le, Math.round(wh * 4) / 4, NEXT.ts, NEXT.qh);
    windSeen(g, te + 0.1, g.t, _w); const ex = -_w[0] / PH.G, ez = -_w[1] / PH.G;
    const ux = clampP(-(K[0] * s0.hx + K[1] * s0.vx + K[2] * (s0.tx - ex) + K[3] * s0.wx), -PH.XR, PH.XR), uz = clampP(-(K[0] * s0.hz + K[1] * s0.vz + K[2] * (s0.tz - ez) + K[3] * s0.wz), -PH.ZR, PH.ZR);
    const x = (g.p0x + ux - g.ancX) * dpx, y = (g.p0y + uz - g.ancZ) * dpx;
    return { action: 'move', x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, inMs: Math.max(0, wallMs(te)), windowMs: 60, target: { x: r3(ux), z: r3(uz) }, what: '押した まま 指を (x, y) へ' };
  };
  window.__houkidate = {
    info: (opt = {}) => {
      if (!game) return { state };
      const g = game, b = BROOMS[g.bi], nb = BROOMS[g.bi + 1], nd = nextDist(g, g.t), tl = Math.hypot(g.tx, g.tz);
      windSeen(g, g.t, g.t, _w);
      return {
        state, t: r3(g.t), phase: g.phase, over: g.over, end: g.end, seconds: g.phase === 'play' ? r1(g.t) : g.score, score: g.score,
        broom: { idx: g.bi, name: b.name, L: b.L, Le: b.Le, nextSwapInS: nb ? r2(nb.from - g.t) : null },
        tilt: { x: r3(g.tx), z: r3(g.tz), deg: r1(tl * 57.3), degX: r1(g.tx * 57.3), degZ: r1(g.tz * 57.3), rateX: r3(g.wx), rateZ: r3(g.wz), limitDeg: r1(PH.THF * 57.3) },
        hand: { x: r3(g.hx), z: r3(g.hz), vx: r2(g.vx), vz: r2(g.vz), range: { x: PH.XR, z: PH.ZR }, atEdge: Math.abs(g.hx) > PH.XR - 0.005 || Math.abs(g.hz) > PH.ZR - 0.005, screen: scr(g.hx, PH.HY, g.hz) },
        finger: { held: !!g.held, fx: r3(g.fx), fz: r3(g.fz), pxPerMeter: dpx },
        fatigue: r2(fatigue(g.t)),
        wind: { now: [r2(_w[0]), r2(_w[1])], curtain: r2(curtainAmt(g, g.t)) },
        nextDist: nd ? { type: nd.type, inS: r2(nd.t0 - g.t), warnInS: r2(nd.tw - g.t), warned: nd.tw <= g.t } : null,
        next: opt.next === false ? undefined : nextOf(g),
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, now: Math.round(performance.now()),
      };
    },
    ui, inputs: () => inLog.slice(-30),
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [秒 ...]（'first' / 'good' / 'pro' / 'next'（info().next と 同じ 考えで ときどき しか 動かせない）/ 'mash'（一定周期で 左右に 振る）/ 'hold'（まん中で 押したまま）/ 'none'）
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(typeof skill === 'string' ? SKILLS[skill] : skill, (opts.seed0 ?? 1000) + i, opts).s),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const sk = typeof skill === 'string' ? SKILLS[skill] : skill;
      const R_ = Array.from({ length: N }, (_, i) => runBot(sk, (opts.seed0 ?? 1000) + i, opts)), d = R_.map(r => r.s), ends = {};
      for (const r of R_) ends[r.end] = (ends[r.end] || 0) + 1;
      return { skill: typeof skill === 'string' ? skill : 'custom', N, p10: q(d, 0.1), p25: q(d, 0.25), p50: q(d, 0.5), p75: q(d, 0.75), p90: q(d, 0.9), min: Math.min(...d), max: Math.max(...d), ge3: R_.filter(r => r.s >= 3).length / N, mean: r1(d.reduce((a, b) => a + b, 0) / N), ends };
    },
    // いつも 同じ 動き（振る 向き ax・はば A m・周期 T 秒）。どれも 伸びないこと
    mashGrid: (N = 12) => {
      const out = [];
      for (const ax of ['x', 'z', 'd']) for (const A of [0.02, 0.05, 0.1, 0.2, 0.32]) for (const T of [0.2, 0.4, 0.8, 1.6]) {
        const d = Array.from({ length: N }, (_, i) => runBot({ kind: 'mash', A, T, ax }, 3000 + i).s);
        out.push({ ax, A, T, p50: q(d, 0.5), mean: r1(d.reduce((a, b) => a + b, 0) / N), max: Math.max(...d) });
      }
      return out.sort((a, b) => b.p50 - a.p50 || b.mean - a.mean);
    },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（frameQuantized は 時刻を 使わず コマの 時刻で 入れた 場合の くらべ）
    fpsCheck: (skill = 'good', seedR = 4242) => {
      const r = runBot(SKILLS[skill], seedR, { log: true });
      const e = r.t + 0.01;
      return { live: { sec: r.s, end: r.end }, fps13: replay(r.log, seedR, 13, false, e), fps30: replay(r.log, seedR, 30, false, e), fps60: replay(r.log, seedR, 60, false, e), fps144: replay(r.log, seedR, 144, false, e), fps30frameQuantized: replay(r.log, seedR, 30, true, e), fps60frameQuantized: replay(r.log, seedR, 60, true, e), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { if (game.held) gInput(game, game.t + 1e-6, 'up'); holdPtr = null; keysDown.clear(); fingerUI = null; bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    screen: scr,
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, texs: renderer.info.memory.textures }),
    PH, BROOMS, SKILLS, makeGame, runBot, stepGame, gInput, makeBot, lqrGain, game: () => game,
  };
}
