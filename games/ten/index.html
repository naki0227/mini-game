<html lang="ja">
<head>

<meta name="description" content="ストップウォッチを見ないで、10.00秒ぴったりで止められるか。数字が見えるのは最初の3秒だけ。タップでスタート・ストップの、ログイン不要のワンタッチゲーム。">
<meta property="og:type" content="website">
<meta property="og:title" content="ぴったり10秒">
<meta property="og:description" content="数字が消えたストップウォッチを、10.00秒ぴったりで止められるか。">

<meta property="og:image" content="https://asobi.enludus.com/games/ten/ogp.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* 全画面 canvas（体育館の床とストップウォッチ）+ 上に HUD、下に結果シート、タイトルは中央のカード1枚 */
:root {
  --floor: #d6b27c;      /* 体育館の床 */
  --ink: #22262a;
  --paper: #f7f4ec;      /* 記録用紙 */
  --noren: #263847;      /* 学校のジャージ紺 */
  --noren-ink: #f2efe6;
  --accent: #c43d2a;     /* コートの赤線 */
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--floor); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none; touch-action: none;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

.hud {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pill {
  background: var(--noren); color: var(--noren-ink);
  border-radius: 6px; padding: 6px 12px 7px;
  font-variant-numeric: tabular-nums; line-height: 1.1;
  box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.pill .lab { font-size: 11px; letter-spacing: .12em; opacity: .75; display: block; }
.pill .val { font-family: var(--font-display); font-size: 26px; }
.pill .unit { font-size: 13px; margin-left: 2px; }
.pill .tag { display: inline-block; font-size: 10px; letter-spacing: .1em; background: var(--accent); color: #fff; border-radius: 3px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; opacity: 1; }
.pill.right { text-align: right; background: var(--paper); color: var(--ink); }
.pill.right .val { font-size: 20px; }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  background: rgba(34, 38, 42, .35);
  touch-action: none; cursor: pointer;
}
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);
  border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  text-align: center; cursor: default;
}
.noren {
  background: var(--noren); color: var(--noren-ink);
  display: flex; gap: 3px;
  padding-top: 18px;
}
.noren span {
  flex: 1; background: var(--noren); border-bottom: 3px solid rgba(255,255,255,.08);
  font-family: var(--font-display); font-size: 32px; line-height: 1; padding-block: 6px 16px;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,.2);
}
.body { padding: 20px 22px 22px; display: grid; gap: 14px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }
.meta { display: flex; justify-content: center; gap: 4px 16px; font-size: 13px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meta b { font-size: 16px; }
.badge {
  background: var(--accent); color: #fff; font-weight: 700;
  font-size: 12px; letter-spacing: .14em; padding: 3px 10px; border-radius: 99px; white-space: nowrap;
}
.btns { display: grid; gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 8px;
  padding: 13px 16px; cursor: pointer;
  background: var(--noren); color: var(--noren-ink); box-shadow: 0 3px 0 #131d26;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #131d26; }
a.xbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  font-weight: 700; font-size: 16px; border-radius: 8px; padding: 13px 12px;
  background: #0f1419; color: #fff; box-shadow: 0 3px 0 #000;
}
a.xbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
a.xbtn:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
a.xbtn svg { width: 16px; height: 16px; fill: currentColor; }
button.sub { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); padding-inline: 10px; }
button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
.how { font-size: 12px; opacity: .7; margin: 0; }
.back { font-size: 13px; color: var(--ink); opacity: .75; }
.back:hover { opacity: 1; }

/* モード切り替え（ふつう / 本気） */
.seg { display: inline-flex; justify-self: center; background: rgba(34,38,42,.1); border-radius: 99px; padding: 3px; gap: 2px; }
.seg button {
  font-size: 13px; padding: 6px 14px; border-radius: 99px; box-shadow: none;
  background: transparent; color: var(--ink);
}
.seg button:active { transform: none; }
.seg button[aria-pressed="true"] { background: var(--noren); color: var(--noren-ink); }
.seg button[data-mode="honki"][aria-pressed="true"] { background: var(--accent); color: #fff; }

/* 結果シート（記録用紙）。プレイ中は見えないまま場所だけとっておく */
.sheet {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 46px);
  width: min(400px, calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px))));
  background: var(--paper); color: var(--ink); border-radius: 12px;
  box-shadow: 0 8px 30px rgba(40,25,5,.3);
  padding: 12px 16px 12px; display: grid; gap: 9px; text-align: center;
  visibility: hidden; pointer-events: none; cursor: pointer;
}
.sheet.show { visibility: visible; pointer-events: auto; }
.jrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; }
.judge { font-family: var(--font-display); font-size: 40px; line-height: 1; white-space: nowrap; }
.judge.t0 { color: var(--accent); }
.judge.long { font-size: 30px; }
.sheet .badge { position: absolute; top: -10px; right: 14px; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.judge.t1 { color: #b5532a; }
.jinfo { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; line-height: 1.25; }
.jinfo .tm { font-family: var(--font-display); font-size: 22px; }
.jinfo .tm small { font-size: 13px; margin-left: 2px; }
.jinfo .er { font-size: 13px; white-space: nowrap; }
.jinfo .tg { font-size: 12px; opacity: .75; margin-left: 6px; font-family: var(--font-body); font-weight: 700; }
.jinfo .er b { font-size: 15px; }
.dist { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 6px; align-items: stretch; text-align: left; }
.dist figcaption { grid-column: 1 / -1; font-size: 11px; opacity: .7; display: flex; justify-content: space-between; }
.dist .ax { display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; opacity: .6; line-height: 1; padding-block: 2px; }
.dist svg { width: 100%; height: 52px; display: block; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sheet .meta { font-size: 12px; }
.sheet .meta b { font-size: 14px; }

.hub-back {
  position: fixed; z-index: 60;
  left: calc(env(safe-area-inset-left, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  font: 700 12px/1 "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: .04em;
  padding: 7px 11px; border-radius: 99px; text-decoration: none;
  background: rgba(20, 18, 24, .55); color: #fff; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.hub-back:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
</style>
</head>
<body>

<canvas id="c" aria-label="ぴったり10秒のゲーム画面（ストップウォッチ）"></canvas>

<div class="hud" id="hud" hidden>
  <div class="pill"><span class="lab">目標<span class="tag" id="hTag" hidden>本気</span></span><span class="val" id="hTarget">10.00</span><span class="unit">秒</span></div>
  <div class="pill right"><span class="lab" id="hBestLab">最小誤差</span><span class="val" id="hBest">—</span><br><span class="unit" id="hSub">ぴったり 0回</span></div>
</div>

<div class="sheet" id="sheet" aria-live="polite">
  <div class="jrow">
    <div class="judge" id="sJudge">神</div>
    <div class="jinfo">
      <div class="tm"><span id="sTime">10.00</span><small>秒</small><span class="tg" id="sTarget"></span></div>
      <div class="er" id="sErr">誤差 <b>0.00</b> 秒</div>
    </div>
    <div class="badge" id="newRec" hidden>新記録</div>
  </div>
  <div class="meta"><span>最小誤差 <b id="sBest">—</b><span id="sBestUnit">秒</span></span><span>ぴったり <b id="sPerf">0</b> 回</span><span>挑戦 <b id="sPlays">0</b> 回</span></div>
  <figure class="dist">
    <figcaption><span id="dCap">直近20回の誤差（ふつう）</span><span>線＝ぴったり・端＝±0.5秒</span></figcaption>
    <div class="ax" aria-hidden="true"><span>おそい</span><span>はやい</span></div>
    <svg id="dist" role="img" aria-label="直近20回の誤差"></svg>
  </figure>
  <div class="btns">
    <button id="retryBtn">もう一回</button>
    <div class="row2">
      <a class="xbtn" id="xBtn" href="https://x.com/intent/post" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Xでシェア</a>
      <button class="sub" id="copyBtn">結果をコピー</button>
    </div>
  </div>
  <div class="foot">
    <div class="seg" role="group" aria-label="モード"><button data-mode="normal" aria-pressed="true">ふつう</button><button data-mode="honki" aria-pressed="false">本気</button></div>
    <a class="back" href="../../">← ほかのゲームを見る</a>
  </div>
  <p class="how" id="copyMsg">画面タップ・スペースでもう一回</p>
</div>

<div class="overlay" id="title">
  <div class="card">
    <div class="noren" aria-hidden="true"><span>ぴっ</span><span>た</span><span>り</span><span>10</span><span>秒</span></div>
    <div class="body">
      <p class="lead">タップでスタート、もう一度タップでストップ。<br>数字が見えるのは<b>最初の3秒だけ</b>。<br>体内時計で <b>10.00秒</b> ぴったりを狙え。</p>
      <div class="meta"><span>最小誤差 <b id="tBest">—</b></span><span>本気 <b id="tBestH">—</b></span><span>ぴったり <b id="tPerf">0</b> 回</span><span>挑戦 <b id="tPlays">0</b> 回</span></div>
      <div class="seg" role="group" aria-label="モード"><button data-mode="normal" aria-pressed="true">ふつう</button><button data-mode="honki" aria-pressed="false">本気</button></div>
      <p class="how" id="tModeHow">ふつう：目標10.00秒。数字は3秒で消える</p>
      <div class="btns"><button id="startBtn">ストップウォッチを持つ</button></div>
      <p class="how">画面タップ・クリック・スペースキーでスタート／ストップ</p>
      <a class="back" href="../../">← ほかのゲームを見る</a>
    </div>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- 記録（このブラウザだけ）。誤差は秒（小数2桁） ---------- */
const KEY = 'ten:v1';
const MODES = ['normal', 'honki'];
const MODE_NAME = { normal: 'ふつう', honki: '本気' };
function fresh() {
  return { plays: 0, perfects: 0, mode: 'normal', best: { normal: null, honki: null },
    playsBy: { normal: 0, honki: 0 }, perfectsBy: { normal: 0, honki: 0 }, recent: { normal: [], honki: [] }, perfectDay: '' };
}
function load() {
  const r = fresh();
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}') || {};
    const num = v => Number.isFinite(v) && v >= 0;
    if (num(d.plays)) r.plays = d.plays;
    if (num(d.perfects)) r.perfects = d.perfects;
    if (d.mode === 'honki') r.mode = 'honki';
    if (typeof d.perfectDay === 'string') r.perfectDay = d.perfectDay;
    for (const m of MODES) {
      if (d.best && num(d.best[m])) r.best[m] = d.best[m];
      if (d.playsBy && num(d.playsBy[m])) r.playsBy[m] = d.playsBy[m];
      if (d.perfectsBy && num(d.perfectsBy[m])) r.perfectsBy[m] = d.perfectsBy[m];
      if (d.recent && Array.isArray(d.recent[m])) r.recent[m] = d.recent[m].filter(Number.isFinite).slice(-20);
    }
  } catch {}
  return r;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch {} }
let rec = load();
let mode = rec.mode;

/* ---------- 時間は 1/100 秒の整数で持つ ---------- */
const fmt = h => { h = Math.max(0, Math.round(h)); return `${String(Math.floor(h / 100)).padStart(2, '0')}.${String(h % 100).padStart(2, '0')}`; };
const fmtS = h => (Math.round(h) / 100).toFixed(2);              // 先頭ゼロなし（7.77）
const bestText = m => rec.best[m] == null ? '—' : rec.best[m].toFixed(2);
// 本気モードの目標（覚えやすい数字が多め）
const FAMOUS = [777, 314, 500, 888, 666, 1234, 999, 1111, 555, 1500, 222, 1200, 456, 808];
let target = 1000, lastTarget = 0;
function nextTarget() {
  if (mode === 'normal') return 1000;
  let t;
  do { t = Math.random() < 0.6 ? pick(FAMOUS) : 300 + Math.floor(Math.random() * 1200); } while (t === lastTarget);
  return t;
}
// 数字が見えている秒数。はじめの2回は長めに見せる
const visibleSec = () => mode === 'honki' ? 0 : rec.playsBy.normal < 1 ? 5 : rec.playsBy.normal < 2 ? 4 : 3;

function judgeOf(err) {
  if (err === 0) return { label: '神', tier: 0, tone: 'god' };
  if (err <= 5) return { label: '達人', tier: 1, tone: 'master' };
  if (err <= 20) return { label: 'うまい', tier: 2, tone: 'good' };
  if (err <= 50) return { label: 'ふつう', tier: 3, tone: 'ok' };
  return { label: 'まだまだ', tier: 4, tone: 'miss' };
}
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

/* ---------- 画面サイズ ---------- */
let W, H, dpr, areaTop, areaBot, bg = null, noise = null;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  measure();
  bg = null;
}
function measure() {
  const safeTop = parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0;
  areaTop = safeTop + 66;
  areaBot = $('sheet').getBoundingClientRect().top - 10;
  if (areaBot - areaTop < 200) areaBot = Math.min(H - 10, areaTop + 200);
}
window.addEventListener('resize', resize);

/* ---------- ゲーム状態 ---------- */
let state = 'title';     // title | ready | run | result
let startTs = 0, shown = 0, result = null, resultAt = 0, pressAt = -1e9, flashAt = -1e9;

function toReady() {
  state = 'ready';
  target = nextTarget(); lastTarget = target;
  shown = 0; result = null;
  $('title').hidden = true; $('hud').hidden = false;
  $('sheet').classList.remove('show');
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  updateHud();
}
function startRun(ts) {
  state = 'run'; startTs = ts; pressAt = performance.now();
  pi(640);
}
function stopRun(ts) {
  const h = Math.min(9999, Math.max(0, Math.floor((ts - startTs) / 10)));
  pressAt = performance.now();
  const err = Math.abs(h - target), signed = h - target;
  const j = judgeOf(err);
  const prevBest = rec.best[mode];
  const isNew = prevBest == null || err / 100 < prevBest - 1e-9;
  rec.plays++; rec.playsBy[mode]++;
  if (isNew) rec.best[mode] = err / 100;
  if (err === 0) { rec.perfects++; rec.perfectsBy[mode]++; rec.perfectDay = today(); }
  rec.recent[mode].push(signed / 100); rec.recent[mode] = rec.recent[mode].slice(-20);
  rec.mode = mode;
  save();
  result = { h, err, signed, j, isNew, target, mode, n: rec.plays };
  shown = h; state = 'result'; resultAt = performance.now(); flashAt = resultAt;
  pi(560);
  chime(j.tone);
  showSheet();
  measure();
  updateHud();
}

/* ---------- 結果シート ---------- */
function showSheet() {
  const r = result;
  const jEl = $('sJudge');
  jEl.textContent = r.j.label; jEl.className = 'judge t' + r.j.tier + (r.j.label.length >= 4 ? ' long' : '');
  $('sTarget').textContent = r.mode === 'honki' ? `目標 ${fmtS(r.target)}秒` : '';
  $('sTime').textContent = fmtS(r.h);
  const dir = r.signed > 0 ? 'おそい' : r.signed < 0 ? 'はやい' : 'ジャスト';
  $('sErr').innerHTML = `誤差 <b>${fmtS(r.err)}</b> 秒・${dir}`;
  $('newRec').hidden = !r.isNew;
  $('sBest').textContent = bestText(r.mode);
  $('sBestUnit').textContent = `秒（${MODE_NAME[r.mode]}）`;
  $('sPerf').textContent = rec.perfects; $('sPlays').textContent = rec.plays;
  $('dCap').textContent = `直近${rec.recent[r.mode].length}回の誤差（${MODE_NAME[r.mode]}）`;
  $('xBtn').href = 'https://x.com/intent/post?' + new URLSearchParams({
    text: shareText() + '\n', url: gameUrl(), hashtags: 'ぴったり10秒'
  });
  $('copyMsg').textContent = '画面タップ・スペースでもう一回';
  $('sheet').classList.add('show');
  drawDist();
  $('retryBtn').focus({ preventScroll: true });
}
function shareText() {
  const r = result;
  let s;
  if (r.err === 0) {
    s = r.mode === 'honki'
      ? `⏱️ぴったり10秒【本気】目標${fmtS(r.target)}秒をジャストで止めた！誤差0.00の神（${r.n}回目）`
      : `⏱️ぴったり10秒 10.00秒ジャスト！誤差0.00の神ストップ（${r.n}回目の挑戦）`;
  } else {
    s = r.mode === 'honki'
      ? `⏱️ぴったり10秒【本気】目標${fmtS(r.target)}秒→${fmtS(r.h)}秒（誤差${fmtS(r.err)}）${r.j.label}`
      : `⏱️ぴったり10秒 ${fmtS(r.h)}秒（誤差${fmtS(r.err)}）${r.j.label}`;
    if (r.isNew && rec.playsBy[r.mode] > 1) s += ' 自己ベスト！';
    if (rec.perfectDay === today()) s += ' ※今日は神が出た日';
  }
  return s;
}
// 直近20回の誤差: 中央の線がぴったり、上がおそい・下がはやい（±0.5秒で端）
function drawDist() {
  const svg = $('dist');
  const w = Math.max(120, Math.round(svg.getBoundingClientRect().width || 300)), h = 52, mid = h / 2;
  const list = rec.recent[result.mode];
  const N = 20, slot = w / N, bw = Math.max(3, slot - 2), half = mid - 3;
  let out = `<line x1="0" x2="${w}" y1="${mid}" y2="${mid}" stroke="rgba(34,38,42,.45)" stroke-width="1"/>`;
  list.forEach((v, i) => {

  const txt = state === 'ready' ? 'タップでスタート' : 'タップでストップ';
  ctx.font = `${Math.min(34, W * 0.085)}px ${FD}`;
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(247,244,236,.85)'; ctx.fillStyle = state === 'run' ? '#c43d2a' : '#263847';
  ctx.strokeText(txt, W / 2, y); ctx.fillText(txt, W / 2, y);
  ctx.font = `700 14px ${FB}`; ctx.fillStyle = 'rgba(34,38,42,.85)'; ctx.lineWidth = 4;
  const sub = state === 'ready'
    ? (mode === 'honki' ? `目標 ${fmtS(target)}秒・数字は最初から見えない` : `目標 10.00秒・数字は${visibleSec()}秒で消える`)
    : `目標 ${fmtS(target)}秒だと思ったら止める`;
  ctx.strokeText(sub, W / 2, y + 30); ctx.fillText(sub, W / 2, y + 30);
  ctx.textAlign = 'start';
}

function render() {
  const now = performance.now();
  if (!bg) makeBg();
  if (!noise) makeNoise();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawWatch(now);
  drawHint();
  // 自動ストップ（99.99秒）
  if (state === 'run' && now - startTs >= 99990) stopRun(startTs + 99990);
  requestAnimationFrame(render);
}

/* ---------- 入力（pointerdown で即時。時刻はイベントの timeStamp） ---------- */
function evTime(e) {
  const now = performance.now(), ts = e && e.timeStamp;
  return ts > 0 && ts <= now + 1 && now - ts < 1000 ? ts : now;
}
function act(ts) {
  wakeAudio();
  if (state === 'title') toReady();
  else if (state === 'ready') startRun(ts);
  else if (state === 'run') stopRun(ts);
  else if (state === 'result') { if (performance.now() - resultAt < 400) return; toReady(); }
}
document.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  if (e.target.closest('button, a, #copyMsg')) return;
  if (state === 'title' && !e.target.closest('#title')) return;
  const ts = evTime(e);
  e.preventDefault();
  act(ts);
});
cvs.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (e.repeat) { e.preventDefault(); return; }
  const ts = evTime(e);
  if (state === 'title' || state === 'result') {
    const el = document.activeElement;
    if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a')) return;   // 他のボタンはそのまま
  }
  e.preventDefault();
  act(ts);
});
$('startBtn').addEventListener('click', () => { if (state === 'title') { wakeAudio(); toReady(); } });
$('retryBtn').addEventListener('click', () => { if (state === 'result') toReady(); });
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { wakeAudio(); setMode(b.dataset.mode); }));
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText()} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try {
    navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback);
  } catch { fallback(); }
});

resize();
try { document.fonts.ready.then(measure); } catch {}
setMode(mode);
fillTitle(); updateHud();
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(render);
})();
</script>
<a class="hub-back" id="hubBack" href="/" aria-label="あそび横丁（ゲーム一覧）にもどる">← 横丁</a>
<script>
// プレイ中でもゲーム一覧に戻れるボタン。押してもゲームの入力（タップ・ドラッグ）に伝わらないようにする
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) document.getElementById('hubBack').addEventListener(ev, e => e.stopPropagation(), { passive: true });
</script>
