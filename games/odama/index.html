/* ---------- 大玉の 物理（three には 頼らない 自前。長さ m・速さ m/s・時間 秒） ----------

   子ども: 半径 RK の 円。指の スティック (sx, sz)（長さ 0 … 1）× VK の 速さを ねらって、加速 AK まで で 走る（TAUK で ついていく）。
   大玉: 半径 R、重さ MB（布の 大玉の 回る ぶんも ふくめた 重さ）。ころがり抵抗 CRR + 空気 DRAG·v²。
     子どもと 玉は 円どうしの ぶつかり（はねかえり E・手の まさつ MU）。子どもが 玉に 向かって 走ると、ぶつかった ぶんだけ 押せる
     = 押す 力は 子どもの 足の 力（MK·AK）まで。玉は 重いので いちど 速く なると なかなか 止まらない（ころがり抵抗だけ では 3 m/s から 10 m 以上 ころがる）。
     止める・曲げる には 玉の 前や 横へ まわって 押し返す。
   コース: 行って もどる を くりかえす（区間 k: 偶数 = 北へ、奇数 = 南へ）。区間ごとに スラローム コーン（矢じるしの 側を 通る）と 折り返し コーン（まわる）。
     折り返し: 玉が コーンの まわりを 角度で SWEEP（225°）以上 まわったら クリア。スラローム: コーンの 横の 線を こえた ときの 左右で 判定（反対 = ミス）。
   ミス: 玉が コーンに ふれる（たおれる）・玉が ロープを こえる・反対側を 通る・区間の 時間（白組の ペース）切れ。

const PH = {

  XW: 4.8, LF: 12, ZS: -5.4, ZN: 16.6, CR: 0.17, RIN: -0.1,
  SWEEP: 1.25 * Math.PI, TRAD: 4.6, TRES: 6.0, T_FAIL: 1.3, PW: 0.4,

function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const vPace = k => 0.8 + 0.9 * (1 - Math.exp(-k / 16));

const tzN = k => PH.LF - 3.5 * Math.exp(-Math.max(0, k) / 7);   // 北の 折り返しの z（はじめは 近い）
function makeSeg(seed, k, t0, fx, fz) {

    const u = Math.min(1.6, (0.15 + 0.6 * L) * r() + 0.006 * k);

  let len = 0, px = fx, pz = fz;

    const qx = c.type === 'slalom' ? c.x + c.side * PASS : c.x + (px > c.x ? 1 : -1) * TURN_R, qz = c.type === 'slalom' ? c.z : c.z - dir * 0.3;
    len += Math.hypot(qx - px, qz - pz); px = qx; pz = qz;

  if (k >= 2) {
    const ng = 1 + (r() < (k - 8) * 0.1 ? 1 : 0) + (r() < (k - 18) * 0.06 ? 1 : 0);
    for (let i = 0; i < ng; i++) {

    for (let i = 0; i < nb; i++) seg.bumps.push({ x: (r() * 2 - 1) * 2.8, z: 2 + r() * (PH.LF - 4), r: 0.9 + 0.7 * r(), amp: 0.3 + 0.045 * k, ph: r() * 50 });

    for (let tries = 0; tries < 8; tries++) { z = 1.6 + r() * (PH.LF - 3.2); if (cones.every(c => Math.abs(c.z - z) > 1.4)) break; }

    seed, t: 0, kid: { x: 0, z: -3.7, vx: 0, vz: 0, sx: 0, sz: 0, ptr: 0, cont: 0, contT: -9, push: 0 },

  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };

  const rect = id => { const el = $(id); if (!el || el.closest('[hidden]') || el.hidden) return null; const r = el.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2), w: Math.round(r.width), h: Math.round(r.height) }; };

  const wallMs = tg => Math.round((base + tg) * 1000 - performance.now());
  // つぎの 操作の 目安（お手本 = next ボットの その場の 判断。1回 決めた 目あては 0.15 秒 くらい 有効）。
  //   down: (x, y) を 押す / move: 押した まま (x, y) へ / up: 離す / wait: いまは 何もしない（まだ 物理に 入っていない 入力が あるあいだも 必ず wait）
  const nb = { P: botParams(SKILLS.next, mulberry(5)), mem: { side: {}, wbx: 0 }, rnd: mulberry(9), seed: -1 };
  const nextOf = g => { const r = nextOfRaw(g); if (r.inMs !== undefined && r.action !== 'wait') r.atMs = Math.round(performance.now() + r.inMs); return r; };
  const nextOfRaw = g => {

    if (g.queue.length) { const last = g.queue[g.queue.length - 1]; return { action: 'wait', inMs: Math.max(0, wallMs(last.t)) + 15, why: 'pending', pending: last.kind }; }
    if (g.ph !== 'play') return ptr.down ? { action: 'up', inMs: 0, x: Math.round(ptr.x), y: Math.round(ptr.y), why: g.ph } : { action: 'wait', inMs: 100, why: g.ph };
    if (nb.seed !== g.seed || nb.g !== g) { nb.seed = g.seed; nb.g = g; nb.mem = { side: {}, wbx: 0 }; }
    const a = ptr.down ? { x: ptr.ax, y: ptr.ay } : anchor();
    const cmd = brainCmd(g, SKILLS.next, nb.P, nb.mem, nb.rnd), pd = pixOf(cmd.sx, cmd.sz), tx = Math.round(a.x + pd.dx), ty = Math.round(a.y + pd.dy);
    if (!ptr.down) return { action: 'down', x: Math.round(a.x), y: Math.round(a.y), inMs: 0, holdMs: 0, validMs: 150, windowMs: 150, what: '押す（押した 点が スティックの まん中。そのあと move で ずらす）', sx: r2(cmd.sx), sz: r2(cmd.sz) };
    if (Math.hypot(ptr.x - tx, ptr.y - ty) > 3) return { action: 'move', x: tx, y: ty, inMs: 0, validMs: 150, windowMs: 150, what: '押した まま ここへ', sx: r2(cmd.sx), sz: r2(cmd.sz) };

  const statOf = (R_, key) => { const d = R_.map(r => r[key]); return { p10: q(d, 0.1), p25: q(d, 0.25), p50: q(d, 0.5), p75: q(d, 0.75), p90: q(d, 0.9), min: Math.min(...d), max: Math.max(...d), mean: mean(d) }; };

    info: (opt = {}) => {

    // 見ないで 決まった 押し方（同じ 向き・連打・ぐるぐる・ジグザグ・コーンへ まっすぐ・何もしない）。どれも ふつうの 初めての 人より 伸びないこと

      for (const [on, off] of [[0.1, 0.1], [0.3, 0.3], [0.6, 0.4], [1, 1]]) run(`mash ${on}/${off} 前`, { kind: 'mash', on, off, sx: 0, sz: 1 });
      for (const w of [1, 2.5, 5]) run(`circle ${w}`, { kind: 'circle', w, a: 1 });

    },
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { if (game.kid.ptr) gInput(game, game.t + 1e-6, 'up', 0, 0); ptr.id = null; ptr.down = false; bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
