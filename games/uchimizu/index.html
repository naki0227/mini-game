<style>
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }

:root {

  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;

}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink);
  font-family: var(--font-body); overflow: hidden;

}

.hud {

  box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.pill .lab { font-size: 10px; letter-spacing: .12em; opacity: .85; display: block; }
.pill .val { font-family: var(--font-display); font-size: 18px; }
/* 手桶（右下）: 押すと汲みに行く */
.bucket-btn {
  position: fixed; z-index: 30; right: calc(env(safe-area-inset-right, 0px) + 6px); bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  width: 84px; height: 92px; border: 0; padding: 0; background: transparent; box-shadow: none; border-radius: 12px; cursor: pointer;

  position: fixed; inset: 0; display: grid; z-index: 40;

  touch-action: none; cursor: pointer; overflow: hidden;
}

#over { place-items: end center; background: linear-gradient(to top, rgba(30, 40, 44, .5), rgba(30, 40, 44, 0) 66%); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
.card {
  width: min(360px, 100%); background: var(--paper); color: var(--ink);

}

}
.noren.result { padding-top: 10px; }

.body { padding: 16px 20px 18px; display: grid; gap: 11px; }
.lead { margin: 0; font-size: 14px; line-height: 1.7; text-wrap: balance; }

.hub-back {

<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try { THREE = await import(THREE_URL); } catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 打ち水の物理（three には頼らない。単位は m・秒。濡れた・かかった は全部この結果から） ----------
   座標: y が上、路地は −z の方へ続く。x は右。路地の幅は x = −1.4 … 1.4（両側は町家の壁 |x| = 1.6）。
   自分は路地の右寄り（x = PX）に立ち、冷やしたところのすぐ手前（BEHIND m うしろ）へ歩いて進む。
   ひしゃくの水: ND 粒の水滴。ひしゃくを右から左へ振る SWEEP 秒のあいだに順に放たれ、横に ±SPREAD（扇）、速さに SF0〜SF1 のばらつき。
     速さ v = √(V0² + (V1² − V0²)·p)（p = 引いた長さ）、仰角 EL±ELJ。
     重力 と 空気抵抗 −k·|v−風|·(v−風)、k = KD / 半径（小さい粒ほど風に流され、手前に落ちる）。1/240 秒きざみ。
   地面: 0.2 m 角のます目の「濡れ」。落ちた粒は真ん中のますに KC、上下左右に KN を足す。濡れは時間で一定の速さ（日ざし）で減る。
     濡れ ≥ WTH のますが、1 m ごとの区切り（14×5 ます）の COOL 割をこえた瞬間、その 1 m は「冷えた」（あとで乾いても数える）。
     スコア = 手前から途切れずに冷えた m 数。
   通る人: 歩く人（カプセル）・日傘（円板）・自転車（人のカプセル + 横向きのカプセル）・猫（横向きのカプセル）。
     動きは「時刻 → 位置」の折れ線（自転車はジグザグも）。水滴が触れたら「かかった」。3人にかけたらおしまい。
   日ざし: 暑さが少しずつたまり、1 m 冷やすごとに下がる。いっぱいになったらおしまい（何もしなければ十数秒で終わる）。
   手桶: BUCKET 杯。空になると汲みに行く（REFILL 秒。そのあいだはまけない）。 */
const PH = {
  G: 9.8, DT: 1 / 240,
  HALF: 1.4, WALL: 1.6, CELL: 0.2, NX: 14, RPM: 5,
  PX: 1.0, RX: -0.08, RY: 0.92, RZ: -0.5,
  V0: 3.0, V1: 10.6, EL: 32,
  ND: 56, SWEEP: 0.1, SPREAD: 0.3, SF0: 0.88, SF1: 1.06, ELJ: 3.5,
  KD: 0.00016, R0: 0.002, R1: 0.0045, RD: 0.025,
  WTH: 0.35, WMAX: 3.0, KC: 0.7, KN: 0.075,
  COOL: 0.5, BUCKET: 12, REFILL: 2.2, RELOAD: 0.55,
  STRIKES: 3, H0: 0.3, COOL_H: 0.13, BEHIND: 2.3, WALK: 1.2,
  PMIN: 0.04, YAW_S: 0.75, MAXD: 480, LANE0: -1.0, LANE1: 0.35, MAXT: 1800,
};
const DEGR = Math.PI / 180;
const RMEAN = (PH.R0 + PH.R1) / 2;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
// 冷やした m 数 F による難しさ。上限は決めず、ゆっくり上がりつづける
function diffOf(F) {
  const k = 1 - Math.exp(-F / 45);
  return {
    k,
    heat: 0.028 + 0.018 * k + 0.00016 * F,                 // 暑さのたまる速さ /s
    dry: 0.04 + 0.035 * k + 0.0002 * F,                  // 濡れの減る速さ /s
    gap: Math.max(1.4, 9 - 6 * k - 0.006 * F),        // 人の来る間隔 s
    wind: F < 18 ? 0 : Math.min(3.2, 0.4 + (F - 18) * 0.03),   // 横風 m/s
    speed: 1 + 0.45 * k + 0.0015 * F,                     // 人の速さの倍率
  };
}
// 入力は時刻つきで入れる（画面のコマとは関係なく、物理はその時刻で効く）
function gInput(g, t, type, a = 0, b = 0) { const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, { t, type, a, b }); }
// 横風（25 m ごとに向きが変わる。強さはゆっくり強弱）。乱数は種と区画から決まる（読み出しで状態を変えない）
let WX = 0;
function windAt(g, t) {
  const W = g.d.wind; if (W <= 0) { WX = 0; return 0; }
  const blk = Math.floor(g.F / 25), dir = mulberry((g.seed * 977 + blk * 131 + 7) >>> 0)() < 0.5 ? -1 : 1;
  WX = dir * W * (0.75 + 0.25 * Math.sin(0.9 * t + g.windPh) + 0.1 * Math.sin(2.3 * t + 1.3));
  return WX;
}

/* 通る人 */
const KINDS = {
  obaa: { name: '日傘のおばあさん', v0: 0.55, v1: 0.8, cap: [0.24, 0.05, 1.35], para: [1.66, 0.5], head: 1.95 },
  yukata: { name: '浴衣の人', v0: 0.8, v1: 1.05, cap: [0.23, 0.05, 1.52], head: 1.8 },
  haitatsu: { name: '配達の人', v0: 1.15, v1: 1.5, cap: [0.25, 0.05, 1.62], box: [0.3, 1.0, 0.24], head: 1.9 },
  bike: { name: '自転車の子', v0: 2.3, v1: 3.2, cap: [0.22, 0.55, 1.45], hcap: [0.42, 0.62, 0.3], head: 1.75 },
  cat: { name: '猫', v0: 3.0, v1: 4.0, hcap: [0.17, 0.2, 0.13], head: 0.62 },
};
const seg = (t0, t1, x0, z0, x1, z1) => ({ t0, t1, x0, z0, x1, z1 });
function spawn(g) {
  const r = g.rnd, F = g.F, d = g.d, zp = g.zp;
  const w = { obaa: 1, yukata: F >= 3 ? 0.8 : 0, haitatsu: F >= 8 ? 0.8 : 0, bike: F >= 12 ? Math.min(1.3, 0.3 + 0.02 * F) : 0, cat: F >= 16 ? Math.min(0.9, 0.25 + 0.01 * F) : 0 };
  let s = 0; for (const k in w) s += w[k];
  let u = r() * s, kind = 'obaa'; for (const k in w) { u -= w[k]; if (u <= 0 && w[k] > 0) { kind = k; break; } }
  const K = KINDS[kind], v = (K.v0 + (K.v1 - K.v0) * r()) * d.speed;
  const P = { id: ++g.pid, kind, segs: [], zigA: 0, zigW: 0, zigPh: 0, hitAt: -1, col: Math.floor(r() * 8), t0: g.t, from: 'front', hx0: 0, hz0: 1, end: 0 };
  if (kind === 'cat') {
    // 家のすきまから顔を出して、少し座ってから 路地を横切る
    const sd = r() < 0.5 ? -1 : 1, z = zp - (2.6 + 5 * r()), sit = Math.max(0.6, 1.1 + 0.7 * r() - 0.4 * d.k), xa = sd * 1.45, xb = -sd * 1.95;
    P.hx0 = -sd; P.hz0 = 0; P.from = 'side';
    let t = g.t; P.segs.push(seg(t, t + sit, xa, z, xa, z)); t += sit;
    if (F >= 40 && r() < 0.35) {
      const xm = r() * 0.8 - 0.4, T1 = Math.abs(xm - xa) / v, st = 0.35 + 0.4 * r();
      P.segs.push(seg(t, t + T1, xa, z, xm, z)); t += T1; P.segs.push(seg(t, t + st, xm, z, xm, z)); t += st;
      P.segs.push(seg(t, t + Math.abs(xb - xm) / v, xm, z, xb, z));
    } else P.segs.push(seg(t, t + Math.abs(xb - xa) / v, xa, z, xb, z));
  } else {
    let lane = PH.LANE0 + (PH.LANE1 - PH.LANE0) * r();
    if (kind === 'bike' && F >= 30 && r() < Math.min(0.75, 0.2 + 0.006 * F)) {
      P.zigA = 0.3 + 0.25 * r(); P.zigW = 2.2 + 1.2 * r(); P.zigPh = r() * 6.283;

function sPour() { try { if (!live()) return; const n0 = ac.currentTime + 0.1; noise(n0, 1.4, 0.08, 'lowpass', 520, 0.7, 700, 0.3); for (let i = 0; i < 6; i++) tone(160 + Math.random() * 90, n0 + 0.2 + i * 0.18, 0.08, 0.035, 'sine', 120); } catch {} }
function sDoor() { try { if (!live()) return; const n0 = ac.currentTime; for (let i = 0; i < 5; i++) noise(n0 + i * 0.05, 0.05, 0.03, 'bandpass', 380, 2, 700); } catch {} }
// げたの音（からん ころん）
function sGeta() { try { if (!live()) return; const n0 = ac.currentTime; [[0, 330], [0.26, 262], [0.52, 330]].forEach(([t, f]) => { noise(n0 + t, 0.05, 0.05, 'bandpass', 700, 4, 1000); tone(f, n0 + t, 0.08, 0.035, 'triangle'); }); } catch {} }
function sRattle() { try { if (!live()) return; const n0 = ac.currentTime; for (let i = 0; i < 8; i++) noise(n0 + i * 0.06, 0.04, 0.03, 'bandpass', 500, 3, 800); } catch {} }
function sFail(kind) { try { if (!live()) return; const n0 = ac.currentTime + 0.25; if (kind === 'heat') { tone(220, n0, 0.5, 0.06, 'sine', 160); tone(165, n0 + 0.3, 0.6, 0.05, 'sine', 130); } else { tone(262, n0, 0.14, 0.05, 'triangle'); tone(196, n0 + 0.16, 0.45, 0.06, 'sine', 160); } } catch {} }
function sChime(big) { try { if (!live()) return; const n0 = ac.currentTime + 0.08; const seq = big ? [[392, 0], [523, 0.1], [659, 0.2], [784, 0.32]] : [[392, 0], [523, 0.1], [659, 0.2]]; seq.forEach(([f, t]) => tone(f, n0 + t, 0.45, 0.05)); } catch {} }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  step(dt);
  render(Math.max(dt, 1 / 240));
  updateAmb();
  requestAnimationFrame(frame);
}

/* ---------- 入力: 押して下へ引いて離す。強さ・向きは「離した瞬間の位置」だけで決まる（引く速さは関係ない）。時刻つきで物理へ ---------- */
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false; $('bucketBtn').hidden = false;
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(nextSeed(), bn); frozen = false; setMileLevel(0); throwAnim = -9;
  updateHud();
  // #debug&skip=秒: その秒数だけ一気に進め、ひしゃくから水が扇に飛んでいる瞬間で止める（OGP 撮影・確認用。bot=good と組み合わせる。freeze=1 で止めたまま）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'fan');
  if (HASH.has('debug') && HASH.get('ff') === '1') ff = true;
}
// pose=fan: 指定の秒数のあと、ひしゃくの水が before 秒ぶん飛んだところまで進める（扇に広がって空中にある）
function skipTo(t1, pose = 'none') {
  const quiet = state; state = 'skip';
  const lim = t1 + 60, before = +(HASH.get('before') || 0.26);
  let warm = 0;
  while (game.phase !== 'over' && game.t < lim) {
    if (game.t >= t1) {
      if (pose !== 'fan') break;
      const L = game.lastThrow;
      if (L && game.t - L.t >= before && game.t - L.t < before + 0.02 && game.nd > 30) break;
    }
    if (bot) bot.step(); stepGame(game);
    if (game.events.length) handleEvents();
    if (t1 - game.t < 3 && (warm += PH.DT) >= 1 / 30) { stepSteam(1 / 30); stepSplash(1 / 30); warm = 0; }
  }
  state = quiet;
  pops = []; failAt = game.phase === 'over' ? tt : -1; shake = 0; hitFlash = 0; coolFlash = 0;
  if (game.lastThrow && game.t - game.lastThrow.t < 0.4) throwAnim = tt - (game.t - game.lastThrow.t);
  base = performance.now() / 1000 - game.t;
  cam.init = true;
  if (HASH.get('freeze') === '1') frozen = true;
}
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game) return;
  if (game.phase === 'over') { if (failAt >= 0 && tt - failAt > 0.4) showOver(); return; }
  if (bot) return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  kb = null;
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, moved: false };
  input('aim', evTime(e));
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) > 4) drag.moved = true;
});
addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  // 離したところで決まる（move が来ていなくても、離した位置を使う）
  const d = drag; drag = null;
  const a = pullToAim(e.clientX - d.x0, e.clientY - d.y0);
  if (state !== 'play' || !game || bot) return;
  if (a.p < PH.PMIN) { input('cancel', evTime(e)); return; }
  input('throw', evTime(e), a.p, a.yaw);
});
addEventListener('pointercancel', () => { if (drag && game && state === 'play') input('cancel', performance.now()); drag = null; });
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
// 手桶: 押すと汲みに行く（ゲームの「引く」には伝わらない）
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) $('bucketBtn').addEventListener(ev, e => e.stopPropagation(), { passive: true });
$('bucketBtn').addEventListener('click', e => { e.preventDefault(); wakeAudio(); if (state === 'play' && game && !bot) input('refill', evTime(e)); });
// キーボード: ←→ = 向き、スペース長押し = 強さ（KB_T 秒でいっぱい）、離すとまく。R / ↓ = 汲む
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play') {
    if (!game) return;
    if (game.phase === 'over') { if ((c === 'Space' || c === 'Enter') && !e.repeat && failAt >= 0 && tt - failAt > 0.4) { e.preventDefault(); showOver(); } return; }
    if (bot) return;
    if (c === 'ArrowLeft' || c === 'ArrowRight' || c === 'KeyA' || c === 'KeyD') {
      e.preventDefault(); wakeAudio();
      if (!kb) kb = { yaw: 0, down: -1 };
      const s = c === 'ArrowLeft' || c === 'KeyA' ? -1 : 1;
      kb.yaw = clamp(kb.yaw + s * 0.02, -1.0, 1.0);
      return;
    }
    if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') {
      e.preventDefault(); if (e.repeat) return; wakeAudio();
      if (!kb) kb = { yaw: 0, down: -1 };
      kb.down = evTime(e); input('aim', kb.down);
      return;
    }
    if (c === 'KeyR' || c === 'ArrowDown' || c === 'KeyS') { e.preventDefault(); if (!e.repeat) input('refill', evTime(e)); return; }
    if (c === 'Enter') e.preventDefault();
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
});
addEventListener('keyup', e => {
  const c = e.code;
  if (state !== 'play' || !game || !kb) return;
  if ((c === 'Space' || c === 'ArrowUp' || c === 'KeyW') && kb.down >= 0) {
    e.preventDefault();
    const t = evTime(e), p = clamp((t - kb.down) / 1000 / KB_T, 0, 1);
    kb.down = -1;
    if (p < PH.PMIN) { input('cancel', t); return; }
    input('throw', t, p, kb.yaw);
  }
});
addEventListener('blur', () => { if (drag && game && state === 'play') input('cancel', performance.now()); drag = null; if (kb) kb.down = -1; });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(rec.last)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ入力（時刻つき）の列を、fps コマ割りで物理に流しなおす（入力はそのコマで届くが、物理はその時刻で効く）
  const replay = (log, seedR, fps) => {
    const g = makeGame(seedR); let i = 0, tNow = 0;
    while (g.phase !== 'over' && tNow < PH.MAXT + 5) {
      tNow += 1 / fps;
      while (i < log.length && log[i].t <= tNow) { gInput(g, Math.max(g.t, log[i].t), log[i].type, log[i].a, log[i].b); i++; }
      while (g.t + PH.DT <= tNow) { stepGame(g); g.events.length = 0; }
    }
    return { n: g.F, t: +g.t.toFixed(3), fail: g.fail, strikes: g.strikes };
  };
  const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;
  const scr = (x, y, z) => { const p = project(x, y, z); return { x: Math.round(p.x), y: Math.round(p.y) }; };
  // いま まくとしたら どう引くか（うまい人の選び方。風も読む）。from = 押すとよいところ、to = 離すところ（画面座標）
  const aimNow = () => {
    const g = game; if (!g || g.phase !== 'play') return null;
    const pl = planGood(g, g.t, 0.3, 1, true); if (!pl) return null;
    const P = aimToPull(pl.p, pl.yaw), from = { x: Math.round(clamp(W / 2 - P.dx / 2, 16, W - 16)), y: Math.round(H * 0.55) };
    return { p: r3(pl.p), yaw: r3(pl.yaw), target: { x: r2(pl.x), z: r2(pl.z), m: r2(-pl.z) }, safe: pl.safe, wouldHit: pl.who, pull: { dx: Math.round(P.dx), dy: Math.round(P.dy) }, from, to: { x: Math.round(from.x + P.dx), y: Math.round(from.y + P.dy) }, targetScreen: scr(pl.x, 0, pl.z), L: Math.round(pullL()) };
  };
  window.__uchimizu = {
    info: () => {
      if (!game) return null;
      const g = game;
      windAt(g, g.t);
      const pass = g.pass.filter(P => passOn(P, g.t)).map(P => { const Q = passAt(P, g.t); return { id: P.id, kind: P.kind, from: P.from, x: r2(Q.x), z: r2(Q.z), ahead: r2(g.zp - Q.z), v: r2(Q.v), hit: P.hitAt >= 0, screen: scr(Q.x, 1.0, Q.z) }; });
      const A = aimNow();
      return {
        state, phase: g.phase, t: r3(g.t), F: g.F, cover: r2(segCover(g, g.F)), heat: r3(g.heat), strikes: g.strikes, fail: g.fail, throws: g.throws, bucket: g.bucket, refilling: g.refilling,
        ready: g.phase === 'play' && !g.refilling && g.t >= g.readyAt, zp: r2(g.zp), wind: r2(WX), drops: g.nd, pass,
        aim: A, safe: A ? A.safe : null,
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, queue: g.queue.length,
      };
    },
    aim: aimNow,
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [m...]
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), n = R.map(r => r.n);
      const kinds = {}; for (const r of R) kinds[r.fail] = (kinds[r.fail] || 0) + 1;
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge3: R.filter(r => r.n >= 3).length / N, ge8: R.filter(r => r.n >= 8).length / N, ge20: R.filter(r => r.n >= 20).length / N, ge60: R.filter(r => r.n >= 60).length / N, ge150: R.filter(r => r.n >= 150).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), meanT: +(R.reduce((a, r) => a + r.t, 0) / N).toFixed(1), kinds };
    },
    // ボットの入力の列を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（結果がそろうか）
    fpsCheck: (skill = 'first', seedR = 4242) => { const r = runBot(SKILLS[skill], seedR, { log: true }); return { live: { n: r.n, fail: r.fail, t: +r.t.toFixed(3), strikes: r.strikes }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), inputs: r.log.length }; },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）
    screen: (x, y, z) => scr(x, y, z),
    passScreen: () => game.pass.filter(P => passOn(P, game.t)).map(P => { const Q = passAt(P, game.t); return { id: P.id, kind: P.kind, ...scr(Q.x, 1.0, Q.z) }; }),
    frontierScreen: () => scr(0, 0, -(game.F + 0.5)),
    bucketScreen: () => { const b = bucketPos(); return { x: Math.round(b.x), y: Math.round(b.y) }; },
    tapPoint: () => ({ x: Math.round(W / 2), y: Math.round(H * 0.55) }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, KINDS, SKILLS, RANGE, makeGame, runBot, stepGame, gInput, diffOf, passAt, planGood, aimTo, throwRisk, segCover, game: () => game,
  };
}

try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789m！ひゃっあれまきうわつめたーにふすずしいなええりおきんやあら自己ベスト更新水をまく汲いる…打ちかけゃった（/）'), document.fonts.load(`700 16px "Zen Kaku Gothic New"`, '冷やした日ざしあつい…風押して下へ引いて汲む汲んでるうしろから自転車人猫あと%にゃ井戸でいるあいだはまけない人が近いときは待つか、離れたところへすこし涼しくなってきた風が出てきた。水が流される路地の打ち水名人町内いちまだまだ')]), new Promise(r => setTimeout(r, 1500))]); } catch {}
resize();

newDemo();
state = 'title';
