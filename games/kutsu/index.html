<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- ブランコと靴の物理（three には頼らない。m・kg・s・rad。x=前（距離の向き）、y=上、z=横（+はカメラ側）） ----------
   ブランコ: 重さのないひも（長さ L）の先の座面に、子どもの体（剛体）が乗っている。
   子どもは体の向き β（ひもに対する傾き。+ は「のけぞって足を前へ伸ばす」）だけを筋肉で変えられる。
   体を回すと、反作用でひもが回り（角運動量の保存）、重心の位置も動く。前へ振れる間に伸ばし、後ろへ振れる間に曲げると、
   毎回少しずつエネルギーが入る（座りこぎ）。逆だと抜ける。ひもの張力が足りなくなる高さでは、ひもがたるんでガクッと勢いが落ちる。
   靴: 0.25kg の剛体（足の形の凸な点の集まり）。放物線＋空気抵抗＋回転。地面・砂場・植え込み・すべり台・フェンスなどに
   点ごとの撃力（はね返り係数・摩擦）で当たり、バウンド・転がって止まる。止まった位置の x が記録、上を向いた面で「明日の天気」。 */
const G = 9.81, RHO = 1.2;
const PIVOT_Y = 2.95;
const SW = { M: 32, L: 2.5, bb: -0.4, I: 15, bBent: -0.47, bExt: 0.78, om: 9, damp: 0.8, cd: 0.15, slack: 0.45, sk: 6 };
const SW_J = SW.M * SW.bb * SW.bb + SW.I;
const SW_DT = 1 / 600;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function swingInit(th0 = 0.7) { return { th: -th0, w: 0, b: SW.bBent, bv: 0, t: 0, ext: false, slackK: 0, peak: th0, peakF: 0, peakB: th0, foot: null, footV: { x: 0, y: 0 }, pumpE: 0 }; }
// 1ステップ。ext = 足を伸ばしているか
function swingStep(s, dt, ext) {
  const { M, L, bb } = SW;
  s.ext = ext;
  const bt = ext ? SW.bExt : SW.bBent;
  const ba = SW.om * SW.om * (bt - s.b) - 2 * SW.om * s.bv;
  const phi = s.th + s.b;
  const X = L * Math.sin(s.th) + bb * Math.sin(phi);           // 重心の横位置（重力のトルク）
  const K = bb * Math.cos(s.b), Kb = -bb * Math.sin(s.b);
  const Ieff = M * L * L + 2 * M * L * K + SW_J;
  const v = L * s.w, drag = SW.cd * v * Math.abs(v) * L;
  let thdd = (-M * G * X - M * L * Kb * s.bv * (2 * s.w + s.bv) - M * L * K * ba - SW_J * ba - SW.damp * s.w - drag) / Ieff;
  // ひもの張力（座面あたり、重さで割った値）。足りないと、ひもがたるむ
  const ten = L * s.w * s.w + G * Math.cos(s.th);
  s.slackK = Math.max(0, (SW.slack * G - ten) / (SW.slack * G));
  if (s.slackK > 0) thdd -= s.slackK * SW.sk * s.w;
  const e0 = swingEnergy(s);
  s.w += thdd * dt; s.th += s.w * dt; s.bv += ba * dt; s.b += s.bv * dt; s.t += dt;
  s.pumpE += swingEnergy(s) - e0;
  // 振れ幅（前・後ろの端）
  if (s.w <= 0 && s.th > 0) s.peakF = Math.max(s.peakF * (1 - dt * 0.05), s.th);
  if (s.w >= 0 && s.th < 0) s.peakB = Math.max(s.peakB * (1 - dt * 0.05), -s.th);
  s.peak = Math.max(s.peakF, s.peakB);
  // 足先（靴）の位置と速度
  const f = footPos(s);
  if (s.foot) { s.footV.x = (f.x - s.foot.x) / dt; s.footV.y = (f.y - s.foot.y) / dt; }
  s.foot = f;
}
function swingEnergy(s) { const v = SW.L * s.w; return 0.5 * v * v + G * (SW.L * (1 - Math.cos(s.th))); }
// 座面（ひもの先）と体の向き
function seatPos(s) { return { x: SW.L * Math.sin(s.th), y: PIVOT_Y - SW.L * Math.cos(s.th) }; }
// 姿勢 0=曲げ 1=伸ばし
const postureOf = s => Math.max(0, Math.min(1, (s.b - SW.bBent) / (SW.bExt - SW.bBent)));
function footPos(s, kk) {
  const S = seatPos(s), k = kk == null ? postureOf(s) : kk;
  // ふともも: ひもに直角の前向きを、伸ばすほど上へ起こす / すね: 曲げると座面の下へたたむ
  const ta = s.th + lerp2(-0.12, 0.2, k), sa = ta + lerp2(-1.95, -0.1, k);
  const kx = S.x + Math.cos(ta) * 0.34, ky = S.y + Math.sin(ta) * 0.34;      // ひざ
  const sx = Math.cos(sa), sy = Math.sin(sa);
  return { x: kx + sx * 0.36, y: ky + sy * 0.36, shinX: sx, shinY: sy, kx, ky, ta, sa };
}
const lerp2 = (a, b, k) => a + (b - a) * k;
// 蹴り出す: kick = 蹴りの強さ m/s、yaw = 左右の向き（+はカメラ側）、seed = 回転のばらつき
const SHOE = { m: 0.25, l: 0.25, h: 0.09, w: 0.09, cda: 0.011 };
const SHOE_PTS = [
  [-0.11, -0.03, 0.034],
  [-0.11, -0.03, -0.034],
  [0.0, -0.032, 0.04],
  [0.0, -0.032, -0.04],
  [0.115, -0.026, 0.03],
  [0.115, -0.026, -0.03],
  [0.135, 0.0, 0],
  [0.105, 0.026, 0.026],
  [0.105, 0.026, -0.026],
  [-0.125, 0.01, 0.03],
  [-0.125, 0.01, -0.03],
  [-0.09, 0.05, 0.04],
  [-0.09, 0.05, -0.04],
  [0.04, 0.045, 0.038],
  [0.04, 0.045, -0.038],
  [-0.03, 0.05, 0.042],
  [-0.03, 0.05, -0.042],
];
const SHOE_I = [SHOE.m / 12 * (SHOE.h ** 2 + SHOE.w ** 2), SHOE.m / 12 * (SHOE.l ** 2 + SHOE.w ** 2), SHOE.m / 12 * (SHOE.l ** 2 + SHOE.h ** 2)];
function kickShoe(s, kick, yaw, seed) {
  const R = mulberry(seed);
  const f = s.foot || footPos(s);
  // 向き = ブランコの角度（ひもに直角・前）を少しだけ上へ。足の振りの速さもそのまま乗る
  const a = s.th + 0.14, dx = Math.cos(a), dy = Math.sin(a);
  const vx = s.footV.x + dx * kick, vy = s.footV.y + dy * kick;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  // 靴の姿勢: つま先 = すねに直角（足の甲の向き）
  const ta = Math.atan2(f.shinX, -f.shinY);   // つま先の向き = すねを90°起こした向き
  const q = qAxis(0, 0, 1, ta);
  const spin = -(4 + 1.0 * kick) * (0.75 + 0.5 * R());
  return {

  const text = `${shareText()} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  window.__kutsu = {
    info: () => ({ seat: seatPos(sw), state, phase, pt, ext: ext || keyExt, th: sw.th / DEG, w: sw.w, amp: sw.peak / DEG, slack: sw.slackK, dist: lastDist, res: res ? { dist: res.dist, face: res.face, mat: res.mat, back: res.back, t: res.t, v0: res.v0, a0: res.a0 / DEG, slide: res.slide } : null, rec }),
    kick: (k = 6, yaw = 0) => kickNow(k, yaw), setExt: b => { ext = !!b; }, setSwing: (thDeg, w = 0) => { sw.th = thDeg * DEG; sw.w = w; sw.peak = sw.peakF = sw.peakB = Math.abs(thDeg) * DEG; },
    freeze: b => { frozen = !!b; }, look: (px, py, pz, lx, ly, lz) => { frozen = true; camera.position.set(px, py, pz); camera.lookAt(lx, ly, lz); renderer.render(scene, camera); }, swingInit, swingStep, kickShoe, simShoe, PARK, WEATHER, scene, camera,
  };
}

/* ---------- はじめ ---------- */
try { await Promise.race([document.fonts.load(`40px "Dela Gothic One"`), new Promise(r => setTimeout(r, 1500))]); } catch {}
buildLabels();
updateFlag();
paintSky(rec.weather);
sw = swingInit(0.5);
state = 'title';
fillTitle(); updateHud();
$('startBtn').disabled = false; $('startBtn').textContent = 'ブランコに乗る';
$('startBtn').focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
