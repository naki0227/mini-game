<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try { THREE = await import(THREE_URL); } catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- しゃぼん玉の物理（three には頼らない自前のモデル。長さは cm（飛ぶところは m）・液は cm³・膜の厚みは nm・秒） ----------
   液をつける: ストローの先を 液にひたしている時間 τ で、先につく液の量が決まる（V = V0 + (V1−V0)(1 − e^(−τ/TAU_DIP))）。
     長くひたすほど たっぷり＝大きくできるが、重い（下へ流れやすく、とばしたあと 落ちやすい）。
   ふくらむ: 息の強さ b（0〜1。指の上下で決めて、TAU_B 秒で ついてくる）が、膜の張力でストローへ押し戻す圧 LAP/D を超えた分だけ、
     膜の面積が 伸び率 ε = KG·(b − LAP/D)/(1 + D/DG) [1/s] で広がる（大きい玉ほど 空気が要るので ゆっくり）。
     息が弱い・止めていると ε = −KS·(LAP/D − b) でゆっくりしぼむ（小さい玉ほど速い）。直径 D = √(面積/π)。
   膜の厚み: 液は体積一定で 面積 πD² に広がる → 平均の厚み h = V/(πD²)。ふくらむほど 2乗で薄くなる。
     重力で 液は下へ流れる（流れる速さ ∝ h²。厚いほど速い）→ 下のしずく Vdrop にたまり、膜の液が減る。
     上の方は 時間とともに 下より薄くなる（上 = h·(1 − TOPK·(1 − e^(−age/TT)))）。日ざしと風で 乾く（面積あたり KE）。
   割れる: ① 伸びが速すぎる: 伸び率 + 風でゆすられる伸び（CW·w²·D/WREF）が、膜の耐えられる伸び率 EL·q·√(上の厚み/HREF) を超えると、
     超えた割合に比例して 膜が傷んでいき（100% 超えなら TD 秒）、傷みが 1 になったら ぱちん（戻せば TDR 秒で回復）。
     膜が薄いほど 弱い → 大きくなるほど ゆっくりでないと割れる。 ② 上の厚みが HPOP/q（黒い膜）より薄くなったら ぱちん。
     q は その回の膜のできのよさ（Q0〜Q1。液のなじみ具合）。
   風: 夏の午後のそよ風（OU ゆらぎ）+ ときどき 風鈴が鳴るくらいの風（sin² の山）。大きい玉ほど 風にゆすられ、
     |風|·D が WDET を超えると ストローから ちぎれて 飛んでいく（これは成功あつかい）。
   とばす: そのときの直径が記録。とんだ玉は 風と上昇気流にのって ただよう（重いと 落ちる）。乾いて薄くなる・地面に当たると ぱちん。 */
const PH = {
  DT: 1 / 240,
  D0: 1.2, S0: 0.45,                         // 膜ができたときの直径 cm・はじめの息の強さ
  V0: 0.012, V1: 0.6, TAU_DIP: 2.4, DIP_MAX: 6, LIFT: 0.55,   // 液 cm³・ひたす時間 s・かまえるまで s
  TAU_B: 0.35, LAP: 0.3, KG: 1.5, DG: 60, KS: 0.5,
  EL: 0.6, HREF: 1000, HPOP: 22, Q0: 0.8, Q1: 1.25,
  KD: 0.0025, HDR: 1000, HCAP: 4000, TOPK: 0.55, TT: 14, KE: 6e-8, KEW: 0.6,
  CW: 0.035, WREF: 40, WDET: 170, TD: 0.55, TDR: 0.8,
  W0: 0.15, W1: 0.7, WTAU: 1.4, GUST0: 0.8, GUST1: 2.3, GT0: 4, GT1: 11,
  IDLE_DIP: 9, IDLE_BLOW: 14, MAXBLOW: 150,
  TIP: [0, 1.0, 0], DIR: [0.2205, 0.1603, -0.9622],   // ストローの先（m）と 向き（玉はこの向きへ ふくらむ）
  KDR: 1.6, UP: 0.22, SINK: 0.9, KEF: 25, FLYMAX: 8, GONE: 9, GROUND: 0,
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const dipVol = tau => PH.V0 + (PH.V1 - PH.V0) * (1 - Math.exp(-Math.max(0, tau) / PH.TAU_DIP));
const topFac = age => 1 - PH.TOPK * (1 - Math.exp(-age / PH.TT));
// 膜の耐えられる伸び率（1/s）
const epsLimOf = (hTop, q = 1) => PH.EL * q * Math.sqrt(Math.max(0, hTop) / PH.HREF);
// 息 b のときの伸び率（風は入れない）
const epsOf = (b, D) => { const PL = PH.LAP / D; return b > PL ? PH.KG * (b - PL) / (1 + D / PH.DG) : -PH.KS * (PL - b); };
// 伸び率 e にするための息
const bFor = (e, D) => PH.LAP / D + Math.max(0, e) * (1 + D / PH.DG) / PH.KG;
// 入力は時刻つきで入れる（画面のコマとは関係なく、物理はその時刻で効く）
function gInput(g, t, kind, a = 0) { if (g.log) g.log.push({ t, kind, a }); const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, { t, kind, a }); }
function makeGame(seed = 1) {
  const r = mulberry((seed * 2654435761) >>> 0), rw = mulberry((seed * 40503 + 977) >>> 0);
  const g = {
    seed, rnd: r, rw, t: 0, queue: [], events: [], log: null,
    phase: 'dip', phaseAt: 0, dipping: false, dipT0: 0, dipDur: 0, auto: false,
    V: 0, Vdrop: 0, Vinit: 0, blowing: false, str: PH.S0, b: 0, D: PH.D0, maxD: PH.D0, age: 0,
    eps: 0, epsW: 0, eff: 0, dmg: 0, maxDmg: 0, epsLim: 9, margin: 1, minMargin: 1, h: 0, hTop: 0, hBot: 0, blowT: 0, idle: 0,
    wlv: PH.W0 + (PH.W1 - PH.W0) * rw(), wo: 0, w: 0, gust: null, gustAt: 0, upPh: rw() * 6.28,
    fl: null, res: null,
  };
  g.gustAt = 2.5 + 5 * rw(); g.q = PH.Q0 + (PH.Q1 - PH.Q0) * r();   // 膜のできのよさ（その回の液のなじみ。強い膜は 薄くても 伸びても もつ）
  return g;
}
function setPhase(g, ph) { g.phase = ph; g.phaseAt = g.t; g.events.push({ type: 'phase', phase: ph }); }
function endDip(g, t) {
  g.dipping = false; g.dipDur = Math.max(0, t - g.dipT0);
  g.V = g.Vinit = dipVol(g.dipDur); g.Vdrop = 0; g.D = PH.D0; g.age = 0;
  g.events.push({ type: 'dipOff', V: g.V, dur: g.dipDur });
  setPhase(g, 'lift');
}
function applyInput(g, e) {
  const k = e.kind;
  if (k === 'str') { g.str = clampP(e.a, 0, 1); return; }
  if (k === 'on') {
    if (g.phase === 'dip') { if (!g.dipping) { g.dipping = true; g.dipT0 = e.t; g.events.push({ type: 'dipOn' }); } return; }
    if (g.phase === 'lift' || g.phase === 'blow') { if (!g.blowing) { g.blowing = true; g.events.push({ type: 'blowOn' }); } }
    return;
  }
  if (k === 'off') {
    if (g.phase === 'dip') { if (g.dipping) endDip(g, e.t); return; }
    if (g.blowing) { g.blowing = false; g.events.push({ type: 'blowOff' }); }
    return;
  }

  else if (g.phase === 'lift' || g.phase === 'blow') { press = { id: e.pointerId, kind: 'blow', y0: e.clientY, s0: uiStr }; input('str', uiStr, t); input('on', 0, t); }
});
addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id || !game || state !== 'play' || press.kind !== 'blow') return;
  const s = clamp(press.s0 + (press.y0 - e.clientY) / PXS(), 0, 1);
  if (Math.abs(s - uiStr) > 0.004) { uiStr = s; input('str', s, evTime(e)); }
});
const ptrUp = e => {
  if (!press || e.pointerId !== press.id) return;
  if (game && state === 'play') input('off', 0, evTime(e));
  press = null;
};
addEventListener('pointerup', ptrUp);
addEventListener('pointercancel', ptrUp);
fxc.addEventListener('contextmenu', e => e.preventDefault());
for (const id of ['title', 'over']) {
  $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('button, a') || state === 'loading') return;
    if (id === 'over' && performance.now() - overShownAt < 400) return;
    e.preventDefault(); start();
  });
}
$('actBtn').addEventListener('pointerdown', e => e.stopPropagation());
$('actBtn').addEventListener('click', e => { if (game && state === 'play' && game.phase === 'blow') input('launch', 0, evTime(e)); });
// キーボード: スペース長押し = ひたす / ふーっ、↑↓ = 息の強さ、Enter = とばす
let keyBlock = false;
addEventListener('keydown', e => {
  const c = e.code;
  if (state === 'play' && game) {
    const g = game, t = evTime(e);
    if (c === 'Space' || c === 'Enter' || c === 'ArrowUp' || c === 'ArrowDown') e.preventDefault();
    if (g.res || g.phase === 'fly') { if ((c === 'Space' || c === 'Enter') && !e.repeat) endTap(); return; }
    if (bot) return;
    if (c === 'Space') { if (!e.repeat && !keyHold && !keyBlock) { wakeAudio(); keyHold = true; touched = true; if (g.phase !== 'dip') input('str', uiStr, t); input('on', 0, t); } return; }
    if (c === 'ArrowUp' || c === 'ArrowDown' || c === 'KeyW' || c === 'KeyS') { uiStr = clamp(uiStr + (c === 'ArrowUp' || c === 'KeyW' ? 0.04 : -0.04), 0, 1); input('str', uiStr, t); return; }
    if (c === 'Enter' && !e.repeat && g.phase === 'blow') { input('launch', 0, t); return; }
    return;
  }
  if (c !== 'Space' && c !== 'Enter') return;
  if (state === 'loading' || state === 'skip') return;
  const el = document.activeElement;
  if (el && el !== $('retryBtn') && el !== $('startBtn') && el.matches('button, a, input')) return;
  if (state === 'over' && performance.now() - overShownAt < 400) { e.preventDefault(); return; }
  e.preventDefault(); start();
  keyBlock = c === 'Space';   // 始めたスペースは、離すまで ひたさない
});
addEventListener('keyup', e => {
  if (e.code !== 'Space') return;
  if (keyHold && state === 'play' && game) input('off', 0, evTime(e));
  keyHold = false; keyBlock = false;
});
addEventListener('blur', () => { if ((press || keyHold) && game && state === 'play') input('off', 0, performance.now()); press = null; keyHold = false; });
$('startBtn').addEventListener('click', () => start());
$('retryBtn').addEventListener('click', () => start());
$('copyBtn').addEventListener('click', () => {
  const text = `${resInfo ? shareText(resInfo) : '🫧しゃぼん玉'} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;
  // 同じ入力（時刻つき）の列を、fps のコマ割りで物理に流しなおす（入力はそのコマで届くが、物理はその時刻で効く）
  // quant = true: 時刻を使わず「届いたコマの時刻」で効かせた場合（くらべ用）
  const replay = (log, seedR, fps, quant = false) => {
    const g = makeGame(seedR); let i = 0, tNow = 0;
    while (!g.res && tNow < 600) {
      tNow += 1 / fps;
      while (i < log.length && log[i].t <= tNow) { gInput(g, Math.max(g.t, quant ? tNow - LAG : log[i].t), log[i].kind, log[i].a); i++; }
      while (g.t + PH.DT <= tNow - LAG && !g.res) { stepGame(g); g.events.length = 0; }
    }
    const r = g.res || { kind: 'none', D: 0 };
    return { D: r2(r.D), kind: r.kind, cause: r.cause, Dpop: r2(r.Dpop || 0), float: r2(r.float || 0) };
  };
  const scr = (x, y, z = 0) => { const p = project(x, y, z); return { x: Math.round(p.x), y: Math.round(p.y) }; };
  const rect = id => { const el = $(id); if (!el || el.closest('[hidden]') || el.hidden) return null; const r = el.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2), w: Math.round(r.width), h: Math.round(r.height) }; };
  const ui = () => {
    const g = game, L = gaugeLayout(), B = bubbleScreen();
    return {
      state, phase: g ? g.phase : null,
      start: rect('startBtn'), act: rect('actBtn'), retry: rect('retryBtn'), copy: rect('copyBtn'), x: rect('xBtn'), hub: rect('hubBack'),
      // 長押しする場所（どこでもよい）と、指 1px あたりの息の強さ
      press: { x: Math.round(W * 0.42), y: Math.round(H * 0.58) }, pxPerStr: Math.round(PXS()), str: r3(uiStr),
      gauge: { x: Math.round(L.x), top: Math.round(L.top), bottom: Math.round(L.bottom) },
      bubble: B && { x: Math.round(B.x), y: Math.round(B.y), r: Math.round(B.r) }, tip: scr(TIP.x, TIP.y, TIP.z), cup: scr(cup.position.x, cup.position.y, cup.position.z),
    };
  };
  window.__shabondama = {
    info: () => {
      if (!game) return { state };
      const g = game, lim = Math.max(0, g.epsLim - g.epsW), hpop = PH.HPOP / g.q;
      return {
        state, phase: g.phase, t: r3(g.t), D: r2(g.D), maxD: r2(g.maxD),
        liquid: { V: r3(g.V), Vinit: r3(g.Vinit), Vdrop: r3(g.Vdrop), dip: r2(g.dipDur), name: liqName(g.Vinit) },
        film: { h: Math.round(g.h), hTop: Math.round(g.hTop), hBot: Math.round(g.hBot), hPop: r2(hpop), q: r3(g.q), age: r2(g.age) },
        breath: { str: r3(g.str), b: r3(g.b), blowing: g.blowing, uiStr: r3(uiStr) },
        strain: { eps: r3(g.eps), epsWind: r3(g.epsW), eff: r3(g.eff), epsLim: r3(g.epsLim), margin: r3(g.margin), dmg: r3(g.dmg) },
        wind: { w: r2(g.w), name: windName(g.w), gust: !!g.gust },
        // 目安: いまの膜で 余裕 4 割をのこす息・割れる手前の息・とばしどき
        meyasu: { safeStr: r3(clamp(bFor(0.6 * lim, g.D), 0, 1)), maxStr: r3(clamp(bFor(lim, g.D), 0, 1)), thinLeft: r2(g.hTop / hpop), launch: g.hTop < 2.2 * hpop ? 'いま とばす' : g.hTop < 3 * hpop ? 'そろそろ' : 'まだ いける' },
        flight: g.fl ? { x: r2(g.fl.x), y: r2(g.fl.y), z: r2(g.fl.z), t: r2(g.fl.t), end: g.fl.end } : null,
        res: g.res ? { ...g.res } : null, result: resInfo, rec, bot: !!bot, botStart, ff, frozen, seed: g.seed, queue: g.queue.length,
      };
    },
    ui,
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [直径cm...]（割れたら 0）。opts.seed0
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => r2(runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).D)),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), D = R.map(r => r.D), causes = {};
      for (const r of R) { const k = r.kind + ':' + r.cause; causes[k] = (causes[k] || 0) + 1; }
      const F = R.filter(r => r.kind === 'fly').map(r => r.float);
      return { skill, N, p10: r2(q(D, 0.1)), p25: r2(q(D, 0.25)), p50: r2(q(D, 0.5)), p75: r2(q(D, 0.75)), p90: r2(q(D, 0.9)), min: r2(Math.min(...D)), max: r2(Math.max(...D)), mean: r2(D.reduce((a, b) => a + b, 0) / N), ge5: R.filter(r => r.D >= 5).length / N, ge10: R.filter(r => r.D >= 10).length / N, ge30: R.filter(r => r.D >= 30).length / N, ge60: R.filter(r => r.D >= 60).length / N, ge100: R.filter(r => r.D >= 100).length / N, popRate: R.filter(r => r.kind === 'pop').length / N, floatP50: F.length ? r2(q(F, 0.5)) : 0, meanLiquid: r3(R.reduce((a, r) => a + r.V, 0) / N), causes };
    },
    // ボットの入力の列（時刻つき）を記録して、13 / 30 / 60 / 144 fps のコマ割りで流しなおす（frameQuantized は時刻を使わなかった場合）
    fpsCheck: (skill = 'first', seedR = 4242) => {
      const r = runBot(SKILLS[skill], seedR, { log: true });
      return { live: { D: r2(r.D), kind: r.kind, cause: r.cause, Dpop: r2(r.Dpop), float: r2(r.float) }, fps13: replay(r.log, seedR, 13), fps30: replay(r.log, seedR, 30), fps60: replay(r.log, seedR, 60), fps144: replay(r.log, seedR, 144), fps30frameQuantized: replay(r.log, seedR, 30, true), fps60frameQuantized: replay(r.log, seedR, 60, true), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる（記録はしない）
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.res) { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; press = null; keyHold = false; syncCtrl(); } },
    skip: s => skipTo(game.t + s),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    screen: (x, y, z = 0) => scr(x, y, z),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, epsLimOf, bFor, dipVol, game: () => game,
  };
}
