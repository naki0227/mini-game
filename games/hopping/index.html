<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3D の読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
const HASH = new URLSearchParams(location.hash.slice(1));
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;

/*PHYS-BEGIN*/
/* ---------- ホッピングの 物理（three には 頼らない 自前。長さ m・速さ m/s・時間 秒・角度 rad） ----------
   2D（x = 進む 向き、y = 上）。子ども + ホッピング を 1本の 棒（足先 → 重心 L）と みる。th = 棒の かたむき（真上から 前が ＋）。
   空中: 重心は 放物線。棒の 角は 指の 位置 u（−1 … 1）で きまる 角 cmdTh(u) へ TAU 秒で ついて いく
     （u = 0 は 速さ V0 で ちょうど つりあう 着き方。右 = 足先を うしろへ = 前のめり、左 = 足先を 前へ = ブレーキ）。
   着地（足先が 地面に ふれた とき）: 足先を 支点に した さかさ ふりこ（重心の 高さ 一定）を TS 秒:
     x'' = OM²·(x − 足先) （坂は −G·勾配·SLK も）。足先が 重心より うしろ なら 速く なり、前 なら おそく なる。
     ちょうど 真ん中で 左右 対称に なる 着き方なら 速さは そのまま。同じ 着き方を つづけると ずれは 毎回 LAM 倍に ふくらむ（ほうって おくと ころぶ）。
   ばね: 着地の 瞬間の「ため」cS（指を 下の 帯に 入れて いた 長さ）で 押しこみが 長く なり（TS·(1+TSC·cS)）、高く とぶ（VY·(1+VYC·cS)）。
     ため 着地は ふりこの 時間が のびる ぶん ずれも 大きく ふくらむ。
   はねる たびに 体が ぐらっと ゆれる（速さに ランダムな ずれ。すすむほど 大きく、上限なし）。
   ころぶ: 速すぎ（VMAX 超）= つんのめり、おそすぎ（VMIN 未満）= うしろへ しりもち、かたむき THF 超、
     段差の かべに 足先が ぶつかる（ためが 足りない）、みぞに 足先が 入る、水たまり・マンホールに 斜めに つく（すべる）、ねこの 上に つく。
   石 = 着地で 大きく ぐらっ。水たまり・マンホール = すべって 足の きき（OM²）が へり、ぐらっ。
   入力は すべて 時刻つき（画面の コマには よらない）: down / move（u, ch）/ up / set（キーボード）。物理は 1/240 秒きざみ。 */
const PH = {
  DT: 1 / 240, G: 9.8, L: 0.95, OM: 4.4, TS: 0.2, TSC: 0.45, VY: 2.1, VYC: 0.58,
  V0: 1.3, DMAX: 0.22, TAU: 0.07, CH_UP: 0.2, CH_DN: 0.12,
  VMAX: 2.9, VMIN: 0.2, THF: 0.62, SLK: 0.8, T_DOWN: 0.85,
  K0: 0.1, K1: 0.14, KN: 60, K2: 0.0014,
  PEB: 0.42, SLIP: 0.5, PUD_TH: 0.24, MAN_TH: 0.32, PUD_K: 0.28, MAN_K: 0.14,
  CAT_V: 0.85, CAT_R: 0.24, CAT_Z: 0.32, PW: 2.0,
};
PH.PN0 = -(PH.V0 / PH.OM) * Math.tanh(PH.OM * PH.TS / 2);
const LAM = Math.cosh(PH.OM * PH.TS), GAIN = PH.OM * Math.sinh(PH.OM * PH.TS), KD = LAM / (GAIN * PH.DMAX);
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
const hash2 = (a, b) => { let h = Math.imul((a ^ 0x9e3779b9) | 0, 0x85ebca6b) ^ Math.imul((b + 0x632be5ab) | 0, 0xc2b2ae35); h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; return h >>> 0; };
const gaussH = (seed, i) => { const r = mulberry(hash2(seed, i)); return (r() + r() + r() + r() - 2) * 1.732; };
const cmdTh = u => Math.asin(clampP((PH.PN0 + clampP(u, -1, 1) * PH.DMAX) / PH.L, -0.9, 0.9));
const kickSig = n => PH.K0 + PH.K1 * (1 - Math.exp(-n / PH.KN)) + PH.K2 * n;
/* ---------- 道（seed で きまる。区切りごとに 平ら・石・水たまり・マンホール・段差・坂・みぞ・ねこ） ---------- */
function makeWorld(seed) { const w = { seed, seg: [], haz: [], cats: [], marks: [], genX: -30, gy: 0, nGen: 0, nHaz: 0 }; addSeg(w, 34.6); return w; }
function addSeg(w, len, dy = 0, gap = 0) {
  const x0 = w.genX, x1 = x0 + len;
  if (gap) w.seg.push({ x0, x1, y0: w.gy - 0.42, y1: w.gy - 0.42, gap: 1, rim: w.gy });
  else { w.seg.push({ x0, x1, y0: w.gy, y1: w.gy + dy, gap: 0, rim: w.gy }); w.gy += dy; }
  w.genX = x1;
}
function genStep(w) {
  const r = mulberry(hash2(w.seed, 7001 + w.nGen++)), X = w.genX, lvl = 1 - Math.exp(-X / 90);
  const space = Math.max(0.85, 3.3 - 1.7 * lvl - 0.0035 * X) * (0.7 + 0.6 * r());
  addSeg(w, space);
  const wt = { pebble: 3, puddle: X > 10 ? 2 : 0, up: X > 6 && w.gy < 0.75 ? 2.2 : 0, down: X > 6 && w.gy > -0.35 ? 1.2 : 0, slope: X > 22 ? 1.4 : 0, gap: X > 30 ? 1.8 : 0, manhole: X > 18 ? 1 : 0, cat: X > 40 ? 0.8 : 0 };
  let tot = 0; for (const k in wt) tot += wt[k];
  let u = r() * tot, type = 'pebble';
  for (const k in wt) { if (wt[k] > 0 && (u -= wt[k]) < 0) { type = k; break; } }
  const x = w.genX;
  if (type === 'pebble') {
    const n = r() < 0.2 + 0.3 * lvl ? 2 : 1;
    for (let i = 0; i < n; i++) { const c = x + 0.15 + i * 0.3; w.haz.push({ id: w.nHaz++, type: 'pebble', a: c - 0.075, b: c + 0.075, x: c, s: r() < 0.5 ? -1 : 1 }); }
    addSeg(w, 0.3 + 0.3 * (n - 1));
  } else if (type === 'puddle' || type === 'manhole') {
    const len = type === 'manhole' ? 0.62 : 0.42 + (0.25 + 0.4 * lvl) * r();
    w.haz.push({ id: w.nHaz++, type, a: x, b: x + len, x: x + len / 2, s: r() < 0.5 ? -1 : 1 });
    addSeg(w, len);
  } else if (type === 'up') {
    const h = 0.07 + 0.08 * r() + 0.15 * lvl * r();
    w.marks.push({ type: 'up', x, h }); w.gy += h; addSeg(w, 0.6);
  } else if (type === 'down') {
    const h = 0.08 + 0.12 * r();
    w.marks.push({ type: 'down', x, h }); w.gy -= h; addSeg(w, 0.6);
  } else if (type === 'slope') {
    const len = 2.4 + 3 * r(), gr = (0.05 + 0.08 * r()) * (0.5 + 0.5 * lvl);
    let sg = w.gy > 0.35 ? -1 : w.gy < -0.35 ? 1 : (r() < 0.5 ? -1 : 1);
    w.marks.push({ type: sg > 0 ? 'su' : 'sd', x, x1: x + len }); addSeg(w, len, sg * gr * len);
  } else if (type === 'gap') {
    const wd = 0.2 + 0.18 * r() + 0.17 * lvl * r();
    w.marks.push({ type: 'gap', x, w: wd }); addSeg(w, wd, 0, 1); addSeg(w, 0.35);
  } else if (type === 'cat') {
    const c = x + 0.3;
    w.cats.push({ id: w.nHaz++, type: 'cat', x: c, dir: r() < 0.5 ? 1 : -1, trig: 2.3 + 1.5 * r(), col: Math.floor(r() * 3) });
    addSeg(w, 0.6);
  }
}
function genUntil(w, x) { while (w.genX < x) genStep(w); }
function segAt(w, x) { const S = w.seg; let lo = 0, hi = S.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (S[m].x0 <= x) lo = m; else hi = m - 1; } return S[lo]; }
const segY = (s, x) => s.y0 + (s.y1 - s.y0) * clampP((x - s.x0) / (s.x1 - s.x0 || 1), 0, 1);
const groundAt = (w, x) => segY(segAt(w, x), x);
function hazAt(w, x) {
  const H = w.haz; let lo = 0, hi = H.length - 1, j = -1;

    const k = g.k;
    if (!alive(k)) return ptr.down ? { action: 'up', inMs: 0, x: Math.round(ptr.x), y: Math.round(ptr.y), why: k.ph } : { action: 'wait', inMs: 100, why: k.ph };
    const key = k.land + (k.ph === 'air' ? 'a' : 's');
    if (hint.key !== key) {
      const te = Math.max(g.t, performance.now() / 1000 - base) + 0.05;
      const p = plan(g, te);
      hint = { key, u: p ? p.u : 0, ch: p ? p.ch : 0, cost: p ? r2(p.cost) : null, at: performance.now() };
      hint.x = xOfU(hint.u); hint.y = yOfCh(hint.ch);
    }
    const vMs = k.ph === 'air' ? Math.max(0, Math.round((predictFoot(g) ? 1 : 0) * 1000 * Math.max(0, (k.vy + Math.sqrt(Math.max(0, k.vy * k.vy + 2 * PH.G * Math.max(0, k.y - PH.L * Math.cos(k.th) - groundAt(g.w, k.x))))) / PH.G - 0.12))) : Math.round(1000 * (PH.TS * (1 + PH.TSC * k.cS) - (g.t - k.ts) + 0.3));
    if (!ptr.down) return { action: 'down', x: hint.x, y: hint.y, inMs: 0, holdMs: 0, validMs: vMs, windowMs: Math.round(leanSpan() / 12), what: '押す（押した まま 左右で かたむけ、下の 帯で ためる）', u: r2(hint.u), ch: hint.ch };
    if (Math.abs(ptr.x - hint.x) > 1.5 || chOfY(ptr.y) !== hint.ch) return { action: 'move', x: hint.x, y: hint.y, inMs: 0, validMs: vMs, windowMs: Math.round(leanSpan() / 12), what: '押した まま ここへ', u: r2(hint.u), ch: hint.ch };
    return { action: 'wait', inMs: 30, why: 'hold（そのまま）', x: hint.x, y: hint.y };
  };
  const statOf = (R_, key) => { const d = R_.map(r => r[key]); return { p10: q(d, 0.1), p25: q(d, 0.25), p50: q(d, 0.5), p75: q(d, 0.75), p90: q(d, 0.9), min: Math.min(...d), max: Math.max(...d), mean: mean(d) }; };
  window.__hopping = {
    info: (opt = {}) => {
      if (!game) return { state };
      const g = game, k = g.k, e = k.vx - PH.V0;
      return {
        state, t: r3(g.t), phase: k.ph, over: g.over, end: g.end, score: scoreOf(g), hops: k.n, lands: k.land,
        kid: { x: r2(k.x), y: r2(k.y), vx: r2(k.vx), vy: r2(k.vy), thDeg: r1(k.th * 57.3), e: r2(e), needle: r2(clamp(e > 0 ? e / (PH.VMAX - PH.V0) : e / (PH.V0 - PH.VMIN), -1, 1)), charge: r2(k.ch), stanceCharge: r2(k.cS), lastHaz: k.haz },
        input: { u: r2(k.u), ch: k.chIn, ptr: !!k.ptr, client: { down: ptr.down, x: Math.round(ptr.x), y: Math.round(ptr.y) } },
        ahead: [...g.w.marks.filter(m => m.x > k.x - 0.2 && m.x < k.x + 5).map(m => ({ type: m.type, x: r2(m.x) })), ...g.w.haz.filter(h => h.x > k.x - 0.2 && h.x < k.x + 5).map(h => ({ type: h.type, a: r2(h.a), b: r2(h.b) })), ...g.w.cats.filter(c => c.x > k.x - 0.2 && c.x < k.x + 5).map(c => ({ type: 'cat', x: r2(c.x), z: r2(catZ(k, c, g.t)) }))],
        pred: pred && k.ph === 'air' ? { x: r2(pred.x), haz: pred.haz, ok: pred.ok } : null,
        kickSigma: r3(kickSig(k.n)),
        next: opt.next === false ? undefined : nextOf(g),
        bot: !!bot, botStart, ff, frozen, rec, seed: g.seed, now: Math.round(performance.now()),
        note: 'th = 棒の かたむき（前＋）。e = 速さ − 目安の 速さ（＋ = 前のめり）。needle = かたむき目もり（±1 で ころぶ）。u = 指（−1 左 … 1 右）',
      };
    },
    ui, inputs: () => inLog.slice(-30),
    // 物理だけでボットに N 回遊ばせる: sim('first', 100) → [回 ...]（'first' / 'good' / 'pro' / 'next' / 'mash' / 'hold' / 'none' / {kind:'fixed', u, ch}）
    sim: (skill = 'first', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(typeof skill === 'string' ? SKILLS[skill] : skill, (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'first', N = 100, opts = {}) => {
      const sk = typeof skill === 'string' ? SKILLS[skill] : skill;
      const R_ = Array.from({ length: N }, (_, i) => runBot(sk, (opts.seed0 ?? 1000) + i, opts)), ends = {};
      for (const r of R_) ends[r.end] = (ends[r.end] || 0) + 1;
      return { skill: typeof skill === 'string' ? skill : 'custom', N, n: statOf(R_, 'n'), seconds: statOf(R_, 't'), ge5: R_.filter(r => r.n >= 5).length / N, ends };
    },
    // 見ないで 決まった 押し方（同じ 位置で 押しっぱなし・ためっぱなし・連打・左右 交互・何もしない）。どれも ふつうの 初めての 人より 伸びないこと
    mashGrid: (N = 24) => {
      const out = [], run = (nm, sk) => { const d = Array.from({ length: N }, (_, i) => runBot(sk, 3000 + i).n); out.push({ name: nm, p50: q(d, 0.5), mean: mean(d), max: Math.max(...d) }); };
      for (const ch of [0, 1]) for (let u = -1; u <= 1.001; u += 0.1) run(`fixed u=${r1(u)} ch=${ch}`, { kind: 'fixed', u, ch });
      for (const [on, off] of [[0.06, 0.06], [0.1, 0.1], [0.2, 0.2], [0.3, 0.5], [0.5, 0.5]]) run(`mash ${on}/${off}`, { kind: 'mash', on, off });
      for (const a of [0.2, 0.4, 0.7, 1]) run(`sway ${a}`, { kind: 'sway', a });
      run('hold', SKILLS.hold); run('none', SKILLS.none);
      return out.sort((a, b) => b.p50 - a.p50 || b.mean - a.mean);
    },
    fpsCheck: (skill = 'good', seedR = 4242) => {
      const r = runBot(SKILLS[skill], seedR, { log: true }), e = r.t + 5;
      return { live: { n: r.n, end: r.end }, fps13: replay(r.log, seedR, 13, false, e), fps30: replay(r.log, seedR, 30, false, e), fps60: replay(r.log, seedR, 60, false, e), fps144: replay(r.log, seedR, 144, false, e), fps30frameQuantized: replay(r.log, seedR, 30, true, e), fps60frameQuantized: replay(r.log, seedR, 60, true, e), inputs: r.log.length };
    },
    autoplay: (skill = 'good') => { if (game && state === 'play' && !game.over) { if (game.k.ptr) gInput(game, game.t + 1e-6, 'up', 0, 0); ptr.id = null; ptr.down = false; bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (sec, pose = 'none') => skipTo(game.t + sec, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    fps: () => new Promise(res => { let n = 0; const t0 = performance.now(); const f = () => { n++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); else res(n); }; requestAnimationFrame(f); }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, texs: renderer.info.memory.textures }),
    PH, SKILLS, makeGame, runBot, stepGame, gInput, makeBot, plan, game: () => game,
  };
}
