<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try { THREE = await import(THREE_URL); } catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 雪合戦の物理（three には頼らない。単位は m・秒。当たり外れは全部この結果から） ----------
   座標: y が上。自分は z = 0 の雪壁のうしろ、相手の子は奥（z = −D）。x は右。
   雪玉: 半径 RB の球。手（REL）から、強さ p と向き yaw で投げる。
     速さ v = √(V0² + (V1² − V0²)·p)（引いた長さに だいたい比例して遠くへ届く）、上向きの角度 = TH0 + TH1·p（強いほど少し高く）。
     重力 と 空気抵抗 −KD·|v−風|·(v−風)（軽い雪玉なので風に流される）。1/1000 秒きざみ。
   相手の子: 頭（球）・胴（縦のカプセル）・脚（縦のカプセル）。しゃがむ度合い c（0 立つ … 1 かくれる）で全体が DROP·c 下がる。
     動きは回ごとに決めた「時刻 → 横位置 x・しゃがみ c」の表（なめらかにつなぐ）。顔を出す・横から出る・壁から壁へ走る・ジグザグ など。
   かくれもの: 雪の壁（箱）・かまくら（半球）・雪だるま（球2つ）・木（幹の円柱と枝の雪）。雪玉が触れたら崩れる（外れ）。
   当たり: 雪玉の球と子の体の接触。地面・かくれもの・遠くへ抜けた で外れ。3回外したらおしまい。
   子は一定の時間（PAT 秒）当てられないと逃げる（外れ1回）。だから何もしなくても終わる。
   相手も投げ返してくる（見た目だけ。狙っている＝立っているときに来ると顔に当たる。点には関係ない）。 */
const PH = {
  G: 9.8, DT: 1 / 1000, RB: 0.06, KD: 0.010,
  REL: [0.22, 1.42, -0.35],               // 雪玉を離すところ（右手）
  V0: 0.5, V1: 18.6, TH0: 15, TH1: 9,     // 強さ p → 速さ・角度
  PMIN: 0.06, YAW_S: 0.62,                // 横に L 引くと 0.62 rad
  HEAD_Y: 1.18, HEAD_R: 0.15, CHEST_Y: 0.95, HIP_Y: 0.55, TORSO_R: 0.21, LEG_Y0: 0.12, LEG_R: 0.12, DROP: 0.62,
  RELOAD: 0.45, HIT_WAIT: 1.25, GONE_WAIT: 0.9, PAT: 11, MISS_MAX: 3, PREVIEW_N: 5,
};
const DEGR = Math.PI / 180;
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));
// 当てた回数 n による難しさ。上限は決めず、ゆっくり上がりつづける
function diffOf(n) {
  const k = 1 - Math.exp(-n / 22);
  return {
    k,
    D: Math.min(25, 7 + 8 * k + 0.05 * n),            // 距離 m
    wind: 0.2 + 3.0 * k + 0.02 * n,                   // 風 m/s
    up: Math.max(0.5, 2.3 - 1.35 * k - 0.004 * n),    // 顔を出している時間 s
    down: 0.8 + 0.6 * k,                              // かくれている時間 s
    run: 1.1 + 2.5 * k + 0.012 * n,                   // 走る速さ m/s
    side: 0.1 + 0.16 * k,                             // 横の広がり（× 距離）
    slide: Math.max(0.16, 0.32 - 0.14 * k),           // 出る・引っこむ時間 s
  };
}
// 入力は時刻つきで入れる（画面のコマとは関係なく、物理はその時刻で効く）
function gInput(g, t, type, a = 0, b = 0) { const q = g.queue; let i = q.length; while (i > 0 && q[i - 1].t > t) i--; q.splice(i, 0, { t, type, a, b }); }

/* 子の動きの表を作る */
const KID_COLS = 5;
function makeRound(g) {
  const r = g.rnd, n = g.n, d = diffOf(n);
  const D = d.D * (0.93 + 0.14 * r()), kz = -D;
  const R = { id: ++g.rid, n, t0: g.t, D, kz, covers: [], keys: [], thr: [], thrI: 0, pat: '', col: g.rid % KID_COLS, wx: 0, wz: 0, wph: r() * 6.283, A: 0, _i: 0, side: 1 };
  const wa = d.wind * (0.5 + 0.5 * r()); R.wx = (r() < 0.5 ? -1 : 1) * wa; R.wz = (r() * 2 - 1) * wa * 0.3;
  const A = Math.min(3.6, 0.5 + d.side * D); R.A = A;
  let pat;
  if (n < 2) pat = 'stand';
  else if (n < 4) pat = r() < 0.5 ? 'step' : 'peek';
  else if (n < 7) pat = ['step', 'peek', 'walk', 'side'][Math.floor(r() * 4)];
  else {
    const w = { peek: 0.28, side: 0.26, step: Math.max(0.04, 0.16 - 0.005 * n), walk: Math.max(0.05, 0.22 - 0.005 * n), run: Math.min(0.32, 0.06 + 0.008 * n), zig: n >= 12 ? Math.min(0.3, 0.04 + 0.006 * n) : 0 };
    let s = 0; for (const k in w) s += w[k];
    let u = r() * s; pat = 'peek'; for (const k in w) { u -= w[k]; if (u <= 0) { pat = k; break; } }
  }
  R.pat = pat;
  const K = R.keys; let t = 0;
  const key = (dt, x, c) => { t += dt; K.push({ t, x, c }); };
  const x0 = (r() * 2 - 1) * Math.min(A * 0.6, 1.2);
  if (pat === 'stand') {
    K.push({ t: 0, x: x0, c: 0 }); key(99, x0, 0);
    const s = r() < 0.5 ? -1 : 1;
    R.covers.push(r() < 0.5 ? { type: 'snowman', x: x0 + s * 1.35, z: kz + 0.4 } : { type: 'wall', x: x0 + s * 1.7, z: kz + 0.6, w: 1.5, h: 0.95, d: 0.5 });
  } else if (pat === 'step') {
    // 立ったまま、ときどき横へ一歩二歩
    let x = x0;
    K.push({ t: 0, x, c: 0 }); key(1.2 + 0.8 * r(), x, 0);
    while (t < 40) { let nx = x + (r() < 0.5 ? -1 : 1) * (0.45 + 0.4 * r()); if (Math.abs(nx) > A) nx = x - (nx - x); key(0.55, nx, 0); key(1.3 + 1.0 * r() - 0.6 * d.k, nx, 0); x = nx; }
    const s = r() < 0.5 ? -1 : 1;
    R.covers.push({ type: 'tree', x: s * (A + 2.3), z: kz - 0.6 });
  } else if (pat === 'walk') {
    const v = 0.5 + 1.0 * d.k + 0.006 * n, xa = -A * (0.7 + 0.3 * r()), xb = A * (0.7 + 0.3 * r());
    let a = r() < 0.5 ? xa : xb, b = a === xa ? xb : xa;
    K.push({ t: 0, x: a, c: 0 }); key(0.4 + 0.5 * r(), a, 0);
    while (t < 40) { key(Math.abs(b - a) / v * 1.2, b, 0); key(0.6 + 0.8 * r() - 0.4 * d.k, b, 0); [a, b] = [b, a]; }
    const s = r() < 0.5 ? -1 : 1;
    R.covers.push({ type: 'snowman', x: s * (A + 1.4), z: kz + 0.3 });
  } else if (pat === 'peek') {
    R.covers.push({ type: 'wall', x: x0, z: kz + 0.7, w: 1.9, h: 0.95, d: 0.5 });
    let x = x0;
    K.push({ t: 0, x, c: 1 }); key(0.5 + 0.6 * r(), x, 1);
    while (t < 40) {
      key(d.slide * 0.8, x, 0); key(d.up * (0.75 + 0.5 * r()), x, 0); key(d.slide * 0.8, x, 1); key(d.down * (0.6 + 0.8 * r()), x, 1);
      if (n >= 10 && r() < 0.6) { const nx = x0 + (r() * 2 - 1) * 0.55; key(0.35, nx, 1); x = nx; }
    }
  } else if (pat === 'side') {
    const kind = ['kama', 'snowman', 'tree'][Math.floor(r() * 3)];
    let off, ch;
    if (kind === 'kama') { R.covers.push({ type: 'kama', x: x0, z: kz + 1.0, r: 1.15 }); off = 1.62; ch = 0.5; }
    else if (kind === 'snowman') { R.covers.push({ type: 'snowman', x: x0, z: kz + 0.55 }); off = 0.82; ch = 0.15; }
    else { R.covers.push({ type: 'tree', x: x0, z: kz + 0.5 }); off = 0.66; ch = 0.3; }
    K.push({ t: 0, x: x0, c: ch }); key(0.5 + 0.6 * r(), x0, ch);
    while (t < 40) {
      const s = r() < 0.5 ? -1 : 1, xe = x0 + s * off;
      key(d.slide, xe, 0); key(d.up * (0.7 + 0.5 * r()), xe, 0); key(d.slide, x0, ch); key(d.down * (0.6 + 0.8 * r()), x0, ch);
    }
  } else if (pat === 'run') {
    const xa = -A, xb = A;

      for (let i = 0; i < len; i++) { b = b * 0.75 + (Math.random() * 2 - 1) * 0.25; d[i] = b * 2.2; }
      // 飛んでいる雪玉の風切り: 低いノイズを、速さで
      const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 340; f.Q.value = 0.9;
      const g = ac.createGain(); g.gain.value = 0;
      s.connect(f).connect(g).connect(master); s.start();

  } catch {}
}
const live = () => ac && state === 'play';
function updateWhoosh() {
  if (!whoosh) return;
  try {
    const n0 = ac.currentTime, B = game && game.ball, O = game && game.ob;
    let v = 0;
    if (live() && !frozen) { if (B) v = Math.hypot(B.vx, B.vy, B.vz) * clamp(1.2 - (game.t - B.t0) * 0.8, 0.25, 1); if (O && O.z > -6) v = Math.max(v, 14 * clamp((O.z + 6) / 6, 0, 1)); }
    whoosh.g.gain.setTargetAtTime(clamp((v - 5) / 14, 0, 1) * 0.06, n0, 0.03);

}
function tone(freq, at, dur, vol, type = 'sine', f1) {

}
function noise(at, dur, vol, type, freq, q = 1, lpF = 1100) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpF;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);

// 「ぼすっ」: 低いどすん ＋ こもった雪の崩れ
function bosu(at, k) { tone(120, at, 0.16, 0.2 * k, 'sine', 58); noise(at, 0.13, 0.22 * k, 'lowpass', 520, 0.7, 700); noise(at + 0.01, 0.2, 0.08 * k, 'bandpass', 300, 0.8, 600); }

// 「きゅっ」: 雪を踏む（こもった短いきしみ）
function sStep(k = 1) { try { if (!live()) return; const n0 = ac.currentTime; noise(n0, 0.07, 0.07 * k, 'bandpass', 640, 3, 900); noise(n0 + 0.035, 0.06, 0.05 * k, 'bandpass', 520, 3, 900); } catch {} }

function sFail() { try { if (!live()) return; const n0 = ac.currentTime + 0.25; tone(262, n0, 0.14, 0.05, 'triangle'); tone(196, n0 + 0.16, 0.45, 0.06, 'sine', 160); } catch {} }

/* ---------- ループ ---------- */
let lastTs = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000); lastTs = now;
  step(dt);
  render(Math.max(dt, 1 / 240));
  updateWhoosh();
  requestAnimationFrame(frame);
}

/* ---------- 入力: 押して下へ引いて離す。強さ・向きは「離した瞬間の位置」だけで決まる（引く速さは関係ない）。時刻つきで物理へ ---------- */
function start() {
  wakeAudio(); state = 'play';
  $('title').hidden = true; $('over').hidden = true; $('hud').hidden = false;
  const bn = HASH.has('debug') && HASH.get('bot') && SKILLS[HASH.get('bot')] ? HASH.get('bot') : null;
  botStart = !!bn;   // #bot=… で始めたプレイは記録しない（撮影・確認用）
  newGame(nextSeed(), bn); frozen = false; setMileLevel(0); throwAnim = -9;
  updateHud();
  // #debug&skip=秒: その秒数だけ一気に進め、自分の雪玉が子に当たる直前で止める（OGP 撮影・確認用。bot=good と組み合わせる。freeze=1 で止めたまま）
  if (HASH.has('debug') && +HASH.get('skip') > 0) skipTo(game.t + +HASH.get('skip'), HASH.get('pose') || 'prehit');
  if (HASH.has('debug') && HASH.get('ff') === '1') ff = true;
}
// 飛んでいる雪玉が子に当たるか（先読み。物理と同じ 1/1000 秒きざみ）→ 当たる時刻
function predictMine(g) {
  if (!g.ball || g.phase !== 'play') return null;
  const B = { ...g.ball }, R = g.R; let t = g.t;
  while (t - g.t < 5) { t += PH.DT; ballStep(B, PH.DT, R, t, 1); const res = ballCheck(R, B, t, true); if (res) return { kind: res.kind, t }; }
  return null;
}
// pose=prehit: 指定の秒数のあと、雪玉が子に当たる before 秒前まで進める

  const quiet = state; state = 'skip';
  const lim = t1 + 60, before = +(HASH.get('before') || 0.2);
  while (game.phase !== 'over' && game.t < lim) {
    if (game.t >= t1) {
      if (pose !== 'prehit') break;
      const P = predictMine(game);
      if (P && P.kind === 'kid' && P.t - game.t <= before) break;
    }
    if (bot) bot.step(); stepGame(game);
    if (game.events.length) handleEvents();

  state = quiet;
  pops = []; failAt = game.phase === 'over' ? tt : -1; shake = 0; whiteout = 0; speech = null; splats = []; hitFx = null;
  trail = [];
  if (game.ball) { const B = game.ball; for (let i = 8; i >= 0; i--) trail.push({ x: B.x - B.vx * i * 0.03, y: B.y - B.vy * i * 0.03 - 4.9 * (i * 0.03) ** 2 * 0, z: B.z - B.vz * i * 0.03, t: tt - i * 0.03 }); throwAnim = tt - Math.min(0.3, game.t - B.t0); }
  setMileLevel(MILES.filter(m => m <= game.n).length);
  for (const l of lamps) l.on2 = l.want;
  syncRound();
  base = performance.now() / 1000 - game.t;
  if (HASH.get('freeze') === '1') frozen = true;
}
fxc.addEventListener('pointerdown', e => {
  e.preventDefault(); wakeAudio();
  if (state !== 'play' || !game) return;
  if (game.phase === 'over') { if (failAt >= 0 && tt - failAt > 0.4) showOver(); return; }
  if (bot) return;
  try { fxc.setPointerCapture(e.pointerId); } catch {}
  kb = null;
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, moved: false };
  input('aim', evTime(e));
  sStep(0.8);
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;

addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;

  const d = drag; drag = null;
  const a = pullToAim(e.clientX - d.x0, e.clientY - d.y0);
  if (state !== 'play' || !game || bot) return;

  $(id).addEventListener('pointerdown', e => {

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 同じ入力（時刻つき）の列を、fps コマ割りで物理に流しなおす（入力はそのコマで届くが、物理はその時刻で効く）
  const replay = (log, seedR, fps) => {
    const g = makeGame(seedR); let i = 0, tNow = 0;
    while (g.phase !== 'over' && tNow < 3000) {

  };
  window.__yukigassen = {
    info: () => {
      if (!game) return null;
      const g = game, R = g.R, tau = g.t - R.t0, P = kidPose(R, tau);
      windAt(R, g.t);
      return {
        state, phase: g.phase, t: r3(g.t), n: g.n, miss: g.miss, fail: g.fail, throws: g.throws, ready: g.phase === 'play' && !g.ball && g.t >= g.readyAt,
        round: { id: R.id, pat: R.pat, D: r2(R.D), tau: r2(tau), escIn: r2(PH.PAT - tau), covers: R.covers.map(c => c.type) },
        kid: { x: r2(P.x), c: r2(P.c), z: r2(R.kz), visible: !!aimPointOf(R, P) }, wind: { x: r2(WX), z: r2(WZ) },
        ball: g.ball && { x: r2(g.ball.x), y: r2(g.ball.y), z: r2(g.ball.z) },
        kidScreen: scr(P.x, 0.78 - P.c * PH.DROP, R.kz), headScreen: scr(P.x, PH.HEAD_Y - P.c * PH.DROP, R.kz),

    sim: (skill = 'good', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).n),
    stats: (skill = 'good', N = 100, opts = {}) => {

      const kinds = {}, misses = {}; for (const r of R) { kinds[r.fail] = (kinds[r.fail] || 0) + 1; for (const m of r.misses) misses[m] = (misses[m] || 0) + 1; }
      return { skill, N, p10: q(n, 0.1), p25: q(n, 0.25), p50: q(n, 0.5), p75: q(n, 0.75), p90: q(n, 0.9), min: Math.min(...n), max: Math.max(...n), ge1: R.filter(r => r.n >= 1).length / N, ge10: R.filter(r => r.n >= 10).length / N, ge30: R.filter(r => r.n >= 30).length / N, ge50: R.filter(r => r.n >= 50).length / N, mean: +(n.reduce((a, b) => a + b, 0) / N).toFixed(1), kinds, misses };

    autoplay: (skill = 'good') => { if (game && state === 'play') { bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); botStart = true; } },
    skip: (s, pose = 'none') => skipTo(game.t + s, pose),
    freeze: (on = true) => { frozen = on; },
    ff: (on = true) => { ff = on; },
    // 画面の座標（Playwright で押すため）
    kidScreen: () => { const R = game.R, P = kidPose(R, game.t - R.t0); return scr(P.x, 0.78 - P.c * PH.DROP, R.kz); },
    headScreen: () => { const R = game.R, P = kidPose(R, game.t - R.t0); return scr(P.x, PH.HEAD_Y - P.c * PH.DROP, R.kz); },

  };
}
