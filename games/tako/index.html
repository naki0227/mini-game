<script type="module">
const $ = id => document.getElementById(id);
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import(THREE_URL);
} catch (e) {
  $('startBtn').textContent = '読み込めませんでした';
  $('loadErr').hidden = false;
  $('loadErr').textContent = '3Dの読み込みに失敗しました。通信状況を確かめて、ページを再読み込みしてください。';
  throw e;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
const FB = getComputedStyle(document.documentElement).getPropertyValue('--font-body');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const DEG = Math.PI / 180;
const HASH = new URLSearchParams(location.hash.slice(1));

/*PHYS-BEGIN*/
/* ---------- 凧の物理（three には頼らない。単位は m・秒・N・rad。判定は全部この結果から） ----------
   凧: 質点 + 平らな板。板の向きは「糸目（ブライドル）」で糸に対して決まる:
     b = 手から凧への向き（糸の向き）、u = b に直角でいちばん上を向く向き、s = 横。
     凧の頭の向き c' = cosψ·u + sinψ·s（ψ = 凧の回り。0 = 頭が真上）。
     板の法線 n = cosδ·b + sinδ·c'（糸目で板が少し前に倒れている）。
   風の力: 板に当たる見かけの風 va = 風 − 凧の速さ。法線力 Fn = ½ρA·CN·|va|·(va·n)（= CN·sinα の平板）、
     それに尾と骨の抗力（流れの向き）。Fn の b 成分は糸を引き、c' 成分が凧を頭の向きへ（ふつうは上へ）運ぶ。
   糸: 手もとと、ばね（伸び = 距離 − 糸の長さ、k = EA/長さ）＋減衰でつながる。距離が長さより短ければたるんで張力 0。
     糸の重さの半分を凧がささえる（糸を出すほど重い）。
   手: 押している = たぐる（糸の長さを毎秒 U_IN 縮める。たるんでいれば速く）。
       はなしている = 指をゆるめる（張力が TB をこえたぶんだけ糸がすべり出る。最大 U_OUT m/s）。
     たぐると見かけの風が強くなり、迎え角も増えて揚がる。出すと遠く長くなるが、張りが抜けると落ちていく。
   尾（安定）: ψ は ψ'' = −S·sinψ − 減衰·ψ' + 乱れ。S = KR·q·(1 − Fn/FC)。
     q = 見かけの風²（尾が効く）。Fn が FC（尾がおさえきれる力）をこえると S < 0 で、凧はくるっと回って頭から落ちる。
     引きすぎ・突風で力が大きすぎると回る（糸をゆるめて力を逃がせば立ち直る）。糸がたるむと尾しか効かない。
   風: 上ほど強い（べき 0.22）。ときどき突風・弱まり（seed で決まる）。突風は高いところほど強い。向きもゆっくり変わる。
   終わり: 凧が地面・川・電線・木・鉄橋にふれたら。記録は凧の最高の高さ。 */
const PDEG = Math.PI / 180;
const PH = {
  DT: 1 / 240, G: 9.81,
  HAND: { x: 0, y: 1.25, z: 0 },
  START: { x: 0, y: 1.9, z: -12 },     // 友だちが凧を持っている所
  M: 0.08, RA: 0.5 * 1.2 * 0.42,       // 凧の重さ kg、½ρA（凧 0.65m 角）
  DELTA: 20 * PDEG,                    // 糸目の角度
  CN: 1.25, CD: 0.07,                  // 平板の法線力係数、尾・骨の抗力
  K0: 900, ZETA: 0.6,                  // 糸の伸びにくさ EA（N）・減衰
  L0: 12, LMIN: 3, LMAX: 500,
  U_IN: 2.0, U_IN_SLACK: 3.5,          // たぐる速さ m/s
  TB: 0.9, CSLIP: 0.4, U_OUT: 10,       // ゆるめた指: 糸が出はじめる張力 N・すべりの重さ N/(m/s)・最大の速さ m/s
  MU: 0.0005,                          // 糸の重さ kg/m
  TBREAK: 40,                          // 糸が切れる張力 N
  KR: 0.4, FC: 11, CPSI: 0.7, C0: 0.6, // 尾の立て直し・尾がおさえきれる力 N・回りの減衰
  SIGP: 0.02, KS: 0.1,                 // 回りの乱れ・かじ（左右）
  SLACK_S: 0.1, SLACK_N: 60,           // 糸がたるんだときの立て直し（張っているときの何倍）・ひらひら
  W10: 6.5, WEXP: 0.18,                // 高さ 10m の風 m/s・上ほど強くなるべき
  HG: 45, GMAX: 2,                              // 突風が倍になる高さのめやす
  YCRASH: 0.25,
  TT: 1.0, TAUT_TAU: 0.35,             // 張りの目安（重さの何倍）・板が立つまでの時間
};
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { let u = r(); while (u < 1e-9) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
const clampP = (v, a, b) => Math.max(a, Math.min(b, v));

/* 河川敷の物（当たり判定）。凧は −z（川のほう）へ揚がる */
const WORLD = {
  river: [-95, -150],                                        // 川（z の範囲）
  wires: [],                                                 // 電線 { a:[x,y,z], b:[x,y,z], sag }
  trees: [],                                                 // 木の枝ぶり（球）[x, y, z, r]
  bridge: { x0: -122, x1: -110, z0: -160, z1: -85, y0: 7, y1: 18 },   // 鉄橋（トラス）
};
{
  // 河川敷の脇を通る電線（電柱 10m）
  const P = [[22, 15], [22, -20], [22, -55], [22, -90]];
  for (let i = 0; i < P.length - 1; i++) for (const [y, dx] of [[9.6, -0.5], [9.6, 0.5], [8.8, 0]]) WORLD.wires.push({ a: [P[i][0] + dx, y, P[i][1]], b: [P[i + 1][0] + dx, y, P[i + 1][1]], sag: 0.7 });
  // 川べりを横切る電線（10.5m）
  const Q = [[-70, -68], [-25, -68], [20, -68], [65, -68]];
  for (let i = 0; i < Q.length - 1; i++) for (const y of [10.5, 9.7]) WORLD.wires.push({ a: [Q[i][0], y, Q[i][1]], b: [Q[i + 1][0], y, Q[i + 1][1]], sag: 0.9 });
  WORLD.poles = [...P, ...Q];
  // 土手ぞいの桜（冬の枯れ木 12〜13m）
  for (const [x, z, h] of [[-24, -8, 12], [-27, -26, 13], [-25, -44, 12.5], [-29, -62, 12], [-34, 6, 11]]) { WORLD.trees.push([x, h - 4, z, 4.2], [x + 1.5, h - 1.8, z - 0.8, 2.6]); }
}
function distSeg(px, py, pz, a, b, sag) {
  const dx = b[0] - a[0], dz = b[2] - a[2], L2 = dx * dx + dz * dz;
  const k = clampP(((px - a[0]) * dx + (pz - a[2]) * dz) / L2, 0, 1);
  const x = a[0] + dx * k, z = a[2] + dz * k, y = a[1] + (b[1] - a[1]) * k - sag * Math.sin(Math.PI * k);
  return Math.hypot(px - x, py - y, pz - z);
}
// 凧がなにかにふれたか（ふれた物の名前）
function hitWorld(p) {
  if (p.y < 22) {
    for (const w of WORLD.wires) if (distSeg(p.x, p.y, p.z, w.a, w.b, w.sag) < 0.45) return 'wire';
    for (const [x, y, z, r] of WORLD.trees) { const d = Math.hypot(p.x - x, p.y - y, p.z - z); if (d < r) return 'tree'; }
    for (const [x, z] of WORLD.poles) if (Math.hypot(p.x - x, p.z - z) < 0.5 && p.y < 10.5) return 'wire';
    const B = WORLD.bridge;
    if (p.x > B.x0 && p.x < B.x1 && p.z > B.z0 && p.z < B.z1 && p.y > B.y0 - 1 && p.y < B.y1) return 'bridge';
  }
  if (p.y < PH.YCRASH) return p.z < WORLD.river[0] && p.z > WORLD.river[1] ? 'river' : 'ground';
  return null;
}

function makeSim(seed = 1) {
  const rnd = mulberry(seed);
  // 風のできごと（突風と弱まり）。はじめの 8 秒はおだやか
  const ev = [];
  for (let t = 6 + rnd() * 3; t < 3600;) {
    const lull = rnd() < 0.4, dur = lull ? 2.5 + rnd() * 3.5 : 1.2 + rnd() * 2.4;
    ev.push({ t0: t, dur, amp: lull ? -(0.25 + rnd() * 0.4) : 0.2 + rnd() * 0.55, lull });
    t += dur + 1.5 + rnd() * 6;
  }
  const ph = Array.from({ length: 6 }, () => rnd() * 6.283), dir0 = (rnd() - 0.5) * 0.2;
  const g = {
    seed, t: 0, phase: 'ready', ev, evi: 0,
    p: { ...PH.START }, v: { x: 0, y: 0, z: 0 },
    L: Math.hypot(PH.START.x - PH.HAND.x, PH.START.y - PH.HAND.y, PH.START.z - PH.HAND.z),
    psi: 0, dpsi: 0, T: 0, tautS: 1, ext: 0, pay: 0, Fn: 0, q: 0, alpha: 0, press: false, steer: 0,
    n: { x: 0, y: 0, z: 1 }, c: { x: 0, y: 1, z: 0 }, b: { x: 0, y: 0, z: -1 },
    maxH: PH.START.y, flyT: 0, end: null, queue: [], events: [],
    st: { spinT: 0, spins: 0, slackT: 0, overT: 0, pressT: 0, lowT: 0, maxL: 0, gustMax: 0 },
  };
  // 突風・弱まりの強さ（−1〜+）。y が高いほど突風は強い
  g.gustAt = (t, y) => {
    let i = g.evi; while (i > 0 && ev[i].t0 > t) i--; while (i < ev.length - 1 && ev[i].t0 + ev[i].dur < t) i++; g.evi = i;
    let a = 0.06 * Math.sin(0.7 * t + ph[0]) + 0.05 * Math.sin(1.9 * t + ph[1]) + 0.04 * Math.sin(0.23 * t + ph[2]);
    for (let j = Math.max(0, i - 1); j <= Math.min(ev.length - 1, i + 1); j++) {
      const e = ev[j], k = (t - e.t0) / e.dur;
      if (k > 0 && k < 1) { const s = Math.sin(Math.PI * k); a += e.amp * s * s * (e.lull ? 1 : 1 + Math.min(PH.GMAX, Math.max(0, y - 8) / PH.HG)); }
    }

  if (PULL_KEYS.includes(c)) { press(false, evTime(e)); return; }
  if (c === 'ArrowLeft' || c === 'KeyA') { keySteer.l = false; steer((keySteer.r ? 1 : 0) - (keySteer.l ? 1 : 0), evTime(e)); }
  if (c === 'ArrowRight' || c === 'KeyD') { keySteer.r = false; steer((keySteer.r ? 1 : 0) - (keySteer.l ? 1 : 0), evTime(e)); }
});
addEventListener('blur', () => { if (pointer || keySteer.l || keySteer.r) { pointer = null; keySteer.l = keySteer.r = false; press(false, performance.now()); steer(0, performance.now()); } });
$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('copyBtn').addEventListener('click', () => {
  const text = `${shareText(lastShare.h, lastShare.mark)} ${gameUrl()}`;
  const msg = $('copyMsg');
  const fallback = () => { msg.textContent = text; const r = document.createRange(); r.selectNodeContents(msg); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.userSelect = 'text'; };
  try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'コピーしました'; }, fallback); } catch { fallback(); }
});

/* ---------- 調整・検証用（#debug のときだけ） ---------- */
if (HASH.has('debug')) {
  const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(p * (s.length - 1))]; };
  // 記録した入力（時刻つき）を、fps コマ・lag 秒の遅れで物理に流しなおす（ゲームの advance と同じやり方）
  const replay = (log, seedR, fps, lag, quant) => {
    const g = makeSim(seedR); let i = 0, tNow = 0;
    while ((g.phase === 'ready' || g.phase === 'fly') && tNow < 900) {
      tNow += 1 / fps;
      while (i < log.length && log[i].t <= tNow) { g.input(quant ? tNow : log[i].t, log[i].kind, log[i].v); i++; }   // そのコマまでに届いた入力（quant: 時刻を使わずコマの時刻で効かせた場合）
      while (g.t + PH.DT <= tNow - lag && (g.phase === 'ready' || g.phase === 'fly')) { g.step(); g.events.length = 0; }
    }
    return { h: +g.maxH.toFixed(3), t: +g.flyT.toFixed(2), end: g.end && g.end.kind };
  };
  window.__tako = {
    info: () => game && ({ state, phase: game.phase, t: +game.t.toFixed(3), h: +game.p.y.toFixed(2), maxH: +game.maxH.toFixed(2), L: +game.L.toFixed(1), elevDeg: +(game.elev() / DEG).toFixed(1), T: +game.T.toFixed(2), Fn: +game.Fn.toFixed(2), psiDeg: +(game.psi / DEG).toFixed(0), press: game.press, pay: +game.pay.toFixed(2), x: +game.p.x.toFixed(1), z: +game.p.z.toFixed(1), wind: +game.windAt(game.t, game.p.y).m.toFixed(2), gust: +game.gustAt(game.t, game.p.y).toFixed(2), end: game.end, st: game.st, bot: !!bot, botStart, ff, frozen, rec, seed: game.seed, design: design.id }),
    // 物理だけでボットに N 回揚げさせる: sim('first', 100) → [最高の高さ m...]
    sim: (skill = 'good', N = 50, opts = {}) => Array.from({ length: N }, (_, i) => +runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts).h.toFixed(1)),
    stats: (skill = 'good', N = 100, opts = {}) => {
      const R = Array.from({ length: N }, (_, i) => runBot(SKILLS[skill], (opts.seed0 ?? 1000) + i, opts)), h = R.map(r => r.h), ends = {};
      for (const r of R) ends[r.end] = (ends[r.end] || 0) + 1;
      return { skill, N, p10: +q(h, 0.1).toFixed(1), p25: +q(h, 0.25).toFixed(1), p50: +q(h, 0.5).toFixed(1), p75: +q(h, 0.75).toFixed(1), p90: +q(h, 0.9).toFixed(1), min: +Math.min(...h).toFixed(1), max: +Math.max(...h).toFixed(1), ge5: R.filter(r => r.h >= 5).length / N, ge15: R.filter(r => r.h >= 15).length / N, ge80: R.filter(r => r.h >= 80).length / N, fly50: +q(R.map(r => r.t), 0.5).toFixed(1), line50: +q(R.map(r => r.L), 0.5).toFixed(0), ends };
    },
    // ボットの入力の列（時刻つき）を記録して、30fps・60fps・144fps のコマ割りで流しなおす。lag = 物理の遅れ（ゲームは 0.04 秒以上）
    fpsCheck: (seedR = 4242, skill = 'first', lag = 0.05) => {
      const r = runBot(SKILLS[skill], seedR, { log: true });
      return { live: { h: +r.h.toFixed(3), t: +r.t.toFixed(2), end: r.end }, fps30: replay(r.log, seedR, 30, lag), fps60: replay(r.log, seedR, 60, lag), fps144: replay(r.log, seedR, 144, lag), fps30frameQuantized: replay(r.log, seedR, 30, lag, true), fps60frameQuantized: replay(r.log, seedR, 60, lag, true), inputs: r.log.length };
    },
    // いまのプレイをボットに任せる
    autoplay: (skill = 'good') => { if (game && state === 'play') bot = makeBot(game, SKILLS[skill], mulberry(nextSeed())); },
    skip: s => skipTo(game.t + s),
    ff: (on = true) => { ff = on; },
    freeze: (on = true) => { frozen = on; },
    kiteScreen: () => project(game.p.x, game.p.y, game.p.z),
    design: i => setDesign(i),
    cam: () => ({ pos: camera.position.toArray().map(v => +v.toFixed(2)), fov: +camera.fov.toFixed(1), pitch: +(camPitch / DEG).toFixed(1) }),
    gl: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
    PH, SKILLS, MARKS, WORLD, makeSim, makeBot, runBot, game: () => game,
  };
}

try { await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`, '0123456789.m龍寿大押して、たぐる！くるっ自己ベスト更新' + MARKS.map(m => m.pop).join('')), document.fonts.load(`700 16px "Zen Kaku Gothic New"`, '最高糸風突風！が弱まった手ごたえ▼▲をすたぐる出すくるはなして立て直すたるんでる押引上げ強い逃切れる電線木近い友だちが凧早送りベストm/s（）＝／下がってきたらぐんと引かれた' + MARKS.map(m => m.name).join(''))]), new Promise(r => setTimeout(r, 1500))]); } catch {}
